# Remediación · Renovar certificado (Demo 5 · monitoreo). Lo lanza EDA cuando Prometheus avisa que el
# certificado TLS de Nginx vence en menos de 15 días. Riesgo bajo: sin aprobación y sin corte (reload).
- name: Remediación · Certificado TLS por vencer
  hosts: nodo-nginx
  gather_facts: false
  become: true
  vars:
    crt: /etc/pki/nginx/summit.crt
    key: /etc/pki/nginx/private/summit.key
    dias: 90
  tasks:
    - name: Renovar el certificado
      block:
        - name: Vencimiento actual
          ansible.builtin.command: "openssl x509 -in {{ crt }} -noout -enddate"
          register: r_antes
          changed_when: false

        - name: Odoo · abrir ticket
          ansible.builtin.include_tasks: tareas/odoo_ticket.yml
          vars:
            odoo_accion: abrir
            odoo_alerta: CertificadoPorVencer
            odoo_detalle: >-
              {{ alerta_resumen | default('Certificado TLS por vencer') }}. Prometheus detectó que el certificado HTTPS
              de la aplicación vence pronto ({{ r_antes.stdout | regex_replace('^notAfter=', '') }}).

        - name: Generar el certificado nuevo ({{ dias }} días)
          ansible.builtin.command: >-
            openssl req -x509 -newkey rsa:2048 -nodes -days {{ dias }} -subj "/CN=app.summit.lab"
            -keyout {{ key }}.nuevo -out {{ crt }}.nuevo
          changed_when: true

        - name: Respaldar el anterior y activar el nuevo
          ansible.builtin.shell: |
            cp -p {{ crt }} {{ crt }}.anterior && cp -p {{ key }} {{ key }}.anterior
            mv -f {{ crt }}.nuevo {{ crt }} && mv -f {{ key }}.nuevo {{ key }}
            chmod 600 {{ key }}; restorecon {{ crt }} {{ key }} 2>/dev/null || true

        - name: Validar la configuración y recargar Nginx (sin corte)
          ansible.builtin.shell: nginx -t -q && systemctl reload nginx
          register: r_reload

        - name: Verificar el certificado que entrega el servicio
          ansible.builtin.shell: "echo | openssl s_client -connect 127.0.0.1:443 2>/dev/null | openssl x509 -noout -enddate"
          register: r_despues
          until: r_despues.stdout != r_antes.stdout
          retries: 5
          delay: 2
          changed_when: false

        - name: Odoo · cerrar ticket
          ansible.builtin.include_tasks: tareas/odoo_ticket.yml
          vars:
            odoo_accion: cerrar
            odoo_nota: >-
              Acción: se generó un certificado nuevo de {{ dias }} días (respaldo del anterior en {{ crt }}.anterior)
              y se recargó Nginx sin corte (nginx -t y systemctl reload nginx).
              Verificación: el servicio en 127.0.0.1:443 entrega el certificado nuevo; antes vencía el
              {{ r_antes.stdout | regex_replace('^notAfter=', '') }}, ahora vence el {{ r_despues.stdout | regex_replace('^notAfter=', '') }}.
      rescue:
        - name: Volver al certificado anterior
          ansible.builtin.shell: |
            [ -f {{ crt }}.anterior ] && cp -p {{ crt }}.anterior {{ crt }} && cp -p {{ key }}.anterior {{ key }} && systemctl reload nginx
          failed_when: false
        - name: Odoo · dejar el ticket abierto con el error
          ansible.builtin.include_tasks: tareas/odoo_ticket.yml
          vars:
            odoo_accion: escalar
            odoo_nota: "{{ ansible_failed_result.msg | default('no se pudo renovar el certificado', true) }} (se dejó el certificado anterior)"
        - name: No se pudo renovar
          ansible.builtin.fail:
            msg: "No se pudo renovar el certificado: el ticket de Odoo queda abierto"
