# Remediación · IIS en Windows (Demo 5 · monitoreo). Lo lanza EDA cuando Prometheus (blackbox) ve que el sitio
# de nodo-windows no responde. Riesgo bajo: sin aprobación. Abre y resuelve un incidente en ServiceNow con la evidencia.
- name: Remediación · Sitio IIS caído en Windows
  hosts: nodo-windows
  gather_facts: false
  tasks:
    - name: Reparar
      block:
        - name: Estado del servicio IIS (W3SVC)
          ansible.windows.win_service_info:
            name: W3SVC
          register: r_antes

        - name: ServiceNow · abrir incidente
          ansible.builtin.include_tasks: tareas/snow_incidente.yml
          vars:
            inc_accion: abrir
            inc_producto: Windows
            inc_titulo: "El sitio web de nodo-windows no responde (IIS {{ r_antes.services[0].state | default('desconocido') }})"
            inc_detalle: >-
              Prometheus detectó que el sitio web de nodo-windows (Windows Server 2022 · IIS) dejó de responder.
              El servicio IIS está {{ r_antes.services[0].state | default('desconocido') }}. Ansible lo levanta automáticamente.

        - name: Levantar IIS y dejarlo en inicio automático
          ansible.windows.win_service:
            name: W3SVC
            start_mode: auto
            state: started

        - name: Verificar que el sitio responde
          ansible.windows.win_uri:
            url: http://localhost/
            return_content: true
          register: r_web
          until: r_web.status_code == 200
          retries: 6
          delay: 3

        - name: ServiceNow · resolver incidente
          ansible.builtin.include_tasks: tareas/snow_incidente.yml
          vars:
            inc_accion: resolver
            inc_cierre: >-
              Resuelto automáticamente: el sitio web de nodo-windows volvió a responder. El servicio IIS estaba
              {{ r_antes.services[0].state | default('detenido') }} y se levantó; quedó en inicio automático.
            inc_tecnico: >-
              nodo-windows: W3SVC {{ r_antes.services[0].state | default('?') }} (inicio {{ r_antes.services[0].start_mode | default('?') }})
              → running (auto) con ansible.windows.win_service. Verificado con win_uri http://localhost/ → {{ r_web.status_code }}.
      rescue:
        - name: ServiceNow · escalar
          ansible.builtin.include_tasks: tareas/snow_incidente.yml
          vars:
            inc_accion: escalar
            inc_tecnico: "{{ ansible_failed_result.msg | default('no se pudo levantar IIS') }}"
        - name: No se pudo reparar
          ansible.builtin.fail:
            msg: "IIS no se pudo levantar: queda escalado en ServiceNow"
