# Remediación · IIS en Windows (Demo 5 · monitoreo). Lo lanza EDA cuando Prometheus (blackbox) ve que el sitio
# de nodo-windows no responde. Riesgo bajo: sin aprobación. Abre y cierra un ticket en Odoo con la evidencia.
- name: Remediación · Sitio IIS caído en Windows
  hosts: nodo-windows
  gather_facts: false
  tasks:
    - name: Reparar
      block:
        - name: Estado del servicio IIS (W3SVC)
          ansible.windows.win_service_info:
            name: W3SVC
          register: r_antes

        - name: Odoo · abrir ticket
          ansible.builtin.include_tasks: tareas/odoo_ticket.yml
          vars:
            odoo_accion: abrir
            odoo_alerta: SitioWindowsCaido
            odoo_detalle: >-
              {{ alerta_resumen | default('Sitio IIS de Windows caído') }}. Prometheus detectó que el sitio web de nodo-windows
              (Windows Server 2022 · IIS) no responde; el servicio IIS (W3SVC) está {{ r_antes.services[0].state | default('desconocido') }}.

        - name: Levantar IIS y dejarlo en inicio automático
          ansible.windows.win_service:
            name: W3SVC
            start_mode: auto
            state: started

        - name: Verificar que el sitio responde
          ansible.windows.win_uri:
            url: http://localhost/
            return_content: true
          register: r_web
          until: r_web.status_code == 200
          retries: 6
          delay: 3

        - name: Odoo · cerrar ticket
          ansible.builtin.include_tasks: tareas/odoo_ticket.yml
          vars:
            odoo_accion: cerrar
            odoo_nota: >-
              Acción: el servicio IIS (W3SVC) estaba {{ r_antes.services[0].state | default('detenido') }}; se levantó y quedó en
              inicio automático. Verificación: http://localhost/ en nodo-windows responde {{ r_web.status_code }}.
      rescue:
        - name: Odoo · dejar el ticket abierto con el error
          ansible.builtin.include_tasks: tareas/odoo_ticket.yml
          vars:
            odoo_accion: escalar
            odoo_nota: "{{ ansible_failed_result.msg | default('no se pudo levantar IIS', true) }}"
        - name: No se pudo reparar
          ansible.builtin.fail:
            msg: "IIS no se pudo levantar: el ticket de Odoo queda abierto"
