# Remediación · Cola de pagos (Demo 5 · monitoreo). Lo lanza EDA cuando Prometheus/Alertmanager avisa que
# la cola pagos.entrada acumula mensajes. Riesgo bajo: sin aprobación.
#   1) ticket en Odoo  2) diagnóstico: ¿está vivo el consumidor?  3) lo reactiva  4) espera que la cola baje
- name: Remediación · Cola de pagos acumulada
  hosts: nodo-tomcat
  gather_facts: false
  become: true
  vars:
    cola: "{{ alerta_cola | default('pagos.entrada') }}"
    stat_cmd: >-
      podman exec artemis sh -c '/var/lib/artemis-instance/bin/artemis queue stat --user "$ARTEMIS_USER"
      --password "$ARTEMIS_PASSWORD" --url tcp://localhost:61616 --queueName {{ cola }} 2>/dev/null'
  tasks:
    - name: Remediar la cola
      block:
        - name: Mensajes pendientes al llegar
          ansible.builtin.shell: "{{ stat_cmd }} | awk -F'|' '$2 ~ /{{ cola }}/ {gsub(/ /,\"\",$5); print $5}'"
          register: r_antes
          changed_when: false

        - name: Odoo · abrir ticket
          ansible.builtin.include_tasks: tareas/odoo_ticket.yml
          vars:
            odoo_accion: abrir
            odoo_alerta: ColaPagosAcumulada (cola {{ cola }})
            odoo_detalle: >-
              {{ alerta_resumen | default('Cola ' ~ cola ~ ' acumulando mensajes') }}. Prometheus detectó
              {{ r_antes.stdout | default('?') }} pagos sin procesar en la cola {{ cola }} (umbral: 100).

        - name: Diagnóstico · estado del consumidor de pagos
          ansible.builtin.systemd_service:
            name: consumidor-pagos
          register: r_cons

        - name: Diagnóstico
          ansible.builtin.debug:
            msg: "consumidor-pagos: {{ r_cons.status.ActiveState }} · cola {{ cola }}: {{ r_antes.stdout }} mensajes"

        - name: Reactivar el consumidor de pagos
          ansible.builtin.systemd_service:
            name: consumidor-pagos
            state: "{{ 'started' if r_cons.status.ActiveState != 'active' else 'restarted' }}"

        - name: Esperar a que la cola se vacíe
          ansible.builtin.shell: "{{ stat_cmd }} | awk -F'|' '$2 ~ /{{ cola }}/ {gsub(/ /,\"\",$5); print $5}'"
          register: r_despues
          until: (r_despues.stdout | int) < 10
          retries: 40
          delay: 5
          changed_when: false

        - name: Odoo · cerrar ticket
          ansible.builtin.include_tasks: tareas/odoo_ticket.yml
          vars:
            odoo_accion: cerrar
            odoo_nota: >-
              Acción: el consumidor de pagos estaba {{ r_cons.status.ActiveState }}; se ejecutó
              systemctl {{ 'start' if r_cons.status.ActiveState != 'active' else 'restart' }} consumidor-pagos en nodo-tomcat.
              Verificación: la cola {{ cola }} bajó de {{ r_antes.stdout }} a {{ r_despues.stdout }} mensajes pendientes.
      rescue:
        - name: Odoo · dejar el ticket abierto con el error
          ansible.builtin.include_tasks: tareas/odoo_ticket.yml
          vars:
            odoo_accion: escalar
            odoo_nota: "{{ ansible_failed_result.msg | default('la cola no bajó', true) }}"
        - name: No se pudo resolver solo
          ansible.builtin.fail:
            msg: "La cola {{ cola }} no bajó: el ticket de Odoo queda abierto"
