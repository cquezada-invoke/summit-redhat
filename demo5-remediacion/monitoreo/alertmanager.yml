# Alertmanager: todas las alertas van a Event-Driven Ansible (activación "Monitoreo · Alertas").
route:
  receiver: eda
  group_by: [alertname, cola, instance, ip]
  group_wait: 5s
  group_interval: 30s
  repeat_interval: 30m
receivers:
  - name: eda
    webhook_configs:
      - url: http://127.0.0.1:5004/alerts
        send_resolved: true
