# Reglas de alerta. Alertmanager las entrega a Event-Driven Ansible (fuente ansible.eda.alertmanager).
groups:
  - name: summit-operacion
    rules:
      - alert: ColaPagosAcumulada
        expr: artemis_cola_mensajes{cola="pagos.entrada"} > 100
        for: 20s
        labels: {severidad: alta, producto: "AMQ Broker (Artemis)", caso: cola}
        annotations:
          resumen: "La cola {{ $labels.cola }} acumula {{ $value }} mensajes sin procesar"
      - alert: CertificadoPorVencer
        expr: (probe_ssl_earliest_cert_expiry{job="certificados"} - time()) / 86400 < 15
        for: 10s
        labels: {severidad: alta, producto: Nginx, caso: certificado}
        annotations:
          resumen: "El certificado TLS de {{ $labels.instance }} vence en {{ $value | printf \"%.1f\" }} días"
      - alert: SitioWindowsCaido
        expr: probe_success{job="sitios-windows"} == 0
        for: 20s
        labels: {severidad: alta, producto: "Windows · IIS", caso: windows}
        annotations:
          resumen: "El sitio web de {{ $labels.instance }} no responde"
      # Seguridad: logins fallidos en Keycloak por IP en el último minuto (métrica publicada en nodo-tomcat).
      - alert: LoginsFallidosKeycloak
        expr: keycloak_logins_fallidos_ultimo_minuto > 20
        for: 0s
        labels: {severidad: alta, producto: Keycloak, caso: seguridad}
        annotations:
          resumen: "{{ $value }} logins fallidos en Keycloak desde {{ $labels.ip }} en 1 minuto"
  # Estado de cada máquina (job "servidores"). Llegan a EDA como las demás; hoy solo se registran
  # (el caso "disco lleno de logs" de la Demo 5 sigue con su vigía en nodo-jboss).
  - name: summit-servidores
    rules:
      - alert: ServidorCaido
        expr: up{job="servidores"} == 0
        for: 1m
        labels: {severidad: critica, caso: servidor}
        annotations:
          resumen: "{{ $labels.nombre }} no responde"
      - alert: DiscoCasiLleno
        expr: |
          (1 - node_filesystem_avail_bytes{job="servidores",fstype!~"tmpfs|devtmpfs|overlay|squashfs"}
               / node_filesystem_size_bytes{job="servidores",fstype!~"tmpfs|devtmpfs|overlay|squashfs"}) * 100 > 85
          or (1 - windows_logical_disk_free_bytes{job="servidores",volume!~"HarddiskVolume.*"}
               / windows_logical_disk_size_bytes{job="servidores",volume!~"HarddiskVolume.*"}) * 100 > 85
        for: 2m
        labels: {severidad: alta, caso: disco}
        annotations:
          resumen: "Disco de {{ $labels.nombre }} al {{ $value | printf \"%.0f\" }}%"
      - alert: MemoriaAlta
        expr: |
          (1 - node_memory_MemAvailable_bytes{job="servidores"} / node_memory_MemTotal_bytes{job="servidores"}) * 100 > 90
          or (1 - windows_os_physical_memory_free_bytes{job="servidores"} / windows_cs_physical_memory_bytes{job="servidores"}) * 100 > 90
        for: 5m
        labels: {severidad: alta, caso: memoria}
        annotations:
          resumen: "Memoria de {{ $labels.nombre }} al {{ $value | printf \"%.0f\" }}%"
      - alert: CPUAlta
        expr: |
          (1 - avg by (nombre, instance) (rate(node_cpu_seconds_total{job="servidores",mode="idle"}[5m]))) * 100 > 90
          or (1 - avg by (nombre, instance) (rate(windows_cpu_time_total{job="servidores",mode="idle"}[5m]))) * 100 > 90
        for: 5m
        labels: {severidad: alta, caso: cpu}
        annotations:
          resumen: "CPU de {{ $labels.nombre }} al {{ $value | printf \"%.0f\" }}%"
  # Estado de cada componente del ecosistema (tablero "Summit · Ecosistema"). Llegan a EDA y quedan registradas;
  # no lanzan correcciones automáticas.
  - name: summit-componentes
    rules:
      - alert: ComponenteCaido
        expr: probe_success{job=~"componentes-.*"} == 0
        for: 2m
        labels: {severidad: alta, caso: componente}
        annotations:
          resumen: "{{ $labels.componente }} ({{ $labels.demo }}) no responde"
      - alert: ActivacionEDACaida
        expr: summit_eda_activacion == 0
        for: 2m
        labels: {severidad: alta, caso: componente, componente: "EDA"}
        annotations:
          resumen: "La activación de EDA «{{ $labels.nombre }}» no está corriendo"
      - alert: LaboratorioRedCaido
        expr: summit_contenedor == 0 or summit_bgp_establecido == 0 or summit_firewall_base == 0
        for: 2m
        labels: {severidad: alta, caso: componente, componente: "Laboratorio de red"}
        annotations:
          resumen: "Laboratorio de red (Demo 4) con problemas: {{ $labels.nombre }}{{ $labels.router }}"
      - alert: VigiaCaido
        expr: node_systemd_unit_state{name=~"vigia.*[.]service|vigia-servicenow[.]service", state="active"} == 0
        for: 2m
        labels: {severidad: alta, caso: componente, componente: "Vigía"}
        annotations:
          resumen: "El vigía {{ $labels.name }} no está activo en {{ $labels.nombre }}"
