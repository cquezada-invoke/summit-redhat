# Restablece el estándar de sistema operativo y reporta el resultado al panel de cumplimiento.
# Con modo=alertar se ejecuta en modo revisión (--check): detecta y reporta, sin corregir.
- name: Estándar de sistema operativo
  hosts: "{{ objetivo | default('nodos') }}"
  become: true
  gather_facts: false
  diff: true

  tasks:
    - name: Política de gestión registrada en el servidor
      ansible.builtin.slurp:
        src: /etc/invoke-gestion.json
      register: r_gestion
      failed_when: false

    # El archivo completo vive en Git (demo-summit-repo/drift/files/sshd_config.j2)
    - name: sshd_config idéntico al de Git
      ansible.builtin.template:
        src: files/sshd_config.j2
        dest: /etc/ssh/sshd_config
        owner: root
        group: root
        mode: "0600"
        backup: true
        validate: sshd -t -f %s
      vars:
        gestion: "{{ (r_gestion.content | b64decode | from_json) if r_gestion.content is defined else {} }}"
        visitantes_ssh: "{{ 'ninguno' if not gestion else ('permitido' if gestion.visitantes_permitidos | bool else 'denegado') }}"
      notify: Recargar sshd
      register: r_sshd

    - name: Buscar permisos sudo
      ansible.builtin.find:
        paths: /etc/sudoers.d
        hidden: true
      register: sudoers

    - name: Contenido de sudo no autorizado
      ansible.builtin.slurp:
        src: "{{ item.path }}"
      loop: "{{ sudoers.files }}"
      loop_control:
        label: "{{ item.path | basename }}"
      when: (item.path | basename) not in sudo_autorizados
      register: r_contenido

    - name: Quitar sudo no autorizado
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ sudoers.files }}"
      loop_control:
        label: "{{ item.path | basename }}"
      when: (item.path | basename) not in sudo_autorizados
      register: r_sudo

    - name: Aplicar recarga pendiente de sshd
      ansible.builtin.meta: flush_handlers

    - name: Reportar resultado al panel
      ansible.builtin.uri:
        url: "{{ panel_url }}/api/estado"
        method: POST
        body_format: json
        body:
          id: "{{ incidente_id }}"
          modo: "{{ modo | default('corregir') }}"
          correcciones: >-
            {{ ([txt_sshd] if r_sshd is changed else [])
             + (r_sudo.results | selectattr('changed', 'defined') | selectattr('changed') | map(attribute='item.path')
                | map('regex_replace', '^(.*)$', txt_sudo) | list) }}
          cambios: "{{ sshd_diffs + sudo_diffs }}"
      vars:
        alertar: "{{ modo | default('corregir') == 'alertar' }}"
        txt_sshd: "{{ 'sshd_config difiere de Git (no corregido, solo alerta)' if alertar else 'sshd_config restablecido: quedó idéntico a Git' }}"
        sshd_diffs: >-
          {% set out = [] %}{% if r_sshd is changed %}{% set ds = r_sshd.diff | default([]) %}{% for d in (ds if ds is not mapping else [ds]) %}{% set _ = out.append({'before': d.before | default(''), 'after': d.after | default(''), 'before_header': '/etc/ssh/sshd_config (en el servidor)', 'after_header': 'sshd_config.j2 (en Git)'}) %}{% endfor %}{% endif %}{{ out }}
        txt_sudo: "{{ 'Permiso sudo no autorizado detectado (no corregido, solo alerta): \\1' if alertar else 'Permiso sudo no autorizado eliminado: \\1' }}"
        sudo_diffs: >-
          {% set out = [] %}{% for r in r_contenido.results if r.content is defined %}{% set _ = out.append({'before': r.content | b64decode, 'after': '', 'before_header': r.source, 'after_header': r.source ~ ' (eliminado)'}) %}{% endfor %}{{ out }}
      delegate_to: localhost
      become: false
      check_mode: false
      when: incidente_id is defined

  handlers:
    - name: Recargar sshd
      ansible.builtin.service:
        name: sshd
        state: reloaded
