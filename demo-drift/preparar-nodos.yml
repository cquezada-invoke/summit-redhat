# Prepara los nodos para la demo: personas con su llave, auditoría de archivos y vigía.
- name: Preparar nodos de la demo de cumplimiento
  hosts: nodos
  become: true
  gather_facts: false
  vars_files:
    - rutas_controladas.yml

  tasks:
    - name: Rutas controladas (deben existir antes de vigilarlas)
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop: >-
        {% set o = [] %}{% for r, l in rutas_controladas.items() %}{% set _ = o.append(r) %}{% for n in l %}{% set _ = o.append(r ~ '/' ~ n) %}{% endfor %}{% endfor %}{{ o }}

    - name: Personas de la demo
      ansible.builtin.user:
        name: "{{ item }}"
        groups: wheel
      loop: "{{ usuarios_demo }}"

    - name: Carpeta SSH de cada persona
      ansible.builtin.file:
        path: "/home/{{ item }}/.ssh"
        state: directory
        owner: "{{ item }}"
        mode: "0700"
      loop: "{{ usuarios_demo }}"

    - name: Llave SSH de cada persona
      ansible.builtin.copy:
        src: "{{ lookup('env', 'HOME') }}/.ssh/id_{{ item }}.pub"
        dest: "/home/{{ item }}/.ssh/authorized_keys"
        owner: "{{ item }}"
        mode: "0600"
      loop: "{{ usuarios_demo }}"

    - name: Sudo para las personas de la demo
      ansible.builtin.copy:
        dest: /etc/sudoers.d/admins
        content: "{% for u in usuarios_demo %}{{ u }} ALL=(ALL) NOPASSWD:ALL\n{% endfor %}"
        mode: "0440"
        validate: visudo -cf %s

    - name: Reglas de auditoría de archivos vigilados
      ansible.builtin.copy:
        src: files/drift.rules
        dest: /etc/audit/rules.d/drift.rules
        mode: "0600"
      register: reglas

    - name: Usuario de automatización (se excluye del registro de comandos)
      ansible.builtin.getent:
        database: passwd
        key: ansible

    # Registra cada comando de las personas (auid), aunque usen sudo; excluye la automatización
    - name: Regla de auditoría de comandos
      ansible.builtin.copy:
        dest: /etc/audit/rules.d/comandos.rules
        mode: "0600"
        content: |
          ## Comandos ejecutados por personas (Demo 1)
          -a always,exit -F arch=b64 -S execve -F auid>=1000 -F auid!=4294967295 -F auid!={{ getent_passwd.ansible[1] }} -k comandos
      register: reglas_cmd

    # augenrules no tiene módulo equivalente: carga las reglas en el kernel
    - name: Cargar reglas de auditoría
      ansible.builtin.command: augenrules --load
      when: reglas.changed or reglas_cmd.changed

    - name: Vigía
      ansible.builtin.copy:
        src: "files/{{ item.src }}"
        dest: "{{ item.dest }}"
        mode: "{{ item.mode }}"
      loop:
        - {src: vigia.py, dest: /usr/local/bin/vigia.py, mode: "0755"}
        - {src: vigia.service, dest: /etc/systemd/system/vigia.service, mode: "0644"}
      register: vigia

    - name: Vigía activo
      ansible.builtin.systemd_service:
        name: vigia
        state: "{{ 'restarted' if vigia.changed else 'started' }}"
        enabled: true
        daemon_reload: true
