apiVersion: apps/v1
kind: Deployment
metadata: {name: consola, namespace: demo-datalake, labels: {app: consola}}
spec:
  replicas: 1
  selector: {matchLabels: {app: consola}}
  template:
    metadata: {labels: {app: consola}}
    spec:
      containers:
        - name: consola
          image: registry.access.redhat.com/ubi9/python-311:latest
          command: [bash, -c, "pip install -q --no-cache-dir flask==3.0.3 gunicorn==22.0.0 requests && cd /consola && exec gunicorn -b 0.0.0.0:8080 -w 1 --threads 4 consola:app"]
          ports: [{containerPort: 8080}]
          resources: {requests: {cpu: 10m, memory: 64Mi}, limits: {cpu: 500m, memory: 256Mi}}
          readinessProbe: {httpGet: {path: /salud, port: 8080}, periodSeconds: 10, initialDelaySeconds: 20}
          volumeMounts: [{name: codigo, mountPath: /consola}]
      volumes: [{name: codigo, configMap: {name: consola}}]
---
apiVersion: v1
kind: Service
metadata: {name: consola, namespace: demo-datalake}
spec: {selector: {app: consola}, ports: [{port: 8080}]}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata: {name: consola, namespace: demo-datalake}
spec:
  host: sql-lake.sno.34.176.42.56.sslip.io
  to: {kind: Service, name: consola}
  tls: {termination: edge, insecureEdgeTerminationPolicy: Redirect}
