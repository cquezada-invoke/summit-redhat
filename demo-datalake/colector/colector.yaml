apiVersion: image.openshift.io/v1
kind: ImageStream
metadata: {name: colector, namespace: demo-datalake}
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata: {name: colector, namespace: demo-datalake}
spec:
  source: {type: Binary}
  strategy: {type: Docker, dockerStrategy: {dockerfilePath: Containerfile}}
  output: {to: {kind: ImageStreamTag, name: "colector:latest"}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: colector
  namespace: demo-datalake
  labels: {app.kubernetes.io/name: colector, app.kubernetes.io/part-of: demo-datalake}
  annotations: {image.openshift.io/triggers: '[{"from":{"kind":"ImageStreamTag","name":"colector:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"app\")].image"}]'}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: colector}}
  template:
    metadata: {labels: {app: colector}}
    spec:
      containers:
        - name: app
          image: colector:latest
          ports: [{containerPort: 8080}]
          env: [{name: S3_URL, value: "http://minio:9000"}, {name: TRINO_URL, value: "http://trino:8080"}]
          readinessProbe: {httpGet: {path: /salud, port: 8080}}
          resources: {requests: {cpu: 50m, memory: 96Mi}, limits: {cpu: 500m, memory: 256Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: colector, namespace: demo-datalake}
spec:
  type: NodePort
  selector: {app: colector}
  ports: [{port: 8080, targetPort: 8080, nodePort: 30480}]
---
apiVersion: route.openshift.io/v1
kind: Route
metadata: {name: colector, namespace: demo-datalake}
spec:
  host: colector-lake.sno.34.176.42.56.sslip.io
  to: {kind: Service, name: colector}
  tls: {termination: edge, insecureEdgeTerminationPolicy: Redirect}
