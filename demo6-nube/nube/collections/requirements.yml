# Colecciones que AAP descarga al sincronizar el proyecto "Nube · GCP".
#   google.cloud      → máquinas, discos, IPs, snapshots y reglas de firewall en GCP; inventario dinámico gcp_compute
#   ansible.posix     → firewalld en las VMs nuevas
#   community.general → utilidades (dict)
collections:
  - name: google.cloud
  - name: ansible.posix
  - name: community.general
