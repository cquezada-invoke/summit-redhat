# ServiceNow para la Demo 6 (nube). Ticket del usuario (RITM) e incidentes.
#   snow_accion: tomar | aprobacion | listo | rechazar | error   (sobre snow_ritm_sys_id)
#   snow_accion: incidente  → crea un incidente (snow_inc_titulo, snow_inc_texto, snow_inc_notas, snow_inc_resuelto)
# Textos al usuario en lenguaje simple; el detalle técnico va en notas internas (work_notes).
- name: ServiceNow · {{ snow_accion }}
  delegate_to: localhost
  run_once: true
  become: false
  vars:
    _api: "{{ (sn_instancia | default('')) | regex_replace('/+$', '') }}/api/now/table"
    _job: "https://34.176.42.56/execution/jobs/playbook/{{ awx_job_id | default(tower_job_id | default('0')) }}/output"
    _sn: &sn
      user: "{{ sn_usuario }}"
      password: "{{ sn_clave }}"
      force_basic_auth: true
      headers: {Accept: application/json}
      timeout: 30
    _cierre: "{{ snow_accion in ['listo', 'rechazar', 'error'] }}"
    _estado: "{{ {'listo': '3', 'rechazar': '4', 'error': '4'}[snow_accion] | default('2') }}"
  block:
    - name: ServiceNow · actualizar el ticket
      ansible.builtin.uri:
        url: "{{ _api }}/sc_req_item/{{ snow_ritm_sys_id }}"
        method: PATCH
        body_format: json
        body: >-
          {{ {'state': _estado,
              'comments': snow_usuario | default(omit),
              'work_notes': (snow_notas | default('')) ~ ' · Job: ' ~ _job}
             | combine({'close_notes': snow_usuario | default('')} if _cierre | bool else {}) }}
        <<: *sn
      no_log: true
      when: snow_accion != 'incidente' and snow_ritm_sys_id | default('') | length > 0

    - name: ServiceNow · cerrar las tareas del flujo del catálogo (por rondas)
      ansible.builtin.include_tasks: snow_sctask.yml
      loop: [1, 2, 3, 4]
      loop_control: {loop_var: ronda}
      when: _cierre | bool and snow_ritm_sys_id | default('') | length > 0

    - name: ServiceNow · solicitud (REQ)
      ansible.builtin.uri:
        url: "{{ _api }}/sc_req_item/{{ snow_ritm_sys_id }}?sysparm_fields=request"
        <<: *sn
      register: _req
      no_log: true
      when: _cierre | bool and snow_ritm_sys_id | default('') | length > 0

    - name: ServiceNow · cerrar la solicitud (REQ)
      ansible.builtin.uri:
        url: "{{ _api }}/sc_request/{{ _req.json.result.request.value }}"
        method: PATCH
        body_format: json
        body: {request_state: "{{ 'closed_complete' if snow_accion == 'listo' else 'closed_incomplete' }}", state: "{{ _estado }}"}
        <<: *sn
      no_log: true
      when: _cierre | bool and snow_ritm_sys_id | default('') | length > 0

    - name: ServiceNow · grupo Automatización Ansible
      ansible.builtin.uri:
        url: "{{ _api }}/sys_user_group?sysparm_query=name=Automatizaci%C3%B3n%20Ansible&sysparm_fields=sys_id&sysparm_limit=1"
        <<: *sn
      register: _grupo
      no_log: true
      when: snow_accion == 'incidente'

    - name: ServiceNow · incidente
      ansible.builtin.uri:
        url: "{{ _api }}/incident"
        method: POST
        body_format: json
        status_code: 201
        body: >-
          {{ {'short_description': snow_inc_titulo, 'description': snow_inc_texto, 'category': 'software',
              'impact': '2', 'urgency': '2', 'state': '6' if snow_inc_resuelto | default(false) | bool else '2',
              'assignment_group': _grupo.json.result[0].sys_id | default(''),
              'work_notes': (snow_inc_notas | default('')) ~ ' · Job: ' ~ _job}
             | combine({'close_code': 'Solution provided', 'close_notes': snow_inc_texto} if snow_inc_resuelto | default(false) | bool else {}) }}
        <<: *sn
      register: snow_inc
      no_log: true
      when: snow_accion == 'incidente'

    - name: Incidente creado
      ansible.builtin.debug:
        msg: "{{ snow_inc.json.result.number }} · {{ snow_inc_titulo }}"
      when: snow_accion == 'incidente'
  rescue:
    - name: ServiceNow no respondió (la automatización sigue)
      ansible.builtin.debug:
        msg: "Aviso: ServiceNow no respondió ({{ ansible_failed_result.msg | default('sin detalle') }})."
