# Actualiza el manifiesto de un ambiente (Gitea invoke/ambientes, archivo <ambiente>.yml) con un commit; si no existe, lo crea.
# Entradas: manifiesto_cambio (dict a combinar), manifiesto_mensaje, manifiesto_ambiente (o ambiente; por defecto produccion),
# manifiesto_servidores (opcional: servidores que se agregan al manifiesto).
# Credencial "Gitea · escritura jboss-config y ambientes" (gitea_url, gitea_token).
- name: Manifiesto · ambiente
  ansible.builtin.set_fact:
    _man_amb: "{{ manifiesto_ambiente | default(ambiente | default('produccion')) }}"

- name: Manifiesto · leer el actual
  ansible.builtin.uri:
    url: "{{ gitea_url | regex_replace('/+$', '') }}/api/v1/repos/invoke/ambientes/contents/{{ _man_amb }}.yml?ref=main"
    headers: {Authorization: "token {{ gitea_token }}"}
    status_code: [200, 404]
  register: _man
  no_log: true

- name: Manifiesto · commit vigente de la base de cada servidor (estado-servidores, rama master)
  ansible.builtin.uri:
    url: "{{ gitea_url | regex_replace('/+$', '') }}/api/v1/repos/invoke/estado-servidores/branches/master"
    headers: {Authorization: "token {{ gitea_token }}"}
    status_code: [200, 404]
  register: _estado
  no_log: true

- name: Manifiesto · guardar
  vars:
    _existe: "{{ _man.status == 200 }}"
    _actual: "{{ (_man.json.content | b64decode | from_yaml) if _existe else {'ambiente': _man_amb} }}"
    _sha_estado: "{{ _estado.json.commit.id[:12] if _estado.status == 200 else '-' }}"
    _nombres: "{{ ((_actual.servidores | default({}) or {}) | list + (manifiesto_servidores | default([]))) | unique }}"
    _servidores: "{{ dict(_nombres | zip([{'estado_servidores': _sha_estado}] * (_nombres | length))) }}"
    _nuevo: "{{ _actual | combine({'servidores': _servidores}, recursive=True) | combine(manifiesto_cambio, recursive=True) }}"
    _texto: |
      # Manifiesto del ambiente {{ _nuevo.ambiente | default(_man_amb) }}: la combinación exacta que está desplegada en él.
      # Lo actualiza AAP en cada despliegue o cambio de configuración. Para volver a un estado anterior:
      # plantilla "JBoss · Restablecer a versión" con el commit de este archivo.
      {{ _nuevo | to_nice_yaml(indent=2, sort_keys=false) }}
  ansible.builtin.uri:
    url: "{{ gitea_url | regex_replace('/+$', '') }}/api/v1/repos/invoke/ambientes/contents/{{ _man_amb }}.yml"
    method: "{{ 'PUT' if _existe else 'POST' }}"
    headers: {Authorization: "token {{ gitea_token }}"}
    body_format: json
    body: "{{ {'branch': 'main', 'message': manifiesto_mensaje, 'author': {'name': 'Ansible Automation Platform', 'email': 'aap@invoke.cl'},
              'content': _texto | b64encode} | combine({'sha': _man.json.sha} if _existe else {}) }}"
    status_code: [200, 201]
  when: (_nuevo | to_nice_yaml) != (_actual | to_nice_yaml)
  register: _man_put
  no_log: true

- name: Manifiesto · resultado
  ansible.builtin.debug:
    msg: "{{ ('Manifiesto ' ~ _man_amb ~ ' actualizado: ' ~ manifiesto_mensaje) if _man_put is not skipped else 'Manifiesto ' ~ _man_amb ~ ' sin cambios' }}"
