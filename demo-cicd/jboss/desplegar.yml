# Despliega en JBoss EAP la versión que publicó el pipeline; si no pasa la validación, vuelve a la anterior.

# Destino: si el despliegue no fija máquinas (limit; p. ej. un push a Gitea que dispara el pipeline sin FaceOps), va a las
# del grupo "jboss" que responden y las apagadas quedan fuera con aviso. Si las fija, todas deben responder o no parte.
- name: Destino del despliegue
  hosts: jboss
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: La máquina responde
      ansible.builtin.wait_for_connection:
        timeout: 20
      register: r_conexion
      ignore_errors: "{{ ansible_limit is not defined }}"

    - name: Máquina fuera de este despliegue
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} no responde (apagada o sin red): sigue con la versión que tenía y no recibe la {{ app_version }}."
      when: r_conexion is failed

    - name: Máquina en el despliegue
      ansible.builtin.group_by:
        key: jboss_destino
      when: r_conexion is succeeded

    - name: Hay al menos una máquina para desplegar
      ansible.builtin.assert:
        that: groups['jboss_destino'] | default([]) | length > 0
        fail_msg: "Ninguna máquina del grupo jboss responde: no se desplegó la versión {{ app_version }}."
        quiet: true
      run_once: true

- name: Desplegar app en JBoss EAP
  # En los JBoss de destino, uno a la vez: si uno falla, se detiene y los demás siguen con la versión anterior.
  hosts: jboss_destino
  serial: 1
  max_fail_percentage: 0
  become: true
  gather_facts: false
  vars:
    eap_cli: /opt/rh/eap8/root/usr/share/wildfly/bin/jboss-cli.sh
    carpeta: /var/lib/app-jboss
    war_url: "http://192.168.122.1:3000/api/packages/invoke/generic/app-jboss/{{ app_version }}/app-jboss.war"
    url_publica: http://34-176-42-56.sslip.io:8090/app-jboss/

  tasks:
    - name: Solicitud de despliegue
      ansible.builtin.debug:
        msg: >-
          Despliegue de la versión {{ app_version }} solicitado por {{ solicitado_por | default('manual') }}
          ({{ correo_solicitante | default('') }}) · commit {{ app_commit | default('-') }}
          · vía {{ origen | default('AAP') }}

    - name: Carpeta de versiones
      ansible.builtin.file:
        path: "{{ carpeta }}"
        state: directory
        mode: "0750"

    - name: Versión en producción
      ansible.builtin.stat:
        path: "{{ carpeta }}/actual.war"
      register: r_actual

    - name: Descargar versión {{ app_version }} publicada por el pipeline
      ansible.builtin.get_url:
        url: "{{ war_url }}"
        dest: "{{ carpeta }}/nueva.war"
        force: true
        mode: "0640"

    - name: Desplegar y validar
      block:
        # jboss-cli usa la credencial de AAP; no hay módulo de despliegue en las colecciones base
        - name: Desplegar en JBoss con jboss-cli
          ansible.builtin.command: >-
            {{ eap_cli }} --connect --user={{ jboss_usuario }} --password={{ jboss_clave }}
            --command="deploy {{ carpeta }}/nueva.war --name=app-jboss.war --force"
          changed_when: true
          no_log: true

        - name: La app responde con la versión {{ app_version }}
          ansible.builtin.uri:
            url: http://127.0.0.1:8080/app-jboss/salud
            return_content: true
          register: r_salud
          until: r_salud.status == 200 and app_version in r_salud.content
          retries: 10
          delay: 3

        - name: Guardar como versión en producción
          ansible.builtin.copy:
            src: "{{ carpeta }}/nueva.war"
            dest: "{{ carpeta }}/actual.war"
            remote_src: true
            mode: "0640"

        - name: Huella del artefacto desplegado
          ansible.builtin.stat:
            path: "{{ carpeta }}/actual.war"
            checksum_algorithm: sha256
          register: r_war

        - name: Carpeta de registros de FaceOps
          ansible.builtin.file: {path: /etc/faceops/aplicaciones.d, state: directory, mode: "0755"}

        - name: Registro de la aplicación desplegada (lo guarda en Git el respaldo continuo de la máquina)
          ansible.builtin.copy:
            dest: /etc/faceops/aplicaciones.d/app-jboss.yml
            mode: "0644"
            content: |
              app: app-jboss
              plataforma: JBoss EAP 8
              version: "{{ app_version }}"
              commit: "{{ app_commit | default('') }}"
              repo: "{{ app_repo | default('http://192.168.122.1:3000/invoke/app-jboss') }}"
              artefacto: "{{ war_url }}"
              sha256: "{{ r_war.stat.checksum | default('') }}"
              desplegado: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"
              solicitado_por: "{{ solicitado_por | default('manual') }}"
              ticket: "{{ faceops_ticket | default('') }}"

      rescue:
        - name: Volver a la versión anterior
          ansible.builtin.command: >-
            {{ eap_cli }} --connect --user={{ jboss_usuario }} --password={{ jboss_clave }}
            --command="deploy {{ carpeta }}/actual.war --name=app-jboss.war --force"
          changed_when: true
          no_log: true
          when: r_actual.stat.exists

        - name: Despliegue rechazado
          ansible.builtin.fail:
            msg: "La versión {{ app_version }} no pasó la validación; se restauró la versión anterior."

    - name: Resultado del despliegue
      ansible.builtin.set_stats:
        data:
          version_desplegada: "{{ app_version }}"
          commit: "{{ app_commit | default('') }}"
          solicitado_por: "{{ solicitado_por | default('manual') }}"
          origen: "{{ origen | default('AAP') }}"
          url_app: "{{ url_publica }}"

    - name: Mostrar URL
      ansible.builtin.debug:
        msg: "Versión {{ app_version }} en {{ inventory_hostname }}, solicitada por {{ solicitado_por | default('manual') }}: {{ url_publica }}"

# Los manifiestos (repo ambientes) siempre reflejan lo desplegado: se actualiza cada ambiente cuyo manifiesto lista un servidor
# que recibió la versión; los servidores que ningún manifiesto lista se agregan al del ambiente pedido (se crea si no existe).
- name: Manifiesto · registrar la versión desplegada
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    _desplegados: "{{ groups['jboss_destino'] | default([]) }}"
    _pedido: "{{ ambiente | default('produccion') }}"
  tasks:
    - name: Manifiestos de los ambientes
      when: gitea_token is defined and not (manifiesto_omitir | default(false) | bool)
      block:
        - name: Manifiestos existentes
          ansible.builtin.uri:
            url: "{{ gitea_url | regex_replace('/+$', '') }}/api/v1/repos/invoke/ambientes/contents/?ref=main"
            headers: {Authorization: "token {{ gitea_token }}"}
          register: _lista
          no_log: true

        - name: Servidores de cada manifiesto
          ansible.builtin.uri:
            url: "{{ gitea_url | regex_replace('/+$', '') }}/api/v1/repos/invoke/ambientes/raw/{{ item }}?ref=main"
            headers: {Authorization: "token {{ gitea_token }}"}
            return_content: true
          loop: "{{ _lista.json | map(attribute='name') | select('match', '.*[.]ya?ml$') | list }}"
          register: _manifs
          no_log: true

        - name: Ambientes a actualizar
          ansible.builtin.set_fact:
            _por_ambiente: >-
              {{ dict(_manifs.results | map(attribute='item') | map('regex_replace', '[.]ya?ml$', '')
                 | zip(_manifs.results | map(attribute='content') | map('from_yaml')
                       | map('combine', {}) | map(attribute='servidores', default={}) | map('list'))) }}

        - name: Servidores sin manifiesto
          ansible.builtin.set_fact:
            _sueltos: "{{ _desplegados | difference(_por_ambiente.values() | flatten) }}"
            _ambientes: >-
              {%- set out = [] -%}
              {%- for a, s in _por_ambiente.items() if s | intersect(_desplegados) | length > 0 -%}{%- set _ = out.append(a) -%}{%- endfor -%}
              {{ out + ([_pedido] if _pedido not in out else []) }}

        - name: Actualizar el manifiesto de cada ambiente
          ansible.builtin.include_tasks: tareas/manifiesto.yml
          loop: "{{ _ambientes | unique }}"
          loop_control: {loop_var: manifiesto_ambiente}
          when: >-
            manifiesto_ambiente != _pedido or _sueltos | length > 0
            or (_por_ambiente[_pedido] | default([])) | intersect(_desplegados) | length > 0
          vars:
            manifiesto_servidores: "{{ _sueltos if manifiesto_ambiente == _pedido else [] }}"
            manifiesto_cambio: {aplicacion: {version: "{{ app_version }}", commit: "{{ app_commit | default('') }}"}}
            manifiesto_mensaje: "Despliegue de app-jboss {{ app_version }} ({{ origen | default('AAP') }}, {{ solicitado_por | default('manual') }})"
