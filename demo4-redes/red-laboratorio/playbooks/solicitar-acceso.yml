# Red · Solicitar acceso (caso 1 de la Demo 4): crea en el firewall del laboratorio la regla que pide la app,
# la prueba desde la red de usuarios y deja el registro en ServiceNow (cambio + tarea, cerrados con la evidencia).
# Firewall: VyOS (open source, colección certificada vyos.vyos). Con FortiGate el flujo es el mismo con fortinet.fortios.
# Variables (encuesta o extra vars):
#   acceso_nombre   nombre corto de la solicitud            (por defecto: usuarios-a-srv-app)
#   acceso_origen   red de origen                           (por defecto: 10.40.40.0/24, usuarios detrás del firewall)
#   acceso_destino  servidor de destino                     (por defecto: 10.10.10.10/32, srv-app)
#   acceso_puerto   puerto TCP                              (por defecto: 8080)
#   solicitado_por  quién lo pidió                          (lo pone el pipeline, el ITSM o la encuesta)
#   acceso_fase     directo (por defecto) | preparar (muestra los comandos y espera aprobación) |
#                   aplicar (después de aprobar) | rechazado. Las usa el workflow "Red · Solicitar acceso con aprobación".
#   snow_ritm, snow_ritm_sys_id, snow_creado, snow_motivo  → cuando la solicitud nace como ticket en ServiceNow
#                   (ítem "Solicitar acceso de red"; lo entrega EDA). En ese caso NO se crea un cambio nuevo:
#                   se actualiza y se cierra ese mismo ticket con la evidencia.
# Conexión (variables del host fw en el inventario): network_cli, vyos.vyos.vyos, usuario y clave desde la credencial.
# Credenciales: "Red · firewall VyOS" (fw_usuario/fw_clave desde Vault secret/red/firewall) y
#               "ServiceNow · ansible.automatizacion" (sn_instancia/sn_usuario/sn_clave desde Vault secret/servicenow).
- name: Red · Solicitar acceso en el firewall
  hosts: firewall
  gather_facts: false
  vars:
    nombre: "{{ acceso_nombre | default('usuarios-a-srv-app') | lower | regex_replace('[^a-z0-9-]', '-') }}"
    origen: "{{ acceso_origen | default('10.40.40.0/24') | trim }}"
    _dest: "{{ acceso_destino | default('10.10.10.10/32') | trim }}"
    destino: "{{ _dest if '/' in _dest else _dest ~ '/32' }}"
    puerto: "{{ acceso_puerto | default(8080) | int }}"
    quien: "{{ solicitado_por | default('manual') | regex_replace('[^A-Za-z0-9._@-]', '') }}"
    job: "{{ awx_job_id | default(tower_job_id | default('manual')) }}"
    regla: "{{ 100 + ((nombre | hash('md5'))[:6] | int(base=16)) % 100 }}"
    g_origen: "acc-{{ nombre[:22] }}-o"
    g_destino: "acc-{{ nombre[:22] }}-d"
    lineas:
      - "set firewall group network-group {{ g_origen }} network {{ origen }}"
      - "set firewall group network-group {{ g_destino }} network {{ destino }}"
      - "set firewall group port-group tcp-{{ puerto }} port {{ puerto }}"
      - "set firewall ipv4 forward filter rule {{ regla }} action accept"
      - "set firewall ipv4 forward filter rule {{ regla }} protocol tcp"
      - "set firewall ipv4 forward filter rule {{ regla }} source group network-group {{ g_origen }}"
      - "set firewall ipv4 forward filter rule {{ regla }} destination group network-group {{ g_destino }}"
      - "set firewall ipv4 forward filter rule {{ regla }} destination group port-group tcp-{{ puerto }}"
    firma: "{{ nombre }} - solicitado por {{ quien }} - job {{ job }}"
    descripciones:
      - "set firewall group network-group {{ g_origen }} description 'Origen {{ firma }}'"
      - "set firewall group network-group {{ g_destino }} description 'Destino {{ firma }}'"
      - "set firewall ipv4 forward filter rule {{ regla }} description '{{ firma }}'"
    snow_titulo: "Red · acceso {{ nombre }}"
    snow_referencia: "job {{ job }}"
    snow_descripcion: "Solicitud de acceso de red ({{ origen }} → {{ destino }} tcp/{{ puerto }}) ejecutada automáticamente por Ansible Automation Platform en el firewall del laboratorio."
    es_ticket: "{{ snow_ritm is defined and (snow_ritm | length > 0) }}"
    fase: "{{ acceso_fase | default('directo') }}"
    # Servidores que se protegen con su propio firewall (firewalld) en vez del firewall de red VyOS
    servidores_con_firewall: {'192.168.122.13': 'nodo-postgres'}
    dest_ip: "{{ destino.split('/')[0] }}"
    srv: "{{ servidores_con_firewall[dest_ip] | default('') }}"
    es_servidor: "{{ srv | length > 0 }}"
    regla_srv: 'rule family="ipv4" source address="{{ origen }}" port port="{{ puerto }}" protocol="tcp" accept'
    comandos_srv:
      - "firewall-cmd --permanent --add-rich-rule='{{ regla_srv }}'"
      - "firewall-cmd --reload"
    ritm_vars: &ritm_vars
      ritm_origen: "{{ origen }}"
      ritm_destino: "{{ destino | regex_replace('/32$', '') }}"
      ritm_puerto: "{{ puerto }}"
  tasks:
    - name: Solicitud recibida
      ansible.builtin.debug:
        msg: >-
          Acceso {{ nombre }}: {{ origen }} → {{ destino }} tcp/{{ puerto }} · solicitado por {{ quien }} · regla {{ regla }}
          {{ '· ticket ' ~ snow_ritm ~ ' de ServiceNow' if es_ticket | bool else '' }}

    - name: ServiceNow · tomar el ticket del usuario
      ansible.builtin.include_tasks: tareas/snow_ritm.yml
      vars:
        ritm_accion: tomar
        <<: *ritm_vars
      when: es_ticket | bool and fase in ['directo', 'preparar']

    - name: Solicitud no aprobada · sin cambios en el firewall
      ansible.builtin.include_tasks: tareas/snow_ritm.yml
      vars:
        ritm_accion: rechazar
        <<: *ritm_vars
      when: es_ticket | bool and fase == 'rechazado'

    - name: Aplicar la solicitud en el firewall
      when: fase != 'rechazado'
      block:
        - name: Validar los datos de la solicitud
          ansible.builtin.assert:
            that:
              - origen is match('^([0-9]{1,3}\.){3}[0-9]{1,3}/[0-9]{1,2}$')
              - destino is match('^([0-9]{1,3}\.){3}[0-9]{1,3}/[0-9]{1,2}$')
              - (puerto | int) >= 1 and (puerto | int) <= 65535
            fail_msg: "Datos inválidos: origen '{{ origen }}', destino '{{ destino }}', puerto '{{ puerto }}'. Se esperan red CIDR, IP y puerto 1-65535."
            quiet: true

        - name: ¿La regla ya existe? (revisión sin cambios)
          vyos.vyos.vyos_config:
            lines: "{{ lineas }}"
          check_mode: true
          register: r_previo
          when: not es_servidor | bool

        - name: ¿La regla ya existe en el servidor {{ srv }}? (revisión sin cambios)
          ansible.posix.firewalld:
            rich_rule: "{{ regla_srv }}"
            permanent: true
            immediate: true
            state: enabled
          check_mode: true
          become: true
          delegate_to: "{{ srv }}"
          register: r_srv
          when: es_servidor | bool

        - name: Qué cambia
          ansible.builtin.set_fact:
            _cambia: "{{ (r_srv.changed if es_servidor | bool else r_previo.changed) | bool }}"
            _comandos: >-
              {{ (comandos_srv if es_servidor | bool else (r_previo.commands | default([]) + descripciones))
                 if (r_srv.changed if es_servidor | bool else r_previo.changed) else [] }}
            _donde: "{{ ('firewall del servidor ' ~ srv) if es_servidor | bool else ('regla ' ~ regla ~ ' del firewall de red') }}"

        - name: Sin cambios necesarios
          ansible.builtin.debug:
            msg: "El acceso ya estaba permitido ({{ _donde }}){{ '' if es_ticket | bool else ': no se crea ticket' }}."
          when: not _cambia

        - name: PARA APROBAR · comandos que se aplicarán en el firewall
          ansible.builtin.debug:
            msg: "{{ (['Dónde: ' ~ _donde] + _comandos) if _cambia else ['(la regla ya existe: no hay cambios que aplicar)'] }}"
          when: fase == 'preparar'

        - name: ServiceNow · ticket en espera de aprobación, con los comandos
          ansible.builtin.include_tasks: tareas/snow_ritm.yml
          vars:
            ritm_accion: aprobacion
            ritm_regla: "{{ _donde }}"
            ritm_comandos: "{{ _comandos }}"
            <<: *ritm_vars
          when: fase == 'preparar' and es_ticket | bool

        - name: Fase de preparación terminada · espera la aprobación en AAP
          ansible.builtin.meta: end_play
          when: fase == 'preparar'

        - name: ServiceNow · abrir cambio y tarea
          ansible.builtin.include_tasks: tareas/snow.yml
          vars:
            snow_accion: abrir
            snow_ops: [{clave: fw, tipo: firewall_regla, titulo: "Firewall: permitir {{ origen }} → {{ destino | regex_replace('/32$', '') }}:{{ puerto }} (regla {{ regla }})"}]
          when: _cambia and not (es_ticket | bool)

        - name: Crear grupos, servicio y regla en el firewall
          vyos.vyos.vyos_config:
            lines: "{{ lineas + descripciones }}"
            save: true
          register: r_regla
          when: _cambia and not es_servidor | bool

        - name: Abrir el puerto en el firewall del servidor {{ srv }}
          ansible.posix.firewalld:
            rich_rule: "{{ regla_srv }}"
            permanent: true
            immediate: true
            state: enabled
          become: true
          delegate_to: "{{ srv }}"
          when: _cambia and es_servidor | bool

        - name: Cambios aplicados
          ansible.builtin.debug:
            msg: "{{ ['Dónde: ' ~ _donde] + _comandos }}"
          when: _cambia

        - name: Recordar para la prueba
          ansible.builtin.set_fact:
            acceso_regla: "{{ _donde }}"
            acceso_nuevo: "{{ _cambia }}"
            acceso_comandos: "{{ _comandos }}"
            acceso_ticket: "{{ es_ticket | bool }}"
          delegate_to: localhost
          delegate_facts: true

      rescue:
        - name: ServiceNow · dejar el ticket abierto con el error
          ansible.builtin.include_tasks: tareas/snow_ritm.yml
          vars:
            ritm_accion: error
            ritm_error: "{{ ansible_failed_result.msg | default('error al aplicar la regla en el firewall') }}"
            <<: *ritm_vars
          when: es_ticket | bool

        - name: La solicitud no se pudo aplicar
          ansible.builtin.fail:
            msg: "{{ ansible_failed_result.msg | default('error al aplicar la regla en el firewall') }}"

# Prueba: hacia un servidor protegido con su firewall (la base de datos), se prueba la aplicación que la usa;
# en el resto, desde pc-usuario (red de usuarios detrás del firewall de red).
- name: Prueba del acceso
  hosts: >-
    {{ ('localhost' if (acceso_destino | default('')).split('/')[0] in ['192.168.122.13'] else 'pc-usuario')
       if (acceso_fase | default('directo')) in ['directo', 'aplicar'] else 'no_aplica' }}
  gather_facts: false
  vars:
    _dest: "{{ acceso_destino | default('10.10.10.10/32') | trim }}"
    destino_ip: "{{ _dest.split('/')[0] }}"
    puerto: "{{ acceso_puerto | default(8080) | int }}"
    es_ticket: "{{ hostvars.localhost.acceso_ticket | default(false) | bool }}"
    _tiempos: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/tiempos_manuales.yml') | from_yaml }}"
    _manual_min: "{{ _tiempos.firewall_regla | default(1440) | int }}"
    por_app: "{{ inventory_hostname == 'localhost' }}"
    _desde: "{{ 'la aplicación app-jboss' if por_app | bool else 'pc-usuario' }}"
    ritm_vars: &ritm_vars2
      ritm_origen: "{{ (acceso_origen | default('10.40.40.0/24')) | trim }}"
      ritm_destino: "{{ destino_ip }}"
      ritm_puerto: "{{ puerto }}"
  tasks:
    - name: Probar y cerrar
      block:
        - name: "pc-usuario → {{ destino_ip }}:{{ puerto }}"
          ansible.builtin.command: "wget -qO- -T4 http://{{ destino_ip }}:{{ puerto }}"
          register: r_prueba
          retries: 5
          delay: 3
          until: r_prueba.rc == 0
          changed_when: false
          when: not por_app | bool

        - name: "La aplicación vuelve a conectarse a la base de datos ({{ destino_ip }}:{{ puerto }})"
          ansible.builtin.uri:
            url: http://192.168.122.15:8080/app-jboss/
            return_content: true
          register: r_app
          retries: 10
          delay: 4
          until: "r_app.status == 200 and 'Base de datos: conectada' in (r_app.content | default(''))"
          when: por_app | bool

        - name: Evidencia
          ansible.builtin.set_fact:
            _evid: >-
              {{ ((r_app.content | default('') | regex_findall('Base de datos: [^<]*') | first | default('Base de datos: conectada'))
                  | regex_replace('\\s+', ' ') | trim) if por_app | bool else (r_prueba.stdout | trim) }}

        - name: Resultado
          ansible.builtin.debug:
            msg: "Acceso funcionando: {{ _evid }}"

        - name: ServiceNow · cerrar la tarea con la evidencia
          ansible.builtin.include_tasks: tareas/snow.yml
          vars:
            snow_accion: cerrar
            snow_cierres: [{clave: fw, detalle: "Prueba desde {{ _desde }} a {{ destino_ip }}:{{ puerto }}: respondió '{{ _evid }}' ({{ hostvars.localhost.acceso_regla }})."}]
          when: hostvars.localhost.acceso_nuevo | bool and not es_ticket

        - name: ServiceNow · cerrar el cambio
          ansible.builtin.include_tasks: tareas/snow.yml
          vars:
            snow_accion: final
          when: hostvars.localhost.acceso_nuevo | bool and not es_ticket

        - name: ServiceNow · cerrar el ticket del usuario con la evidencia
          ansible.builtin.include_tasks: tareas/snow_ritm.yml
          vars:
            ritm_accion: cerrar
            ritm_regla: "{{ hostvars.localhost.acceso_regla }}"
            ritm_comandos: "{{ hostvars.localhost.acceso_comandos | default([]) }}"
            ritm_prueba: "Prueba desde {{ _desde }} a {{ destino_ip }}:{{ puerto }}: respondió '{{ _evid }}'."
            ritm_segundos: >-
              {{ (((now(utc=true).strftime('%Y-%m-%d %H:%M:%S') | to_datetime) - (snow_creado | to_datetime)).total_seconds() | int)
                 if snow_creado is defined and snow_creado | length > 0 else '-' }}
            ritm_manual: >-
              {{ ((_manual_min | int) / 480) | round(1) ~ ' días laborales' if (_manual_min | int) >= 480
                 else (((_manual_min | int) / 60) | round(1)) ~ ' horas' }}
            <<: *ritm_vars2
          when: es_ticket

      rescue:
        - name: ServiceNow · dejar el ticket abierto con el error
          ansible.builtin.include_tasks: tareas/snow_ritm.yml
          vars:
            ritm_accion: error
            ritm_error: "la regla se aplicó, pero {{ _desde }} no llega a {{ destino_ip }}:{{ puerto }} ({{ ansible_failed_result.msg | default('sin respuesta') }})"
            <<: *ritm_vars2
          when: es_ticket

        - name: La prueba falló
          ansible.builtin.fail:
            msg: "{{ _desde }} no llega a {{ destino_ip }}:{{ puerto }}"
