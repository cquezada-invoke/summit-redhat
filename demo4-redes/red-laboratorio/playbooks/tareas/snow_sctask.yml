# Una ronda de cierre de las tareas activas (sc_task) del ticket. La incluye snow_ritm.yml.
- name: ServiceNow · tareas activas del ticket (ronda {{ ronda }})
  ansible.builtin.uri:
    url: "{{ _api }}/sc_task?sysparm_query=request_item={{ snow_ritm_sys_id }}^active=true&sysparm_fields=sys_id,number"
    user: "{{ sn_usuario }}"
    password: "{{ sn_clave }}"
    force_basic_auth: true
    headers: {Accept: application/json}
    timeout: 30
  register: _tareas
  no_log: true

- name: ServiceNow · cerrar esas tareas
  ansible.builtin.uri:
    url: "{{ _api }}/sc_task/{{ item.sys_id }}"
    method: PATCH
    user: "{{ sn_usuario }}"
    password: "{{ sn_clave }}"
    force_basic_auth: true
    body_format: json
    headers: {Accept: application/json}
    timeout: 30
    body: {state: "3", work_notes: "Cerrada por Ansible: la solicitud se atendió automáticamente. Job: {{ _job }}"}
  loop: "{{ _tareas.json.result | default([]) }}"
  loop_control:
    label: "{{ item.number }}"
  no_log: true

- name: Esperar a que el flujo del catálogo avance
  ansible.builtin.pause:
    seconds: 4
  when: (_tareas.json.result | default([])) | length > 0
