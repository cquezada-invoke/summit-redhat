# Atención de un ticket que el usuario abrió en ServiceNow (ítem "Solicitar acceso de red").
# Ansible NO crea un cambio nuevo: actualiza y cierra el mismo ticket (RITM).
#   ritm_accion: tomar  -> nota "Ansible tomó la solicitud · job", En curso, datos ordenados en la descripción
#   ritm_accion: cerrar -> nota con comandos, prueba, duración y tiempo manual; cierra tareas, RITM y REQ
#   ritm_accion: aprobacion -> nota interna con los comandos que se aplicarán; al usuario: "en revisión"
#   ritm_accion: rechazar   -> cierre incompleto, sin cambios, mensaje simple al usuario. ritm_rechazo_tipo:
#                              aprobacion (Rechazado, con el motivo del aprobador) | timeout (Timeout: nadie aprobó a tiempo)
#                              | validacion (Rechazado: datos no válidos, motivo en ritm_motivo_directo)
#   ritm_accion: error  -> Fallido y escalado: el cambio se deshizo (ritm_deshecho), el ticket queda asignado al grupo
#                          "Automatización Ansible" con una explicación simple (ritm_error_usuario) y el detalle técnico
# Cada cierre deja en las notas internas una línea "Resultado: <estado>" (la usa el reporte de solicitudes).
# Si ServiceNow no responde, solo se avisa: la automatización sigue.
- name: ServiceNow · ticket {{ snow_ritm }}
  delegate_to: localhost
  run_once: true
  become: false
  vars:
    _api: "{{ (sn_instancia | default('')) | regex_replace('/+$', '') }}/api/now/table"
    _job: "https://34.176.42.56/execution/jobs/playbook/{{ awx_job_id | default(tower_job_id | default('0')) }}/output"
    _wf: "https://34.176.42.56/execution/jobs/workflow/{{ awx_workflow_job_id | default('0') }}/details"
    # Otros ítems (p. ej. red para clúster OpenShift) pueden pasar sus propios textos:
    #   ritm_datos_texto, ritm_pedido_texto, ritm_listo_texto
    _nl: "\n"
    _datos: >-
      {{ ritm_datos_texto if ritm_datos_texto is defined else
         ('Origen: ' ~ ritm_origen ~ _nl ~ 'Destino: ' ~ ritm_destino ~ _nl ~ 'Puerto: tcp/' ~ ritm_puerto
          ~ _nl ~ 'Solicitado por: ' ~ (solicitado_por | default('-')) ~ _nl ~ 'Motivo: ' ~ (snow_motivo | default('-')) ~ _nl) }}
    # Lo que ve el usuario: lenguaje simple, sin nombres de herramientas.
    _pedido: >-
      {{ ritm_pedido_texto if ritm_pedido_texto is defined else
         ('Acceso desde la red ' ~ ritm_origen ~ ' hacia el servidor ' ~ ritm_destino ~ ' por el puerto ' ~ ritm_puerto
          ~ '.' ~ _nl ~ 'Motivo: ' ~ (snow_motivo | default('-'))) }}
    _s: "{{ ritm_segundos | default('-') | string | trim }}"
    _seg: "{{ _s | int if _s is match('^[0-9]+$') else -1 }}"
    _tiempo: >-
      {{ '' if (_seg | int) < 0 else
         ((((_seg | int) // 60) ~ ' min ' ~ ((_seg | int) % 60) ~ ' s') if (_seg | int) >= 60 else ((_seg | int) ~ ' s')) }}
    # Campo Duration de ServiceNow: fecha base 1970-01-01 + el tiempo transcurrido
    _duracion: >-
      {{ '' if (_seg | int) < 0 else
         '1970-01-%02d %02d:%02d:%02d' | format(1 + (_seg | int) // 86400, ((_seg | int) % 86400) // 3600,
                                               ((_seg | int) % 3600) // 60, (_seg | int) % 60) }}
  block:
    - name: ServiceNow · tomar el ticket (En curso)
      ansible.builtin.uri:
        url: "{{ _api }}/sc_req_item/{{ snow_ritm_sys_id }}"
        method: PATCH
        user: "{{ sn_usuario }}"
        password: "{{ sn_clave }}"
        force_basic_auth: true
        body_format: json
        headers: {Accept: application/json}
        timeout: 30
        body:
          state: "2"
          description: "{{ _pedido }}"
          comments: "Recibimos tu solicitud y ya la estamos atendiendo."
          work_notes: "Ansible tomó la solicitud · job: {{ _job }}"
      no_log: true
      when: ritm_accion == 'tomar'

    - name: ServiceNow · ticket en curso
      ansible.builtin.debug:
        msg: "{{ snow_ritm }} en curso · {{ sn_instancia }}/sc_req_item.do?sys_id={{ snow_ritm_sys_id }}"
      when: ritm_accion == 'tomar'

    # El flujo del catálogo abre sus tareas en secuencia y puede reabrir una cerrada antes de tiempo:
    # se cierran por rondas hasta que no quede ninguna activa.
    - name: ServiceNow · cerrar las tareas del flujo del catálogo
      ansible.builtin.include_tasks: snow_sctask.yml
      loop: [1, 2, 3, 4]
      loop_control:
        loop_var: ronda
      when: ritm_accion == 'cerrar'

    - name: ServiceNow · cerrar el ticket con la evidencia
      ansible.builtin.uri:
        url: "{{ _api }}/sc_req_item/{{ snow_ritm_sys_id }}"
        method: PATCH
        user: "{{ sn_usuario }}"
        password: "{{ sn_clave }}"
        force_basic_auth: true
        body_format: json
        headers: {Accept: application/json}
        timeout: 30
        body:
          state: "3"
          description: "{{ _pedido }}"
          calendar_duration: "{{ _duracion }}"
          business_duration: "{{ _duracion }}"
          comments: &listo >-
            {{ ritm_listo_texto if ritm_listo_texto is defined else
               ('Listo. Habilitamos el acceso desde la red ' ~ ritm_origen ~ ' hacia el servidor ' ~ ritm_destino
                ~ ' por el puerto ' ~ ritm_puerto ~ '. Lo probamos y funciona.') }}{{ (' Tiempo de atención: ' ~ _tiempo ~ '.') if _tiempo | length else '' }}
          close_notes: *listo
          work_notes: |
            Solicitud atendida automáticamente por Ansible Automation Platform.
            {{ _datos }}Dónde: {{ ritm_regla }}

            Cambios aplicados:
            {% for c in ritm_comandos | default([]) %}
            {{ c }}
            {% else %}
            (la regla ya existía: sin cambios)
            {% endfor %}

            {{ ritm_prueba }}
            Resultado: Completado
            Tiempo total desde que se abrió el ticket: {{ ritm_segundos }} s · equivalente manual estimado: {{ ritm_manual }}.
            Job de AAP: {{ _job }}
      register: _cierre
      no_log: true
      when: ritm_accion == 'cerrar'

    - name: ServiceNow · solicitud (REQ) del ticket
      ansible.builtin.uri:
        url: "{{ _api }}/sc_req_item/{{ snow_ritm_sys_id }}?sysparm_fields=request,request.number,request.request_state"
        user: "{{ sn_usuario }}"
        password: "{{ sn_clave }}"
        force_basic_auth: true
        headers: {Accept: application/json}
        timeout: 30
      register: _req
      no_log: true
      when: ritm_accion == 'cerrar'

    - name: ServiceNow · cerrar la solicitud (REQ) si sigue abierta
      ansible.builtin.uri:
        url: "{{ _api }}/sc_request/{{ _req.json.result.request.value }}"
        method: PATCH
        user: "{{ sn_usuario }}"
        password: "{{ sn_clave }}"
        force_basic_auth: true
        body_format: json
        headers: {Accept: application/json}
        timeout: 30
        body: {request_state: closed_complete, state: "3"}
      no_log: true
      when: ritm_accion == 'cerrar' and (_req.json.result['request.request_state'] | default('')) not in ['closed_complete', 'closed_incomplete', 'closed_cancelled']

    - name: ServiceNow · ticket cerrado
      ansible.builtin.debug:
        msg: "{{ snow_ritm }} cerrado en {{ ritm_segundos }} s · {{ sn_instancia }}/sc_req_item.do?sys_id={{ snow_ritm_sys_id }}"
      when: ritm_accion == 'cerrar'

    - name: ServiceNow · en espera de aprobación (con los comandos)
      ansible.builtin.uri:
        url: "{{ _api }}/sc_req_item/{{ snow_ritm_sys_id }}"
        method: PATCH
        user: "{{ sn_usuario }}"
        password: "{{ sn_clave }}"
        force_basic_auth: true
        body_format: json
        headers: {Accept: application/json}
        timeout: 30
        body:
          comments: "Tu solicitud está en revisión por el equipo de redes. Te avisaremos aquí cuando quede lista."
          work_notes: |
            Pendiente de aprobación en Ansible Automation Platform (Workflow Approvals).
            {{ ritm_regla }} · cambios que se aplicarán al aprobar:
            {% for c in ritm_comandos | default([]) %}
            {{ c }}
            {% else %}
            (la regla ya existe: no hay cambios que aplicar)
            {% endfor %}

            Workflow: {{ _wf }}
      no_log: true
      when: ritm_accion == 'aprobacion'

    - name: ServiceNow · motivo del rechazo (si el aprobador lo dejó)
      ansible.builtin.uri:
        url: "{{ _api }}/sys_journal_field?sysparm_query=element_id={{ snow_ritm_sys_id }}^element=work_notes^valueLIKEMotivo%20del%20rechazo^ORDERBYDESCsys_created_on&sysparm_fields=value&sysparm_limit=1"
        user: "{{ sn_usuario }}"
        password: "{{ sn_clave }}"
        force_basic_auth: true
        headers: {Accept: application/json}
        timeout: 30
      register: _mot
      no_log: true
      when: ritm_accion == 'rechazar' and ritm_motivo_directo is not defined

    - name: Motivo
      ansible.builtin.set_fact:
        _motivo_rechazo: >-
          {%- set v = (_mot.json.result | default([])) | map(attribute='value') | first | default('') -%}
          {{ (v.split('Motivo del rechazo:')[1].split(_nl)[0] | trim | regex_replace('[.]+$', ''))
             if 'Motivo del rechazo:' in v else '' }}
      when: ritm_accion == 'rechazar' and ritm_motivo_directo is not defined

    - name: Motivo (indicado por la automatización)
      ansible.builtin.set_fact:
        _motivo_rechazo: "{{ ritm_motivo_directo }}"
      when: ritm_accion == 'rechazar' and ritm_motivo_directo is defined

    - name: ServiceNow · cerrar las tareas del flujo (no aprobada)
      ansible.builtin.include_tasks: snow_sctask.yml
      vars:
        _sctask_estado: "4"
        _sctask_nota: "Cerrada sin cambios: la solicitud no se aplicó."
      loop: [1, 2, 3, 4]
      loop_control:
        loop_var: ronda
      when: ritm_accion == 'rechazar'

    - name: ServiceNow · cerrar el ticket como no aprobado
      ansible.builtin.uri:
        url: "{{ _api }}/sc_req_item/{{ snow_ritm_sys_id }}"
        method: PATCH
        user: "{{ sn_usuario }}"
        password: "{{ sn_clave }}"
        force_basic_auth: true
        body_format: json
        headers: {Accept: application/json}
        timeout: 30
        body:
          state: "4"
          comments: &rechazo >-
            {%- set t = ritm_rechazo_tipo | default('aprobacion') -%}
            {%- if t == 'timeout' -%}
            Tu solicitud no alcanzó a ser revisada dentro del plazo, así que no se hizo ningún cambio. Si aún la necesitas, vuelve a pedirla.
            {%- elif t == 'validacion' -%}
            No pudimos procesar tu solicitud: {{ _motivo_rechazo | default('hay datos que no son válidos') }}. No se hizo ningún cambio. Corrige el dato y vuelve a pedirla.
            {%- else -%}
            Tu solicitud no fue aprobada, así que no se hizo ningún cambio.{{ (' Motivo: ' ~ _motivo_rechazo ~ '.') if _motivo_rechazo | default('') | length else '' }} Si necesitas más detalle, responde en este ticket.
            {%- endif -%}
          close_notes: *rechazo
          work_notes: >-
            Resultado: {{ 'Timeout' if ritm_rechazo_tipo | default('aprobacion') == 'timeout' else 'Rechazado' }}
            ({{ {'timeout': 'la aprobación venció sin respuesta', 'validacion': 'datos no válidos en el precheck: ' ~ (_motivo_rechazo | default('-')),
                 'aprobacion': 'rechazado por el aprobador'}[ritm_rechazo_tipo | default('aprobacion')] }}).
            No se aplicó ningún cambio. {{ ('Workflow: ' ~ _wf) if awx_workflow_job_id is defined else ('Job: ' ~ _job) }}
      no_log: true
      when: ritm_accion == 'rechazar'

    - name: ServiceNow · solicitud (REQ) del ticket no aprobado
      ansible.builtin.uri:
        url: "{{ _api }}/sc_req_item/{{ snow_ritm_sys_id }}?sysparm_fields=request"
        user: "{{ sn_usuario }}"
        password: "{{ sn_clave }}"
        force_basic_auth: true
        headers: {Accept: application/json}
        timeout: 30
      register: _req_r
      no_log: true
      when: ritm_accion == 'rechazar'

    - name: ServiceNow · cerrar la solicitud (REQ) como incompleta
      ansible.builtin.uri:
        url: "{{ _api }}/sc_request/{{ _req_r.json.result.request.value }}"
        method: PATCH
        user: "{{ sn_usuario }}"
        password: "{{ sn_clave }}"
        force_basic_auth: true
        body_format: json
        headers: {Accept: application/json}
        timeout: 30
        body: {request_state: closed_incomplete, state: "4"}
      no_log: true
      when: ritm_accion == 'rechazar'

    - name: ServiceNow · grupo Automatización Ansible
      ansible.builtin.uri:
        url: "{{ _api }}/sys_user_group?sysparm_query=name=Automatizaci%C3%B3n%20Ansible&sysparm_fields=sys_id&sysparm_limit=1"
        user: "{{ sn_usuario }}"
        password: "{{ sn_clave }}"
        force_basic_auth: true
        headers: {Accept: application/json}
        timeout: 30
      register: _grupo
      no_log: true
      when: ritm_accion == 'error'

    - name: ServiceNow · dejar el ticket abierto con el error
      ansible.builtin.uri:
        url: "{{ _api }}/sc_req_item/{{ snow_ritm_sys_id }}"
        method: PATCH
        user: "{{ sn_usuario }}"
        password: "{{ sn_clave }}"
        force_basic_auth: true
        body_format: json
        headers: {Accept: application/json}
        timeout: 30
        body:
          state: "2"
          assignment_group: "{{ _grupo.json.result[0].sys_id | default('') }}"
          comments: >-
            No pudimos completar tu solicitud: {{ ritm_error_usuario | default('hubo un problema al aplicarla') }}.
            {{ 'Por seguridad dejamos todo como estaba. ' if ritm_deshecho | default(false) | bool else '' }}Un especialista la está revisando y te responderá en este mismo ticket.
          work_notes: |
            Resultado: Fallido y escalado
            Ansible no pudo completar la solicitud: {{ ritm_error }}
            {{ ritm_estado_cambio | default('El cambio se deshizo automáticamente (todo o nada).' if ritm_deshecho | default(false) | bool else 'No quedó ningún cambio aplicado.') }}
            El ticket queda asignado al grupo Automatización Ansible para su revisión. Job: {{ _job }}
      no_log: true
      when: ritm_accion == 'error'

  rescue:
    - name: ServiceNow no respondió (la automatización sigue)
      ansible.builtin.debug:
        msg: "Aviso: no se pudo actualizar {{ snow_ritm }} en ServiceNow ({{ ansible_failed_result.msg | default('sin detalle') }})."
