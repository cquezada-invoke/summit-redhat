# Red · Verificar drift: detecta cambios manuales en los equipos y los revierte al estado de Git.
- name: Red · Verificar drift contra Git
  hosts: gestionados
  gather_facts: false
  tasks:
    - name: Origen de la verificación
      ansible.builtin.debug:
        msg: "Verificación de drift ({{ origen_evento | default('programada' if awx_schedule_id is defined else 'manual') }})"
      run_once: true

    - name: Cambio que reportó el equipo
      ansible.builtin.debug:
        msg: "{{ ['Quitado a mano: ' ~ (cambio_quitado | default([]) | join(' | ')), 'Agregado a mano: ' ~ (cambio_agregado | default([]) | join(' | '))] }}"
      run_once: true
      when: cambio_quitado is defined or cambio_agregado is defined

    - name: Comparar y restaurar
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../tareas/sincronizar.yml"
