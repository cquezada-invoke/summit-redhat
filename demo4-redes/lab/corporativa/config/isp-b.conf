frr defaults traditional
hostname isp-b
!
router bgp 64502
 bgp router-id 100.64.2.1
 no bgp ebgp-requires-policy
 neighbor 100.64.2.2 remote-as 65100
 neighbor 100.64.2.2 description BORDE-EMPRESA
 address-family ipv4 unicast
  network 192.0.2.0/24
  neighbor 100.64.2.2 default-originate
 exit-address-family
exit
!
