# Demo 4 · Routers de sucursal (caso "actualización masiva de firmware").
# Topología aparte de summit-red para no redesplegar el laboratorio principal: comparte su red de gestión
# (clab-summit, 172.20.20.0/24) y cada sucursal habla BGP con el router de borde (rtr, 172.20.20.11) por esa red.
# Cada router anuncia la LAN de su sucursal (10.30.N.0/24). El "firmware" es la versión de FRR (imagen del contenedor):
# la base del laboratorio es 9.1.0 y la actualización lleva a 10.2.1. La línea "image" de cada nodo la edita
# /usr/local/sbin/lab-sucursal (no editar a mano el marcador "# imagen-sucN").
name: summit-suc

mgmt:
  network: clab-summit
  ipv4-subnet: 172.20.20.0/24

topology:
  defaults:
    kind: linux
  nodes:
    suc1:
      image: quay.io/frrouting/frr:9.1.0   # imagen-suc1
      mgmt-ipv4: 172.20.20.41
      binds:
        - config/daemons:/etc/frr/daemons
        - config/suc1.conf:/etc/frr/frr.conf
      exec:
        - touch /etc/frr/vtysh.conf
        - ip addr add 10.30.1.1/24 dev lo
    suc2:
      image: quay.io/frrouting/frr:9.1.0   # imagen-suc2
      mgmt-ipv4: 172.20.20.42
      binds:
        - config/daemons:/etc/frr/daemons
        - config/suc2.conf:/etc/frr/frr.conf
      exec:
        - touch /etc/frr/vtysh.conf
        - ip addr add 10.30.2.1/24 dev lo
    suc3:
      image: quay.io/frrouting/frr:9.1.0   # imagen-suc3
      mgmt-ipv4: 172.20.20.43
      binds:
        - config/daemons:/etc/frr/daemons
        - config/suc3.conf:/etc/frr/frr.conf
      exec:
        - touch /etc/frr/vtysh.conf
        - ip addr add 10.30.3.1/24 dev lo
