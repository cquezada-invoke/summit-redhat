# Demo 4 · Router de sucursal 2 (caso "actualización masiva de firmware").
# Un laboratorio de un solo nodo por sucursal: así lab-sucursal puede cambiarle la imagen (el "firmware") y redesplegarlo
# con --reconfigure sin tocar las otras sucursales ni el laboratorio principal (summit-red). Comparte la red de gestión
# clab-summit (172.20.20.0/24) y habla BGP con el router de borde (rtr, 172.20.20.11); anuncia 10.30.2.0/24.
# La línea "image" la edita /usr/local/sbin/lab-sucursal (no editar a mano el marcador "# imagen-suc2").
# Base de la demo: FRR 9.1.0. Actualización: 10.2.1 (o la imagen "defectuosa", sin BGP, para mostrar la reversión).
name: summit-suc2
prefix: clab-summit-suc

mgmt:
  network: clab-summit
  ipv4-subnet: 172.20.20.0/24

topology:
  nodes:
    suc2:
      kind: linux
      image: quay.io/frrouting/frr:9.1.0   # imagen-suc2
      mgmt-ipv4: 172.20.20.42
      binds:
        - config/daemons:/etc/frr/daemons
        - config/suc2.conf:/etc/frr/frr.conf
      exec:
        - touch /etc/frr/vtysh.conf
        - ip addr add 10.30.2.1/24 dev lo
