# Balanceador de la sede: VIP 10.20.30.100 (HTTP 80) → srv-web-01 y srv-web-02 (:8080), con chequeo de salud.
global
    log stdout format raw local0 warning
    maxconn 2000
defaults
    mode http
    timeout connect 3s
    timeout client 30s
    timeout server 30s
frontend fe-web-sede
    bind 10.20.30.100:80
    default_backend be-web-sede
backend be-web-sede
    balance roundrobin
    option httpchk GET /
    server srv-web-01 10.20.30.21:8080 check inter 5s
    server srv-web-02 10.20.30.22:8080 check inter 5s
listen estadisticas
    bind 127.0.0.1:8404
    stats enable
    stats uri /stats
