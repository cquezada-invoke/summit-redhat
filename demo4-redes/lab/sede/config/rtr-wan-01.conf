frr defaults traditional
hostname rtr-wan-01
log syslog informational
!
interface eth1
 description WAN · enlace al proveedor (AS 64600)
!
interface eth2
 description Hacia fw-sede-01 (outside)
!
ip route 10.20.0.0/16 10.255.20.2 name red-sede
!
router bgp 65020
 bgp router-id 10.255.20.1
 no bgp ebgp-requires-policy
 neighbor 100.64.20.1 remote-as 64600
 neighbor 100.64.20.1 description Proveedor WAN (pe-isp)
 !
 address-family ipv4 unicast
  network 10.20.0.0/16
 exit-address-family
!
line vty
!
