config system global
    set hostname "fgt-summit"
    set admintimeout 480
end
config system admin
    edit "admin"
        set ssh-public-key1 "__LLAVE_PUB__"
    next
end
config system api-user
    edit "aap"
        set comments "Ansible Automation Platform (token en Vault: secret/red/fortigate)"
        set accprofile "super_admin"
        set vdom "root"
        config trusthost
            edit 1
                set ipv4-trusthost 0.0.0.0 0.0.0.0
            next
        end
    next
end
config system interface
    edit "port2"
        set alias "WAN"
        set mode static
        set ip 10.20.20.2 255.255.255.0
        set allowaccess ping
        set role wan
    next
    edit "port3"
        set alias "LAN-usuarios"
        set mode static
        set ip 10.40.40.1 255.255.255.0
        set allowaccess ping
        set role lan
    next
end
config router static
    edit 10
        set dst 203.0.113.0 255.255.255.0
        set gateway 10.20.20.1
        set device "port2"
    next
    edit 11
        set dst 10.10.10.0 255.255.255.0
        set gateway 10.20.20.1
        set device "port2"
    next
end
config firewall address
    edit "red-usuarios"
        set subnet 10.40.40.0 255.255.255.0
        set comment "Usuarios detrás del FortiGate"
    next
    edit "internet-simulada"
        set subnet 203.0.113.0 255.255.255.0
        set comment "Internet del ISP simulado"
    next
end
config firewall policy
    edit 1
        set name "usuarios-a-internet"
        set srcintf "port3"
        set dstintf "port2"
        set srcaddr "red-usuarios"
        set dstaddr "internet-simulada"
        set action accept
        set schedule "always"
        set service "ALL"
        set nat enable
        set logtraffic all
        set comments "Base del laboratorio: navegación a Internet. Lo demás se pide con AAP."
    next
end
