 no bgp ebgp-requires-policy
 neighbor 10.0.0.1 remote-as 65000
 neighbor 10.0.0.1 description ISP-SIMULADO
 neighbor 172.20.20.41 remote-as 65101
 neighbor 172.20.20.41 description SUCURSAL-1
 neighbor 172.20.20.42 remote-as 65102
 neighbor 172.20.20.42 description SUCURSAL-2
 neighbor 172.20.20.43 remote-as 65103
 neighbor 172.20.20.43 description SUCURSAL-3
 !
 address-family ipv4 unicast
  network 10.10.10.0/24
  network 10.20.20.0/24
 exit-address-family
exit
!
