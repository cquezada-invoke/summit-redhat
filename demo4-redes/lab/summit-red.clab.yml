# Demo 4 · Redes — laboratorio emulado con containerlab (runtime podman, rootful).
# ISP y router de borde con FRR, firewall VyOS entre el router y la red de usuarios, y dos equipos Linux.
# Camino de datos: pc-usuario (10.40.40.10) → firewall VyOS (LAN eth2 · WAN eth1, con NAT) → rtr → srv-app / ISP.
# Sin regla en el firewall, pc-usuario llega a Internet pero NO a srv-app:8080 (caso 1 de la demo).
# Los switches Arista cEOS siguen comentados hasta tener su imagen.
# Routers de sucursal suc1-3 (demo de firmware): laboratorios aparte (sucursales/sucN.clab.yml) en esta misma red de gestión,
# para agregarlos o cambiarles la imagen sin redesplegar este laboratorio.
# La clave del firewall y su llave SSH se completan al desplegar (instalar-fw.sh); no van en Git.
name: summit-red

mgmt:
  network: clab-summit
  ipv4-subnet: 172.20.20.0/24

topology:
  nodes:
    isp:                                  # ISP simulado: anuncia "Internet" (203.0.113.0/24) por BGP
      kind: linux
      image: localhost/frr-summit:1
      mgmt-ipv4: 172.20.20.10
      binds:
        - config/daemons:/etc/frr/daemons
        - config/isp.conf:/etc/frr/frr.conf
      exec:
        - touch /etc/frr/vtysh.conf
        - sysctl -qw net.ipv4.ip_forward=1
        - ip addr add 10.0.0.1/30 dev eth1
        - ip addr add 203.0.113.1/24 dev lo
        - ip addr add 203.0.113.50/32 dev lo   # IP "sospechosa" del caso de seguridad

    rtr:                                  # Router de borde de la empresa, gestionado por AAP
      kind: linux
      image: localhost/frr-summit:1
      mgmt-ipv4: 172.20.20.11
      binds:
        - config/daemons:/etc/frr/daemons
        - config/rtr.conf:/etc/frr/frr.conf
        - config/vigia.py:/vigia.py
      exec:
        - touch /etc/frr/vtysh.conf
        - sysctl -qw net.ipv4.ip_forward=1
        - ip addr add 10.0.0.2/30 dev eth1
        - ip addr add 10.10.10.1/24 dev eth2
        - ip addr add 10.20.20.1/24 dev eth3
        - /usr/sbin/sshd
        - sh -c "setsid python3 /vigia.py > /var/log/vigia.log 2>&1 < /dev/null &"

    srv-app:                              # Servidor de prueba: responde HTTP en :8080 y :8443
      kind: linux
      image: docker.io/library/python:3.12-alpine
      cmd: sleep infinity
      mgmt-ipv4: 172.20.20.21
      exec:
        - ip addr add 10.10.10.10/24 dev eth1
        - ip route replace 10.20.20.0/24 via 10.10.10.1
        - ip route replace 203.0.113.0/24 via 10.10.10.1
        - sh -c "mkdir -p /www && echo 'srv-app responde OK' > /www/index.html && cd /www && setsid python3 -m http.server 8080 > /dev/null 2>&1 < /dev/null &"
        - sh -c "cd /www && setsid python3 -m http.server 8443 > /dev/null 2>&1 < /dev/null &"

    pc-usuario:                           # Origen de las pruebas, detrás del firewall (con SSH para que AAP pruebe)
      kind: linux
      image: localhost/frr-summit:1
      mgmt-ipv4: 172.20.20.22
      exec:
        - /usr/sbin/sshd
        - ip addr add 10.40.40.10/24 dev eth1
        - ip route replace 10.10.10.0/24 via 10.40.40.1
        - ip route replace 203.0.113.0/24 via 10.40.40.1

    fw:                                   # Firewall del laboratorio: VyOS (open source) · eth0 gestión · eth1 WAN · eth2 LAN
      kind: linux                         # contenedor construido desde la ISO pública de VyOS (instalar-fw.sh)
      image: localhost/vyos:2026.10.23
      cmd: /sbin/init
      mgmt-ipv4: 172.20.20.12
      binds:
        - /lib/modules:/lib/modules:ro
        - config/fw-base.vbash:/usr/local/bin/fw-base.vbash
        - config/fw-arranque.sh:/usr/local/bin/fw-arranque.sh
        - config/fw-limpiar.vbash:/usr/local/bin/fw-limpiar.vbash
      exec:
        - sh -c "setsid bash /usr/local/bin/fw-arranque.sh > /var/log/fw-arranque.log 2>&1 < /dev/null &"

    # FortiGate VM 7.6 (vrnetlab): reemplazado por VyOS porque la licencia de evaluación no se pudo activar
    # (FortiCare con MFA obligatorio). Para reactivarlo con licencia: descomentar este bloque, comentar "fw",
    # cambiar los enlaces fw:eth1/eth2 por fgt:eth1/eth2 y desplegar con instalar-fgt.sh (su disco en /opt/summit-red/fgt-disco se conserva).
    # fgt:                                  # FortiGate VM 7.6 (vrnetlab): port1 gestión · port2 WAN · port3 LAN
