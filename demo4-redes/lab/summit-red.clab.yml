# Demo 4 · Redes — laboratorio emulado con containerlab (runtime podman, rootful).
# Fase 1: ISP y router de borde con FRR, y dos equipos Linux para las pruebas.
# Los switches Arista cEOS y el FortiGate quedan comentados hasta tener sus imágenes.
name: summit-red

mgmt:
  network: clab-summit
  ipv4-subnet: 172.20.20.0/24

topology:
  nodes:
    isp:                                  # ISP simulado: anuncia "Internet" (203.0.113.0/24) por BGP
      kind: linux
      image: localhost/frr-summit:1
      mgmt-ipv4: 172.20.20.10
      binds:
        - config/daemons:/etc/frr/daemons
        - config/isp.conf:/etc/frr/frr.conf
      exec:
        - sysctl -qw net.ipv4.ip_forward=1
        - ip addr add 10.0.0.1/30 dev eth1
        - ip addr add 203.0.113.1/24 dev lo

    rtr:                                  # Router de borde de la empresa, gestionado por AAP
      kind: linux
      image: localhost/frr-summit:1
      mgmt-ipv4: 172.20.20.11
      binds:
        - config/daemons:/etc/frr/daemons
        - config/rtr.conf:/etc/frr/frr.conf
        - config/vigia.py:/vigia.py
      exec:
        - sysctl -qw net.ipv4.ip_forward=1
        - ip addr add 10.0.0.2/30 dev eth1
        - ip addr add 10.10.10.1/24 dev eth2
        - ip addr add 10.20.20.1/24 dev eth3
        - /usr/sbin/sshd
        - sh -c "setsid python3 /vigia.py > /var/log/vigia.log 2>&1 < /dev/null &"

    srv-app:                              # Servidor de prueba: responde HTTP en :8080
      kind: linux
      image: docker.io/library/alpine:3.20
      mgmt-ipv4: 172.20.20.21
      exec:
        - ip addr add 10.10.10.10/24 dev eth1
        - ip route replace 10.20.20.0/24 via 10.10.10.1
        - ip route replace 203.0.113.0/24 via 10.10.10.1
        - sh -c "mkdir -p /www && echo 'srv-app responde OK' > /www/index.html && httpd -p 8080 -h /www"

    pc-usuario:                           # Origen de las pruebas
      kind: linux
      image: docker.io/library/alpine:3.20
      mgmt-ipv4: 172.20.20.22
      exec:
        - ip addr add 10.20.20.10/24 dev eth1
        - ip route replace 10.10.10.0/24 via 10.20.20.1
        - ip route replace 203.0.113.0/24 via 10.20.20.1

    # --- Fase 2: requieren imágenes que se descargan con cuenta propia ---
    # fgt:                                # FortiGate VM de evaluación (vía vrnetlab)
    #   kind: fortinet_fortigate
    #   image: vrnetlab/vr-fortios:7.4.4
    #   mgmt-ipv4: 172.20.20.12
    # core:                               # Switch núcleo
    #   kind: arista_ceos
    #   image: ceos:4.32.2F
    #   mgmt-ipv4: 172.20.20.13
    # swa:                                # Switch servidores · VLAN 10
    #   kind: arista_ceos
    #   image: ceos:4.32.2F
    #   mgmt-ipv4: 172.20.20.14
    # swb:                                # Switch usuarios · VLAN 20
    #   kind: arista_ceos
    #   image: ceos:4.32.2F
    #   mgmt-ipv4: 172.20.20.15

  links:
    # Fase 1: camino de datos temporal, todo pasa por el router FRR
    - endpoints: ["isp:eth1", "rtr:eth1"]
    - endpoints: ["rtr:eth2", "srv-app:eth1"]
    - endpoints: ["rtr:eth3", "pc-usuario:eth1"]
