# Guarda en Git (Gitea invoke/estado-servidores) la foto de los servidores de esta jugada: un commit con
# autor = la persona que hizo el cambio y el mensaje recibido. Se ejecuta una sola vez, en el contenedor de AAP.
- name: Registrar en Git
  run_once: true
  delegate_to: localhost
  become: false
  check_mode: false
  vars:
    w: "/tmp/estado-{{ awx_job_id | default('local') }}"
    repo_git: "192.168.122.1:3000/invoke/estado-servidores.git"
  block:
    - name: Clonar el repositorio de estado
      ansible.builtin.shell: >-
        rm -rf {{ w }} &&
        git clone -q "http://registro-estado:${GITEA_TOKEN_ESTADO}@{{ repo_git }}" {{ w }}
      no_log: true
      changed_when: false

    - name: Limpiar la carpeta de cada servidor (la foto la reemplaza completa)
      ansible.builtin.file:
        path: "{{ w }}/{{ item }}"
        state: absent
      loop: "{{ ansible_play_hosts }}"

    - name: Carpetas de la foto
      ansible.builtin.file:
        path: "{{ w }}/{{ item }}"
        state: directory
      loop: "{{ ansible_play_hosts | map('extract', hostvars, 'foto_archivos') | flatten | map(attribute='ruta') | map('dirname') | unique }}"

    - name: Archivos de la foto
      ansible.builtin.copy:
        dest: "{{ w }}/{{ item.ruta }}"
        content: "{{ item.contenido }}"
      loop: "{{ ansible_play_hosts | map('extract', hostvars, 'foto_archivos') | flatten }}"
      loop_control:
        label: "{{ item.ruta }}"

    - name: Commit y push
      ansible.builtin.shell: |
        set -e
        cd {{ w }}
        git add -A
        if git diff --cached --quiet; then
          echo "SIN_CAMBIOS $(git rev-parse HEAD)"
        else
          git -c user.name="registro-estado" -c user.email="registro-estado@invoke.local" \
              commit -q --author="$AUTOR" -m "$MENSAJE"
          git push -q origin HEAD 2>/dev/null
          echo "COMMIT $(git rev-parse HEAD)"
        fi
      environment:
        AUTOR: "{{ autor_nombre | default('registro-estado') }} <{{ autor_correo | default('registro-estado@invoke.local') }}>"
        MENSAJE: "{{ mensaje | default(ansible_play_hosts | join(', ') ~ ' · foto de estado') }}"
      register: r_git

    - name: Resultado
      ansible.builtin.debug:
        msg: "{{ r_git.stdout }}"

    - name: Avisar al panel
      ansible.builtin.uri:
        url: "{{ panel_url }}/api/estado-registro"
        method: POST
        body_format: json
        body:
          id: "{{ registro_id | default('') }}"
          servidores: "{{ ansible_play_hosts }}"
          sha: "{{ r_git.stdout.split()[-1] }}"
          sin_cambios: "{{ r_git.stdout.startswith('SIN_CAMBIOS') }}"
      when: panel_url is defined
      failed_when: false

  always:
    - name: Borrar la copia de trabajo
      ansible.builtin.file:
        path: "{{ w }}"
        state: absent
