  # ───────────────────────────── Prácticas de gestión de servicios (17)
  - nombre: "Gestión de la disponibilidad"
    en: "Availability management"
    grupo: "Prácticas de gestión de servicios"
    estado: cubierta
    antes: cubierta
    evidencia:
      - {t: "Disponibilidad por segmento: redundancia, puntos únicos de falla, RTO/RPO (flotante del mapa)", ep: consola.mapa}
      - {t: "Pilar Disponibilidad del radar y alertas «sin respuesta»", ep: consola.radar_salud}
    falta: ""
    nuevo: "Disponibilidad como criterio de cada segmento (reemplaza la vista global)"
    criterios:
      - {texto: "Disponibilidad del parque (radar)", valor: radar_eq_disponibilidad, minimo: 99}
      - {texto: "Alta disponibilidad en producción", valor: crit_SD3, minimo: 100}
  - nombre: "Análisis de negocio"
    en: "Business analysis"
    grupo: "Prácticas de gestión de servicios"
    estado: "no"
    antes: "no"
    evidencia: []
    falta: "Levantamiento de requisitos de negocio antes del diseño (la solicitud de segmento nuevo solo pide su ficha técnica)"
  - nombre: "Gestión de capacidad y rendimiento"
    en: "Capacity and performance management"
    grupo: "Prácticas de gestión de servicios"
    estado: cubierta
    antes: cubierta
    evidencia:
      - {t: "Prueba de rendimiento del canal en vivo, con carga ×1 a ×20 (mapa del segmento)", ep: consola.mapa}
      - {t: "Pilar Rendimiento del radar y alertas de capacidad", ep: consola.alertas}
      - {t: "Ajustar recursos de máquinas", ep: consola.automatizaciones}
    falta: "Proyección de capacidad (tendencia y fecha de saturación)"
    nuevo: "Prueba de rendimiento del canal con parámetro de carga"
    criterios:
      - {texto: "Equipos con alertas de capacidad", valor: crit_P2, minimo: 80}
      - {texto: "Flujos con latencia bajo el umbral", valor: crit_SP2, minimo: 95}
  - nombre: "Habilitación del cambio"
    en: "Change enablement"
    grupo: "Prácticas de gestión de servicios"
    estado: parcial
    antes: parcial
    evidencia:
      - {t: "Cada cambio es un ticket con aprobación por áreas en AAP", ep: consola.aprobaciones_pendientes}
      - {t: "Trazabilidad de aprobaciones", ep: consola.aprobaciones_traza}
      - {t: "Auditoría de cada acción", ep: consola.auditoria}
      - {t: "Vuelta atrás: volver a una versión desde Git", ep: consola.respaldos}
    falta: "Calendario de cambios y ventanas de mantención"
    nuevo: "La aprobación aparece en la ficha del ticket apenas AAP la crea"
    criterios:
      - {texto: "Cambios de escritura con aprobación", valor: autos_con_aprobacion_pct, minimo: 100}
  - nombre: "Gestión de incidentes"
    en: "Incident management"
    grupo: "Prácticas de gestión de servicios"
    estado: parcial
    antes: parcial
    evidencia:
      - {t: "Incidentes con diagnóstico contra la base de errores conocidos", ep: consola.incidentes}
      - {t: "Remediación automática por EDA (alertas de Grafana, tickets de ServiceNow u Odoo)", ep: consola.alertas}
    falta: "Prioridad y tiempos de respuesta y resolución por prioridad (SLA de incidentes)"
    nuevo: "ServiceNow lanza remediaciones por EDA"
  - nombre: "Gestión de activos de TI"
    en: "IT asset management"
    grupo: "Prácticas de gestión de servicios"
    estado: cubierta
    antes: cubierta
    evidencia:
      - {t: "Servidores físicos y virtuales", ep: consola.inventario}
      - {t: "Licencias y suscripciones", ep: consola.licencias}
      - {t: "Ciclo de vida del fabricante", ep: consola.stack_tecnologico}
    falta: "Costo de adquisición y baja de cada activo"
  - nombre: "Monitoreo y gestión de eventos"
    en: "Monitoring and event management"
    grupo: "Prácticas de gestión de servicios"
    estado: cubierta
    antes: cubierta
    evidencia:
      - {t: "Alertas por objeto configuradas en Ansible y Prometheus", ep: consola.alertas}
      - {t: "Alertmanager → Event-Driven Ansible", ep: consola.integraciones}
      - {t: "Radar de salud", ep: consola.radar_salud}
    falta: ""
    criterios:
      - {texto: "Objetos con alertas configuradas", valor: alertas_cobertura_pct, minimo: 80}
      - {texto: "Equipos con agente de métricas", valor: crit_P1, minimo: 80}
  - nombre: "Gestión de problemas"
    en: "Problem management"
    grupo: "Prácticas de gestión de servicios"
    estado: cubierta
    antes: cubierta
    evidencia:
      - {t: "Errores conocidos con causa, solución, acciones preventivas y automatización asociada", ep: consola.incidentes}
    falta: ""
  - nombre: "Gestión de versiones"
    en: "Release management"
    grupo: "Prácticas de gestión de servicios"
    estado: parcial
    antes: cubierta
    evidencia:
      - {t: "Pipelines DevSecOps con su avance por etapa", ep: consola.devsecops}
      - {t: "Homologación de ambientes", ep: consola.homologacion}
    falta: "Calendario de versiones y notas de versión por entrega"
  - nombre: "Gestión del catálogo de servicios"
    en: "Service catalogue management"
    grupo: "Prácticas de gestión de servicios"
    estado: cubierta
    antes: "no"
    evidencia:
      - {t: "Catálogo de automatizaciones por área, con formulario y estado de prueba", ep: consola.automatizaciones}
      - {t: "Catálogo de diseños de pipeline", ep: consola.devsecops_catalogo}
    falta: ""
  - nombre: "Gestión de la configuración del servicio"
    en: "Service configuration management"
    grupo: "Prácticas de gestión de servicios"
    estado: cubierta
    antes: cubierta
    evidencia:
      - {t: "Inventario recolectado por AAP (equipos, plataformas, servicios, paquetes)", ep: consola.inventario}
      - {t: "Segmentos con arquitectura versionada en Git y flujos entre componentes", ep: consola.mapa}
      - {t: "Respaldo continuo de la configuración en Git, con versiones por máquina", ep: consola.respaldos}
      - {t: "Redes con topología (vecinos LLDP)", ep: consola.redes_arquitectura}
    falta: ""
    nuevo: "Código en Git en la ficha de cada máquina; topología de red"
    criterios:
      - {texto: "Equipos asociados a un segmento de negocio", valor: equipos_con_segmento_pct, minimo: 90}
      - {texto: "Inventario actualizado en los últimos 30 días", valor: inventario_reciente_pct, minimo: 90}
  - nombre: "Gestión de la continuidad del servicio"
    en: "Service continuity management"
    grupo: "Prácticas de gestión de servicios"
    estado: parcial
    antes: parcial
    evidencia:
      - {t: "Respaldos y recuperación (Recuperar servidor, Volver a una versión)", ep: consola.respaldos}
      - {t: "RTO y RPO por segmento y réplica con alta disponibilidad", ep: consola.mapa}
    falta: "Plan de continuidad por segmento y ejercicio de recuperación periódico con resultado medido contra el RTO"
    nuevo: "Recuperar servidor conserva la máquina caída antes de retirarla"
    criterios:
      - {texto: "Máquinas con respaldo continuo", valor: crit_R1, minimo: 100}
      - {texto: "Segmentos con RTO y RPO definidos", valor: segmentos_rto_pct, minimo: 100}
  - nombre: "Diseño del servicio"
    en: "Service design"
    grupo: "Prácticas de gestión de servicios"
    estado: parcial
    antes: "no"
    evidencia:
      - {t: "Solicitud de segmento nuevo con su arquitectura", ep: consola.arquitectura_nueva}
      - {t: "Manifiesto de arquitectura y políticas de desarrollo", ep: consola.manifiesto_arquitectura}
    falta: "Diseño de la experiencia del usuario y de los acuerdos del servicio antes de construirlo"
  - nombre: "Mesa de servicio"
    en: "Service desk"
    grupo: "Prácticas de gestión de servicios"
    estado: cubierta
    antes: "no"
    evidencia:
      - {t: "Herramientas de tickets integradas (ServiceNow, Jira, Odoo, GLPI…)", ep: consola.integraciones, args: {cat: tickets}}
      - {t: "Asistente por chat que abre tickets, también en el teléfono", ep: consola.movil}
    falta: ""
    nuevo: "ServiceNow de punta a punta (formularios que lanzan automatizaciones)"
    criterios:
      - {texto: "Tickets reflejados en la herramienta del cliente", valor: tickets_con_externo_pct, minimo: 80}
  - nombre: "Gestión de niveles de servicio"
    en: "Service level management"
    grupo: "Prácticas de gestión de servicios"
    estado: parcial
    antes: parcial
    evidencia:
      - {t: "Metas de salud por pilar", ep: consola.radar_salud}
      - {t: "RTO y RPO por segmento", ep: consola.mapa}
      - {t: "KPI con meta", ep: consola.kpi_okr}
      - {t: "Gobierno › SLA: SLA por servicio de negocio (disponibilidad, latencia p95, respuesta y resolución P1–P4, aprobación de cambios, dueño, consumidor, vigencia y versión), cada cambio con ticket «Cambio de SLA» aprobado", ep: consola.sla}
      - {t: "Gobierno › Reportes › SLA: cumplimiento del período medido con Prometheus y los tickets, error budget, violaciones con su ticket o alerta, envío mensual e historial", ep: consola.sla_reporte}
    falta: "SLA acordado por servicio y su informe periódico de cumplimiento"
    # app/itil.py: pasa a «cubierta» y el «Falta» deja de aparecer con un SLA vigente aprobado por ticket, el reporte programado y un envío aceptado
    dinamico: sla
    nuevo_dinamico: "SLA acordado por servicio con aprobación y reporte periódico de cumplimiento (Gobierno › SLA y Reportes › SLA)"
    apoyo: "Tablas sla_versiones, sla_mediciones, sla_envios y sla_programa (app/sla.py): cada SLA es una versión aprobada por un ticket «Cambio de SLA» (propuesto → vigente, la anterior queda reemplazada). La disponibilidad y la latencia p95 salen de Prometheus (sonda blackbox del VIP del segmento, job faceops-segmentos, sin ventanas de mantenimiento; sin muestras = «sin medición»); respuesta, resolución y aprobación salen de las marcas de tiempo de los tickets reales del servicio. El error budget sobre el umbral abre la alerta «SLA en riesgo» y baja la salud del segmento; cada objetivo incumplido abre una iniciativa de mejora. Se cuenta cubierta con al menos un SLA vigente aprobado por ticket, el envío programado activo y un envío aceptado por el servidor de correo."
  - nombre: "Gestión de solicitudes de servicio"
    en: "Service request management"
    grupo: "Prácticas de gestión de servicios"
    estado: cubierta
    antes: cubierta
    evidencia:
      - {t: "Cada pedido del catálogo es un ticket con aprobación y trazabilidad", ep: consola.tickets}
    falta: ""
    criterios:
      - {texto: "Tasa de éxito de las solicitudes", valor: tickets_exito_pct, minimo: 95}
  - nombre: "Validación y prueba del servicio"
    en: "Service validation and testing"
    grupo: "Prácticas de gestión de servicios"
    estado: cubierta
    antes: "no"
    evidencia:
      - {t: "Regla de prueba: sin plan de prueba aprobado la automatización queda bloqueada", ep: consola.pruebas_automatizaciones}
      - {t: "La Fábrica corre las pruebas antes de entregar y no entrega con pruebas fallando", ep: consola.fabrica_desarrollo}
    falta: ""
    nuevo: "Pruebas nocturnas de punta a punta; pruebas en pod efímero en la Fábrica"
    criterios:
      - {texto: "Automatizaciones probadas antes de usarse", valor: autos_certificadas_pct, minimo: 90}
  # ───────────────────────────── Prácticas de gestión técnica (3)
  - nombre: "Gestión de despliegues"
    en: "Deployment management"
    grupo: "Prácticas de gestión técnica"
    estado: cubierta
    antes: cubierta
    evidencia:
      - {t: "Pipelines DevSecOps gobernados", ep: consola.devsecops}
      - {t: "Cambio de tráfico con vuelta atrás y despliegue por ambiente", ep: consola.automatizaciones}
