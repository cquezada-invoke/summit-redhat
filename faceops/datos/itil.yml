    falta: "Presupuesto por área contra lo consumido"
  - nombre: "Gestión de la estrategia"
    en: "Strategy management"
    grupo: "Prácticas generales de gestión"
    estado: parcial
    antes: "no"
    evidencia:
      - {t: "Árbol de gobierno de TI por industria y país", ep: consola.gobierno_ti}
      - {t: "OKR", ep: consola.kpi_okr}
