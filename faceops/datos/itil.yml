# ITIL 4 · apego de FaceOps (Monitoreo › ITIL). Las 34 prácticas de ITIL 4 en sus tres grupos.
# Cada práctica:
#   estado    cubierta | parcial | no   → cobertura real hoy en FaceOps (revisión 2026-11-10)
#   antes     cubierta | parcial | no   → lo que declaraba la versión anterior de esta página (2026-11-07: 17 prácticas
#             listadas; una con un criterio «falta en FaceOps» = parcial; una no listada = no)
#   evidencia lista de {t: texto, ep: endpoint de FaceOps, args: {…}} → enlaza la página que lo demuestra
#   falta     qué le falta para quedar cubierta
#   nuevo     qué cambió en FaceOps desde la versión anterior de la página (opcional)
#   criterios (opcional) indicadores medidos con datos reales (app/indicadores.py) contra «minimo» o «maximo»
# Regla del % de apego (app/itil.py): cubierta = 1 · parcial = 0,5 · no = 0; apego = suma / 34 × 100, redondeado.
revision: "2026-11-10"
revision_anterior: "2026-11-07"
corregido:
  - "Seguridad de la información ya no cita la VPN: «VPN y accesos remotos» salió del menú y no se cuenta como evidencia."
  - "Disponibilidad ya no se apoya en una vista global por ambiente: hoy es un criterio de cada segmento de negocio (sección «Disponibilidad» en el flotante del mapa)."
  - "Infraestructura y plataformas ya no cita la «Visión global» (salió del menú de Infraestructura); la evidencia son Centros de datos y Arquitectura."
  - "Despliegues y versiones se separan en dos prácticas, como en ITIL 4; Versiones queda parcial (sin calendario ni notas de versión)."
practicas:
  # ───────────────────────────── Prácticas generales de gestión (14)
  - nombre: "Gestión de la arquitectura"
    en: "Architecture management"
    grupo: "Prácticas generales de gestión"
    estado: cubierta
    antes: "no"
    evidencia:
      - {t: "Manifiesto de arquitectura con nivel de madurez por tecnología y capa", ep: consola.manifiesto_arquitectura}
      - {t: "Arquitecturas por segmento versionadas en Git", ep: consola.mapa}
      - {t: "Árbol de gobierno de TI y plano de control", ep: consola.gobierno_ti}
      - {t: "Racionalización del stack", ep: consola.stack_racionalizacion}
    falta: "Registro formal de decisiones de arquitectura (ADR) con su aprobación"
    nuevo: "Manifiesto con madurez COBIT/CMMI por tecnología y capa; Redes › Arquitectura"
  - nombre: "Mejora continua"
    en: "Continual improvement"
    grupo: "Prácticas generales de gestión"
    estado: parcial
    antes: parcial
    evidencia:
      - {t: "Detalle de madurez: qué falta para la meta, dónde y con qué acción del catálogo", ep: consola.madurez_detalle}
      - {t: "OKR por opción de Monitoreo", ep: consola.kpi_okr}
      - {t: "Radar de salud con brecha a la meta", ep: consola.radar_salud}
      - {t: "Gobierno › Reportes: registro de iniciativas de mejora por área (responsable, fecha compromiso, beneficio esperado y ticket que la cierra)", ep: consola.reportes}
    falta: "Registro de iniciativas de mejora con responsable, fecha y beneficio esperado (el Control de deuda hoy son aprobaciones pendientes, no mejoras)"
    nuevo: "Detalle de madurez por pilar con evidencia y acción que lo resuelve"
    # app/itil.py: pasa a «cubierta» y el «Falta» deja de aparecer cuando hay iniciativas registradas con responsable, fecha y beneficio
    dinamico: iniciativas
    nuevo_dinamico: "Registro de iniciativas de mejora en Gobierno › Reportes"
    apoyo: "Tabla reporte_iniciativas (app/reportes.py): cada pilar de salud bajo 85 % en un área abre una iniciativa con responsable = grupo dueño del área, fecha compromiso (14 días en rojo, 30 en amarillo, editable) y beneficio esperado = puntos que sube el pilar al cumplir sus criterios pendientes (100 − % medido por el Radar de salud). Estado abierta → en curso (primer ticket de una acción del área) → cerrada (una medición deja el pilar en 85 % o más), con el ticket que la cerró. Se cuenta cuando existe al menos una iniciativa con los tres datos."
  - nombre: "Gestión de la seguridad de la información"
    en: "Information security management"
    grupo: "Prácticas generales de gestión"
    estado: cubierta
    antes: cubierta
    evidencia:
      - {t: "Políticas con referencias NIST CSF 2.0 y CIS v8", ep: consola.politicas}
      - {t: "Escaneo de seguridad por servidor, NIST CSF 2.0 y CIS Controls v8", ep: consola.escaneo_seguridad}
      - {t: "CVEs con solicitud de corrección", ep: consola.cves}
      - {t: "Certificados: inventario, reemplazo y revocación", ep: consola.certificados}
      - {t: "Mapa de seguridad", ep: consola.seguridad_mapa}
      - {t: "Doble factor y secretos en bóveda (nunca en FaceOps)", ep: consola.doble_factor}
    falta: "Gestión de incidentes de seguridad con SIEM como flujo propio (hoy el SIEM es una integración)"
    nuevo: "Mapeo explícito a NIST CSF 2.0 y CIS v8; reemplazo de certificados con revocación del anterior"
    criterios:
      - {texto: "Equipos sin hallazgos de seguridad", valor: crit_S1, minimo: 90}
  - nombre: "Gestión del conocimiento"
    en: "Knowledge management"
    grupo: "Prácticas generales de gestión"
    estado: cubierta
    antes: cubierta
    evidencia:
      - {t: "Base de errores conocidos por producto y versión (KB)", ep: consola.incidentes}
      - {t: "Ficha de cada automatización con plan de prueba y evidencia", ep: consola.automatizaciones}
      - {t: "Buenas prácticas por tecnología", ep: consola.buenas_practicas}
    falta: ""
    criterios:
      - {texto: "Errores conocidos registrados", valor: kb_problemas, minimo: 1}
  - nombre: "Medición y reporte"
    en: "Measurement and reporting"
    grupo: "Prácticas generales de gestión"
    estado: parcial
    antes: parcial
    evidencia:
      - {t: "Radar de salud por los 6 pilares", ep: consola.radar_salud}
      - {t: "KPI y OKR", ep: consola.kpi_okr}
      - {t: "Madurez COBIT 2019 / CMMI por pilar", ep: consola.madurez_detalle}
      - {t: "Resumen del contrato con reporte CSV", ep: consola.resumen}
      - {t: "Gobierno › Reportes: cumplimiento por área en los 6 pilares, con tendencia y envío programado al grupo responsable", ep: consola.reportes}
    falta: "Informe periódico enviado automáticamente al cliente (hoy el resumen se genera a pedido)"
    # app/itil.py: pasa a «cubierta» cuando el reporte por área tiene envío programado activo y al menos un envío aceptado por el SMTP
    dinamico: reporte_envio
    nuevo_dinamico: "Reporte de cumplimiento por área enviado de forma programada a cada grupo responsable"
    apoyo: "Tablas reporte_programa y reporte_envios (app/reportes.py): programa semanal por defecto por área (configurable) y registro de cada envío con el resultado del SMTP. Se cuenta con al menos un programa activo y un envío aceptado."
    nuevo: "6 pilares (AWS Well-Architected) y escala de madurez COBIT/CMMI"
  - nombre: "Gestión del cambio organizacional"
    en: "Organizational change management"
    grupo: "Prácticas generales de gestión"
    estado: "no"
    antes: "no"
    evidencia: []
    falta: "Comunicación, capacitación y adopción de los cambios en las personas; fuera del alcance de una consola operativa"
  - nombre: "Gestión del portafolio"
    en: "Portfolio management"
    grupo: "Prácticas generales de gestión"
    estado: parcial
    antes: "no"
    evidencia:
      - {t: "Segmentos de negocio agrupados por área", ep: consola.segmentos}
      - {t: "Racionalización del stack", ep: consola.stack_racionalizacion}
      - {t: "Ciclo de vida de cada tecnología", ep: consola.stack_tecnologico}
    falta: "Portafolio de iniciativas y servicios con priorización por valor e inversión"
  - nombre: "Gestión de proyectos"
    en: "Project management"
    grupo: "Prácticas generales de gestión"
    estado: "no"
    antes: "no"
    evidencia: []
    falta: "Planificación de proyectos (hitos, recursos, avance); los Trabajos de la Fábrica son entregas de software, no proyectos"
  - nombre: "Gestión de relaciones"
    en: "Relationship management"
    grupo: "Prácticas generales de gestión"
    estado: "no"
