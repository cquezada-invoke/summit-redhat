# ITIL 4 · cuánto cumple FaceOps (vista temporal de Monitoreo). Cada práctica: cómo la cubre FaceOps y sus criterios.
# Un criterio con «valor» se mide con datos reales (app/indicadores.py) contra «minimo» (o «maximo»); uno con «cumple»
# es una capacidad del producto (true = existe en FaceOps, false = aún no).
practicas:
  - {nombre: "Gestión de cambios (habilitación del cambio)", grupo: "Gestión de servicios",
     como: "Todo cambio es un ticket con aprobación por áreas en AAP, trazabilidad y vuelta atrás; nada toca una máquina sin pasar por AAP",
     criterios: [{texto: "Cambios de escritura con aprobación", valor: autos_con_aprobacion_pct, minimo: 100},
                 {texto: "Automatizaciones probadas antes de usarse (regla de prueba)", valor: autos_certificadas_pct, minimo: 90},
                 {texto: "Registro de auditoría de cada cambio", cumple: true},
                 {texto: "Calendario de cambios y ventanas de mantención", cumple: false}]}
  - {nombre: "Gestión de solicitudes de servicio", grupo: "Gestión de servicios",
     como: "Catálogo de automatizaciones con formularios; cada pedido es un ticket que se refleja en la herramienta del cliente",
     criterios: [{texto: "Catálogo de servicios publicado", cumple: true},
                 {texto: "Tickets reflejados en la herramienta del cliente", valor: tickets_con_externo_pct, minimo: 80},
                 {texto: "Tasa de éxito de las solicitudes", valor: tickets_exito_pct, minimo: 95}]}
  - {nombre: "Gestión de incidentes", grupo: "Gestión de servicios",
     como: "Incidentes con base de errores conocidos y diagnóstico; remediación automática por EDA con aprobación",
     criterios: [{texto: "Registro de incidentes", cumple: true},
                 {texto: "Remediación automática por eventos (EDA)", cumple: true},
                 {texto: "Acuerdos de tiempo de respuesta por prioridad (SLA de incidentes)", cumple: false}]}
  - {nombre: "Gestión de problemas", grupo: "Gestión de servicios",
     como: "Base de errores conocidos por producto y versión, con causa, solución y automatización asociada",
     criterios: [{texto: "Errores conocidos registrados", valor: kb_problemas, minimo: 1},
                 {texto: "Acciones preventivas por problema", cumple: true}]}
  - {nombre: "Monitoreo y gestión de eventos", grupo: "Gestión de servicios",
     como: "Alertas por objeto configuradas en Ansible y Prometheus; Alertmanager → Event-Driven Ansible",
     criterios: [{texto: "Objetos con alertas configuradas", valor: alertas_cobertura_pct, minimo: 80},
                 {texto: "Equipos con agente de métricas", valor: crit_P1, minimo: 80},
                 {texto: "Eventos que disparan acciones automáticas", cumple: true}]}
  - {nombre: "Gestión de niveles de servicio", grupo: "Gestión de servicios",
     como: "Radar de salud con metas por principio; RTO y RPO por segmento; KPI y OKR en Monitoreo",
     criterios: [{texto: "Metas de salud definidas", cumple: true},
                 {texto: "Segmentos con RTO y RPO definidos", valor: segmentos_rto_pct, minimo: 100},
                 {texto: "Informe periódico de cumplimiento al cliente", cumple: false}]}
  - {nombre: "Gestión de la configuración del servicio (CMDB)", grupo: "Gestión de servicios",
     como: "Inventario recolectado por AAP con sistema, servicios, paquetes, plataformas, flujos y arquitectura por segmento",
     criterios: [{texto: "Equipos asociados a un segmento de negocio", valor: equipos_con_segmento_pct, minimo: 90},
                 {texto: "Inventario actualizado en los últimos 30 días", valor: inventario_reciente_pct, minimo: 90},
                 {texto: "Relaciones entre componentes (flujos y arquitectura)", cumple: true}]}
  - {nombre: "Gestión de activos de TI", grupo: "Gestión de servicios",
     como: "Equipos, licencias y suscripciones, ciclo de vida del fabricante",
     criterios: [{texto: "Licencias y suscripciones", cumple: true},
                 {texto: "Ciclo de vida del fabricante por equipo", cumple: true},
                 {texto: "Equipos con soporte del fabricante", valor: crit_S2, minimo: 90}]}
  - {nombre: "Gestión de la disponibilidad", grupo: "Gestión de servicios",
     criterios: [{texto: "Disponibilidad del parque (radar)", valor: radar_eq_disponibilidad, minimo: 99},
                 {texto: "Alta disponibilidad en producción", valor: crit_SD3, minimo: 100}],
     como: "Disponibilidad por ambiente, alta disponibilidad por componente y alertas de disponibilidad"}
  - {nombre: "Gestión de capacidad y rendimiento", grupo: "Gestión de servicios",
     como: "Uso por equipo y segmento, latencia de flujos, ajuste de recursos y alertas de capacidad",
     criterios: [{texto: "Equipos con alertas de capacidad", valor: crit_P2, minimo: 80},
                 {texto: "Flujos con latencia bajo 20 ms", valor: crit_SP2, minimo: 95}]}
  - {nombre: "Gestión de la continuidad del servicio", grupo: "Gestión de servicios",
     como: "Respaldo continuo en Git, recuperación de servidores, réplica y alta disponibilidad",
     criterios: [{texto: "Máquinas con respaldo continuo", valor: crit_R1, minimo: 100},
                 {texto: "Recuperación probada (automatizaciones certificadas)", cumple: false}]}
  - {nombre: "Gestión de la seguridad de la información", grupo: "Gestión general",
     como: "Bóveda de secretos, doble factor, CVE, certificados, VPN, escaneo de seguridad y políticas",
     criterios: [{texto: "Secretos en bóveda, nunca en FaceOps", cumple: true},
                 {texto: "Doble factor para acceso público", cumple: true},
                 {texto: "Equipos sin hallazgos de seguridad", valor: crit_S1, minimo: 90},
                 {texto: "Usuarios desde una fuente corporativa (AD, LDAP o IGA)", cumple: true}]}
  - {nombre: "Gestión del conocimiento", grupo: "Gestión general",
     como: "Errores conocidos, fichas de cada automatización con su plan de prueba y README en Git",
     criterios: [{texto: "Base de conocimiento", cumple: true}, {texto: "Plan de prueba y evidencia por automatización", cumple: true}]}
  - {nombre: "Medición y reporte", grupo: "Gestión general",
     como: "Radar de salud, KPI y OKR, productividad y créditos",
     criterios: [{texto: "KPI con meta por opción de Monitoreo", cumple: true}, {texto: "OKR definidos", cumple: true},
                 {texto: "Informe mensual automático", cumple: false}]}
  - {nombre: "Mejora continua", grupo: "Gestión general",
     como: "OKR, control de deuda y radar con brecha a la meta",
     criterios: [{texto: "Registro de deuda operativa", cumple: true}, {texto: "Registro de iniciativas de mejora con responsable", cumple: false}]}
  - {nombre: "Gestión de despliegues y versiones", grupo: "Gestión técnica",
     como: "DevSecOps (pipelines), cambio de tráfico, migraciones y homologación de ambientes",
     criterios: [{texto: "Pipelines de CI/CD gobernados", cumple: true}, {texto: "Cambio de tráfico con vuelta atrás", cumple: true}]}
  - {nombre: "Gestión de infraestructura y plataformas", grupo: "Gestión técnica",
     como: "Servidores, redes, storage, hipervisores, OpenShift y nubes operados por AAP",
     criterios: [{texto: "Operación solo vía AAP", cumple: true}, {texto: "Salud del parque (radar)", valor: radar_eq_pct, minimo: 85}]}
