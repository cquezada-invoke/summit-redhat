    evidencia:
      - {t: "Indicador de riesgo crítico en la cabecera (segmentos caídos, seguridad, hallazgos)", ep: consola.radar_salud}
      - {t: "Mapa de seguridad", ep: consola.seguridad_mapa}
      - {t: "Puntos únicos de falla y RTO/RPO por segmento", ep: consola.mapa}
    falta: "Registro de riesgos con dueño, probabilidad, impacto y tratamiento"
  - nombre: "Gestión financiera del servicio"
    en: "Service financial management"
    grupo: "Prácticas generales de gestión"
    estado: cubierta
    antes: "no"
    evidencia:
      - {t: "Resumen del contrato: costo en créditos, beneficio y retorno por área", ep: consola.resumen}
      - {t: "Facturación mensual por ticket y servicio", ep: consola.facturacion}
