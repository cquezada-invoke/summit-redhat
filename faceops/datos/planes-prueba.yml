# Planes de prueba de las automatizaciones (regla de prueba · skill pruebas_automatizacion).
# Cada plan prueba TODA la funcionalidad: un caso por modo, acción o camino relevante (incluido el de error esperado) y su
# verificación. Se ejecuta completo con tickets reales (aprobados por Claude con «Aprobado por Claude (regla de Cristian)»);
# solo con todos los casos ok la versión vigente queda certificada. Si la automatización cambia, se ejecuta de nuevo.
planes:
  "Arquitectura · Evaluar stack tecnológico":
    casos:
      - {id: C1, caso: "Barrido de todo el parque (con máquinas apagadas en el inventario)", verificar: "ticket exitoso; las apagadas quedan fuera sin hacer fallar al resto; evaluación nueva con filas por máquina"}
      - {id: C2, caso: "Informe de obsolescencia", verificar: "PDF del barrido disponible y con contenido"}
      - {id: C3, caso: "Repetir el barrido", verificar: "solo lectura e idempotente: segunda evaluación con las mismas máquinas y tecnologías"}
  "DevSecOps · Pipeline Tekton":
    casos:
      - {id: C1, caso: "estado de un pipeline", verificar: "lee sus últimas ejecuciones sin cambiar nada"}
      - {id: C2, caso: "aplicar desde Git", verificar: "el Pipeline queda aplicado en el clúster con el contenido de Git"}
      - {id: C3, caso: "ejecutar en una rama de Gitflow", verificar: "PipelineRun creado y terminado; FaceOps muestra su avance y resultado"}
      - {id: C4, caso: "acción inválida o URL fuera del Git interno", verificar: "se rechaza en la validación sin tocar el clúster"}
  "Satellite · Incorporar RHEL":
    casos:
      - {id: C1, caso: "Registrar un RHEL registrado en Red Hat (CDN)", verificar: "subscription-manager identity contra el Satellite; datos.satellite marcado"}
      - {id: C2, caso: "Registrar un RHEL recién convertido (nombre localhost)", verificar: "hostname corregido y registrado"}
      - {id: C3, caso: "Repetir sobre una máquina ya registrada en ese Satellite", verificar: "no la vuelve a registrar (idempotente)"}
  "Satellite · Convertir a RHEL":
    casos:
      - {id: C1, caso: "Rocky 9 recién creada → RHEL 9 y registrada en Satellite", verificar: "/etc/redhat-release RHEL; registrada en Satellite"}
      - {id: C2, caso: "Falla en la conversión", verificar: "vuelve al snapshot y la máquina queda como estaba"}
  "VPN · Gestionar acceso":
    casos:
      - {id: C1, caso: "Crear cliente", verificar: "rango 10.66.N.0/24 asignado"}
      - {id: C2, caso: "Crear usuario con todo un segmento y con IPs puntuales", verificar: "par en wg0, reglas nft por usuario, configuración en la bóveda"}
      - {id: C3, caso: "Túnel: llega a su segmento y no al resto", verificar: "ping permitido y bloqueado"}
      - {id: C4, caso: "Vencimiento", verificar: "el servidor lo corta solo en menos de 2 minutos"}
      - {id: C5, caso: "Extender vigencia", verificar: "vuelve a estar vigente"}
      - {id: C6, caso: "Revocar", verificar: "deja de estar en wg0"}
  "OpenShift · Modelo de alertamiento":
    casos:
      - {id: C1, caso: "evaluar", verificar: "monitoreo disponible; no cambia nada"}
      - {id: C2, caso: "aplicar", verificar: "3 PrometheusRule faceops-* aceptadas por Prometheus (sin errores de evaluación) y receptor faceops-eda en Alertmanager"}
      - {id: C3, caso: "Aviso real: pod en crash loop en un namespace de prueba", verificar: "alerta FaceOpsPodEnCrashLoopAviso disparada → EDA lanza el diagnóstico"}
      - {id: C4, caso: "Crítico real: el mismo pod sobre el umbral crítico", verificar: "EDA lanza el workflow con aprobación; aprobado, reinicia el pod"}
      - {id: C5, caso: "aplicar de nuevo", verificar: "idempotente (mismas reglas, sin duplicar receptor)"}
      - {id: C6, caso: "retirar", verificar: "sin reglas faceops-* ni receptor; Alertmanager sano"}
  "OpenShift · Remediar alerta":
    casos:
      - {id: C1, caso: "diagnosticar", verificar: "eventos del objeto, sin cambios"}
      - {id: C2, caso: "reiniciar-pod en namespace de prueba", verificar: "el pod se recrea"}
      - {id: C3, caso: "escalar deployment de prueba", verificar: "réplicas +1 y respeta el tope"}
      - {id: C4, caso: "expandir-pvc de prueba", verificar: "capacidad +25 % (o error claro si la StorageClass no permite)"}
      - {id: C5, caso: "cordonar-nodo (y descordonar al final)", verificar: "unschedulable true"}
      - {id: C6, caso: "Acción que cambia algo sobre openshift-*", verificar: "se rechaza"}
  "Infra · Cargar imágenes base al registro":
    casos:
      - {id: C1, caso: "Solo revisar (ri_solo_revisar=true)", verificar: "informa imágenes en uso y las que faltan; el registro no cambia"}
      - {id: C2, caso: "Cargar: rhel9-base.qcow2 (base de srv-prueba-rhel9-01) no está con su huella", verificar: "queda imagen-rhel9-base sha-<12> en el registro con el mismo sha256; el punto de la 91 muestra «misma huella»"}
      - {id: C3, caso: "Repetir la carga", verificar: "no sube nada (idempotente): todas ya están con su huella"}
  "Infra · Preparar centro de datos emulado":
    casos:
      - {id: C1, caso: "Crear el centro Valparaíso (valpo, 192.168.150)", verificar: "red dc-valpo activa con autoinicio y pool dc-valpo en /var/lib/libvirt/dc-valpo"}
      - {id: C2, caso: "Repetir", verificar: "idempotente: sin cambios"}
      - {id: C3, caso: "Clave o red no válidas", verificar: "se rechaza sin tocar nada"}
  "Infra · Mover máquina entre centros de datos":
    casos:
      - {id: C1, caso: "evaluar Santiago → Valparaíso", verificar: "tamaño, espacio y tiempo estimado; no cambia nada"}
      - {id: C2, caso: "mover Santiago → Valparaíso", verificar: "IP 192.168.150.x, responde por SSH; origen apagada como <nombre>-origen; ubicación e IP actualizadas en AAP y FaceOps"}
      - {id: C3, caso: "revertir", verificar: "vuelve la de origen con su IP de Santiago; ubicación de vuelta a Santiago; la copia del destino y sus discos se retiran"}
      - {id: C4, caso: "mover de nuevo y confirmar", verificar: "la de origen y sus discos se retiran"}
      - {id: C5, caso: "mover Valparaíso → Santiago", verificar: "vuelve a 192.168.122.x y a Santiago"}
      - {id: C6, caso: "Destino donde ya está, o máquina protegida (nodo-vault, sno)", verificar: "se rechaza sin tocar nada"}
  "FaceOps · Agregar disco":
    casos:
      - {id: C1, caso: "Disco nuevo en una máquina del inventario «Servidores habilitados» (nodo-storage, 100 GB, /srv/datalake)", verificar: "conectado con su serie, particionado, XFS y montado en /srv/datalake (fstab por UUID)"}
      - {id: C2, caso: "Repetir con el mismo disco y serie", verificar: "idempotente: no crea otro volumen ni reformatea; sigue montado"}
      - {id: C3, caso: "Máquina del inventario «Nodos demo» (disco ya existente de una prueba anterior)", verificar: "sigue funcionando con el inventario construido"}
  "Storage · Servicio S3 del data lake":
    casos:
      - {id: C1, caso: "Sin disco dedicado (directorio en la raíz)", verificar: "se rechaza sin instalar nada"}
      - {id: C2, caso: "Instalar en nodo-storage sobre /srv/datalake (disco de «FaceOps · Agregar disco»)", verificar: "servicio lake-s3 activo y habilitado; responde 9000 y 8888; firewall solo a los clientes indicados"}
      - {id: C3, caso: "Repetir instalar", verificar: "sin cambios; el servicio no se reinicia"}
      - {id: C4, caso: "Usarlo como S3 del lake (Trino y aplicaciones) y reiniciar el equipo", verificar: "los datos persisten en el disco; el servicio vuelve solo; Trino lee las tablas"}
      - {id: C5, caso: "Modo estado y datos no válidos (CIDR mal escrito)", verificar: "estado informa uso del disco sin cambios; CIDR inválido se rechaza"}
  "Fiscalía · Aviso de complemento":
    casos:
      - {id: C1, caso: "«Pedir complemento por correo» en una denuncia incompleta", verificar: "trabajo OK; llega el correo con lo que falta y el enlace; evento en el lake con el número de trabajo"}
      - {id: C2, caso: "Abrir el enlace y enviar el complemento (fecha, colonia, una imagen)", verificar: "la denuncia queda actualizada en el lake sin duplicarse; imagen analizada; etapa «Complemento recibido»; sube la coherencia"}
      - {id: C3, caso: "Enlace con firma alterada", verificar: "se rechaza; no cambia nada"}
      - {id: C4, caso: "Lanzar la plantilla con un folio o enlace inválido", verificar: "falla la validación y no se envía correo"}
  "OpenShift · Relevamiento de imágenes":
    casos:
      - {id: C1, caso: "Relevamiento con los valores por defecto sobre el SNO", verificar: "informe completo: en uso, registro, caché, antiguas, replicadas; cifras coinciden con oc get pods/is y crictl images"}
      - {id: C2, caso: "Imagen sin uso conocida (ImageStream de prueba sin despliegue)", verificar: "aparece como sin uso en el registro"}
      - {id: C3, caso: "Umbral corto (30 días) y 1 revisión", verificar: "más antiguas y más ImageStreams con exceso de revisiones; no cambia nada en el clúster"}
      - {id: C4, caso: "Umbral no válido (10 días)", verificar: "se rechaza"}
  "Homologación · Relevar entorno":
    casos:
      - {id: C1, caso: "Relevar las máquinas JBoss de desarrollo, QA y producción de un mismo segmento", verificar: "cada una con su huella: sistema, entorno, Java y JBoss (versión, JVM, módulos, drivers, datasources, deployments, huella de configuración)"}
      - {id: C2, caso: "Comparar los valores contra la máquina (rpm, java -version, standalone.xml, /proc/<pid>)", verificar: "coinciden; ninguna contraseña ni URL de conexión en la salida"}
      - {id: C3, caso: "Cambiar una condición de la máquina de QA por FaceOps (memoria con «Infra · Ajustar recursos de máquinas») y volver a relevar", verificar: "la homologación muestra la desviación con su severidad y recomendación; se revierte el cambio por FaceOps"}
      - {id: C4, caso: "Máquina sin JBoss y máquina con JBoss detenido", verificar: "sin JBoss: solo huella del sistema, o FaceOps no la ofrece si el equipo no es servidor (p. ej. almacenamiento) / JBoss marcado detenido, sin error"}
      - {id: C5, caso: "Repetir", verificar: "sin cambios (solo lectura)"}
  # ── Planes agregados el 2026-11-07 para las automatizaciones que no tenían plan (regla de prueba)
  "OpenShift · Remediar alerta (con aprobación)":
    casos:
      - {id: C1, caso: "Alerta crítica real (crash loop del modelo de alertamiento) llega a EDA", verificar: "EDA lanza el workflow con los datos de la alerta (namespace, pod, acción)"}
      - {id: C2, caso: "Aprobar en AAP", verificar: "corre la acción (reiniciar-pod) y el pod se recrea"}
      - {id: C3, caso: "Rechazar la aprobación de un segundo disparo", verificar: "el workflow termina sin ejecutar la acción; el pod no cambia"}
  "FaceOps · Ampliar disco":
    casos:
      - {id: C1, caso: "Ampliar 5 GB el disco de datos de prueba de nodo-storage (/srv/prueba-ad)", verificar: "el volumen crece en el hipervisor, la partición y el XFS crecen en línea; el montaje sigue y los datos están"}
      - {id: C2, caso: "Repetir con el mismo tamaño final", verificar: "idempotente: no vuelve a crecer"}
      - {id: C3, caso: "Tamaño menor al actual", verificar: "se rechaza: no se reduce un disco"}
  "Infra · Agregar disco (anfitrión)":
    casos:
      - {id: C1, caso: "Agregar un disco de 5 GB del pool del anfitrión a una máquina de prueba", verificar: "virsh domblklist muestra el disco nuevo con su serie; la máquina lo ve (lsblk)"}
      - {id: C2, caso: "Repetir con la misma serie", verificar: "no crea un segundo volumen"}
      - {id: C3, caso: "Pool inexistente", verificar: "falla controlada sin tocar la máquina"}
  "Infra · Ampliar disco (anfitrión)":
    casos:
      - {id: C1, caso: "Ampliar 5 GB un disco de datos con la máquina encendida", verificar: "virsh domblkinfo con el tamaño nuevo; la máquina ve el tamaño nuevo"}
      - {id: C2, caso: "Tamaño menor o igual", verificar: "se rechaza sin cambios"}
  "Sistema · Ampliar disco en la máquina":
    casos:
      - {id: C1, caso: "Tras ampliar el disco en el anfitrión, crecer partición y sistema de archivos (XFS)", verificar: "df muestra el tamaño nuevo sin desmontar"}
      - {id: C2, caso: "Repetir", verificar: "sin cambios"}
      - {id: C3, caso: "Punto de montaje inexistente", verificar: "falla controlada"}
  "Sistema · Preparar disco nuevo":
    casos:
      - {id: C1, caso: "Disco nuevo sin particiones: particionar, XFS y montar por UUID", verificar: "findmnt con XFS; fstab por UUID"}
      - {id: C2, caso: "Repetir sobre el mismo disco", verificar: "no reformatea; sigue montado con el mismo UUID"}
      - {id: C3, caso: "Disco con datos o del sistema", verificar: "se rechaza sin formatear"}
  "FaceOps · Apagar equipo":
    casos:
      - {id: C1, caso: "Apagar una máquina de prueba vacía y encendida (srv-test-ubuntu-01), con aprobación", verificar: "en 1 minuto queda apagada en el anfitrión"}
      - {id: C2, caso: "Repetir con la máquina ya apagada", verificar: "falla controlada (inalcanzable) sin efectos en otras máquinas"}
  "Despliegue · Cambiar tráfico":
    casos:
      - {id: C1, caso: "blue-green: todo a verde", verificar: "las peticiones medidas llegan 100 % al grupo verde"}
      - {id: C2, caso: "canary 50 %", verificar: "entre 35 % y 65 % de 200 peticiones medidas en el balanceador llegan al verde"}
      - {id: C3, caso: "ab por cookie", verificar: "con la cookie b todas van al verde y sin cookie todas al azul"}
      - {id: C4, caso: "shadow", verificar: "las respuestas salen del azul (100 %) y la configuración espeja al verde"}
      - {id: C5, caso: "volver todo a azul", verificar: "100 % azul; configuración del balanceador válida (nginx -t)"}
  "Migración · CentOS a RHEL":
    casos:
      - {id: C1, caso: "Rocky 9 de prueba recién creada (Habilitar servidor) → RHEL con política mínimo y snapshot", verificar: "/etc/redhat-release RHEL; registrada; responde por SSH"}
      - {id: C2, caso: "Destino no válido (versión 99)", verificar: "se rechaza antes de tocar la máquina (sin snapshot ni cambios)"}
      - {id: C3, caso: "Repetir sobre la máquina ya convertida", verificar: "no hace nada (sin acción)"}
  "Migración · RHEL a versión soportada":
    casos:
      - {id: C1, caso: "RHEL 8 de prueba: evaluar con análisis oficial (Leapp preupgrade)", verificar: "semáforo e informe de Leapp; la máquina no cambia"}
      - {id: C2, caso: "RHEL 8 con política mínimo (migrar)", verificar: "queda en la última menor con parches; responde por SSH"}
      - {id: C3, caso: "RHEL 8 con política última (salto a 9 con Leapp y snapshot)", verificar: "RHEL 9; registrada; responde por SSH"}
      - {id: C4, caso: "Repetir con la máquina ya en la versión de la política", verificar: "sin cambios"}
  "Ciclo de vida · Evaluar destino":
    casos:
      - {id: C1, caso: "Java 17 → 21 en nodo-jboss-dev", verificar: "semáforo con versión instalada, destino en repositorios, disco y memoria; no cambia nada (mismos paquetes antes y después)"}
      - {id: C2, caso: "Destino inexistente", verificar: "semáforo rojo explicando por qué"}
      - {id: C3, caso: "Repetir", verificar: "mismo resultado (solo lectura)"}
  "Monitoreo · Exportador en Windows":
    casos:
      - {id: C1, caso: "Instalar windows_exporter en nodo-windows", verificar: "servicio corriendo y /metrics responde en 9182"}
      - {id: C2, caso: "Repetir", verificar: "idempotente"}
  "Windows · Preparar IIS":
    casos:
      - {id: C1, caso: "Instalar IIS y el sitio de prueba en nodo-windows", verificar: "W3SVC corriendo; el sitio responde 200"}
      - {id: C2, caso: "Repetir", verificar: "idempotente"}
  "Migración · IIS a OpenShift":
    casos:
      - {id: C1, caso: "evaluar en nodo-windows", verificar: "inventario de sitios, pools y versión de .NET con su clasificación; no cambia nada"}
      - {id: C2, caso: "migrar", verificar: "se rechaza con el aviso de que está en construcción"}
  "OpenShift · Habilitar OpenShift Virtualization":
    casos:
      - {id: C1, caso: "evaluar en ocp-sno", verificar: "prerrequisitos (virtualización anidada, storage, CPU) con semáforo; no cambia nada"}
      - {id: C2, caso: "instalar", verificar: "operador y HyperConverged disponibles; una VM de prueba arranca"}
      - {id: C3, caso: "instalar de nuevo", verificar: "idempotente"}
  "OpenShift · Habilitar clúster":
    casos:
      - {id: C1, caso: "Habilitar ocp-sno en FaceOps (credencial en la bóveda e inventario)", verificar: "el clúster queda con su API y token en AAP; las acciones de OpenShift lo alcanzan"}
      - {id: C2, caso: "Repetir", verificar: "no duplica inventario ni credencial"}
      - {id: C3, caso: "API inalcanzable", verificar: "falla controlada"}
  "FaceOps · Incorporar máquinas":
    casos:
      - {id: C1, caso: "Incorporar las máquinas de un proyecto GCP de laboratorio", verificar: "usuario de servicio en cada máquina; llave solo en AAP; FaceOps las inventaría"}
      - {id: C2, caso: "Repetir", verificar: "idempotente"}
      - {id: C3, caso: "Credencial de nube inválida", verificar: "falla controlada sin tocar máquinas"}
  "Satellite · Instalar":
    casos:
      - {id: C1, caso: "Paso del workflow «Satellite · Instalar servidor» sobre una RHEL de prueba con 4 vCPU y 20 GB", verificar: "satellite-installer termina; hammer ping ok"}
      - {id: C2, caso: "Repetir", verificar: "idempotente"}
  "Satellite · Actualizar":
    casos:
      - {id: C1, caso: "Actualizar el Satellite de prueba a la versión siguiente", verificar: "chequeos previos ok, snapshot, satellite-maintain upgrade; hammer ping ok"}
      - {id: C2, caso: "Versión no disponible", verificar: "se detiene en los chequeos sin tocar nada"}
  "DC · Satellite":
    casos:
      - {id: C1, caso: "Alta del Satellite del centro de datos en FaceOps", verificar: "queda como plataforma con su URL y credencial en la bóveda"}
      - {id: C2, caso: "Repetir", verificar: "idempotente"}
  "VPN · Instalar":
    casos:
      - {id: C1, caso: "Paso del workflow «VPN · Preparar servidor» sobre una máquina de prueba", verificar: "WireGuard arriba; wg0 con su llave en la bóveda"}
      - {id: C2, caso: "Repetir", verificar: "idempotente"}
  "Migración · JBoss a EAP 8":
    casos:
      - {id: C1, caso: "evaluar nodo-jboss-dev (EAP 7.4) con sus aplicaciones", verificar: "informe de compatibilidad (MTA) por aplicación; no cambia nada"}
      - {id: C2, caso: "migrar a un destino de prueba", verificar: "EAP 8 con las aplicaciones desplegadas respondiendo; origen intacto"}
      - {id: C3, caso: "Origen sin JBoss", verificar: "falla controlada"}
  "JBoss · Preparar servidor":
    casos:
      - {id: C1, caso: "Instalar JBoss EAP en una RHEL de prueba", verificar: "servicio activo, consola de administración responde, credenciales en la bóveda"}
      - {id: C2, caso: "Repetir", verificar: "idempotente"}
  "Vault · Preparar servidor":
    casos:
      - {id: C1, caso: "Instalar Vault en una RHEL de prueba", verificar: "Vault inicializado y desellado; llaves en lugar seguro; /v1/sys/health 200"}
      - {id: C2, caso: "Repetir", tipo: Idempotencia, verificar: "no reinicializa: FaceOps ya no la ofrece en un equipo con Vault, o si corre deja el mismo archivo de inicio"}
  "Storage · Preparar emulador":
    casos:
      - {id: C1, caso: "Preparar el emulador de SAN en nodo-storage", verificar: "targets iSCSI disponibles; las acciones de Storage pueden crear volúmenes"}
      - {id: C2, caso: "Repetir", verificar: "idempotente"}
  "Migración K8s → OpenShift · Evaluar origen":
    casos:
      - {id: C1, caso: "Evaluar un namespace de prueba en un clúster Kubernetes de origen", verificar: "inventario y semáforo; nada cambia en el origen"}
      - {id: C2, caso: "Namespace inexistente", verificar: "informe vacío sin error"}
  "Migración K8s → OpenShift · Preparar destino":
    casos:
      - {id: C1, caso: "Preparar OpenShift destino para el namespace de prueba", verificar: "proyecto con cuota, SCC, StorageClass equivalente y OADP con bucket"}
      - {id: C2, caso: "Repetir", verificar: "idempotente"}
  "Migración K8s → OpenShift · Convertir manifiestos":
    casos:
      - {id: C1, caso: "Convertir el namespace de prueba", verificar: "Pull Request con Route en vez de Ingress y securityContext compatible; nada aplicado"}
  "Migración K8s → OpenShift · Migrar aplicación":
    casos:
      - {id: C1, caso: "Migrar con respaldo (Velero → OADP) incluyendo datos", verificar: "pods arriba en OpenShift con los datos; el origen sigue atendiendo"}
      - {id: C2, caso: "Migrar con GitOps", verificar: "aplicación sincronizada desde el repositorio"}
  "Migración K8s → OpenShift · Validar y conmutar":
    casos:
      - {id: C1, caso: "conmutar", verificar: "pruebas de humo ok, DNS al destino, origen escalado a cero"}
      - {id: C2, caso: "revertir", verificar: "tráfico de vuelta al origen"}
  "Nube · Solicitar VM con aprobación":
    casos:
      - {id: C1, caso: "VM tamaño S en el proyecto GCP de laboratorio", verificar: "aprobación en AAP; VM creada con etiquetas de FaceOps; aparece en el inventario"}
      - {id: C2, caso: "Rechazar la aprobación", verificar: "no se crea nada"}
  "Nube · Prueba: crear huérfanos":
    casos:
      - {id: C1, caso: "Crear recursos huérfanos de prueba (disco e IP sin uso)", verificar: "existen en el proyecto con la etiqueta de prueba"}
  "Nube · Prueba: regla peligrosa":
    casos:
      - {id: C1, caso: "Crear una regla de firewall 0.0.0.0/0:22 de prueba", verificar: "existe; «Nube · Vigilar firewall» la detecta"}
  "Nube · Reporte de huérfanos con limpieza":
    casos:
      - {id: C1, caso: "Reporte con los huérfanos de prueba", verificar: "los lista con su costo"}
      - {id: C2, caso: "Aprobar la limpieza", verificar: "solo se borran los huérfanos de prueba"}
      - {id: C3, caso: "Rechazar la limpieza", verificar: "no se borra nada"}
  "Red · Revocar acceso con aprobación":
    casos:
      - {id: C1, caso: "Revocar un acceso abierto antes por «Red · Solicitar acceso con aprobación»", verificar: "la regla sale del firewall (Git) y la conexión deja de funcionar"}
      - {id: C2, caso: "Acceso inexistente", verificar: "falla controlada"}
  "Remediación · Rollback con aprobación":
    casos:
      - {id: C1, caso: "Romper la aplicación de prueba con una versión mala y pedir rollback", verificar: "aprobación; vuelve a la versión validada y responde 200"}
      - {id: C2, caso: "Rechazar", verificar: "no se toca nada"}
  "FaceOps · Recuperar servidor":
    casos:
      - {id: C1, caso: "Borrar una máquina de prueba con respaldo en Git (agente) y recuperarla", verificar: "misma IP y nombre, paquetes y configuración restaurados (diff contra el respaldo)"}
      - {id: C2, caso: "Borrar una máquina de prueba SIN agente, solo con su repositorio propio (inventario diario, rama master), y recuperarla", verificar: "paquetes, usuarios, configuración de sistema y de productos, SELinux y servicios como en el último commit de master; no instala el agente"}
      - {id: C3, caso: "Máquina sin respaldo", verificar: "se rechaza"}
      - {id: C4, caso: "Simular caída de srv-prueba-rhel9-01 (apagada) y recuperar desde un punto con «Recuperar en máquina nueva»", verificar: "réplica con el mismo nombre, sistema y versión; paquetes, configuración, carpetas (directorio-creado), software sin paquete y secretos del punto; la caída queda como srv-prueba-rhel9-01-fallida-<fecha>, apagada; RTO y RPO quedan en el punto"}
  "FaceOps · Volver a una versión":
    casos:
      - {id: C1, caso: "Cambiar un archivo de configuración y volver a la versión anterior del historial (agente)", verificar: "el archivo vuelve a su contenido; el resto no cambia"}
      - {id: C2, caso: "Igual, sobre una máquina sin agente: cambiar un archivo, inventariar, volver al commit anterior de master", verificar: "el archivo vuelve a su contenido"}
      - {id: C3, caso: "Versión inexistente", verificar: "falla controlada"}
  "PostgreSQL · Preparar servidor":
    casos:
      - {id: C1, caso: "Instalar en una máquina RHEL 9 de prueba", verificar: "servicio arriba, puerto 5432 abierto, la clave queda en la bóveda (web/<equipo>/postgres) y no aparece en la salida; la máquina muestra la plataforma"}
      - {id: C2, caso: "Repetir en la misma máquina", verificar: "idempotente: no cambia la clave ni reinstala"}
      - {id: C3, caso: "Máquina no compatible (Windows o RHEL 7)", verificar: "no se ofrece o falla controlada"}
  "MySQL · Preparar servidor":
    casos:
      - {id: C1, caso: "Instalar en una máquina RHEL 9 de prueba", verificar: "servicio arriba, puerto 3306 abierto, la clave queda en la bóveda (web/<equipo>/mysql) y no aparece en la salida; la máquina muestra la plataforma"}
      - {id: C2, caso: "Repetir en la misma máquina", verificar: "idempotente: no cambia la clave ni reinstala"}
      - {id: C3, caso: "Máquina no compatible (Windows o RHEL 7)", verificar: "no se ofrece o falla controlada"}
  "MongoDB · Preparar servidor":
    casos:
      - {id: C1, caso: "Instalar en una máquina RHEL 9 de prueba", verificar: "servicio arriba, puerto 27017 abierto, la clave queda en la bóveda (web/<equipo>/mongodb) y no aparece en la salida; la máquina muestra la plataforma"}
      - {id: C2, caso: "Repetir en la misma máquina", verificar: "idempotente: no cambia la clave ni reinstala"}
      - {id: C3, caso: "Máquina no compatible (Windows o RHEL 7)", verificar: "no se ofrece o falla controlada"}
  "Sistema · Quitar agente":
    casos:
      - {id: C1, caso: "Quitar el respaldo continuo de una máquina de prueba que lo tiene", verificar: "timers y scripts retirados; la rama en Git se conserva; la sección Agentes lo muestra como no instalado"}
      - {id: C2, caso: "Quitar node_exporter", verificar: "servicio y binario retirados; puerto 9100 cerrado"}
      - {id: C3, caso: "Agente desconocido", verificar: "falla controlada sin tocar la máquina"}
  "Sistema · Inventariar máquina":
    casos:
      - {id: C1, caso: "RHEL 9 sin repositorio propio (srv-prueba-rhel9-01)", verificar: "crea repositorio/maquina-<nombre> rama master con archivos/ (etc, cron) y meta/ (paquetes, servicios, SELinux, usuarios, permisos, sistema); sin secretos (shadow, llaves)"}
      - {id: C2, caso: "Repetir sin cambios", verificar: "no hace commit (CAMBIOS=0)"}
      - {id: C3, caso: "Cambiar un archivo de /etc y repetir", verificar: "un commit con solo ese archivo en el mensaje; aparece en «4 · Configuración» del punto nuevo"}
      - {id: C4, caso: "Máquina con JBoss EAP 8 por RPM y con JBoss desde zip en /opt (nodo-jboss, srv-legado-jboss7-01)", verificar: "standalone/configuration y deployments en archivos/; data, tmp y log excluidos; archivos sobre 25 MB en meta/omitidos.txt con su huella"}
      - {id: C5, caso: "RHEL 5 o 6 (Python antiguo)", verificar: "la instantánea llega por la salida estándar (base64) y queda igual que en RHEL 9"}
      - {id: C6, caso: "Windows con IIS (srv-pn-win-01)", verificar: "applicationHost.config, sitios y pools, programas instalados, características, servicios y tareas en el repositorio"}
      - {id: C7, caso: "Datos del sistema y paquetes (partes 1 y 2)", verificar: "sin cambios respecto de antes: facts, paquetes con su fuente y respaldo de RPM"}
      - {id: C8, caso: "Cobertura: crear /data/prueba (pequeña), /app-grande (sobre 200 MB) y un binario sin paquete en /opt/herramienta", verificar: "la pequeña entra sola a Git; la grande y el binario quedan en el registro como artefacto maquina-<nombre> con su huella; el punto muestra 7 · Cobertura"}
      - {id: C9, caso: "Repetir sin cambios", verificar: "no vuelve a subir artefactos (ART_OK) ni crea versión nueva en la bóveda (igual)"}
      - {id: C10, caso: "Secretos: un .jks y una llave TLS en la configuración", verificar: "no aparecen en Git; quedan en la bóveda en maquinas/<nombre>/archivos; cobertura «cubierto»"}
      - {id: C11, caso: "Recuperar la máquina de C8 a C10 sin agente", verificar: "vuelven configuración, rutas, software sin paquete y secretos; tiempo de recuperación medido"}
  "SQL Server · Configurar alta disponibilidad":
    casos:
      - {id: C1, caso: "AG síncrono entre dc1-sql01 y dc2-sql01 con una base de prueba", verificar: "réplicas sincronizadas; la marca escrita en el primario se lee en la secundaria"}
      - {id: C2, caso: "Repetir", verificar: "idempotente"}
  "SQL Server · Conmutar réplica primaria":
    casos:
      - {id: C1, caso: "Conmutar a dc2-sql01", verificar: "sin pérdida de datos; tiempo sin escritura medido; el nuevo primario escribe"}
      - {id: C2, caso: "Conmutar de vuelta (reversa)", verificar: "dc1-sql01 primario otra vez"}
  "DC · Active Directory":
    casos:
      - {id: C1, caso: "Preparar el controlador de dominio de laboratorio (dc1-ad01)", verificar: "dominio arriba; DNS resuelve; un usuario de prueba autentica"}
      - {id: C2, caso: "Repetir", verificar: "idempotente"}
  "DC · Configurar IGA":
    casos:
      - {id: C1, caso: "Configurar el IGA de laboratorio (dc1-iga01) con el directorio", verificar: "sincroniza identidades del directorio; una alta de prueba se propaga"}
  "DC · midPoint":
    casos:
      - {id: C1, caso: "Instalar midPoint en dc1-iga01", verificar: "consola responde; conector al directorio configurado"}
      - {id: C2, caso: "Repetir", verificar: "idempotente"}
  "Red · Actualizar firmware":
    casos:
      - {id: C1, caso: "Actualizar el firmware de un equipo de red real (o su emulador del fabricante)", verificar: "versión nueva; configuración intacta; vuelta atrás disponible"}
  "Plataforma · Actualizar firmware":
    casos:
      - {id: C1, caso: "Actualizar BIOS/BMC de un servidor físico real vía Redfish", verificar: "versión nueva; servidor arriba"}
  "OpenShift · Validar e instalar IPI VMware":
    casos:
      - {id: C1, caso: "validar contra un vCenter de laboratorio", verificar: "permisos, red, datastore y cuota con semáforo"}
      - {id: C2, caso: "instalar", verificar: "clúster creado y habilitado en FaceOps"}
  "Monitoreo · Configurar alertas del equipo":
    casos:
      - {id: C1, caso: "Activar en un servidor Linux con agente (nodo-jboss): sin respuesta, CPU, memoria y disco con umbrales", tipo: Funcional, verificar: "reglas faceops-<equipo> cargadas en Prometheus (api/v1/rules), objetivo con up=1 y la ficha muestra el botón con 4 alertas"}
      - {id: C2, caso: "Disparo real: umbral de disco bajo el uso actual (aviso 1 %)", tipo: Funcional, verificar: "la alerta pasa a firing en Prometheus y llega a Alertmanager con faceops_equipo y severity"}
      - {id: C3, caso: "Ajustar umbrales y quitar una alerta", tipo: Funcional, verificar: "las reglas reflejan los umbrales nuevos y la alerta quitada ya no existe"}
      - {id: C4, caso: "Repetir el mismo pedido", tipo: Idempotencia, verificar: "mismas reglas, sin duplicar trabajos en prometheus.yml"}
      - {id: C5, caso: "Equipo de red (sondeo TCP) y storage (nodo-storage)", tipo: Funcional, verificar: "probe_success del sondeo y reglas del storage cargadas"}
      - {id: C6, caso: "Equipo sin agente de monitoreo o apagado", tipo: Error controlado, verificar: "falla con el mensaje de instalar el agente y no cambia nada en Prometheus"}
      - {id: C7, caso: "Umbral inválido (aviso mayor que crítico)", tipo: Error controlado, verificar: "FaceOps lo rechaza antes del ticket; el playbook también lo rechaza y vuelve atrás"}
      - {id: C8, caso: "Retirar todas las alertas del equipo", tipo: Funcional, verificar: "sin reglas ni objetivo del equipo; Prometheus sano; el botón vuelve a «sin alertas»"}
      - {id: C9, caso: "Acción por alerta: «Encender el equipo» en «Sin respuesta» y «Solo avisar» en «Disco lleno»", tipo: Funcional, verificar: "la regla lleva faceops_accion y faceops_automatizacion; Alertmanager enruta a EDA :5022"}
  "Identidad · Fuente de usuarios de FaceOps":
    casos:
      - {id: C1, caso: "Probar un LDAP de laboratorio (OpenLDAP con usuarios y grupos de prueba)", tipo: Funcional, verificar: "el ticket termina bien, cuenta los usuarios de la fuente y FaceOps no abrió ninguna conexión al directorio"}
      - {id: C2, caso: "Conectar con el mapeo FaceOps-Operadores → escritura y FaceOps-Lectores → lectura", tipo: Funcional, verificar: "autenticador LDAP y mapa «allow» en el Gateway de AAP; usuarios creados con su fuente y su perfil"}
      - {id: C3, caso: "Entrar a FaceOps con un usuario de la fuente", tipo: Funcional, verificar: "clave correcta entra (validada por el Gateway); clave errada no entra; un usuario sin grupo mapeado no entra"}
      - {id: C4, caso: "Quitar a un usuario de su grupo en el directorio y sincronizar", tipo: Funcional, verificar: "pierde el acceso a FaceOps"}
      - {id: C5, caso: "Repetir conectar", tipo: Idempotencia, verificar: "un solo autenticador y un solo mapa en el Gateway; los mismos usuarios"}
      - {id: C6, caso: "Clave de servicio errada", tipo: Error controlado, verificar: "el ticket falla con «la fuente rechazó la cuenta de servicio» y no cambia usuarios ni el Gateway"}
      - {id: C7, caso: "midPoint simulado (API REST) con roles mapeados y validación de clave por el directorio", tipo: Funcional, verificar: "usuarios con los roles mapeados quedan con su perfil; entran con la clave del directorio"}
      - {id: C8, caso: "Retirar la fuente", tipo: Funcional, verificar: "autenticador eliminado del Gateway; sus usuarios sin acceso"}
  "Monitoreo · Responder alerta":
    casos:
      - {id: C1, caso: "Alerta real «Sin respuesta» con acción «Encender el equipo» (se apaga una máquina de prueba)", tipo: Funcional, verificar: "EDA lanza la respuesta; queda el workflow «FaceOps · Alerta › Infra · Encender o apagar equipo» esperando aprobación; aprobado, la máquina enciende"}
      - {id: C2, caso: "Rechazar la aprobación", tipo: Aprobación, verificar: "no se ejecuta la acción"}
      - {id: C3, caso: "Acción que necesita un dato (Ampliar el disco)", tipo: Error controlado, verificar: "queda registrada como propuesta; no lanza nada sin aprobación ni datos"}
      - {id: C4, caso: "Misma alerta repetida dentro de 30 minutos", tipo: Idempotencia, verificar: "EDA no la vuelve a pedir (throttle)"}
      - {id: C5, caso: "«Solo avisar»", tipo: Funcional, verificar: "queda en la auditoría de EDA y no lanza ninguna plantilla"}
  "Migración a GCP · Evaluar servidor":
    casos:
      - {id: C1, caso: "Evaluar un RHEL 9 con JBoss (nodo-jboss)", tipo: Funcional, verificar: "estrategia replatform con JBoss → OpenShift en GCP; tipo de máquina acorde a sus cores y memoria; disco ≥ usado × 1,3"}
      - {id: C2, caso: "Evaluar un CentOS 7 o Rocky 8 de prueba", tipo: Funcional, verificar: "marca el riesgo de sistema sin soporte y recomienda rehost con actualización"}
      - {id: C3, caso: "Evaluar un servidor con PostgreSQL", tipo: Funcional, verificar: "propone Cloud SQL for PostgreSQL con Database Migration Service"}
      - {id: C4, caso: "Repetir la evaluación", tipo: Idempotencia, verificar: "mismo resultado; nada cambió en el origen (changed=0)"}
      - {id: C5, caso: "Servidor apagado o sin acceso", tipo: Error controlado, verificar: "falla con el motivo y no deja nada a medias"}
  "Migración a GCP · Servidor Linux":
    casos:
      - {id: C1, caso: "Migrar un RHEL 9 de prueba con nginx y una página propia (sin corte)", tipo: Funcional, verificar: "VM summit-cloud-mig-… en GCP con etiqueta demo=summit-cloud; nginx arriba y la misma página; origen intacto"}
      - {id: C2, caso: "Repetir la migración del mismo origen", tipo: Idempotencia, verificar: "reutiliza la VM destino (no crea otra) y vuelve a quedar igual"}
      - {id: C3, caso: "Migración con corte (mg_corte=true)", tipo: Funcional, verificar: "el destino responde igual y recién entonces se detiene el servicio en el origen"}
      - {id: C4, caso: "Servicio que no levanta en el destino", tipo: Error controlado, verificar: "falla con «no quedó igual»; no se hace el corte; el origen sigue sirviendo"}
      - {id: C5, caso: "Rechazar la aprobación", tipo: Aprobación, verificar: "no se crea nada en GCP"}
      - {id: C6, caso: "Limpieza", tipo: Funcional, verificar: "la VM de prueba se elimina en GCP al terminar el plan (no quedan costos)"}
