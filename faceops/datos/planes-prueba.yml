      - {id: C2, caso: "Conmutar de vuelta (reversa)", verificar: "dc1-sql01 primario otra vez"}
  "DC · Active Directory":
    casos:
      - {id: C1, caso: "Preparar el controlador de dominio de laboratorio (dc1-ad01)", verificar: "dominio arriba; DNS resuelve; un usuario de prueba autentica"}
      - {id: C2, caso: "Repetir", verificar: "idempotente"}
  "DC · Configurar IGA":
    casos:
      - {id: C1, caso: "Configurar el IGA de laboratorio (dc1-iga01) con el directorio", verificar: "sincroniza identidades del directorio; una alta de prueba se propaga"}
  "DC · midPoint":
    casos:
      - {id: C1, caso: "Instalar midPoint en dc1-iga01", verificar: "consola responde; conector al directorio configurado"}
      - {id: C2, caso: "Repetir", verificar: "idempotente"}
  "Red · Actualizar firmware":
    casos:
      - {id: C1, caso: "Actualizar el firmware de un equipo de red real (o su emulador del fabricante)", verificar: "versión nueva; configuración intacta; vuelta atrás disponible"}
  "Plataforma · Controlar servicio":
    casos:
      - {id: C1, caso: "Deshabilitar Keycloak (contenedor) en nodo-jboss (sp_accion=deshabilitar)", tipo: Funcional, verificar: "ticket exitoso; keycloak.service detenido y sin unidad; el quadlet queda en /var/lib/keycloak/deshabilitado/ (set_stats quadlet=deshabilitado…); JBoss y la app siguen respondiendo"}
      - {id: C2, caso: "Encender Keycloak con su quadlet apartado y publicado en 8080 (choca con JBoss) con el puerto registrado en FaceOps 8180 (sp_puerto)", tipo: Funcional, verificar: "ticket exitoso; el quadlet vuelve a /etc/containers/systemd/ con PublishPort=8180:8080 y KC_HOSTNAME en la URL de su consola en FaceOps (sp_url_consola + /sso) (set_stats habilitado…, puerto… y url…); keycloak.service active, responde en 8180; su consola de administración abre completa por FaceOps y entra como admin con la credencial de la bóveda sin pedirla (navegador autenticado); JBoss y la app siguen en 200"}
      - {id: C3, caso: "Repetir «Encender» sobre Keycloak ya encendido", tipo: Idempotencia, verificar: "ticket exitoso sin cambios (no mueve archivos, no cambia el puerto, no reinicia); sigue active"}
      - {id: C4, caso: "Reiniciar Keycloak", tipo: Funcional, verificar: "ticket exitoso; keycloak.service vuelve a active y responde en 8180"}
      - {id: C5, caso: "Apagar Keycloak", tipo: Funcional, verificar: "ticket exitoso; keycloak.service inactive; el quadlet queda en su lugar (no se aparta)"}
      - {id: C6, caso: "Encender Keycloak con su unidad ya presente (sin quadlet apartado)", tipo: Funcional, verificar: "ticket exitoso; active y la consola responde por FaceOps (HTTP 200); la ficha lo muestra «Encendido»"}
      - {id: C7, caso: "Consultar estado (sp_accion=estado) de JBoss en nodo-jboss", tipo: Funcional, verificar: "ticket exitoso sin cambios; set_stats con unidad eap8-standalone y activo=active"}
      - {id: C8, caso: "Plataforma sin servicio en la máquina (Tomcat en nodo-jboss)", tipo: Error controlado, verificar: "ticket fallido en «La plataforma tiene servicio en el equipo» con el motivo; nada cambia en la máquina"}
      - {id: C9, caso: "Deshabilitar una plataforma que no corre en contenedor (Redis en nodo-jboss)", tipo: Error controlado, verificar: "ticket fallido en «La plataforma corre en contenedor (quadlet)» ANTES de detener: Redis sigue active"}
      - {id: C10, caso: "«Encender» Keycloak desde la ficha en una máquina sin la memoria del requisito (nodo-jboss2: 2 GB con JBoss, requiere ~3 GB)", tipo: Error controlado, verificar: "FaceOps no crea ticket: responde 409 con «Para encenderla se requieren ~3 GB de RAM… ajusta la memoria»"}
  "Plataforma · Actualizar firmware":
    casos:
