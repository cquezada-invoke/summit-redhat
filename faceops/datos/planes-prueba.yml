  "OpenShift · Crear en GCP":
    casos:
      - {id: C1, caso: "Versión inexistente (ocg_version=4.99.0)", tipo: Error controlado, verificar: "ticket fallido en «La versión existe y es GA» con el motivo; no corre el play del anfitrión; ninguna instancia con etiqueta faceops-ocp nueva en master-ia-320218"}
      - {id: C2, caso: "Dominio base sin zona DNS pública en Cloud DNS", tipo: Error controlado, verificar: "ticket fallido en «Prerrequisitos cumplidos» con «Zona DNS pública: no hay zona pública …»; no se crea ningún recurso en GCP"}
      - {id: C3, caso: "Nombre inválido (Mal_Nombre)", tipo: Error controlado, verificar: "ticket fallido en «Datos de la solicitud»; no se crea ningún recurso"}
      - {id: C4, caso: "Rama sin GA (ultima-6)", tipo: Error controlado, verificar: "ticket fallido con «aún sin versión estable publicada» (y los canales candidate/fast si existen); no se instala desde ellos"}
      - {id: C5, caso: "Crear SNO real con la última estable (OpenShift 4 · IPI sobre GCP) desde Contenedores › Crear plataforma de contenedores", tipo: Funcional, verificar: "ticket aprobado y exitoso; /readyz de la API responde ok; el único nodo queda Ready; credencial «OpenShift · <clúster> · acceso» en AAP con kubeconfig y kubeadmin cifrados; ni la salida del job ni el disco del anfitrión tienen kubeconfig, clave de kubeadmin, pull secret ni la cuenta de servicio; el clúster aparece en Contenedores (ocp-<clúster>) con plataforma gcp"}
      - {id: C6, caso: "Limpieza obligatoria: tras C5, pase o falle, se lanza «OpenShift · Eliminar en GCP» (y si la instalación falla, el rescue del playbook destruye lo creado)", tipo: Limpieza, verificar: "ticket de eliminación exitoso; sin instancias faceops-ocp=<clúster> en el proyecto; credencial y host retirados de AAP; el equipo queda retirado en FaceOps"}
  "OpenShift · Eliminar en GCP":
    casos:
      - {id: C1, caso: "Eliminar el SNO creado en el caso C5 de «OpenShift · Crear en GCP»", tipo: Funcional, verificar: "openshift-install destroy cluster con los metadatos guardados; ninguna instancia faceops-ocp=<clúster> queda; credencial «OpenShift · <clúster> · acceso» y host ocp-<clúster> retirados de AAP; equipo retirado en FaceOps"}
      - {id: C2, caso: "Repetir la eliminación del mismo clúster", tipo: Idempotencia, verificar: "ticket exitoso «Nada que eliminar» sin errores"}
      - {id: C3, caso: "Modo ciclo sin clústeres vencidos ni fuera de horario", tipo: Funcional, verificar: "ticket exitoso; no apaga, enciende ni destruye nada"}
      - {id: C4, caso: "Nombre inválido", tipo: Error controlado, verificar: "ticket fallido en «Datos»; no toca GCP"}
  "FaceOps · Agente de monitoreo (Linux)":
    casos:
      - {id: C1, caso: "Instalar en un Linux (nodo-jboss)", tipo: Funcional, verificar: "node_exporter activo en :9100 con las métricas del sistema y las de seguridad (faceops_seg_*: SSH fallidos, root, cuentas bloqueadas, SELinux, huella de archivos críticos) y su temporizador cada minuto"}
      - {id: C2, caso: "Repetir la instalación", tipo: Idempotencia, verificar: "termina bien sin reiniciar el agente ni duplicar el temporizador; las métricas siguen"}
      - {id: C3, caso: "6 ingresos SSH fallidos desde el anfitrión", tipo: Funcional, verificar: "faceops_seg_ssh_fallidos_5m sube a 6 o más en menos de 2 minutos"}
      - {id: C4, caso: "Equipo apagado o inalcanzable", tipo: Error controlado, verificar: "el ticket falla sin dejar nada a medias"}
  "Monitoreo · Grafana de OpenShift":
    casos:
      - {id: C1, caso: "Conectar ocp-sno (encendido)", tipo: Funcional, verificar: "cuenta faceops-grafana con cluster-monitoring-view; datasource del Thanos Querier en Grafana que responde consultas; tablero «Alertas de OpenShift · ocp-sno» con un panel por alerta del catálogo y datos reales"}
      - {id: C2, caso: "Repetir", tipo: Idempotencia, verificar: "termina bien sin reiniciar Grafana; mismo datasource y mismo tablero"}
      - {id: C3, caso: "Solo lectura", tipo: Seguridad, verificar: "la cuenta faceops-grafana no puede crear ni borrar objetos en el clúster (SelfSubjectAccessReview: create pods = no)"}
      - {id: C5, caso: "Reglas en el monitoreo del clúster", tipo: Funcional, verificar: "PrometheusRule faceops-alertas-cluster cargada en el Prometheus del clúster (grupo faceops-<clúster>, reglas sanas) con faceops_alerta en cada regla; repetir no la cambia"}
      - {id: C6, caso: "Cadena de aviso real: umbral bajado de forma temporal (go_prueba) en una alerta del clúster", tipo: Funcional, verificar: "la alerta se dispara en el Prometheus del clúster, su Alertmanager la entrega a FaceOps (correo al grupo Contenedores) y a EDA; al volver al umbral normal se resuelve y avisa «Resuelta»"}
      - {id: C4, caso: "Nombre de clúster inválido", tipo: Error controlado, verificar: "falla en la validación y no cambia Grafana (si el API no responde, falla pidiendo encender el clúster)"}
  "Monitoreo · Configurar alertas del equipo":
    casos:
      - {id: C1, caso: "Activar en un servidor Linux con agente (nodo-jboss): sin respuesta, CPU, memoria y disco con umbrales", tipo: Funcional, verificar: "reglas faceops-<equipo> cargadas en Prometheus (api/v1/rules), objetivo con up=1 y la ficha muestra el botón con 4 alertas"}
      - {id: C2, caso: "Disparo real: umbral de disco bajo el uso actual (aviso 1 %)", tipo: Funcional, verificar: "la alerta pasa a firing en Prometheus y llega a Alertmanager con faceops_equipo y severity"}
      - {id: C3, caso: "Ajustar umbrales y quitar una alerta", tipo: Funcional, verificar: "las reglas reflejan los umbrales nuevos y la alerta quitada ya no existe"}
      - {id: C4, caso: "Repetir el mismo pedido", tipo: Idempotencia, verificar: "mismas reglas, sin duplicar trabajos en prometheus.yml"}
      - {id: C5, caso: "Equipo de red (sondeo TCP, fw-sede-01)", tipo: Funcional, verificar: "probe_success del sondeo y reglas del equipo cargadas (el storage usa el mismo camino que Linux por node_exporter; hoy FaceOps no ofrece el agente para objetos de almacenamiento)"}
      - {id: C6, caso: "Equipo sin agente de monitoreo o apagado", tipo: Error controlado, verificar: "falla con el mensaje de instalar el agente y no cambia nada en Prometheus"}
      - {id: C7, caso: "Umbral inválido (aviso mayor que crítico)", tipo: Error controlado, verificar: "FaceOps lo rechaza antes del ticket; el playbook también lo rechaza y vuelve atrás"}
      - {id: C8, caso: "Retirar todas las alertas del equipo", tipo: Funcional, verificar: "sin reglas ni objetivo del equipo; Prometheus sano; el botón vuelve a «sin alertas»"}
      - {id: C9, caso: "Acción por alerta: «Encender el equipo» en «Sin respuesta» y «Solo avisar» en «Disco lleno»", tipo: Funcional, verificar: "la regla lleva faceops_accion y faceops_automatizacion; Alertmanager enruta a EDA :5022"}
      - {id: C10, caso: "JBoss detenido con «Reiniciar JBoss» (acción que entra a la máquina) y CPU alta con duración de 2 min", tipo: Funcional, verificar: "la regla de JBoss lleva faceops_inventario y faceops_credencial del equipo (plan de recolección); CPU con for: 2m; en un Linux sin JBoss la alerta JBoss no se ofrece"}
      - {id: C12, caso: "Ámbitos: alertas de la plataforma JBoss (J01) aparte de las de la máquina", tipo: Funcional, verificar: "grupo faceops-<equipo>--jboss con su archivo y tablero propios; el grupo de la máquina no cambia; retirar las de JBoss no quita las de la máquina ni su objetivo"}
      - {id: C13, caso: "Seguridad real: 6 ingresos SSH fallidos con «Fuerza bruta por SSH» (S01, aviso 5)", tipo: Funcional, verificar: "S01 pasa a firing en Prometheus y llega a Alertmanager"}
      - {id: C14, caso: "Bloqueo real: «Espera de E/S alta» (B02) con umbral mínimo", tipo: Funcional, verificar: "B02 pasa a firing en Prometheus y llega a Alertmanager"}
      - {id: C11, caso: "Tablero «Alertas de FaceOps» en Grafana", tipo: Funcional, verificar: "el tablero faceops-al-<equipo> queda en Grafana (provisionado por archivo) solo con las alertas activas del equipo y todas sus consultas fijas a él; al retirar todas, el tablero desaparece; la serie faceops_alerta_umbral del equipo trae los umbrales vigentes (CPU aviso 80 / crítico 95)"}
  "Identidad · Fuente de usuarios de FaceOps":
