  "Satellite · Actualizar":
    casos:
      - {id: C1, caso: "Actualizar el Satellite de prueba a la versión siguiente", verificar: "chequeos previos ok, snapshot, satellite-maintain upgrade; hammer ping ok"}
      - {id: C2, caso: "Versión no disponible", verificar: "se detiene en los chequeos sin tocar nada"}
  "DC · Satellite":
    casos:
      - {id: C1, caso: "Alta del Satellite del centro de datos en FaceOps", verificar: "queda como plataforma con su URL y credencial en la bóveda"}
      - {id: C2, caso: "Repetir", verificar: "idempotente"}
  "VPN · Instalar":
    casos:
      - {id: C1, caso: "Paso del workflow «VPN · Preparar servidor» sobre una máquina de prueba", verificar: "WireGuard arriba; wg0 con su llave en la bóveda"}
      - {id: C2, caso: "Repetir", verificar: "idempotente"}
  "Migración · JBoss a EAP 8":
    casos:
      - {id: C1, caso: "Evaluar JBoss 5.1 en nodo-jboss-dev (catalogo-legacy con su -ds.xml)", tipo: Funcional, verificar: "informe en Git (repositorio/migraciones-jboss) con la aplicación, sus hallazgos y el datasource; el origen no cambia (huella de la instalación igual antes y después)"}
      - {id: C2, caso: "emular-origen EAP 7.4 en nodo-jboss-dev (solo laboratorio)", tipo: Funcional, verificar: "/opt/jboss-eap-7.4 con version.txt, standalone.xml con InventarioDS y las aplicaciones inventario-eap7 y app-rota, con su marca de emulado; repetirlo no cambia nada"}
      - {id: C3, caso: "Evaluar el EAP 7.4 emulado (mj_jboss_home)", tipo: Funcional, verificar: "familia EAP 6/7, dos aplicaciones y el datasource leído de standalone.xml en el informe; la copia no lleva la contraseña"}
      - {id: C4, caso: "Migrar catalogo-legacy (JBoss 5) a nodo-jboss-qa (EAP 8)", tipo: Funcional, verificar: "aplicación transformada a Jakarta EE 10 desplegada y respondiendo en EAP 8; datasource creado; origen intacto"}
      - {id: C5, caso: "Migrar inventario-eap7 (EAP 7.4) a nodo-jboss-qa", tipo: Funcional, verificar: "responde 200 en EAP 8 usando InventarioDS creado por la migración"}
      - {id: C6, caso: "Repetir C4", tipo: Idempotencia, verificar: "sigue respondiendo; el datasource no se duplica (ya existe)"}
      - {id: C7, caso: "Migrar app-rota (no despliega en EAP 8)", tipo: Vuelta atrás, verificar: "el ticket falla en forma controlada; la aplicación se retira del destino; las ya migradas siguen respondiendo; el origen sigue intacto"}
      - {id: C8, caso: "Origen sin JBoss (nodo-postgres)", tipo: Error controlado, verificar: "falla controlada: no se encontró una instalación de JBoss; no cambia nada"}
      - {id: C9, caso: "Migrar sin indicar el destino", tipo: Error controlado, verificar: "se rechaza en la validación antes de tocar nada"}
  "Migración · WebLogic a OpenShift · Evaluar":
    casos:
      - {id: C1, caso: "Evaluar el dominio WebLogic emulado de nodo-jboss-dev (ventas_domain)", verificar: "informe en Git con dominio, datasource Oracle, cola JMS y JVM; ventas migrable a EAP 8 (EAR + JMS, javax → jakarta) y legado bloqueada por APIs weblogic.* y t3; las copias no llevan claves; no cambia nada"}
      - {id: C2, caso: "Repetir la evaluación", verificar: "solo lectura e idempotente: mismo resultado"}
      - {id: C3, caso: "Equipo sin dominio WebLogic (nodo-postgres)", verificar: "falla controlada: no se encontró un dominio"}
  "Migración · WebLogic a OpenShift":
    casos:
      - {id: C1, caso: "emular-origen en nodo-jboss-dev", verificar: "dominio ventas_domain y las dos aplicaciones de ejemplo en /u01, con su marca de emulado; la evaluación que sigue las encuentra"}
      - {id: C2, caso: "migrar ventas al namespace wl-ventas del SNO", verificar: "build S2I de EAP 8 completo; ConfigMap sin claves y Secret con la clave; Deployment listo; /ventas/salud por la Route responde 200 con datasource, cola y propiedades enlazados"}
      - {id: C3, caso: "migrar ventas de nuevo", verificar: "idempotente: sin construir de nuevo (misma huella) y sin cambios en el despliegue; sigue respondiendo 200"}
      - {id: C4, caso: "migrar legado", verificar: "rechazo controlado por APIs propietarias de WebLogic; no se crea nada en OpenShift"}
      - {id: C5, caso: "migrar ventas con una ruta de salud que no existe", verificar: "el rollout no queda sano, se vuelve a la versión anterior y esta responde 200; el ticket falla en forma controlada"}
      - {id: C6, caso: "revertir ventas", verificar: "se retiran Route, Service, Deployment, ConfigMap, Secret, BuildConfig e ImageStream y el namespace creado por la migración; el origen queda intacto"}
  "JBoss · Preparar servidor":
    casos:
      - {id: C1, caso: "Instalar JBoss EAP en una RHEL de prueba", verificar: "servicio activo, consola de administración responde, credenciales en la bóveda"}
      - {id: C2, caso: "Repetir", verificar: "idempotente"}
  "Vault · Preparar servidor":
    casos:
      - {id: C1, caso: "Instalar Vault en una RHEL de prueba", verificar: "Vault inicializado y desellado; llaves en lugar seguro; /v1/sys/health 200"}
      - {id: C2, caso: "Repetir", tipo: Idempotencia, verificar: "no reinicializa: FaceOps ya no la ofrece en un equipo con Vault, o si corre deja el mismo archivo de inicio"}
  "Storage · Preparar emulador":
