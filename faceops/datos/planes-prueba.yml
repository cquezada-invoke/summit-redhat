# Planes de prueba de las automatizaciones (regla de prueba · skill pruebas_automatizacion).
# Cada plan prueba TODA la funcionalidad: un caso por modo, acción o camino relevante (incluido el de error esperado) y su
# verificación. Se ejecuta completo con tickets reales (aprobados por Claude con «Aprobado por Claude (regla de Cristian)»);
# solo con todos los casos ok la versión vigente queda certificada. Si la automatización cambia, se ejecuta de nuevo.
# excepciones: automatizaciones que el usuario autorizó usar sin esperar su certificación (su plan sigue corriendo en paralelo;
# el bloqueo queda caso a caso, p. ej. en la opción de acción del selector de alertas).
excepciones:
  - {automatizacion: "Monitoreo · Configurar alertas del equipo", autoriza: "Cristian Quezada", fecha: "2026-11-11", motivo: "«ya bloquearemos caso a caso»: el flotante de alertas no se bloquea por la certificación; solo las acciones no certificadas del selector"}
planes:
  "Plataforma · Medir salud":
    casos:
      - {id: C1, caso: "Medir el data lake en nodo-storage (SeaweedFS: S3 :9000, master :9333, filer :8888, disco /srv/datalake)", verificar: "ticket exitoso de solo lectura; faceops_salud_plat trae s3_responde, comp_ok/comp_total (4 componentes), buckets y espacio_libre_pct, y el espacio coincide con df en la máquina (±2 puntos); la ficha PL-DATA-LAKE-0027 muestra la medición y su salud"}
      - {id: C2, caso: "Medir Kafka en nodo-nginx (herramientas del broker contra su bootstrap)", verificar: "ticket exitoso; brokers_arriba ≥ 1 si el servicio kafka está activo en la máquina, particiones sub-replicadas y sin líder medidas, consumer lag sumado"}
      - {id: C3, caso: "Medir Redis (Valkey) en nodo-tomcat sin mostrar la clave", verificar: "ticket exitoso; ping y persistencia medidos; la salida del trabajo no contiene ninguna clave"}
      - {id: C4, caso: "Repetir la medición del data lake", tipo: Idempotencia, verificar: "ticket exitoso sin cambios en la máquina (changed=0); los mismos indicadores"}
      - {id: C5, caso: "Pedir una plataforma que no corresponde al sistema (iis en nodo-storage, Linux)", tipo: Error controlado, verificar: "ticket fallido en «Datos válidos» con el motivo; no se toca la máquina ni cambia la ficha"}
  "Estaciones · Limpieza de disco":   # requiere estaciones reales del laboratorio (Linux y Windows)
    casos:
      - {id: C1, caso: "Modo evaluar en una estación Linux con caché de paquetes, temporales viejos y papelera", verificar: "ticket exitoso; limpieza_disco en set_stats con liberable_mb > 0; nada se borra (libre antes = después, archivos de prueba siguen)"}
      - {id: C2, caso: "Limpiar en la estación Linux", verificar: "ticket exitoso; temporales y papelera más antiguos que el umbral borrados, los recientes y /home/<usuario>/Documentos intactos; liberado_mb > 0"}
      - {id: C3, caso: "Evaluar y limpiar en una estación Windows (WinRM)", verificar: "tickets exitosos; Temp y papelera viejos y SoftwareDistribution\\Download vacíos; wuauserv vuelve a quedar en ejecución; Documentos intactos"}
      - {id: C4, caso: "Repetir la limpieza", tipo: Idempotencia, verificar: "ticket exitoso; liberado ~0 MB; nada nuevo se borra"}
      - {id: C5, caso: "ld_modo inválido (borrar)", tipo: Error controlado, verificar: "ticket fallido en «Datos válidos»; no se toca la estación"}
  "Estaciones · Cumplimiento CIS":   # requiere estaciones reales del laboratorio (Linux y Windows)
    casos:
      - {id: C1, caso: "Estación Linux sin endurecer", verificar: "ticket exitoso; cumplimiento_cis con 14 controles, cada uno con resultado y evidencia; los no endurecidos salen «no cumple»"}
      - {id: C2, caso: "Estación Linux endurecida (LUKS, firewall, USB bloqueado, minlen 14)", verificar: "esos controles pasan a «cumple» con su evidencia; porcentaje mayor que en C1"}
      - {id: C3, caso: "Estación Windows 11 (WinRM) con BitLocker y Defender", verificar: "ticket exitoso; 13 controles; BitLocker, firewall y antivirus «cumple» con su evidencia"}
      - {id: C4, caso: "Repetir la evaluación", tipo: Idempotencia, verificar: "ticket exitoso sin changed; mismos resultados"}
      - {id: C5, caso: "Control no disponible (Windows Home sin BitLocker)", tipo: Error controlado, verificar: "ticket exitoso; el control queda «no evaluable» con su evidencia, sin fallar el resto"}
  "Windows · Aplicar actualizaciones":   # requiere una estación o servidor Windows del laboratorio con actualizaciones pendientes
    casos:
      - {id: C1, caso: "Modo evaluar", verificar: "ticket exitoso; actualizaciones_windows con encontradas y KB; nada instalado"}
      - {id: C2, caso: "Instalar sin reinicio", verificar: "ticket exitoso; instaladas = encontradas; requiere_reinicio informado; la máquina no se reinicia"}
      - {id: C3, caso: "Instalar con wu_reiniciar=si", verificar: "ticket exitoso; la máquina reinicia y vuelve por WinRM; requiere_reinicio false"}
      - {id: C4, caso: "Repetir", tipo: Idempotencia, verificar: "ticket exitoso; 0 pendientes; sin cambios"}
      - {id: C5, caso: "Máquina Linux (sin WinRM)", tipo: Error controlado, verificar: "FaceOps no la ofrece (incompatible); forzada por AAP falla en «Datos válidos» sin tocar nada"}
  "Redis · Instalar Redis Insight":
    casos:
      - {id: C1, caso: "Reinstalar en una máquina que lo tiene con la ruta antigua o sin acuerdos aceptados (nodo-nginx) con la ruta vigente con código de cliente", verificar: "ticket exitoso; Redis Insight responde en /faceops/lab/inventario/<id>/consola-web/redis/; acuerdos (EULA) aceptados; se puede dar de alta la conexión al Redis local y conectar; la consola carga completa por la URL pública"}
      - {id: C2, caso: "Repetir sobre una instancia ya configurada con una conexión guardada (nodo-jboss)", tipo: Idempotencia, verificar: "ticket exitoso; la conexión guardada se conserva y sigue conectando; los acuerdos no se vuelven a tocar"}
      - {id: C3, caso: "Ruta de publicación inválida (vacía)", tipo: Error controlado, verificar: "ticket fallido en «Ruta válida» con el motivo; la instancia existente no cambia y sigue respondiendo"}
  "FaceOps · Aplicar política de seguridad":
    casos:
      - {id: C1, caso: "Aplicar RED-01 v2 (firewall) en nodo-jboss, que no tiene firewalld", verificar: "ticket exitoso; firewalld instalado, activo y al iniciar; abiertos los puertos de su rol y flujos (22, 8080, 8443, 8180, 6379, 5540, 9100) y 9990 solo desde 192.168.122.1 (APP-02 sigue); informa lo que queda cerrado; app de pagos HTTP 200 por el balanceador, consola JBoss y Redis Insight abren por FaceOps, Prometheus up==1, SSH/AAP entran; la ficha la muestra «Aplicada · FO-…»"}
      - {id: C2, caso: "Repetir RED-01 v2 en nodo-jboss", tipo: Idempotencia, verificar: "ticket exitoso sin cambios (CAMBIO=0, changed=0 en el firewall); los mismos puertos; nada se corta"}
      - {id: C3, caso: "Verificar RED-01 en nodo-jboss (modo verificar)", verificar: "ticket exitoso; cumple sin cambiar nada; la ficha sigue «Aplicada» con el ticket que la resolvió (C2), no el de la verificación"}
      - {id: C4, caso: "Aplicar CON-02 v2 (límites por contenedor) en nodo-jboss, con Redis Insight en ejecución y sin /etc/containers/containers.conf.d", verificar: "ticket exitoso; se crea el directorio y 50-faceops.conf (pids_limit 2048, log_size_max 100 MB); los contenedores en ejecución tienen tope de procesos sin reiniciarse; Redis Insight sigue respondiendo"}
      - {id: C5, caso: "Verificar CON-02 v2 en un equipo sin Podman", tipo: Funcional, verificar: "ticket exitoso; cumple (no aplica) sin crear nada en el equipo"}
      - {id: C6, caso: "Política de firewall con un puerto inválido (prueba ad hoc PRB-FW en nodo-jboss)", tipo: Error controlado, verificar: "ticket fallido en la tarea Firewall con «puerto inválido … no se cambió nada»; el firewall de nodo-jboss queda igual y la app sigue respondiendo; la fila de prueba se quita del estado de políticas"}
      - {id: C8, caso: "Aplicar RED-02 v2 en nodo-jboss (servidor con contenedores: v1 dejó ip_forward en 0 y Redis Insight dejó de responder desde fuera)", verificar: "ticket exitoso; ip_forward en 1 persistido en 91-faceops-contenedores.conf y sin la línea en 0; los parámetros de SO-02 siguen; Redis Insight responde desde FaceOps; en un servidor sin contenedores sigue en 0"}
      - {id: C7, caso: "Verificar SO-03 (regla de archivo) en nodo-jboss", tipo: Funcional, verificar: "ticket exitoso; las tareas «Directorios de los archivos» y «Archivos» en modo verificar no cambian nada; cumple y conserva el ticket que la resolvió"}
  "JBoss · Desplegar app":
    casos:
      - {id: C1, caso: "Desplegar en producción una versión publicada anterior (vuelta atrás a 1.0.43) con un nodo del grupo apagado (nodo-jboss2: se apaga antes del caso y se enciende al terminar)", verificar: "aprobación de producción respondida; ticket exitoso con límite solo en el nodo activo (nodo-jboss); el apagado queda fuera del límite (FaceOps no lanza sobre apagados) y no se toca; el balanceador https://192.168.122.11/app-jboss/salud responde 1.0.43 en todas las consultas"}
      - {id: C2, caso: "Desplegar en producción la última versión publicada (1.0.44)", verificar: "ticket exitoso; set_stats version_desplegada=1.0.44; cada nodo activo y el balanceador responden 1.0.44; el manifiesto de producción registra la versión"}
      - {id: C3, caso: "Repetir el despliegue de la misma versión", tipo: Idempotencia, verificar: "ticket exitoso; nada se rompe: el balanceador sigue en 1.0.44 sin cortes"}
      - {id: C4, caso: "Versión inexistente (9.9.999)", tipo: Error controlado, verificar: "ticket fallido con el motivo (la versión no está publicada); ningún nodo cambia: la versión anterior queda en servicio (vuelta atrás) y el balanceador sigue en 1.0.44"}
      - {id: C5, caso: "Desplegar en desarrollo (sin aprobación)", verificar: "ticket exitoso sin etapa de aprobación; solo nodo-jboss-dev recibe 1.0.44; producción no cambia"}
  "Red · Inventariar equipo de red":
    casos:
      - {id: C1, caso: "Firewall VyOS (fw): colección vyos.vyos por network_cli y lectura por SSH", verificar: "ticket exitoso; faceops_red en la caché de facts con plataforma VyOS y versión, interfaces con estado e IP, rutas con su ruta por defecto; FaceOps deja so «VyOS …», familia Red"}
      - {id: C2, caso: "Router FRR (rtr): lectura por SSH sin colección del fabricante", verificar: "ticket exitoso; plataforma FRRouting y versión, interfaces ruteadas con IP, sesiones BGP con su estado y prefijos, tabla de rutas por protocolo"}
      - {id: C3, caso: "Switch con VLAN y vecinos LLDP (sw-core-01, sw-acc-01)", verificar: "puertos con modo acceso/troncal y VLAN, SVI con IP, tabla de VLAN y vecinos LLDP que calzan en ambos extremos"}
      - {id: C4, caso: "Balanceador HAProxy (lb-sede-01)", verificar: "versión de HAProxy, frontend abierto, backend con sus servidores y estado de chequeo, VIP"}
      - {id: C5, caso: "Ficha del equipo en FaceOps", verificar: "la ficha muestra plataforma, modelo, uptime, interfaces, VLAN, vecinos, rutas, BGP o balanceo; no muestra CPU, discos, usuarios ni puntos de restauración"}
      - {id: C6, caso: "Repetir la lectura", verificar: "solo lectura e idempotente: el equipo no cambia (sin changed), mismos conteos de interfaces y rutas"}
      - {id: C7, caso: "Equipo que no responde (borde, laboratorio detenido)", verificar: "FaceOps no lanza nada y avisa que el equipo está apagado; no se toca el equipo y su ficha anterior se conserva"}
  "Red · Respaldar configuración":
    casos:
      - {id: C1, caso: "Firewall VyOS (fw): colección vyos.vyos por network_cli", verificar: "ticket exitoso; respaldos/fw.cfg en Git (invoke/red-laboratorio) con «set …» del VyOS; ninguna clave en claro (secretos como <oculto:huella>); faceops_red_respaldo en set_stats con líneas y sha256"}
      - {id: C2, caso: "Router FRR (rtr-wan-01) y switch FRR con VLAN (sw-core-01)", verificar: "tickets exitosos; respaldos con el running-config de vtysh (BGP en el router) y la tabla de VLAN del puente en el switch"}
      - {id: C3, caso: "Balanceador HAProxy (lb-sede-01)", verificar: "ticket exitoso; respaldos/lb-sede-01.cfg con frontends y backends de haproxy.cfg"}
      - {id: C4, caso: "Repetir el respaldo del firewall sin cambios", tipo: Idempotencia, verificar: "ticket exitoso «sin cambios desde el último respaldo»; no se crea commit nuevo en Git; el equipo no cambia"}
      - {id: C5, caso: "Equipo sin configuración legible (suc1: no expone vtysh por SSH)", tipo: Error controlado, verificar: "ticket fallido con «No se pudo leer la configuración … No se cambió nada»; no se crea respaldos/suc1.cfg"}
  "Red · Detectar cambios de configuración":
    casos:
      - {id: C1, caso: "Router FRR (rtr-wan-01) recién respaldado", verificar: "ticket exitoso «sin cambios contra la línea base»; faceops_red_drift.cambios = false"}
      - {id: C2, caso: "Línea base distinta de la configuración vigente (se quita una línea del respaldo en Git para simular un cambio hecho a mano)", verificar: "ticket exitoso con CAMBIOS: la línea aparece como agregada (+1 / -0); el equipo no cambia"}
      - {id: C3, caso: "Firewall VyOS (fw) y balanceador HAProxy (lb-sede-01) contra su respaldo", verificar: "tickets exitosos sin cambios; ningún secreto en claro en la salida"}
      - {id: C4, caso: "Repetir tras restablecer la línea base (nuevo respaldo)", tipo: Idempotencia, verificar: "ticket exitoso sin cambios; solo lectura"}
      - {id: C5, caso: "Equipo sin línea base (sw-acc-01 sin respaldo previo)", tipo: Error controlado, verificar: "ticket fallido «no tiene línea base: ejecuta primero «Respaldo de configuración»»; no se toca el equipo ni Git"}
  "Políticas de desarrollo · Evaluar aplicaciones":
    casos:
      - {id: C1, caso: "Evaluar todo el parque (con máquinas apagadas)", verificar: "ticket exitoso; las apagadas quedan fuera; aparecen las aplicaciones de JBoss (nodo-jboss, nodo-jboss-dev) y de IIS (srv-pn-win-01) con su plataforma y producto"}
      - {id: C2, caso: "Cumplimiento por aplicación", verificar: "cada aplicación tiene sus políticas según «aplica a» con cumple / no cumple / revisión y evidencia; ninguna evidencia muestra valores de configuración"}
      - {id: C3, caso: "Repetir la evaluación", verificar: "solo lectura e idempotente: mismas aplicaciones y mismos resultados, sin duplicar filas"}
  "Data lake · Derivar segmento":
    casos:
      - {id: C1, caso: "Activar la derivación de App de pagos (nodo-nginx)", verificar: "ticket con aprobación exitoso; nginx -t ok y recargado sin corte; el request de verificación llega al colector; la derivación queda activa en el mapa"}
      - {id: C2, caso: "Flujos funcionales y datos en el lake", verificar: "el generador envía tráfico por el balanceador; aparecen requests en s3://lake/app-de-pagos/requests/ y la tabla lake.seg_app_de_pagos.requests en Trino responde; la vista «Ver los datos» los muestra, sin cookies ni claves"}
      - {id: C3, caso: "Desactivar", verificar: "se quita el espejo y se detienen los flujos; la aplicación sigue respondiendo; la derivación queda inactiva"}
      - {id: C4, caso: "Repetir la activación", verificar: "idempotente: no duplica la configuración de nginx"}
      - {id: C5, caso: "Modo declarada: activar la derivación de Banca · Core bancario (la app ya escribe en s3://lake/apps/banca_core/)", verificar: "ticket con aprobación exitoso sin espejo ni cambios en la máquina; la app informa lo que escribe; la bifurcación queda activa con destino, ticket y fecha; el lake se dibuja una sola vez y el flotante muestra operaciones enviadas y carga de entrada"}
      - {id: C6, caso: "Modo declarada: repetir la activación", verificar: "idempotente: una sola fila de bifurcación, sigue activa"}
      - {id: C7, caso: "Modo declarada: desactivar", verificar: "la bifurcación queda inactiva y el lake deja de dibujarse; la aplicación sigue respondiendo"}
      - {id: C8, caso: "Modo declarada con URL de medición inválida", verificar: "falla controlada en la validación; la bifurcación no cambia"}
  "FaceOps · Rendimiento del canal":
    casos:
      - {id: C1, caso: "Prueba del canal de App de pagos", verificar: "trabajos en AAP exitosos; cada tramo con 3 rondas de 10 muestras (prom, p95, máx, jitter, pérdidas) y la entrada HTTP medida"}
      - {id: C2, caso: "Vista en el mapa", verificar: "tiempos medidos sobre cada línea, total del canal arriba, cuello de botella marcado; «Volver a lo normal» restaura las etiquetas"}
      - {id: C3, caso: "No invasiva", verificar: "solo conexiones TCP cortas y pocas peticiones GET; la aplicación sigue respondiendo igual"}
  "Licencias · Levantar desde las plataformas":
    casos:
      - {id: C1, caso: "Levantar en todo el parque (con máquinas apagadas)", verificar: "ticket exitoso; las apagadas quedan fuera; cada RHEL encendido aparece con su suscripción o con acceso simple (SCA)"}
      - {id: C2, caso: "Caducidad en FaceOps", verificar: "la tabla «Licencias en uso y su caducidad» muestra lo levantado, la suscripción de AAP y los contratos, ordenada por vencimiento"}
      - {id: C3, caso: "Repetir el levantamiento", verificar: "solo lectura e idempotente: mismo resultado, sin duplicar filas"}
  "Arquitectura · Evaluar stack tecnológico":
    casos:
      - {id: C1, caso: "Barrido de todo el parque (con máquinas apagadas en el inventario)", verificar: "ticket exitoso; las apagadas quedan fuera sin hacer fallar al resto; evaluación nueva con filas por máquina"}
      - {id: C2, caso: "Informe de obsolescencia", verificar: "PDF del barrido disponible y con contenido"}
      - {id: C3, caso: "Repetir el barrido", verificar: "solo lectura e idempotente: segunda evaluación con las mismas máquinas y tecnologías"}
  "DevSecOps · Pipeline Tekton":
    casos:
      - {id: C1, caso: "estado de un pipeline", verificar: "lee sus últimas ejecuciones sin cambiar nada"}
      - {id: C2, caso: "aplicar desde Git", verificar: "el Pipeline queda aplicado en el clúster con el contenido de Git"}
      - {id: C3, caso: "ejecutar en una rama de Gitflow", verificar: "PipelineRun creado y terminado; FaceOps muestra su avance y resultado"}
      - {id: C4, caso: "acción inválida o URL fuera del Git interno", verificar: "se rechaza en la validación sin tocar el clúster"}
  "Satellite · Incorporar RHEL":
    casos:
      - {id: C1, caso: "Registrar un RHEL registrado en Red Hat (CDN)", verificar: "subscription-manager identity contra el Satellite; datos.satellite marcado"}
      - {id: C2, caso: "Registrar un RHEL recién convertido (nombre localhost)", verificar: "hostname corregido y registrado"}
      - {id: C3, caso: "Repetir sobre una máquina ya registrada en ese Satellite", verificar: "no la vuelve a registrar (idempotente)"}
  "Satellite · Convertir a RHEL":
    casos:
      - {id: C1, caso: "Rocky 9 recién creada → RHEL 9 y registrada en Satellite", verificar: "/etc/redhat-release RHEL; registrada en Satellite"}
      - {id: C2, caso: "Falla en la conversión", verificar: "vuelve al snapshot y la máquina queda como estaba"}
  "VPN · Gestionar acceso":
    casos:
      - {id: C1, caso: "Crear cliente", verificar: "rango 10.66.N.0/24 asignado"}
      - {id: C2, caso: "Crear usuario con todo un segmento y con IPs puntuales", verificar: "par en wg0, reglas nft por usuario, configuración en la bóveda"}
      - {id: C3, caso: "Túnel: llega a su segmento y no al resto", verificar: "ping permitido y bloqueado"}
      - {id: C4, caso: "Vencimiento", verificar: "el servidor lo corta solo en menos de 2 minutos"}
      - {id: C5, caso: "Extender vigencia", verificar: "vuelve a estar vigente"}
      - {id: C6, caso: "Revocar", verificar: "deja de estar en wg0"}
  "OpenShift · Modelo de alertamiento":
    casos:
      - {id: C1, caso: "evaluar", verificar: "monitoreo disponible; no cambia nada"}
      - {id: C2, caso: "aplicar", verificar: "3 PrometheusRule faceops-* aceptadas por Prometheus (sin errores de evaluación) y receptor faceops-eda en Alertmanager"}
      - {id: C3, caso: "Aviso real: pod en crash loop en un namespace de prueba", verificar: "alerta FaceOpsPodEnCrashLoopAviso disparada → EDA lanza el diagnóstico"}
      - {id: C4, caso: "Crítico real: el mismo pod sobre el umbral crítico", verificar: "EDA lanza el workflow con aprobación; aprobado, reinicia el pod"}
      - {id: C5, caso: "aplicar de nuevo", verificar: "idempotente (mismas reglas, sin duplicar receptor)"}
      - {id: C6, caso: "retirar", verificar: "sin reglas faceops-* ni receptor; Alertmanager sano"}
  "OpenShift · Remediar alerta":
    casos:
      - {id: C1, caso: "diagnosticar", verificar: "eventos del objeto, sin cambios"}
      - {id: C2, caso: "reiniciar-pod en namespace de prueba", verificar: "el pod se recrea"}
      - {id: C3, caso: "escalar deployment de prueba", verificar: "réplicas +1 y respeta el tope"}
      - {id: C4, caso: "expandir-pvc de prueba", verificar: "capacidad +25 % (o error claro si la StorageClass no permite)"}
      - {id: C5, caso: "cordonar-nodo (y descordonar al final)", verificar: "unschedulable true"}
      - {id: C6, caso: "Acción que cambia algo sobre openshift-*", verificar: "se rechaza"}
  "Infra · Cargar imágenes base al registro":
    casos:
      - {id: C1, caso: "Solo revisar (ri_solo_revisar=true)", verificar: "informa imágenes en uso y las que faltan; el registro no cambia"}
      - {id: C2, caso: "Cargar: rhel9-base.qcow2 (base de srv-prueba-rhel9-01) no está con su huella", verificar: "queda imagen-rhel9-base sha-<12> en el registro con el mismo sha256; el punto de la 91 muestra «misma huella»"}
      - {id: C3, caso: "Repetir la carga", verificar: "no sube nada (idempotente): todas ya están con su huella"}
  "Infra · Preparar centro de datos emulado":
    casos:
      - {id: C1, caso: "Crear el centro Valparaíso (valpo, 192.168.150)", verificar: "red dc-valpo activa con autoinicio y pool dc-valpo en /var/lib/libvirt/dc-valpo"}
      - {id: C2, caso: "Repetir", verificar: "idempotente: sin cambios"}
      - {id: C3, caso: "Clave o red no válidas", verificar: "se rechaza sin tocar nada"}
  "Infra · Mover máquina entre centros de datos":
    casos:
      - {id: C1, caso: "Ficha de la máquina › Mover a otra infraestructura (flotante) y evaluar Santiago → Valparaíso", verificar: "el flotante lista solo destinos compatibles (los demás deshabilitados con su motivo); evaluar informa tamaño, espacio y tiempo estimado sin cambiar nada"}
      - {id: C2, caso: "mover Santiago → Valparaíso con el ticket que crea el flotante", verificar: "IP 192.168.150.x, responde por SSH; origen apagada como <nombre>-origen; ubicación e IP actualizadas en AAP y FaceOps; la ficha muestra el traslado pendiente"}
      - {id: C3, caso: "revertir", verificar: "vuelve la de origen con su IP de Santiago; ubicación de vuelta a Santiago; la copia del destino y sus discos se retiran"}
      - {id: C4, caso: "mover de nuevo y confirmar", verificar: "la de origen y sus discos se retiran; la ficha ya no muestra traslado pendiente"}
      - {id: C5, caso: "mover Valparaíso → Santiago", verificar: "vuelve a 192.168.122.x y a Santiago"}
      - {id: C6, caso: "Destino donde ya está, o máquina protegida (nodo-vault, sno)", verificar: "se rechaza sin tocar nada"}
      - {id: C7, caso: "mover a un destino donde no responde (puerto de verificación cerrado)", verificar: "vuelta atrás sola: la copia del destino y sus discos se retiran, la de origen vuelve encendida con su nombre e IP; FaceOps no cambia la ubicación"}
  "FaceOps · Agregar disco":
    casos:
      - {id: C1, caso: "Disco nuevo en una máquina del inventario «Servidores habilitados» (nodo-storage, 100 GB, /srv/datalake)", verificar: "conectado con su serie, particionado, XFS y montado en /srv/datalake (fstab por UUID)"}
      - {id: C2, caso: "Repetir con el mismo disco y serie", verificar: "idempotente: no crea otro volumen ni reformatea; sigue montado"}
      - {id: C3, caso: "Máquina del inventario «Nodos demo» (disco ya existente de una prueba anterior)", verificar: "sigue funcionando con el inventario construido"}
  "Recuperación · Respaldar volúmenes con restic":
    casos:
      - {id: C1, caso: "Datos no válidos (hora 25:00) y volumen del sistema («/») sobre nodo-jboss", tipo: Error controlado, verificar: "ambos se rechazan sin instalar nada: sin restic, sin timer, sin cambios en la ficha"}
      - {id: C2, caso: "Respaldar con el S3 inalcanzable en una máquina sin respaldo previo", tipo: Error controlado, verificar: "ticket fallido con vuelta atrás: sin timer ni unidades de systemd; el ticket informa «retirado el timer»; la ficha no cambia"}
      - {id: C3, caso: "Respaldar nodo-jboss con los valores por defecto (S3 del laboratorio, detección automática)", verificar: "detecta solo /datos (no los volúmenes del sistema); restic instalado; repositorio creado en respaldos/nodo-jboss; snapshot y check ok; timer diario habilitado con retención; clave en la bóveda (web/nodo-jboss/restic) igual a la de la máquina; FaceOps deja datos.respaldo_datos y un punto nuevo con /datos «respaldado»; Recuperación sube 15 %"}
      - {id: C4, caso: "Repetir respaldar", tipo: Idempotencia, verificar: "usa el repositorio existente (no lo vuelve a crear); unidades y clave sin cambios; snapshot nuevo; la retención deja uno por día"}
      - {id: C5, caso: "Programación: hora del respaldo a unos minutos", verificar: "el timer corre solo a esa hora y deja un snapshot nuevo en el repositorio sin intervención"}
      - {id: C6, caso: "Estado", tipo: Solo lectura, verificar: "informa snapshots, último respaldo, rutas y próxima ejecución; nada cambia en la máquina"}
      - {id: C7, caso: "Restaurar el último snapshot en un directorio aparte", verificar: "archivos restaurados = archivos del snapshot; canario presente; /datos intacto; la ficha anota la restauración"}
      - {id: C8, caso: "Respaldar con el S3 inalcanzable cuando ya hay respaldo programado", tipo: Error controlado, verificar: "ticket fallido con vuelta atrás: el timer anterior sigue habilitado con su horario; la ficha conserva el último respaldo bueno"}
      - {id: C9, caso: "Restaurar en el mismo volumen respaldado (/datos)", tipo: Error controlado, verificar: "se rechaza sin restaurar nada"}
  "Storage · Servicio S3 del data lake":
    casos:
      - {id: C1, caso: "Sin disco dedicado (directorio en la raíz)", verificar: "se rechaza sin instalar nada"}
      - {id: C2, caso: "Instalar en nodo-storage sobre /srv/datalake (disco de «FaceOps · Agregar disco»)", verificar: "servicio lake-s3 activo y habilitado; responde 9000 y 8888; firewall solo a los clientes indicados"}
      - {id: C3, caso: "Repetir instalar", verificar: "sin cambios; el servicio no se reinicia"}
      - {id: C4, caso: "Usarlo como S3 del lake (Trino y aplicaciones) y reiniciar el equipo", verificar: "los datos persisten en el disco; el servicio vuelve solo; Trino lee las tablas"}
      - {id: C5, caso: "Modo estado y datos no válidos (CIDR mal escrito)", verificar: "estado informa uso del disco sin cambios; CIDR inválido se rechaza"}
  "Fiscalía · Aviso de complemento":
    casos:
      - {id: C1, caso: "«Pedir complemento por correo» en una denuncia incompleta", verificar: "trabajo OK; llega el correo con lo que falta y el enlace; evento en el lake con el número de trabajo"}
      - {id: C2, caso: "Abrir el enlace y enviar el complemento (fecha, colonia, una imagen)", verificar: "la denuncia queda actualizada en el lake sin duplicarse; imagen analizada; etapa «Complemento recibido»; sube la coherencia"}
      - {id: C3, caso: "Enlace con firma alterada", verificar: "se rechaza; no cambia nada"}
      - {id: C4, caso: "Lanzar la plantilla con un folio o enlace inválido", verificar: "falla la validación y no se envía correo"}
  "OpenShift · Relevamiento de imágenes":
    casos:
      - {id: C1, caso: "Relevamiento con los valores por defecto sobre el SNO", verificar: "informe completo: en uso, registro, caché, antiguas, replicadas; cifras coinciden con oc get pods/is y crictl images"}
      - {id: C2, caso: "Imagen sin uso conocida (ImageStream de prueba sin despliegue)", verificar: "aparece como sin uso en el registro"}
      - {id: C3, caso: "Umbral corto (30 días) y 1 revisión", verificar: "más antiguas y más ImageStreams con exceso de revisiones; no cambia nada en el clúster"}
      - {id: C4, caso: "Umbral no válido (10 días)", verificar: "se rechaza"}
  "OpenShift · Evaluar imágenes (uso y antigüedad)":
    casos:
      - {id: C1, caso: "Valores por defecto sobre ocp-sno con un namespace de prueba (imágenes construidas en el clúster: en uso por un Deployment, una escalada a cero, una con dos rollouts y una sin despliegue)", verificar: "ticket exitoso; en uso / referenciada / sin uso 0–3 meses según corresponda; ninguna candidata (push reciente < 6 meses); tamaño por rango; no aparecen los namespaces openshift-*, kube-* ni las imágenes importadas de registros externos (base ubi-*)"}
      - {id: C2, caso: "Umbral 0 meses, rangos 1,2 y host de Quay", verificar: "candidatas: la sin despliegue (riesgo bajo, referencias ninguna) y la revisión antigua del rollout (riesgo medio, historial del Deployment); nunca la en uso ni la referenciada; destino quay/<ns>/<is>:<tag> y skopeo copy con @sha256 del digest; poda con oc tag -d y prune"}
      - {id: C3, caso: "Solo el namespace de prueba (im_incluir) y organización de Quay fija", verificar: "solo filas de ese namespace; destino <org>/<ns>-<is>"}
      - {id: C4, caso: "Informe publicado", verificar: "plan.md, plan.csv y plan.json en repositorio/openshift-manifiestos/imagenes-movilidad/ocp-sno; la ficha del clúster muestra la sección «Movilidad de imágenes a Quay» con el ticket"}
      - {id: C5, caso: "Repetir", tipo: Idempotencia, verificar: "mismo resultado; ImageStreams, ReplicaSets y pods del clúster sin cambios (solo lectura)"}
      - {id: C6, caso: "Datos no válidos (rangos «a,b»)", tipo: Error controlado, verificar: "ticket fallido en «Datos»; no se consulta el clúster"}
      - {id: C7, caso: "Sin imágenes en el registro interno (namespaces sin imágenes) y con Quay", verificar: "0 revisiones y 0 candidatas; la ficha dice que las imágenes ya están en Quay con el enlace a la organización; no propone mover"}
      - {id: C8, caso: "Sin imágenes en el registro interno ni Quay", verificar: "0 revisiones y sin Quay; la ficha muestra un mensaje breve"}
      - {id: C9, caso: "Evaluación por defecto tras borrar el escenario", verificar: "exitosa, sin el namespace de prueba; la ficha queda con el estado real del clúster"}
  "OpenShift · Mover imágenes a Quay":
    casos:
      - {id: C1, caso: "Mover una candidata (ns/is:tag) a un Quay de laboratorio", verificar: "ticket aprobado y exitoso; Job de skopeo en faceops-movilidad; skopeo inspect en Quay da el mismo digest; el origen sigue intacto; el Secret con la cuenta de Quay ya no existe"}
      - {id: C2, caso: "Mover con «retirar del registro interno»", verificar: "solo se quita la etiqueta cuyas revisiones se copiaron y verificaron; las revisiones antiguas quedan para el pruner"}
      - {id: C3, caso: "Seleccionar una imagen en uso", verificar: "omitida (ya no es candidata); no se copia ni se retira nada"}
      - {id: C4, caso: "Quay inalcanzable o robot sin permiso de escritura", tipo: Error controlado, verificar: "ticket fallido con el motivo por imagen; nada se retira del origen; el Secret se borra"}
      - {id: C5, caso: "Repetir la misma copia", tipo: Idempotencia, verificar: "exitoso; mismo digest en Quay"}
      - {id: C6, caso: "Sin cuenta de Quay en la bóveda", tipo: Error controlado, verificar: "ticket fallido en «Hay cuenta de Quay»; no se crea nada en el clúster"}
  "Homologación · Relevar entorno":
    casos:
      - {id: C1, caso: "Relevar las máquinas JBoss de desarrollo, QA y producción de un mismo segmento", verificar: "cada una con su huella: sistema, entorno, Java y JBoss (versión, JVM, módulos, drivers, datasources, deployments, huella de configuración)"}
