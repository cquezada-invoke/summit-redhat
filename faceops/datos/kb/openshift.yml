producto: {codigo: openshift, nombre: "Red Hat OpenShift", fabricante: Red Hat, skill: "", descripcion: "Plataforma de contenedores"}
problemas:
- codigo: ocp-imagepull
  titulo: Pods en ImagePullBackOff
  sintomas: 'ErrImagePull / ImagePullBackOff: el nodo no puede descargar la imagen.'
  patrones:
  - ImagePullBackOff
  - ErrImagePull
  - manifest unknown
  - 'unauthorized: authentication required'
  causa: Registro inalcanzable desde el nodo, imagen o etiqueta inexistente, o falta el pull secret.
  solucion: Verificar el acceso al registro, el pull secret del proyecto y la etiqueta publicada por el pipeline.
  severidad: media
  automatizacion: OpenShift · Recolectar clúster
  diagnostico: La recolección deja el estado de nodos, operadores y cargas para el análisis.
  fuente: Documentación de OpenShift (imágenes) · experiencia Invoke
  ocurrencia: 50
  preventivas:
  - accion: Construir y publicar imágenes solo por pipeline
    tarea: ocp-pipeline
  - accion: Recolectar el estado del clúster periódicamente
    tarea: ocp-recolectar
  pasos:
  - Ver el evento del pod (oc describe pod)
  - Verificar la imagen y la etiqueta publicadas por el pipeline
  - Verificar el pull secret del proyecto
  verificacion: []
  fuentes:
  - titulo: Back-off pulling image due to image pull secret not found
    url: https://access.redhat.com/solutions/4308511
- codigo: ocp-crashloop
  titulo: Pods en CrashLoopBackOff
  sintomas: Back-off restarting failed container; el contenedor se reinicia en bucle.
  patrones:
  - CrashLoopBackOff
  - Back-off restarting failed container
  causa: La aplicación termina al iniciar (configuración, secreto o dependencia faltante) o la sonda de vida falla.
  solucion: Revisar el log del contenedor anterior, la configuración desplegada por GitOps y volver al commit anterior si corresponde.
  severidad: alta
  automatizacion: OpenShift · Recolectar clúster
  fuente: Documentación de OpenShift (diagnóstico de pods)
  ocurrencia: 55
  preventivas:
  - accion: Desplegar por GitOps con validación posterior
    tarea: ocp-gitops
  - accion: Validar la aplicación después de cada sincronización
    tarea: app-validar
  pasos:
  - Ver el log del contenedor anterior (oc logs --previous)
  - Revisar la configuración y secretos desplegados por GitOps
  - Volver al commit anterior si el cambio lo causó
  verificacion: []
  fuentes:
  - titulo: CrashLoopBackOff status for Openshift Pod
    url: https://access.redhat.com/solutions/2137701
- codigo: ocp-certificados
  titulo: Certificados del clúster vencidos o por vencer
  sintomas: 'x509: certificate has expired or is not yet valid en la API o en los nodos; CSR pendientes de aprobación.'
  patrones:
  - 'x509: certificate has expired'
  - certificate has expired or is not yet valid
  - Pending.{0,40}csr
  causa: El clúster estuvo apagado más tiempo que la rotación automática o hay CSR de kubelet sin aprobar.
  solucion: Aprobar los CSR pendientes y verificar la rotación de certificados del clúster.
  severidad: critica
  diagnostico: Requiere aprobar CSR con oc adm certificate approve (operación del equipo de Managed Service).
  fuente: Documentación de OpenShift (certificados)
  ocurrencia: 10
  preventivas:
  - accion: Recolectar el estado del clúster (CSR y certificados) periódicamente
    tarea: ocp-recolectar
  pasos:
  - Listar CSR pendientes (oc get csr)
  - Aprobar los CSR de kubelet
  - Verificar los operadores
  verificacion: []
  fuentes:
  - titulo: Recovering from expired control plane certificates (OKD)
    url: https://docs.okd.io/latest/backup_and_restore/control_plane_backup_and_restore/disaster_recovery/scenario-3-expired-certs.html
- codigo: ocp-operador-degradado
  titulo: Operador del clúster degradado
  sintomas: ClusterOperator Degraded=True o Available=False; alerta ClusterOperatorDegraded.
  patrones:
  - ClusterOperatorDegraded
  - ClusterOperatorDown
  - Degraded=True
  causa: Un componente de plataforma no logra conciliar su estado (almacenamiento, red, certificados o recursos).
  solucion: Recolectar el estado del clúster e identificar el operador y su condición.
  severidad: alta
  automatizacion: OpenShift · Recolectar clúster
  fuente: Documentación de OpenShift (ClusterOperators)
  ocurrencia: 25
  preventivas:
  - accion: Recolectar el estado de los operadores y alertar por Alertmanager
    tarea: ocp-recolectar
  pasos:
  - Ver el operador degradado (oc get co)
  - Revisar su condición y mensaje
  - Corregir la causa (almacenamiento, red, certificados)
  verificacion: []
  fuentes:
  - titulo: Cluster operator network is degraded in RHOCP 4
    url: https://access.redhat.com/solutions/7006874
- codigo: ocp-oomkilled
  titulo: Contenedor terminado por memoria (OOMKilled)
  sintomas: 'Last State: Terminated, Reason: OOMKilled, Exit Code: 137; el pod se reinicia bajo carga.'
  patrones:
  - OOMKilled
  - Exit Code:\s*137
  causa: El límite de memoria del contenedor es menor que lo que usa la aplicación (o el heap de la JVM no respeta el límite).
  solucion: Ajustar el límite de memoria del contenedor o el heap de la JVM en el manifiesto de GitOps y sincronizar.
  severidad: alta
  automatizacion: OpenShift · Recolectar clúster
  ocurrencia: 50
  pasos:
  - Confirmar OOMKilled en oc describe pod
  - Comparar uso real con el límite
  - Subir el límite o ajustar el heap en Git
  - Sincronizar y verificar
  preventivas:
  - accion: Definir límites y heap según el uso medido
    tarea: ocp-gitops
  - accion: Recolectar uso de recursos del clúster
    tarea: ocp-recolectar
  verificacion: []
  fuentes:
  - titulo: Application memory sizing (OpenShift)
    url: https://docs.openshift.com/aro/dev_guide/application_memory_sizing.html
  fuente: Documentación de OpenShift
- codigo: ocp-nodo-notready
  titulo: Nodo en NotReady
  sintomas: Kubelet stopped posting node status; los pods del nodo quedan en Unknown o se reprograman.
  patrones:
  - Kubelet stopped posting node status
  - NotReady
  causa: kubelet o CRI-O detenidos, presión de recursos (disco, memoria) o certificados del nodo.
  solucion: Revisar kubelet y CRI-O en el nodo, la presión de recursos y los CSR pendientes.
  severidad: critica
  automatizacion: OpenShift · Recolectar clúster
  ocurrencia: 30
  pasos:
  - Ver condiciones del nodo (oc describe node)
  - Revisar kubelet y crio (journalctl)
  - Aprobar CSR pendientes si corresponde
  - Liberar presión de disco o memoria
  preventivas:
  - accion: Recolectar estado de nodos y alertar por Alertmanager
    tarea: ocp-recolectar
  verificacion: []
  fuentes:
  - titulo: Node in NotReady status with Kubelet stopped posting node status
    url: https://access.redhat.com/solutions/6029931
  fuente: Red Hat
- codigo: ocp-pvc-pending
  titulo: Volumen persistente en Pending
  sintomas: no persistent volumes available for this claim and no storage class is set; el pod no inicia.
  patrones:
  - no persistent volumes available for this claim
  - storage class is set
  - ProvisioningFailed
  causa: No hay StorageClass por defecto o el aprovisionador no responde.
  solucion: Definir la StorageClass por defecto o corregir el aprovisionador, y volver a crear el PVC.
  severidad: media
  automatizacion: ''
  ocurrencia: 25
  pasos:
  - Ver eventos del PVC
  - Revisar StorageClass por defecto
  - Corregir el aprovisionador
  - Recrear el PVC
  preventivas:
  - accion: Declarar la StorageClass en los manifiestos de GitOps
    tarea: ocp-gitops
  verificacion: []
  fuentes:
  - titulo: PVC in pending state for OpenShift 4
    url: https://access.redhat.com/node/6987406
  fuente: Red Hat
- codigo: ocp-etcd-lento
  titulo: etcd lento por latencia de disco
  sintomas: apply request took too long; la API responde lento y hay elecciones de líder en etcd.
  patrones:
  - apply request took too long
  - leader changed
  - slow fdatasync
  causa: Disco de los masters con latencia alta para etcd.
  solucion: Mover etcd a disco de baja latencia (validado con fio) y revisar la carga del almacenamiento.
  severidad: alta
  automatizacion: OpenShift · Recolectar clúster
  ocurrencia: 20
  pasos:
  - Confirmar latencias de etcd en métricas
  - Medir el disco con fio
  - Mover etcd a disco rápido
  preventivas:
  - accion: Recolectar métricas del clúster
    tarea: ocp-recolectar
  verificacion: []
  fuentes:
  - titulo: Recommended etcd practices (OpenShift)
    url: https://docs.redhat.com/en/documentation/openshift_container_platform/4.20/html/etcd/etcd-practices
  fuente: Red Hat
