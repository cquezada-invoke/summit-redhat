producto: {codigo: iis, descripcion: Servidor web de Windows Server, detecta: [iis, w3svc], fabricante: Microsoft, nombre: Microsoft IIS, skill: iis}
problemas:
- codigo: iis-503
  titulo: '503 Service Unavailable: el grupo de aplicaciones está detenido'
  sintomas: HTTP Error 503. The service is unavailable. El Application Pool se detuvo (Rapid-Fail Protection).
  patrones:
  - HTTP Error 503
  - Service Unavailable
  - Rapid-Fail Protection
  - application pool .* (stopped|disabled)
  causa: El proceso w3wp falló varias veces seguidas y IIS detuvo el grupo de aplicaciones.
  solucion: Levantar el grupo de aplicaciones y el sitio, y revisar el evento de error de la aplicación.
  severidad: alta
  automatizacion: Remediación · IIS en Windows
  fuente: Documentación de IIS (Application Pools)
  ocurrencia: 30
  preventivas:
  - accion: Vigilar el estado de los Application Pools con el exportador de Windows
    tarea: agente-monitoreo
  - accion: Mantener la configuración del sitio bajo control de drift
    tarea: comparar-base
  pasos:
  - Ver el estado del Application Pool
  - Iniciar el pool y el sitio
  - Revisar el evento de error de la aplicación (visor de eventos)
  verificacion:
  - revisar: Application Pool detenido
    comando: Import-Module WebAdministration; Get-ChildItem IIS:\AppPools | Where-Object {$_.State -ne 'Started'} | ForEach-Object {$_.Name}
    confirma: \S
    sistema: windows
  fuentes:
  - titulo: 503-Service Unavailable (TechNet)
    url: https://technet.microsoft.com/en-us/library/cc781893(v=ws.10).aspx
  tipo: Disponibilidad
  condiciones: []
- codigo: iis-500-19
  titulo: 'HTTP 500.19: configuración inválida'
  sintomas: HTTP Error 500.19 - Internal Server Error. The requested page cannot be accessed because the related configuration data for the page is invalid.
  patrones:
  - 500\.19
  - configuration data for the page is invalid
  causa: web.config con sección inválida o módulo no instalado.
  solucion: Volver la configuración del sitio a la aprobada y verificar los módulos instalados.
  severidad: media
  automatizacion: Drift · Windows
  fuente: Documentación de IIS
  ocurrencia: 30
  preventivas:
  - accion: Mantener web.config bajo control de drift y aplicar desde Git
    tarea: aplicar-git
  pasos:
  - Identificar la sección inválida del web.config
  - Volver la configuración del sitio a la aprobada
  verificacion:
  - revisar: Errores 500.19 en los logs de IIS
    comando: Get-ChildItem C:\inetpub\logs\LogFiles -Recurse -Filter *.log | Select-Object -Last 1 | Get-Content -Tail 300 | Select-String ' 500 19 ' | Measure-Object | ForEach-Object {$_.Count}
    confirma: ^[1-9]
    sistema: windows
  fuentes:
  - titulo: HTTP Error 500.19 when you open an IIS webpage (Microsoft Learn)
    url: https://learn.microsoft.com/en-in/troubleshoot/developer/webapps/iis/site-behavior-performance/http-error-500-19-webpage
  tipo: Configuración
  condiciones: []
