# Etapas de liberación de FaceOps: qué pantallas, opciones de menú y acciones entran en cada etapa. Es el único lugar
# donde se define: la consola pinta el distintivo «Etapa N» en el título de cada pantalla y en su opción del menú lateral,
# y el filtro «Ver solo la etapa liberada» del pie del menú atenúa lo demás. Para sumar la etapa 2..10 basta agregarla
# aquí (sin tocar plantillas).
#
# etapas_liberadas: etapas que ven los clientes. Vacío (o sin la clave) = sin restricción (laboratorio, preventa).
#   Con [1], quien no es administrador de Invoke no ve en el menú lo que no es de la etapa 1 y, si entra por URL directa a
#   una pantalla de otra etapa, recibe el aviso «aún no liberada». Se puede fijar por instancia desde Administración ›
#   Etapas (ajuste «etapas_liberadas», que manda sobre este archivo).
#
# Por etapa:
#   endpoints: pantallas (endpoint de Flask) que pertenecen a la etapa: llevan el distintivo en su título
#   menu:      opciones del menú lateral o de Gobierno («Sección» o «Sección › Opción») que llevan el punto de la etapa
#   rutas:     referencia legible (planilla «FaceOps - Funcionalidades y módulos» › columna Pantalla); no la usa el código
#   acciones:  acciones (plantillas de AAP) que la etapa libera
etapas_liberadas: []

# Bloqueo TEMPORAL de controles de otras etapas dentro de las pantallas de la etapa en revisión (la mayor liberada, o la 1):
# todo botón, enlace o acción que lleve a funcionalidad de otra etapa queda deshabilitado con la glosa «Etapa N · aún no
# liberada» (también para administradores y con el filtro del menú apagado), y si es una acción el servidor la rechaza.
# Se apaga con «activo: false» o desde Administración › Etapas de liberación (ajuste «etapas_bloqueo», que manda).
# Por regla: etapa (número del Plan de cierre; vacío = «otra etapa»), selectores (el control mismo), contenedores (todo control
# adentro) y rutas (expresiones sobre la ruta del enlace o del formulario, sin el prefijo del cliente; en POST se rechazan).
# Las acciones del catálogo toman su etapa de «acciones» de cada etapa y, si no están, de su sección (areas_etapa).
bloqueo:
  activo: true
  glosa: "Etapa {n} · aún no liberada"
  glosa_sin_etapa: "Otra etapa · aún no liberada"
  areas_etapa: {monitoreo: 2, servidores: 3, so: 3, plataformas: 3, contenedores: 3, bd: 4, seguridad: 5, redes: 6, storage: 6,
                infraestructura: 7, hipervisores: 7, nube: 7, aplicaciones: 8, arquitectura: 8, disponibilidad: 8, respaldos: 8,
                devsecops: 9, integraciones: null}
  reglas:
    - etapa: 2      # Monitoreo, salud y alertas
      selectores: [".al-btn", ".sl-barra", ".btn-prev", "#hb-btn ~ .al-btn"]
      contenedores: ["#al-dlg", "#sl-dlg"]
      rutas: ['/alertas(/|\?|$)', '^/monitoreo/(radar|kpi-okr|itil|alertas)', '^/autocuidado', '^/incidentes', '^/grafana/', '^/deudas']
    - etapa: 3      # Plataformas, contenedores, sistemas operativos y ciclo de vida de servidores
      selectores: ["#hb-btn", ".hb-btn", ".comp-mas", ".btn-plat", ".btn-desinst", ".ico-en.actualizar:not(.btn-agc)", "[onclick*='fxReplicar']"]
      contenedores: ["#hb-dlg", "#dlg-plat", "#actualizacion", "#usuarios-so"]
      rutas: ['/evaluar-so', '^/ciclo-vida', '^/sistemas-operativos', '^/so/', '^/plataformas', '/habilidad', '/skills', '^/stack', '^/homologacion', '^/licencias']
    - etapa: 5      # Seguridad: CVE, parches y certificados
      contenedores: ["#cves", "#politicas", "#cred-web"]
      rutas: ['^/politicas', '/cves?(/|\?|$)', '/parches', '^/certificados', '/certificado', '^/escaneo', '^/seguridad', '/credencial-web']
    - etapa: 6      # Redes, storage, estaciones y Edge
      selectores: [".disco-clic", ".dk-tab", ".btn-disco-det"]
      contenedores: ["#dk-velo"]
      rutas: ['^/redes', '^/storage', '^/estaciones', '^/edge', '/discos?(/|$)']
    - etapa: 7      # Hipervisores, nubes e infraestructuras conectadas
      selectores: [".btn-energ.mover", "[onclick*='fxAbrirRecursos']", "#rend_cpu"]
      contenedores: ["#dlg-mover", "#rec-velo"]
      rutas: ['^/hipervisores', '^/nubes', '^/infraestructuras', '^/centros-datos', '^/ecosistema', '/traslado', '/recursos(/|$)', '/mover']
    - etapa: 8      # Gobierno: stack, reportes, SLA, segmentos de negocio, respaldos
      contenedores: ["#puntos", "#pr-velo", "#segmentos-negocio", "#rep-dlg", "#rec-velo-pr"]
      rutas: ['/puntos(/|$)', '/recuperar', '/volver', '/versiones', '/respaldo', '^/respaldos', '^/mapa', '/replicar', '^/sla', '^/reportes', '^/gobierno', '^/arquitectura', '/segmentos']
    - etapa: 9      # Fábrica de software, DevSecOps e IA
      rutas: ['^/devsecops', '^/fabrica', '^/politicas-desarrollo', '^/ia(/|$)']
etapas:
  1:
    nombre: Núcleo
    alcance: "Consola, inventario, tickets, aprobaciones, cola de acciones y AAP"
    color: "#0066cc"
    endpoints:
      - consola.inicio                      # Panel (productividad y valor generado)
      - consola.riesgo_estado               # indicador de riesgo de la cabecera
      - consola.buscar_vista                # buscador global
      - consola.automatizaciones            # Acciones › Todas / por sección
      - consola.automatizacion              # ficha de la acción
      - consola.tickets                     # Monitoreo › Tickets
      - consola.ticket                      # ticket en vivo
      - consola.inventario                  # Servidores › Virtuales / Físicos (y alta manual)
      - consola.equipo                      # ficha del servidor
      - consola.consola_equipo              # consola SSH / RDP en el navegador
      - consola.consola_web_plataforma      # consolas web de productos
      - consola.aprobaciones_pendientes     # Monitoreo › Aprobaciones pendientes
      - consola.aprobaciones_traza          # Monitoreo › Trazabilidad de aprobaciones
      - consola.eventos_aap                 # Monitoreo › Eventos de AAP
      - consola.cola_acciones               # Monitoreo › Cola de acciones
      - consola.configuracion_usuarios      # Administración › Usuarios y perfiles
      - consola.configuracion_usuario       # usuario (ver como otro usuario)
      - consola.pruebas_automatizaciones    # Administración › Pruebas de acciones
      - consola.auditoria                   # Administración › Auditoría
      - consola.doble_factor                # Mi perfil › Doble factor
      - consola.ingresar                    # ingreso
      - consola.ingresar_codigo             # ingreso con doble factor
      - admin.catalogo                      # FaceOps-admin › Catálogo y tarifas
      - admin.panel                         # FaceOps-admin › Panel (datos de demostración)
    menu:
      - "Acciones"
      - "Acciones › Todas"
      - "Servidores"
      - "Servidores › Virtuales"
      - "Servidores › Físicos"
      - "Monitoreo"
      - "Monitoreo › Productividad"
      - "Monitoreo › Eventos de AAP"
      - "Monitoreo › Tickets"
      - "Monitoreo › Todos"
      - "Monitoreo › En ejecución"
      - "Monitoreo › Exitosos"
      - "Monitoreo › Fallidos"
      - "Monitoreo › Cola de acciones"
      - "Monitoreo › Trazabilidad de aprobaciones"
      - "Mi perfil"
      - "Mi perfil › Mis datos"
    rutas:
      - "/lab/ · /lab/riesgo/estado · /lab/buscar"
      - "/lab/automatizaciones · /lab/automatizaciones/<id>"
      - "/lab/tickets · /lab/tickets/<id> · /lab/cola"
      - "/lab/inventario · /lab/inventario/<id> · /lab/inventario/<id>/consola · /lab/inventario/<id>/consola-web/<plataforma>/"
      - "/lab/monitoreo/aprobaciones-pendientes · /lab/aprobaciones/trazabilidad · /lab/monitoreo/eventos-aap"
      - "/lab/configuracion/usuarios · /lab/configuracion/usuarios/<id> · /lab/configuracion/pruebas · /lab/auditoria"
      - "/ingresar · /ingresar/codigo · /cuenta/doble-factor · /admin/catalogo · /admin/"
    acciones:
      - "Infra · Encender o apagar equipo"
      - "FaceOps · Apagar equipo"
      - "FaceOps · Vincular máquina a la bóveda"
      - "FaceOps · Vincular máquina on-premise"
      - "FaceOps · Guardar credencial en la bóveda"
      - "Sistema · Inventariar máquina"
      - "Sistema · Paquetes · inventario y respaldo"
      - "Plataforma · Controlar servicio"
      - "Sistema · Quitar agente"
