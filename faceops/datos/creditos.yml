  "FaceOps · Incorporar máquinas":              {creditos: 1, unidad: equipo, por_que: "Dar acceso administrado a cada máquina importada (usuario, llave, sudo): ~15 min manuales por máquina"}
  "OpenShift · Habilitar clúster":              {creditos: 40, unidad: ejecución, por_que: "Instalar un clúster OpenShift (prerrequisitos, DNS, red, instalador y validación): ~2 días manuales"}
  "FaceOps · Habilitar servidor":               {creditos: 7, unidad: servidor, por_que: "Crear un servidor (sistema, recursos, red, acceso): ~2 h manuales"}
  "FaceOps · Replicar con alta disponibilidad": {creditos: 4, unidad: réplica, por_que: "Réplica idéntica + balanceo round robin (la VM de la réplica va incluida)"}
