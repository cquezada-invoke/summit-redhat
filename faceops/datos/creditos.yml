# Créditos FaceOps: lo que consume cada automatización por unidad, en relación al esfuerzo manual que reemplaza
# (factor de beneficio) y a su riesgo. Regla de referencia: 1 crédito ≈ 15-20 minutos de un especialista; las acciones
# de solo lectura cuestan 1; las pruebas de demo no cobran. Se cobra solo lo que termina bien.
# unidad: equipo (cada máquina donde corre) · servidor (cada servidor creado) · réplica · flujo · segmento · ejecución
# Ejemplo: crear una VM (7) + instalar JBoss (4) = 11; + replicarla en alta disponibilidad (4) = 15.
plan:
  nombre: "Managed Service · 10K"
  creditos_mes: 10000
  valor_credito: 1.5          # USD por crédito (referencial, para el valor del consumo)
por_defecto: {lectura: 1, escritura: 2}
automatizaciones:
