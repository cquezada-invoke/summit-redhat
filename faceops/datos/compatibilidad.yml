# Compatibilidad de cada automatización: en qué equipos se puede ejecutar. Se muestra como etiquetas en el catálogo y
# en cada equipo, y FaceOps no deja lanzarla sobre un equipo incompatible.
#   sistemas: rhel · ubuntu · linux (cualquiera) · windows        tipos: servidor · router · switch · firewall ·
#   red: frr · vyos · fortios (componente de red)                  balanceador · almacenamiento · estacion
#   skills: producto que debe tener el equipo (alguno)             proveedor: gcp · kvm
# Si una automatización no aparece aquí, se deduce por reglas (prefijo del nombre y skill que habilita).
reglas:   # (patrón sobre el nombre en AAP, compatibilidad) — gana la primera que calza
  - ["^SQL Server · (Levantamiento|Configurar alta|Conmutar)", {sistemas: [linux], tipos: [servidor], skills: [sqlserver]}]
  - ["^Certificados · OpenShift", {tipos: [clúster openshift]}]
  - ["^Windows ·|^Monitoreo · Exportador en Windows|^Remediación · IIS|^Drift · Windows|^DC · Active Directory", {sistemas: [windows], tipos: [servidor]}]
  - ["^Red · Configurar VLAN", {tipos: [firewall, router], red: [vyos, fortios]}]
  - ["^Red · (Aplicar configuración|Verificar drift|Actualizar firmware)|^Plataforma · Actualizar firmware", {tipos: [router, firewall, switch], red: [frr, vyos, fortios]}]
  - ["^Red · (Bloquear IP|Solicitar acceso|Revocar acceso|Revocar accesos vencidos)|^FaceOps · Acceso de red", {tipos: [firewall], red: [vyos, fortios]}]
  - ["^Nube ·", {proveedor: [gcp], tipos: [servidor]}]
  - ["^JBoss · (Desplegar|Aplicar|Restablecer)|^Remediación · (Reiniciar JBoss|Limpiar logs|Diagnosticar|Volver a la versión|Rollback)", {sistemas: [linux], tipos: [servidor], skills: [jboss]}]
  - ["^Autoservicio · (2|3)|^Remediación · Renovar certificado", {sistemas: [linux], tipos: [servidor], skills: [nginx]}]
  - ["^Remediación · Cola de pagos", {sistemas: [linux], tipos: [servidor], skills: [activemq]}]
  - ["^DC ·|^Drift ·|^Estado ·|^FaceOps · (Respaldo continuo|Agente de monitoreo|Apagar equipo|Volver a una versión|Recuperar servidor|Aplicar política)|^Vault ·|^Redis ·|^JBoss · Preparar|^Certificados ·|^Sistema · Cambio de hora", {sistemas: [linux], tipos: [servidor]}]
  - ["^Integración · PostgreSQL|^Incidentes · Diagnosticar PostgreSQL", {sistemas: [linux], tipos: [servidor], skills: [postgres]}]
  - ["^Incidentes · Verificar error conocido", {sistemas: [linux, windows], tipos: [servidor]}]
  - ["^Ciclo de vida · Evaluar destino", {tipos: [servidor]}]
  - ["^Migración · (Evaluar sistema operativo|RHEL a versión soportada|CentOS a RHEL|JBoss a EAP 8)", {sistemas: [linux], tipos: [servidor]}]
  - ["^FaceOps · Replicar con alta disponibilidad", {sistemas: [rhel], tipos: [servidor], skills: [jboss, nginx], proveedor: [kvm]}]
  - ["^FaceOps · Habilitar servidor", {crea: [rhel, ubuntu, windows]}]
  - ["^OpenShift · (Modelo de alertamiento|Remediar alerta|Relevamiento de imágenes|Habilitar OpenShift Virtualization)", {tipos: [clúster openshift]}]
  - ["^OpenShift · Habilitar", {crea: [openshift]}]
  - ["^OpenShift · (Diagnóstico de regularización|Respaldo de etcd|Recolectar clúster|Operador|Operadores OLM|Versión del clúster|Límites y cuotas|Informe y ficha|Agente de ACS)", {tipos: [clúster openshift]}]
  - ["^Plataforma · Preparar dependencias", {sistemas: [linux], tipos: [servidor], skills: [jboss]}]
  - ["^Autoservicio · (1|Retirar)", {sistemas: [linux], tipos: [servidor], skills: [tomcat]}]
  - ["^Autoservicio · Nuevo ambiente", {crea: [ambiente]}]
  - ["^FaceOps · Nuevo segmento", {crea: [segmento de negocio]}]
  - ["^Storage ·", {tipos: [almacenamiento], skills: [storage-emulado]}]
  - ["^Seguridad · (Revisar CVEs|Aplicar parches)", {sistemas: [rhel], tipos: [servidor, balanceador]}]
automatizaciones: {}
# Requisitos del fabricante para instalar cada plataforma (además del sistema): versiones mayores del sistema soportadas y
# memoria mínima. FaceOps no ofrece ni deja instalar la plataforma en una máquina que no los cumple (evita instalaciones
# que fallan a medio camino). ram_mb se compara con un 15 % de tolerancia (la memoria visible es algo menor a la asignada).
requisitos:
  "SQL Server · Preparar servidor": {sistemas: [rhel], versiones: ["8", "9"], ram_mb: 2048, fuente: "Microsoft: SQL Server 2022 en RHEL 8 o 9, mínimo 2 GB de memoria"}
  "JBoss · Preparar servidor": {sistemas: [rhel], versiones: ["8", "9"], ram_mb: 1024, fuente: "Red Hat: JBoss EAP 8 en RHEL 8 o 9"}
  "PostgreSQL · Preparar servidor": {sistemas: [rhel], versiones: ["8", "9", "10"], ram_mb: 1024, fuente: "Red Hat: PostgreSQL 16 en AppStream de RHEL 8, 9 y 10"}
  "MySQL · Preparar servidor": {sistemas: [rhel], versiones: ["8", "9", "10"], ram_mb: 1024, fuente: "Red Hat: MySQL 8 en AppStream"}
  "MongoDB · Preparar servidor": {sistemas: [rhel], versiones: ["8", "9"], ram_mb: 2048, fuente: "MongoDB: 8.0 soportado en RHEL 8 y 9 (x86_64)"}
  "DC · Satellite": {sistemas: [rhel], versiones: ["9"], ram_mb: 20480, fuente: "Red Hat: Satellite 6.16 en RHEL 9, mínimo 20 GB de memoria y 4 cores"}
  "DC · Red Hat IdM": {sistemas: [rhel], versiones: ["8", "9"], ram_mb: 4096, fuente: "Red Hat: IdM en RHEL 8 o 9, se recomiendan 4 GB o más"}
  "DC · Directory Server": {sistemas: [rhel], versiones: ["8", "9"], ram_mb: 2048, fuente: "Red Hat Directory Server 12 en RHEL 8 o 9"}
  "DC · Keycloak": {sistemas: [rhel], versiones: ["8", "9"], ram_mb: 1024, fuente: "Red Hat build of Keycloak en RHEL 8 o 9 (Java 17/21)"}
  "DC · midPoint": {sistemas: [linux], ram_mb: 2048, fuente: "Evolveum: midPoint necesita al menos 2 GB de memoria"}
  "Redis · Preparar servidor": {sistemas: [rhel], versiones: ["8", "9"], fuente: "Redis de los repositorios de RHEL 8 o 9"}
  "Redis · Instalar Redis Insight": {sistemas: [rhel], versiones: ["8", "9"], ram_mb: 1024, fuente: "Redis Insight en contenedor (podman)"}
  "Jenkins · Preparar servidor": {sistemas: [rhel], versiones: ["8", "9"], ram_mb: 2048, fuente: "Jenkins LTS en contenedor: 2 GB de memoria como mínimo práctico"}
  "Vault · Preparar servidor": {sistemas: [rhel], versiones: ["8", "9"], fuente: "HashiCorp: repositorio oficial para RHEL 8 o 9"}
  "DC · VPN": {sistemas: [rhel], versiones: ["8", "9"], fuente: "WireGuard en el kernel de RHEL 8.4+ o 9"}
