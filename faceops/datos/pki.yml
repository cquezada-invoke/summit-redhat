# Cómo clasifica FaceOps el certificado TLS que encuentra en cada flujo de red.
# CA interna: emisores que corresponden a la autoridad certificadora propia del cliente (Red Hat Certificate System).
ca_interna: ["Invoke CA interna", "Certificate Authority", "IPA.INVOKE", "Invoke Lab"]
# CA públicas conocidas
ca_publicas: ["Let's Encrypt", "DigiCert", "GlobalSign", "Sectigo", "GoDaddy", "Google Trust Services", "Amazon", "Entrust", "ISRG"]
