# Fábrica de código: revisa y despliega en OpenShift lo que generó el agente. Verifica las políticas de desarrollo automáticas
# (PD-02 a PD-08, PD-05 secretos, PD-12 análisis estático, PD-16 pruebas); si alguna obligatoria falla, no se despliega.
# El build y el despliegue ocurren en OpenShift (namespace fabrica-dev) con la cuenta de servicio del Secret «fabrica-ocp».
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: app-fabrica
spec:
  description: Aplicación de la Fábrica de código hacia OpenShift con sus políticas de desarrollo
  params:
    - {name: repo-url, default: "http://__HOST__:3000/fabrica/ejemplo.git"}
    - {name: revision, default: develop}
    - {name: app, default: ejemplo, description: "Nombre de la aplicación (repositorio)"}
    - {name: ambiente, default: desarrollo, description: "Ambiente al que despliega"}
  workspaces:
    - name: fuente
    - {name: cache, optional: true}
  tasks:
    - name: clonar
      workspaces: [{name: fuente, workspace: fuente}]
      params: [{name: repo-url, value: $(params.repo-url)}, {name: revision, value: $(params.revision)}]
      taskSpec:
        params: [{name: repo-url}, {name: revision}]
        workspaces: [{name: fuente}]
        steps:
          - name: git
            image: docker.io/alpine/git:2.45.2
            env: [{name: GIT_TOKEN, valueFrom: {secretKeyRef: {name: fabrica-git, key: token, optional: true}}}]
            script: |
              set -e
              URL="$(params.repo-url)"
              # repositorios privados de la Fábrica: lectura con el token del secret fabrica-git (nunca se imprime)
              [ -n "$GIT_TOKEN" ] && URL=$(echo "$URL" | sed "s#^http://#http://fabrica:${GIT_TOKEN}@#")
              rm -rf $(workspaces.fuente.path)/src
              git clone -q --depth 1 -b "$(params.revision)" "$URL" $(workspaces.fuente.path)/src 2>&1 | sed "s#${GIT_TOKEN:-sin-token}#***#g"
              git -C $(workspaces.fuente.path)/src remote set-url origin "$(params.repo-url)"
              git -C $(workspaces.fuente.path)/src log -1 --oneline
    - name: secretos
      runAfter: [clonar]
      workspaces: [{name: fuente, workspace: fuente}]
      taskSpec:
        workspaces: [{name: fuente}]
        steps:
          - {name: gitleaks, image: docker.io/zricethezav/gitleaks:v8.18.4, workingDir: $(workspaces.fuente.path)/src, script: "gitleaks detect --no-git --source . --redact"}
    - name: politicas
      runAfter: [clonar]
      workspaces: [{name: fuente, workspace: fuente}]
      taskSpec:
        workspaces: [{name: fuente}]
        steps:
          - name: politicas-desarrollo
            image: docker.io/library/python:3.12-alpine
            workingDir: $(workspaces.fuente.path)/src
            script: |
              #!/usr/bin/env python3
              # Políticas de software (OpenShift + Spring Boot) que se verifican de forma automática
              import glob, os, re, sys
              malos = []
              cf = open("Containerfile").read() if os.path.exists("Containerfile") else ""
              if not cf: malos.append("PS-21 falta Containerfile")
              froms = re.findall(r"^FROM\s+(\S+)", cf, re.M)
              if not froms or not froms[-1].startswith("registry.access.redhat.com/ubi9/openjdk-") or froms[-1].endswith(":latest") or ":" not in froms[-1].rsplit("/", 1)[-1]:
                  malos.append("PS-01 imagen de ejecución ubi9/openjdk con versión fija")
              u = re.findall(r"^USER\s+(\S+)", cf, re.M)
              if not u or u[-1] in ("0", "root"): malos.append("PS-08 USER no root")
              if not re.search(r"^EXPOSE\s+8080", cf, re.M): malos.append("PS-21 EXPOSE 8080")
              pom = open("pom.xml").read() if os.path.exists("pom.xml") else ""
              for k, p in (("spring-boot-starter-parent", "PS-02"), ("spring-boot-starter-security", "PS-06"), ("micrometer-registry-prometheus", "PS-23")):
                  if k not in pom: malos.append(f"{p} pom.xml sin {k}")
              if "SNAPSHOT" in pom: malos.append("PS-02 dependencias SNAPSHOT")
              dep = "".join(open(f).read() for f in glob.glob("deploy/*.y*ml"))
              for k, p in (("livenessProbe", "PS-15"), ("readinessProbe", "PS-15"), ("requests", "PS-18"), ("limits", "PS-18"),
                           ("kind: Route", "PS-21"), ("termination: edge", "PS-12"), ("IMAGEN_APP", "PS-21"),
                           ("kind: HorizontalPodAutoscaler", "PS-13"), ("kind: PodDisruptionBudget", "PS-14"), ("runAsNonRoot", "PS-08")):
                  if k not in dep: malos.append(f"{p} deploy/ sin {k}")
              print("\n".join("INCUMPLE " + x for x in malos) or "Políticas de software automáticas: todas cumplen")
              sys.exit(1 if malos else 0)
    - name: pruebas
      runAfter: [politicas, secretos]
      workspaces: [{name: fuente, workspace: fuente}]
      taskSpec:
        workspaces: [{name: fuente}]
        steps:
          - name: pruebas-unitarias
            image: registry.access.redhat.com/ubi9/openjdk-21:1.20
            workingDir: $(workspaces.fuente.path)/src
            env: [{name: HOME, value: /tmp}, {name: MAVEN_OPTS, value: "-Xmx768m"}]
            script: |
              set -e
              if [ -f pom.xml ]; then echo "Spring Boot: mvn verify (JUnit 5 y cobertura JaCoCo del pom)" && cp -r . /tmp/src && cd /tmp/src && mvn -B -q -Dmaven.repo.local=/tmp/m2 verify; \
              elif [ -f requirements.txt ]; then pip install -q -r requirements.txt pytest pytest-cov && python -m pytest -q --cov=. --cov-fail-under=70; \
              elif [ -f package.json ]; then echo "Node: npm test" && npx --yes npm@10 ci && npx --yes npm@10 test; \
              else echo "PS-25: sin pruebas reconocibles" && exit 1; fi
    - name: analisis-estatico
      runAfter: [politicas]
      workspaces: [{name: fuente, workspace: fuente}]
      taskSpec:
        workspaces: [{name: fuente}]
        steps:
          - {name: semgrep, image: docker.io/semgrep/semgrep:1.85.0, workingDir: $(workspaces.fuente.path)/src, script: "semgrep scan --config p/default --severity ERROR --error --metrics=off ."}
    - name: construir-y-desplegar
      runAfter: [pruebas, analisis-estatico]
      workspaces: [{name: fuente, workspace: fuente}]
      params: [{name: app, value: $(params.app)}, {name: ambiente, value: $(params.ambiente)}]
      taskSpec:
        params: [{name: app}, {name: ambiente}]
        workspaces: [{name: fuente}]
        steps:
          - name: secretos-requeridos
            image: registry.access.redhat.com/ubi9/python-311:1-77
            workingDir: $(workspaces.fuente.path)/src
            script: |
              #!/usr/bin/env python3
              # Qué Secrets y claves piden los manifiestos (nunca están en el repositorio): fuera de producción el pipeline los genera
              import glob, re
              out = set()
              for f in glob.glob("deploy/**/*.y*ml", recursive=True):
                  t = open(f).read()
                  for m in re.finditer(r"secretKeyRef:\s*\{?\s*(?:name:\s*([\w.-]+)[,\s]+key:\s*([\w.-]+)|key:\s*([\w.-]+)[,\s]+name:\s*([\w.-]+))", t):
                      out.add((m.group(1) or m.group(4), m.group(2) or m.group(3)))
              open("$(workspaces.fuente.path)/secretos.txt", "w").write("".join(f"{n} {k}\n" for n, k in sorted(out)))
              print("Secrets que piden los manifiestos:", sorted(out) or "ninguno")
          - name: openshift
            image: quay.io/openshift/origin-cli:4.16
            workingDir: $(workspaces.fuente.path)/src
            env:
              - {name: OCP_SERVER, valueFrom: {secretKeyRef: {name: fabrica-ocp, key: servidor}}}
              - {name: OCP_TOKEN, valueFrom: {secretKeyRef: {name: fabrica-ocp, key: token}}}
              - {name: OCP_NS, valueFrom: {secretKeyRef: {name: fabrica-ocp, key: namespace}}}
              - {name: OCP_DOMINIO, valueFrom: {secretKeyRef: {name: fabrica-ocp, key: dominio}}}
            script: |
              set -e
              A=$(params.app)
              oc login --server="$OCP_SERVER" --token="$OCP_TOKEN" --insecure-skip-tls-verify=true >/dev/null
              oc project "$OCP_NS" >/dev/null
              oc get bc "$A" >/dev/null 2>&1 || oc new-build --name "$A" --binary --strategy docker -l app.kubernetes.io/part-of=fabrica-codigo >/dev/null
              [ -f Containerfile ] && oc patch bc "$A" --type=merge -p '{"spec":{"strategy":{"dockerStrategy":{"dockerfilePath":"Containerfile"}}}}' >/dev/null
              oc start-build "$A" --from-dir=. --wait --follow | tail -5
              IMG=$(oc get is "$A" -o jsonpath='{.status.dockerImageRepository}'):latest
              if [ "$(params.ambiente)" != "produccion" ] && [ -s $(workspaces.fuente.path)/secretos.txt ]; then   # secretos de prueba, generados aquí (nunca se imprimen)
                for N in $(cut -d' ' -f1 $(workspaces.fuente.path)/secretos.txt | sort -u); do
                  oc get secret "$N" >/dev/null 2>&1 && continue
                  ARGS=""; CLAVE=$(head -c 24 /dev/urandom | base64 | tr -dc A-Za-z0-9 | head -c 20)   # una sola clave por Secret: app y base deben coincidir
                  for K in $(awk -v n="$N" '$1==n{print $2}' $(workspaces.fuente.path)/secretos.txt); do
                    case "$K" in *user*|*usuario*|*USER*|*USUARIO*) V="app";; *pass*|*PASS*|*clave*|*CLAVE*) V="$CLAVE";; *base*|*database*|*db*|*DB*|*DATABASE*|*BASE*) V="$A";; *) V=$(head -c 24 /dev/urandom | base64 | tr -dc A-Za-z0-9 | head -c 20);; esac
                    ARGS="$ARGS --from-literal=$K=$V"
                  done
                  oc create secret generic "$N" $ARGS >/dev/null && echo "Secret $N creado para $(params.ambiente)"
                done
              fi
              EXTRA=""; case "$(params.ambiente)" in desarrollo) EXTRA="deploy/desarrollo deploy/dev";; qa) EXTRA="deploy/qa";; produccion) EXTRA="deploy/produccion deploy/prod";; esac
              for d in $EXTRA; do [ -d "$d" ] && for f in "$d"/*.y*ml; do oc apply -f "$f"; done; done   # dependencias del ambiente (p. ej. PostgreSQL de desarrollo)
              H="$A.$OCP_DOMINIO"; R=$(oc get route "$A" -o jsonpath='{.spec.host}' 2>/dev/null || true)
              [ -z "$R" ] || [ "$R" = "$H" ] || { oc delete route "$A" >/dev/null; echo "Route $A: host $R reemplazado por $H"; }   # el host es inmutable
              for f in deploy/*.y*ml; do sed -e "s#IMAGEN_APP#$IMG#g" -e "s#^\(\s*host:\s*\).*#\1$H#" "$f" | oc apply -f -; done
              if ! oc get route "$A" -o jsonpath='{.spec.host}' | grep -qx "$H"; then   # sin host en el manifiesto: se recrea con el del ambiente
                S=$(oc get route "$A" -o jsonpath='{.spec.to.name}'); P=$(oc get route "$A" -o jsonpath='{.spec.port.targetPort}')
                oc delete route "$A" >/dev/null && oc create route edge "$A" --service="$S" ${P:+--port=$P} --hostname="$H" --insecure-policy=Redirect >/dev/null && echo "Route $A con host $H"
              fi
              [ "$(params.ambiente)" = "produccion" ] || { oc patch hpa "$A" --type=merge -p '{"spec":{"minReplicas":1}}' >/dev/null 2>&1; oc scale deploy/"$A" --replicas=1 >/dev/null 2>&1; } || true   # PS-13: 2+ réplicas solo en producción
              if [ "$(params.ambiente)" != "produccion" ]; then   # desarrollo/QA: requests mínimos y, si el clúster no asigna StorageClass, disco efímero
                for D in $(oc get deploy -o name | grep "^deployment.apps/$A"); do
                  oc set resources "$D" --requests=cpu=50m,memory=256Mi >/dev/null 2>&1 || true
                  for V in $(oc get "$D" -o jsonpath='{range .spec.template.spec.volumes[*]}{.name}={.persistentVolumeClaim.claimName}{" "}{end}'); do
                    C="${V#*=}"; [ -n "$C" ] || continue
                    [ -z "$(oc get pvc "$C" -o jsonpath='{.spec.storageClassName}' 2>/dev/null)" ] || continue
                    oc set volume "$D" --add --overwrite --name="${V%%=*}" --type=emptyDir >/dev/null && oc delete pvc "$C" --ignore-not-found >/dev/null && echo "${D#*/}: PVC $C sin StorageClass, usa emptyDir en $(params.ambiente)"
                  done
                done
              fi
              oc rollout restart deploy/"$A" >/dev/null 2>&1 || true
              oc rollout status deploy/"$A" --timeout=240s
              echo "Aplicación desplegada en $(params.ambiente): https://$(oc get route "$A" -o jsonpath='{.spec.host}')"
