# Mapeo de cada tipo de hallazgo del escaneo de servidores (aap/escaneo-servidores.yml) a NIST CSF 2.0 y CIS Controls v8.
# Base: mapeo oficial CIS Controls v8 ↔ NIST CSF 2.0 (Center for Internet Security), a nivel de salvaguarda CIS y
# subcategoría NIST. Cada tipo tiene UNA subcategoría NIST y UNA salvaguarda CIS, para que las tres vistas sumen el mismo
# total. Si un tipo no tiene mapeo claro se deja en null y la página lo muestra en «sin clasificar» (no se inventa).
# «control» es el identificador exacto que emite el escaneo; «prefijo» agrupa los que llevan el puerto o el servicio.

fuente: "Mapeo oficial CIS Controls v8 ↔ NIST CSF 2.0 (Center for Internet Security)"

nist_categorias:
  GV.PO: Políticas de ciberseguridad
  GV.RR: Roles, responsabilidades y autoridades
  GV.OV: Supervisión
  ID.AM: Gestión de activos
  ID.RA: Evaluación de riesgos
  ID.IM: Mejora
  PR.AA: Gestión de identidades, autenticación y control de acceso
  PR.AT: Concienciación y formación
  PR.DS: Seguridad de los datos
  PR.PS: Seguridad de las plataformas
  PR.IR: Resiliencia de la infraestructura tecnológica
  DE.CM: Monitoreo continuo
  DE.AE: Análisis de eventos adversos
  RS.MA: Gestión de incidentes
  RS.AN: Análisis de incidentes
  RS.CO: Comunicación de la respuesta
  RS.MI: Mitigación de incidentes
  RC.RP: Ejecución del plan de recuperación
  RC.CO: Comunicación de la recuperación

nist_subcategorias:
  PR.AA-01: Las identidades y credenciales de usuarios, servicios y equipos autorizados se gestionan
  PR.AA-05: Los permisos de acceso se definen, gestionan y revisan con mínimo privilegio y separación de funciones
  PR.PS-01: Se establecen y aplican prácticas de gestión de la configuración
  PR.PS-02: El software se mantiene, reemplaza y retira según el riesgo
  PR.IR-01: Las redes y entornos se protegen del acceso y uso lógico no autorizado
  PR.AA-03: Se autentica a usuarios, servicios y equipos
  PR.DS-01: Se protege la confidencialidad, integridad y disponibilidad de los datos en reposo
  PR.DS-02: Se protege la confidencialidad, integridad y disponibilidad de los datos en tránsito
  PR.DS-11: Se crean, protegen, mantienen y prueban respaldos de los datos
  PR.PS-04: Se generan registros (logs) disponibles para el monitoreo continuo
  PR.PS-05: Se impide instalar y ejecutar software no autorizado
  PR.PS-06: Se integran prácticas de desarrollo seguro de software
  PR.IR-03: Se implementan mecanismos para cumplir los requisitos de resiliencia
  PR.IR-04: Se mantiene capacidad de recursos suficiente para asegurar la disponibilidad
  DE.CM-09: Se monitorea el hardware, el software, los entornos de ejecución y sus datos
  ID.RA-01: Se identifican, validan y registran las vulnerabilidades de los activos

cis_controles:
  1: Inventario y control de activos empresariales
  2: Inventario y control de activos de software
  3: Protección de datos
  4: Configuración segura de activos empresariales y software
  5: Gestión de cuentas
  6: Gestión del control de acceso
  7: Gestión continua de vulnerabilidades
  8: Gestión de registros de auditoría
  9: Protecciones de correo electrónico y navegador web
  10: Defensas contra malware
  11: Recuperación de datos
  12: Gestión de la infraestructura de red
  13: Monitoreo y defensa de la red
  14: Concienciación y formación en seguridad
  15: Gestión de proveedores de servicios
  16: Seguridad del software de aplicación
  17: Gestión de respuesta a incidentes
  18: Pruebas de penetración

# Salvaguardas usadas y su grupo de implementación (IG) mínimo: IG1 higiene básica, IG2 y IG3 madurez creciente
cis_salvaguardas:
  "2.2": {nombre: Asegurar que el software autorizado tenga soporte vigente, ig: 1}
  "4.1": {nombre: Establecer y mantener un proceso de configuración segura, ig: 1}
  "4.4": {nombre: Implementar y gestionar un firewall en los servidores, ig: 1}
  "4.8": {nombre: Desinstalar o deshabilitar servicios innecesarios, ig: 2}
  "5.2": {nombre: Usar contraseñas únicas, ig: 1}
  "5.4": {nombre: Restringir los privilegios de administrador a cuentas de administración dedicadas, ig: 1}
  "7.3": {nombre: Gestión automatizada de parches del sistema operativo, ig: 1}
  "2.5": {nombre: Lista de software autorizado (allowlist), ig: 2}
  "3.3": {nombre: Configurar listas de control de acceso a los datos, ig: 1}
  "3.10": {nombre: Cifrar los datos sensibles en tránsito, ig: 2}
  "4.3": {nombre: Bloqueo automático de sesión en los activos, ig: 1}
  "6.7": {nombre: Centralizar el control de acceso, ig: 2}
  "8.2": {nombre: Recolectar registros de auditoría, ig: 1}
  "8.4": {nombre: Estandarizar la sincronización de hora, ig: 2}
  "11.1": {nombre: Establecer y mantener un proceso de recuperación de datos, ig: 1}
  "16.1": {nombre: Establecer y mantener un proceso de desarrollo seguro, ig: 2}
  "16.4": {nombre: Inventario de componentes de software de terceros, ig: 2}
  "16.5": {nombre: Usar componentes de terceros actualizados y confiables, ig: 2}
  "16.10": {nombre: Aplicar principios de diseño seguro en la arquitectura de aplicaciones, ig: 2}
  "16.12": {nombre: Implementar verificaciones de seguridad a nivel de código, ig: 3}

tipos:
  # Parches y ciclo de vida
  - {control: cve-criticos, nombre: Avisos de seguridad críticos sin aplicar, nist: PR.PS-02, cis: "7.3"}
  - {control: cve-importantes, nombre: Avisos de seguridad importantes sin aplicar, nist: PR.PS-02, cis: "7.3"}
  - {control: reinicio, nombre: Parches instalados sin cargar (requiere reinicio), nist: PR.PS-02, cis: "7.3"}
  - {control: sin-suscripcion, nombre: Sin suscripción (no recibe parches del fabricante), nist: PR.PS-02, cis: "2.2"}
  - {control: eol, nombre: Sistema operativo fuera de soporte, nist: PR.PS-02, cis: "2.2"}
  # Acceso SSH
  - {control: ssh-root, nombre: SSH permite entrar como root, nist: PR.AA-05, cis: "5.4"}
  - {control: ssh-clave, nombre: SSH acepta contraseñas (no solo llaves), nist: PR.PS-01, cis: "4.1"}
  - {control: ssh-vacia, nombre: SSH acepta contraseñas vacías, nist: PR.AA-01, cis: "5.2"}
  # Cuentas, sudo y contraseñas
  - {control: uid0, nombre: Otras cuentas con privilegios de root, nist: PR.AA-05, cis: "5.4"}
  - {control: sudo-nopasswd, nombre: sudo sin contraseña, nist: PR.AA-05, cis: "5.4"}
  - {control: sin-clave, nombre: Cuentas sin contraseña, nist: PR.AA-01, cis: "5.2"}
  # CIS v8 (5.2) ya no exige el vencimiento periódico de contraseñas: no tiene salvaguarda CIS clara
  - {control: vigencia-clave, nombre: Contraseñas que no vencen, nist: PR.AA-01, cis: null}
  # Endurecimiento y permisos
  - {control: selinux, nombre: SELinux fuera de Enforcing, nist: PR.PS-01, cis: "4.1"}
  - {control: escritura-mundial, nombre: Archivos de /etc modificables por cualquiera, nist: PR.PS-01, cis: "4.1"}
  # Red, puertos y servicios
  - {control: firewall, nombre: Firewall local detenido, nist: PR.IR-01, cis: "4.4"}
  - {prefijo: puerto-, nombre: Puertos de protocolos inseguros abiertos a la red, nist: PR.PS-01, cis: "4.8"}
  - {prefijo: servicio-, nombre: Servicios inseguros activos, nist: PR.PS-01, cis: "4.8"}
  - {prefijo: expuesto-, nombre: Bases de datos o cachés escuchando en todas las interfaces, nist: PR.IR-01, cis: "4.4"}

# Políticas de seguridad (datos/politicas.yml, /lab/politicas) y de desarrollo (datos/politicas-desarrollo.yml), por código.
# Van aquí y no en sus yml para no cambiar su versión (un cambio en la política la vuelve a aplicar en los equipos).
# Lista vacía = sin mapeo claro: se muestra «sin clasificar».
politicas:
  SO-01: {nist: [PR.PS-01, PR.AA-05], cis: ["4.1", "5.4"]}        # SSH endurecido (sin root, solo llaves)
  SO-02: {nist: [PR.PS-01], cis: ["4.1"]}                          # parámetros de kernel
  SO-03: {nist: [PR.PS-01], cis: ["4.3"]}                          # cierre de sesión inactiva (el aviso legal no tiene salvaguarda CIS)
  COM-01: {nist: [PR.DS-02], cis: ["3.10"]}                        # criptografía sin protocolos débiles
  COM-02: {nist: [], cis: ["8.4"]}                                 # hora sincronizada: sin subcategoría NIST clara
  RED-01: {nist: [PR.IR-01], cis: ["4.4"]}                         # firewall del equipo
  RED-02: {nist: [PR.PS-01], cis: ["4.1"]}                         # sin reenvío de paquetes
  DAT-01: {nist: [PR.DS-01, PR.AA-05], cis: ["3.3"]}               # permisos de archivos sensibles
  DAT-02: {nist: [PR.DS-02], cis: ["3.10"]}                        # BD con conexiones cifradas
  APP-01: {nist: [PR.PS-01], cis: ["4.1"]}                         # Nginx sin versión
  APP-02: {nist: [PR.PS-01], cis: ["4.1"]}                         # consola JBoss solo local
  IDN-01: {nist: [PR.PS-04], cis: ["8.2"]}                         # sudo con registro
  CON-01: {nist: [PR.PS-05], cis: ["2.5"]}                         # registros de contenedores confiables
  CON-02: {nist: [PR.IR-04], cis: []}                              # límites por contenedor: sin salvaguarda CIS clara
  AUD-01: {nist: [PR.PS-04, DE.CM-09], cis: ["8.2"]}               # auditd
  PS-01: {nist: [PR.PS-06], cis: ["16.5"]}
  PS-02: {nist: [PR.PS-02], cis: ["2.2", "16.5"]}
  PS-03: {nist: [PR.PS-06], cis: ["16.4"]}
  PS-04: {nist: [], cis: []}
