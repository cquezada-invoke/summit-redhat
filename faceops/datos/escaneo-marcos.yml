  PS-07: {nist: [PR.PS-06], cis: ["16.1"]}
  PS-08: {nist: [PR.PS-01], cis: ["4.1"]}
  PS-09: {nist: [ID.RA-01], cis: ["16.12"]}
  PS-10: {nist: [PR.PS-06], cis: ["16.10"]}
  PS-11: {nist: [PR.PS-06], cis: ["16.10"]}
