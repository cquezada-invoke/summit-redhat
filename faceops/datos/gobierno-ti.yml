# Gobierno de TI · árbol de dependencia (base: «Gobierno de TI - árbol de Arquitectura», Invoke).
# N0 Gobierno de TI → N1 el gobierno → N2 la rama (frentes) → N3 industria → N4 país. Cada nivel depende del anterior;
# industria y país no agregan frentes, solo cambian el contenido de cada uno. Se evalúa de a poco: cada nodo tiene su
# nivel de madurez (ACMM 0–5) y su evidencia, que FaceOps guarda por cliente con su historial.
raiz: {id: gti, nombre: "Gobierno de TI", estandar: "ISO/IEC 38500 · COBIT 2019",
       desc: "Decisiones, inversión, riesgo y desempeño del área de tecnología. Bajo el Gobierno de Tecnología y el Gobierno Corporativo."}
capas:
  - {nombre: "Gobierno Corporativo", desc: "Cómo se dirige la organización completa"}
  - {nombre: "Gobierno de Tecnología", desc: "La tecnología como activo de la organización"}
  - {nombre: "Gobierno de TI", desc: "Decisiones, inversión, riesgo y desempeño del área de tecnología"}
gobiernos:
  - {id: arquitectura, nombre: "Gobierno de Arquitectura", estandar: "TOGAF 10 · ArchiMate 3.2", desc: "Estándares y decisiones de diseño", estado_modelo: "En construcción: N2 listo"}
  - {id: servicios, nombre: "Gobierno de Servicios", estandar: "ITIL 4", desc: "Operación y entrega de servicios de TI", faceops: {texto: "Monitoreo › ITIL", ep: consola.itil}}
  - {id: seguridad, nombre: "Gobierno de Seguridad", estandar: "ISO 27001 · NIST CSF", desc: "Controles, riesgo y cumplimiento", faceops: {texto: "Seguridad › Mapa de seguridad (NIST CSF 2.0)", ep: consola.seguridad_mapa}}
  - {id: datos, nombre: "Gobierno de Datos", estandar: "DAMA-DMBOK", desc: "Calidad, propiedad y uso de la información"}
  - {id: portafolio, nombre: "Gobierno de Portafolio", estandar: "PMI · MoP", desc: "Priorización de inversión y proyectos"}
# N2 · Gobierno de Arquitectura: doce frentes anclados a TOGAF 10 y tres bandas que cruzan todo el árbol
frentes:
  - {id: negocio, tipo: tecnico, nombre: "Negocio", desc: "Capacidades · Cadenas de valor · Organización", referencia: "Guía de negocio", togaf: "Fase B"}
  - {id: datos, tipo: tecnico, nombre: "Datos", desc: "Entidades · Flujos · Mapeo de información", referencia: "Guía de información", togaf: "Fase C"}
  - {id: aplicaciones, tipo: tecnico, nombre: "Aplicaciones", desc: "Portafolio · Integración · Microservicios", referencia: "III-RM", togaf: "Fase C",
     faceops: {texto: "Aplicaciones › Segmentos de negocio", ep: consola.mapa}}
  - {id: tecnologia, tipo: tecnico, nombre: "Tecnología", desc: "Plataforma · Nube · Infraestructura", referencia: "TRM", togaf: "Fase D",
     faceops: {texto: "Arquitectura › Stack tecnológico y ciclo de vida", ep: consola.stack_tecnologico}}
  - {id: seguridad, tipo: tecnico, nombre: "Seguridad", desc: "Riesgo · Controles · Zonas de confianza", referencia: "Guía de seguridad", togaf: "Transversal A–H",
     faceops: {texto: "Seguridad › Mapa de seguridad", ep: consola.seguridad_mapa}}
  - {id: soluciones, tipo: tecnico, nombre: "Soluciones", desc: "Diseño por proyecto · Contratos de arquitectura", referencia: "Entrega de soluciones", togaf: "Fase G",
     faceops: {texto: "Arquitectura › Arquitectura (segmentos aprobados)", ep: consola.ecosistema}}
  - {id: gobierno, tipo: no_tecnico, nombre: "Gobierno", desc: "Principios · Comité · Cumplimiento", referencia: "Gobierno de arquitectura", togaf: "Preliminar y G",
     faceops: {texto: "Monitoreo › Trazabilidad de aprobaciones", ep: consola.aprobaciones_traza}}
  - {id: vision, tipo: no_tecnico, nombre: "Visión", desc: "Alcance · Partes interesadas · Declaración de trabajo", referencia: "Escenarios de negocio", togaf: "Fase A"}
  - {id: requisitos, tipo: no_tecnico, nombre: "Requisitos", desc: "Requisitos · Restricciones · Trazabilidad", referencia: "Gestión de requisitos", togaf: "Centro del ADM"}
  - {id: hoja_ruta, tipo: no_tecnico, nombre: "Hoja de ruta", desc: "Transición · Migración · Caso de negocio", referencia: "Planificación de migración", togaf: "Fases E y F",
     faceops: {texto: "Arquitectura › Racionalización del stack", ep: consola.stack_racionalizacion}}
  - {id: cambio, tipo: no_tecnico, nombre: "Cambio", desc: "Monitoreo · Cuándo abrir un nuevo ciclo", referencia: "Gestión del cambio", togaf: "Fase H",
     faceops: {texto: "Stack tecnológico › Ciclo de vida del fabricante", ep: consola.ciclo_vida}}
  - {id: capacidades, tipo: no_tecnico, nombre: "Capacidades", desc: "Roles · Repositorio · Herramientas", referencia: "Skills Framework", togaf: "Capacidad"}
bandas:
  - {id: modelos, nombre: "Modelos de referencia", pregunta: "Qué se reutiliza", referencia: "Enterprise Continuum", base: "TRM · III-RM · Modelos de industria"}
  - {id: impulsores, nombre: "Impulsores", pregunta: "Por qué se mueve", referencia: "Escenarios de negocio · ArchiMate motivación", base: "Costo · Soporte · Regulación · Competencia · Cliente · Talento"}
  - {id: verificacion, nombre: "Verificación", pregunta: "Qué tan maduro", referencia: "ACMM", base: "Revisiones de cumplimiento · Contratos de arquitectura"}
# N3 · industrias (portafolio por industria de Red Hat) y N4 · países donde opera Invoke
industrias: [{id: salud, nombre: Salud}, {id: telco, nombre: Telecomunicaciones}, {id: banca, nombre: "Servicios financieros"}, {id: publico, nombre: "Sector público"}, {id: industrial, nombre: Industrial}]
paises: [{id: co, nombre: Colombia}, {id: ar, nombre: Argentina}, {id: mx, nombre: México}, {id: cl, nombre: Chile}, {id: br, nombre: Brasil}]
