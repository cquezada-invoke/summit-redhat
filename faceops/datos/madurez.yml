# Madurez operativa (radar del panel). Pilares de AWS Well-Architected; escala de madurez COBIT 2019 / CMMI
# (nivel 1 Inicial · 2 Gestionado · 3 Definido · 4 Medido · 5 Optimizado; cada nivel = 20 % de la escala).
# Escala 0-100 % por pilar:
#   100 % = el máximo de la escala (todas las prácticas en todos los equipos).
#   meta  = el nivel que el cliente necesita para ser competitivo en ese pilar (se acuerda con el cliente; no es 100 %).
#   actual = foto de hoy, medida con las prácticas de abajo sobre los equipos visibles.
metas:
  Disponibilidad: 80
  Rendimiento: 70
  Seguridad: 80
  Recuperación: 72
  Costo: 70
  Excelencia operativa: 75
