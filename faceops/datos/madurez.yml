# Madurez operativa (radar del panel). Escala 0-100 % por pilar:
#   100 % = el máximo de la escala (todas las prácticas en todos los equipos).
#   meta  = el nivel que el cliente necesita para ser competitivo en ese pilar (se acuerda con el cliente; no es 100 %).
#   actual = foto de hoy, medida con las prácticas de abajo sobre los equipos visibles.
metas:
  Disponibilidad: 80
  Hallazgos: 75
  Rendimiento: 70
  Seguridad: 80
  Recuperación: 72
