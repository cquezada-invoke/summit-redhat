fichas:
  "FaceOps · Agente de monitoreo (Linux)": {nombre: "Agente de monitoreo (Linux)", descripcion: "Instala el agente de métricas en los equipos elegidos", tipo: escritura, minutos_manual: 30, tarifa: 10, etiquetas: [agente, monitoreo, metricas, prometheus]}
  "FaceOps · Incorporar máquinas": {nombre: "Incorporar máquinas a FaceOps", descripcion: "Deja el usuario de servicio de FaceOps en todas las máquinas de una nube (GCP, Azure o AWS) usando la API de la plataforma: la llave privada queda solo en AAP y las máquinas quedan administrables sin cargar credenciales una por una", categoria: "Infraestructuras", tipo: escritura, usa_limite: 0, requiere_aprobacion: 1, minutos_manual: 240, tarifa: 60, etiquetas: [credenciales, acceso, ssh, incorporar, nube, maquinas, onboarding]}
  "Jenkins · Preparar servidor": {nombre: "Habilitar Jenkins", descripcion: "Instala Jenkins LTS (contenedor) con Pipeline y Git; se abre desde la ficha del equipo a través de FaceOps, sin exponer su clave", categoria: "Plataformas de aplicación", tipo: escritura, requiere_aprobacion: 1, minutos_manual: 120, tarifa: 20, etiquetas: [jenkins, ci, cd, ci/cd, pipeline, devops, integración continua]}
  "Despliegue · Cambiar tráfico": {nombre: "Cambiar tráfico de una app (blue-green, canary, A/B)", descripcion: "En el balanceador deja la puerta de la app con dos grupos (azul = versión actual, verde = nueva) y mueve el tráfico según la estrategia: todo a un grupo, un porcentaje o por cookie de usuario. Mide a dónde llega cada petición; la reversa es devolver el tráfico al otro grupo", categoria: "Despliegues", tipo: escritura, usa_limite: 1, requiere_aprobacion: 1, minutos_manual: 60, tarifa: 20, etiquetas: [blue-green, canary, ab, despliegue, balanceador, nginx, tráfico]}
  "Infra · Preparar centro de datos emulado": {nombre: "Preparar centro de datos emulado", descripcion: "Para demostraciones: un segundo centro de datos dentro del anfitrión KVM, con su propia red y su propio pool de discos", categoria: "Infraestructuras", tipo: escritura, usa_limite: 0, requiere_aprobacion: 1, minutos_manual: 30, tarifa: 10, etiquetas: [centro de datos, kvm, red, pool, emulado]}
  "Infra · Mover máquina entre centros de datos": {nombre: "Mover máquina entre centros de datos", descripcion: "Traslada una máquina virtual de un centro de datos a otro (A ↔ B): apagado ordenado, copia de discos, red del destino e IP nueva. La de origen queda apagada como vuelta atrás hasta confirmar", categoria: "Infraestructuras", tipo: escritura, usa_limite: 0, requiere_aprobacion: 1, minutos_manual: 90, tarifa: 20, etiquetas: [mover, trasladar, migrar, centro de datos, kvm, valparaíso, santiago]}
  "Infra · Ajustar recursos de máquinas": {nombre: "Ajustar recursos de máquinas (vCPU y memoria)", descripcion: "Sube o baja los vCPU y la memoria de una o varias máquinas del centro de datos: apagado ordenado, ajuste y encendido. Las apagadas quedan apagadas con los recursos nuevos", categoria: "Infraestructuras", tipo: escritura, usa_limite: 0, requiere_aprobacion: 1, minutos_manual: 20, tarifa: 10, etiquetas: [recursos, cpu, memoria, ram, kvm, dimensionar]}
  "Identidad · Fuente de usuarios de FaceOps": {nombre: "Fuente de usuarios de FaceOps", descripcion: "Integra desde Ansible una fuente de usuarios (Active Directory, LDAP o el IGA midPoint): lee usuarios y grupos o roles con su credencial de AAP y deja el autenticador LDAP en el Gateway de AAP. Se pide desde Integraciones", categoria: "Seguridad", tipo: escritura, usa_limite: 0, visible: 0, requiere_aprobacion: 1, minutos_manual: 120, tarifa: 5, etiquetas: [identidad, ldap, active directory, midpoint, iga, usuarios, gateway]}
  "Monitoreo · Responder alerta": {nombre: "Responder alerta de objeto", descripcion: "Lo lanza Event-Driven Ansible cuando se dispara una alerta de objeto con una acción: pide la automatización de esa acción con aprobación (las que necesitan un dato quedan como propuesta)", categoria: "Monitoreo", tipo: escritura, usa_limite: 0, visible: 0, requiere_aprobacion: 0, minutos_manual: 20, tarifa: 0, etiquetas: [alertas, eda, respuesta, aprobación]}
  "Monitoreo · Configurar alertas del equipo": {nombre: "Configurar alertas del equipo", descripcion: "Activa, ajusta o retira las alertas de un servidor, storage o equipo de red: Ansible las deja configuradas en Prometheus y Alertmanager las entrega a Event-Driven Ansible; con respaldo y vuelta atrás", categoria: "Monitoreo", tipo: escritura, usa_limite: 0, visible: 0, requiere_aprobacion: 1, minutos_manual: 45, tarifa: 5, etiquetas: [alertas, prometheus, umbral, monitoreo, eda]}
  "Infra · Cargar imágenes base al registro": {nombre: "Cargar imágenes base al registro", descripcion: "Sube al registro propio las imágenes base e ISO de las que nacen las máquinas, solo las que no estén con la misma huella; así cada punto de restauración puede reconstruir el sistema desde la imagen exacta", categoria: "Infraestructuras", tipo: escritura, usa_limite: 0, requiere_aprobacion: 1, minutos_manual: 30, tarifa: 5, etiquetas: [imagen, qcow2, iso, registro, huella, sha256, restauración]}
  "Infra · Encendido automático de máquinas": {nombre: "Encendido automático de máquinas", descripcion: "Define qué máquinas se encienden solas al reiniciar el anfitrión (por defecto solo la bóveda); el resto queda apagada hasta que se encienda desde FaceOps", categoria: "Infraestructuras", tipo: escritura, usa_limite: 0, requiere_aprobacion: 1, minutos_manual: 15, tarifa: 5, etiquetas: [encendido, autostart, kvm, reinicio]}
  "Satellite · Instalar servidor": {nombre: "Instalar Red Hat Satellite", descripcion: "Crea la máquina de Satellite (RHEL 9, 4 vCPU, 20 GB) registrada con la suscripción del cliente, instala Satellite, carga el manifiesto de suscripciones y deja el contenido de RHEL con su ciclo de vida (Library → Desarrollo → Producción)", categoria: "Plataformas de aplicación", tipo: escritura, usa_limite: 0, requiere_aprobacion: 1, minutos_manual: 960, tarifa: 60, etiquetas: [satellite, red hat, parches, contenido, suscripciones, vulnerabilidades, rhel]}
  "Storage · Servicio S3 del data lake": {nombre: "Servicio S3 del data lake", descripcion: "Deja en el equipo de almacenamiento el servicio S3 que recibe la data de todas las aplicaciones (bifurcación de cada request), sobre un disco dedicado ya montado. Abre los puertos solo a los clientes indicados; Trino y las aplicaciones lo usan como data lake", categoria: "Data center", tipo: cambio, usa_limite: 1, por_inventario: 1, requiere_aprobacion: 1, minutos_manual: 120, tarifa: 40, etiquetas: [data lake, s3, storage, almacenamiento, bifurcación, trino]}
  "Homologación · Relevar entorno": {nombre: "Relevar entorno para homologar ambientes", descripcion: "Toma la huella del entorno de cada máquina (sistema, recursos, zona horaria, SELinux, sysctl, paquetes y, si corre, JBoss y Java: versión, parches, JVM, módulos, drivers, datasources, deployments y configuración) para compararla con sus pares de desarrollo, QA y producción. Solo lectura", categoria: "Gobierno", tipo: lectura, usa_limite: 1, por_inventario: 1, requiere_aprobacion: 1, minutos_manual: 60, tarifa: 2, etiquetas: [homologar, ambientes, jboss, java, entorno, desarrollo, qa, producción, drift]}
  "Satellite · Incorporar RHEL": {nombre: "Incorporar RHEL a Satellite", descripcion: "Registra uno o más servidores RHEL en el Satellite: desde ahí reciben contenido, parches y el reporte de vulnerabilidades. Acción exclusiva de la plataforma Satellite (se lanza desde su ficha)", categoria: "Plataformas de aplicación", tipo: escritura, usa_limite: 1, por_inventario: 1, visible: 0, requiere_aprobacion: 1, minutos_manual: 30, tarifa: 3, etiquetas: [satellite, rhel, registrar, parches, vulnerabilidades]}
  "Satellite · Convertir a RHEL": {nombre: "Convertir a RHEL e incorporar a Satellite", descripcion: "Convierte CentOS, Rocky Linux, AlmaLinux u Oracle Linux a RHEL con Convert2RHEL (snapshot previo y vuelta atrás) y la deja registrada en Satellite. Acción exclusiva de la plataforma Satellite", categoria: "Plataformas de aplicación", tipo: escritura, usa_limite: 1, por_inventario: 1, visible: 0, requiere_aprobacion: 1, minutos_manual: 240, tarifa: 20, etiquetas: [satellite, centos, rocky, alma, oracle, convert2rhel, rhel]}
  "Satellite · Actualizar": {nombre: "Actualizar Satellite", descripcion: "Actualiza Red Hat Satellite a la versión elegida con satellite-maintain: chequeos previos, snapshot y vuelta atrás si falla. Acción exclusiva de la plataforma Satellite", categoria: "Plataformas de aplicación", tipo: escritura, usa_limite: 1, por_inventario: 1, visible: 0, requiere_aprobacion: 1, minutos_manual: 480, tarifa: 30, etiquetas: [satellite, actualizar, upgrade, satellite-maintain]}
  "VPN · Preparar servidor": {nombre: "Servidor VPN (WireGuard)", descripcion: "Crea el servidor VPN (RHEL 9, 1 vCPU, 2 GB) con WireGuard administrado por FaceOps: clientes, usuarios con acceso a segmentos de red y vigencia que se corta sola al vencer", categoria: "Redes y seguridad", tipo: escritura, usa_limite: 0, requiere_aprobacion: 1, minutos_manual: 240, tarifa: 10, etiquetas: [vpn, wireguard, acceso remoto, red, segmento]}
  "VPN · Instalar": {nombre: "Instalar VPN (paso del workflow)", descripcion: "Paso interno del workflow «VPN · Preparar servidor»", categoria: "Redes y seguridad", tipo: escritura, visible: 0, requiere_aprobacion: 1, minutos_manual: 120, tarifa: 0, etiquetas: [vpn]}
  "VPN · Gestionar acceso": {nombre: "Gestionar acceso VPN", descripcion: "Crea clientes y usuarios de la VPN, extiende su vigencia o los revoca. Acción exclusiva de la plataforma VPN (se lanza desde su ficha)", categoria: "Redes y seguridad", tipo: escritura, usa_limite: 1, por_inventario: 1, visible: 0, requiere_aprobacion: 1, minutos_manual: 20, tarifa: 1, etiquetas: [vpn, usuario, acceso, vigencia]}
  "Migración · IIS a OpenShift": {nombre: "IIS a OpenShift", descripcion: "Evalúa los sitios y aplicaciones de IIS (pools, versión de .NET, rutas) y los clasifica para llevarlos a contenedores en OpenShift. La migración está en construcción", categoria: "Migraciones", tipo: escritura, usa_limite: 1, por_inventario: 1, requiere_aprobacion: 1, minutos_manual: 960, tarifa: 30, etiquetas: [iis, windows, openshift, migración, .net, contenedores]}
  "Migración · WebLogic a OpenShift · Evaluar": {nombre: "WebLogic → OpenShift 4.x · Evaluar", descripcion: "Lee el dominio de Oracle WebLogic del servidor (config.xml, datasources JDBC, colas JMS, JVM) y cada aplicación desplegada (EAR/WAR: weblogic.xml, weblogic-application.xml, APIs weblogic.*, javax, JNDI) y decide el destino en OpenShift (JBoss EAP 8, Open Liberty o WildFly) con su motivo. Informe en Git; no cambia nada y no lee claves", categoria: "Migraciones", tipo: lectura, usa_limite: 1, por_inventario: 1, requiere_aprobacion: 0, minutos_manual: 480, tarifa: 10, etiquetas: [weblogic, oracle, openshift, migración, migracion, jboss, eap, java, evaluación]}
  "Migración · WebLogic a OpenShift": {nombre: "Migración WebLogic → OpenShift 4.x", descripcion: "Lleva una aplicación de Oracle WebLogic a JBoss EAP 8 en un namespace de OpenShift 4.x: traduce weblogic.xml a jboss-web.xml, javax → jakarta, datasources y JMS por jboss-cli, imagen S2I de EAP 8, ConfigMap y Secret sin exponer claves, Deployment, Service y Route. Verifica rollout y HTTP 200 por la Route; si falla vuelve a la versión anterior. 100 % Ansible, sin IA en ejecución; el origen no se toca", categoria: "Migraciones", tipo: escritura, usa_limite: 1, por_inventario: 1, requiere_aprobacion: 1, minutos_manual: 1920, tarifa: 40, etiquetas: [weblogic, oracle, openshift, migración, migracion, jboss, eap, java, contenedores, s2i]}
  "OpenShift · Habilitar OpenShift Virtualization": {nombre: "Habilitar OpenShift Virtualization", descripcion: "Evalúa los prerrequisitos del clúster (nodos con virtualización, storage, CPU) e instala OpenShift Virtualization con su HyperConverged", categoria: "Plataformas de contenedores", tipo: escritura, usa_limite: 1, requiere_aprobacion: 1, minutos_manual: 480, tarifa: 20, etiquetas: [openshift, virtualization, kubevirt, cnv, máquinas virtuales]}
  "Migración · IIS a OpenShift": {nombre: "IIS a OpenShift", descripcion: "Evalúa los sitios y aplicaciones de IIS (pools, versión de .NET, rutas) y los clasifica para llevarlos a contenedores en OpenShift. La migración está en construcción", categoria: "Migraciones", tipo: escritura, usa_limite: 1, por_inventario: 1, requiere_aprobacion: 1, minutos_manual: 960, tarifa: 30, etiquetas: [iis, windows, openshift, migración, .net, contenedores]}
  "OpenShift · Habilitar OpenShift Virtualization": {nombre: "Habilitar OpenShift Virtualization", descripcion: "Evalúa los prerrequisitos del clúster (nodos con virtualización, storage, CPU) e instala OpenShift Virtualization con su HyperConverged", categoria: "Plataformas de contenedores", tipo: escritura, usa_limite: 1, requiere_aprobacion: 1, minutos_manual: 480, tarifa: 20, etiquetas: [openshift, virtualization, kubevirt, cnv, máquinas virtuales]}
  "OpenShift · Relevamiento de imágenes": {nombre: "Relevamiento de imágenes de OpenShift", descripcion: "Informe de las imágenes del clúster: cuáles están en uso y cuáles no (registro interno y caché de los nodos), la proporción de uso, las antiguas con su procedimiento de remediación y las replicadas con su estrategia de limpieza. Solo lectura", categoria: "Plataformas de contenedores", tipo: lectura, usa_limite: 1, requiere_aprobacion: 1, minutos_manual: 240, tarifa: 10, etiquetas: [openshift, imágenes, registro, imagestream, limpieza, antiguas, replicadas, informe]}
  "OpenShift · Modelo de alertamiento": {nombre: "Modelo de alertamiento de OpenShift", descripcion: "Aplica el modelo de alertamiento de FaceOps sobre el clúster: tres pilares (disponibilidad, seguridad y rendimiento) para plano de control, nodos, operadores y namespaces, con umbral de aviso y crítico; el aviso dispara un diagnóstico y el crítico una remediación con aprobación", categoria: "Plataformas de contenedores", tipo: escritura, usa_limite: 1, requiere_aprobacion: 1, minutos_manual: 960, tarifa: 20, etiquetas: [openshift, alertas, monitoreo, prometheus, alertmanager, eda, remediación, disponibilidad, seguridad, rendimiento]}
  "OpenShift · Remediar alerta": {nombre: "Remediar alerta de OpenShift", descripcion: "Diagnóstico o remediación de una alerta del modelo (reiniciar pod, escalar, expandir volumen, cordonar nodo). La lanza Event-Driven Ansible; las que cambian algo pasan por aprobación", categoria: "Plataformas de contenedores", tipo: escritura, usa_limite: 1, requiere_aprobacion: 1, minutos_manual: 30, tarifa: 2, etiquetas: [openshift, alertas, remediación, eda]}
