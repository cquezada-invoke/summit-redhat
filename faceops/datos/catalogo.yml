  "PostgreSQL · Preparar servidor": {nombre: "Habilitar PostgreSQL", descripcion: "Instala PostgreSQL 16 de Red Hat con acceso por red y su clave de administración en la bóveda", categoria: "Bases de datos", tipo: escritura, usa_limite: 1, requiere_aprobacion: 1, visible: 1, minutos_manual: 90, tarifa: 4, etiquetas: [postgresql, base de datos]}
  "MySQL · Preparar servidor": {nombre: "Habilitar MySQL", descripcion: "Instala MySQL 8.4 de Red Hat con usuario de administración y su clave en la bóveda", categoria: "Bases de datos", tipo: escritura, usa_limite: 1, requiere_aprobacion: 1, visible: 1, minutos_manual: 90, tarifa: 4, etiquetas: [mysql, base de datos]}
  "MongoDB · Preparar servidor": {nombre: "Habilitar MongoDB", descripcion: "Instala MongoDB 8.0 con autenticación y su clave de administración en la bóveda", categoria: "Bases de datos", tipo: escritura, usa_limite: 1, requiere_aprobacion: 1, visible: 1, minutos_manual: 120, tarifa: 5, etiquetas: [mongodb, base de datos, nosql]}
  "SQL Server · Preparar servidor": {nombre: "Habilitar SQL Server", descripcion: "Instala Microsoft SQL Server 2022 (edición a elegir; Developer sin costo para pruebas) con sqlcmd y una base de ejemplo lista para alta disponibilidad; la clave de sa queda en la bóveda", categoria: "Plataformas de datos", tipo: escritura, requiere_aprobacion: 1, minutos_manual: 120, tarifa: 20, etiquetas: [sql server, mssql, base de datos, microsoft, skill]}
  "SQL Server · Levantamiento y medición": {nombre: "SQL Server · Levantamiento para alta disponibilidad", descripcion: "Levanta versión, edición y lo que esa edición permite en alta disponibilidad, las bases (tamaño y modelo de recuperación), el volumen de cambio del log y la latencia entre centros de datos; sugiere réplica síncrona o asíncrona (solo lectura)", categoria: "Plataformas de datos", tipo: lectura, usa_limite: 1, requiere_aprobacion: 1, minutos_manual: 480, tarifa: 0, etiquetas: [sql server, alta disponibilidad, levantamiento, latencia, rpo, rto]}
  "SQL Server · Configurar alta disponibilidad": {nombre: "SQL Server · Configurar alta disponibilidad", descripcion: "Arma un Availability Group entre centros de datos: certificado entre réplicas, replicación cifrada, siembra automática de las bases y prueba de replicación con una marca escrita en el primario y leída en la secundaria", categoria: "Plataformas de datos", tipo: escritura, usa_limite: 1, requiere_aprobacion: 1, minutos_manual: 960, tarifa: 40, etiquetas: [sql server, alta disponibilidad, availability group, replicación, dr]}
  "SQL Server · Conmutar réplica primaria": {nombre: "SQL Server · Conmutar réplica primaria", descripcion: "Conmutación planificada sin pérdida de datos: espera la sincronización, cambia los roles, mide el tiempo sin escritura y verifica que el nuevo primario escribe y el antiguo replica. La reversa es la misma automatización hacia el primario original", categoria: "Plataformas de datos", tipo: escritura, usa_limite: 1, requiere_aprobacion: 1, minutos_manual: 240, tarifa: 30, etiquetas: [sql server, conmutación, failover, reversa, alta disponibilidad]}
  "Migración K8s → OpenShift · Evaluar origen": {nombre: "Migración K8s → OpenShift · Evaluar origen", descripcion: "Inventario del clúster Kubernetes de origen por namespace (workloads, Helm, CRDs, volúmenes, Ingress, imágenes) y semáforo de lo que choca con OpenShift (root, privileged, hostPath); solo lectura", categoria: "Migraciones", tipo: lectura, usa_limite: 0, requiere_aprobacion: 1, minutos_manual: 960, tarifa: 0, etiquetas: [kubernetes, openshift, gcp, migración, evaluación]}
  "Migración K8s → OpenShift · Preparar destino": {nombre: "Migración K8s → OpenShift · Preparar destino en GCP", descripcion: "Deja OpenShift en GCP listo para recibir: proyectos con cuota, SCC, StorageClass equivalentes (GCE PD CSI), OADP con bucket en GCS y acceso a registros", categoria: "Migraciones", tipo: escritura, usa_limite: 0, requiere_aprobacion: 1, minutos_manual: 960, tarifa: 40, etiquetas: [openshift, gcp, oadp, migración]}
  "Migración K8s → OpenShift · Convertir manifiestos": {nombre: "Migración K8s → OpenShift · Convertir manifiestos", descripcion: "Convierte los manifiestos de un namespace a OpenShift (Ingress → Route, securityContext, StorageClass, imágenes) y abre un Pull Request GitOps; nada se aplica hasta aprobarlo", categoria: "Migraciones", tipo: escritura, usa_limite: 0, requiere_aprobacion: 1, minutos_manual: 480, tarifa: 30, etiquetas: [kubernetes, openshift, gitops, manifiestos, migración]}
  "Migración K8s → OpenShift · Migrar aplicación": {nombre: "Migración K8s → OpenShift · Migrar aplicación", descripcion: "Migra un namespace: respaldo Velero en el origen y restauración OADP en OpenShift con sus volúmenes, o despliegue GitOps más migración de datos. El origen sigue atendiendo", categoria: "Migraciones", tipo: escritura, usa_limite: 0, requiere_aprobacion: 1, minutos_manual: 480, tarifa: 40, etiquetas: [kubernetes, openshift, velero, oadp, migración]}
  "Migración K8s → OpenShift · Validar y conmutar": {nombre: "Migración K8s → OpenShift · Validar y conmutar", descripcion: "Pruebas de humo en OpenShift, cambio de DNS o balanceador hacia el destino y origen escalado a cero; la reversa vuelve el tráfico al origen", categoria: "Migraciones", tipo: escritura, usa_limite: 0, requiere_aprobacion: 1, minutos_manual: 240, tarifa: 30, etiquetas: [openshift, dns, conmutación, reversa, migración]}
  "Redis · Instalar Redis Insight": {nombre: "Instalar Redis Insight", descripcion: "Instala la consola web oficial de Redis en la máquina; se abre desde la plataforma Redis en la ficha del equipo", categoria: "Operación y remediación", tipo: escritura, requiere_aprobacion: 0, visible: 1, minutos_manual: 30, tarifa: 2, etiquetas: [redis, consola, redis insight]}
