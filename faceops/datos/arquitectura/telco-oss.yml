  rpo: 15 minutos
  datos: "Disponibilidad, latencia y caídas por celda · sintéticos"
  usuarios: Clientes y ejecutivos (demo)

entrada:
  desde: usuarios
  hacia: app
  puerto: 443
  url: https://telco.sno.34.176.42.56.sslip.io/salud
  espera: ok

externos:
  - {id: usuarios, nombre: Clientes y ejecutivos}

componentes:
  - id: app
    nombre: "OSS · calidad de red"
    plataforma: openshift
    producto: industrias
    rol: Aplicación del negocio · https://telco.sno.34.176.42.56.sslip.io/oss
    equipos: [ocp-sno]
  - id: lake
    nombre: "Data lake central (S3 + Trino) · zona telco_oss"
    plataforma: openshift
    producto: data-lake
    rol: Data lake · copia de cada operación
    equipos: [ocp-sno]

flujos:
