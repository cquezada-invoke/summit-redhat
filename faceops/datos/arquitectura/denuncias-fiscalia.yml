segmento: Denuncias · Fiscalía (demo)
codigo: fisc
version: 3
grupo: aplicaciones
descripcion: "Demo para la Fiscalía: el formulario de denuncias guarda en su base de datos operacional como siempre y una bifurcación toma la misma solicitud HTTP y la deriva además al data lake (S3). Contra el lake actúan Trino, la IA y la aplicación de evaluación (coherencia, continuidad, priorización), sin tocar el sistema transaccional. Datos sintéticos."
responsable: Arquitectura Invoke
centro_de_datos: Centro de datos Santiago
ambientes: [produccion]

ficha:
  area_negocio: Procuración de justicia · Atención de denuncias
  dueno: Coordinación de Atención a Denunciantes (demo)
  responsable_tecnico: Arquitectura de Datos e IA · Invoke
  soporte: Managed Service Invoke (N2)
  criticidad: alta
  horario_servicio: 24x7
  ventana_mantencion: "Domingo 02:00 a 05:00"
  rto: 4 horas
  rpo: 15 minutos
  datos: "Denuncias, relatos, evidencias (imágenes y documentos) y su evaluación · datos personales sensibles (en la demo, sintéticos)"
  usuarios: Agentes del Ministerio Público, analistas y fiscales

entrada:
  desde: agentes
  hacia: app
  puerto: 443
  url: https://denuncias.sno.34.176.42.56.sslip.io/salud
  espera: ok

externos:
  - {id: agentes, nombre: Agentes del MP y personas denunciantes}

componentes:
  - id: app
    nombre: "Aplicación de denuncias (formulario y evaluación)"
    plataforma: openshift
    producto: denuncias
    rol: Aplicación del negocio
    equipos: [ocp-sno]
  - id: bd
    nombre: "Base de datos operacional"
    plataforma: openshift
    producto: postgresql
    rol: Base de datos · camino transaccional
    equipos: [ocp-sno]
  - id: lake
    nombre: "Data lake (S3 + Trino)"
    plataforma: openshift
    producto: data-lake
    rol: Data lake · copia de cada solicitud
    equipos: [ocp-sno]
  - id: ia
    nombre: "Agente de IA · IBM Granite 3.3 2B"
    plataforma: openshift
    producto: "granite3.3:2b en Ollama (CPU) + modelo de continuidad HistGradientBoosting"
    rol: Ollama en CPU · OCR de imágenes · modelo de continuidad
    equipos: [ocp-sno]

flujos:
  - {desde: agentes, hacia: app, puerto: 443, motivo: "registran y complementan denuncias desde el formulario (web o móvil)"}
  - {desde: app, hacia: bd, puerto: 5432, motivo: "camino del negocio: guarda el formulario en la base de datos operacional, como siempre"}
  - {desde: app, hacia: lake, puerto: 9000, estilo: bifurcacion, motivo: "bifurcación: la misma solicitud HTTP se copia al data lake (JSON, archivos y análisis de imágenes)"}
  - {desde: lake, hacia: ia, puerto: 8080, estilo: bifurcacion, motivo: "la IA actúa contra el lake: coherencia, continuidad, priorización y preguntas en español"}
