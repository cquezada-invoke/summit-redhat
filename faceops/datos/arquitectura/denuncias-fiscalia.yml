segmento: Denuncias · Fiscalía (demo)
codigo: fisc
version: 2
grupo: aplicaciones
descripcion: "Demo para la Fiscalía: el formulario de denuncias guarda en su base de datos operacional como siempre y una bifurcación toma la misma solicitud HTTP y la deriva además al data lake (S3). Contra el lake actúan Trino, la IA y la aplicación de evaluación (coherencia, continuidad, priorización), sin tocar el sistema transaccional. Datos sintéticos."
responsable: Arquitectura Invoke
centro_de_datos: Centro de datos Santiago
ambientes: [produccion]

ficha:
  area_negocio: Procuración de justicia · Atención de denuncias
  dueno: Coordinación de Atención a Denunciantes (demo)
  responsable_tecnico: Arquitectura de Datos e IA · Invoke
  soporte: Managed Service Invoke (N2)
  criticidad: alta
  horario_servicio: 24x7
  ventana_mantencion: "Domingo 02:00 a 05:00"
  rto: 4 horas
  rpo: 15 minutos
  datos: "Denuncias, relatos, evidencias (imágenes y documentos) y su evaluación · datos personales sensibles (en la demo, sintéticos)"
  usuarios: Agentes del Ministerio Público, analistas y fiscales

entrada:
  desde: agentes
  hacia: registro
  puerto: 443
  url: https://denuncias.sno.34.176.42.56.sslip.io/salud
  espera: ok

externos:
  - {id: agentes, nombre: Agentes del MP (registran denuncias)}
  - {id: analistas, nombre: Analistas y fiscales (evalúan y priorizan)}

componentes:
  - id: registro
    nombre: "Formulario de denuncias (namespace demo-fiscalia)"
    plataforma: openshift
    producto: denuncias-registro
    equipos: [ocp-sno]
  - id: bifurca
    nombre: "Bifurcación del request HTTP: un envío, dos destinos (namespace demo-fiscalia)"
    plataforma: openshift
    producto: bifurcacion-http
    equipos: [ocp-sno]
  - id: bd
    nombre: "Base de datos operacional de denuncias · camino transaccional (namespace demo-fiscalia)"
    plataforma: openshift
    producto: postgresql
    equipos: [ocp-sno]
  - id: intel
    nombre: "Evaluación e inteligencia (namespace demo-fiscalia)"
    plataforma: openshift
    producto: denuncias-inteligencia
    equipos: [ocp-sno]
  - id: ia
    nombre: "IA local · Granite 3.3 (Ollama, namespace demo-ia-analitica)"
    plataforma: openshift
    producto: ollama
    equipos: [ocp-sno]
  - id: s3
    nombre: "Data lake · almacenamiento S3 (namespace demo-datalake)"
    plataforma: openshift
    producto: s3-datalake
    equipos: [ocp-sno]
  - id: trino
    nombre: "Data lake · SQL con Trino (namespace demo-datalake)"
    plataforma: openshift
    producto: trino
    equipos: [ocp-sno]

flujos:
  - {desde: agentes, hacia: registro, puerto: 443, motivo: "captura de la denuncia: tipo, denunciante, hechos, relato y adjuntos"}
  - {desde: registro, hacia: ia, puerto: 11434, motivo: "la IA lee el relato y propone tipo, prioridad, alcaldía y resumen (el agente confirma)"}
  - {desde: registro, hacia: bifurca, puerto: 8080, motivo: "la solicitud HTTP del formulario (POST) entra a la bifurcación"}
  - {desde: bifurca, hacia: bd, puerto: 5432, motivo: "camino 1 · transaccional: guarda el formulario en la base de datos operacional, como siempre"}
  - {desde: bifurca, hacia: s3, puerto: 9000, motivo: "camino 2 · copia al data lake: la misma solicitud en JSON, archivos originales y análisis de imágenes"}
  - {desde: trino, hacia: s3, puerto: 9000, motivo: "Trino lee el lake: histórico en Parquet + denuncias nuevas en JSON (vista lake.fiscalia.denuncias)"}
  - {desde: analistas, hacia: intel, puerto: 443, motivo: "bandeja de coherencia, continuidad y priorización"}
  - {desde: intel, hacia: trino, puerto: 8080, motivo: "actúa contra el lake: entrena los modelos, puntúa y responde preguntas con SQL"}
  - {desde: intel, hacia: ia, puerto: 11434, motivo: "preguntas en español → SQL de Trino"}
  - {desde: intel, hacia: s3, puerto: 9000, motivo: "las decisiones (enviar al siguiente paso, pedir complemento) vuelven al lake como eventos"}
