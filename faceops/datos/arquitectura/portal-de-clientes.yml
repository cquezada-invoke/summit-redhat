segmento: Portal de clientes
codigo: portal
version: 1
descripcion: "Autoatención de clientes: el portal en JBoss usa la base de datos PostgreSQL de pedidos"
responsable: Arquitectura Invoke
centro_de_datos: Centro de datos Santiago
ambientes: [produccion]

ficha:
  area_negocio: Comercial · Experiencia de clientes
  dueno: Gerencia de Canales Digitales
  responsable_tecnico: Jefatura de Desarrollo Web
  soporte: Managed Service Invoke (N2)
  criticidad: media
  horario_servicio: "Lunes a domingo 07:00 a 23:00"
  ventana_mantencion: "Martes 23:00 a 01:00"
  rto: 4 horas
  rpo: 1 hora
  datos: "Datos personales y pedidos de clientes"
  usuarios: Clientes

entrada:
  desde: clientes
  hacia: app
  puerto: 8080
  url: http://192.168.122.19:8080/app-jboss/
  espera: "Base de datos: conectada"

externos:
  - {id: clientes, nombre: Clientes}

componentes:
  - id: app
    nombre: Portal JBoss
    producto: jboss
    sistema: rhel9
    replicas: 1
    recursos: {cpu: 2, ram_gb: 4, disco_gb: 20}
    equipos: [nodo-jboss3]
  - id: bd
    nombre: PostgreSQL de pedidos
    producto: postgres
    sistema: rhel9
    replicas: 1
    recursos: {cpu: 1, ram_gb: 2, disco_gb: 20}
    equipos: [nodo-postgres]
    uso: compartido        # la base es de App de pagos: este segmento paga solo los recursos que consume

flujos:
  - {desde: clientes, hacia: app, puerto: 8080, motivo: "entrada: los clientes abren el portal"}
  - {desde: app, hacia: bd, puerto: 5432, motivo: "base de datos de pedidos", latencia_max_ms: 5}
