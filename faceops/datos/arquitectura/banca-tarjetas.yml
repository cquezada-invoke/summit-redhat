segmento: "Banca · Tarjetas"
codigo: btar
version: 3
grupo: aplicaciones
descripcion: "Aplicación típica de banca (demo). Atiende su operación y una bifurcación copia cada operación al data lake central (S3 + Trino, zona banca_tarjetas). Datos sintéticos."
responsable: Arquitectura Invoke
centro_de_datos: Centro de datos Santiago
ambientes: [produccion]

ficha:
  area_negocio: "Banca · Medios de pago"
  dueno: "Gerencia de Tarjetas (demo)"
  responsable_tecnico: Arquitectura de Datos e IA · Invoke
  soporte: Managed Service Invoke (N2)
  criticidad: alta
  horario_servicio: 24x7
  ventana_mantencion: "Domingo 02:00 a 05:00"
  rto: 4 horas
  rpo: 15 minutos
  datos: "Autorizaciones de compra · sintéticos"
  usuarios: Clientes y ejecutivos (demo)

entrada:
  desde: usuarios
  hacia: app
  puerto: 443
  url: https://banca.sno.34.176.42.56.sslip.io/salud
  espera: ok

externos:
  - {id: usuarios, nombre: Clientes y ejecutivos}

componentes:
  - id: app
    nombre: "Tarjetas"
    plataforma: openshift
    producto: industrias
    rol: Aplicación del negocio · https://banca.sno.34.176.42.56.sslip.io/tarjetas
    equipos: [ocp-sno]
  - id: lake
    nombre: "Data lake central (S3 + Trino) · zona banca_tarjetas"
    plataforma: openshift
    producto: data-lake
    rol: Data lake · copia de cada operación
    equipos: [ocp-sno]

flujos:
  - {desde: usuarios, hacia: app, puerto: 443, motivo: "operación del negocio"}
  - {desde: app, hacia: lake, puerto: 9000, estilo: bifurcacion, motivo: "bifurcación: cada operación se copia al data lake (JSON por minuto)",
     destino: "s3://lake/apps/banca_tarjetas/operaciones_vivo/",
     medicion: {url: "https://banca.sno.34.176.42.56.sslip.io/salud", clave: tarjetas}}
