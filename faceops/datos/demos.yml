# Orden del catálogo: primero las demos originales del Summit (en este orden), después «Otras automatizaciones».
# Cada lista usa el nombre técnico en AAP. Lo que no aparece aquí queda abajo, sin eliminarse.
- demo: "Demo 1 · Drift y cumplimiento de servidores"
  resumen: "Cada servidor tiene un estado aprobado en Git; los cambios manuales se detectan, se corrigen o se proponen como nueva base."
  automatizaciones:
    - "Drift · Incorporar servidor"
    - "Estado · Registrar servidor"
    - "Estado · Aplicar base desde Git"
    - "Estado · Proponer base"
    - "Estado · Volver a un commit"
    - "Drift · Windows"
    - "Drift · Retirar servidor"
- demo: "Demo 2 · CI/CD a JBoss"
  resumen: "El pipeline construye la app y AAP la despliega en los JBoss, con su configuración como código."
  automatizaciones:
    - "JBoss · Desplegar app"
    - "JBoss · Aplicar configuración"
    - "JBoss · Restablecer a versión"
    - "JBoss · Preparar servidor"
- demo: "Demo 3 · Plataforma como código y autoservicio"
  resumen: "La app declara lo que necesita (base de datos, colas, caché, seguridad) y AAP lo prepara; los equipos piden ambientes solos."
  automatizaciones:
    - "Plataforma · Preparar dependencias"
    - "Autoservicio · Nuevo ambiente"
    - "Autoservicio · Retirar app"
- demo: "Demo 4 · Redes"
  resumen: "Routers y firewall gestionados desde Git: accesos con aprobación, bloqueo de IPs, drift y actualizaciones por lotes."
  automatizaciones:
    - "FaceOps · Acceso de red"
    - "Red · Bloquear IP"
    - "Red · Verificar drift"
    - "Red · Aplicar configuración"
    - "Red · Preparar red OpenShift con aprobación"
    - "Plataforma · Actualizar firmware"
    - "Red · Revocar accesos vencidos"
- demo: "Demo 5 · Operación y autorremediación"
  resumen: "El monitoreo detecta la falla y AAP la resuelve sola, dejando el incidente con la evidencia."
  automatizaciones:
    - "Remediación · Reiniciar JBoss"
    - "Remediación · Limpiar logs"
    - "Remediación · Renovar certificado"
    - "Remediación · Cola de pagos"
    - "Remediación · Diagnosticar app"
    - "Remediación · Rollback con aprobación"
    - "Remediación · IIS en Windows"
- demo: "Demo 6 · Nube"
  resumen: "VMs en GCP con aprobación, control de costos (huérfanos) y vigilancia del firewall de la nube."
  automatizaciones:
    - "Nube · Solicitar VM con aprobación"
    - "Nube · Dar de baja VM"
    - "Nube · Reporte de huérfanos con limpieza"
    - "Nube · Reporte de huérfanos"
    - "Nube · Vigilar firewall"
