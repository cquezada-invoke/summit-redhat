# Políticas de seguridad de FaceOps: cada una es una tarea automatizada (la aplica «FaceOps · Aplicar política de
# seguridad» en AAP), con condiciones de aplicación por equipo y una versión. Si la política cambia (otra versión),
# los equipos que la tenían aplicada quedan «desactualizados» y se vuelve a aplicar con la versión nueva.
# Categorías: sistema operativo · contenedores · comunicaciones · redes · datos · aplicaciones · middleware · identidad ·
#             auditoria · respaldo
# aplica: sistemas [linux|windows], categorias [servidor…], skills (alguna), sin_skills (ninguna), ambientes, segmentos; vacío = todos
# reglas (idempotentes; en «verificar» solo se revisan, sin cambiar nada):
#   linea:    {archivo, regexp, linea}                       sysctl: {nombre, valor}
#   servicio: {nombre, activo: true|false}                   permisos: {ruta, modo, dueno, grupo}
#   archivo:  {ruta, contenido, modo}                        comando: {verificar, aplicar}  (verificar = 0 si cumple)
#   firewall: {siempre, por_skill: {skill: [puerto/proto | puerto/proto@origen]}}  FaceOps suma consolas y flujos hacia el equipo
# recargar: servicios que se recargan si algo cambió
- id: SO-01
  nombre: SSH endurecido
  categoria: sistema operativo
  severidad: alta
  descripcion: Sin acceso directo de root, sin contraseñas (solo llaves), pocos intentos y sesiones inactivas cerradas.
  aplica: {sistemas: [linux], categorias: [servidor]}
  reglas:
    - {tipo: linea, archivo: /etc/ssh/sshd_config.d/01-faceops.conf, regexp: '^PermitRootLogin', linea: 'PermitRootLogin no'}
    - {tipo: linea, archivo: /etc/ssh/sshd_config.d/01-faceops.conf, regexp: '^PasswordAuthentication', linea: 'PasswordAuthentication no'}
    - {tipo: linea, archivo: /etc/ssh/sshd_config.d/01-faceops.conf, regexp: '^MaxAuthTries', linea: 'MaxAuthTries 4'}
    - {tipo: linea, archivo: /etc/ssh/sshd_config.d/01-faceops.conf, regexp: '^X11Forwarding', linea: 'X11Forwarding no'}
    - {tipo: linea, archivo: /etc/ssh/sshd_config.d/01-faceops.conf, regexp: '^ClientAliveInterval', linea: 'ClientAliveInterval 300'}
  recargar: [sshd]
- id: SO-02
  nombre: Parámetros de kernel seguros
  categoria: sistema operativo
  severidad: media
  descripcion: Sin redirecciones ICMP, protección SYN, aleatorización de memoria y registro de paquetes anómalos.
  aplica: {sistemas: [linux]}
  reglas:
    - {tipo: sysctl, nombre: net.ipv4.conf.all.accept_redirects, valor: '0'}
    - {tipo: sysctl, nombre: net.ipv4.conf.all.send_redirects, valor: '0'}
    - {tipo: sysctl, nombre: net.ipv4.tcp_syncookies, valor: '1'}
    - {tipo: sysctl, nombre: kernel.randomize_va_space, valor: '2'}
    - {tipo: sysctl, nombre: net.ipv4.conf.all.log_martians, valor: '1'}
- id: SO-03
  nombre: Aviso legal y cierre de sesión inactiva
  categoria: sistema operativo
  severidad: baja
  descripcion: Aviso de uso autorizado al ingresar y cierre de la terminal tras 15 minutos sin uso.
  aplica: {sistemas: [linux]}
  reglas:
    - {tipo: archivo, ruta: /etc/issue.net, modo: '0644', contenido: "Acceso solo para personal autorizado. La actividad queda registrada.\n"}
    - {tipo: archivo, ruta: /etc/profile.d/faceops-tmout.sh, modo: '0644', contenido: "TMOUT=900\nreadonly TMOUT\nexport TMOUT\n"}
- id: COM-01
  nombre: Criptografía del sistema sin protocolos débiles
  categoria: comunicaciones
  severidad: alta
  descripcion: Política criptográfica del sistema en DEFAULT o más estricta (sin TLS 1.0/1.1 ni SHA-1 en firmas).
  aplica: {sistemas: [linux]}
  reglas:
    - {tipo: comando, verificar: "update-crypto-policies --show | grep -Eq '^(DEFAULT|FUTURE|FIPS)'", aplicar: "update-crypto-policies --set DEFAULT"}
- id: COM-02
  nombre: Hora sincronizada
  categoria: comunicaciones
  severidad: media
  descripcion: chronyd activo; certificados, Kerberos y registros dependen de la hora correcta.
  aplica: {sistemas: [linux]}
  reglas:
    - {tipo: servicio, nombre: chronyd, activo: true}
- id: RED-01
  nombre: Firewall del equipo activo
  categoria: redes
  severidad: alta
  descripcion: >-
    firewalld instalado, activo y al iniciar, abriendo solo lo que la máquina sirve: SSH (AAP), los puertos de sus plataformas
    (skills), los de sus consolas registradas en FaceOps y los de los flujos declarados hacia ella; las consolas de administración
    solo desde FaceOps/AAP (192.168.122.1). Las redes de Podman quedan en la zona de confianza (como lo hace netavark). No quita
    reglas existentes; lo que escucha y no es de su rol queda cerrado y se informa.
  aplica: {sistemas: [linux], categorias: [servidor], sin_skills: [openshift, vyos-firewall, frrouting, kvm]}
  reglas:
    - tipo: firewall
      siempre: [22/tcp]
      por_skill:
        jboss: [8080/tcp, 8443/tcp, 9990/tcp@192.168.122.1]
        keycloak: [8080/tcp, 8180/tcp, 8443/tcp]
        redis: [6379/tcp]
        redisinsight: [5540/tcp]
        node-exporter: [9100/tcp]
        nginx: [80/tcp, 443/tcp]
        postgres: [5432/tcp]
        vault: [8200/tcp]
        activemq: [61616/tcp, 8161/tcp]
        kafka: [9092/tcp]
        gitea: [3000/tcp]
        389-directory-server: [389/tcp, 636/tcp]
        red-hat-idm: [53/tcp, 53/udp, 80/tcp, 88/tcp, 88/udp, 389/tcp, 443/tcp, 464/tcp, 464/udp, 636/tcp]
        certificate-system: [8080/tcp, 8443/tcp]
        satellite: [53/tcp, 53/udp, 67/udp, 69/udp, 80/tcp, 443/tcp, 5647/tcp, 8000/tcp, 8140/tcp, 9090/tcp]
- id: RED-02
  nombre: Sin reenvío de paquetes en servidores
  categoria: redes
  severidad: media
  descripcion: >-
    Un servidor no debe enrutar tráfico entre redes (eso es de routers y firewalls): net.ipv4.ip_forward en 0. Excepción: un
    servidor con contenedores de Podman necesita el reenvío hacia sus propios contenedores (puertos publicados como Redis
    Insight o Keycloak); ahí queda en 1 y el firewall local (RED-01) solo deja pasar lo que va a un puerto publicado.
  aplica: {sistemas: [linux], categorias: [servidor]}
  reglas:
    - tipo: comando
      verificar: >-
        F=/etc/sysctl.d/90-faceops-politicas.conf; C=/etc/sysctl.d/91-faceops-contenedores.conf;
        if command -v podman >/dev/null && [ -n "$(podman ps -aq)" ]; then
        [ "$(sysctl -n net.ipv4.ip_forward)" = 1 ] && grep -qsx 'net.ipv4.ip_forward=1' $C;
        else [ "$(sysctl -n net.ipv4.ip_forward)" = 0 ] && grep -qsx 'net.ipv4.ip_forward=0' $F && [ ! -e $C ]; fi
      aplicar: >-
        F=/etc/sysctl.d/90-faceops-politicas.conf; C=/etc/sysctl.d/91-faceops-contenedores.conf; touch $F; sed -i '/^net.ipv4.ip_forward/d' $F;
        if command -v podman >/dev/null && [ -n "$(podman ps -aq)" ]; then
        echo 'net.ipv4.ip_forward=1' > $C; chmod 0644 $C;
        else rm -f $C; echo 'net.ipv4.ip_forward=0' >> $F; fi;
        { [ ! -e $C ] || sysctl -q -p $C; } && sysctl -q -p $F
- id: DAT-01
  nombre: Permisos de archivos sensibles
  categoria: datos
  severidad: alta
  descripcion: Cuentas, contraseñas y configuración de SSH solo legibles por quien corresponde.
  aplica: {sistemas: [linux]}
  reglas:
    - {tipo: permisos, ruta: /etc/passwd, modo: '0644', dueno: root, grupo: root}
    - {tipo: permisos, ruta: /etc/shadow, modo: '0000', dueno: root, grupo: root}
    - {tipo: permisos, ruta: /etc/gshadow, modo: '0000', dueno: root, grupo: root}
    - {tipo: permisos, ruta: /etc/ssh/sshd_config, modo: '0600', dueno: root, grupo: root}
- id: DAT-02
  nombre: Base de datos con conexiones cifradas
  categoria: datos
  severidad: alta
  descripcion: PostgreSQL con TLS activo (certificado de la CA interna).
  aplica: {skills: [postgres]}
  reglas:
    - {tipo: comando, verificar: "sudo -u postgres psql -Atc 'show ssl' | grep -qx on", aplicar: "sed -i 's/^#\\?ssl *=.*/ssl = on/' /var/lib/pgsql/data/postgresql.conf && systemctl reload postgresql"}
- id: APP-01
  nombre: Nginx sin versión expuesta
  categoria: aplicaciones
  severidad: baja
  descripcion: Las respuestas no revelan la versión de Nginx (server_tokens off).
  aplica: {skills: [nginx]}
  reglas:
    - {tipo: archivo, ruta: /etc/nginx/conf.d/00-faceops-seguridad.conf, modo: '0644', contenido: "server_tokens off;\n"}
  recargar: [nginx]
- id: APP-02
  nombre: JBoss con consola de administración protegida
  categoria: aplicaciones
  severidad: media
  descripcion: La consola de administración de JBoss (9990) solo acepta conexiones del propio equipo y del host de FaceOps/AAP (192.168.122.1), con firewall propio (nftables, tabla faceops_app02, activa desde el arranque) y usuario de administración cuya credencial vive en la bóveda (FaceOps entra con ella; nadie la ve). Escucha en la máquina (no solo en 127.0.0.1) para que FaceOps abra la consola y
    jboss-cli local de las automatizaciones siga funcionando.
  aplica:
    skills:
    - jboss
  reglas:
  - tipo: archivo
    ruta: /etc/sysconfig/faceops-app02.nft
    modo: '0600'
    contenido: |
      # FaceOps APP-02: consola de administración de JBoss (9990) solo desde el propio equipo y FaceOps/AAP
      table inet faceops_app02
      delete table inet faceops_app02
      table inet faceops_app02 {
        chain entrada {
          type filter hook input priority filter; policy accept;
          iifname "lo" tcp dport 9990 accept
          ip saddr 192.168.122.1 tcp dport 9990 accept
          tcp dport 9990 drop
        }
      }
  - tipo: archivo
    ruta: /etc/systemd/system/faceops-app02-fw.service
    modo: '0644'
    contenido: |
      [Unit]
      Description=FaceOps APP-02: consola de administración de JBoss (9990) solo desde FaceOps/AAP
      Before=eap8-standalone.service
      After=network-pre.target

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/sbin/nft -f /etc/sysconfig/faceops-app02.nft
      ExecStop=/usr/sbin/nft delete table inet faceops_app02

      [Install]
      WantedBy=multi-user.target
  - tipo: archivo
    ruta: /usr/local/sbin/faceops-app02-nft
    modo: '0755'
    contenido: |
      #!/bin/sh
      # FaceOps APP-02: instala nftables si falta (repositorios de la máquina o, si no tiene, el registro de paquetes de FaceOps)
      command -v nft >/dev/null && exit 0
      dnf -y -q install nftables 2>/dev/null && exit 0
      R=http://192.168.122.1:3000/api/packages/repositorio/rpm
      P=$(python3 - "$R" <<'EOF'
      import gzip, re, sys, urllib.request
      x = gzip.decompress(urllib.request.urlopen(sys.argv[1] + "/repodata/primary.xml.gz", timeout=30).read()).decode()
      e, v, r = re.findall(r'<name>nftables</name><arch>x86_64</arch><version epoch="(\d+)" ver="([^"]+)" rel="([^"]+)"', x)[-1]
      print("package/nftables/%s%s-%s/x86_64/nftables-%s-%s.x86_64.rpm" % ("" if e == "0" else e + "-", v, r, v, r))
      EOF
      ) || exit 1
      curl -sf -m 60 -o /tmp/faceops-nftables.rpm "$R/$P" || exit 1
      dnf -y -q install --disablerepo='*' --repofrompath=faceops-registro,$R --setopt=faceops-registro.gpgcheck=1 --setopt=faceops-registro.gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-redhat-release /tmp/faceops-nftables.rpm
      rc=$?; rm -f /tmp/faceops-nftables.rpm; exit $rc
  - tipo: comando
    verificar: systemctl -q is-enabled faceops-app02-fw && nft list table inet faceops_app02 2>/dev/null | grep -q 'ip saddr 192.168.122.1 tcp dport 9990 accept' && nft list table inet faceops_app02 | grep -q 'tcp dport 9990 drop' && ss -ltn | grep -Eq '(0\.0\.0\.0|\*|\[::\]):9990 ' && grep -Eq '^[A-Za-z0-9_.@-]+=' /etc/opt/rh/eap8/wildfly/standalone/mgmt-users.properties
    aplicar: '/usr/local/sbin/faceops-app02-nft || exit 1; systemctl daemon-reload && systemctl enable faceops-app02-fw && systemctl restart faceops-app02-fw || exit 1; F=/etc/opt/rh/eap8/wildfly/eap8-standalone.conf; sed -i ''/jboss[.]bind[.]address[.]management=/d; s/-bmanagement=[^ "]*/-bmanagement=0.0.0.0/'' $F; grep -q -- ''-bmanagement='' $F || { grep -q ''^WILDFLY_OPTS="'' $F && sed -i ''s/^WILDFLY_OPTS="/WILDFLY_OPTS="-bmanagement=0.0.0.0
      /'' $F || echo ''WILDFLY_OPTS="-bmanagement=0.0.0.0"'' >> $F; }; grep -Eq ''^[A-Za-z0-9_.@-]+='' /etc/opt/rh/eap8/wildfly/standalone/mgmt-users.properties || echo ''APP-02: falta el usuario de administración de JBoss (debe coincidir con su credencial en la bóveda)''; systemctl restart eap8-standalone; for i in $(seq 1 40); do ss -ltn | grep -q '':9990 '' && break; sleep 3; done'
- id: IDN-01
  nombre: Sudo con registro de comandos
  categoria: identidad
  severidad: media
  descripcion: Todo lo que se ejecuta con sudo queda en un registro propio.
  aplica: {sistemas: [linux]}
  reglas:
    - {tipo: archivo, ruta: /etc/sudoers.d/50-faceops-registro, modo: '0440', contenido: "Defaults logfile=/var/log/sudo.log\n"}
- id: CON-01
  nombre: Contenedores solo desde registros confiables
  categoria: contenedores
  severidad: alta
  descripcion: Podman no resuelve nombres cortos de imágenes contra registros públicos al azar (short-name-mode enforcing). Si el equipo no tiene Podman, cumple.
  aplica: {sistemas: [linux], categorias: [servidor]}
  reglas:
    - {tipo: comando, verificar: "! command -v podman >/dev/null || grep -Eq '^short-name-mode *= *\"enforcing\"' /etc/containers/registries.conf",
       aplicar: "grep -q '^short-name-mode' /etc/containers/registries.conf && sed -i 's/^short-name-mode.*/short-name-mode = \"enforcing\"/' /etc/containers/registries.conf || echo 'short-name-mode = \"enforcing\"' >> /etc/containers/registries.conf"}
- id: CON-02
  nombre: Límites de recursos por contenedor
  categoria: contenedores
  severidad: media
  descripcion: >-
    Cada contenedor con tope de procesos (2048) y registros de tamaño acotado (100 MB), para que uno solo no agote el servidor:
    valores por defecto de Podman para los contenedores nuevos y tope de procesos aplicado en caliente a los que están en
    ejecución sin él (sin reiniciarlos). Si el equipo no tiene Podman, no aplica (cumple).
  aplica: {sistemas: [linux], categorias: [servidor]}
  reglas:
    - tipo: comando
      verificar: >-
        ! command -v podman >/dev/null || { grep -qsx 'pids_limit = 2048' /etc/containers/containers.conf.d/50-faceops.conf &&
        grep -qsx 'log_size_max = 104857600' /etc/containers/containers.conf.d/50-faceops.conf &&
        for c in $(podman ps -q); do podman container inspect $c | grep -Eq '"PidsLimit": [1-9]' || exit 1; done; }
      aplicar: >-
        mkdir -p /etc/containers/containers.conf.d &&
        printf '[containers]\npids_limit = 2048\nlog_size_max = 104857600\n' > /etc/containers/containers.conf.d/50-faceops.conf &&
        chmod 0644 /etc/containers/containers.conf.d/50-faceops.conf &&
        for c in $(podman ps -q); do podman container inspect $c | grep -Eq '"PidsLimit": [1-9]' || podman update --pids-limit 2048 $c || exit 1; done
- id: AUD-01
  nombre: Auditoría del sistema activa
  categoria: auditoria
  severidad: alta
  descripcion: auditd registra accesos y cambios sensibles; sin él no hay evidencia ante un incidente.
  aplica: {sistemas: [linux]}
  reglas:
    - {tipo: servicio, nombre: auditd, activo: true}
