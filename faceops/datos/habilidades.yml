# Ficha de la máquina › botón «Habilidades» (a la altura de la campana de alertas, extremo derecho): ventana centrada con
# las habilidades que FaceOps puede ejecutar en ESA máquina. Primero las migraciones y lo que diferencia; luego los quick wins.
#   tipo: diferenciador | quick win
#   valor: una línea con lo que gana el cliente
#   nombre_aap: automatización(es) del catálogo, en orden de preferencia (la primera que exista y aplique a la máquina)
#   so: regex sobre el sistema operativo de la máquina (opcional; si no calza, la habilidad no se muestra)
#   origen: parámetro que lleva la máquina cuando la acción la elige en su formulario (no usa límite), p. ej. mj_origen
#   sin_limite: true → la acción no corre «sobre» la máquina (elige su origen en el formulario): se lanza sin límite
#   categoria: regex sobre el tipo de equipo (p. ej. «clúster openshift»); ambito: texto de la columna Ámbito (fija el ámbito)
#   parametros: valores fijos que se envían (p. ej. el modo de la acción); campos: datos que pide la skill antes de lanzar
#   ui: replica | mover → abre el flotante propio de la ficha (elige destino) en vez de lanzar directo
#   ui: parches → abre el formulario de parches de la ficha (qué se aplica, política de reinicio y límite de tiempo)
# Una habilidad se muestra si su automatización aplica a la máquina (misma regla de la ficha: sistema, plataformas
# instaladas, inventario de AAP; ámbito en datos/skills-ambito.yml). Si aplica pero no está certificada (regla de prueba,
# app/pruebas.py) se muestra deshabilitada con su motivo. Todo se ejecuta vía AAP con ticket y aprobación.
# Equipos de red: «red» lista las subcategorías a las que aplica (todos | router, switch, firewall, balanceador, waf, vpn,
# wifi; la subcategoría sale del tipo del equipo o, en los de tipo «red», de su sistema: FortiOS/PAN-OS → firewall,
# F5 BIG-IP/HAProxy → balanceador…). Un equipo de red solo muestra las skills de su categoría. «so_accion»: sistemas donde
# la acción del catálogo funciona hoy; en los demás, y si la acción aún no existe, se muestra deshabilitada con el motivo
# «acción aún no disponible».
habilidades:
  # ── Migraciones (diferenciadores)
  - id: centos-rhel
    tipo: diferenciador
    grupo: Migraciones
    nombre: CentOS / Rocky / Alma a RHEL
    valor: Convierte el sistema a RHEL en el lugar, sin reinstalar, y lo deja con soporte de Red Hat.
    nombre_aap: ["Migración · CentOS a RHEL", "Satellite · Convertir a RHEL"]
    so: "(?i)centos|rocky|alma|oracle"
  - id: rhel-soportada
    tipo: diferenciador
    grupo: Migraciones
    nombre: RHEL a versión soportada
    valor: Actualiza RHEL en el lugar (Leapp) a la versión con soporte vigente, con respaldo previo y vuelta atrás.
    nombre_aap: ["Migración · RHEL a versión soportada"]
    so: "(?i)red ?hat|rhel"
  - id: jboss-eap8
    tipo: diferenciador
    grupo: Migraciones
    nombre: JBoss a EAP 8
    valor: Lleva el servidor de aplicaciones y sus despliegues a JBoss EAP 8 (Jakarta EE 10) con la configuración migrada.
    nombre_aap: ["Migración · JBoss a EAP 8"]
    origen: mj_origen   # la acción elige su servidor en el formulario: la máquina va en ese parámetro (modo por defecto: evaluar)
  - id: weblogic-ocp
    tipo: diferenciador
    grupo: Migraciones
    nombre: WebLogic a OpenShift
    valor: Saca la aplicación de WebLogic y la deja corriendo en OpenShift, sin licencias de Oracle.
    nombre_aap: ["Migración · WebLogic a OpenShift"]
  - id: iis-ocp
    tipo: diferenciador
    grupo: Migraciones
    nombre: IIS a OpenShift
    valor: Lleva la aplicación .NET de IIS a contenedores en OpenShift.
    nombre_aap: ["Migración · IIS a OpenShift"]
  - id: mover
    tipo: diferenciador
    grupo: Migraciones
    nombre: Mover a otra infraestructura
    valor: Traslada la máquina a otro hipervisor o centro de datos; la de origen queda de respaldo.
    nombre_aap: ["Infra · Mover máquina entre centros de datos"]
    ui: mover
  - id: replicar
    tipo: diferenciador
    grupo: Migraciones
    nombre: Replicar máquina
    valor: Levanta una máquina paralela desde la imagen base con el mismo rol, en el balanceo y verificada.
    nombre_aap: ["Infra · Replicar máquina"]
    ui: replica
  # ── OpenShift (clústeres): ámbito «OpenShift»
  - id: ocp-eus-actualizar
    tipo: diferenciador
    categoria: "clúster openshift"
    ambito: OpenShift
    nombre: Actualizar a la siguiente EUS
    valor: Lleva el clúster a la siguiente versión EUS con respaldo de etcd previo y operadores sanos.
    nombre_aap: ["OpenShift · Versión del clúster"]
    parametros: {ov_modo: actualizar}
    campos:
      - {var: ov_version, etiqueta: "Versión de destino", tipo: text, requerido: true, ayuda: "una de las que muestra «Evaluar salto a la siguiente EUS», p. ej. 4.20.12"}
      - {var: ov_confirmar, etiqueta: "Confirmación", tipo: text, requerido: true, ayuda: "escribe ACTUALIZAR (exige respaldo de etcd de menos de 24 h)"}
  - id: ocp-quay
    tipo: diferenciador
    categoria: "clúster openshift"
    ambito: OpenShift
    nombre: Mover imágenes a Quay
    valor: Saca del registry interno las imágenes sin uso y las deja en Quay, verificadas.
    nombre_aap: ["OpenShift · Mover imágenes a Quay"]
    campos:
      - {var: mq_quay, etiqueta: "Host de Quay", tipo: text, requerido: true}
      - {var: mq_seleccion, etiqueta: "Imágenes a mover", tipo: text, requerido: true, ayuda: "«todas» las candidatas o ns/imagestream:tag separados por coma"}
  - id: ocp-k8s
    tipo: diferenciador
    categoria: "clúster openshift"
    ambito: OpenShift
    nombre: Migrar cargas desde K8s u otro clúster
    valor: Evalúa el clúster de origen y prepara la migración de sus aplicaciones a este OpenShift.
    nombre_aap: ["Migración K8s → OpenShift · Evaluar origen"]
    sin_limite: true
  - id: ocp-virt
    tipo: diferenciador
    categoria: "clúster openshift"
    ambito: OpenShift
    nombre: Habilitar OpenShift Virtualization
    valor: Deja el clúster listo para correr máquinas virtuales junto a los contenedores.
    nombre_aap: ["OpenShift · Habilitar OpenShift Virtualization"]
    parametros: {ocpv_modo: instalar}
  - id: ocp-acs
    tipo: diferenciador
    categoria: "clúster openshift"
    ambito: OpenShift
    nombre: Escaneo de seguridad con ACS
    valor: Conecta el clúster a Advanced Cluster Security para escanear imágenes y despliegues.
    nombre_aap: ["OpenShift · Informe de seguridad del clúster", "OpenShift · Agente de ACS"]
    parametros: {acs_modo: conectar}
  - id: ocp-eus-evaluar
    tipo: quick win
    categoria: "clúster openshift"
    ambito: OpenShift
    nombre: Evaluar salto a la siguiente EUS
    valor: Muestra versiones disponibles, APIs retiradas y bloqueos para actualizar (solo lectura).
    nombre_aap: ["OpenShift · Versión del clúster"]
    parametros: {ov_modo: evaluar}
  - id: ocp-imagenes
    tipo: quick win
    categoria: "clúster openshift"
    ambito: OpenShift
    nombre: Evaluar uso y antigüedad de imágenes
    valor: Plan de imágenes sin uso por rango de meses, candidatas a Quay (solo lectura).
    nombre_aap: ["OpenShift · Evaluar imágenes (uso y antigüedad)", "OpenShift · Relevamiento de imágenes"]
  - id: ocp-respaldo
    tipo: quick win
    categoria: "clúster openshift"
    ambito: OpenShift
    nombre: Respaldo del clúster (OADP / etcd)
    valor: Deja el respaldo diario del clúster programado y verificado fuera del nodo.
    nombre_aap: ["OpenShift · Respaldo con OADP", "OpenShift · Respaldo de etcd"]
  - id: ocp-optimizar
    tipo: quick win
    categoria: "clúster openshift"
    ambito: OpenShift
    nombre: Optimizar recursos y limpiar
    valor: "Libera capacidad: recursos huérfanos, réplicas sobredimensionadas y volúmenes sueltos."
    nombre_aap: ["OpenShift · Optimizar recursos y limpiar"]
  # ── Windows (ámbito «Sistema operativo»; IIS como plataforma). Si la acción aún no existe o no es compatible, se muestra deshabilitada con su motivo
  - id: win-migrar
    tipo: diferenciador
    grupo: Migraciones
    nombre: Migrar a Windows Server soportado
    valor: Lleva la máquina a una versión de Windows Server con soporte vigente, con respaldo y vuelta atrás.
    por_so:
      - so: "(?i)windows"
        nombre_aap: ["Migración · Windows Server a versión soportada", "Windows · Actualizar a versión soportada"]
  - id: win-actualizaciones
    tipo: quick win
    grupo: Seguridad y continuidad
    nombre: Aplicar actualizaciones de Windows
    valor: Instala las actualizaciones de seguridad y críticas pendientes, con reinicio controlado.
    por_so:
      - so: "(?i)windows"
        nombre_aap: ["Windows · Aplicar actualizaciones", "Windows · Actualizaciones de seguridad"]
  - id: win-escaneo
    tipo: quick win
    grupo: Seguridad y continuidad
    nombre: Escaneo de seguridad
    valor: Escanea la máquina y deja sus hallazgos priorizados en FaceOps.
    por_so:
      - so: "(?i)windows"
        nombre_aap: ["Windows · Escaneo de seguridad", "Seguridad · Escaneo de servidores"]
  - id: win-iis
    tipo: quick win
    grupo: Plataformas
    ambito: IIS
    sin_skill: iis   # no se ofrece si la máquina ya tiene IIS
    nombre: Instalar IIS
    valor: Deja IIS instalado y publicado, listo para alojar aplicaciones .NET.
    por_so:
      - so: "(?i)windows"
        nombre_aap: ["IIS · Preparar servidor", "Windows · Instalar IIS", "Windows · Preparar IIS"]
  # ── Quick wins: evaluaciones y mejoras rápidas
  - id: evaluar-so
    tipo: quick win
    grupo: Evaluaciones
    nombre: Evaluar sistema operativo
    valor: Informe de ciclo de vida y bloqueos para migrar, sin tocar nada (solo lectura).
    nombre_aap: ["Migración · Evaluar sistema operativo"]
  - id: evaluar-destino
    tipo: quick win
    grupo: Evaluaciones
    nombre: Evaluar destino de ciclo de vida
    valor: Recomienda a qué versión o plataforma llevar la máquina y cuánto cuesta el salto.
    nombre_aap: ["Ciclo de vida · Evaluar destino"]
  - id: weblogic-evaluar
    tipo: quick win
    grupo: Evaluaciones
    nombre: Evaluar WebLogic para OpenShift
    valor: Mide qué tan lista está la aplicación para salir de WebLogic (solo lectura).
    nombre_aap: ["Migración · WebLogic a OpenShift · Evaluar"]
  - id: homologacion
    tipo: quick win
    grupo: Evaluaciones
    nombre: Relevar entorno para homologar
    valor: Releva versiones y configuración y las contrasta con el estándar del cliente.
    nombre_aap: ["Homologación · Relevar entorno"]
  - id: parches
    tipo: quick win
    grupo: Seguridad y continuidad
    nombre: Aplicar parches de seguridad
    valor: Cierra las CVE pendientes del sistema con los parches de Red Hat.
    nombre_aap: ["Seguridad · Aplicar parches de seguridad"]
    ui: parches   # nunca sin parámetros: todos los pendientes o los CVE elegidos, reinicio y límite de tiempo
  - id: escaneo
    tipo: quick win
    grupo: Seguridad y continuidad
    nombre: Escaneo de seguridad
    valor: Escanea la máquina y deja sus hallazgos priorizados en FaceOps.
    nombre_aap: ["Seguridad · Escaneo de servidores"]
    so: "^(?!.*(?i:windows))"   # en Windows va «win-escaneo»
  - id: certificados
    tipo: quick win
    grupo: Seguridad y continuidad
    nombre: Renovar certificados por vencer
    valor: Renueva los certificados próximos a vencer antes de que corten el servicio.
    nombre_aap: ["Certificados · Renovar por vencer"]
  - id: respaldo
    tipo: quick win
    grupo: Seguridad y continuidad
    nombre: Respaldar datos
    valor: Respalda los volúmenes de datos en S3 con restic, cifrado y versionado.
    nombre_aap: ["Recuperación · Respaldar volúmenes con restic"]
  - id: registrar-licencia
    tipo: quick win
    grupo: Seguridad y continuidad
    nombre: Registrar licencia
    valor: Registra la suscripción o activa la licencia del fabricante para recibir parches y soporte.
    solo_sin_registro: true   # solo si FaceOps sabe que la máquina NO está registrada o licenciada (datos.registrado / datos.licenciado = false)
    por_so:                   # la acción y los datos según el sistema; las claves van como secreto: enmascaradas en FaceOps, solo viajan a AAP
      - so: "(?i)red ?hat|rhel"
        nombre_aap: ["Sistema · Registrar en Red Hat"]
        campos:
          - {var: rh_org, etiqueta: "Organización", tipo: text, ayuda: "vacía = la de la llave guardada"}
          - {var: rh_llave, etiqueta: "Clave de activación", tipo: password, ayuda: "vacía = llave guardada de la organización"}
      - so: "(?i)windows"
        nombre_aap: ["Windows · Activar licencia"]
        campos:
          - {var: win_clave, etiqueta: "Clave de producto (o GVLK para KMS)", tipo: password}
          - {var: win_kms, etiqueta: "Servidor KMS (opcional)", tipo: text, ayuda: "host o host:puerto"}
  # ── Hipervisor (ficha /hipervisores/<id>, botón Skills junto a la campana). categoria: hipervisor → solo ahí, nunca en una
  #    máquina; hipervisor: regex sobre el tipo (kvm, vmware…); solo: tipos donde aplica (en los demás se muestra deshabilitada con
  #    el motivo); por_maquina: se lanza desde la ficha de cada máquina (necesita elegirla). Parámetro hv_infra = el hipervisor.
  - id: hv-mtv
    tipo: diferenciador
    grupo: Migraciones
    categoria: hipervisor
    ambito: Hipervisor
    nombre: VMware a OpenShift Virtualization (MTV)
    valor: Lleva las máquinas de vSphere a OpenShift Virtualization con Migration Toolkit for Virtualization, por olas y con vuelta atrás, sin licencias de VMware.
    nombre_aap: ["Migración · VMware a OpenShift Virtualization"]
    solo: vmware
  - id: hv-consolidar
    tipo: diferenciador
    grupo: Capacidad
    categoria: hipervisor
    ambito: Hipervisor
    nombre: Evaluar consolidación y ahorro
    valor: Mide uso real frente a lo asignado y propone cuántos anfitriones sobran, qué máquinas juntar y cuánto se ahorra en hardware y licencias.
    nombre_aap: ["Infra · Evaluar consolidación de hipervisores"]
  - id: hv-snapshots
    tipo: quick win
    grupo: Capacidad
    categoria: hipervisor
    ambito: Hipervisor
    nombre: Limpiar snapshots viejos
    valor: Libera espacio del pool o datastore y evita discos encadenados que degradan el rendimiento.
    nombre_aap: ["Infra · Limpiar snapshots viejos"]
  - id: hv-rebalancear
    tipo: quick win
    grupo: Máquinas virtuales
    categoria: hipervisor
    ambito: Hipervisor
    nombre: Rebalancear o mover máquinas
    valor: Reparte la carga entre anfitriones o centros de datos moviendo máquinas, con la de origen como vuelta atrás.
    nombre_aap: ["Infra · Mover máquina entre centros de datos"]
    por_maquina: true
  - id: hv-capacidad
    tipo: quick win
    grupo: Capacidad
    categoria: hipervisor
    ambito: Hipervisor
    nombre: Informe de capacidad y overcommit
    valor: CPU, memoria y disco asignados frente a lo físico, tendencia y recomendación de redimensionamiento.
    nombre_aap: ["Infra · Informe de capacidad del hipervisor"]
  - id: hv-autoinicio
    tipo: quick win
    grupo: Máquinas virtuales
    categoria: hipervisor
    ambito: Hipervisor
    nombre: Encendido automático controlado
    valor: Al reiniciar el anfitrión solo arranca la bóveda; el resto queda apagado hasta encenderlo desde FaceOps.
    nombre_aap: ["Infra · Encendido automático de máquinas"]
    parametros: {ia_encender: nodo-vault}
    solo: kvm
  - id: hv-respaldo
    tipo: quick win
    grupo: Continuidad
    categoria: hipervisor
    ambito: Hipervisor
    nombre: Respaldo de la configuración del anfitrión
    valor: Definiciones de máquinas, redes y pools del anfitrión a Git, para reconstruirlo igual si falla.
    nombre_aap: ["Infra · Respaldar configuración del anfitrión"]
  - id: hv-parches
    tipo: quick win
    grupo: Ciclo de vida
    categoria: hipervisor
    ambito: Hipervisor
    nombre: Parchear el anfitrión
    valor: Parches del sistema y de la capa de virtualización con ventana y apagado o traslado ordenado de las máquinas.
    nombre_aap: ["Infra · Parchear anfitrión"]
  # ── Segmento de negocio (vista del segmento en el mapa, junto a su campana): ámbito «Segmento» (app/segmento_ops.py).
  #   requiere: entrada | https | balanceador | maquinas | vm → lo que el segmento debe tener; si no, deshabilitada con el motivo
  #   por_plataforma: {familia: acción} → la acción de la plataforma que tenga el segmento · parametros_de: flujos → los tramos del segmento
  #   Sin acción del catálogo (nombre_aap vacío) se muestra deshabilitada con su motivo (sin_accion).
  - id: seg-verificar
    tipo: quick win
    grupo: Servicio
    nombre: Verificar el servicio de punta a punta
    valor: Prueba cada tramo del segmento (puerto, latencia y TLS) desde sus servidores, sin cambiar nada.
    nombre_aap: ["FaceOps · Verificar flujos de red"]
    categoria: segmento
    ambito: Segmento
    requiere: maquinas
    parametros_de: flujos
  - id: seg-dependencias
    tipo: quick win
    grupo: Servicio
    nombre: Informe de dependencias
    valor: Qué componentes, flujos y servicios externos usa el segmento y qué se cae si falla cada uno.
    nombre_aap: []
    sin_accion: "aún no hay una acción del catálogo que arme el informe (hoy se ve en el mapa del segmento)"
    categoria: segmento
    ambito: Segmento
  - id: seg-certificado
    tipo: quick win
    grupo: Servicio
    nombre: Renovar el certificado del VIP
    valor: Renueva con la CA interna el certificado de la entrada del segmento antes de que venza, con recarga y verificación.
    nombre_aap: ["Certificados · Renovar por vencer"]
    categoria: segmento
    ambito: Segmento
    requiere: https
  - id: seg-drenar
    tipo: quick win
    grupo: Servicio
    nombre: Drenar un nodo del balanceador
    valor: Saca un nodo del balanceo para mantenimiento sin cortar el servicio; el resto sigue atendiendo.
    nombre_aap: ["FaceOps · Retirar del balanceo"]
    categoria: segmento
    ambito: Segmento
    requiere: balanceador
  - id: seg-dr
    tipo: diferenciador
    grupo: Continuidad
    nombre: Replicar el segmento en otro sitio (DR)
    valor: Deja una copia de las máquinas del segmento en otro centro de datos para recuperarse ante la pérdida del sitio.
    nombre_aap: ["Infra · Replicar máquina"]
    categoria: segmento
    ambito: Segmento
    requiere: vm
  - id: seg-failover
    tipo: diferenciador
    grupo: Continuidad
    nombre: Prueba de failover controlada
    valor: Conmuta el servicio al sitio o nodo de respaldo en una ventana acordada y mide cuánto tarda en volver (RTO real).
    nombre_aap: []
    sin_accion: "aún no hay una acción del catálogo para conmutar el segmento completo de sitio"
    categoria: segmento
    ambito: Segmento
  - id: seg-escalar
    tipo: diferenciador
    grupo: Capacidad
    nombre: Escalar (agregar nodo)
    valor: Agrega un servidor igual al de la aplicación y lo suma al balanceador (round robin), con aprobación.
    nombre_aap: ["FaceOps · Replicar con alta disponibilidad"]
    categoria: segmento
    ambito: Segmento
    requiere: balanceador
  - id: seg-impacto
    tipo: diferenciador
    grupo: Cambios
    nombre: Análisis de impacto de un cambio
    valor: Antes de un cambio, qué componentes, flujos y usuarios del segmento se ven afectados y en qué ventana conviene hacerlo.
    nombre_aap: []
    sin_accion: "aún no hay una acción del catálogo para el análisis de impacto"
    categoria: segmento
    ambito: Segmento
  - id: seg-ocp
    tipo: diferenciador
    grupo: Modernización
    nombre: Mover el segmento a OpenShift
    valor: Lleva las aplicaciones del segmento de máquinas virtuales a contenedores en OpenShift.
    por_plataforma: {iis: "Migración · IIS a OpenShift", weblogic: "Migración · WebLogic a OpenShift"}
    sin_accion: "sus plataformas aún no tienen una acción del catálogo para llevarlas a OpenShift (hoy: IIS y WebLogic)"
    categoria: segmento
    ambito: Segmento
    requiere: vm
  # ── Equipos de red (ámbito «Red · …»): primero las de todos los equipos, luego las de cada categoría
  - id: red-respaldo
    tipo: quick win
    red: todos
    grupo: Todos los equipos de red
    ambito: Red · Configuración
    nombre: Respaldo de configuración
    valor: Guarda la configuración vigente versionada en Git, con los secretos enmascarados; es la línea base del equipo.
    nombre_aap: ["Red · Respaldar configuración"]
    so_accion: "(?i)vyos|frrouting|haproxy"
  - id: red-drift
    tipo: diferenciador
    red: todos
    grupo: Todos los equipos de red
    ambito: Red · Configuración
    nombre: Detección de cambios (drift) contra la línea base
    valor: Muestra lo que se cambió a mano desde el último respaldo, línea por línea, sin tocar el equipo.
    nombre_aap: ["Red · Detectar cambios de configuración"]
    so_accion: "(?i)vyos|frrouting|haproxy"
  - id: red-cis
    tipo: diferenciador
    red: todos
    grupo: Todos los equipos de red
    ambito: Red · Seguridad
    nombre: Cumplimiento CIS
    valor: Contrasta la configuración con el benchmark CIS del fabricante y deja las brechas priorizadas.
    nombre_aap: ["Red · Cumplimiento CIS"]
  - id: red-firmware
    tipo: diferenciador
    red: todos
    grupo: Todos los equipos de red
    ambito: Red · Firmware
    nombre: Actualización de firmware (evaluar y aplicar)
    valor: Evalúa la versión contra la recomendada del fabricante y la aplica en ventana, con respaldo previo y vuelta atrás.
    nombre_aap: ["Red · Actualizar firmware"]
  - id: red-inventario
    tipo: quick win
    red: todos
    grupo: Todos los equipos de red
    ambito: Red · Topología
    nombre: Inventario de interfaces y vecinos (LLDP/CDP)
    valor: Lee interfaces con su estado, IP y VLAN y los vecinos LLDP/CDP, y los deja en la ficha (solo lectura).
    nombre_aap: ["Red · Inventariar equipo de red"]
    so_accion: "(?i)vyos|frrouting|haproxy"
  - id: fw-auditoria
    tipo: diferenciador
    red: [firewall, waf]
    grupo: Firewall
    ambito: Red · Reglas
    nombre: Auditoría de reglas
    valor: Encuentra reglas sin uso, sombreadas o demasiado permisivas y propone su limpieza.
    nombre_aap: ["Red · Auditar reglas de firewall"]
  - id: fw-abrir-puerto
    tipo: diferenciador
    red: [firewall]
    grupo: Firewall
    ambito: Red · Reglas
    nombre: Abrir puerto con ticket y expiración
    valor: Abre el acceso pedido con su ticket y lo cierra solo al vencer; queda registrado en Git.
    nombre_aap: ["Red · Solicitar acceso con aprobación"]
    so_accion: "(?i)vyos"
    sin_limite: true   # la acción aplica la regla en los firewalls del laboratorio (grupo «firewall»)
    campos:
      - {var: acceso_origen, etiqueta: "Desde dónde (red o alias)", tipo: text, requerido: true, ayuda: "p. ej. 10.40.40.0/24"}
      - {var: acceso_destino, etiqueta: "Destino (IP)", tipo: text, requerido: true}
      - {var: acceso_puerto, etiqueta: "Puertos", tipo: text, requerido: true, ayuda: "p. ej. 443 o 8080,8443"}
      - {var: acceso_vigente_hasta, etiqueta: "Vigente hasta (AAAA-MM-DD)", tipo: text, requerido: true}
