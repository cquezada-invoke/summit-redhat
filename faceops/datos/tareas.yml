# Tareas automatizadas: la unidad del factor de beneficio. Una automatización (optimización de un flujo operativo) es la
# suma de sus tareas, y una misma tarea puede ser parte de varias automatizaciones.
#   manual   minutos de un especialista para hacerla a mano (se ajusta en Administración › Cobro por beneficio)
#   auto     minutos típicos automatizada (estimación; cuando la automatización tiene ejecuciones medidas, su tiempo real
#            se reparte entre sus tareas en proporción a esta estimación)
#   alcance  unidad: se repite por cada máquina / servidor / réplica / flujo a la que llega la automatización
#            ejecucion: una vez por ejecución
# Factor de la tarea  F = (manual − auto) ÷ 60 × (manual − auto) ÷ manual
# Créditos de una ejecución = Σ F (tareas por unidad) × unidades + Σ F (tareas por ejecución)
tareas:
  # ---- Base y operación de sistemas
  verificar-acceso:      {nombre: "Verificar acceso y prerrequisitos", manual: 5, auto: 0.2}
  recolectar-estado:     {nombre: "Recolectar el estado del equipo", manual: 10, auto: 0.3}
  respaldo-previo:       {nombre: "Respaldo o snapshot previo al cambio", manual: 15, auto: 0.5}
  instalar-paquetes:     {nombre: "Instalar paquetes y dependencias", manual: 20, auto: 2}
  firewall-local:        {nombre: "Abrir puertos en el firewall del equipo", manual: 10, auto: 0.2}
  reiniciar-servicio:    {nombre: "Reiniciar un servicio de forma controlada", manual: 10, auto: 0.5}
  reinicio-equipo:       {nombre: "Reiniciar el equipo y esperar que vuelva", manual: 10, auto: 2}
  validar-servicio:      {nombre: "Verificar el servicio y dejar evidencia", manual: 10, auto: 0.3}
  dar-acceso:            {nombre: "Crear usuario de servicio, llave y sudo", manual: 15, auto: 0.2}
  registrar-redhat:      {nombre: "Registrar en Red Hat (CDN o Satellite)", manual: 15, auto: 0.5}
