# Ámbito de cada automatización en el panel «Skills» de la ficha de una máquina.
#   so          → skill del SISTEMA OPERATIVO de la máquina (botón Skills de la caja «Encendido»)
#   [familias]  → skill de esa PLATAFORMA (botón Skills de su tarjeta); familia = código de la plataforma (jboss, redis, nginx…)
# Si la máquina no tiene instalada ninguna de las plataformas indicadas, la skill no se muestra.
# Lo que no esté aquí se resuelve por «prefijos» (la parte antes de « · » en el nombre de AAP); si tampoco, queda en «so».
# Las marcadas «por confirmar» se dejaron en el SO porque su ámbito no es claro.
prefijos:
  JBoss: [jboss]
  Redis: [redis]
  Keycloak: [keycloak]
  Vault: [vault]
  Jenkins: [jenkins]
  PostgreSQL: [postgresql]
  MySQL: [mysql]
  MongoDB: [mongodb]
  SQL Server: [sql-server, sqlserver, mssql]
  Satellite: [satellite]
  VPN: [vpn, wireguard]
  OpenShift: [openshift]
  Sistema: so
  Seguridad: so
  Infra: so
  Storage: so
  Red: so
  DC: so
  Windows: so
  Migración: so
