# Apertura de cada pilar de salud: qué considera en general y qué mirar en cada contexto tecnológico (ítems del menú).
# Lo usan el panel (radar de madurez) y el detalle «Qué falta para llegar a la meta». Alineado con AWS Well-Architected,
# ISO/IEC 25010, NIST CSF 2.0 e ISO 22301; la escala de madurez sigue los niveles de COBIT 2019 / CMMI (1 a 5).
Disponibilidad:
  well_architected: "Reliability (confiabilidad)"
  cobit: "BAI04 Gestión de la disponibilidad y la capacidad · DSS01 Gestión de las operaciones"
  definicion: "Que el servicio esté arriba cuando el negocio lo necesita y que una falla no lo detenga."
  considerar: ["Redundancia de lo crítico (sin puntos únicos de falla)", "Monitoreo con alertas atendidas", "Capacidad de reserva ante picos o caídas", "Ventanas de mantenimiento sin corte"]
  por_contexto:
    servidores: ["Agente de métricas y alertas en cada servidor", "Réplicas detrás de un balanceador para lo crítico", "Encendido automático tras reinicio del anfitrión"]
    redes: ["Enlaces y equipos redundantes (HA de firewall y routers)", "Rutas alternativas (BGP, VRRP)", "Monitoreo de interfaces y enlaces"]
    storage: ["Controladoras y caminos redundantes (multipath)", "Alertas de capacidad antes del 85 %", "Réplica entre sitios para lo crítico"]
    bd: ["Réplica o clúster (primario + réplica)", "Conmutación automática probada", "Monitoreo de conexiones y bloqueos"]
    plataformas: ["Al menos 2 instancias por servicio de plataforma", "Sesiones compartidas o sin estado", "Chequeos de salud en el balanceo"]
    contenedores: ["Control plane de 3 nodos y workers suficientes", "Réplicas y PodDisruptionBudget en las apps", "Sondas de vida y de disponibilidad"]
    nube: ["Despliegue en más de una zona", "Grupos de autoescalado", "Alertas del proveedor conectadas"]
    aplicaciones: ["Todos los componentes del flujo con redundancia", "Pruebas de punta a punta periódicas", "Dependencias externas monitoreadas"]
Rendimiento:
  well_architected: "Performance Efficiency (eficiencia del rendimiento)"
  cobit: "BAI04 Gestión de la disponibilidad y la capacidad"
  definicion: "Que el servicio responda en el tiempo esperado con los recursos justos."
  considerar: ["Métricas de uso reales (CPU, memoria, disco, red)", "Tiempos de respuesta medidos", "Recursos dimensionados al uso", "Pruebas de carga antes de cambios grandes"]
  por_contexto:
    servidores: ["Agente de métricas", "CPU y memoria ajustadas al uso", "Disco con espacio y sin saturación de E/S"]
    redes: ["Latencia y pérdida medidas entre segmentos", "Enlaces sin saturación", "Balanceo bien distribuido"]
    storage: ["IOPS y latencia por volumen", "Nivel de almacenamiento según la carga"]
    bd: ["Consultas lentas identificadas", "Índices y estadísticas al día", "Pool de conexiones dimensionado"]
    plataformas: ["Memoria de la JVM y pools ajustados", "Caché con tasa de acierto medida"]
    contenedores: ["Autoescalado de pods", "Requests acordes al consumo real"]
    nube: ["Tipo de máquina acorde a la carga", "Autoescalado configurado"]
    aplicaciones: ["Tiempo de respuesta de punta a punta", "Cuello de botella del flujo conocido"]
Seguridad:
  well_architected: "Security (seguridad)"
  cobit: "APO13 Gestión de la seguridad · DSS05 Gestión de los servicios de seguridad"
  definicion: "Que los sistemas estén protegidos, parchados y bajo políticas, y que el acceso sea el justo."
  considerar: ["Vulnerabilidades (CVE) revisadas y parchadas", "Políticas de seguridad aplicadas", "Credenciales en bóveda y acceso mínimo", "Registro y detección de eventos"]
  por_contexto:
    servidores: ["CVE revisados y parches críticos aplicados", "Políticas (CIS) aplicadas", "Acceso SSH/RDP controlado y sin claves fijas"]
    redes: ["Reglas mínimas necesarias", "Administración cifrada y con doble factor", "Firmware sin vulnerabilidades conocidas"]
    storage: ["Cifrado en reposo", "Acceso por red de gestión"]
    bd: ["Cifrado de datos y conexiones", "Usuarios por aplicación, sin cuentas compartidas", "Auditoría activa"]
    plataformas: ["TLS con certificados vigentes", "Secretos en bóveda"]
    contenedores: ["Imágenes escaneadas", "Sin contenedores privilegiados", "Políticas de red entre namespaces"]
    nube: ["Identidades con mínimo privilegio", "Sin recursos públicos innecesarios"]
    aplicaciones: ["Dependencias sin vulnerabilidades", "Flujos cifrados (TLS)", "Autenticación centralizada"]
Recuperación:
  well_architected: "Reliability: recuperación ante desastres"
  cobit: "DSS04 Gestión de la continuidad"
  definicion: "Que ante una pérdida o un error se pueda volver a un estado bueno, en el tiempo comprometido."
  considerar: ["Respaldos de datos y de configuración", "Puntos de restauración antes de cambios", "Objetivos RPO/RTO definidos", "Restauraciones probadas"]
  por_contexto:
    servidores: ["Configuración respaldada en Git", "Punto de restauración periódico", "Imagen base para reconstruir"]
    redes: ["Configuración de cada equipo en Git", "Procedimiento de reemplazo de un equipo"]
    storage: ["Snapshots programados", "Copia fuera del sitio"]
    bd: ["Respaldo completo e incremental", "Restauración probada en otro ambiente"]
    plataformas: ["Configuración y datos de la plataforma respaldados"]
    contenedores: ["Respaldo de etcd", "Manifiestos en Git (GitOps)", "Respaldo de volúmenes persistentes"]
    nube: ["Snapshots y respaldo entre regiones"]
    aplicaciones: ["Plan de recuperación del segmento completo", "Prueba anual de recuperación"]
Costo:
  well_architected: "Cost Optimization (optimización de costos) · práctica FinOps"
  cobit: "APO06 Gestión del presupuesto y los costos"
  definicion: "Que lo que se paga esté bien usado: sin capacidad ociosa, con dueño y sin sorpresas en la factura."
  considerar: ["Recursos dimensionados al uso real", "Costo asignado a cada servicio (dueño claro)", "Licencias y suscripciones en uso", "Huérfanos y lo que no se usa, retirado"]
  por_contexto:
    servidores: ["CPU y memoria ajustadas al uso", "Máquinas sin uso apagadas o retiradas", "Cada máquina asignada a un servicio"]
    redes: ["Enlaces contratados acordes al tráfico", "Equipos sin uso dados de baja"]
    storage: ["Volúmenes y snapshots huérfanos eliminados", "Nivel de almacenamiento según el uso (caliente / frío)"]
    bd: ["Instancias consolidadas cuando el uso es bajo", "Licencias del motor ajustadas a los núcleos usados"]
    plataformas: ["Suscripciones acordes a las instancias en uso"]
    contenedores: ["Requests sin sobredimensionar", "Nodos ajustados a la carga (autoescalado)"]
    nube: ["Reservas o compromisos de uso para lo estable", "Recursos huérfanos y sin etiqueta eliminados", "Presupuesto y alertas de gasto"]
    aplicaciones: ["Costo mensual por segmento conocido", "Ambientes no productivos apagados fuera de horario"]
Excelencia operativa:
  well_architected: "Operational Excellence (excelencia operativa)"
  cobit: "DSS01 Gestión de las operaciones · BAI06 Gestión de los cambios · DSS03 Gestión de problemas"
  definicion: "Que la operación sea predecible: automatizada, documentada, con cambios controlados y sin trabajo manual repetitivo."
  considerar: ["Todo el parque gestionado por automatizaciones (no a mano)", "Inventario completo y al día", "Hallazgos con dueño y plazo, atendidos por severidad", "Cambios con aprobación y vuelta atrás", "Configuración como código (Git)"]
  por_contexto:
    servidores: ["En el inventario de AAP", "Recolección diaria del inventario", "Configuración igual a la línea base"]
    redes: ["Configuración declarada en Git y sin drift", "Cambios por ticket con aprobación"]
    storage: ["Asignación y ampliación por automatización", "Inventario de volúmenes al día"]
    bd: ["Tareas de mantenimiento automatizadas", "Parámetros versionados"]
    plataformas: ["Instalación y configuración por automatización", "Versiones dentro de soporte"]
    contenedores: ["GitOps para aplicaciones y configuración del clúster", "Actualizaciones guiadas con validación"]
    nube: ["Infraestructura como código", "Etiquetado obligatorio"]
    aplicaciones: ["Pipelines con pruebas y vuelta atrás", "Ambientes homologados a producción"]
