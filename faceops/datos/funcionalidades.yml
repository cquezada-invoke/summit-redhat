  - {n: "Elytron (seguridad)", detecta: "auto:Elytron"}
  - {n: "Mensajería (ActiveMQ Artemis embebido)", detecta: "auto:Artemis"}
  - {n: "Migración de aplicaciones (MTA)", detecta: "auto:JBoss a EAP 8"}
  - {n: "Estadísticas y métricas", detecta: "auto:Diagnosticar"}
  - {n: "Volver a la versión validada", detecta: "auto:Volver a la versión"}
