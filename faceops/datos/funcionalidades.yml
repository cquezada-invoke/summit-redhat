# Funcionalidades de cada producto y cómo FaceOps detecta que se usan (servicio en ejecución, skill de la máquina,
# dato del inventario o automatización usada en los últimos 90 días). Usabilidad = funcionalidades en uso ÷ total.
# Sana: 40 % o más. Bajo eso se fomenta con automatizaciones especializadas del producto.
# detecta: servicio:<nombre> · skill:<skill> · dato:<clave>=<valor> · auto:<texto en el nombre de la automatización>
rhel:
  - {n: "Registro y parches (suscripción)", detecta: "dato:registrado=true"}
  - {n: "SELinux enforcing", detecta: "dato:selinux=enforcing"}
  - {n: "Firewall (firewalld)", detecta: "servicio:firewalld"}
  - {n: "Auditoría (auditd)", detecta: "servicio:auditd"}
  - {n: "Sincronización de hora (chrony)", detecta: "servicio:chronyd"}
  - {n: "Identidad centralizada (SSSD / IdM)", detecta: "servicio:sssd"}
  - {n: "Insights (rhc / insights-client)", detecta: "servicio:rhcd"}
  - {n: "Cockpit (consola web)", detecta: "servicio:cockpit"}
  - {n: "Podman (contenedores)", detecta: "servicio:podman"}
  - {n: "Gestión de rendimiento (tuned)", detecta: "servicio:tuned"}
  - {n: "Image Builder", detecta: "servicio:osbuild"}
  - {n: "Live patching del kernel (kpatch)", detecta: "servicio:kpatch"}
  - {n: "Monitoreo (Performance Co-Pilot)", detecta: "servicio:pmcd"}
  - {n: "System Roles / automatización", detecta: "auto:Sistema ·"}
jboss-eap:
