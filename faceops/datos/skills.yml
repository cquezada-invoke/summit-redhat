# Skills = el producto concreto que una automatización HABILITA en los equipos (nginx, postgres, activemq, keycloak…).
# Estas automatizaciones aparecen en el catálogo con la categoría «Skills». Cuando terminan bien, FaceOps deja la skill
# registrada en cada equipo donde corrieron (además, el recolector la detecta si ya estaba instalada).
# nombre técnico en AAP → {sistemas compatibles, skill, descripcion, deteccion (regla para reconocerla en el recolector)}
# FaceOps solo ofrece equipos compatibles (mismo sistema) que todavía NO tienen la skill.
"JBoss · Preparar servidor": {sistemas: [linux], skill: jboss, descripcion: "Servidor de aplicaciones JBoss EAP 8 listo para desplegar, balanceado en Nginx", deteccion: {servicio: [eap8-standalone, "eap7*", "jboss*", wildfly]}}
"Windows · Preparar IIS": {sistemas: [windows], skill: iis, descripcion: "Servidor web IIS con la página de la aplicación", deteccion: {servicio: [w3svc]}}
