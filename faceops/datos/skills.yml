# Skills = capacidades que una automatización HABILITA en los equipos (instala, configura o incorpora algo).
# Estas automatizaciones aparecen en el catálogo con la categoría «Skills». Cuando terminan bien, FaceOps deja la skill
# registrada en cada equipo donde corrieron (además, el recolector la detecta si ya estaba instalada).
# nombre técnico en AAP → {sistemas compatibles, skill, descripcion, deteccion (regla para reconocerla en el recolector)}
# FaceOps solo ofrece equipos compatibles (mismo sistema) que todavía NO tienen la skill.
