"DC · midPoint": {sistemas: [linux], skill: midpoint, descripcion: "Gobierno de identidades con midPoint", deteccion: {servicio: [midpoint, "midpoint*"]}}
"DC · Keycloak": {sistemas: [linux], skill: keycloak, descripcion: "Login único (Keycloak)", deteccion: {servicio: [keycloak, "keycloak*"]}}
"DC · Satellite": {sistemas: [linux], skill: satellite, descripcion: "Red Hat Satellite: contenido, registro y parches", deteccion: {servicio: [foreman, "foreman*"]}}
"FaceOps · Agente de monitoreo (Linux)": {sistemas: [linux], skill: node-exporter, descripcion: "Prometheus node_exporter (métricas para Grafana)", deteccion: {servicio: [node_exporter, "prometheus-node-exporter"]}}
"FaceOps · Respaldo continuo en Git": {sistemas: [linux], skill: respaldo-git, descripcion: "Respaldo continuo en Git: configuración, paquetes exactos, servicios y comandos de la máquina, para recuperarla", deteccion: {servicio: [faceops-respaldo.timer, faceops-respaldo]}}
