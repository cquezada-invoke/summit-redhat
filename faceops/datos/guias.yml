# Guías en lenguaje simple por automatización (las de las demos del Summit están en guias-demos.yml) (nombre técnico en AAP → guía). Se cargan al sincronizar el catálogo
# solo si la ficha no tiene guía; después se editan en FaceOps-admin › Catálogo y tarifas.
# Campos: proposito · cuando · cambios · riesgo (bajo|medio|alto) · reversa · resultado · entradas (texto por campo)

"Remediación · Volver a la versión validada":
  proposito: "Vuelve la aplicación a la última versión que pasó las validaciones, cuando una versión nueva falla."
  cuando: "Después de un despliegue con errores en producción, previo diagnóstico."
  cambios: "Reemplaza la versión desplegada en todos los JBoss del grupo, uno a la vez (el servicio no se corta)."
  riesgo: alto
  reversa: "Volver a desplegar la versión nueva desde el pipeline cuando esté corregida."
  resultado: "Todos los JBoss con la versión validada y la app respondiendo."
"Windows · Preparar IIS":
  proposito: "Deja el servidor Windows con IIS instalado y la página de la aplicación."
  cuando: "Al preparar un servidor nuevo o para restablecer el caso de demo."
  cambios: "Instala IIS si falta, publica la página y deja el servicio en inicio automático."
  riesgo: bajo
  reversa: "Desinstalar el rol IIS (no automatizado)."
  resultado: "IIS funcionando con la página de la app."
"Windows · Provocar caída de IIS (demo)":
  proposito: "Prueba de demo: detiene IIS para mostrar la autorremediación."
  cuando: "Solo en demostraciones en vivo."
  cambios: "Detiene el servicio W3SVC; el monitoreo lo detecta y la remediación lo levanta sola."
  riesgo: medio
  reversa: "La remediación «Levantar IIS en Windows» lo recupera en segundos."
  resultado: "Sitio caído hasta que actúa la autorremediación."
"Monitoreo · Exportador en Windows":
  proposito: "Instala el agente de métricas de Windows para que Prometheus lo monitoree."
  cuando: "Al incorporar un servidor Windows al monitoreo."
  cambios: "Instala windows_exporter (puerto 9182, solo accesible desde el monitoreo)."
  riesgo: bajo
  reversa: "Desinstalar el exportador (no automatizado)."
  resultado: "Métricas del servidor visibles en Grafana."
"Autoservicio · 1 Desplegar app":
  proposito: "Primer paso del autoservicio: despliega la app pedida en el servidor de aplicaciones."
  cuando: "Normalmente se usa dentro de «Nuevo ambiente»."
  cambios: "Instala la app como servicio en el servidor de aplicaciones."
  riesgo: medio
  reversa: "«Retirar app»."
  resultado: "App corriendo en el servidor."
"Autoservicio · 2 Publicar en Nginx":
  proposito: "Segundo paso del autoservicio: publica la app detrás de Nginx con una ruta propia."
  cuando: "Normalmente se usa dentro de «Nuevo ambiente», después de desplegar."
  cambios: "Crea la ruta en Nginx y recarga sin corte."
  riesgo: bajo
  reversa: "«Retirar app» quita la ruta."
  resultado: "App accesible por su ruta."
"Autoservicio · 3 Validar":
  proposito: "Tercer paso del autoservicio: verifica que la app responde por Nginx y entrega la URL."
  cuando: "Al final de «Nuevo ambiente» o para comprobar una app."
  cambios: "Ninguno (solo prueba)."
  riesgo: bajo
  reversa: "No aplica."
  resultado: "URL validada."
"Red · Actualizar firmware":
  proposito: "Paso técnico de «Actualizar firmware»: prepara o aplica la actualización por lotes."
  cuando: "Lo usa el workflow con aprobación."
  cambios: "Según la fase: plan y pre-chequeo, o actualización equipo por equipo."
  riesgo: alto
  reversa: "Automática por equipo si falla."
  resultado: "Equipos actualizados o plan listo para aprobar."
"Nube · Limpiar huérfanos":
  proposito: "Limpia los recursos de nube huérfanos etiquetados por el Managed Service."
  cuando: "Después de aprobar el reporte de huérfanos."
  cambios: "Borra discos, IPs y snapshots etiquetados; apaga VMs fuera de horario."
  riesgo: medio
  reversa: "No recuperable para lo borrado."
  resultado: "Recursos limpiados."
"Nube · Prueba: crear huérfanos":
  proposito: "Prueba de demo: crea un disco y una IP sin uso para que el reporte los detecte."
  cuando: "Solo en demostraciones."
  cambios: "Crea recursos de prueba etiquetados (costo mínimo)."
  riesgo: bajo
  reversa: "Ejecutar con la acción «borrar» o la limpieza."
  resultado: "Recursos de prueba creados."
"Nube · Prueba: regla peligrosa":
  proposito: "Prueba de demo: crea una regla de firewall abierta para que la vigilancia la corrija."
  cuando: "Solo en demostraciones."
  cambios: "Crea una regla abierta sobre una etiqueta que ninguna VM usa (no expone nada real)."
  riesgo: bajo
  reversa: "La vigilancia la restringe en 10 minutos, o ejecutar con «borrar»."
  resultado: "Regla de prueba creada."
"DC · Registrar en Red Hat":
  proposito: "Registra los servidores RHEL del data center en Red Hat para recibir paquetes y parches."
  cuando: "Al crear servidores nuevos o si aparecen «sin registro» en el inventario."
  cambios: "Registra cada equipo con la clave de activación de la organización."
  riesgo: bajo
  reversa: "Desregistrar el equipo (manual)."
  resultado: "Equipos registrados con sus repositorios habilitados."
  entradas:
    clave_activacion: "Activation key de console.redhat.com (se oculta y no queda en el ticket)"
"DC · Base de los equipos":
  proposito: "Deja la base común en los servidores Linux del data center: nombres, hora, paquetes y firewall."
  cuando: "Al crear servidores o si el inventario muestra firewall apagado u hora desincronizada."
  cambios: "Instala paquetes base, activa firewalld y chronyd, y escribe los nombres del parque."
  riesgo: bajo
  reversa: "No suele requerirse."
  resultado: "Servidores con la base del data center."
"DC · Active Directory":
  proposito: "Construye o corrige el Active Directory del data center."
  cuando: "Instalación del data center o para reponer su configuración."
  cambios: "Bosque, DNS, autoridad certificadora, unidades organizativas, grupos y cuentas de servicio."
  riesgo: alto
  reversa: "No reversible sin restaurar el controlador."
  resultado: "AD operativo con LDAPS."
"DC · Red Hat IdM":
  proposito: "Instala o corrige el servidor Red Hat IdM (identidad para Linux)."
  cuando: "Instalación del data center."
  cambios: "Servidor IdM con DNS, grupo admins-linux y regla de sudo."
  riesgo: alto
  reversa: "Desinstalar IdM (manual)."
  resultado: "IdM operativo."
"DC · Directory Server":
  proposito: "Instala o corrige el directorio LDAP de aplicaciones (389 Directory Server)."
  cuando: "Instalación del data center."
  cambios: "Instancia, estructura de personas, grupos y servicios, y cuenta de lectura para Keycloak."
  riesgo: medio
  reversa: "Eliminar la instancia (manual)."
  resultado: "Directorio operativo."
"DC · midPoint":
  proposito: "Instala o actualiza midPoint, el gobierno de identidades."
  cuando: "Instalación del data center."
  cambios: "Contenedores de midPoint y PostgreSQL, y su publicación web."
  riesgo: medio
  reversa: "Detener los contenedores (manual)."
  resultado: "midPoint disponible en /midpoint/."
"DC · Keycloak":
  proposito: "Instala o corrige Keycloak, el login único del data center."
  cuando: "Instalación del data center."
  cambios: "Contenedor de Keycloak, realm invoke y federación con el directorio."
  riesgo: medio
  reversa: "Detener el contenedor (manual)."
  resultado: "Login único disponible en /sso/."
"DC · Configurar IGA":
  proposito: "Configura en midPoint la fuente de RRHH, los directorios destino, los roles por área y la reconciliación."
  cuando: "Instalación o cambios en el modelo de roles."
  cambios: "Sube recursos, roles y tareas a midPoint por su API."
  riesgo: medio
  reversa: "Volver a la versión anterior de los objetos en Git y reaplicar."
  resultado: "Altas, cambios y bajas de RRHH propagándose solos."
"DC · Construir identidad (Linux)":
  proposito: "Construye en orden toda la identidad del data center en Linux: base, directorio, IdM, midPoint, Keycloak e IGA."
  cuando: "Instalación inicial del data center."
  cambios: "Todo lo de cada paso, en secuencia."
  riesgo: alto
  reversa: "Por componente (ver cada automatización)."
  resultado: "Identidad del data center completa."
"DC · Satellite":
  proposito: "Instala Red Hat Satellite para gestionar registro, contenido y parches del parque."
  cuando: "Cuando el cliente cuenta con suscripción de Satellite."
  cambios: "Instala Satellite y carga el manifiesto de suscripciones."
  riesgo: medio
  reversa: "Desinstalar (manual)."
  resultado: "Satellite operativo."
"FaceOps · Habilitar servidor":
  proposito: "Crea servidores nuevos con el sistema operativo, la versión y los recursos que elijas, en el centro de datos o en la nube."
  flujo: "FaceOps lanza en AAP un workflow con aprobación. Al aprobarse, AAP crea las réplicas: on-premise en el KVM del Centro de datos Santiago (disco desde la imagen base + cloud-init; Windows con instalación desatendida) o en Cloud GCP (proyecto de la demo, etiquetadas demo=summit-cloud). Al terminar, FaceOps los da de alta en el inventario «Servidores habilitados» de AAP."
  faceops: "Eliges sistema, el segmento de negocio (aplicación) al que pertenecerá, dónde, cuántas réplicas, vCPU, memoria, disco y ambiente. El servidor nace vacío: el siguiente paso es habilitarle una skill (catálogo › Skills)."
  cuando: "Cuando un servicio necesita servidores nuevos."
  cambios: "Crea máquinas virtuales (en GCP, con costo mientras existan) y las agrega al inventario de AAP."
  riesgo: medio
  reversa: "Apagar el equipo vacío desde su detalle; la eliminación definitiva se hace aparte."
  resultado: "Servidores encendidos, con IP, en el inventario y listos para recibir skills."
