# Cliente de demostración: el ecosistema del stand (todas las demos). Se siembra una sola vez.
cliente:
  codigo: lab
  nombre: Invoke Lab
  descripcion: "Ecosistema de demos del stand Summit: nodos KVM, Data center 1, laboratorio de red y nube GCP"
  moneda: USD
  costo_hora: 40
  aap_url: https://127.0.0.1
clasificacion:
  _prioridad: [Servidores habilitados, Data center 1, Servidores de aplicación, Nodos demo, Servidores Windows, Nube GCP, Red · laboratorio, Drift · Servidores]
  _ignorar: [Demo Inventory, "FaceOps · Infraestructura"]
  # Mapa: redes (por prefijo de IP o por categoría), enlaces entre redes y flujos entre equipos (puerto · para qué)
  _topologia:
    redes:
      - {id: kvm, nombre: "Nodos KVM", prefijo: "192.168.122.", infra: "Centro de datos Santiago", detalle: "192.168.122.0/24 · libvirt"}
      - {id: dc1-srv, nombre: "DC1 · servidores", prefijo: "10.101.20.", infra: "Centro de datos Santiago", detalle: "10.101.20.0/24"}
      - {id: dc1-ges, nombre: "DC1 · gestión", prefijo: "10.101.10.", infra: "Centro de datos Santiago", detalle: "10.101.10.0/24"}
      - {id: dc1-dmz, nombre: "DC1 · DMZ", prefijo: "10.101.30.", infra: "Centro de datos Santiago", detalle: "10.101.30.0/24"}
      - {id: red-lab, nombre: "Laboratorio de red", categorias: [router, firewall, switch, "estación de trabajo"], infra: "Centro de datos Santiago", detalle: "containerlab · 172.20.20.0/24 y enlaces internos"}
      - {id: gcp, nombre: "Cloud GCP · default", prefijo: "34.", infra: "Cloud GCP", detalle: "proyecto invoke-summit-cloud"}
    centrales:
      - {id: aap, nombre: "AAP 2.7 · automatización", red: kvm, detalle: "controller · EDA · gestiona todo el parque"}
      - {id: anfitrion, nombre: "Anfitrión KVM", red: kvm, detalle: "192.168.122.1 · ruteo entre redes"}
    enlaces:
      - {desde: kvm, hacia: dc1-srv, via: "anfitrión KVM (ruteo)"}
      - {desde: dc1-srv, hacia: dc1-ges, via: "anfitrión KVM"}
      - {desde: dc1-srv, hacia: dc1-dmz, via: "anfitrión KVM"}
      - {desde: kvm, hacia: red-lab, via: "anfitrión KVM · containerlab"}
      - {desde: kvm, hacia: gcp, via: "Internet · solo IPs autorizadas"}
    flujos:
      - {desde: aap, hacia: "*", puerto: "ssh · winrm", texto: "AAP administra"}
      - {desde: nodo-nginx, hacia: nodo-jboss, puerto: 8080, texto: "balanceo app-jboss"}
      - {desde: nodo-nginx, hacia: nodo-jboss2, puerto: 8080, texto: "balanceo app-jboss"}
      - {desde: nodo-nginx, hacia: nodo-tomcat, puerto: 8080, texto: "Keycloak / apps de autoservicio"}
      - {desde: nodo-jboss, hacia: nodo-postgres, puerto: 5432, texto: "base de datos"}
      - {desde: nodo-jboss2, hacia: nodo-postgres, puerto: 5432, texto: "base de datos"}
      - {desde: nodo-jboss3, hacia: nodo-postgres, puerto: 5432, texto: "base de datos"}
      - {desde: nodo-jboss-qa, hacia: nodo-postgres, puerto: 5432, texto: "base de datos"}
      - {desde: nodo-jboss-dev, hacia: nodo-postgres, puerto: 5432, texto: "base de datos"}
      - {desde: nodo-jboss, hacia: nodo-tomcat, puerto: "61616 · 6379", texto: "colas (Artemis) y caché (Valkey)"}
      - {desde: nodo-jboss2, hacia: nodo-tomcat, puerto: "61616 · 6379", texto: "colas y caché"}
      - {desde: dc1-iga01, hacia: dc1-ad01, puerto: 636, texto: "midPoint aprovisiona (LDAPS)"}
      - {desde: dc1-iga01, hacia: dc1-ds01, puerto: 636, texto: "midPoint aprovisiona"}
      - {desde: dc1-iga01, hacia: dc1-idm01, puerto: 636, texto: "midPoint aprovisiona"}
      - {desde: dc1-sso01, hacia: dc1-ds01, puerto: 389, texto: "Keycloak lee el directorio"}
      - {desde: rtr, hacia: fw, puerto: "BGP", texto: "borde → firewall"}
      - {desde: fw, hacia: pc-usuario, puerto: "LAN", texto: "red de usuarios"}
      - {desde: rtr, hacia: suc1, puerto: "BGP", texto: "sucursal"}
      - {desde: rtr, hacia: suc2, puerto: "BGP", texto: "sucursal"}
      - {desde: rtr, hacia: suc3, puerto: "BGP", texto: "sucursal"}
  Data center 1: {proveedor: kvm, ubicacion: Centro de datos Santiago, ambiente: produccion}
  Servidores de aplicación: {proveedor: kvm, ubicacion: Centro de datos Santiago, ambiente: produccion}
  Nodos demo: {proveedor: kvm, ubicacion: Centro de datos Santiago, ambiente: produccion}
  Servidores Windows: {proveedor: kvm, ubicacion: Centro de datos Santiago, ambiente: produccion}
  Drift · Servidores: {proveedor: kvm, ubicacion: Centro de datos Santiago, ambiente: produccion}
  Nube GCP: {proveedor: gcp, ubicacion: Cloud GCP, ambiente: produccion}
  Servidores habilitados: {proveedor: kvm, ubicacion: Centro de datos Santiago, ambiente: desarrollo, forma: virtual}
  Red · laboratorio: {proveedor: containerlab, ubicacion: Centro de datos Santiago, ambiente: produccion, sin_recoleccion: true, forma: virtual}
  _equipos:
    nodo-so: {ambiente: qa}
    nodo-jboss-qa: {ambiente: qa}
    nodo-jboss-dev: {ambiente: desarrollo}
    rtr: {categoria: router, so: FRRouting}
    suc1: {categoria: router, so: FRRouting}
    suc2: {categoria: router, so: FRRouting}
    suc3: {categoria: router, so: FRRouting}
    fw: {categoria: firewall, so: VyOS}
    fgt: {categoria: firewall, so: FortiOS}
    pc-usuario: {categoria: estación de trabajo, so: Linux (contenedor de pruebas)}
recoleccion:
  _plantilla: "FaceOps · Recolectar inventario"
  Nodos demo: [{credencial: "Nodos demo (ansible)"}]
  Servidores Windows: [{credencial: "Windows · ansible (WinRM)"}]
  Servidores habilitados:
    - {limite: linux_onpremise, credencial: "Nodos demo (ansible)"}
    - {limite: linux_gcp, credencial: "Nube · ssh (ansible)"}
  Data center 1:
    - {limite: dc1_linux, credencial: "DC · SSH ansible"}
    - {limite: dc1_windows, credencial: "DC1 · Windows ansible"}
# Segmentos de negocio: normalmente una aplicación con todos sus componentes (servidor de aplicaciones, Nginx, base de datos,
# colas…); en redes, la agrupación que corresponda. Técnicamente compatibles: todos sus equipos tienen el MISMO sistema
# (sistema: linux | windows | red). Un equipo puede estar en varios.
# La infraestructura (ubicación) y el ambiente son columnas propias del equipo, no segmentos.
segmentos:
  - {nombre: App de pagos, tipo: negocio, sistema: linux, orden: 1, regla: {nombre: [nodo-jboss, nodo-jboss2, nodo-nginx, nodo-postgres, nodo-tomcat, nodo-jboss-qa, nodo-jboss-dev]}, descripcion: "Aplicación app-jboss: JBoss, balanceo Nginx, PostgreSQL, colas y caché"}
  - {nombre: Portal de clientes, tipo: negocio, sistema: linux, orden: 2, regla: {nombre: [nodo-jboss3, nodo-postgres]}, descripcion: "Aplicación de autoatención de clientes: JBoss y su base de datos"}
  - {nombre: Gobierno de identidades, tipo: negocio, orden: 3, regla: {inventarios: [Data center 1]}, descripcion: "midPoint, Active Directory, Directory Server, Red Hat IdM y Keycloak, y cómo se comunican"}
  - {nombre: Autoservicio de desarrollo, tipo: negocio, sistema: linux, orden: 5, regla: {nombre: [nodo-tomcat, nodo-nginx]}, descripcion: "Ambientes que piden los desarrolladores (servidor de apps + Nginx)"}
  - {nombre: Sitio web corporativo, tipo: negocio, sistema: windows, orden: 6, regla: {nombre: [nodo-windows]}, descripcion: "Sitio en IIS (Windows)"}
  - {nombre: Servidores corporativos, tipo: negocio, sistema: linux, orden: 7, regla: {nombre: [nodo-so]}, descripcion: "Servidores de uso general bajo control de cumplimiento"}
  - {nombre: Red corporativa, tipo: negocio, sistema: red, orden: 8, regla: {nombre: [rtr, fw, fgt, pc-usuario, suc1, suc2, suc3]}, descripcion: "Router, firewalls y sucursales"}
  - {nombre: Servicios en la nube, tipo: negocio, sistema: linux, orden: 9, regla: {inventarios: [Nube GCP]}, descripcion: "VMs del Managed Service en Google Cloud"}
usuarios:
  - {usuario: ms.operador, nombre: "Operador Managed Service", perfiles: [{segmentos: [App de pagos, Gobierno de identidades, Portal de clientes, Autoservicio de desarrollo, Servidores corporativos], ambientes: [produccion, qa, desarrollo], modo: escritura, aprobador: 0}]}
  - {usuario: ms.lector, nombre: "Analista (solo lectura)", perfiles: [{segmentos: ["*"], modo: lectura, aprobador: 0}]}
  - {usuario: ms.lider, nombre: "Líder de Managed Service", perfiles: [{segmentos: ["*"], modo: escritura, aprobador: 1}]}
