       ayuda: "evaluar: solo lectura, informe en Git · migrar: transforma a Jakarta EE 10, crea los datasources y despliega en el destino (el origen no se toca)"}
    - {var: mj_destino, etiqueta: "Servidor de destino (JBoss EAP 8)", tipo: jboss_destino, ayuda: "Donde quedará la aplicación migrada"}
