  usa_limite: true
  campos:
    - {var: tz_modo, etiqueta: "Qué hacer", tipo: multiplechoice, defecto: verificar, opciones: [verificar, aplicar], ayuda: "verificar: solo informa la hora, la zona y los próximos cambios que conoce cada equipo · aplicar: actualiza y ajusta"}
    - {var: tz_zona, etiqueta: "Zona horaria", tipo: multiplechoice, defecto: America/Santiago, opciones: [America/Santiago, America/Mexico_City, America/Bogota, America/Lima, America/Argentina/Buenos_Aires, America/Santo_Domingo, America/El_Salvador, America/Puerto_Rico, UTC]}
    - {var: tz_reiniciar, etiqueta: "Servicios a reiniciar si están corriendo", tipo: text, defecto: crond, ayuda: "Separados por coma (p. ej. crond, eap8-standalone)"}
    - {var: tz_regla, etiqueta: "Regla del decreto (formato zic, opcional)", tipo: text, ayuda: "Solo si el gobierno cambió la regla y Red Hat aún no publica tzdata: se carga como regla temporal"}
"Certificados · Emitir para servicio":
  por_inventario: true
  usa_limite: true
  campos:
    - {var: cert_nombre, etiqueta: "Servicio", tipo: text, defecto: kafka, ayuda: "Nombre corto (minúsculas y guiones): queda en /etc/pki/faceops/<servicio>/"}
    - {var: cert_formato, etiqueta: "Formato", tipo: multiplechoice, defecto: pkcs12, opciones: [pkcs12, pem], ayuda: "pkcs12: keystore.p12 para Kafka/Java (su clave en keystore.properties) · pem: servidor.crt + servidor.key (nginx, Apache, Postgres)"}
    - {var: cert_san, etiqueta: "Nombres adicionales", tipo: text, ayuda: "Separados por coma (además del nombre del equipo y su IP)"}
    - {var: cert_recargar, etiqueta: "Comando para recargar el servicio", tipo: text, defecto: "systemctl restart kafka", ayuda: "Se ejecuta después de instalar el certificado"}
    - {var: cert_puerto, etiqueta: "Puerto TLS a verificar", tipo: integer, defecto: 9093, ayuda: "FaceOps comprueba que el servicio ya entrega el certificado nuevo (0 = no verificar)"}
    - {var: cert_propietario, etiqueta: "Dueño de los archivos", tipo: text, defecto: root, ayuda: "usuario o usuario:grupo con que corre el servicio"}
"Certificados · Renovar por vencer":
