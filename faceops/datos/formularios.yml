"FaceOps · Habilitar servidor":
  campos:
    - {var: hab_so, etiqueta: "Sistema operativo y versión", tipo: multiplechoice, requerido: true, defecto: rhel9,
       opciones: [rhel10, rhel9, rhel8, rhel7, rhel6, rhel5, rocky9, ubuntu2404, windows2022],
       ayuda: "RHEL 10, 9, 8, 7, 6 o 5 · Rocky Linux 9 (origen para convertir a RHEL) · Ubuntu 24.04 LTS · Windows Server 2022. RHEL 7, 6 y 5 están fuera de soporte (para pruebas de migración): RHEL 6 y 5 solo on-premise y sin automatizaciones de Ansible (Python antiguo)"}
    - {var: hab_infraestructura, etiqueta: "Infraestructura donde se crea", tipo: infraestructura, requerido: true,
       ayuda: "La máquina nace sin segmento de negocio: queda huérfana hasta que la asignes a uno en el mapa"}
    - {var: hab_nombre, etiqueta: "Nombre base", tipo: text, requerido: true, ayuda: "Se numeran solos: srv-<nombre>-01, -02… (3 a 20 letras minúsculas, números o guiones)"}
    - {var: hab_replicas, etiqueta: "Réplicas", tipo: multiplechoice, requerido: true, defecto: "1", opciones: ["1", "2", "3", "4", "5"], ayuda: "Cuántos servidores iguales (en GCP hasta 3)"}
    - {var: hab_cpu, etiqueta: "vCPU por servidor", tipo: multiplechoice, requerido: true, defecto: "1", opciones: ["1", "2", "4", "8"]}
    - {var: hab_ram_gb, etiqueta: "Memoria por servidor (GB)", tipo: multiplechoice, requerido: true, defecto: "2", opciones: ["2", "4", "8", "16", "32"], ayuda: "Por defecto lo mínimo; se sube caso a caso. Windows: mínimo 4 GB"}
    - {var: hab_disco_gb, etiqueta: "Disco por servidor (GB)", tipo: multiplechoice, requerido: true, defecto: "40", opciones: ["20", "40", "80", "160"], ayuda: "Windows: mínimo 40 GB"}
    - {var: hab_ambiente, etiqueta: "Ambiente", tipo: multiplechoice, requerido: true, defecto: desarrollo, opciones: [desarrollo, qa, produccion]}
    - {var: hab_rh_org, etiqueta: "Red Hat · Organización (org ID)", tipo: text, ayuda: "RHEL 7, 8, 9 y 10 on-premise: la máquina se registra en Red Hat al nacer y queda regularizada", enlace: {texto: "¿Dónde veo mi org ID?", url: "https://console.redhat.com/insights/connector/activation-keys"}}
    - {var: hab_rh_llave, etiqueta: "Red Hat · Clave de activación", tipo: password, ayuda: "Activation key de console.redhat.com (obligatoria para RHEL 7 a 10 on-premise; no se muestra ni se guarda en el ticket)", enlace: {texto: "Crear la clave de activación", url: "https://console.redhat.com/insights/connector/activation-keys"}}
