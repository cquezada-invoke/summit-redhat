    - {var: inc_usuario, etiqueta: "Usuario de servicio", tipo: text, defecto: faceops, ayuda: "Se crea en cada máquina Linux con sudo; su llave privada se genera en FaceOps y queda solo en la credencial cifrada de AAP"}
