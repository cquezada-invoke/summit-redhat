    - {var: iv_vip_api, etiqueta: "VIP de la API", tipo: text, requerido: true, defecto: "192.168.122.60"}
    - {var: iv_vip_ingress, etiqueta: "VIP de Ingress", tipo: text, requerido: true, defecto: "192.168.122.61"}
    - {var: iv_datacenter, etiqueta: "Datacenter de vSphere", tipo: text, defecto: Santiago}
    - {var: iv_cluster_vsphere, etiqueta: "Clúster de vSphere", tipo: text, defecto: Produccion}
    - {var: iv_datastore, etiqueta: "Datastore", tipo: text, defecto: LocalDS_0}
    - {var: iv_red_vsphere, etiqueta: "Port group", tipo: text, defecto: "VM Network"}
    - {var: iv_crear_dns, etiqueta: "Crear los registros DNS (laboratorio)", tipo: multiplechoice, defecto: "si", opciones: ["si", "no"], ayuda: "Solo en la red del laboratorio; en un cliente los crea su equipo de DNS"}
"OpenShift · Validar e instalar IPI VMware":
