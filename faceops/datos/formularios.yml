    - {var: iv_modo, etiqueta: "Qué hacer", tipo: multiplechoice, requerido: true, defecto: validar, opciones: [validar, instalar], ayuda: "validar: revalida y pasa el install-config por openshift-install sin crear nada · instalar: crea el clúster"}
"FaceOps · Incorporar máquinas":
