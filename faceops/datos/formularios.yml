    - {var: cert_formato, etiqueta: "Formato", tipo: multiplechoice, defecto: pkcs12, opciones: [pkcs12, pem], ayuda: "pkcs12: keystore.p12 para Kafka/Java (su clave en keystore.properties) · pem: servidor.crt + servidor.key (nginx, Apache, Postgres)"}
    - {var: cert_san, etiqueta: "Nombres adicionales", tipo: text, ayuda: "Separados por coma (además del nombre del equipo y su IP)"}
    - {var: cert_recargar, etiqueta: "Comando para recargar el servicio", tipo: text, defecto: "systemctl restart kafka", ayuda: "Se ejecuta después de instalar el certificado"}
    - {var: cert_puerto, etiqueta: "Puerto TLS a verificar", tipo: integer, defecto: 9093, ayuda: "FaceOps comprueba que el servicio ya entrega el certificado nuevo (0 = no verificar)"}
    - {var: cert_propietario, etiqueta: "Dueño de los archivos", tipo: text, defecto: root, ayuda: "usuario o usuario:grupo con que corre el servicio"}
