    - {var: mig_snapshot, etiqueta: "Snapshot antes de migrar", tipo: multiplechoice, defecto: kvm, opciones: [kvm, "no"], ayuda: "kvm: snapshot en el anfitrión y vuelta atrás automática si algo falla"}
    - {var: mig_repo_rhel7, etiqueta: "Repositorio de RHEL 7.9 (solo saltos 6 → 7)", tipo: text, ayuda: "URL del repositorio RHEL 7.9 Server (CDN o Satellite)"}
