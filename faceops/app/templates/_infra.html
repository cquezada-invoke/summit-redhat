{# Logos sencillos de cada proveedor de infraestructura #}
{% macro logo(t, tam=34) %}<svg viewBox="0 0 40 40" width="{{ tam }}" height="{{ tam }}" aria-hidden="true">
{% if t == 'gcp' %}<rect width="40" height="40" rx="8" fill="#fff" stroke="#d2d2d2"/><path d="M14 27h13a6 6 0 0 0 .5-12A8 8 0 0 0 12.6 18 5 5 0 0 0 14 27z" fill="none" stroke="#4285f4" stroke-width="2.6"/><path d="M12.6 18A5 5 0 0 0 14 27h4" fill="none" stroke="#34a853" stroke-width="2.6"/><path d="M27.5 15A8 8 0 0 0 16 13" fill="none" stroke="#ea4335" stroke-width="2.6"/><path d="M27 27a6 6 0 0 0 5.2-8" fill="none" stroke="#fbbc04" stroke-width="2.6"/>
{% elif t == 'aws' %}<rect width="40" height="40" rx="8" fill="#232f3e"/><text x="20" y="21" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="11" fill="#fff">aws</text><path d="M10 26q10 5 20 0" fill="none" stroke="#ff9900" stroke-width="2.4" stroke-linecap="round"/><path d="M27 24.5l3.2 1.3-1 3" fill="none" stroke="#ff9900" stroke-width="2" stroke-linecap="round"/>
{% elif t == 'azure' %}<rect width="40" height="40" rx="8" fill="#fff" stroke="#d2d2d2"/><path d="M17 9h7l-9 22H8z" fill="#0078d4"/><path d="M24 9l9 22H17l9-4-6-7z" fill="#50a0e8"/>
{% elif t == 'vmware' %}<rect width="40" height="40" rx="8" fill="#717074"/><text x="20" y="24" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="9" fill="#fff">vm</text>
{% elif t == 'fisico' %}<rect width="40" height="40" rx="8" fill="#f2f0fc" stroke="#5e40be"/><rect x="9" y="8" width="22" height="24" rx="2" fill="#fff" stroke="#5e40be" stroke-width="1.6"/><path d="M12 13h16M12 18h16M12 23h16" stroke="#5e40be" stroke-width="1.6"/><circle cx="27" cy="28" r="1.4" fill="#3e8635"/>
{% elif t == 'kvm' %}<rect width="40" height="40" rx="8" fill="#e7f1fa" stroke="#0066cc"/><rect x="10" y="9" width="20" height="6" rx="1" fill="#fff" stroke="#0066cc" stroke-width="1.6"/><rect x="10" y="17" width="20" height="6" rx="1" fill="#fff" stroke="#0066cc" stroke-width="1.6"/><rect x="10" y="25" width="20" height="6" rx="1" fill="#fff" stroke="#0066cc" stroke-width="1.6"/><circle cx="26" cy="12" r="1.2" fill="#3e8635"/><circle cx="26" cy="20" r="1.2" fill="#3e8635"/><circle cx="26" cy="28" r="1.2" fill="#3e8635"/>
{% else %}<rect width="40" height="40" rx="8" fill="#f0f0f0" stroke="#6a6e73"/><circle cx="20" cy="20" r="8" fill="none" stroke="#6a6e73" stroke-width="2"/>{% endif %}
</svg>{% endmacro %}
