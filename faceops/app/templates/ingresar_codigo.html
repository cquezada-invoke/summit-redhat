{% extends "base.html" %}{% block titulo %}Código de verificación{% endblock %}
{% block cuerpo %}{% include "_login_fondo.html" %}
<div class="login">
  <p class="sub">Escribe el código de 6 dígitos de tu aplicación de autenticación.</p>
  <form method="post" class="card f">
    <div style="text-align:center;margin:0 0 10px"><span style="display:inline-block;background:#fff;border-radius:12px;padding:10px 16px;box-shadow:0 2px 10px rgba(0,0,0,.25)"><img src="{{ url_for('static', filename='logo-faceops.png') }}" alt="FaceOps" width="120" height="113" style="display:block;height:auto"></span></div><input type="hidden" name="_csrf" value="{{ csrf }}">
    <label>Código<input type="text" name="codigo" inputmode="numeric" pattern="[0-9 ]{6,7}" maxlength="7" autocomplete="one-time-code" autofocus required style="font-size:22px;letter-spacing:6px;text-align:center"></label>
    <p><button class="btn" style="width:100%;margin-top:8px">Verificar</button></p>
    <p class="sub" style="text-align:center"><a class="login-olvido" href="{{ url_for('consola.salir') }}">Volver</a></p>
  </form>
</div>
{% endblock %}
