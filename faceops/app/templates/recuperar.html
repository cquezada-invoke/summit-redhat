{% extends "base.html" %}{% block titulo %}Recuperar clave{% endblock %}
{% block cuerpo %}{% include "_login_fondo.html" %}
<div class="login">
  <form method="post" class="card f"><input type="hidden" name="_csrf" value="{{ csrf }}">
    <div style="text-align:center;margin:0 0 10px"><span style="display:inline-block;background:#fff;border-radius:12px;padding:10px 16px;box-shadow:0 2px 10px rgba(0,0,0,.25)"><img src="{{ url_for('static', filename='logo-faceops.png') }}" alt="FaceOps" width="120" height="113" style="display:block;height:auto"></span></div>
    <p class="sub" style="margin:0 0 6px">Recuperar clave</p>
    <p style="font-size:13.5px;margin:0 0 8px;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.6)">Te enviaremos al correo registrado un enlace de un solo uso para definir una clave nueva. Tu doble factor no cambia.</p>
    <label>Usuario o correo<input type="text" name="dato" autofocus autocomplete="username" required></label>
    <p><button class="btn" style="width:100%;margin-top:8px">Enviar enlace</button></p>
    <p style="text-align:center;font-size:13px;margin:4px 0 0"><a class="login-olvido" href="{{ url_for('consola.ingresar') }}">Volver a ingresar</a></p>
  </form>
</div>
{% endblock %}
