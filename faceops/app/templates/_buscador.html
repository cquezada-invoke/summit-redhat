{# Buscador de la lista: filtra al escribir las filas de las tablas y las tarjetas (data-texto) marcadas con data-buscable #}
{% macro buscador(ph='Buscar en la lista…') %}<div class="busca-autos"><input name="q" type="search" placeholder="{{ ph }}" autocomplete="off" aria-label="Buscar"
 oninput="const v=this.value.toLowerCase().trim();document.querySelectorAll('[data-buscable] tr').forEach(r=>{if(!r.querySelector('td'))return;r.style.display=!v||r.textContent.toLowerCase().includes(v)?'':'none'});let h=0,n=0;document.querySelectorAll('[data-buscable]>[data-texto]').forEach(t=>{h++;const ok=!v||t.dataset.texto.includes(v);t.style.display=ok?'':'none';if(ok)n++});document.querySelectorAll('.busca-vacio').forEach(x=>x.hidden=!(h&&!n))"></div>{% endmacro %}
