# Catálogo de alertas por objeto (FaceOps · botón «Alertas» de cada equipo). La configuración de cada equipo vive en Ansible:
# «Monitoreo · Configurar alertas del equipo» la escribe en Prometheus (reglas y objetivos) y Alertmanager la entrega a EDA.
# FaceOps solo lee este catálogo para ofrecer las alertas que aplican a cada tipo de objeto.
# ambito: maquina (por defecto: la máquina y su sistema operativo, campana de la ficha) o plataforma:<familia> (jboss, nginx,
#   redis, keycloak, postgresql…: campana de la tarjeta de esa plataforma). Cada ámbito tiene su propio grupo de reglas en
#   Prometheus (faceops-<equipo> / faceops-<equipo>--<familia>), su ticket y su tablero de Grafana.
# Todas las alertas se pueden activar; lo que se bloquea es la ACCIÓN: en el selector, las acciones cuya automatización no
# existe o no está certificada (regla de prueba) aparecen deshabilitadas con su motivo y la alerta queda en «Solo avisar».
# Las del clúster OpenShift se cargan juntas en su monitoreo (PrometheusRule) con «Monitoreo · Grafana de OpenShift».
# pendiente: alerta que aún no se puede medir en el lab (falta su exportador); FaceOps la muestra deshabilitada con el motivo.
#   __EQ__     → nombre del equipo (etiqueta faceops_equipo de sus métricas)
#   __UMBRAL__ → umbral de aviso o crítico (una regla por severidad)
tipos:
  linux:   {nombre: "Servidor Linux", fuente: "node_exporter (:9100)", puerto: 9100, job: faceops-equipos}
  windows: {nombre: "Servidor Windows", fuente: "windows_exporter (:9182)", puerto: 9182, job: faceops-equipos}
  storage: {nombre: "Almacenamiento", fuente: "node_exporter (:9100)", puerto: 9100, job: faceops-equipos}
  openshift: {nombre: "Clúster OpenShift", fuente: "monitoreo del propio clúster (Prometheus/Thanos de openshift-monitoring; se aplicarían como PrometheusRule con «OpenShift · Modelo de alertamiento»)", puerto: 6443, job: ""}
  segmento: {nombre: "Segmento de negocio", fuente: "sondas blackbox_exporter (:9115): HTTP al VIP por el balanceador y TCP a sus nodos y componentes", puerto: 9115, job: faceops-segmentos}
  red:     {nombre: "Equipo de red", fuente: "sondeo TCP del puerto de administración (blackbox)", puerto: 22, job: faceops-sondeo}
  # Hipervisores (campana de su ficha /hipervisores/<id>): el objeto es el hipervisor; sus métricas vienen de su anfitrión o de su exportador
  kvm:     {nombre: "Hipervisor KVM", fuente: "node_exporter del anfitrión (:9100, con systemd)", puerto: 9100, job: faceops-equipos}
  vmware:  {nombre: "VMware vSphere", fuente: "vmware_exporter apuntando al vCenter (:9272)", puerto: 9272, job: faceops-equipos}
# Acciones: lo que la automatización hará cuando la alerta se dispare (se elige una por alerta en el flotante). «avisar»
# solo registra el evento en Event-Driven Ansible; las demás piden la automatización indicada, siempre con aprobación.
acciones:
  avisar: {texto: "Solo avisar (queda en Event-Driven Ansible)"}
  # informe: true → al terminar, FaceOps envía el resultado por correo al responsable de la máquina (app/alerta_diagnostico.py)
  diagnosticar: {texto: "Diagnóstico automático de solo lectura", auto: "Incidentes · Verificar error conocido", vars: {}, informe: true}
  encender: {texto: "Encender el equipo (con aprobación)", auto: "Infra · Encender o apagar equipo", vars: {en_equipo: __EQ__, en_accion: encender}, sin_limite: true}
  limpiar_logs: {texto: "Limpiar logs antiguos (con aprobación)", auto: "Remediación · Limpiar logs", vars: {}}
  reiniciar_iis: {texto: "Levantar IIS (con aprobación)", auto: "Remediación · IIS en Windows", vars: {}}
  # Las que necesitan un dato (tamaño, servicio, zona) abren la aprobación con la propuesta y quien aprueba la completa en FaceOps
  recursos: {texto: "Ajustar CPU y memoria (propuesta con aprobación)", auto: "Infra · Ajustar recursos de máquinas", pide_datos: "vCPU y memoria nuevas"}
  ampliar_disco: {texto: "Ampliar el disco (propuesta con aprobación)", auto: "FaceOps · Ampliar disco", pide_datos: "disco y tamaño nuevo"}
  ampliar_volumen: {texto: "Ampliar el volumen de storage (propuesta con aprobación)", auto: "Storage · Ampliar volumen", pide_datos: "volumen y tamaño nuevo"}
  reiniciar_servicio: {texto: "Reiniciar el servicio afectado (propuesta con aprobación)", auto: "Plataforma · Controlar servicio", pide_datos: "servicio a reiniciar"}
  # acceso: equipo → la automatización entra a la máquina: el inventario y la credencial de AAP del equipo (los mismos que usa FaceOps)
  # viajan en la regla de la alerta y el workflow de aprobación se arma con ellos (uno por credencial)
  reiniciar_jboss: {texto: "Reiniciar JBoss (con aprobación)", auto: "Plataforma · Controlar servicio", acceso: equipo,
                    vars: {sp_unidades: [eap8-standalone, eap7-standalone, jboss-eap, jboss, wildfly], sp_accion: reiniciar, sp_plataforma: JBoss}}
  hora: {texto: "Corregir la hora (propuesta con aprobación)", auto: "Sistema · Cambio de hora del país", pide_datos: "zona horaria"}
  # Seguridad
  escanear: {texto: "Escaneo de seguridad del servidor (solo lectura, con aprobación)", auto: "Seguridad · Escaneo de servidores", acceso: equipo, vars: {}, informe: true}
  remediar_ocp: {texto: "Remediar en OpenShift (pod, escala, volumen o nodo; propuesta con aprobación)", auto: "OpenShift · Remediar alerta", pide_datos: "namespace y recurso afectado"}
  bloquear_ip: {texto: "Bloquear la IP de origen (propuesta con aprobación)", auto: "Red · Bloquear IP", pide_datos: "IP de origen a bloquear"}
alertas:
  # ───────── Servidores Linux y storage ─────────
  - {id: D01, tipos: [linux, windows, storage], grupo: Disponibilidad, nombre: "Sin respuesta", acciones: [avisar, encender, diagnosticar],
     descripcion: "Prometheus no logra leer las métricas del equipo (apagado, colgado o sin red)",
     expr: 'up{job="faceops-equipos",faceops_equipo="__EQ__"} == 0', umbral: false, severidad: critico, para: 2m}
  # requiere: la alerta se ofrece solo si el inventario de FaceOps detectó esa plataforma en el equipo (datos.<requiere>)
  - {id: D04, tipos: [linux, storage], grupo: Disponibilidad, nombre: "Reinicio inesperado", acciones: [avisar, diagnosticar],
     descripcion: "El equipo arrancó hace menos de 10 minutos",
     expr: '(time() - node_boot_time_seconds{faceops_equipo="__EQ__"}) < 600', umbral: false, severidad: aviso, para: 0m}
  - {id: C01, tipos: [linux, storage], grupo: Capacidad, nombre: "CPU alta", unidad: "%", acciones: [avisar, recursos, diagnosticar],
     descripcion: "Uso de CPU promedio de los últimos 2 minutos",
     expr: '100 - avg by (faceops_equipo) (rate(node_cpu_seconds_total{mode="idle",faceops_equipo="__EQ__"}[2m])) * 100 > __UMBRAL__', aviso: 80, critico: 95, para: 10m}
  - {id: C02, tipos: [linux, storage], grupo: Capacidad, nombre: "Memoria alta", unidad: "%", acciones: [avisar, recursos, reiniciar_servicio],
     descripcion: "Memoria en uso (descuenta caché y buffers)",
     expr: '100 * (1 - node_memory_MemAvailable_bytes{faceops_equipo="__EQ__"} / node_memory_MemTotal_bytes{faceops_equipo="__EQ__"}) > __UMBRAL__', aviso: 85, critico: 95, para: 10m}
  - {id: C03, tipos: [linux, storage], grupo: Capacidad, nombre: "Disco lleno", unidad: "%", acciones: [avisar, limpiar_logs, ampliar_disco, ampliar_volumen],
     descripcion: "Cualquier sistema de archivos (sin tmpfs ni overlay) sobre el umbral",
     expr: 'max by (faceops_equipo, mountpoint) (100 - 100 * node_filesystem_avail_bytes{faceops_equipo="__EQ__",fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{faceops_equipo="__EQ__",fstype!~"tmpfs|overlay|squashfs"}) > __UMBRAL__', aviso: 80, critico: 90, para: 5m}
  - {id: C04, tipos: [linux, storage], grupo: Capacidad, nombre: "Disco se llenará en 24 h", acciones: [avisar, limpiar_logs, ampliar_disco],
     descripcion: "Tendencia de las últimas 6 horas: el espacio libre llega a cero dentro de un día",
     expr: 'predict_linear(node_filesystem_avail_bytes{faceops_equipo="__EQ__",fstype!~"tmpfs|overlay|squashfs"}[6h], 86400) < 0', umbral: false, severidad: aviso, para: 30m}
  - {id: C05, tipos: [linux, storage], grupo: Capacidad, nombre: "Inodos agotándose", unidad: "%", acciones: [avisar, limpiar_logs],
     descripcion: "Inodos usados en algún sistema de archivos",
     expr: 'max by (faceops_equipo, mountpoint) (100 - 100 * node_filesystem_files_free{faceops_equipo="__EQ__",fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_files{faceops_equipo="__EQ__",fstype!~"tmpfs|overlay|squashfs"}) > __UMBRAL__', aviso: 80, critico: 90, para: 10m}
  - {id: C06, tipos: [linux, storage], grupo: Capacidad, nombre: "Carga del sistema alta", unidad: "× CPU", acciones: [avisar, recursos, diagnosticar],
     descripcion: "Carga promedio de 15 minutos por CPU",
     expr: 'node_load15{faceops_equipo="__EQ__"} / count by (faceops_equipo) (node_cpu_seconds_total{mode="idle",faceops_equipo="__EQ__"}) > __UMBRAL__', aviso: 1.5, critico: 3, para: 15m}
  - {id: C07, tipos: [linux, storage], grupo: Capacidad, nombre: "Swap en uso", unidad: "%", acciones: [avisar, recursos],
     descripcion: "Uso de la memoria de intercambio",
     expr: '100 * (1 - node_memory_SwapFree_bytes{faceops_equipo="__EQ__"} / node_memory_SwapTotal_bytes{faceops_equipo="__EQ__"} > 0) > __UMBRAL__', aviso: 50, critico: 80, para: 15m}
  - {id: C08, tipos: [storage], grupo: Capacidad, nombre: "Disco saturado", unidad: "%", acciones: [avisar, ampliar_volumen, diagnosticar],
     descripcion: "Tiempo que algún disco pasa ocupado atendiendo E/S (latencia del almacenamiento)",
     expr: 'max by (faceops_equipo, device) (rate(node_disk_io_time_seconds_total{faceops_equipo="__EQ__"}[5m])) * 100 > __UMBRAL__', aviso: 80, critico: 95, para: 10m}
  - {id: O01, tipos: [linux, storage], grupo: Operación, nombre: "Hora desfasada", unidad: s, acciones: [avisar, hora],
     descripcion: "Desfase del reloj respecto de NTP (afecta certificados, Kerberos y registros)",
     expr: 'abs(node_timex_offset_seconds{faceops_equipo="__EQ__"}) > __UMBRAL__', aviso: 0.5, critico: 2, para: 10m}
  - {id: O02, tipos: [linux, storage], grupo: Operación, nombre: "Errores de red", unidad: "por s", acciones: [avisar, diagnosticar],
     descripcion: "Errores de recepción o transmisión en alguna interfaz",
     expr: 'max by (faceops_equipo, device) (rate(node_network_receive_errs_total{faceops_equipo="__EQ__"}[5m]) + rate(node_network_transmit_errs_total{faceops_equipo="__EQ__"}[5m])) > __UMBRAL__', aviso: 1, critico: 10, para: 10m}
  # ───────── Seguridad (Linux) · métricas de seguridad del agente de monitoreo (textfile faceops-seguridad.prom, cada minuto)
  - {id: S01, tipos: [linux, storage], grupo: Seguridad, nombre: "Fuerza bruta por SSH", unidad: "intentos en 5 min", acciones: [avisar, diagnosticar, escanear, bloquear_ip],
     descripcion: "Intentos de ingreso por SSH fallidos (clave errada, usuario inexistente) en los últimos 5 minutos",
     expr: 'faceops_seg_ssh_fallidos_5m{faceops_equipo="__EQ__"} > __UMBRAL__', aviso: 5, critico: 20, para: 0m}
  - {id: S02, tipos: [linux, storage], grupo: Seguridad, nombre: "Cuenta bloqueada por intentos fallidos", acciones: [avisar, diagnosticar],
     descripcion: "Alguna cuenta quedó bloqueada por faillock (desbloquearla aún no tiene acción automática: faillock --user <cuenta> --reset)",
     expr: 'faceops_seg_cuentas_bloqueadas{faceops_equipo="__EQ__"} > 0', umbral: false, severidad: aviso, para: 0m}
  - {id: S03, tipos: [linux, storage], grupo: Seguridad, nombre: "Ingreso de root por SSH", acciones: [avisar, diagnosticar, escanear],
     descripcion: "Se aceptó un ingreso SSH directo como root en los últimos 5 minutos",
     expr: 'faceops_seg_root_login_5m{faceops_equipo="__EQ__"} > 0', umbral: false, severidad: aviso, para: 0m}
  - {id: S04, tipos: [linux, storage], grupo: Seguridad, nombre: "Archivo crítico modificado", acciones: [avisar, diagnosticar, escanear],
     descripcion: "Cambió /etc/passwd, /etc/shadow, /etc/group o la configuración de sudo (huella del archivo) en los últimos 10 minutos",
     expr: 'changes(faceops_seg_archivo_huella{faceops_equipo="__EQ__"}[10m]) > 0', umbral: false, severidad: critico, para: 0m}
  - {id: S05, tipos: [linux, storage], grupo: Seguridad, nombre: "SELinux no está en modo Enforcing", acciones: [avisar, escanear],
     descripcion: "SELinux quedó permisivo o deshabilitado (2 = Enforcing, 1 = Permissive, 0 = Disabled)",
     expr: 'faceops_seg_selinux_modo{faceops_equipo="__EQ__"} < 2', umbral: false, severidad: critico, para: 5m}
  - {id: S06, tipos: [linux, storage], grupo: Seguridad, nombre: "firewalld detenido", acciones: [avisar, diagnosticar, reiniciar_servicio],
     descripcion: "El firewall del sistema (firewalld) no está activo",
     expr: 'max by (faceops_equipo) (node_systemd_unit_state{faceops_equipo="__EQ__",name="firewalld.service",state="active"}) == 0', umbral: false, severidad: critico, para: 2m}
  - {id: S07, tipos: [linux, storage], grupo: Seguridad, nombre: "Auditoría (auditd) detenida", acciones: [avisar, diagnosticar, reiniciar_servicio],
     descripcion: "El servicio de auditoría del sistema (auditd) no está activo: no quedan registros de auditoría",
     expr: 'max by (faceops_equipo) (node_systemd_unit_state{faceops_equipo="__EQ__",name="auditd.service",state="active"}) == 0', umbral: false, severidad: critico, para: 2m}
  # ───────── Bloqueos (Linux) · node_exporter
  - {id: B01, tipos: [linux, storage], grupo: Bloqueos, nombre: "Procesos bloqueados (estado D)", unidad: "procesos", acciones: [avisar, diagnosticar],
     descripcion: "Procesos esperando E/S sin poder interrumpirse (disco, NFS o almacenamiento lento)",
     expr: 'node_procs_blocked{faceops_equipo="__EQ__"} > __UMBRAL__', aviso: 5, critico: 20, para: 5m}
  - {id: B02, tipos: [linux, storage], grupo: Bloqueos, nombre: "Espera de E/S alta (iowait)", unidad: "%", acciones: [avisar, diagnosticar, ampliar_volumen],
     descripcion: "Tiempo de CPU esperando al almacenamiento, promedio de 5 minutos",
     expr: '100 * avg by (faceops_equipo) (rate(node_cpu_seconds_total{mode="iowait",faceops_equipo="__EQ__"}[5m])) > __UMBRAL__', aviso: 20, critico: 40, para: 10m}
  - {id: B03, tipos: [linux, storage], grupo: Bloqueos, nombre: "Sistema de archivos en solo lectura", acciones: [avisar, diagnosticar],
     descripcion: "Algún sistema de archivos pasó a solo lectura (error de disco o del sistema de archivos)",
     expr: 'max by (faceops_equipo, mountpoint) (node_filesystem_readonly{faceops_equipo="__EQ__",fstype!~"tmpfs|overlay|squashfs|iso9660"}) == 1', umbral: false, severidad: critico, para: 1m}
  - {id: B04, tipos: [linux, storage], grupo: Bloqueos, nombre: "OOM killer activado", acciones: [avisar, diagnosticar, recursos, reiniciar_servicio],
     descripcion: "El kernel mató procesos por falta de memoria en los últimos 10 minutos",
     expr: 'increase(node_vmstat_oom_kill{faceops_equipo="__EQ__"}[10m]) > 0', umbral: false, severidad: critico, para: 0m}
  - {id: B05, tipos: [linux, storage], grupo: Bloqueos, nombre: "Servicio caído (estado failed)", acciones: [avisar, diagnosticar, reiniciar_servicio],
     descripcion: "Alguna unidad de systemd quedó en estado failed",
     expr: 'count by (faceops_equipo) (node_systemd_unit_state{faceops_equipo="__EQ__",state="failed"} == 1) > 0', umbral: false, severidad: aviso, para: 2m}
  # ───────── Plataformas (cada una en su tarjeta de la ficha) ─────────
  # JBoss EAP / WildFly
  - {id: J01, tipos: [linux], ambito: "plataforma:jboss", grupo: Disponibilidad, nombre: "JBoss detenido", acciones: [avisar, reiniciar_jboss, diagnosticar],
     descripcion: "El servicio systemd de JBoss EAP / WildFly no está activo (la aplicación deja de responder en ese nodo)",
     expr: 'max by (faceops_equipo) (node_systemd_unit_state{faceops_equipo="__EQ__",name=~"(eap|jboss|wildfly).*service",state="active"}) == 0', umbral: false, severidad: critico, para: 1m}
  - {id: J02, tipos: [linux], ambito: "plataforma:jboss", exportador: jboss, grupo: Capacidad, nombre: "Heap de JBoss alto", unidad: "%", acciones: [avisar, diagnosticar, reiniciar_jboss],
     descripcion: "Heap en uso respecto del máximo (métricas de JBoss en :9990/metrics; se habilitan con «FaceOps · Exportador de plataforma»)",
     expr: '100 * max by (faceops_equipo) (base_memory_usedHeap_bytes{faceops_equipo="__EQ__"}) / max by (faceops_equipo) (base_memory_maxHeap_bytes{faceops_equipo="__EQ__"}) > __UMBRAL__', aviso: 85, critico: 95, para: 10m}
  - {id: J03, tipos: [linux], ambito: "plataforma:jboss", grupo: Bloqueos, nombre: "Hilos bloqueados o deadlock en JBoss", pendiente: "las métricas de JBoss no publican hilos en deadlock: requiere jmx_exporter con java.lang:type=Threading (cambia el arranque de JBoss)"}
  - {id: J04, tipos: [linux], ambito: "plataforma:jboss", exportador: jboss, grupo: Operación, nombre: "Errores 5xx de las aplicaciones", unidad: "%", acciones: [avisar, diagnosticar],
     descripcion: "Porcentaje de peticiones con error (5xx) en Undertow, promedio de 5 minutos (estadísticas de Undertow habilitadas)",
     expr: '100 * sum by (faceops_equipo) (rate(jboss_undertow_error_count_total{faceops_equipo="__EQ__"}[5m])) / sum by (faceops_equipo) (rate(jboss_undertow_request_count_total{faceops_equipo="__EQ__"}[5m])) > __UMBRAL__', aviso: 5, critico: 20, para: 5m}
  - {id: J05, tipos: [linux], ambito: "plataforma:jboss", exportador: jboss, grupo: Capacidad, nombre: "Pool del datasource agotado", unidad: "%", acciones: [avisar, diagnosticar],
     descripcion: "Conexiones en uso del pool de algún datasource respecto de su total (estadísticas del datasource habilitadas)",
     expr: '100 * max by (faceops_equipo, data_source) (jboss_datasources_pool_in_use_count{faceops_equipo="__EQ__"} / (jboss_datasources_pool_in_use_count{faceops_equipo="__EQ__"} + jboss_datasources_pool_available_count{faceops_equipo="__EQ__"})) > __UMBRAL__', aviso: 80, critico: 95, para: 5m}
  # nginx
  - {id: N01, tipos: [linux], ambito: "plataforma:nginx", grupo: Disponibilidad, nombre: "nginx detenido", acciones: [avisar, reiniciar_servicio, diagnosticar],
     descripcion: "El servicio nginx no está activo", expr: 'max by (faceops_equipo) (node_systemd_unit_state{faceops_equipo="__EQ__",name="nginx.service",state="active"}) == 0', umbral: false, severidad: critico, para: 1m}
  - {id: N02, tipos: [linux], ambito: "plataforma:nginx", grupo: Operación, nombre: "Errores 5xx", pendiente: "stub_status de nginx no cuenta respuestas por código: requiere el log de acceso como métrica o NGINX Plus"}
  - {id: N09, tipos: [linux], ambito: "plataforma:nginx", exportador: nginx, grupo: Capacidad, nombre: "Conexiones activas altas", unidad: conexiones, acciones: [avisar, diagnosticar],
     descripcion: "Conexiones activas de nginx (nginx-prometheus-exporter sobre stub_status)",
     expr: 'max by (faceops_equipo) (nginx_connections_active{faceops_equipo="__EQ__"}) > __UMBRAL__', aviso: 500, critico: 2000, para: 5m}
  - {id: N03, tipos: [linux], ambito: "plataforma:nginx", grupo: Disponibilidad, nombre: "Upstream caído", pendiente: "requiere nginx-prometheus-exporter (NGINX Plus) o sondeo HTTP de cada upstream"}
  # Redis
  - {id: R01, tipos: [linux], ambito: "plataforma:redis", grupo: Disponibilidad, nombre: "Redis detenido", acciones: [avisar, reiniciar_servicio, diagnosticar],
     descripcion: "El servicio de Redis no está activo", expr: 'max by (faceops_equipo) (node_systemd_unit_state{faceops_equipo="__EQ__",name=~"(redis|valkey).*service",state="active"}) == 0', umbral: false, severidad: critico, para: 1m}
  - {id: R02, tipos: [linux], ambito: "plataforma:redis", exportador: redis, grupo: Capacidad, nombre: "Memoria de Redis alta", unidad: "%", acciones: [avisar, diagnosticar],
     descripcion: "Memoria usada respecto de maxmemory (redis_exporter; sin maxmemory configurado no hay dato)",
     expr: '100 * max by (faceops_equipo) (redis_memory_used_bytes{faceops_equipo="__EQ__"}) / max by (faceops_equipo) (redis_memory_max_bytes{faceops_equipo="__EQ__"} > 0) > __UMBRAL__', aviso: 80, critico: 95, para: 5m}
  - {id: R03, tipos: [linux], ambito: "plataforma:redis", exportador: redis, grupo: Bloqueos, nombre: "Clientes bloqueados en Redis", unidad: clientes, acciones: [avisar, diagnosticar],
     descripcion: "Clientes esperando en una operación bloqueante (BLPOP, WAIT…)",
     expr: 'max by (faceops_equipo) (redis_blocked_clients{faceops_equipo="__EQ__"}) > __UMBRAL__', aviso: 5, critico: 20, para: 5m}
  # Keycloak
  - {id: K01, tipos: [linux], ambito: "plataforma:keycloak", grupo: Disponibilidad, nombre: "Keycloak detenido", acciones: [avisar, reiniciar_servicio, diagnosticar],
     descripcion: "El servicio de Keycloak no está activo", expr: 'max by (faceops_equipo) (node_systemd_unit_state{faceops_equipo="__EQ__",name=~"(keycloak|rhbk).*service",state="active"}) == 0', umbral: false, severidad: critico, para: 1m}
  - {id: K02, tipos: [linux], ambito: "plataforma:keycloak", grupo: Seguridad, nombre: "Logins fallidos en Keycloak", unidad: "por minuto", acciones: [avisar, diagnosticar, bloquear_ip],
     descripcion: "Logins fallidos por IP en el último minuto (métrica de archivo keycloak.prom)",
     expr: 'max by (faceops_equipo) (keycloak_logins_fallidos_ultimo_minuto{faceops_equipo="__EQ__"}) > __UMBRAL__', aviso: 5, critico: 20, para: 0m}
  # PostgreSQL
  - {id: P01, tipos: [linux], ambito: "plataforma:postgresql", grupo: Disponibilidad, nombre: "PostgreSQL detenido", acciones: [avisar, reiniciar_servicio, diagnosticar],
     descripcion: "El servicio de PostgreSQL no está activo", expr: 'max by (faceops_equipo) (node_systemd_unit_state{faceops_equipo="__EQ__",name=~"postgresql.*service",state="active"}) == 0', umbral: false, severidad: critico, para: 1m}
  - {id: P02, tipos: [linux], ambito: "plataforma:postgresql", exportador: postgresql, grupo: Capacidad, nombre: "Conexiones cerca del máximo", unidad: "%", acciones: [avisar, diagnosticar],
     descripcion: "Conexiones abiertas respecto de max_connections (postgres_exporter)",
     expr: '100 * sum by (faceops_equipo) (pg_stat_activity_count{faceops_equipo="__EQ__"}) / max by (faceops_equipo) (pg_settings_max_connections{faceops_equipo="__EQ__"}) > __UMBRAL__', aviso: 80, critico: 95, para: 5m}
  - {id: P03, tipos: [linux], ambito: "plataforma:postgresql", exportador: postgresql, grupo: Bloqueos, nombre: "Bloqueos (locks) exclusivos", unidad: locks, acciones: [avisar, diagnosticar],
     descripcion: "Locks exclusivos tomados en la base (bloquean a otras sesiones)",
     expr: 'sum by (faceops_equipo) (pg_locks_count{faceops_equipo="__EQ__",mode=~"accessexclusivelock|exclusivelock"}) > __UMBRAL__', aviso: 5, critico: 20, para: 5m}
  - {id: P04, tipos: [linux], ambito: "plataforma:postgresql", exportador: postgresql, grupo: Disponibilidad, nombre: "Réplica atrasada", unidad: s, acciones: [avisar, diagnosticar],
     descripcion: "Atraso de la réplica (solo en un nodo réplica; en el primario no hay dato)",
     expr: 'max by (faceops_equipo) (pg_replication_lag_seconds{faceops_equipo="__EQ__"}) > __UMBRAL__', aviso: 30, critico: 300, para: 5m}
  # ───────── Clúster OpenShift (TENTATIVAS, en revisión: expresión propuesta contra el monitoreo del clúster) ─────────
  - {id: X01, tipos: [openshift], grupo: Disponibilidad, nombre: "API server no disponible", acciones: [avisar, diagnosticar],
     descripcion: "Ninguna instancia del API server responde a Prometheus", expr: 'sum(up{job="apiserver"}) == 0', umbral: false, severidad: critico, para: 2m}
  - {id: X02, tipos: [openshift], grupo: Disponibilidad, nombre: "Nodo NotReady", acciones: [avisar, diagnosticar, remediar_ocp],
     descripcion: "Algún nodo dejó de estar Ready", expr: 'max by (node) (kube_node_status_condition{condition="Ready",status="true"}) == 0', umbral: false, severidad: critico, para: 5m}
  - {id: X03, tipos: [openshift], grupo: Disponibilidad, nombre: "ClusterOperator degradado o no disponible", acciones: [avisar, diagnosticar],
     descripcion: "Algún ClusterOperator está Degraded o no Available", expr: 'max by (name) (cluster_operator_conditions{condition="Degraded"} == 1 or cluster_operator_up == 0) > 0', umbral: false, severidad: critico, para: 10m}
  - {id: X04, tipos: [openshift], grupo: Disponibilidad, nombre: "etcd sin líder", acciones: [avisar, diagnosticar],
     descripcion: "Algún miembro de etcd no tiene líder", expr: 'min(etcd_server_has_leader) == 0', umbral: false, severidad: critico, para: 1m}
  - {id: X05, tipos: [openshift], grupo: Rendimiento, nombre: "etcd con fsync lento", unidad: ms, acciones: [avisar, diagnosticar],
     descripcion: "Percentil 99 del fsync del WAL de etcd (disco lento para el plano de control)",
     expr: '1000 * max(histogram_quantile(0.99, rate(etcd_disk_wal_fsync_duration_seconds_bucket[5m]))) > __UMBRAL__', aviso: 10, critico: 50, para: 10m}
  - {id: X06, tipos: [openshift], grupo: Operación, nombre: "Actualización del clúster fallida o atascada", acciones: [avisar, diagnosticar],
     descripcion: "ClusterVersion con Failing=True (o progresando sin avanzar)", expr: 'max(cluster_version_conditions{type="Failing"}) == 1', umbral: false, severidad: critico, para: 15m}
  - {id: X07, tipos: [openshift], grupo: Seguridad, nombre: "Certificados del API o del ingress por vencer", unidad: días, menor: true, acciones: [avisar, diagnosticar],
     descripcion: "Días que le quedan al certificado más próximo a vencer del API o del router (sondeo TLS)",
     expr: 'min(probe_ssl_earliest_cert_expiry{job=~".*(api|ingress|router).*"} - time()) / 86400 < __UMBRAL__', aviso: 30, critico: 7, para: 1h}
  - {id: X08, tipos: [openshift], grupo: Capacidad, nombre: "PVC casi lleno", unidad: "%", acciones: [avisar, diagnosticar, remediar_ocp],
     descripcion: "Uso de algún volumen persistente (PVC)",
     expr: 'max by (namespace, persistentvolumeclaim) (100 * kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes) > __UMBRAL__', aviso: 80, critico: 90, para: 5m}
  - {id: X09, tipos: [openshift], grupo: Disponibilidad, nombre: "Pods en CrashLoopBackOff", unidad: pods, acciones: [avisar, diagnosticar, remediar_ocp],
     descripcion: "Contenedores reiniciándose en bucle", expr: 'sum(kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}) > __UMBRAL__', aviso: 0, critico: 5, para: 10m}
  - {id: X10, tipos: [openshift], grupo: Capacidad, nombre: "CPU de nodos alta", unidad: "%", acciones: [avisar, diagnosticar],
     descripcion: "Uso de CPU de algún nodo, promedio de 5 minutos",
     expr: 'max by (instance) (100 * (1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])))) > __UMBRAL__', aviso: 80, critico: 95, para: 15m}
  - {id: X11, tipos: [openshift], grupo: Capacidad, nombre: "Memoria de nodos alta", unidad: "%", acciones: [avisar, diagnosticar],
     descripcion: "Memoria en uso de algún nodo", expr: 'max by (instance) (100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > __UMBRAL__', aviso: 85, critico: 95, para: 15m}
  - {id: X12, tipos: [openshift], grupo: Capacidad, nombre: "Capacidad de pods del nodo", unidad: "%", acciones: [avisar, diagnosticar],
     descripcion: "Pods en ejecución respecto del máximo de pods del nodo",
     expr: 'max by (node) (100 * sum by (node) (kubelet_running_pods) / max by (node) (kube_node_status_capacity{resource="pods"})) > __UMBRAL__', aviso: 80, critico: 95, para: 15m}
  - {id: X13, tipos: [openshift], grupo: Operación, nombre: "Router (ingress) con errores 5xx", unidad: "%", acciones: [avisar, diagnosticar],
     descripcion: "Porcentaje de respuestas 5xx del router de OpenShift (HAProxy)",
     expr: '100 * sum(rate(haproxy_server_http_responses_total{code="5xx"}[5m])) / sum(rate(haproxy_server_http_responses_total[5m])) > __UMBRAL__', aviso: 5, critico: 20, para: 5m}
  - {id: X14, tipos: [openshift], grupo: Operación, nombre: "Alertas críticas de OpenShift", acciones: [avisar, diagnosticar],
     descripcion: "Reenvía las alertas críticas propias del clúster que están disparadas (sin Watchdog)",
     expr: 'count(ALERTS{alertstate="firing",severity="critical",alertname!="Watchdog"}) > 0', umbral: false, severidad: critico, para: 0m}
  - {id: X15, tipos: [openshift], grupo: Operación, nombre: "MachineConfigPool degradado", acciones: [avisar, diagnosticar],
     descripcion: "Algún MachineConfigPool tiene máquinas degradadas (la configuración de los nodos no se aplicó)",
     expr: 'max by (pool) (mcp_degraded_machine_count) > 0', umbral: false, severidad: critico, para: 10m}
  - {id: X16, tipos: [openshift], grupo: Disponibilidad, nombre: "Registro de imágenes caído", acciones: [avisar, diagnosticar],
     descripcion: "El operador del registro interno de imágenes no está disponible", expr: 'max(cluster_operator_up{name="image-registry"}) == 0', umbral: false, severidad: critico, para: 5m}
  - {id: X17, tipos: [openshift], grupo: Capacidad, nombre: "Registro de imágenes con riesgo de llenado", unidad: "%", acciones: [avisar, diagnosticar],
     descripcion: "Uso del volumen del registro interno (PVC del image-registry); en revisión además la predicción de llenado en 24 h: predict_linear(kubelet_volume_stats_available_bytes{namespace=\"openshift-image-registry\"}[6h], 86400) < 0. Podar imágenes (oc adm prune images): sin acción automática aún",
     expr: 'max(100 * kubelet_volume_stats_used_bytes{namespace="openshift-image-registry"} / kubelet_volume_stats_capacity_bytes{namespace="openshift-image-registry"}) > __UMBRAL__', aviso: 75, critico: 90, para: 10m}
  - {id: X18, tipos: [openshift], grupo: Capacidad, nombre: "PVC se llenará en 24 h", acciones: [avisar, diagnosticar, remediar_ocp],
     descripcion: "Tendencia de las últimas 6 horas: el espacio libre de algún PVC llega a cero dentro de un día",
     expr: 'min by (namespace, persistentvolumeclaim) (predict_linear(kubelet_volume_stats_available_bytes[6h], 86400)) < 0', umbral: false, severidad: aviso, para: 30m}
  - {id: X19, tipos: [openshift], grupo: Capacidad, nombre: "etcd: base de datos cerca de la cuota", unidad: "%", acciones: [avisar, diagnosticar],
     descripcion: "Tamaño de la base de etcd respecto de su cuota de backend (al llegar al 100 % etcd deja de aceptar escrituras)",
     expr: 'max(100 * etcd_mvcc_db_total_size_in_bytes / etcd_server_quota_backend_bytes) > __UMBRAL__', aviso: 75, critico: 90, para: 10m}
  # ───────── Servidores Windows ─────────
  - {id: W01, tipos: [windows], grupo: Capacidad, nombre: "CPU alta", unidad: "%", acciones: [avisar, recursos, diagnosticar],
     descripcion: "Uso de CPU promedio de los últimos 5 minutos",
     expr: '100 - avg by (faceops_equipo) (rate(windows_cpu_time_total{mode="idle",faceops_equipo="__EQ__"}[5m])) * 100 > __UMBRAL__', aviso: 80, critico: 95, para: 10m}
  - {id: W02, tipos: [windows], grupo: Capacidad, nombre: "Memoria alta", unidad: "%", acciones: [avisar, recursos],
     descripcion: "Memoria física en uso",
     expr: '100 * (1 - windows_os_physical_memory_free_bytes{faceops_equipo="__EQ__"} / windows_cs_physical_memory_bytes{faceops_equipo="__EQ__"}) > __UMBRAL__', aviso: 85, critico: 95, para: 10m}
  - {id: W03, tipos: [windows], grupo: Capacidad, nombre: "Disco lleno", unidad: "%", acciones: [avisar, ampliar_disco],
     descripcion: "Cualquier unidad lógica sobre el umbral",
     expr: 'max by (faceops_equipo, volume) (100 - 100 * windows_logical_disk_free_bytes{faceops_equipo="__EQ__",volume!~"HarddiskVolume.*"} / windows_logical_disk_size_bytes{faceops_equipo="__EQ__",volume!~"HarddiskVolume.*"}) > __UMBRAL__', aviso: 80, critico: 90, para: 5m}
  - {id: W04, tipos: [windows], grupo: Disponibilidad, nombre: "IIS detenido", acciones: [avisar, reiniciar_iis],
     descripcion: "El servicio W3SVC no está en ejecución",
     expr: 'windows_service_state{faceops_equipo="__EQ__",name="w3svc",state="running"} == 0', umbral: false, severidad: critico, para: 2m}
  - {id: W05, tipos: [windows], grupo: Disponibilidad, nombre: "Reinicio inesperado", acciones: [avisar, diagnosticar],
     descripcion: "El sistema arrancó hace menos de 10 minutos",
     expr: '(time() - windows_system_system_up_time{faceops_equipo="__EQ__"}) < 600', umbral: false, severidad: aviso, para: 0m}
  - {id: W06, tipos: [windows], grupo: Capacidad, nombre: "Archivo de paginación alto", unidad: "%", acciones: [avisar, recursos],
     descripcion: "Uso del archivo de paginación",
     expr: '100 * (1 - windows_os_paging_free_bytes{faceops_equipo="__EQ__"} / windows_os_paging_limit_bytes{faceops_equipo="__EQ__"}) > __UMBRAL__', aviso: 60, critico: 85, para: 15m}
  - {id: W07, tipos: [windows], grupo: Capacidad, nombre: "Cola de disco alta", unidad: "operaciones", acciones: [avisar, diagnosticar],
     descripcion: "Operaciones de lectura y escritura en espera en alguna unidad",
     expr: 'max by (faceops_equipo, volume) (windows_logical_disk_requests_queued{faceops_equipo="__EQ__"}) > __UMBRAL__', aviso: 5, critico: 20, para: 10m}
  - {id: W08, tipos: [windows], grupo: Operación, nombre: "Errores de red", unidad: "por s", acciones: [avisar, diagnosticar],
     descripcion: "Paquetes con error en alguna interfaz",
     expr: 'max by (faceops_equipo, nic) (rate(windows_net_packets_received_errors_total{faceops_equipo="__EQ__"}[5m]) + rate(windows_net_packets_outbound_errors_total{faceops_equipo="__EQ__"}[5m])) > __UMBRAL__', aviso: 1, critico: 10, para: 10m}
  - {id: W09, tipos: [windows], grupo: Operación, nombre: "Demasiados procesos", unidad: "procesos", acciones: [avisar, diagnosticar],
     descripcion: "Cantidad de procesos en ejecución",
     expr: 'windows_os_processes{faceops_equipo="__EQ__"} > __UMBRAL__', aviso: 300, critico: 500, para: 15m}
  # ───────── Equipos de red (sondeo de su puerto de administración) ─────────
  - {id: D02, tipos: [red], grupo: Disponibilidad, nombre: "No responde en su puerto de administración", acciones: [avisar, encender, diagnosticar],
     descripcion: "El sondeo TCP al puerto de administración falla (equipo caído o sin ruta)",
     expr: 'probe_success{job="faceops-sondeo",faceops_equipo="__EQ__"} == 0', umbral: false, severidad: critico, para: 2m}
  - {id: D03, tipos: [red], grupo: Disponibilidad, nombre: "Respuesta lenta", unidad: ms, acciones: [avisar, diagnosticar],
     descripcion: "Tiempo de conexión al puerto de administración",
     expr: '1000 * probe_duration_seconds{job="faceops-sondeo",faceops_equipo="__EQ__"} > __UMBRAL__', aviso: 200, critico: 1000, para: 5m}
  - {id: D05, tipos: [red], grupo: Disponibilidad, nombre: "Caídas intermitentes", unidad: "% de éxito", acciones: [avisar, diagnosticar],
     descripcion: "Sondeos exitosos en los últimos 15 minutos bajo el umbral (enlace inestable)",
     expr: '100 * avg_over_time(probe_success{job="faceops-sondeo",faceops_equipo="__EQ__"}[15m]) < __UMBRAL__', aviso: 99, critico: 95, para: 5m, menor: true}
  # ───────── Segmento de negocio (vista del segmento en el mapa): nivel servicio, no máquina ─────────
  # Sondas del blackbox (job faceops-segmentos, objetivos/seg-<segmento>.yml) que arma FaceOps desde la arquitectura del
  # segmento: rol vip (entrada.url, HTTP por el balanceador), backend (nodos detrás del balanceador, TCP a su puerto) y
  # componente (cada máquina de producción, TCP al puerto de su plataforma). Si al segmento le falta lo que la alerta
  # necesita (URL de entrada, HTTPS, balanceador), FaceOps la muestra «requiere medición» con el motivo.
  - {id: G01, tipos: [segmento], grupo: Disponibilidad, nombre: "Servicio no disponible", acciones: [avisar],
     descripcion: "La URL de entrada del segmento no responde HTTP 200 a través del balanceador (sonda blackbox cada 30 s)",
     expr: 'max by (faceops_equipo) (probe_http_status_code{job="faceops-segmentos",faceops_equipo="__EQ__",faceops_rol="vip"}) != 200', umbral: false, severidad: critico, para: 2m}
  - {id: G02, tipos: [segmento], grupo: Rendimiento, nombre: "Latencia p95 alta", unidad: ms, acciones: [avisar],
     descripcion: "Percentil 95 del tiempo de respuesta de la entrada en los últimos 15 minutos (sonda HTTP por el balanceador)",
     expr: '1000 * max by (faceops_equipo) (quantile_over_time(0.95, probe_duration_seconds{job="faceops-segmentos",faceops_equipo="__EQ__",faceops_rol="vip"}[15m])) > __UMBRAL__', aviso: 800, critico: 2000, para: 10m}
  - {id: G03, tipos: [segmento], grupo: Rendimiento, nombre: "Tasa de errores 5xx", unidad: "%",
     pendiente: "requiere medición: falta el exportador de métricas del balanceador (códigos de respuesta del tráfico real, p. ej. nginx-vts o haproxy_exporter); la sonda sintética no mide la tasa de errores de los usuarios"}
  - {id: G04, tipos: [segmento], grupo: Seguridad, nombre: "Certificado del VIP por vencer", unidad: días, acciones: [avisar],
     descripcion: "Días que le quedan al certificado TLS que presenta la entrada del segmento",
     expr: 'min by (faceops_equipo) (probe_ssl_earliest_cert_expiry{job="faceops-segmentos",faceops_equipo="__EQ__",faceops_rol="vip"} - time()) / 86400 < __UMBRAL__', aviso: 30, critico: 7, para: 10m, menor: true}
  - {id: G05, tipos: [segmento], grupo: Disponibilidad, nombre: "Pérdida de redundancia", unidad: "nodos sanos", acciones: [avisar],
     descripcion: "Nodos detrás del balanceador que responden en su puerto (N = réplicas de producción declaradas en la arquitectura)",
     expr: '(count by (faceops_equipo) (probe_success{job="faceops-segmentos",faceops_equipo="__EQ__",faceops_rol="backend"} == 1) or on() vector(0)) < __UMBRAL__', aviso: 2, critico: 1, para: 3m, menor: true}
  - {id: G06, tipos: [segmento], grupo: Disponibilidad, nombre: "Componente crítico caído", acciones: [avisar],
     descripcion: "Alguna máquina o plataforma de producción del segmento no responde en su puerto (servidor de aplicaciones, base de datos, colas, balanceador…)",
     expr: 'min by (faceops_equipo, faceops_componente) (probe_success{job="faceops-segmentos",faceops_equipo="__EQ__",faceops_rol="componente"}) == 0', umbral: false, severidad: critico, para: 2m}
  - {id: G07, tipos: [segmento], grupo: Disponibilidad, nombre: "SLO en riesgo", unidad: "× presupuesto", acciones: [avisar],
     descripcion: "Ritmo de consumo del error budget de un SLO de disponibilidad de 99,5 % en la última hora, medido con la sonda de la entrada (1 = lo agota justo en 30 días)",
     expr: 'max by (faceops_equipo) (1 - avg_over_time(probe_success{job="faceops-segmentos",faceops_equipo="__EQ__",faceops_rol="vip"}[1h])) / 0.005 > __UMBRAL__', aviso: 2, critico: 10, para: 5m}
  # ───────── Hipervisor KVM / libvirt (ficha del hipervisor) ─────────
  - {id: H01, tipos: [kvm], grupo: Capacidad, nombre: "CPU del anfitrión alta", unidad: "%", acciones: [avisar, diagnosticar],
     descripcion: "Uso de CPU del anfitrión (todas sus máquinas virtuales juntas) en los últimos 2 minutos",
     expr: '100 - avg by (faceops_equipo) (rate(node_cpu_seconds_total{mode="idle",faceops_equipo="__EQ__"}[2m])) * 100 > __UMBRAL__', aviso: 80, critico: 95, para: 10m}
  - {id: H02, tipos: [kvm], grupo: Capacidad, nombre: "Memoria del anfitrión alta", unidad: "%", acciones: [avisar, diagnosticar],
     descripcion: "Memoria en uso del anfitrión (descuenta caché y buffers): con poca libre, las máquinas compiten o el kernel mata procesos",
     expr: '100 * (1 - node_memory_MemAvailable_bytes{faceops_equipo="__EQ__"} / node_memory_MemTotal_bytes{faceops_equipo="__EQ__"}) > __UMBRAL__', aviso: 85, critico: 95, para: 10m}
  - {id: H03, tipos: [kvm], grupo: Capacidad, nombre: "Pool de discos casi lleno", unidad: "%", acciones: [avisar, diagnosticar],
     descripcion: "Sistema de archivos del anfitrión donde viven los pools de libvirt (discos de las máquinas, snapshots e imágenes)",
     expr: 'max by (faceops_equipo, mountpoint) (100 - 100 * node_filesystem_avail_bytes{faceops_equipo="__EQ__",fstype!~"tmpfs|overlay|squashfs|vfat"} / node_filesystem_size_bytes{faceops_equipo="__EQ__",fstype!~"tmpfs|overlay|squashfs|vfat"}) > __UMBRAL__', aviso: 80, critico: 90, para: 5m}
  - {id: H04, tipos: [kvm], grupo: Disponibilidad, nombre: "Servicio de libvirt caído", acciones: [avisar, diagnosticar],
     descripcion: "libvirtd (o virtqemud en libvirt modular) no está activo: no se pueden encender, apagar ni administrar las máquinas",
     expr: 'max by (faceops_equipo) (node_systemd_unit_state{faceops_equipo="__EQ__",name=~"(libvirtd|virtqemud)\\.service",state="active"}) < 1', umbral: false, severidad: critico, para: 2m}
  - {id: H05, tipos: [kvm], grupo: Disponibilidad, nombre: "Máquina virtual en error o pausada", pendiente: "requiere métricas de libvirt en el anfitrión (libvirt_exporter o textfile del node_exporter)"}
  - {id: H06, tipos: [kvm], grupo: Capacidad, nombre: "Sobreasignación de CPU excesiva", pendiente: "requiere métricas de libvirt en el anfitrión (libvirt_exporter o textfile del node_exporter)"}
  - {id: H07, tipos: [kvm], grupo: Operación, nombre: "Snapshots viejos", pendiente: "requiere métricas de libvirt en el anfitrión (libvirt_exporter o textfile del node_exporter)"}
  # ───────── Hipervisor VMware vSphere (ficha del hipervisor) ─────────
  - {id: V01, tipos: [vmware], grupo: Capacidad, nombre: "CPU de los hosts ESXi alta", pendiente: "requiere vmware_exporter (:9272) apuntando al vCenter"}
  - {id: V02, tipos: [vmware], grupo: Capacidad, nombre: "Memoria de los hosts ESXi alta", pendiente: "requiere vmware_exporter (:9272) apuntando al vCenter"}
  - {id: V03, tipos: [vmware], grupo: Capacidad, nombre: "Datastore casi lleno", pendiente: "requiere vmware_exporter (:9272) apuntando al vCenter"}
  - {id: V04, tipos: [vmware], grupo: Disponibilidad, nombre: "Máquina virtual en error o suspendida", pendiente: "requiere vmware_exporter (:9272) apuntando al vCenter"}
  - {id: V05, tipos: [vmware], grupo: Disponibilidad, nombre: "vSphere HA desactivado o degradado", pendiente: "requiere vmware_exporter (:9272) apuntando al vCenter"}
  - {id: V06, tipos: [vmware], grupo: Disponibilidad, nombre: "vMotion fallido", pendiente: "requiere vmware_exporter (:9272) apuntando al vCenter"}
  - {id: V07, tipos: [vmware], grupo: Capacidad, nombre: "Sobreasignación de CPU o memoria excesiva", pendiente: "requiere vmware_exporter (:9272) apuntando al vCenter"}
  - {id: V08, tipos: [vmware], grupo: Operación, nombre: "Snapshots viejos", pendiente: "requiere vmware_exporter (:9272) apuntando al vCenter"}
  # ───────── Plataformas · indicadores propios medidos SIN agente («Plataforma · Medir salud» por SSH/WinRM/API, inventario de red
  #   o recolección del clúster). FaceOps publica lo medido en /metricas/plataformas (job faceops-plataformas de Prometheus);
  #   sin_agente: la alerta no exige el exportador de la máquina. Ámbito plataforma:<familia>: van a la campana global agrupadas.
  # Data lake (S3 + Trino)
