---
# Storage · Servicio S3 del data lake. Deja en un equipo de almacenamiento (Linux) el servicio S3 que recibe la data de
# todas las aplicaciones: SeaweedFS (binario oficial verificado) como servicio systemd, sobre el disco ya montado (p. ej. con
# «FaceOps · Agregar disco»). Abre los puertos solo a los clientes indicados. Idempotente.
# Variables: ls_dir (punto de montaje del disco) · ls_clientes (redes que pueden escribir/leer, CIDR, separadas por coma)
#            · ls_modo instalar | estado · ls_volumen_mb (tamaño de cada volumen interno)
- name: Storage · Servicio S3 del data lake
  hosts: all
  become: true
  gather_facts: false
  vars:
    modo: "{{ ls_modo | default('instalar') }}"
    dir: "{{ ls_dir | default('/srv/datalake') }}"
    clientes: "{{ (ls_clientes | default('192.168.122.0/24')).split(',') | map('trim') | select | list }}"
    version: "3.80"
    vol_mb: "{{ ls_volumen_mb | default(1024) | int }}"
  tasks:
    - name: Datos válidos
      ansible.builtin.assert:
        that:
          - modo in ['instalar', 'estado']
          - dir is match('^/[A-Za-z0-9._/-]+$') and dir not in ['/', '/etc', '/usr', '/var', '/home', '/root', '/boot']
          - clientes | length > 0
          - clientes | select('match', '^[0-9]{1,3}(\.[0-9]{1,3}){3}/[0-9]{1,2}$') | list | length == clientes | length
          - vol_mb | int >= 256 and vol_mb | int <= 30000
        fail_msg: "Datos no válidos: modo instalar|estado, directorio absoluto (no del sistema), clientes en formato CIDR"

    - name: El directorio está en su propio disco (montado)
      ansible.builtin.command: findmnt -n -o TARGET,SOURCE,SIZE --target {{ dir | quote }}
      register: r_mnt
      changed_when: false
      failed_when: false

    - name: Exigir un disco dedicado
      ansible.builtin.assert:
        that: r_mnt.rc == 0 and (r_mnt.stdout.split() | first | default('')) == dir
        fail_msg: "{{ dir }} no es un disco dedicado: agrégalo primero con «FaceOps · Agregar disco» (montaje {{ dir }})"
      when: modo == 'instalar'

    - name: Instalar
      when: modo == 'instalar'
      block:
        - name: Directorio de datos
          ansible.builtin.file: {path: "{{ dir }}/s3", state: directory, mode: "0750"}
        - name: Binario de SeaweedFS {{ version }} (descarga verificada con su suma md5 publicada)
          ansible.builtin.get_url:
            url: "https://github.com/seaweedfs/seaweedfs/releases/download/{{ version }}/linux_amd64.tar.gz"
            dest: "/opt/lake-s3-{{ version }}.tar.gz"
            checksum: "md5:https://github.com/seaweedfs/seaweedfs/releases/download/{{ version }}/linux_amd64.tar.gz.md5"
            mode: "0644"
        - name: Instalar el binario
          ansible.builtin.unarchive:
            src: "/opt/lake-s3-{{ version }}.tar.gz"
            dest: /usr/local/bin
            remote_src: true
            include: [weed]
            creates: /usr/local/bin/weed
        - name: Servicio systemd
          ansible.builtin.copy:
            dest: /etc/systemd/system/lake-s3.service
            mode: "0644"
            content: |
              [Unit]
              Description=Data lake · servicio S3 (SeaweedFS) sobre {{ dir }}
              After=network-online.target {{ dir | regex_replace('^/', '') | regex_replace('/', '-') }}.mount
              Wants=network-online.target
              [Service]
              Restart=always
              WorkingDirectory={{ dir }}/s3
              ExecStart=/usr/local/bin/weed server -dir={{ dir }}/s3 -ip=127.0.0.1 -ip.bind=0.0.0.0 -master.volumeSizeLimitMB={{ vol_mb }} -volume.max=0 -filer -s3 -s3.port=9000
              [Install]
              WantedBy=multi-user.target
          register: r_unit
        - name: Activar
          ansible.builtin.systemd: {name: lake-s3, enabled: true, state: "{{ 'restarted' if r_unit.changed else 'started' }}", daemon_reload: true}
        - name: Firewall (solo los clientes indicados) · firewalld si está; si no, nftables persistente
          ansible.builtin.shell: |
            set -e
            CL="{{ clientes | join(' ') }}"
            if command -v firewall-cmd >/dev/null 2>&1 && firewall-cmd --state >/dev/null 2>&1; then
              cambio=0
              for c in $CL; do for p in 9000 8888; do
                r="rule family=\"ipv4\" source address=\"$c\" port port=\"$p\" protocol=\"tcp\" accept"
                firewall-cmd --permanent --query-rich-rule="$r" >/dev/null 2>&1 && continue
                firewall-cmd --permanent --add-rich-rule="$r" >/dev/null; firewall-cmd --add-rich-rule="$r" >/dev/null; cambio=1
              done; done
              echo "firewalld cambio=$cambio"
            else
              conf=/etc/nftables/faceops-lake.nft
              nuevo=$(mktemp)
              {
                echo 'table inet faceops_lake'
                echo 'delete table inet faceops_lake'
                echo 'table inet faceops_lake {'
                echo '  chain entrada {'
                echo '    type filter hook input priority 0; policy accept;'
                echo "    ip saddr { $(echo $CL | sed 's/ /, /g') } tcp dport { 9000, 8888 } accept"
                echo '    tcp dport { 9000, 8888 } drop'
                echo '  }'
                echo '}'
              } > $nuevo
              if [ -f $conf ] && cmp -s $nuevo $conf; then echo "nftables cambio=0"; rm -f $nuevo; exit 0; fi
              mkdir -p /etc/nftables; mv $nuevo $conf; chmod 600 $conf
              nft -f $conf
              grep -q 'faceops-lake.nft' /etc/sysconfig/nftables.conf 2>/dev/null || echo 'include "/etc/nftables/faceops-lake.nft"' >> /etc/sysconfig/nftables.conf
              systemctl enable nftables >/dev/null 2>&1 || true
              echo "nftables cambio=1"
            fi
          register: r_fw
          changed_when: "'cambio=1' in r_fw.stdout"

    - name: Responde el S3
      ansible.builtin.uri: {url: "http://127.0.0.1:9000/", status_code: [200, 403]}
      register: r_s3
      retries: 20
      delay: 3
      until: r_s3.status in [200, 403]
      failed_when: false

    - name: Uso del disco
      ansible.builtin.command: df -BG --output=size,used,avail {{ dir | quote }}
      register: r_df
      changed_when: false
      failed_when: false

    - name: Resultado
      ansible.builtin.set_stats:
        data:
          faceops_lake_s3:
            equipo: "{{ inventory_hostname }}"
            endpoint: "http://{{ ansible_host | default(inventory_hostname) }}:9000"
            filer: "http://{{ ansible_host | default(inventory_hostname) }}:8888"
            dir: "{{ dir }}"
            disco: "{{ r_mnt.stdout | default('') }}"
            uso: "{{ (r_df.stdout_lines | default([]))[-1] | default('') | trim }}"
            responde: "{{ r_s3.status | default(0) in [200, 403] }}"
            clientes: "{{ clientes }}"

    - name: El servicio debe responder
      ansible.builtin.assert:
        that: r_s3.status | default(0) in [200, 403]
        fail_msg: "El S3 no responde en {{ inventory_hostname }}:9000"
