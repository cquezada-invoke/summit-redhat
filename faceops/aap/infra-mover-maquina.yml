---
# Infra · Mover máquina entre centros de datos (anfitrión KVM; cada centro es una red y un pool de discos de libvirt).
#   evaluar   solo lectura: estado, discos y tamaño, espacio libre en el destino, red de destino y tiempo estimado
#   mover     apaga ordenadamente, copia los discos al pool del destino, define la máquina en el destino (misma MAC, red del
#             destino), la enciende y espera su IP nueva. La de origen queda apagada y renombrada «<nombre>-origen» como
#             vuelta atrás: no se borra. Si algo falla, se elimina lo creado en el destino y la de origen vuelve a encenderse.
#   confirmar retira la máquina de origen (definición y discos) una vez validado el traslado
#   revertir  apaga la del destino, vuelve a encender la de origen con su nombre y retira la copia del destino (sus discos)
# Variables: mv_maquina · mv_destino (red libvirt del centro: default = Santiago · dc-valpo = Valparaíso) · mv_modo · mv_puerto (22; 5986 en Windows)
- name: Infra · Mover máquina entre centros de datos
  hosts: anfitrion_kvm
  gather_facts: false
  vars:
    vm: "{{ mv_maquina | default('') }}"
    destino: "{{ mv_destino | default('') }}"
    modo: "{{ mv_modo | default('evaluar') }}"
    red_dst: "{{ destino }}"
    pool_dst: "{{ 'images' if destino == 'default' else destino }}"
    dir_dst: "{{ sit.DIR_DST | default('') }}"
    puerto: "{{ mv_puerto | default(22) | int }}"
  tasks:
    - name: Datos válidos
      ansible.builtin.assert:
        that:
          - vm is match('^[A-Za-z0-9._-]{2,63}$')
          - destino is match('^(default|dc-[a-z0-9]{2,12})$')
          - modo in ['evaluar', 'mover', 'confirmar', 'revertir']
          - vm not in ['nodo-vault', 'sno']
        fail_msg: "Máquina, destino o modo no válidos (nodo-vault y OpenShift no se mueven)"
        quiet: true

    - name: Situación actual
      ansible.builtin.shell: |
        v={{ vm }}
        sudo -n virsh dominfo "$v" >/dev/null 2>&1 || { echo "NOEXISTE"; exit 0; }
        echo "ESTADO=$(sudo -n virsh domstate "$v")"
        echo "RED=$(sudo -n virsh domiflist "$v" | awk 'NR>2 && $3 {print $3; exit}')"
        echo "MAC=$(sudo -n virsh domiflist "$v" | awk 'NR>2 && $5 {print $5; exit}')"
        sudo -n virsh domblklist "$v" --details | awk '$2=="disk"{print "DISCO=" $4}'
        for d in $(sudo -n virsh domblklist "$v" --details | awk '$2=="disk"{print $4}'); do
          echo "GB=$(sudo -n virsh vol-info --bytes "$d" 2>/dev/null | awk '/Allocation/{printf "%.1f", $2/2^30}')"
          sudo -n virsh vol-pool "$d" >/dev/null 2>&1 || echo "SINPOOL=$d"
        done
        echo "LIBRE_DST=$(sudo -n virsh pool-info --bytes {{ pool_dst }} 2>/dev/null | awk '/Available/{print int($2/2^30)}')"
        echo "DIR_DST=$(sudo -n virsh pool-dumpxml {{ pool_dst }} 2>/dev/null | sed -n 's:.*<path>\(.*\)</path>.*:\1:p' | head -1)"
        sudo -n virsh net-info {{ red_dst }} >/dev/null 2>&1 && echo "RED_DST=ok" || echo "RED_DST=falta"
        sudo -n virsh dominfo "$v-origen" >/dev/null 2>&1 && echo "ORIGEN=existe" || echo "ORIGEN=no"
        c=no; for d in $(sudo -n virsh domblklist "$v" --details | awk '$2=="disk"{print $4}'); do sudo -n virsh vol-info --pool {{ pool_dst }} "$(basename $d)" >/dev/null 2>&1 && c=si; done; echo "CHOCA=$c"
      register: r_sit
      changed_when: false
      when: modo in ['evaluar', 'mover']

    - name: Lectura
      ansible.builtin.set_fact:
        sit: "{{ dict(r_sit.stdout_lines | select('search', '=') | reject('match', '^(DISCO|GB|SINPOOL)=') | map('split', '=', 1)) }}"
        discos: "{{ r_sit.stdout_lines | select('match', '^DISCO=') | map('regex_replace', '^DISCO=', '') | list }}"
        gb: "{{ r_sit.stdout_lines | select('match', '^GB=') | map('regex_replace', '^GB=', '') | map('float') | sum }}"
      when: modo in ['evaluar', 'mover']

    - name: Se puede mover
      ansible.builtin.assert:
        that:
          - "'NOEXISTE' not in r_sit.stdout"
          - sit.RED_DST == 'ok'
          - sit.RED != red_dst
          - sit.ORIGEN == 'no'
          - sit.CHOCA == 'no'
          - sit.DIR_DST | length > 0
          - "'SINPOOL=' not in r_sit.stdout"
          - (sit.LIBRE_DST | int) > (gb | float) + 5
        fail_msg: >-
          {{ 'La máquina no existe en el anfitrión' if 'NOEXISTE' in r_sit.stdout else
             ('El centro de destino no está preparado (falta su red o su pool de discos)' if sit.RED_DST != 'ok' or not sit.DIR_DST else
             ('Un disco de la máquina no está en un pool de libvirt' if 'SINPOOL=' in r_sit.stdout else
             ('La máquina ya está en ese centro de datos' if sit.RED == red_dst else
             ('Hay un traslado sin confirmar (' ~ vm ~ '-origen): confirma o revierte primero' if sit.ORIGEN != 'no' else
             ('Ya existe un disco con ese nombre en el destino' if sit.CHOCA != 'no' else
             'No hay espacio en el destino: se necesitan ' ~ ((gb | float) + 5) | round(0) ~ ' GB'))))) }}
        quiet: true
      when: modo in ['evaluar', 'mover']

    - name: Traslado
      when: modo == 'mover'
      block:
        - name: Apagar ordenadamente
          ansible.builtin.shell: |
            v={{ vm }}
            [ "$(sudo -n virsh domstate $v)" = "running" ] || exit 0
            sudo -n virsh shutdown $v >/dev/null
            for i in $(seq 1 36); do [ "$(sudo -n virsh domstate $v)" = "shut off" ] && exit 0; sleep 5; done
            sudo -n virsh destroy $v >/dev/null; echo forzado
          register: r_off
          changed_when: true

        - name: Copiar los discos al centro de destino
          ansible.builtin.shell: |
            set -e
            for d in {{ discos | join(' ') }}; do   # copia con libvirt (independiente: aplana la imagen base si la tiene)
              b=$(basename "$d"); sp=$(sudo -n virsh vol-pool "$d")
              cap=$(sudo -n virsh vol-info --bytes "$d" | awk '/Capacity/{print $2}')
              fmt=$(sudo -n virsh vol-dumpxml "$d" | sed -n "s:.*<format type='\([a-z0-9]*\)'/>.*:\1:p" | head -1)
              printf "<volume><name>%s</name><capacity>%s</capacity><target><format type='%s'/></target></volume>" "$b" "$cap" "${fmt:-qcow2}" > /tmp/mv-vol-$b.xml
              sudo -n virsh vol-create-from {{ pool_dst }} /tmp/mv-vol-$b.xml "$b" --inputpool "$sp" >/dev/null; rm -f /tmp/mv-vol-$b.xml
              echo "{{ dir_dst }}/$b"
            done
          register: r_cp
          changed_when: true
          async: 3600
          poll: 15

        - name: Definir la máquina en el destino (misma MAC, red y discos del destino)
          ansible.builtin.shell: |
            set -e
            v={{ vm }}
            sudo -n virsh dumpxml --inactive --security-info $v > /tmp/mv-$v.xml
            sudo -n virsh domrename $v $v-origen >/dev/null
            sudo -n virsh autostart --disable $v-origen >/dev/null 2>&1 || true
            python3 - /tmp/mv-$v.xml <<'P'
            import sys, xml.etree.ElementTree as ET
            p = sys.argv[1]; t = ET.parse(p); r = t.getroot()
            for x in r.findall("uuid"): r.remove(x)
            for s in r.findall("./devices/disk/source"):
                f = s.get("file")
                if f and f.endswith((".qcow2", ".img", ".raw")):
                    s.set("file", "{{ dir_dst }}/" + f.rsplit("/", 1)[1])
            for i in r.findall("./devices/interface[@type='network']/source"):
                i.set("network", "{{ red_dst }}")
            t.write(p)
            P
            sudo -n virsh define /tmp/mv-$v.xml >/dev/null && rm -f /tmp/mv-$v.xml
            sudo -n virsh start $v >/dev/null
          changed_when: true

        - name: IP nueva en el destino
          ansible.builtin.shell: |
            for i in $(seq 1 60); do
              ip=$(sudo -n virsh domifaddr {{ vm }} --source lease 2>/dev/null | awk '/ipv4/ {split($4,a,"/"); print a[1]; exit}')
              [ -n "$ip" ] && { echo $ip; exit 0; }; sleep 5
            done; exit 1
          register: r_ip
          changed_when: false

        - name: Responde en el destino
          ansible.builtin.wait_for: {host: "{{ r_ip.stdout | trim }}", port: "{{ puerto }}", timeout: 300}
          delegate_to: localhost
          ignore_errors: true
          register: r_resp
      rescue:
        - name: Vuelta atrás (se elimina lo creado en el destino y vuelve la de origen)
          ansible.builtin.shell: |
            v={{ vm }}
            if sudo -n virsh dominfo $v-origen >/dev/null 2>&1; then
              sudo -n virsh destroy $v >/dev/null 2>&1; sudo -n virsh undefine $v >/dev/null 2>&1
              sudo -n virsh domrename $v-origen $v >/dev/null
            fi
            for d in {{ discos | join(' ') }}; do b=$(basename "$d"); [ "{{ dir_dst }}/$b" != "$d" ] && sudo -n virsh vol-delete --pool {{ pool_dst }} "$b" >/dev/null 2>&1; done
            sudo -n virsh start $v >/dev/null 2>&1 || true
          changed_when: true
        - name: Traslado fallido
          ansible.builtin.fail:
            msg: "El traslado de {{ vm }} falló y volvió a quedar en su centro de datos de origen"

    - name: Confirmar · retirar la máquina de origen
      ansible.builtin.shell: |
        set -e
        v={{ vm }}-origen
        sudo -n virsh dominfo $v >/dev/null 2>&1 || { echo "SIN_ORIGEN"; exit 0; }
        [ "$(sudo -n virsh domstate $v)" = "shut off" ] || sudo -n virsh destroy $v >/dev/null
        sudo -n virsh undefine $v --remove-all-storage --snapshots-metadata >/dev/null && echo retirada
      register: r_conf
      changed_when: "'retirada' in r_conf.stdout"
      failed_when: "'SIN_ORIGEN' in r_conf.stdout"
      when: modo == 'confirmar'

    - name: Revertir · volver a la máquina de origen y retirar la copia del destino
      ansible.builtin.shell: |
        set -e
        v={{ vm }}
        limpiar() {   # la copia del destino: solo sus discos (están en el pool del destino), nunca otros volúmenes
          sudo -n virsh dominfo $v-destino >/dev/null 2>&1 || return 0
          sudo -n virsh destroy $v-destino >/dev/null 2>&1 || true
          ds=$(sudo -n virsh domblklist $v-destino --details | awk '$2=="disk"{print $4}' | paste -sd, -)
          sudo -n virsh undefine $v-destino ${ds:+--storage $ds} >/dev/null
        }
        if ! sudo -n virsh dominfo $v-origen >/dev/null 2>&1; then
          sudo -n virsh dominfo $v-destino >/dev/null 2>&1 || { echo "SIN_ORIGEN"; exit 1; }
          limpiar; echo "RED=$(sudo -n virsh domiflist $v | awk 'NR>2 && $3 {print $3; exit}')"
          sudo -n virsh domifaddr $v --source lease 2>/dev/null | awk '/ipv4/ {split($4,a,"/"); print a[1]; exit}'; exit 0
        fi
        sudo -n virsh destroy $v >/dev/null 2>&1 || true
        sudo -n virsh domrename $v $v-destino >/dev/null
        sudo -n virsh domrename $v-origen $v >/dev/null
        sudo -n virsh autostart --disable $v >/dev/null 2>&1 || true
        sudo -n virsh start $v >/dev/null
        limpiar
        echo "RED=$(sudo -n virsh domiflist $v | awk 'NR>2 && $3 {print $3; exit}')"
        for i in $(seq 1 60); do ip=$(sudo -n virsh domifaddr $v --source lease 2>/dev/null | awk '/ipv4/ {split($4,a,"/"); print a[1]; exit}'); [ -n "$ip" ] && { echo $ip; exit 0; }; sleep 5; done
      register: r_rev
      changed_when: true
      when: modo == 'revertir'

    - name: Resultado para FaceOps
      ansible.builtin.set_stats:
        data:
          faceops_traslado:
            maquina: "{{ vm }}"
            modo: "{{ modo }}"
            destino: "{{ destino }}"
            red_origen: "{{ sit.RED | default('') }}"
            red_actual: "{{ red_dst if modo == 'mover' else ((r_rev.stdout_lines | default([]) | select('match', '^RED=') | first | default('RED=')) | regex_replace('^RED=', '') if modo == 'revertir' else '') }}"
            gb: "{{ gb | default(0) }}"
            minutos_estimados: "{{ (((gb | default(0) | float) / 0.5 / 60) + 3) | round(0) | int }}"
            ip: "{{ (r_ip.stdout | default('') | trim) if modo == 'mover' else ((r_rev.stdout_lines | default([''])) | reject('match', '^RED=') | list | last | default('') if modo == 'revertir' else '') }}"
            responde: "{{ (r_resp is defined and r_resp is succeeded) if modo == 'mover' else '' }}"
