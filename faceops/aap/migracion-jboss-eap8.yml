---
# Migración · JBoss a EAP 8: lleva aplicaciones de JBoss AS 5/6 o JBoss EAP 6/7 a JBoss EAP 8 (Jakarta EE 10).
#   evaluar (solo lectura): en el ORIGEN detecta la versión, las aplicaciones desplegadas, los datasources y la JVM;
#            analiza cada aplicación contra EAP 8 (reglas equivalentes a MTA: javax → jakarta, descriptores de JBoss 5,
#            EJB 2.x, Seam 2, Hibernate 3, log4j 1, JNDI) y deja el informe en informes/<origen>/evaluacion.md (y en
#            FaceOps, también en Git). Los datasources se leen de copias sin contraseñas.
#   emular-origen: SOLO laboratorio; deja en el origen una estructura de EAP 7.4 (standalone.xml con datasource y dos
#            aplicaciones de ejemplo, una que no despliega) para probar el camino EAP 6/7 sin instalar EAP 7.
#   migrar:  además transforma cada aplicación a Jakarta EE 10 (Eclipse Transformer), crea los datasources en el DESTINO
#            con jboss-cli, despliega y verifica que responda; si no responde, la retira. El origen no se toca.
# Variables: mj_modo (evaluar | migrar), mj_destino (equipo con EAP 8, para migrar), mj_apps (opcional: nombres separados
#            por coma; vacío = todas), mj_jboss_home (opcional: si no se detecta solo), mj_eap_home (EAP 8 del destino;
#            por defecto el de RPM, /opt/rh/eap8/root/usr/share/wildfly), mj_informes (carpeta de informes),
#            mj_ds_clave (clave de los datasources en EAP 8; mejor por variable de entorno o vault que en la línea)
- name: Laboratorio · emular un origen JBoss EAP 7.4 (mj_modo emular-origen; solo laboratorio, no instala EAP 7)
  hosts: "all:!{{ mj_destino | default('ninguno') }}"
  become: true
  gather_facts: false
  tasks:
    - name: Solo en modo emular-origen
      ansible.builtin.meta: end_play
      when: (mj_modo | default('evaluar')) != 'emular-origen'
    - name: Estructura de EAP 7.4 con un datasource y dos aplicaciones (inventario-eap7 sana, app-rota que no despliega)
      ansible.builtin.shell: |
        set -e; H={{ mj_jboss_home | default('/opt/jboss-eap-7.4') }}
        mkdir -p $H/bin $H/standalone/configuration $H/standalone/deployments
        [ -f $H/.faceops-emulado ] && { echo "ya emulado"; exit 0; }
        echo "Red Hat JBoss Enterprise Application Platform - Version 7.4.0.GA" > $H/version.txt
        printf '#!/bin/sh\necho "EAP 7.4 emulado por FaceOps (laboratorio): no arranca"\n' > $H/bin/standalone.sh; chmod 755 $H/bin/standalone.sh
        cat > $H/standalone/configuration/standalone.xml <<'X'
        <?xml version="1.0" ?>
        <server xmlns="urn:jboss:domain:16.0"><profile><subsystem xmlns="urn:jboss:domain:datasources:6.0"><datasources>
          <datasource jndi-name="java:jboss/datasources/ExampleDS" pool-name="ExampleDS"><connection-url>jdbc:h2:mem:test</connection-url><driver>h2</driver></datasource>
          <datasource jndi-name="java:jboss/datasources/InventarioDS" pool-name="InventarioDS" enabled="true">
            <connection-url>jdbc:h2:mem:inventario;DB_CLOSE_DELAY=-1</connection-url><driver>h2</driver>
            <pool><min-pool-size>2</min-pool-size><max-pool-size>10</max-pool-size></pool>
            <security><user-name>sa</user-name><password>clave-emulada</password></security>
          </datasource>
        </datasources></subsystem></profile></server>
        X
        python3 - "$H/standalone/deployments" <<'Y'
        import sys, zipfile
        d = sys.argv[1]
        wx = ('<?xml version="1.0" encoding="UTF-8"?>\n<web-app xmlns="http://xmlns.jcp.org/xml/ns/javaee" version="3.1">'
              '<resource-ref><res-ref-name>jdbc/Inventario</res-ref-name><res-type>javax.sql.DataSource</res-type></resource-ref></web-app>\n')
        jsp = ('<%@ page import="javax.naming.InitialContext, javax.sql.DataSource" %><%\n'
               'DataSource ds = (DataSource) new InitialContext().lookup("java:jboss/datasources/InventarioDS");\n'
               'try (java.sql.Connection c = ds.getConnection()) { out.print("inventario-eap7 ok · " + c.getMetaData().getDatabaseProductName()); } %>\n')
        with zipfile.ZipFile(f"{d}/inventario-eap7.war", "w") as z:
            z.writestr("WEB-INF/web.xml", wx); z.writestr("index.jsp", jsp)
            z.writestr("WEB-INF/jboss-web.xml", '<jboss-web><context-root>/inventario-eap7</context-root></jboss-web>\n')
        with zipfile.ZipFile(f"{d}/app-rota.war", "w") as z:   # descriptor inválido: EAP 8 no la despliega (camino de vuelta atrás)
            z.writestr("WEB-INF/web.xml", "<web-app><servlet><servlet-name>x</servlet-name><servlet-class>no.Existe</servlet-class>"); z.writestr("index.html", "rota")
        Y
        date -Is > $H/.faceops-emulado; echo emulado
      register: r_emu
      changed_when: "'emulado' in r_emu.stdout and 'ya emulado' not in r_emu.stdout"
    - name: Resultado para FaceOps
      ansible.builtin.set_stats:
        data:
          faceops_migracion_jboss: {origen: "{{ inventory_hostname }}", emulado: "{{ mj_jboss_home | default('/opt/jboss-eap-7.4') }}", estado: "{{ r_emu.stdout_lines | last }}"}

- name: Origen · lo que corre en JBoss
  hosts: "all:!{{ mj_destino | default('ninguno') }}"
  become: true
  gather_facts: false
  vars:
    modo: "{{ mj_modo | default('evaluar') }}"
  tasks:
    - name: En modo emular-origen no se evalúa
      ansible.builtin.meta: end_play
      when: modo == 'emular-origen'

    - name: Datos
      ansible.builtin.assert:
        that:
          - modo in ['evaluar', 'migrar', 'emular-origen']
          - modo == 'evaluar' or (mj_destino | default('') | length > 0)
        fail_msg: "Modo evaluar o migrar; para migrar indica el equipo de destino con JBoss EAP 8"
        quiet: true
      run_once: true

    - name: Ubicar JBoss (JBOSS_HOME)
      ansible.builtin.shell: |
        set -o pipefail
        for d in {{ mj_jboss_home | default('') }} $(ls -d /opt/jboss* /opt/*/jboss* /usr/share/jboss* /srv/jboss* /opt/rh/eap*/root/usr/share/wildfly 2>/dev/null); do
          [ -d "$d/bin" ] || continue
          if [ -f "$d/bin/run.jar" ]; then
            v=$( (unzip -p "$d/bin/run.jar" META-INF/MANIFEST.MF 2>/dev/null || python3 -c "import zipfile,sys; print(zipfile.ZipFile(sys.argv[1]).read('META-INF/MANIFEST.MF').decode())" "$d/bin/run.jar" 2>/dev/null) | awk -F'Implementation-Version: ' '/Implementation-Version/{print $2; exit}' | sed 's/ (.*//' | tr -d '\r')
            echo "{\"home\": \"$d\", \"familia\": \"as5-6\", \"version\": \"${v:-desconocida}\"}"; exit 0
          fi
          if [ -f "$d/bin/standalone.sh" ] && [ "$d" != "/opt/rh/eap8/root/usr/share/wildfly" ]; then
            v=$(cat "$d/version.txt" 2>/dev/null | head -1 | tr -d '\r')
            [ -z "$v" ] && v=$(ls $d/modules/system/layers/base/org/jboss/as/server/main/ $d/modules/org/jboss/as/server/main/ 2>/dev/null | sed -n 's/^jboss-as-server-\(.*\)\.jar$/JBoss AS \1/p' | head -1)
            echo "{\"home\": \"$d\", \"familia\": \"eap6-7\", \"version\": \"${v:-desconocida}\"}"; exit 0
          fi
        done
        echo '{"home": ""}'
      register: r_home
      changed_when: false

    - name: JBoss encontrado
      ansible.builtin.assert:
        that: [(r_home.stdout | from_json).home | length > 0]
        fail_msg: "No se encontró una instalación de JBoss AS 5/6 o EAP 6/7 en {{ inventory_hostname }} (indícala en mj_jboss_home)"
        quiet: true

    - name: Aplicaciones, datasources y JVM
      ansible.builtin.shell: |
        H={{ jb.home }}
        if [ "{{ jb.familia }}" = "as5-6" ]; then
          for s in $H/server/*/; do p=$(basename $s); [ -d $s/deploy ] || continue
            for a in $(ls -d $s/deploy/*.war $s/deploy/*.ear 2>/dev/null); do echo "app|$p|$a"; done
            for x in $(ls $s/deploy/*-ds.xml 2>/dev/null); do echo "ds|$p|$x"; done
          done
        else
          for a in $(ls -d $H/standalone/deployments/*.war $H/standalone/deployments/*.ear 2>/dev/null); do echo "app|standalone|$a"; done
          c=$(ps -eo args | grep -m1 -E 'jboss-modules' | grep -oE -- '--server-config=[^ ]+|-c [^ ]+' | sed 's/.*[= ]//')
          echo "ds|standalone|$H/standalone/configuration/${c:-standalone.xml}"
        fi
        ps -eo args | grep -m1 -E 'org.jboss.Main|jboss-modules' | grep -oE -- '-X(mx|ms)[^ ]+|-XX:MaxPermSize=[^ ]+' | tr '\n' ' ' | sed 's/^/jvm|-|/'; echo
        java -version 2>&1 | head -1 | sed 's/^/java|-|/'
      register: r_inv
      changed_when: false
      vars:
        jb: "{{ r_home.stdout | from_json }}"

    - name: Inventario del origen
      ansible.builtin.set_fact:
        jb: "{{ r_home.stdout | from_json }}"
        apps: "{{ r_inv.stdout_lines | select('match', '^app\\|') | map('split', '|') | map('last') | list
                  | select('search', mj_filtro) | list }}"
        dss: "{{ r_inv.stdout_lines | select('match', '^ds\\|') | map('split', '|') | map('last') | list }}"
        jvm: "{{ (r_inv.stdout_lines | select('match', '^jvm\\|') | first | default('jvm|-|')).split('|')[2] | trim }}"
        java_origen: "{{ (r_inv.stdout_lines | select('match', '^java\\|') | first | default('java|-|')).split('|')[2] | trim }}"
      vars:
        mj_lista: "{{ (mj_apps | default([])) if (mj_apps | default('')) is not string else ((mj_apps | default('')) | split(',')) }}"
        mj_filtro: "{{ '(' ~ ((mj_lista | map('trim') | reject('equalto', '') | map('regex_escape') | list) | join('|') or '.') ~ ')' }}"

    - name: Hay aplicaciones para migrar
      ansible.builtin.assert:
        that: [apps | length > 0]
        fail_msg: "{{ inventory_hostname }}: JBoss {{ jb.version }} en {{ jb.home }} no tiene aplicaciones desplegadas{{ ' que calcen con ' ~ mj_apps if mj_apps | default('') else '' }}"
        quiet: true

    - name: Copias de los datasources sin contraseñas (solo eso sale del servidor)
      ansible.builtin.shell: |
        set -e; d=/tmp/faceops-mj-ds; rm -rf $d; mkdir -m 0700 $d
        {% for x in dss %}sed -e 's:<password>[^<]*</password>:<password/>:g' -e 's/password="[^"]*"/password=""/g' {{ x | quote }} > $d/{{ loop.index }}-{{ x | basename }}
        {% endfor %}ls $d
      register: r_dss
      changed_when: false

    - name: Traer aplicaciones y datasources para analizarlos
      ansible.builtin.fetch:
        src: "{{ item }}"
        dest: "/tmp/faceops-mj/{{ inventory_hostname }}/"
        flat: true
      loop: "{{ apps + (r_dss.stdout_lines | map('regex_replace', '^', '/tmp/faceops-mj-ds/') | list) }}"

    - name: Datasources analizados (copias sin contraseñas)
      ansible.builtin.set_fact:
        dss: "{{ r_dss.stdout_lines }}"

    - name: Borrar las copias del servidor
      ansible.builtin.file: {path: /tmp/faceops-mj-ds, state: absent}

- name: Análisis frente a EAP 8 e informe (archivo local y, en FaceOps, Git)
  hosts: "all:!{{ mj_destino | default('ninguno') }}"
  connection: local
  gather_facts: false
  vars:
    gitea: "{{ faceops_gitea | default('http://192.168.122.1:3000') }}"
    dirl: "/tmp/faceops-mj/{{ inventory_hostname }}"
  tasks:
    - name: En modo emular-origen no hay análisis
      ansible.builtin.meta: end_play
      when: (mj_modo | default('evaluar')) == 'emular-origen'

    - name: Analizar cada aplicación
      ansible.builtin.command:
        argv: "{{ ['python3', playbook_dir ~ '/files/jboss_eap8_analizar.py', dirl ~ '/' ~ (item | basename)] + (dss | map('basename') | map('regex_replace', '^', dirl ~ '/') | list) }}"
      loop: "{{ apps }}"
      register: r_an
      changed_when: false

    - name: Resultado del análisis
      ansible.builtin.set_fact:
        analisis: "{{ r_an.results | map(attribute='stdout') | map('from_json') | list }}"

    - name: Informe de evaluación (informes/<origen>/evaluacion.md y, con FaceOps, repositorio/migraciones-jboss en Git)
      ansible.builtin.shell: |
        python3 - <<'P'
        import base64, json, os, urllib.request
        a = json.loads(os.environ["A"]); h = os.environ["H"]; jb = json.loads(os.environ["JB"])
        L = [f"# Evaluación de migración a JBoss EAP 8 · {h}", "",
             f"- Origen: JBoss {jb.get('version')} ({jb.get('familia')}) en `{jb.get('home')}`",
             f"- JVM: {os.environ.get('JVM') or '—'} · {os.environ.get('JAVA') or '—'}",
             f"- Destino: JBoss EAP 8 (Jakarta EE 10, Java 17/21)",
             f"- Evaluación: {os.environ.get('TK') or 'manual'} · {os.environ.get('FECHA') or ''}", ""]
        for x in a:
            L += [f"## {x['aplicacion']} · complejidad {x['complejidad']} · {x['puntos']} puntos de esfuerzo",
                  f"{'Migrable de forma automática (transformación javax → jakarta).' if x['migrable_automatico'] else 'Requiere cambios de código antes de migrar.'}", "",
                  "| Severidad | Regla | Ocurrencias | Acción |", "|---|---|---|---|"]
            L += [f"| {f['severidad']} | {f['titulo']} | {f['ocurrencias']} | {f['accion']} |" for f in x["hallazgos"]] or ["| — | sin hallazgos | — | — |"]
            if x["datasources"]:
                L += ["", "Datasources (EAP 8, jboss-cli):", ""] + [f"- `{d['jndi_jboss5']}` → `{d['jndi_eap8']}` · `{d['cli']}`" for d in x["datasources"]]
            L.append("")
        txt = "\n".join(L)
        loc = os.path.join(os.environ["INF"], h)
        os.makedirs(loc, exist_ok=True)
        open(os.path.join(loc, "evaluacion.md"), "w", encoding="utf-8").write(txt)
        print("local ok " + os.path.join(loc, "evaluacion.md"))
        if not os.environ.get("T"):
            raise SystemExit(0)
        api = os.environ["G"] + "/api/v1/repos/repositorio/migraciones-jboss/contents/"
        ruta = f"{h}/evaluacion.md"
        hd = {"Authorization": "token " + os.environ["T"], "Content-Type": "application/json"}
        sha = None
        try:
            sha = json.load(urllib.request.urlopen(urllib.request.Request(api + ruta, headers=hd), timeout=20)).get("sha")
        except Exception:
            pass
        body = {"content": base64.b64encode(txt.encode()).decode(), "message": f"{h}: evaluación de migración a EAP 8 ({os.environ.get('TK') or 'manual'})"}
        if sha:
            body["sha"] = sha
        try:
            urllib.request.urlopen(urllib.request.Request(api + ruta, data=json.dumps(body).encode(), headers=hd, method="PUT" if sha else "POST"), timeout=30)
            print("git ok " + ruta)
        except Exception as x:
            print("git sin publicar: " + str(x)[:160])
        P
      environment:
        A: "{{ analisis | to_json }}"
        H: "{{ inventory_hostname }}"
        JB: "{{ jb | to_json }}"
        JVM: "{{ jvm }}"
        JAVA: "{{ java_origen }}"
        G: "{{ gitea }}"
        T: "{{ faceops_respaldo_token | default('') }}"
        TK: "{{ faceops_ticket | default('') }}"
        FECHA: "{{ lookup('pipe', 'date +%Y-%m-%dT%H:%M') }}"
        INF: "{{ mj_informes | default(playbook_dir ~ '/informes') }}"
      register: r_git
      changed_when: "'git ok' in r_git.stdout"

- name: Destino · transformar, desplegar y verificar en EAP 8
  hosts: "{{ mj_destino | default('ninguno') }}"
  become: true
  gather_facts: false
  vars:
    origen: "{{ ansible_play_hosts_all | difference([inventory_hostname]) | first | default(groups['all'] | difference([inventory_hostname]) | first) }}"
    eap: "{{ mj_eap_home | default('/opt/rh/eap8/root/usr/share/wildfly') }}"
    cli: "{{ eap }}/bin/jboss-cli.sh -c --controller=localhost:9990"
  tasks:
    - name: Solo en modo migrar
      ansible.builtin.meta: end_play
      when: (mj_modo | default('evaluar')) != 'migrar'

    - name: Origen del análisis
      ansible.builtin.set_fact:
        src: "{{ (groups['all'] | reject('equalto', inventory_hostname) | list + [inventory_hostname]) | map('extract', hostvars) | selectattr('analisis', 'defined') | first }}"

    - name: JBoss EAP 8 en el destino
      ansible.builtin.stat: {path: "{{ eap }}/bin/jboss-cli.sh"}
      register: r_eap

    - name: Hay EAP 8
      ansible.builtin.assert:
        that: [r_eap.stat.exists]
        fail_msg: "{{ inventory_hostname }} no tiene JBoss EAP 8 en {{ eap }} (indícalo en mj_eap_home o, en FaceOps, «JBoss · Preparar servidor»)"
        quiet: true

    - name: Eclipse Transformer (javax → jakarta), una vez por destino
      ansible.builtin.shell: |
        d=/opt/faceops/transformer; mkdir -p $d; cd $d
        [ -f transformer.jar ] && exit 0
        v=0.5.0; u=https://repo1.maven.org/maven2/org/eclipse/transformer
        curl -sfL -o cli.jar $u/org.eclipse.transformer.cli/$v/org.eclipse.transformer.cli-$v-distribution.jar || { echo "sin acceso a Maven Central"; exit 1; }
        python3 -c "import zipfile; zipfile.ZipFile('cli.jar').extractall('.')"
        ln -sf $(ls org.eclipse.transformer.cli-*.jar | grep -v distribution | head -1) transformer.jar && echo instalado
      register: r_tr
      changed_when: "'instalado' in r_tr.stdout"

    - name: Aplicaciones al destino
      ansible.builtin.copy:
        src: "/tmp/faceops-mj/{{ src.inventory_hostname }}/{{ item | basename }}"
        dest: "/opt/faceops/migracion/origen/"
        mode: "0644"
      loop: "{{ src.apps }}"

    - name: Transformar a Jakarta EE 10
      ansible.builtin.shell: |
        set -e; mkdir -p /opt/faceops/migracion/eap8; cd /opt/faceops/transformer
        a=/opt/faceops/migracion/origen/{{ item | basename }}; b=/opt/faceops/migracion/eap8/{{ item | basename }}
        rm -f "$b"; java -jar transformer.jar "$a" "$b" -o -q 2>&1 | tail -3; ls -l "$b"
      loop: "{{ src.apps }}"
      register: r_tf
      changed_when: true

    - name: Ajustar descriptores para EAP 8 (jboss-web.xml, web.xml, JNDI)
      ansible.builtin.script:
        cmd: "{{ playbook_dir }}/files/jboss_eap8_ajustar.py /opt/faceops/migracion/eap8/{{ item | basename }} '{{ jndi_map | to_json }}'"
        executable: python3
      loop: "{{ src.apps }}"
      vars:
        dss_: "{{ src.analisis | map(attribute='datasources') | flatten }}"
        jndi_map: >-
          {% set m = {} %}{% for d in dss_ %}{% set _ = m.update({'java:/' ~ d.jndi_jboss5: d.jndi_eap8, d.jndi_jboss5: d.jndi_eap8}) %}{% endfor %}{{ m }}
      register: r_aj
      changed_when: true

    - name: Driver JDBC de PostgreSQL en EAP 8 (si alguna aplicación lo usa)
      ansible.builtin.shell: |
        {{ cli }} --command="/subsystem=datasources/jdbc-driver=postgresql:read-resource" >/dev/null 2>&1 && { echo "ya existe"; exit 0; }
        rpm -q postgresql-jdbc >/dev/null 2>&1 || dnf -q -y install postgresql-jdbc >/dev/null 2>&1 || { echo "sin paquete postgresql-jdbc"; exit 0; }
        J=$(ls /usr/share/java/postgresql-jdbc.jar /usr/share/java/postgresql-jdbc/postgresql.jar 2>/dev/null | head -1)
        {{ cli }} --command="module add --name=org.postgresql --resources=$J --dependencies=jakarta.api,jakarta.transaction.api" 2>&1 | tail -1
        {{ cli }} --command="/subsystem=datasources/jdbc-driver=postgresql:add(driver-name=postgresql,driver-module-name=org.postgresql,driver-class-name=org.postgresql.Driver,driver-xa-datasource-class-name=org.postgresql.xa.PGXADataSource)" && echo instalado
      when: (src.analisis | map(attribute='datasources') | flatten | selectattr('driver', 'equalto', 'postgresql') | list | length) > 0
      register: r_drv
      changed_when: "'instalado' in r_drv.stdout"
      failed_when: false

    - name: Datasources en EAP 8 (los que tengan driver instalado)
      ansible.builtin.shell: |
        {{ cli }} --command="/subsystem=datasources/jdbc-driver={{ item.driver }}:read-resource" >/dev/null 2>&1 || { echo "pendiente: falta el driver JDBC {{ item.driver }} en EAP 8"; exit 0; }
        {{ cli }} --command="/subsystem=datasources/data-source={{ item.nombre }}:read-resource" >/dev/null 2>&1 && { echo "ya existe"; exit 0; }
        # la clave entra desde DS_CLAVE (nunca en la línea del playbook); el ${env.…} del análisis no lo expande el shell
        c=$(printf '%s' {{ item.cli | quote }} | awk '{for (i = 1; i <= NF; i++) if ($i ~ /^--password=/) $i = "--password=" ENVIRON["DS_CLAVE"]; print}')
        out=$({{ cli }} --command="$c" 2>&1); rc=$?
        [ $rc -eq 0 ] && echo creado || { echo "no se pudo crear: $(echo "$out" | tail -2 | sed "s/$DS_CLAVE/***/g")"; exit 1; }
      environment: {DS_CLAVE: "{{ mj_ds_clave | default('cambiar') }}"}
      loop: "{{ src.analisis | map(attribute='datasources') | flatten | unique(attribute='nombre') }}"
      loop_control: {label: "{{ item.jndi_eap8 }}"}
      register: r_ds
      changed_when: "'creado' in r_ds.stdout"
      failed_when: false

    - name: Desplegar
      ansible.builtin.command: "{{ cli }} --command='deploy /opt/faceops/migracion/eap8/{{ item | basename }} --force'"
      loop: "{{ src.apps }}"
      register: r_dep
      changed_when: true
      failed_when: false

    - name: Verificar que responde (HTTP)
      ansible.builtin.uri:
        url: "http://127.0.0.1:8080/{{ (item | basename | splitext | first) }}/"
        status_code: [200, 301, 302, 401, 403]
        timeout: 20
      loop: "{{ src.apps | select('search', '\\.war$') | list }}"
      register: r_http
      retries: 6
      delay: 5
      until: r_http.status in [200, 301, 302, 401, 403]
      failed_when: false

    - name: Retirar lo que no respondió (el origen sigue intacto)
      ansible.builtin.command: "{{ cli }} --command='undeploy {{ item.item | basename }}'"
      loop: "{{ r_http.results | rejectattr('status', 'in', [200, 301, 302, 401, 403]) | list }}"
      loop_control: {label: "{{ item.item | basename }}"}
      changed_when: true
      failed_when: false   # si el despliegue no llegó a quedar, no hay nada que retirar

    - name: La migración dejó todas las aplicaciones respondiendo
      ansible.builtin.assert:
        that:
          - "r_http.results | rejectattr('status', 'in', [200, 301, 302, 401, 403]) | list | length == 0"
        fail_msg: "{{ r_http.results | rejectattr('status', 'in', [200, 301, 302, 401, 403]) | map(attribute='item') | map('basename') | join(', ') }} no respondió en EAP 8 y se retiró; el origen sigue intacto. Detalle del despliegue: {{ r_dep.results | map(attribute='stdout') | join(' · ') | regex_replace('\\s+', ' ') | truncate(600) }}"
        quiet: true
      ignore_errors: true
      register: r_ok

    - name: Resultado de la migración
      ansible.builtin.set_fact:
        migradas: "{{ r_http.results | selectattr('status', 'in', [200, 301, 302, 401, 403]) | map(attribute='item') | map('basename') | list }}"
        fallidas: "{{ r_http.results | rejectattr('status', 'in', [200, 301, 302, 401, 403]) | map(attribute='item') | map('basename') | list }}"
        ajustes: "{{ r_aj.results | map(attribute='stdout_lines') | flatten }}"
        ds_estado: "{{ r_ds.results | map(attribute='item') | map(attribute='jndi_eap8') | zip(r_ds.results | map(attribute='stdout') | map('regex_replace', '\\n.*', '')) | map('join', ': ') | list }}"

- name: Resumen
  hosts: "all:!{{ mj_destino | default('ninguno') }}"
  # corre aunque el destino haya fallado: el resumen dice qué quedó y qué no
  connection: local
  gather_facts: false
  tasks:
    - name: En modo emular-origen no hay análisis
      ansible.builtin.meta: end_play
      when: (mj_modo | default('evaluar')) == 'emular-origen'

    - name: Resultado para FaceOps
      ansible.builtin.set_stats:
        data:
          faceops_migracion_jboss:
            origen: "{{ inventory_hostname }}"
            jboss: "{{ jb.version }}"
            aplicaciones: "{{ analisis | map(attribute='aplicacion') | list }}"
            puntos: "{{ analisis | map(attribute='puntos') | sum }}"
            destino: "{{ mj_destino | default('') }}"
            migradas: "{{ hostvars[mj_destino].migradas | default([]) if mj_destino | default('') else [] }}"
            fallidas: "{{ hostvars[mj_destino].fallidas | default([]) if mj_destino | default('') else [] }}"
      when: analisis is defined

    - name: Resumen
      ansible.builtin.debug:
        msg: >-
          {{ ['Origen ' ~ inventory_hostname ~ ' · JBoss ' ~ jb.version ~ ' · ' ~ analisis | length ~ ' aplicación(es) · informe: '
               ~ (faceops_gitea | default('http://192.168.122.1:3000')) ~ '/repositorio/migraciones-jboss/src/branch/main/' ~ inventory_hostname ~ '/evaluacion.md']
             + (analisis | map(attribute='aplicacion') | zip(analisis | map(attribute='complejidad'), analisis | map(attribute='puntos'),
                 analisis | map(attribute='migrable_automatico') | map('ternary', 'migrable automático', 'requiere cambios de código')) | map('join', ' · ') | list)
             + ((['Migradas a ' ~ mj_destino ~ ': ' ~ (hostvars[mj_destino].migradas | default([]) | join(', ') or 'ninguna'),
                  'Retiradas por no responder: ' ~ (hostvars[mj_destino].fallidas | default([]) | join(', ') or 'ninguna')]
                  + (hostvars[mj_destino].ajustes | default([]) | map('regex_replace', '^', 'Ajuste: ') | list)
                  + (hostvars[mj_destino].ds_estado | default([]) | map('regex_replace', '^', 'Datasource ') | list)) if (mj_modo | default('evaluar')) == 'migrar' else []) }}
      when: analisis is defined

    - name: La migración falla si alguna aplicación no quedó respondiendo (ya se retiró del destino; el origen sigue intacto)
      ansible.builtin.fail:
        msg: "No quedaron respondiendo en {{ mj_destino }}: {{ hostvars[mj_destino].fallidas | join(', ') }} (se retiraron del destino; el origen sigue intacto)"
      when: analisis is defined and (mj_modo | default('evaluar')) == 'migrar' and mj_destino | default('') and (hostvars[mj_destino].fallidas | default([]) | length > 0)
