---
# OpenShift · Respaldo de etcd (T-01 de la guía de regularización, versión del 30-10-2026), por la API del clúster
# (credencial con permisos de administración). Propaga la convención del único CronJob que corre limpio en el parque
# (etcd-backup en el namespace etcd-backup, 0 2 * * *, con historial de ejecuciones acotado): corre cluster-backup.sh en un
# nodo de control (snapshot de etcd + recursos estáticos), conserva N días en el nodo y sube cada respaldo FUERA del
# clúster, al registro de paquetes de Git (paquete genérico etcd-<clúster>).
# Modos (et_modo):
#   estado:           todo CronJob con «etcd» en el NOMBRE (el sync de API Connect no cuenta, T-14) y cuántas de sus
#                     últimas cinco ejecuciones terminaron completas (solo lectura)
#   aplicar:          crea o actualiza el CronJob (no reinicia nada); si quedó el de la convención anterior de FaceOps
#                     (ocp-etcd-backup en openshift-etcd), lo retira para no respaldar dos veces
#   probar:           dispara una ejecución ahora y confirma que el log nombra los dos archivos y que quedaron fuera
#   ensayo-preparar:  prueba de restauración, paso 1 (NO en productivos): toma un respaldo, crea el proyecto
#                     prueba-restauracion-<mes> y deja la hora en Git. Después se restaura con el procedimiento de Red Hat
#   ensayo-verificar: paso 2: confirma que el proyecto de prueba ya no existe (la restauración volvió al punto del
#                     respaldo) y registra en Git el tiempo total, que es el tiempo de recuperación que se informa
#   retirar:          elimina el CronJob (no afecta nada en ejecución)
# Variables: et_modo, et_horario (0 2 * * *), et_retencion_dias (7), et_namespace (etcd-backup), et_confirmar (para el
# ensayo: el nombre del clúster, como confirmación de que no es productivo)
- name: OpenShift · Respaldo de etcd
  hosts: all
  connection: local
  gather_facts: false
  vars:
    api: "{{ lookup('ansible.builtin.env', 'K8S_AUTH_HOST') | default(openshift.api | default(''), true) | regex_replace('/$', '') }}"
    h: {Authorization: "Bearer {{ lookup('ansible.builtin.env', 'K8S_AUTH_API_KEY') }}", Accept: application/json}
    hj: "{{ h | combine({'Content-Type': 'application/json'}) }}"
    ns: "{{ et_namespace | default('etcd-backup') }}"
    cj_n: etcd-backup
    modo: "{{ et_modo | default('estado') }}"
    horario: "{{ et_horario | default('0 2 * * *', true) }}"
    marca: "prueba-restauracion-{{ now(utc=true).strftime('%Y%m') }}"
    hg: {Authorization: "token {{ faceops_respaldo_token | default('') }}", Content-Type: application/json}
    ruta_ensayo: "{{ inventory_hostname }}/ensayo-restauracion.json"
    retencion: "{{ et_retencion_dias | default(7) | int }}"
    gitea: "{{ faceops_gitea | default('http://192.168.122.1:3000') }}"
    paquete: "etcd-{{ inventory_hostname }}"
  tasks:
    - name: Datos
      ansible.builtin.assert:
        that:
          - modo in ['estado', 'aplicar', 'probar', 'ensayo-preparar', 'ensayo-verificar', 'retirar']
          - modo not in ['ensayo-preparar', 'ensayo-verificar'] or (et_confirmar | default('')) == inventory_hostname
          - horario is match('^[0-9*,/-]+( [0-9*,/-]+){4}$')
          - retencion | int >= 1
        fail_msg: "Modo: estado, aplicar, probar, ensayo-preparar, ensayo-verificar o retirar; horario cron de 5 campos; retención ≥ 1 día; el ensayo de restauración exige escribir el nombre del clúster en «confirmar» (nunca en un productivo)"
        quiet: true

    - name: Estado actual
      ansible.builtin.uri: {url: "{{ api }}/apis/batch/v1/namespaces/{{ ns }}/cronjobs/{{ cj_n }}", headers: "{{ h }}", validate_certs: false, status_code: [200, 404]}
      register: r_cj

    # ---------- aplicar ----------
    - name: Imagen de herramientas del propio clúster (oc/cli de la versión instalada)
      ansible.builtin.uri: {url: "{{ api }}/apis/image.openshift.io/v1/namespaces/openshift/imagestreams/cli", headers: "{{ h }}", validate_certs: false}
      register: r_cli
      when: modo == 'aplicar'

    - name: Namespace, cuenta de servicio, permiso privilegiado (solo en ese namespace) y destino fuera del clúster
      ansible.builtin.uri:
        url: "{{ api }}{{ item.url }}?fieldManager=faceops&force=true"
        method: PATCH
        headers: "{{ h | combine({'Content-Type': 'application/apply-patch+yaml'}) }}"
        body_format: raw
        body: "{{ item.obj | to_json }}"
        validate_certs: false
        status_code: [200, 201]
      loop:
        - url: /api/v1/namespaces/{{ ns }}
          obj: {apiVersion: v1, kind: Namespace, metadata: {name: "{{ ns }}", labels: {app.kubernetes.io/managed-by: faceops, openshift.io/cluster-monitoring: "false"}}}
        - url: /api/v1/namespaces/{{ ns }}/serviceaccounts/etcd-respaldo
          obj: {apiVersion: v1, kind: ServiceAccount, metadata: {name: etcd-respaldo, namespace: "{{ ns }}", labels: {app.kubernetes.io/managed-by: faceops}}}
        - url: /apis/rbac.authorization.k8s.io/v1/namespaces/{{ ns }}/rolebindings/etcd-respaldo-privilegiado
          obj: {apiVersion: rbac.authorization.k8s.io/v1, kind: RoleBinding,
                metadata: {name: etcd-respaldo-privilegiado, namespace: "{{ ns }}", labels: {app.kubernetes.io/managed-by: faceops}},
                roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: "system:openshift:scc:privileged"},
                subjects: [{kind: ServiceAccount, name: etcd-respaldo, namespace: "{{ ns }}"}]}
        - url: /api/v1/namespaces/{{ ns }}/secrets/etcd-respaldo-destino
          obj: {apiVersion: v1, kind: Secret, type: Opaque, metadata: {name: etcd-respaldo-destino, namespace: "{{ ns }}", labels: {app.kubernetes.io/managed-by: faceops}},
                stringData: {URL: "{{ gitea }}/api/packages/repositorio/generic/{{ paquete }}", TOKEN: "{{ faceops_respaldo_token | default('') }}"}}
      loop_control: {label: "{{ item.obj.kind }} {{ item.obj.metadata.name }}"}
      no_log: "{{ item.obj.kind == 'Secret' }}"
      when: modo == 'aplicar'

    - name: CronJob {{ cj_n }} en {{ ns }} ({{ horario }}, {{ retencion }} días en el nodo)
      ansible.builtin.uri:
        url: "{{ api }}/apis/batch/v1/namespaces/{{ ns }}/cronjobs/{{ cj_n }}?fieldManager=faceops&force=true"
        method: PATCH
        headers: "{{ h | combine({'Content-Type': 'application/apply-patch+yaml'}) }}"
        body_format: raw
        body: "{{ cj | to_json }}"
        validate_certs: false
        status_code: [200, 201]
      vars:
        imagen: "{{ (r_cli.json.status.tags | selectattr('tag', 'equalto', 'latest') | first)['items'][0].dockerImageReference }}"
        script: |
          set -euo pipefail
          D=/home/core/backup/$(date -u +%Y%m%d-%H%M%S)
          chroot /host /usr/local/bin/cluster-backup.sh "$D"
          chroot /host find /home/core/backup -mindepth 1 -maxdepth 1 -type d -mtime +{{ retencion }} -exec rm -rf {} +
          V=$(basename "$D")
          for f in $(chroot /host ls "$D"); do
            chroot /host curl -sS -f -m 600 -X PUT -H "Authorization: token ${TOKEN}" -T "$D/$f" "${URL}/${V}/${f}" >/dev/null
            echo "fuera del clúster: ${URL##*/generic/}/${V}/${f}"
          done
          chroot /host ls -l "$D"
        cj:
          apiVersion: batch/v1
          kind: CronJob
          metadata: {name: "{{ cj_n }}", namespace: "{{ ns }}", labels: {app.kubernetes.io/managed-by: faceops}}
          spec:
            schedule: "{{ horario }}"
            concurrencyPolicy: Forbid
            successfulJobsHistoryLimit: 5
            failedJobsHistoryLimit: 5
            jobTemplate:
              spec:
                backoffLimit: 0
                activeDeadlineSeconds: 1800
                template:
                  metadata: {labels: {app: etcd-backup}}
                  spec:
                    serviceAccountName: etcd-respaldo
                    restartPolicy: Never
                    hostNetwork: true
                    hostPID: true
                    nodeSelector: {node-role.kubernetes.io/master: ""}
                    tolerations: [{operator: Exists}]
                    priorityClassName: system-cluster-critical
                    containers:
                      - name: respaldo
                        image: "{{ imagen }}"
                        command: [/bin/bash, -c, "{{ script }}"]
                        envFrom: [{secretRef: {name: etcd-respaldo-destino}}]
                        securityContext: {privileged: true, runAsUser: 0}
                        resources: {requests: {cpu: 10m, memory: 64Mi}}
                        volumeMounts: [{name: host, mountPath: /host}]
                    volumes: [{name: host, hostPath: {path: /, type: Directory}}]
      when: modo == 'aplicar'

    - name: Retirar el CronJob de la convención anterior de FaceOps (openshift-etcd/ocp-etcd-backup)
      ansible.builtin.uri:
        url: "{{ api }}/apis/batch/v1/namespaces/openshift-etcd/cronjobs/ocp-etcd-backup"
        method: DELETE
        headers: "{{ h }}"
        validate_certs: false
        status_code: [200, 202, 404]
      when: modo == 'aplicar' and ns != 'openshift-etcd'

    # ---------- probar ----------
    - name: Hay CronJob para probar
      ansible.builtin.assert:
        that: [r_cj.status == 200]
        fail_msg: "{{ inventory_hostname }} no tiene CronJob de respaldo de etcd: primero el modo «aplicar»"
        quiet: true
      when: modo in ['probar', 'ensayo-preparar']

    - name: Ejecución de prueba ahora (desde el CronJob)
      ansible.builtin.uri:
        url: "{{ api }}/apis/batch/v1/namespaces/{{ ns }}/jobs"
        method: POST
        headers: "{{ hj }}"
        body_format: json
        body:
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: "etcd-backup-prueba-{{ now(utc=true).strftime('%m%d%H%M') }}"
            namespace: "{{ ns }}"
            labels: {app.kubernetes.io/managed-by: faceops}
            ownerReferences: [{apiVersion: batch/v1, kind: CronJob, name: "{{ cj_n }}", uid: "{{ r_cj.json.metadata.uid }}"}]
          spec: "{{ r_cj.json.spec.jobTemplate.spec }}"
        validate_certs: false
        status_code: [201]
      register: r_job
      when: modo in ['probar', 'ensayo-preparar']

    - name: Esperar a que termine (hasta 20 min)
      ansible.builtin.uri: {url: "{{ api }}/apis/batch/v1/namespaces/{{ ns }}/jobs/{{ r_job.json.metadata.name }}", headers: "{{ h }}", validate_certs: false}
      register: r_jw
      until: (r_jw.json.status.succeeded | default(0)) > 0 or (r_jw.json.status.failed | default(0)) > 0
      retries: 80
      delay: 15
      failed_when: false
      when: modo in ['probar', 'ensayo-preparar']

    - name: Pod de la ejecución
      ansible.builtin.uri:
        url: "{{ api }}/api/v1/namespaces/{{ ns }}/pods?labelSelector=job-name%3D{{ r_job.json.metadata.name }}"
        headers: "{{ h }}"
        validate_certs: false
      register: r_pod
      when: modo in ['probar', 'ensayo-preparar']

    - name: Log de la ejecución
      ansible.builtin.uri:
        url: "{{ api }}/api/v1/namespaces/{{ ns }}/pods/{{ r_pod.json['items'][0].metadata.name }}/log?tailLines=60"
        headers: "{{ h | combine({'Accept': '*/*'}) }}"
        return_content: true
        validate_certs: false
        status_code: [200, 400]
      register: r_log
      when: modo in ['probar', 'ensayo-preparar'] and (r_pod.json['items'] | default([])) | length > 0

    - name: Resultado de la prueba
      ansible.builtin.set_fact:
        prueba:
          job: "{{ r_job.json.metadata.name }}"
          completado: "{{ (r_jw.json.status.succeeded | default(0)) > 0 }}"
          snapshot: "{{ r_log.content | default('') is search('snapshot_[0-9_-]+\\.db') }}"
          estaticos: "{{ r_log.content | default('') is search('static_kuberesources_[0-9_-]+\\.tar\\.gz') }}"
          fuera: "{{ (r_log.content | default('') | regex_findall('fuera del clúster: .*') | length) >= 2 }}"
          log: "{{ (r_log.content | default('sin log')).split('\n')[-14:] }}"
      when: modo in ['probar', 'ensayo-preparar']

    # ---------- ensayo de restauración ----------
    - name: Ensayo · el respaldo de partida quedó utilizable
      ansible.builtin.assert:
        that: [prueba.completado | bool, prueba.snapshot | bool, prueba.estaticos | bool]
        fail_msg: "El respaldo de partida no es utilizable: no se prepara el ensayo"
        quiet: true
      when: modo == 'ensayo-preparar'

    - name: Ensayo · proyecto reconocible creado DESPUÉS del respaldo
      ansible.builtin.uri:
        url: "{{ api }}/apis/project.openshift.io/v1/projectrequests"
        method: POST
        headers: "{{ hj }}"
        body_format: json
        body: {apiVersion: project.openshift.io/v1, kind: ProjectRequest, metadata: {name: "{{ marca }}"},
               description: "FaceOps · ensayo de restauración: si este proyecto existe después de restaurar, la restauración no volvió al respaldo"}
        validate_certs: false
        status_code: [201, 409]
      when: modo == 'ensayo-preparar'

    - name: Ensayo · registro anterior en Git
      ansible.builtin.uri: {url: "{{ gitea }}/api/v1/repos/repositorio/openshift-manifiestos/contents/{{ ruta_ensayo }}", headers: "{{ hg }}", status_code: [200, 404]}
      register: r_ens
      no_log: true
      when: modo in ['ensayo-preparar', 'ensayo-verificar']

    - name: Ensayo · registro del respaldo y la hora de inicio en Git
      ansible.builtin.uri:
        url: "{{ gitea }}/api/v1/repos/repositorio/openshift-manifiestos/contents/{{ ruta_ensayo }}"
        method: "{{ 'PUT' if r_ens.status == 200 else 'POST' }}"
        headers: "{{ hg }}"
        body_format: json
        body: "{{ {'content': ({'cluster': inventory_hostname, 'inicio': now(utc=true).strftime('%Y-%m-%d %H:%M:%S'), 'respaldo': prueba.job, 'marca': marca, 'estado': 'preparado'} | to_nice_json) | b64encode,
                   'message': inventory_hostname ~ ': ensayo de restauración preparado (' ~ (faceops_ticket | default('manual')) ~ ')'}
                  | combine({'sha': r_ens.json.sha} if r_ens.status == 200 else {}) }}"
        status_code: [200, 201]
      no_log: true
      when: modo == 'ensayo-preparar'

    - name: Ensayo · hay un ensayo preparado
      ansible.builtin.assert:
        that: [r_ens.status == 200]
        fail_msg: "No hay ensayo preparado en Git para {{ inventory_hostname }}: primero «ensayo-preparar», luego restaurar con el procedimiento de Red Hat"
        quiet: true
      when: modo == 'ensayo-verificar'

    - name: Ensayo · el proyecto de prueba ya no debe existir
      ansible.builtin.uri:
        url: "{{ api }}/apis/project.openshift.io/v1/projects/{{ (r_ens.json.content | b64decode | from_json).marca }}"
        headers: "{{ h }}"
        validate_certs: false
        status_code: [200, 403, 404]
      register: r_marca
      when: modo == 'ensayo-verificar'

    - name: Ensayo · resultado
      ansible.builtin.set_fact:
        ensayo: "{{ previo | combine({'fin': now(utc=true).strftime('%Y-%m-%d %H:%M:%S'), 'restaurado': r_marca.status == 404,
                    'minutos': ((now(utc=true) - (previo.inicio | to_datetime('%Y-%m-%d %H:%M:%S'))).total_seconds() / 60) | round(0) | int,
                    'estado': 'verificado' if r_marca.status == 404 else 'NO restaurado'}) }}"
      vars:
        previo: "{{ r_ens.json.content | b64decode | from_json }}"
      when: modo == 'ensayo-verificar'

    - name: Ensayo · resultado y tiempo de recuperación a Git
      ansible.builtin.uri:
        url: "{{ gitea }}/api/v1/repos/repositorio/openshift-manifiestos/contents/{{ ruta_ensayo }}"
        method: PUT
        headers: "{{ hg }}"
        body_format: json
        body: {content: "{{ ensayo | to_nice_json | b64encode }}", sha: "{{ r_ens.json.sha }}",
               message: "{{ inventory_hostname }}: ensayo de restauración {{ ensayo.estado }} en {{ ensayo.minutos }} min ({{ faceops_ticket | default('manual') }})"}
        status_code: [200, 201]
      no_log: true
      when: modo == 'ensayo-verificar'

    - name: Ensayo · la restauración volvió al punto del respaldo
      ansible.builtin.assert:
        that: [ensayo.restaurado | bool]
        fail_msg: "El proyecto {{ ensayo.marca }} sigue existiendo: el clúster NO volvió al punto del respaldo"
        quiet: true
      when: modo == 'ensayo-verificar'

    # ---------- retirar ----------
    - name: Retirar el CronJob
      ansible.builtin.uri: {url: "{{ api }}/apis/batch/v1/namespaces/{{ ns }}/cronjobs/{{ cj_n }}", method: DELETE, headers: "{{ h }}", validate_certs: false, status_code: [200, 202, 404]}
      when: modo == 'retirar'

    # ---------- siempre: estado final ----------
    - name: Estado final del CronJob
      ansible.builtin.uri: {url: "{{ api }}/apis/batch/v1/namespaces/{{ ns }}/cronjobs/{{ cj_n }}", headers: "{{ h }}", validate_certs: false, status_code: [200, 404]}
      register: r_cj2

    - name: Últimas ejecuciones
      ansible.builtin.uri: {url: "{{ api }}/apis/batch/v1/namespaces/{{ ns }}/jobs", headers: "{{ h }}", validate_certs: false, status_code: [200, 404]}
      register: r_jobs

    - name: Todo CronJob con «etcd» en el nombre, en cualquier namespace (T-14)
      ansible.builtin.uri: {url: "{{ api }}/apis/batch/v1/cronjobs", headers: "{{ h }}", validate_certs: false}
      register: r_todos

    - name: Resultado para FaceOps
      ansible.builtin.set_stats:
        data:
          faceops_etcd_respaldo:
            cluster: "{{ inventory_hostname }}"
            cronjob: "{{ r_cj2.status == 200 }}"
            horario: "{{ r_cj2.json.spec.schedule | default('') if r_cj2.status == 200 else '' }}"
            ultimas: "{{ ultimas }}"
            prueba: "{{ prueba | default({}) }}"
            ensayo: "{{ ensayo | default({}) }}"
            ultimas_ok: "{{ ultimas | selectattr('ok') | list | length }}"
            otros_etcd: "{{ (r_todos.json['items'] | default([])) | selectattr('metadata.name', 'search', 'etcd') | map(attribute='metadata.namespace') | zip((r_todos.json['items'] | default([])) | selectattr('metadata.name', 'search', 'etcd') | map(attribute='metadata.name')) | map('join', '/') | list }}"
            destino: "{{ gitea }}/repositorio/-/packages/generic/{{ paquete }}"
      vars:
        ultimas: >-
          {% set o = [] %}{% for j in (r_jobs.json['items'] | default([])) | sort(attribute='metadata.creationTimestamp') %}{% set _ = o.append({'n': j.metadata.name,
          'ok': (j.status.succeeded | default(0)) > 0, 'fallo': (j.status.failed | default(0)) > 0, 'inicio': j.status.startTime | default('')}) %}{% endfor %}{{ o[-5:] }}

    - name: Resumen
      ansible.builtin.debug:
        msg: "{{ [inventory_hostname ~ ' · ' ~ ('CronJob ' ~ ns ~ '/' ~ cj_n ~ ' (' ~ r_cj2.json.spec.schedule ~ ')' if r_cj2.status == 200 else 'SIN CronJob de respaldo de etcd en ' ~ ns)]
                 + ['CronJob con «etcd» en el nombre en todo el clúster: ' ~ (((r_todos.json['items'] | default([])) | selectattr('metadata.name', 'search', 'etcd') | map(attribute='metadata.name') | join(', ')) or 'ninguno')]
                 + ['últimas ejecuciones OK: ' ~ ((r_jobs.json['items'] | default([])) | sort(attribute='metadata.creationTimestamp') | list)[-5:] | selectattr('status.succeeded', 'defined') | list | length
                    ~ ' de ' ~ ((r_jobs.json['items'] | default([]))[-5:] | length)]
                 + (['Ensayo de restauración: ' ~ ensayo.estado ~ ' · tiempo total ' ~ ensayo.minutos ~ ' min (desde el respaldo hasta la verificación)'] if ensayo is defined else [])
                 + (((r_jobs.json['items'] | default([])) | sort(attribute='metadata.creationTimestamp') | map(attribute='metadata.name') | list)[-5:]
                   | map('regex_replace', '^', 'ejecución ') | list)
                 + ((['Prueba ' ~ prueba.job ~ ': ' ~ ('completada' if prueba.completado | bool else 'NO completada') ~ ' · snapshot ' ~ ('✓' if prueba.snapshot | bool else '✗')
                      ~ ' · recursos estáticos ' ~ ('✓' if prueba.estaticos | bool else '✗') ~ ' · fuera del clúster ' ~ ('✓' if prueba.fuera | bool else '✗')] + prueba.log) if prueba is defined else []) }}"

    - name: La prueba dejó un respaldo utilizable
      ansible.builtin.assert:
        that: [prueba.completado | bool, prueba.snapshot | bool, prueba.estaticos | bool]
        fail_msg: "El Job terminó sin nombrar el snapshot y los recursos estáticos: el respaldo no sirve (ver el log en el resumen)"
        quiet: true
      when: modo in ['probar', 'ensayo-preparar']
