---
# OpenShift · Modelo de alertamiento (pilares: disponibilidad, seguridad, rendimiento). Por la API del clúster.
#   evaluar: solo lectura. Estado del monitoreo (Prometheus, Alertmanager, monitoreo de cargas de usuario) y qué reglas del
#            modelo (files/alertamiento-ocp.yml) ya están aplicadas
#   aplicar: deja una PrometheusRule por pilar («faceops-disponibilidad», «faceops-seguridad», «faceops-rendimiento») en
#            openshift-monitoring, con una alerta por umbral (aviso y crítico) etiquetada con su pilar y su acción
#            (faceops_pilar, faceops_accion, faceops_umbral), y envía las alertas FaceOps a Event-Driven Ansible
#            (receptor en el Alertmanager del clúster) → aviso: diagnóstico · crítico: remediación con aprobación
#   retirar: elimina las tres PrometheusRule y el receptor (el monitoreo de OpenShift queda como estaba)
# Variables: al_modo (evaluar | aplicar | retirar) · al_pilares (lista; por defecto los tres) · al_eda (URL del webhook de EDA)
- name: OpenShift · Modelo de alertamiento
  hosts: all
  connection: local
  gather_facts: false
  vars:
    api: "{{ lookup('ansible.builtin.env', 'K8S_AUTH_HOST') | default(openshift.api | default(''), true) | regex_replace('/$', '') }}"
    h: {Authorization: "Bearer {{ lookup('ansible.builtin.env', 'K8S_AUTH_API_KEY') }}", Accept: application/json}
    modo: "{{ al_modo | default('evaluar') }}"
    pilares: "{{ al_pilares | default(['disponibilidad', 'seguridad', 'rendimiento']) }}"
    eda: "{{ al_eda | default('http://192.168.122.1:5021/endpoint') }}"
  tasks:
    - name: Datos
      ansible.builtin.assert:
        that:
          - modo in ['evaluar', 'aplicar', 'retirar']
          - pilares | difference(['disponibilidad', 'seguridad', 'rendimiento']) | length == 0
          - api is match('^https://')
        fail_msg: "Modo o pilares no válidos, o falta el API del clúster"
        quiet: true

    - name: Modelo (evaluar, aplicar o retirar) por la API del clúster
      ansible.builtin.command:
        argv: [python3, "{{ playbook_dir }}/files/ocp_alertamiento.py", "{{ modo }}", "{{ api }}", "{{ playbook_dir }}/files/alertamiento-ocp.yml",
               "{{ eda }}", "{{ pilares | join(',') }}"]
      register: r_al
      changed_when: modo != 'evaluar'
      failed_when: r_al.rc != 0

    - name: Resultado para FaceOps
      ansible.builtin.set_stats:
        data:
          faceops_alertamiento: "{{ r_al.stdout | from_json }}"
