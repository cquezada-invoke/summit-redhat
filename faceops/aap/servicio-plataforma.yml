# FaceOps · Encender, apagar o reiniciar una plataforma (JBoss, nginx, PostgreSQL, Redis…) sin tocar la máquina.
# Variables: sp_unidades (unidades systemd candidatas, en orden; se usa la primera que exista en el equipo),
#            sp_accion (encender | apagar | reiniciar | estado | deshabilitar), sp_plataforma (nombre para el registro),
#            sp_puerto (opcional: puerto de la máquina registrado en FaceOps para la plataforma; en una plataforma en contenedor
#            (quadlet) se alinea su PublishPort antes de encender o reiniciar, p. ej. Keycloak en 8180 donde el 8080 es de JBoss).
#            sp_url_consola (opcional, Keycloak en contenedor: URL pública de su consola en FaceOps; KC_HOSTNAME queda en esa URL
#            + su ruta relativa, así la consola abre completa a través de FaceOps).
# «deshabilitar» detiene la plataforma en contenedor y aparta su quadlet a /var/lib/<unidad>/deshabilitado/ (no arranca con la
# máquina); «encender» lo devuelve a /etc/containers/systemd/.
- name: FaceOps · Controlar servicio de plataforma
  hosts: all
  gather_facts: false
  become: "{{ (ansible_connection | default('ssh')) not in ['winrm', 'psrp'] }}"
  vars:
    windows: "{{ (ansible_connection | default('ssh')) in ['winrm', 'psrp'] }}"
    accion: "{{ sp_accion | default('estado') }}"
    estados: {encender: started, apagar: stopped, reiniciar: restarted, deshabilitar: stopped}
  tasks:
    - name: Datos válidos
      ansible.builtin.assert:
        that:
          - accion in ['encender', 'apagar', 'reiniciar', 'estado', 'deshabilitar']
          - sp_unidades | default([]) | length > 0
          - (sp_puerto | default('') | string) is match('^([0-9]{2,5})?$')
          - (sp_url_consola | default('') | string) is match('^(https?://[A-Za-z0-9.:_/-]+)?$')
          - sp_unidades | select('match', '^[A-Za-z0-9@._-]+$') | list | length == sp_unidades | length
        fail_msg: "Acción o unidades no válidas"

    - name: Windows · servicio de la plataforma
      when: windows
      block:
        - name: "{{ accion | capitalize }} {{ sp_plataforma | default(sp_unidades[0]) }}"
          ansible.windows.win_service:
            name: "{{ sp_unidades[0] }}"
            state: "{{ estados[accion] }}"
          when: accion != 'estado'
          register: r_win

        - name: Estado final (Windows)
          ansible.windows.win_service_info:
            name: "{{ sp_unidades[0] }}"
          register: r_wfin

        - name: Resultado para FaceOps (Windows)
          ansible.builtin.set_stats:
            data:
              faceops_servicio: "{{ {inventory_hostname: {'unidad': sp_unidades[0], 'activo': ((r_wfin.services | default([{}]))[0].state | default('desconocido')), 'accion': accion}} }}"
            aggregate: true

        - name: Listo (Windows)
          ansible.builtin.meta: end_host

    - name: Unidades del equipo
      ansible.builtin.service_facts:

    # Plataforma en contenedor (quadlet de podman) dejada «deshabilitada»: su definición se apartó a /var/lib/<plataforma>/deshabilitado/
    # (sin unidad systemd). Encender la devuelve a /etc/containers/systemd/ y recarga systemd. Con sp_puerto, encender o reiniciar
    # alinea el puerto publicado (PublishPort=<sp_puerto>:<puerto del contenedor>) con el registrado en FaceOps.
    - name: Quadlet de la plataforma (habilitar y alinear su puerto)
      when: accion in ['encender', 'reiniciar']
      ansible.builtin.shell: |
        set -e
        p={{ (sp_puerto | default('') | string) | quote }}
        for u in {{ sp_unidades | map('quote') | join(' ') }}; do
          q="/etc/containers/systemd/$u.container"
          if [ ! -e "$q" ]; then
            for f in /var/lib/*/deshabilitado/"$u".container; do
              [ -f "$f" ] || continue
              install -m 0644 -o root -g root "$f" "$q"; restorecon "$q" 2>/dev/null || true; rm -f "$f"
              echo "habilitado $f → $q"; break
            done
          fi
          [ -e "$q" ] || continue
          if [ -n "$p" ] && grep -qE '^PublishPort=[0-9]+:' "$q" && ! grep -qE "^PublishPort=$p:" "$q"; then
            antes=$(grep -m1 -E '^PublishPort=' "$q"); sed -i -E "0,/^PublishPort=[0-9]+:/s//PublishPort=$p:/" "$q"
            echo "puerto $antes → $(grep -m1 -E '^PublishPort=' "$q")"
          fi
          url={{ (sp_url_consola | default('') | string) | quote }}
          if [ -n "$url" ] && grep -qE '^Environment=KC_HOSTNAME=' "$q"; then
            rel=$(sed -n 's/^Environment=KC_HTTP_RELATIVE_PATH=//p' "$q" | head -1)
            nuevo="${url%/}${rel}"
            if ! grep -qxF "Environment=KC_HOSTNAME=$nuevo" "$q"; then
              sed -i -E "s|^Environment=KC_HOSTNAME=.*|Environment=KC_HOSTNAME=$nuevo|" "$q"
              echo "url KC_HOSTNAME → $nuevo"
            fi
          fi
          systemctl daemon-reload; systemctl reset-failed "$u.service" 2>/dev/null || true
          exit 0
        done
      register: r_quadlet
      changed_when: "'habilitado' in r_quadlet.stdout or 'puerto' in r_quadlet.stdout or 'url ' in r_quadlet.stdout"

    - name: Unidades del equipo (tras habilitar su quadlet)
      ansible.builtin.service_facts:
      when: r_quadlet is changed

    - name: Unidad de la plataforma (una que termina en «@» toma cualquier instancia)
      ansible.builtin.set_fact:
        sp_unidad: >-
          {% set ok = [] %}{% for u in sp_unidades %}{% for s in ansible_facts.services.keys() | sort %}{% if (u.endswith('@') and s.startswith(u) and s != u ~ '.service') or s == u ~ '.service' %}{% set _ = ok.append(s) %}{% endif %}{% endfor %}{% endfor %}{{ (ok + [''])[0] }}

    - name: La plataforma tiene servicio en el equipo
      ansible.builtin.assert:
        that: sp_unidad | length > 0
        fail_msg: "No se encontró el servicio de {{ sp_plataforma | default('la plataforma') }} ({{ sp_unidades | join(', ') }})"

    - name: Deshabilitar solo aplica a plataformas en contenedor (antes de detener nada)
      when: accion == 'deshabilitar'
      ansible.builtin.stat:
        path: "/etc/containers/systemd/{{ sp_unidad | replace('.service', '') }}.container"
      register: r_q_desh

    - name: La plataforma corre en contenedor (quadlet)
      when: accion == 'deshabilitar'
      ansible.builtin.assert:
        that: r_q_desh.stat.exists
        fail_msg: "{{ sp_plataforma | default(sp_unidad) }} no corre en contenedor (sin quadlet): «deshabilitar» no aplica; usa «Apagar»"

    - name: "{{ accion | capitalize }} {{ sp_plataforma | default(sp_unidad) }}"
      ansible.builtin.systemd_service:
        name: "{{ sp_unidad }}"
        state: "{{ 'restarted' if (accion == 'encender' and ('puerto' in (r_quadlet.stdout | default('')) or 'url ' in (r_quadlet.stdout | default('')))) else estados[accion] }}"
      when: accion != 'estado'

    - name: Apartar el quadlet (deshabilitar)
      when: accion == 'deshabilitar'
      ansible.builtin.shell: |
        set -e
        u={{ (sp_unidad | replace('.service', '')) | quote }}; q="/etc/containers/systemd/$u.container"; d="/var/lib/$u/deshabilitado"
        [ -e "$q" ] || { echo "sin quadlet en $q: no es una plataforma en contenedor" >&2; exit 3; }
        mkdir -p "$d"; mv -f "$q" "$d/$u.container"; systemctl daemon-reload
        echo "deshabilitado $q → $d/$u.container"
      register: r_desh
      changed_when: "'deshabilitado' in r_desh.stdout"

    - name: Credencial de administración de Keycloak en la bóveda (FaceOps entra a su consola sin mostrarla)
      when:
        - accion in ['encender', 'reiniciar']
        - sp_unidad is match('^(keycloak|rhbk)')
        - faceops_vault_role_id is defined
      ansible.builtin.shell: |
        python3 - <<'P'
        import json, re, urllib.request
        q = open("/etc/containers/systemd/{{ sp_unidad | replace('.service', '') }}.container").read()
        env = {}
        for f in re.findall(r"^EnvironmentFile=(.+)$", q, re.M):
            try:
                env.update(dict(l.strip().split("=", 1) for l in open(f.strip()) if "=" in l))
            except OSError:
                pass
        env.update(dict(re.findall(r"^Environment=([A-Z_]+)=(.*)$", q, re.M)))
        clave = env.get("KC_BOOTSTRAP_ADMIN_PASSWORD") or env.get("KEYCLOAK_ADMIN_PASSWORD")
        if not clave:
            print("sin clave de administración en el quadlet"); raise SystemExit(0)
        A = "{{ faceops_vault_addr }}"
        def pedir(m, ruta, d, tok=None):
            r = urllib.request.Request(A + "/v1/" + ruta, method=m, data=json.dumps(d).encode(),
                                       headers=dict({"Content-Type": "application/json"}, **({"X-Vault-Token": tok} if tok else {})))
            with urllib.request.urlopen(r, timeout=15) as x:
                b = x.read(); return json.loads(b) if b else {}
        tok = pedir("POST", "auth/approle/login", {"role_id": "{{ faceops_vault_role_id }}", "secret_id": "{{ faceops_vault_secret_id }}"})["auth"]["client_token"]
        pedir("POST", "faceops/data/web/{{ inventory_hostname }}/keycloak", {"data": {"sitio": "keycloak", "clave": clave,
              "usuario": env.get("KC_BOOTSTRAP_ADMIN_USERNAME") or env.get("KEYCLOAK_ADMIN") or "admin",
              "puerto": {{ (sp_puerto | default(8080)) | int }}, "ruta": env.get("KC_HTTP_RELATIVE_PATH", "")}}, tok)
        print("credencial registrada")
        P
      register: r_kc_cred
      no_log: true
      changed_when: "'registrada' in r_kc_cred.stdout"
      failed_when: false

    - name: Estado final
      ansible.builtin.command: systemctl is-active {{ sp_unidad }}
      register: r_fin
      changed_when: false
      failed_when: false

    - name: Resultado para FaceOps
      ansible.builtin.set_stats:
        data:
          faceops_servicio: "{{ {inventory_hostname: {'unidad': sp_unidad, 'activo': r_fin.stdout | trim, 'accion': accion, 'quadlet': ((r_quadlet.stdout | default('')) ~ ' ' ~ (r_desh.stdout | default(''))) | trim, 'boveda': (r_kc_cred is changed)}} }}"
        per_host: false
        aggregate: true
