---
# OpenShift · Recolectar clúster (solo lectura). Ansible consulta la API de cada clúster (inventario «OpenShift · clústeres»,
# credencial «OpenShift or Kubernetes API Bearer Token» de una cuenta de servicio con cluster-reader) y guarda el
# resultado en el caché de facts de AAP (faceops_ocp). FaceOps lo lee desde AAP: no se conecta al clúster.
# Recolecta: versión y canal, plataforma y topología, red, nodos (roles, estado, RHCOS, kernel, CRI-O, arquitectura,
# CPU, memoria, IP), operadores del clúster, proyectos, pods y máquinas virtuales (si tiene OpenShift Virtualization).
# Operadores OLM: Subscription, CSV y pods de cada uno; y el catálogo del clúster (packagemanifests) para los operadores del
# catálogo de FaceOps (files/operadores-ocp.yml): fuente, canales con su CSV y modos de instalación soportados.
- name: OpenShift · Recolectar clúster
  hosts: all
  connection: local
  gather_facts: false
  vars:
    api: "{{ lookup('ansible.builtin.env', 'K8S_AUTH_HOST') | default(openshift.api | default(''), true) }}"
    token: "{{ lookup('ansible.builtin.env', 'K8S_AUTH_API_KEY') }}"
    rutas:
      version: /apis/config.openshift.io/v1/clusterversions/version
      infra: /apis/config.openshift.io/v1/infrastructures/cluster
      red: /apis/config.openshift.io/v1/networks/cluster
      consola: /apis/config.openshift.io/v1/consoles/cluster
      nodos: /api/v1/nodes
      operadores: /apis/config.openshift.io/v1/clusteroperators
      proyectos: /apis/project.openshift.io/v1/projects
      pods: /api/v1/pods?limit=500
      vms: /apis/kubevirt.io/v1/virtualmachines
      vmis: /apis/kubevirt.io/v1/virtualmachineinstances
      metricas: /apis/metrics.k8s.io/v1beta1/nodes
      clases_storage: /apis/storage.k8s.io/v1/storageclasses
      pvs: /api/v1/persistentvolumes
      pvcs: /api/v1/persistentvolumeclaims
      deployments: /apis/apps/v1/deployments?limit=1000
      statefulsets: /apis/apps/v1/statefulsets?limit=1000
      rutas: /apis/route.openshift.io/v1/routes?limit=1000
      suscripciones: /apis/operators.coreos.com/v1alpha1/subscriptions
      csvs: /apis/operators.coreos.com/v1alpha1/clusterserviceversions?limit=500&labelSelector=%21olm.copiedFrom
      planes: /apis/operators.coreos.com/v1alpha1/installplans
      cronjobs: /apis/batch/v1/cronjobs
      jobs_etcd: /apis/batch/v1/namespaces/openshift-etcd/jobs
      argo_apps: /apis/argoproj.io/v1alpha1/applications
      velero_backups: /apis/velero.io/v1/backups
      velero_schedules: /apis/velero.io/v1/schedules
      snapshots: /apis/snapshot.storage.k8s.io/v1/volumesnapshots
      servicios: /api/v1/services?limit=2000
      cuotas: /api/v1/resourcequotas
      limites: /api/v1/limitranges
      metricas_pods: /apis/metrics.k8s.io/v1beta1/pods
      eventos: /api/v1/events?fieldSelector=type%3DWarning&limit=500
      registro_imagenes: /apis/imageregistry.operator.openshift.io/v1/configs/cluster
      imagestreams: /apis/image.openshift.io/v1/imagestreams?limit=1000
      espejos: /apis/config.openshift.io/v1/imagedigestmirrorsets
      pools: /apis/machineconfiguration.openshift.io/v1/machineconfigpools
  tasks:
    - name: Credencial del clúster
      ansible.builtin.assert:
        that: [api | length > 0, token | length > 0]
        fail_msg: "Falta la credencial «OpenShift or Kubernetes API Bearer Token» del clúster en la plantilla"
        quiet: true

    - name: Consultar la API de OpenShift
      ansible.builtin.uri:
        url: "{{ api | regex_replace('/$', '') }}{{ item.value }}"
        headers: {Authorization: "Bearer {{ token }}", Accept: application/json}
        validate_certs: false
        timeout: 30
        status_code: [200, 403, 404]
      loop: "{{ rutas | dict2items }}"
      loop_control: {label: "{{ item.key }}"}
      register: r_api
      no_log: false

    - name: Ordenar las respuestas
      ansible.builtin.set_fact:
        o: "{{ dict(r_api.results | map(attribute='item.key') | zip(r_api.results | map(attribute='json', default={}))) }}"

    - name: Operadores del catálogo de FaceOps
      ansible.builtin.set_fact:
        paquetes_faceops: >-
          {% set cat = lookup('ansible.builtin.file', 'files/operadores-ocp.yml', errors='ignore') | default('', true) | from_yaml or {} %}
          {%- set out = [] %}{% for c in cat.get('categorias') or [] %}{% for x in c.get('operadores') or [] %}{% set _ = out.append(x.paquete) %}
          {%- for a in x.get('alternativos') or [] %}{% set _ = out.append(a) %}{% endfor %}{% endfor %}{% endfor %}{{ out | unique | list }}

    - name: Catálogo del clúster (packagemanifests de esos operadores)
      ansible.builtin.uri:
        url: "{{ api | regex_replace('/$', '') }}/apis/packages.operators.coreos.com/v1/namespaces/openshift-marketplace/packagemanifests/{{ item }}"
        headers: {Authorization: "Bearer {{ token }}", Accept: application/json}
        validate_certs: false
        timeout: 30
        status_code: [200, 403, 404]
      loop: "{{ paquetes_faceops }}"
      register: r_pm
      no_log: true   # respuestas grandes (íconos y descripciones): no van a los eventos del trabajo

    - name: Paquetes disponibles en el clúster
      ansible.builtin.set_fact:
        paquetes_ocp: >-
          {% set out = {} %}{% for r in r_pm.results | default([]) if r.status | default(0) == 200 and r.json is defined %}{% set s = r.json.status %}
          {%- set chs = s.channels | default([]) %}{% set dc = (chs | selectattr('name', 'equalto', s.defaultChannel | default('')) | list + chs) | first | default({}) %}
          {%- set cc = {} %}{% for c in chs %}{% set _ = cc.update({c.name: c.currentCSV | default('')}) %}{% endfor %}
          {%- set _ = out.update({r.item: {'fuente': s.catalogSource | default(''), 'canal': s.defaultChannel | default(''), 'canales': cc,
              'modos': ((dc.currentCSVDesc | default({})).installModes | default([])) | selectattr('supported') | map(attribute='type') | list}}) %}{% endfor %}{{ out }}
        paquetes_ok: "{{ (r_pm.results | default([]) | map(attribute='status', default=0) | list) | select('in', [200, 404]) | list | length == paquetes_faceops | length }}"

    - name: Uso actual de cada nodo (metrics.k8s.io)
      ansible.builtin.set_fact:
        uso: "{{ uso | default({}) | combine({item.metadata.name: {'cpu': c, 'mem_gb': m}}) }}"
      vars:
        cv: "{{ item.usage.cpu }}"
        c: "{{ ((cv[:-1] | float / 1e9) if cv.endswith('n') else ((cv[:-1] | float / 1000) if cv.endswith('m') else cv | float)) | round(2) }}"
        mv: "{{ item.usage.memory }}"
        m: "{{ ((mv[:-2] | float / 1048576) if mv.endswith('Ki') else ((mv[:-2] | float / 1024) if mv.endswith('Mi') else (mv | regex_replace('[^0-9.]', '') | float / 1073741824))) | round(1) }}"
      loop: "{{ (o.metricas.get('items') or []) }}"
      loop_control: {label: "{{ item.metadata.name }}"}

    - name: Nodos
      ansible.builtin.set_fact:
        nodos: "{{ nodos | default([]) + [n] }}"
      vars:
        st: "{{ item.status }}"
        etiquetas: "{{ item.metadata.labels | default({}) }}"
        n:
          nombre: "{{ item.metadata.name }}"
          roles: "{{ etiquetas.keys() | select('match', '^node-role.kubernetes.io/') | map('regex_replace', '^node-role.kubernetes.io/', '') | list }}"
          listo: "{{ (st.conditions | selectattr('type', 'equalto', 'Ready') | map(attribute='status') | first | default('Unknown')) == 'True' }}"
          programable: "{{ not (item.spec.unschedulable | default(false)) }}"
          arquitectura: "{{ st.nodeInfo.architecture }}"
          sistema: "{{ st.nodeInfo.osImage }}"
          kernel: "{{ st.nodeInfo.kernelVersion }}"
          runtime: "{{ st.nodeInfo.containerRuntimeVersion }}"
          kubelet: "{{ st.nodeInfo.kubeletVersion }}"
          cpu: "{{ st.capacity.cpu }}"
          memoria_gb: "{{ ((st.capacity.memory | regex_replace('Ki$', '') | int) / 1048576) | round(1) }}"
          cpu_asignable: "{{ (st.allocatable.cpu[:-1] | float / 1000) if st.allocatable.cpu.endswith('m') else st.allocatable.cpu | float }}"
          memoria_asignable_gb: "{{ ((st.allocatable.memory | regex_replace('Ki$', '') | int) / 1048576) | round(1) }}"
          cpu_uso: "{{ (uso | default({}))[item.metadata.name].cpu | default(none) }}"
          memoria_uso_gb: "{{ (uso | default({}))[item.metadata.name].mem_gb | default(none) }}"
          pods_max: "{{ st.capacity.pods | default('') }}"
          ip: "{{ st.addresses | selectattr('type', 'equalto', 'InternalIP') | map(attribute='address') | first | default('') }}"
          zona: "{{ etiquetas['topology.kubernetes.io/zone'] | default('') }}"
          tipo_instancia: "{{ etiquetas['node.kubernetes.io/instance-type'] | default('') }}"
          creado: "{{ item.metadata.creationTimestamp }}"
      loop: "{{ (o.nodos.get('items') or []) }}"
      loop_control: {label: "{{ item.metadata.name }}"}

    - name: Operadores del clúster con problemas (no disponibles o degradados)
      ansible.builtin.set_fact:
        op_problema: "{{ op_problema | default([]) + [item.metadata.name] }}"
      vars:
        cond: "{{ dict(item.status.conditions | default([]) | map(attribute='type') | zip(item.status.conditions | default([]) | map(attribute='status'))) }}"
      loop: "{{ o.operadores.get('items') or [] }}"
      loop_control: {label: "{{ item.metadata.name }}"}
      when: cond.get('Available') != 'True' or cond.get('Degraded') == 'True'

    - name: Resultado en el caché de facts de AAP (FaceOps lo lee desde ahí)
      ansible.builtin.set_fact:
        cacheable: true
        faceops_ocp:
          recolectado: "{{ now(utc=true).isoformat() }}Z"
          api: "{{ api }}"
          version: "{{ o.version.status.desired.version | default('') }}"
          canal: "{{ o.version.spec.channel | default('') }}"
          cluster_id: "{{ o.version.spec.clusterID | default('') }}"
          actualizacion: "{{ (o.version.status.history | default([]) | first | default({})).state | default('') }}"
          actualizaciones_disponibles: "{{ o.version.status.availableUpdates | default([], true) | map(attribute='version') | list }}"
          plataforma: "{{ o.infra.status.platformStatus.type | default(o.infra.status.platform | default('')) }}"
          topologia_control: "{{ o.infra.status.controlPlaneTopology | default('') }}"
          topologia_infra: "{{ o.infra.status.infrastructureTopology | default('') }}"
          nombre_infra: "{{ o.infra.status.infrastructureName | default('') }}"
          api_url: "{{ o.infra.status.apiServerURL | default('') }}"
          consola: "{{ o.consola.status.consoleURL | default('') }}"
          red_tipo: "{{ o.red.status.networkType | default(o.red.spec.networkType | default('')) }}"
          red_cluster: "{{ o.red.status.clusterNetwork | default([]) | map(attribute='cidr') | list }}"
          red_servicios: "{{ o.red.status.serviceNetwork | default([]) }}"
          nodos: "{{ nodos | default([]) }}"
          respaldo:
            historial_version: "{{ o.version.status.history | default([]) | map(attribute='version') | list }}"
            etcd_cronjobs: >-
              {{ (o.cronjobs.get('items') or []) | selectattr('metadata.name', 'search', 'etcd') | map(attribute='metadata.namespace')
                 | zip((o.cronjobs.get('items') or []) | selectattr('metadata.name', 'search', 'etcd') | map(attribute='metadata.name'),
                       (o.cronjobs.get('items') or []) | selectattr('metadata.name', 'search', 'etcd') | map(attribute='spec.schedule'),
                       (o.cronjobs.get('items') or []) | selectattr('metadata.name', 'search', 'etcd') | map(attribute='status.lastSuccessfulTime', default=''))
                 | map('join', '|') | list }}
            etcd_jobs: >-
              {% set js = (o.jobs_etcd.get('items') or []) | sort(attribute='metadata.creationTimestamp') %}{% set out = [] %}{% for x in js %}{% set _ = out.append(x.metadata.name ~ '|' ~ x.metadata.creationTimestamp ~ '|' ~ (x.status.succeeded | default(0)) ~ '|' ~ (x.status.failed | default(0))) %}{% endfor %}{{ out[-5:] }}
            gitops: >-
              {% set out = [] %}{% for a in (o.argo_apps.get('items') or []) %}{% set src = a.spec.source | default((a.spec.sources | default([{}]))[0]) %}
              {%- set _ = out.append({'app': a.metadata.name, 'ns_destino': a.spec.destination.namespace | default(''), 'repo': src.repoURL | default(''), 'ruta': src.path | default(''),
                  'rama': src.targetRevision | default(''), 'commit': a.status.sync.revision | default(''), 'sync': a.status.sync.status | default(''), 'salud': a.status.health.status | default('')}) %}{% endfor %}{{ out }}
            oadp_backups: >-
              {{ (o.velero_backups.get('items') or []) | sort(attribute='metadata.creationTimestamp') | map(attribute='metadata.name')
                 | zip((o.velero_backups.get('items') or []) | sort(attribute='metadata.creationTimestamp') | map(attribute='status.phase', default=''),
                       (o.velero_backups.get('items') or []) | sort(attribute='metadata.creationTimestamp') | map(attribute='metadata.creationTimestamp'))
                 | map('join', '|') | list }}
            oadp_programas: "{{ (o.velero_schedules.get('items') or []) | map(attribute='metadata.name') | list }}"
            snapshots: >-
              {{ (o.snapshots.get('items') or []) | map(attribute='metadata.namespace')
                 | zip((o.snapshots.get('items') or []) | map(attribute='metadata.name'), (o.snapshots.get('items') or []) | map(attribute='status.readyToUse', default=false))
                 | map('join', '|') | list }}
            pvs: "{{ (o.pvs.get('items') or []) | length }}"
            clases_storage: "{{ (o.clases_storage.get('items') or []) | map(attribute='metadata.name') | list }}"
            registro: "{{ (o.registro_imagenes.get('spec') or {}).get('managementState', '') }} · {{ ((o.registro_imagenes.get('spec') or {}).get('storage') or {}).keys() | list | join(',') }}"
            imagestreams: "{{ (o.imagestreams.get('items') or []) | rejectattr('metadata.namespace', 'match', '^openshift') | map(attribute='metadata.namespace') | zip((o.imagestreams.get('items') or []) | rejectattr('metadata.namespace', 'match', '^openshift') | map(attribute='metadata.name')) | map('join', '/') | list }}"
            espejos: "{{ (o.espejos.get('items') or []) | map(attribute='metadata.name') | list }}"
          operadores_total: "{{ (o.operadores.get('items') or []) | length }}"
          operadores_problema: "{{ op_problema | default([]) }}"
          proyectos: "{{ (o.proyectos.get('items') or []) | length }}"
          proyectos_usuario: "{{ (o.proyectos.get('items') or []) | map(attribute='metadata.name') | reject('match', '^(openshift|kube-|default$)') | list }}"
          namespaces_app: >-
            {% set out = [] %}{% for p in (o.proyectos.get('items') or []) if not (p.metadata.name is match('^(openshift|kube-|default$|hostpath|stackrox|rhacs|open-cluster|multicluster|local-cluster|assisted-installer)')) %}{% set n = p.metadata.name %}
            {%- set ns_cargas = [] %}{% for tipo_, lst_ in (('Deployment', o.deployments.get('items') or []), ('StatefulSet', o.statefulsets.get('items') or [])) %}{% for d in lst_ | selectattr('metadata.namespace', 'equalto', n) %}{% set _ = ns_cargas.append({'n': d.metadata.name, 'tipo': tipo_, 'rep': d.spec.replicas | default(0), 'listos': d.status.readyReplicas | default(0), 'imagenes': d.spec.template.spec.containers | map(attribute='image') | list, 'creado': d.metadata.creationTimestamp | default(''), 'req': (d.spec.template.spec.containers[0].resources | default({})).get('requests', {}), 'lim': (d.spec.template.spec.containers[0].resources | default({})).get('limits', {}), 'estrategia': (d.spec.strategy | default(d.spec.updateStrategy | default({}))).get('type', '')}) %}{% endfor %}{% endfor %}
            {%- set ns_mp = (o.metricas_pods.get('items') or []) | selectattr('metadata.namespace', 'equalto', n) | list %}{% set uso_pod = {} %}{% for mp in ns_mp %}{% set pc = namespace(c=0.0, m=0.0) %}{% for c in mp.containers | default([]) %}{% set cv = c.usage.cpu %}{% set mv = c.usage.memory %}{% set pc.c = pc.c + ((cv[:-1] | float / 1e9) if cv.endswith('n') else ((cv[:-1] | float / 1000) if cv.endswith('m') else cv | float)) %}{% set pc.m = pc.m + ((mv[:-2] | float / 1024) if mv.endswith('Ki') else ((mv[:-2] | float) if mv.endswith('Mi') else (mv | regex_replace('[^0-9.]', '') | float / 1048576))) %}{% endfor %}{% set _ = uso_pod.update({mp.metadata.name: {'cpu': pc.c | round(3), 'mem_mb': pc.m | round(0)}}) %}{% endfor %}
            {%- set ns_ev = [] %}{% for ev in (o.eventos.get('items') or []) | selectattr('metadata.namespace', 'equalto', n) | sort(attribute='metadata.creationTimestamp', reverse=true) %}{% if loop.index <= 8 %}{% set _ = ns_ev.append({'razon': ev.reason | default(''), 'obj': (ev.involvedObject.kind | default('')) ~ '/' ~ (ev.involvedObject.name | default('')), 'msg': (ev.message | default(''))[:200], 'veces': ev.count | default(1), 'ultima': ev.lastTimestamp | default(ev.eventTime | default(ev.metadata.creationTimestamp))}) %}{% endif %}{% endfor %}
            {%- set ns_pods = [] %}{% for q in (o.pods.get('items') or []) | selectattr('metadata.namespace', 'equalto', n) %}{% set _ = ns_pods.append({'n': q.metadata.name, 'fase': q.status.phase | default(''), 'listos': ((q.status.containerStatuses | default([])) | selectattr('ready') | list | length) ~ '/' ~ (q.spec.containers | length), 'reinicios': (q.status.containerStatuses | default([])) | map(attribute='restartCount') | sum, 'nodo': q.spec.nodeName | default(''), 'creado': q.metadata.creationTimestamp | default(''), 'dueno': ((q.metadata.ownerReferences | default([{}]))[0].name | default('')) | regex_replace('-[a-z0-9]{8,10}$', ''), 'uso': uso_pod.get(q.metadata.name, {})}) %}{% endfor %}
            {%- set ns_pvcs = [] %}{% for v in (o.pvcs.get('items') or []) | selectattr('metadata.namespace', 'equalto', n) %}{% set _ = ns_pvcs.append({'n': v.metadata.name, 'tam': v.spec.resources.requests.storage | default(''), 'fase': v.status.phase | default(''), 'sc': v.spec.storageClassName | default('')}) %}{% endfor %}
            {%- set ns_svc = [] %}{% for sv in (o.servicios.get('items') or []) | selectattr('metadata.namespace', 'equalto', n) %}{% set _ = ns_svc.append({'n': sv.metadata.name, 'tipo': sv.spec.type | default(''), 'ip': sv.spec.clusterIP | default(''), 'puertos': (sv.spec.ports | default([])) | map(attribute='port') | map('string') | join(', ')}) %}{% endfor %}
            {%- set ns_cuotas = [] %}{% for q in (o.cuotas.get('items') or []) | selectattr('metadata.namespace', 'equalto', n) %}{% set _ = ns_cuotas.append({'n': q.metadata.name, 'hard': q.status.hard | default({}), 'used': q.status.used | default({})}) %}{% endfor %}
            {%- set ns_mp = (o.metricas_pods.get('items') or []) | selectattr('metadata.namespace', 'equalto', n) | list %}
            {%- set ns_cpu = namespace(v=0.0) %}{% set ns_mem = namespace(v=0.0) %}{% for mp in ns_mp %}{% for c in mp.containers | default([]) %}{% set cv = c.usage.cpu %}{% set mv = c.usage.memory %}
            {%- set ns_cpu.v = ns_cpu.v + ((cv[:-1] | float / 1e9) if cv.endswith('n') else ((cv[:-1] | float / 1000) if cv.endswith('m') else cv | float)) %}
            {%- set ns_mem.v = ns_mem.v + ((mv[:-2] | float / 1048576) if mv.endswith('Ki') else ((mv[:-2] | float / 1024) if mv.endswith('Mi') else (mv | regex_replace('[^0-9.]', '') | float / 1073741824))) %}{% endfor %}{% endfor %}
            {%- set ns_rutas = [] %}{% for rt in (o.rutas.get('items') or []) | selectattr('metadata.namespace', 'equalto', n) %}{% set _ = ns_rutas.append({'h': rt.spec.host, 'svc': rt.spec.to.name | default(''), 'tls': (rt.spec.tls | default({})).get('termination', '')}) %}{% endfor %}
            {%- set _ = out.append({'ns': n, 'creado': p.metadata.creationTimestamp | default(''), 'nombre': (p.metadata.annotations | default({})).get('openshift.io/display-name', ''),
                'deployments': (o.deployments.get('items') or []) | selectattr('metadata.namespace', 'equalto', n) | list | length,
                'statefulsets': (o.statefulsets.get('items') or []) | selectattr('metadata.namespace', 'equalto', n) | list | length,
                'pods': (o.pods.get('items') or []) | selectattr('metadata.namespace', 'equalto', n) | list | length,
                'pods_ok': (o.pods.get('items') or []) | selectattr('metadata.namespace', 'equalto', n) | selectattr('status.phase', 'in', ['Running', 'Succeeded']) | list | length,
                'rutas': (o.rutas.get('items') or []) | selectattr('metadata.namespace', 'equalto', n) | map(attribute='spec.host') | list,
                'pvcs': (o.pvcs.get('items') or []) | selectattr('metadata.namespace', 'equalto', n) | list | length,
                'l_cargas': ns_cargas, 'l_pods': ns_pods, 'l_eventos': ns_ev, 'l_pvcs': ns_pvcs, 'l_rutas': ns_rutas, 'l_servicios': ns_svc, 'l_cuotas': ns_cuotas,
                'limitranges': (o.limites.get('items') or []) | selectattr('metadata.namespace', 'equalto', n) | list | length,
                'etiquetas': p.metadata.labels | default({}), 'solicitante': (p.metadata.annotations | default({})).get('openshift.io/requester', ''),
                'descripcion': (p.metadata.annotations | default({})).get('openshift.io/description', ''),
                'uso': {'medido': ns_mp | length > 0, 'cpu': ns_cpu.v | round(3), 'mem_gb': ns_mem.v | round(2)}}) %}{% endfor %}{{ out }}
          pods: "{{ (o.pods.get('items') or []) | length }}"
          pods_corriendo: "{{ (o.pods.get('items') or []) | selectattr('status.phase', 'equalto', 'Running') | list | length }}"
          virtualizacion: "{{ r_api.results | selectattr('item.key', 'equalto', 'vms') | map(attribute='status') | first == 200 }}"
          vms: "{{ (o.vms.get('items') or []) | length }}"
          vms_corriendo: "{{ (o.vmis.get('items') or []) | selectattr('status.phase', 'equalto', 'Running') | list | length }}"
          recursos:
            cpu_total: "{{ nodos | default([]) | map(attribute='cpu') | map('int') | sum }}"
            cpu_asignable: "{{ nodos | default([]) | map(attribute='cpu_asignable') | map('float') | sum | round(1) }}"
            cpu_uso: "{{ (uso | default({})).values() | map(attribute='cpu') | map('float') | sum | round(2) if uso is defined else none }}"
            memoria_total_gb: "{{ nodos | default([]) | map(attribute='memoria_gb') | map('float') | sum | round(1) }}"
            memoria_asignable_gb: "{{ nodos | default([]) | map(attribute='memoria_asignable_gb') | map('float') | sum | round(1) }}"
            memoria_uso_gb: "{{ (uso | default({})).values() | map(attribute='mem_gb') | map('float') | sum | round(1) if uso is defined else none }}"
            pods_max: "{{ nodos | default([]) | map(attribute='pods_max') | map('int') | sum }}"
          storage:
            clases: >-
              {{ (o.clases_storage.get('items') or []) | map(attribute='metadata.name')
                 | zip((o.clases_storage.get('items') or []) | map(attribute='provisioner')) | map('join', ' · ') | list }}
            pvs: "{{ (o.pvs.get('items') or []) | length }}"
            pvs_gb: >-
              {{ (o.pvs.get('items') or []) | map(attribute='spec.capacity.storage') | map('regex_replace', 'Gi$', '')
                 | map('regex_replace', 'Mi$', 'e-3') | map('float') | sum | round(1) }}
            pvcs: "{{ (o.pvcs.get('items') or []) | length }}"
            pvcs_pendientes: "{{ (o.pvcs.get('items') or []) | rejectattr('status.phase', 'equalto', 'Bound') | list | length }}"
          cargas:
            deployments: "{{ (o.deployments.get('items') or []) | length }}"
            statefulsets: "{{ (o.statefulsets.get('items') or []) | length }}"
            rutas: "{{ (o.rutas.get('items') or []) | length }}"
          operadores: >-
            {% set fase = {} %}{% set disp = {} %}{% set deps = {} %}{% for c in (o.csvs.get('items') or []) %}{% set _ = fase.update({c.metadata.namespace ~ '/' ~ c.metadata.name: c.status.phase | default('')}) %}{% set _ = disp.update({c.metadata.name: c.spec.displayName | default('')}) %}{% set _ = deps.update({c.metadata.namespace ~ '/' ~ c.metadata.name: ((c.spec.install | default({})).spec | default({})).deployments | default([]) | map(attribute='name') | list}) %}{% endfor %}
            {%- set out = [] %}{% for sub in (o.suscripciones.get('items') or []) %}{% set ns = sub.metadata.namespace %}{% set csv = sub.status.installedCSV | default('') %}
            {%- set pc = namespace(t=0, ok=0, mal=[]) %}{% for q in (o.pods.get('items') or []) | selectattr('metadata.namespace', 'equalto', ns) %}{% if deps.get(ns ~ '/' ~ csv, []) | select('in', [q.metadata.name | regex_replace('-[a-z0-9]{5,10}-[a-z0-9]{5}$', '')]) | list %}
            {%- set pc.t = pc.t + 1 %}{% if q.status.phase | default('') == 'Running' and (q.status.containerStatuses | default([]) | rejectattr('ready') | list | length == 0) %}{% set pc.ok = pc.ok + 1 %}{% else %}{% set pc.mal = pc.mal + [q.metadata.name ~ ' · ' ~ (q.status.phase | default(''))] %}{% endif %}{% endif %}{% endfor %}
            {%- set pend = (o.planes.get('items') or []) | selectattr('metadata.namespace', 'equalto', ns) | selectattr('spec.approved', 'equalto', false) | map(attribute='spec.clusterServiceVersionNames') | map('first') | list %}
            {%- set _ = out.append({'n': sub.spec.name, 'sub': sub.metadata.name, 'ns': ns, 'canal': sub.spec.channel | default(''), 'aprob': sub.spec.installPlanApproval | default(''),
                'fuente': sub.spec.source | default(''), 'csv': csv, 'actual': sub.status.currentCSV | default(''), 'nombre': disp.get(csv, '') or sub.spec.name,
                'fase': fase.get(ns ~ '/' ~ csv, ''), 'estado': sub.status.state | default(''), 'pendientes': pend,
                'pods': pc.t, 'pods_listos': pc.ok, 'pods_mal': pc.mal}) %}{% endfor %}{{ out }}
          paquetes: "{{ paquetes_ocp | default({}) }}"
          paquetes_completo: "{{ paquetes_ok | default(false) }}"
          operadores_instalados: >-
            {{ (o.suscripciones.get('items') or []) | map(attribute='spec.name')
               | zip((o.suscripciones.get('items') or []) | map(attribute='status.installedCSV', default='')) | map('join', ' · ') | list }}
          pools: >-
            {{ (o.pools.get('items') or []) | map(attribute='metadata.name')
               | zip((o.pools.get('items') or []) | map(attribute='status.readyMachineCount', default=0),
                     (o.pools.get('items') or []) | map(attribute='status.machineCount', default=0))
               | map('join', '|') | list }}

    - name: Resumen
      ansible.builtin.debug:
        msg: >-
          OpenShift {{ faceops_ocp.version }} ({{ faceops_ocp.plataforma }}, control {{ faceops_ocp.topologia_control }}) ·
          {{ faceops_ocp.nodos | length }} nodo(s): {{ faceops_ocp.nodos | map(attribute='nombre') | join(', ') }} ·
          {{ faceops_ocp.operadores_total }} operadores ({{ faceops_ocp.operadores_problema | unique | length }} con problemas) ·
          {{ faceops_ocp.pods_corriendo }}/{{ faceops_ocp.pods }} pods · {{ faceops_ocp.vms }} VM
