---
# Plataforma · Medir salud (solo lectura). Mide SIN agente los indicadores propios de una plataforma desde su máquina: AAP
# entra por SSH (Linux) o WinRM (Windows) y lee las APIs locales de la plataforma y comandos de consulta; no cambia nada,
# no instala nada y no imprime secretos. Lo medido vuelve a FaceOps (faceops_salud_plat): la ficha de la plataforma arma
# su salud y FaceOps publica los mismos valores como métricas (/metricas/plataformas) para sus alertas en Prometheus.
# Programada (schedule de AAP cada 15 min, aprobado una sola vez con «Plataforma · Programar medición»): pm_objetivos =
#   [{equipo, plataforma, puerto?}] y cada máquina del límite mide las suyas; lo que no responde se informa sin cortar a las demás.
# Variables: pm_plataforma (código: data-lake, kafka, keycloak, jboss-eap, redis, postgresql, activemq, nginx, vault,
#            satellite, red-hat-idm, 389-directory-server, iis, active-directory) · pm_puerto (opcional: puerto HTTP propio,
#            p. ej. Keycloak en 8180)
- name: Plataforma · Medir salud
  hosts: all:!localhost:!anfitrion-snapshots:!anfitrion_kvm
  gather_facts: false
  ignore_unreachable: "{{ pm_objetivos is defined }}"
  become: "{{ (ansible_connection | default('ssh')) not in ['winrm', 'psrp'] }}"
  vars:
    windows: "{{ (ansible_connection | default('ssh')) in ['winrm', 'psrp'] }}"
    linux_ok: [data-lake, kafka, keycloak, jboss-eap, redis, postgresql, activemq, nginx, vault, satellite, red-hat-idm, 389-directory-server]
    windows_ok: [iis, active-directory]
    programada: "{{ pm_objetivos is defined }}"
    lista: >-
      {{ (pm_objetivos | default([]) | selectattr('equipo', 'equalto', inventory_hostname) | list) if (pm_objetivos is defined)
         else [{'plataforma': pm_plataforma | default(''), 'puerto': pm_puerto | default('')}] }}
  tasks:
    - name: Datos válidos
      ansible.builtin.assert:
        that:
          - lista | length > 0
          - lista | map(attribute='plataforma') | reject('in', windows_ok if windows else linux_ok) | list | length == 0
          - lista | map(attribute='puerto', default='') | map('string') | reject('match', '^([0-9]{2,5})?$') | list | length == 0
        fail_msg: >-
          {{ lista | map(attribute='plataforma') | join(', ') or '(vacía)' }} no se mide por {{ 'WinRM' if (windows | bool) else 'SSH' }} en esta
          máquina: plataformas válidas {{ (windows_ok if (windows | bool) else linux_ok) | join(', ') }}
        quiet: true

    - name: Medir (Linux, APIs locales y comandos de lectura)
      when: not windows
      ansible.builtin.script:
        cmd: "medir_plataforma.py {{ item.plataforma | quote }} {{ item.puerto | default('') | string | quote }}"
        executable: /usr/bin/python3
      loop: "{{ lista }}"
      loop_control: {label: "{{ item.plataforma }}"}
      register: r_lx
      changed_when: false
      failed_when: r_lx.rc | default(1) != 0 and not (programada | bool)

    - name: Medir (Windows, WinRM)
      when: windows
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'SilentlyContinue'
        $V = @{}; $T = @{}; $C = @(); $N = @()
        function Comp($n, $ok, $d) { $script:C += @{n = $n; ok = $ok; d = $d} }
        if ('{{ item.plataforma }}' -eq 'iis') {
          $s = Get-Service W3SVC; $V.servicio_activo = [int]($s.Status -eq 'Running'); Comp 'w3svc' ($s.Status -eq 'Running') "$($s.Status)"
          $w = Get-Service WAS; Comp 'was' ($w.Status -eq 'Running') "$($w.Status)"
          Import-Module WebAdministration
          $sites = @(Get-Website); $V.sitios = $sites.Count; $V.sitios_ok = @($sites | Where-Object { $_.State -eq 'Started' }).Count
          $pools = @(Get-ChildItem IIS:\AppPools); $V.pools = $pools.Count; $V.pools_ok = @($pools | Where-Object { $_.State -eq 'Started' }).Count
          $hs = @(Get-ChildItem IIS:\SslBindings | ForEach-Object { $_.Thumbprint } | Where-Object { $_ })
          $V.certificados = $hs.Count
          $dias = @($hs | ForEach-Object { $c = Get-Item "Cert:\LocalMachine\My\$_"; if ($c) { [int]($c.NotAfter - (Get-Date)).TotalDays } })
          if ($dias.Count) { $V.cert_dias_min = ($dias | Measure-Object -Minimum).Minimum }
        } else {
          $us = 'NTDS','DNS','Netlogon','Kdc','W32Time'; $ok = 0
          foreach ($u in $us) { $s = Get-Service $u; if ($s.Status -eq 'Running') { $ok++ }; Comp $u.ToLower() ($s.Status -eq 'Running') "$($s.Status)" }
          $V.serv_ok = $ok; $V.serv_total = $us.Count
          $rep = repadmin /showrepl /csv 2>$null | ConvertFrom-Csv
          if ($rep) { $V.repl_errores = @($rep | Where-Object { [int]$_.'Number of Failures' -gt 0 }).Count }
          $V.sysvol = [int](@(Get-SmbShare -Name SYSVOL).Count -gt 0)
          $T.dominio = (Get-CimInstance Win32_ComputerSystem).Domain
        }
        @{valores = $V; texto = $T; componentes = $C; notas = $N} | ConvertTo-Json -Depth 4 -Compress
      loop: "{{ lista }}"
      loop_control: {label: "{{ item.plataforma }}"}
      register: r_win
      changed_when: false
      failed_when: r_win.rc | default(1) != 0 and not (programada | bool)

    - name: Sin medición aún
      ansible.builtin.set_fact:
        medido: {}

    - name: Lo medido
      ansible.builtin.set_fact:
        medido: "{{ medido | combine({item.item.plataforma: (item.stdout | trim | from_json) | combine({'medido': lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ')})}) }}"
      loop: "{{ (r_win if (windows | bool) else r_lx).results | selectattr('stdout', 'defined') | selectattr('stdout', 'match', '^\\s*\\{') | list }}"
      loop_control: {label: "{{ item.item.plataforma }}"}

    - name: Sin medición útil
      ansible.builtin.fail:
        msg: "{{ medido.values() | selectattr('error', 'defined') | map(attribute='error') | join('; ') or 'la plataforma no respondió a la medición' }}"
      when: not (programada | bool) and (medido | length == 0 or medido.values() | selectattr('error', 'defined') | list | length > 0)

    - name: Resultado para FaceOps (ficha y métricas de la plataforma)
      ansible.builtin.set_stats:
        data:
          faceops_salud_plat: "{{ {inventory_hostname: medido | dict2items | rejectattr('value.error', 'defined') | items2dict} }}"
        per_host: false
        aggregate: true

    - name: Resumen
      ansible.builtin.debug:
        msg: "{{ item.key }} en {{ inventory_hostname }}: {{ (item.value.valores | default({})) | dictsort | map('join', '=') | join(' · ') }}{{ (' · notas: ' ~ (item.value.notas | join('; '))) if item.value.notas | default([]) else '' }}"
      loop: "{{ medido | dict2items }}"
      loop_control: {label: "{{ item.key }}"}
