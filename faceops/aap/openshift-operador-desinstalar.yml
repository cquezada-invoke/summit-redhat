---
# OpenShift · Desinstalar operador: contraparte de «OpenShift · Instalar operador», por la API del clúster (kubernetes.core;
# credencial «OpenShift or Kubernetes API Bearer Token» con permisos de administración).
#   1. busca la Subscription del paquete en el namespace y su CSV (si no hay ninguno, no cambia nada: idempotente)
#   2. borra la Subscription y el CSV, y espera a que sus pods terminen
#   3. borra las CRD que el CSV declaraba como propias solo si ya no queda ningún recurso de ellas (si quedan, se conservan y se informa)
#   4. si el OperatorGroup y el Namespace los creó FaceOps (etiqueta faceops.invoke.cl/operador) y ya no queda otro operador
#      ni pod en el namespace, los borra; si no, los conserva
# Variables: od_paquete, od_ns, od_espera_min (5)
- name: OpenShift · Desinstalar operador
  hosts: all
  connection: local
  gather_facts: false
  vars:
    espera: "{{ ((od_espera_min | default(5) | int) * 6) | int }}"
    marca: faceops.invoke.cl/operador
  module_defaults:
    kubernetes.core.k8s: {validate_certs: false}
    kubernetes.core.k8s_info: {validate_certs: false}
  tasks:
    - name: Datos
      ansible.builtin.assert:
        that:
          - od_paquete | default('') is match('^[a-z0-9][a-z0-9.-]{0,62}$')
          - od_ns | default('') is match('^[a-z0-9][a-z0-9-]{0,62}$')
          - od_ns not in ['default', 'openshift', 'kube-system', 'openshift-marketplace', 'openshift-operator-lifecycle-manager']
        fail_msg: "Indica el paquete y el namespace del operador (no uno del sistema); nada se cambió"
        quiet: true

    - name: Retirar el operador
      ansible.builtin.include_tasks: openshift-operador-retirar.yml

    - name: Reporte
      ansible.builtin.set_stats:
        data:
          faceops_operador:
            accion: desinstalar
            paquete: "{{ od_paquete }}"
            ns: "{{ od_ns }}"
            estaba: "{{ sub | length > 0 or hay_csv | bool }}"
            csv: "{{ csvs | join(', ') }}"
            crd_borradas: "{{ crd_borrar }}"
            crd_conservadas: "{{ crd_en_uso }}"
            ns_borrado: "{{ limpio | bool and marca in (ns_obj.metadata.labels | default({})) }}"

    - name: Resumen
      ansible.builtin.debug:
        msg: >-
          {{ od_paquete }} en {{ od_ns }}:
          {{ ('desinstalado (Subscription y CSV ' ~ (csvs | join(', ')) ~ ' borrados') if (sub or hay_csv | bool) else 'no estaba instalado (nada que cambiar' }})
          · CRD borradas: {{ crd_borrar | length }}{{ (' · CRD conservadas por tener recursos: ' ~ (crd_en_uso | join(', '))) if crd_en_uso else '' }}
          · {{ 'namespace y OperatorGroup retirados' if (limpio | bool and marca in (ns_obj.metadata.labels | default({}))) else 'namespace conservado' }}
