---
# FaceOps · Habilitar servidor (categoría «Sistemas operativos»). Crea N servidores nuevos con el sistema y los recursos
# pedidos, on-premise (KVM del Centro de datos Santiago) o en Cloud GCP. Siempre se lanza con aprobación en AAP.
# Variables (formulario de FaceOps):
#   hab_so: rhel9 | rocky9 | ubuntu2404 | windows2022      hab_destino: onpremise | gcp | vmware (vCenter; en el laboratorio, simulado)
#   hab_nombre: nombre base (srv-<nombre>-01, -02…) hab_replicas: 1..5 (GCP: 1..3)
#   hab_cpu: vCPU   hab_ram_gb: GB   hab_disco_gb: GB   hab_ambiente: produccion | qa | desarrollo
# Resultado (set_stats faceops_creados): nombre, ip, so, destino → FaceOps los da de alta en el inventario
# «Servidores habilitados» de AAP. Los Linux quedan con el usuario ansible y la llave de los nodos (recolector listo);
# Windows queda instalándose (≈25 min) con WinRM habilitado y su clave en el anfitrión (no se imprime).
# On-premise: se conecta al anfitrión KVM (inventario «FaceOps · Infraestructura», usuario aap-kvm con sudo solo
# para virsh y virt-install). GCP: proyecto invoke-summit-cloud, todo con etiqueta demo=summit-cloud y prefijo summit-cloud-.
- name: Habilitar servidor · validar y planificar
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    sistemas:
      rhel10: {texto: "Red Hat Enterprise Linux 10", familia: linux, base: rhel10-base.qcow2, osinfo: rhel9.4,
               gcp: "projects/rhel-cloud/global/images/family/rhel-10"}
      rhel9: {texto: "Red Hat Enterprise Linux 9", familia: linux, base: rhel9-base.qcow2, osinfo: rhel9.4,
              gcp: "projects/rhel-cloud/global/images/family/rhel-9"}
      rhel8: {texto: "Red Hat Enterprise Linux 8", familia: linux, base: rhel8-base.qcow2, osinfo: rhel8.6,
              gcp: "projects/rhel-cloud/global/images/family/rhel-8"}
      rhel7: {texto: "Red Hat Enterprise Linux 7 (fin de vida: soporte extendido)", familia: linux, base: rhel7-base.qcow2, osinfo: rhel7.9}
      rhel6: {texto: "Red Hat Enterprise Linux 6 (fin de vida)", familia: linux, base: rhel6-base.qcow2, osinfo: rhel6.10, antiguo: true}
      rhel5: {texto: "Red Hat Enterprise Linux 5 (fin de vida)", familia: linux, base: rhel5-base.qcow2, osinfo: rhel5.11, antiguo: true, sin_cloud_init: true}
      rocky9: {texto: "Rocky Linux 9 (origen para convertir a RHEL)", familia: linux, base: rocky9-base.qcow2, osinfo: rhel9.4}
      ubuntu2404: {texto: "Ubuntu 24.04 LTS", familia: linux, base: ubuntu-2404-base.qcow2, osinfo: ubuntu24.04,
                   gcp: "projects/ubuntu-os-cloud/global/images/family/ubuntu-2404-lts-amd64"}
      windows2022: {texto: "Windows Server 2022", familia: windows, osinfo: win2k22,
                    gcp: "projects/windows-cloud/global/images/family/windows-2022"}
    so: "{{ hab_so | default('rhel9') }}"
    destino: "{{ hab_destino | default('onpremise') }}"
    base: "{{ hab_nombre | default('') | trim | lower | regex_replace('[^a-z0-9-]', '-') | regex_replace('^-+|-+$', '') }}"
    replicas: "{{ hab_replicas | default(1) | int }}"
    cpu: "{{ hab_cpu | default(1) | int }}"
    ram_gb: "{{ hab_ram_gb | default(2) | int }}"
    disco_gb: "{{ hab_disco_gb | default(40) | int }}"
    exacto: "{{ hab_nombre_exacto | default('') | trim | lower }}"   # «Recuperar servidor»: el mismo nombre del equipo perdido
  tasks:
    - name: Validar la solicitud
      ansible.builtin.set_fact:
        problemas: >-
          {{ (['sistema no soportado: ' ~ so] if so not in sistemas else [])
             + (['destino no soportado: ' ~ destino] if destino not in ['onpremise', 'gcp', 'vmware'] else [])
             + ([sistemas[so].texto ~ ' no existe como imagen en GCP: créalo on-premise (KVM)'] if so in sistemas and destino == 'gcp' and not sistemas[so].gcp | default('') else [])
             + (['el nombre base debe tener 3 a 20 letras minúsculas, números o guiones'] if not exacto and base is not match('^[a-z][a-z0-9-]{2,19}$') else [])
             + (['nombre exacto no válido'] if exacto and exacto is not match('^[a-z][a-z0-9-]{2,40}$') else [])
             + (['réplicas: de 1 a ' ~ maximo] if replicas | int < 1 or replicas | int > maximo | int else [])
             + (['recursos fuera de rango (1-8 vCPU, 2-32 GB, 20-200 GB)'] if cpu | int < 1 or cpu | int > 8 or ram_gb | int < 2
                or ram_gb | int > 32 or disco_gb | int < 20 or disco_gb | int > 200 else [])
             + (['memoria total sobre 48 GB: divide la solicitud'] if (ram_gb | int) * (replicas | int) > 48 else [])
             + (['Windows necesita al menos 4 GB y 40 GB de disco'] if so in sistemas and sistemas[so].familia == 'windows'
                and (ram_gb | int < 4 or disco_gb | int < 40) else []) }}
      vars:
        maximo: "{{ 3 if destino == 'gcp' else 5 }}"

    - name: Motivo
      ansible.builtin.set_fact:
        problema: "{{ problemas | join('; ') }}"

    - name: Solicitud no válida (no se creó nada)
      ansible.builtin.fail:
        msg: "{{ problema }}"
      when: problema | length > 0

    # Las variables de la play no viajan a las siguientes plays: se fijan como facts de localhost.
    - name: Plan
      ansible.builtin.set_fact:
        sistemas: "{{ sistemas }}"
        so: "{{ hab_so | default('rhel9') }}"
        destino: "{{ hab_destino | default('onpremise') }}"
        cpu: "{{ hab_cpu | default(1) | int }}"
        ram_gb: "{{ hab_ram_gb | default(2) | int }}"
        disco_gb: "{{ hab_disco_gb | default(40) | int }}"
        reemplazar: "{{ hab_reemplazar | default(false) | bool }}"
        nombres: "{{ [exacto] if exacto else (range(1, replicas | int + 1) | map('string') | map('regex_replace', '^(\\d)$', '0\\1') | map('regex_replace', '^', ('summit-cloud-' if destino == 'gcp' else 'srv-') ~ base ~ '-') | list) }}"

    - name: Lo que se creará
      ansible.builtin.debug:
        msg:
          - "{{ replicas }} × {{ sistemas[so].texto }} · {{ cpu }} vCPU · {{ ram_gb }} GB RAM · {{ disco_gb }} GB disco"
          - "Destino: {{ {'onpremise': 'On-premise · Centro de datos Santiago (KVM)', 'vmware': 'VMware vSphere · vCenter de Santiago', 'gcp': 'Cloud GCP · ' ~ (hab_gcp_proyecto | default('invoke-summit-cloud', true)) ~ ' (' ~ (hab_gcp_zona | default('southamerica-west1-a', true)) ~ ')'}[destino] }}"
          - "Servidores: {{ nombres | join(', ') }} · ambiente {{ hab_ambiente | default('desarrollo') }}"

# ------------------------------------------------------------------ VMware vSphere (vCenter)
# Crea la VM en el vCenter con la credencial «VMware vCenter» de la plantilla. Nace sin vincular: FaceOps no entra
# a ella hasta vincularla (en el laboratorio el vCenter es simulado y la VM no tiene sistema operativo).
- name: Habilitar servidor · VMware vSphere
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    vc: "{{ lookup('ansible.builtin.env', 'VMWARE_HOST') }}"
    guest: {rhel10: rhel9_64Guest, rhel9: rhel9_64Guest, rhel8: rhel8_64Guest, rhel7: rhel7_64Guest, rhel6: rhel6_64Guest, rhel5: rhel5_64Guest, ubuntu2404: ubuntu64Guest, rocky9: rockylinux_64Guest, windows2022: windows2019srvNext_64Guest}
  tasks:
    - name: Solo si el destino es VMware
      ansible.builtin.meta: end_play
      when: destino != 'vmware'

    - name: Hay vCenter conectado
      ansible.builtin.assert:
        that: [vc | length > 0]
        fail_msg: "Falta la credencial «VMware vCenter» en la plantilla"

    # Con la API del vCenter (pyVmomi en un entorno propio del trabajo: el entorno de ejecución no trae community.vmware)
    - name: Cliente de vSphere (pyVmomi) en un entorno temporal
      ansible.builtin.shell: |
        test -x /tmp/faceops-vmw/bin/python || (python3 -m venv /tmp/faceops-vmw && /tmp/faceops-vmw/bin/pip -q install pyvmomi)
      changed_when: false

    - name: Crear las VM en el vCenter
      ansible.builtin.shell: |
        /tmp/faceops-vmw/bin/python - <<'PYEOF'
        import json, os, ssl, time
        from pyVim.connect import SmartConnect
        from pyVmomi import vim
        from urllib.parse import urlparse
        h = os.environ["VMWARE_HOST"]; u = urlparse(h if "://" in h else "https://" + h)
        host, port = u.hostname, u.port or int("{{ hab_vc_puerto | default(443) }}")
        si = SmartConnect(host=host, port=int(port), user=os.environ["VMWARE_USER"], pwd=os.environ["VMWARE_PASSWORD"],
                          sslContext=ssl._create_unverified_context())
        c = si.RetrieveContent()
        dc = next(x for x in c.rootFolder.childEntity if x.name == "Santiago")
        carpeta = next((x for x in dc.vmFolder.childEntity if x.name == "Produccion"), dc.vmFolder)
        cl = next(x for x in dc.hostFolder.childEntity if x.name == "Produccion")
        ya = {v.name for v in c.viewManager.CreateContainerView(c.rootFolder, [vim.VirtualMachine], True).view}
        creadas = []
        for n in {{ nombres | to_json }}:
            if n in ya:
                continue
            spec = vim.vm.ConfigSpec(name=n, numCPUs={{ cpu }}, memoryMB={{ (ram_gb | int) * 1024 }}, guestId="{{ guest[so] }}",
                                     files=vim.vm.FileInfo(vmPathName="[LocalDS_0]"),
                                     annotation="Creada por FaceOps · Habilitar servidor · ambiente {{ hab_ambiente | default('desarrollo') }}")
            t = carpeta.CreateVM_Task(config=spec, pool=cl.resourcePool)
            while t.info.state in ("queued", "running"):
                time.sleep(1)
            if t.info.state != "success":
                raise SystemExit(f"{n}: {t.info.error}")
            vm = t.info.result
            vm.PowerOnVM_Task()
            creadas.append(n)
        print(json.dumps(creadas))
        PYEOF
      register: r_vmw
      changed_when: "'cliente' in r_vmw.stdout or r_vmw.stdout | length > 2"

    - name: Resultado para FaceOps
      ansible.builtin.set_stats:
        data:
          faceops_creados: "{{ nombres | map('regex_replace', '$', '|') | list }}"
          faceops_so: "{{ so }}"
          faceops_destino: vmware
          faceops_ambiente: "{{ hab_ambiente | default('desarrollo') }}"

# ------------------------------------------------------------------ on-premise (KVM)
- name: Habilitar servidor · on-premise (KVM)
  hosts: anfitrion_kvm
  gather_facts: false
  vars:
    sis: "{{ hostvars.localhost.sistemas[hostvars.localhost.so] }}"
    so: "{{ hostvars.localhost.so }}"
    dir: /var/lib/libvirt/images/faceops
    rh_llave_: "{{ hab_rh_llave | default('', true) or rhsm_llave | default('') }}"   # la del pedido o, en flujos internos, la guardada en AAP
    rh_org_: "{{ hab_rh_org | default('', true) or rhsm_org | default('') }}"
    registra_rh: "{{ so in ['rhel10', 'rhel9', 'rhel8', 'rhel7'] and (rh_llave_ | length) > 0 and (rh_org_ | string | length) > 0 }}"
  tasks:
    - name: Solo si el destino es on-premise
      ansible.builtin.meta: end_play
      when: hostvars.localhost.destino != 'onpremise'

    - name: Servidores que ya existen (no se tocan)
      ansible.builtin.command: sudo -n virsh list --all --name
      register: r_vms
      changed_when: false

    - name: Reemplazar el servidor perdido (se apaga; con hab_conservar_fallida queda definido como <nombre>-fallida-<fecha> para revisarlo)
      ansible.builtin.shell: |
        set -o pipefail
        n={{ item }}; f=$(date +%Y%m%d%H%M)
        sudo -n virsh destroy "$n" 2>/dev/null
        if [ "{{ hab_conservar_fallida | default(false) | bool }}" = "True" ]; then
          x=$(mktemp); sudo -n virsh dumpxml --inactive "$n" > "$x"
          d=$(grep -A3 "device='disk'" "$x" | grep -o "source file='[^']*'" | head -1 | cut -d"'" -f2)
          nd=$(dirname "$d")/$n-fallida-$f.qcow2; sudo -n mv "$d" "$nd"
          sed -i -e "s|<name>$n</name>|<name>$n-fallida-$f</name>|" -e '/<uuid>/d' -e '/<mac address/d' -e "s|$d|$nd|" "$x"
          sudo -n virsh undefine "$n" --nvram 2>/dev/null || sudo -n virsh undefine "$n"
          sudo -n virsh define "$x" >/dev/null && sudo -n virsh autostart --disable "$n-fallida-$f" >/dev/null 2>&1; rm -f "$x"
          echo "conservada=$n-fallida-$f"
        else
          sudo -n virsh undefine "$n" --nvram 2>/dev/null || sudo -n virsh undefine "$n"
          [ -f {{ dir }}/$n.qcow2 ] && mv {{ dir }}/$n.qcow2 {{ dir }}/$n.reemplazado-$f.qcow2
          echo reemplazado
        fi
      loop: "{{ hostvars.localhost.nombres }}"
      when: hostvars.localhost.reemplazar | bool and item in r_vms.stdout_lines
      register: r_reemp
      changed_when: true

    - name: Servidores que existen después del reemplazo
      ansible.builtin.command: sudo -n virsh list --all --name
      register: r_vms
      changed_when: false

    - name: Llave de los nodos (usuario ansible)
      ansible.builtin.slurp:
        src: "{{ dir }}/llave.pub"
      register: r_llave

    - name: Llave RSA de los sistemas legados (RHEL 5/6 no aceptan ed25519)
      ansible.builtin.slurp:
        src: "{{ dir }}/llave-legado.pub"
      register: r_llave_leg
      failed_when: false
      when: sis.antiguo | default(false)

    - name: Crear servidores Linux (disco desde la imagen base + cloud-init)
      when: sis.familia == 'linux'
      block:
        - name: Imagen base del sistema (FaceOps · Preparar imágenes RHEL, o la original del anfitrión)
          ansible.builtin.shell: |
            for f in {{ dir }}/base/{{ sis.base }} /var/lib/libvirt/images/{{ sis.base }}; do [ -r $f ] && { echo $f; exit 0; }; done; echo falta
          register: r_base
          changed_when: false

        - name: Hay imagen base
          ansible.builtin.assert:
            that: [r_base.stdout != 'falta']
            fail_msg: "No hay imagen de {{ sis.texto }} en el anfitrión: ejecuta antes «FaceOps · Preparar imágenes RHEL»"
            quiet: true

        - name: Disco de cada servidor (copia ligera de la imagen base)
          ansible.builtin.command: >-
            qemu-img create -q -f qcow2 -F qcow2 -b {{ r_base.stdout }}
            {{ dir }}/{{ item }}.qcow2 {{ hostvars.localhost.disco_gb }}G
          args:
            creates: "{{ dir }}/{{ item }}.qcow2"
          loop: "{{ hostvars.localhost.nombres }}"
          when: item not in r_vms.stdout_lines

        - name: cloud-init de cada servidor
          ansible.builtin.copy:
            dest: "{{ dir }}/{{ item }}-user-data.yml"
            mode: "0640"
            content: |
              #cloud-config
              hostname: {{ item }}
              users:
                - name: ansible
                  sudo: ALL=(ALL) NOPASSWD:ALL
                  shell: /bin/bash
                  ssh_authorized_keys: {{ ([r_llave.content | b64decode | trim] + ([r_llave_leg.content | b64decode | trim] if r_llave_leg.content is defined else [])) | to_json }}
              ssh_pwauth: false
              timezone: America/Santiago
              growpart: {mode: auto, devices: ['/']}
              package_update: false
              {% if registra_rh %}
              rh_subscription:
                activation-key: {{ rh_llave_ | to_json }}
                org: {{ rh_org_ | string | to_json }}
              {% endif %}
          loop: "{{ hostvars.localhost.nombres }}"
          when: item not in r_vms.stdout_lines
          no_log: "{{ registra_rh }}"

        - name: Crear y encender cada servidor
          ansible.builtin.command: >-
            sudo -n virt-install --name {{ item }} --memory {{ (hostvars.localhost.ram_gb | int) * 1024 }}
            --vcpus {{ hostvars.localhost.cpu }} --import --disk {{ dir }}/{{ item }}.qcow2,bus=virtio
            --osinfo {{ sis.osinfo }} --network network=default,model=virtio
            {{ '--graphics vnc,listen=127.0.0.1 --video vga' if sis.antiguo | default(false) else '--graphics none' }}
            {{ '' if sis.sin_cloud_init | default(false) else '--cloud-init user-data=' ~ dir ~ '/' ~ item ~ '-user-data.yml' }} --noautoconsole --autostart
          loop: "{{ hostvars.localhost.nombres }}"
          when: item not in r_vms.stdout_lines

        - name: Sin rastro de la clave de activación en el anfitrión (virt-install ya la entregó a la máquina)
          ansible.builtin.file:
            path: "{{ dir }}/{{ item }}-user-data.yml"
            state: absent
          loop: "{{ hostvars.localhost.nombres }}"
          when: registra_rh

    - name: Crear servidores Windows (instalación desatendida desde la ISO)
      when: sis.familia == 'windows'
      block:
        - name: Clave de cada servidor (queda solo en el anfitrión)
          ansible.builtin.set_fact:
            claves: "{{ claves | default({}) | combine({item: lookup('ansible.builtin.password', '/dev/null', length=20, chars=['ascii_letters', 'digits']) ~ '-A1'}) }}"
          loop: "{{ hostvars.localhost.nombres }}"
          no_log: true

        - name: Guardar las claves en el anfitrión (solo lectura del usuario aap-kvm)
          ansible.builtin.copy:
            dest: "{{ dir }}/claves/{{ item }}.txt"
            mode: "0600"
            content: "Administrator={{ claves[item] }}\nansible={{ claves[item] }}\n"
          loop: "{{ hostvars.localhost.nombres }}"
          when: item not in r_vms.stdout_lines
          no_log: true

        - name: Respuestas de la instalación desatendida
          ansible.builtin.shell: |
            set -e
            t=$(mktemp -d)
            sed -e "s/__NOMBRE__/$(echo {{ item }} | tr a-z A-Z | cut -c1-15)/" -e "s/__CLAVE_ADMIN__/$CLAVE/" -e "s/__CLAVE_ANSIBLE__/$CLAVE/" \
              {{ dir }}/autounattend-windows.xml > $t/autounattend.xml
            genisoimage -quiet -J -r -o {{ dir }}/{{ item }}-autounattend.iso $t/autounattend.xml
            rm -rf $t
          environment:
            CLAVE: "{{ claves[item] }}"
          args:
            creates: "{{ dir }}/{{ item }}-autounattend.iso"
          loop: "{{ hostvars.localhost.nombres }}"
          when: item not in r_vms.stdout_lines
          no_log: true

        - name: Espacio libre en el anfitrión (Windows ocupa ~15 GB reales; el disco es dinámico)
          ansible.builtin.shell: df --output=avail -BG {{ dir }} | tail -1 | tr -dc 0-9
          register: r_libre
          changed_when: false

        - name: Hay espacio para instalar Windows
          ansible.builtin.assert:
            that: (r_libre.stdout | int) >= 20 * (hostvars.localhost.nombres | length)
            fail_msg: >-
              El anfitrión KVM tiene {{ r_libre.stdout }} GB libres y cada Windows necesita al menos 20 GB reales
              (el disco de {{ hostvars.localhost.disco_gb }} GB es dinámico): libera espacio o elige otra infraestructura
            quiet: true

        - name: Crear y encender cada servidor Windows
          ansible.builtin.command: >-
            sudo -n virt-install --name {{ item }} --memory {{ (hostvars.localhost.ram_gb | int) * 1024 }}
            --vcpus {{ hostvars.localhost.cpu }} --os-variant win2k22
            --disk path={{ dir }}/{{ item }}.qcow2,size={{ hostvars.localhost.disco_gb }},bus=sata,format=qcow2
            --cdrom /var/lib/libvirt/images/windows/ws2022-eval.iso --disk path={{ dir }}/{{ item }}-autounattend.iso,device=cdrom,bus=sata
            --network network=default,model=e1000e --graphics vnc,listen=127.0.0.1 --noautoconsole --boot hd,cdrom --autostart
            --check disk_size=off
          loop: "{{ hostvars.localhost.nombres }}"
          when: item not in r_vms.stdout_lines

    - name: IP de cada servidor (DHCP del anfitrión)
      ansible.builtin.shell: |
        for i in $(seq 1 60); do
          ip=$(sudo -n virsh domifaddr {{ item }} --source lease 2>/dev/null | awk '/ipv4/ {split($4,a,"/"); print a[1]; exit}')
          [ -n "$ip" ] && { echo $ip; exit 0; }
          sleep 5
        done
        echo pendiente
      register: r_ip
      changed_when: false
      loop: "{{ hostvars.localhost.nombres }}"

    - name: Esperar SSH (Linux)
      ansible.builtin.wait_for:
        host: "{{ item.stdout }}"
        port: 22
        timeout: 300
      loop: "{{ r_ip.results }}"
      loop_control: {label: "{{ item.item }}"}
      when: sis.familia == 'linux' and item.stdout != 'pendiente'

    - name: Resultado para FaceOps
      ansible.builtin.set_stats:
        data:
          faceops_creados: >-
            {{ r_ip.results | map(attribute='item') | zip(r_ip.results | map(attribute='stdout'))
               | map('join', '|') | list }}
          faceops_so: "{{ so }}"
          faceops_destino: onpremise
          faceops_ambiente: "{{ hab_ambiente | default('desarrollo') }}"

    - name: Servidores creados
      ansible.builtin.debug:
        msg: "{{ r_ip.results | map(attribute='item') | zip(r_ip.results | map(attribute='stdout')) | map('join', ' → ') | list
                 + ([] if sis.familia == 'linux' else ['Windows se está instalando (≈25 min); WinRM queda habilitado al terminar']) }}"

# ------------------------------------------------------------------ Cloud GCP
- name: Habilitar servidor · Cloud GCP
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    proyecto: "{{ hab_gcp_proyecto | default(lookup('ansible.builtin.env', 'GCE_PROJECT') or lookup('ansible.builtin.env', 'GOOGLE_CLOUD_PROJECT') or 'invoke-summit-cloud', true) }}"
    zona: "{{ hab_gcp_zona | default('southamerica-west1-a', true) }}"
    gcp: &gcp
      auth_kind: serviceaccount
      service_account_file: "{{ lookup('ansible.builtin.env', 'GCP_SERVICE_ACCOUNT_FILE') }}"
      project: "{{ hab_gcp_proyecto | default(lookup('ansible.builtin.env', 'GCE_PROJECT') or lookup('ansible.builtin.env', 'GOOGLE_CLOUD_PROJECT') or 'invoke-summit-cloud', true) }}"
  tasks:
    - name: Solo si el destino es GCP
      ansible.builtin.meta: end_play
      when: destino != 'gcp'

    - name: ¿Está conectada la nube?
      ansible.builtin.fail:
        msg: "La nube no está conectada: la infraestructura GCP elegida no entregó su credencial (no se creó nada)"
      when: lookup('ansible.builtin.env', 'GCP_SERVICE_ACCOUNT_FILE') | length == 0

    - name: Red de la nube
      google.cloud.gcp_compute_network_info:
        filters: ["name = default"]
        <<: *gcp
      register: r_red

    - name: Crear cada servidor (etiqueta demo=summit-cloud)
      google.cloud.gcp_compute_instance:
        name: "{{ item }}"
        zone: "{{ zona }}"
        machine_type: "e2-custom-{{ cpu }}-{{ (ram_gb | int) * 1024 }}"
        labels: {demo: summit-cloud, origen: faceops, ambiente: "{{ hab_ambiente | default('desarrollo') }}", so: "{{ so }}"}
        tags: {items: [summit-cloud]}
        disks:
          - auto_delete: true
            boot: true
            initialize_params:
              source_image: "{{ sistemas[so].gcp }}"
              disk_size_gb: "{{ disco_gb }}"
        network_interfaces:
          - network: {selfLink: "{{ r_red.resources[0].selfLink }}"}
            access_configs: [{name: External NAT, type: ONE_TO_ONE_NAT}]
        metadata: "{{ {} if sistemas[so].familia == 'windows' else {'ssh-keys': 'ansible:' ~ lookup('ansible.builtin.file', playbook_dir ~ '/../datos/ssh-nube.pub')} }}"
        state: present
        <<: *gcp
      loop: "{{ nombres }}"
      register: r_vms

    - name: Resultado para FaceOps
      ansible.builtin.set_stats:
        data:
          faceops_creados: "{{ r_vms.results | map(attribute='name') | zip(r_vms.results | map(attribute='networkInterfaces') | map('first') | map(attribute='accessConfigs') | map('first') | map(attribute='natIP')) | map('join', '|') | list }}"
          faceops_so: "{{ so }}"
          faceops_destino: gcp
          faceops_ambiente: "{{ hab_ambiente | default('desarrollo') }}"
