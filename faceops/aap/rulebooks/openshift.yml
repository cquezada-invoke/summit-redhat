# Event-Driven Ansible · OpenShift. Alertmanager de cada clúster envía sus alertas a este webhook (:5021).
# Cada alerta nueva (o resuelta) dispara «OpenShift · Recolectar clúster»: Ansible vuelve a leer la API y FaceOps
# muestra el estado actualizado sin conectarse al clúster. La alerta queda además en Alertas de FaceOps (auditoría de EDA).
- name: OpenShift · eventos del clúster
  hosts: all
  sources:
    - name: alertas_openshift
      ansible.eda.alertmanager:
        host: 0.0.0.0
        port: 5021
        data_alerts_path: alerts
        data_host_path: ""
  rules:
    - name: Modelo de alertamiento · umbral crítico → remediación con aprobación
      condition: event.alert.status == "firing" and event.alert.labels.faceops_pilar is defined and event.alert.labels.severity == "critical" and event.alert.labels.faceops_accion != "diagnosticar"
      throttle:
        once_within: 30 minutes
        group_by_attributes:
          - event.alert.labels.alertname
          - event.alert.labels.namespace
      action:
        run_workflow_template:
          name: "OpenShift · Remediar alerta (con aprobación)"
          organization: "FaceOps"
          job_args:
            limit: "ocp-sno"
            extra_vars:
              ra_accion: "{{ event.alert.labels.faceops_accion }}"
              ra_alerta: "{{ event.alert.labels.alertname }}"
              ra_namespace: "{{ event.alert.labels.namespace | default('') }}"
              ra_pod: "{{ event.alert.labels.pod | default('') }}"
              ra_deployment: "{{ event.alert.labels.deployment | default('') }}"
              ra_pvc: "{{ event.alert.labels.persistentvolumeclaim | default('') }}"
              ra_nodo: "{{ event.alert.labels.node | default('') }}"
    - name: Modelo de alertamiento · aviso o diagnóstico → diagnóstico automático (solo lectura)
      condition: event.alert.status == "firing" and event.alert.labels.faceops_pilar is defined and (event.alert.labels.severity == "warning" or event.alert.labels.faceops_accion == "diagnosticar")
      throttle:
        once_within: 30 minutes
        group_by_attributes:
          - event.alert.labels.alertname
      action:
        run_job_template:
          name: "OpenShift · Remediar alerta"
          organization: "FaceOps"
          job_args:
            limit: "ocp-sno"
            extra_vars:
              ra_accion: diagnosticar
              ra_alerta: "{{ event.alert.labels.alertname }}"
              ra_namespace: "{{ event.alert.labels.namespace | default('') }}"
    - name: Alerta de OpenShift → recolectar el clúster
      condition: event.alert.status in ["firing", "resolved"] and event.alert.labels.alertname not in ["Watchdog", "InfoInhibitor"]
      throttle:
        once_within: 5 minutes
        group_by_attributes:
          - event.alert.labels.alertname
      action:
        run_job_template:
          name: "OpenShift · Recolectar clúster"
          organization: "FaceOps"
          job_args:
            limit: "ocp-sno"
            extra_vars:
              origen_evento: "EDA · alerta {{ event.alert.labels.alertname }} ({{ event.alert.status }}) en OpenShift"
