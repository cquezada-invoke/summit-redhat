---
# FaceOps · Aplicar política de seguridad. Motor genérico: recibe una política versionada de FaceOps (politica) y la
# aplica a los equipos del límite, o solo verifica su cumplimiento sin cambiar nada (politica_modo: verificar).
# Reglas: linea · sysctl · servicio · permisos · archivo · comando · firewall (ver datos/politicas.yml de FaceOps).
# firewall: FaceOps manda en politica_firewall, por equipo, los puertos de su rol, consolas y flujos (abrir / restringir a un origen).
# Resultado (set_stats faceops_politica): por equipo, si cumple y qué reglas no cumplía (o se corrigieron).
- name: Política de seguridad
  hosts: all
  become: true
  gather_facts: false
  vars:
    p: "{{ politica if politica is mapping else (politica | from_json) }}"
    verificar: "{{ (politica_modo | default('aplicar')) == 'verificar' }}"
    reglas: "{{ p.reglas | default([]) }}"
  tasks:
    - name: "{{ p.id }} v{{ p.version }} · {{ p.nombre }} ({{ 'verificar' if verificar else 'aplicar' }})"
      ansible.builtin.debug: {msg: "{{ p.descripcion | default('') }}"}

    - name: Líneas de configuración
      ansible.builtin.lineinfile: {path: "{{ item.archivo }}", regexp: "{{ item.regexp }}", line: "{{ item.linea }}", create: true, mode: "0600"}
      loop: "{{ reglas | selectattr('tipo', 'equalto', 'linea') | list }}"
      loop_control: {label: "{{ item.linea }}"}
      check_mode: "{{ verificar }}"
      register: r_linea

    - name: Parámetros del kernel
      ansible.posix.sysctl: {name: "{{ item.nombre }}", value: "{{ item.valor }}", sysctl_file: /etc/sysctl.d/90-faceops-politicas.conf, reload: true}
      loop: "{{ reglas | selectattr('tipo', 'equalto', 'sysctl') | list }}"
      loop_control: {label: "{{ item.nombre }} = {{ item.valor }}"}
      check_mode: "{{ verificar }}"
      register: r_sysctl

    - name: Servicios
      ansible.builtin.systemd_service:
        name: "{{ item.nombre }}"
        state: "{{ 'started' if item.activo | default(true) else 'stopped' }}"
        enabled: "{{ item.activo | default(true) }}"
      loop: "{{ reglas | selectattr('tipo', 'equalto', 'servicio') | list }}"
      loop_control: {label: "{{ item.nombre }}"}
      check_mode: "{{ verificar }}"
      register: r_servicio

    - name: Permisos
      ansible.builtin.file: {path: "{{ item.ruta }}", mode: "{{ item.modo }}", owner: "{{ item.dueno | default(omit) }}", group: "{{ item.grupo | default(omit) }}"}
      loop: "{{ reglas | selectattr('tipo', 'equalto', 'permisos') | list }}"
      loop_control: {label: "{{ item.ruta }} {{ item.modo }}"}
      check_mode: "{{ verificar }}"
      register: r_permisos

    - name: Directorios de los archivos
      ansible.builtin.file: {path: "{{ item }}", state: directory, mode: "0755"}
      loop: "{{ reglas | selectattr('tipo', 'equalto', 'archivo') | map(attribute='ruta') | map('dirname') | unique | list }}"
      check_mode: "{{ verificar }}"

    - name: Archivos
      ansible.builtin.copy:
        dest: "{{ item.ruta }}"
        content: "{{ item.contenido }}"
        mode: "{{ item.modo | default('0644') }}"
        validate: "{{ 'visudo -cf %s' if item.ruta.startswith('/etc/sudoers') else omit }}"
      loop: "{{ reglas | selectattr('tipo', 'equalto', 'archivo') | list }}"
      loop_control: {label: "{{ item.ruta }}"}
      check_mode: "{{ verificar }}"
      register: r_archivo

    - name: Firewall (puertos de su rol, consolas y flujos declarados en FaceOps)
      ansible.builtin.shell: |
        set -u
        # 1) validar los puertos antes de tocar nada
        for x in $FW_ABRIR $FW_RESTRINGIR; do p=${x%@*}; n=${p%/*}
          echo "$p" | grep -Eq '^[0-9]{1,5}/(tcp|udp)$' && [ "$n" -ge 1 ] && [ "$n" -le 65535 ] || { echo "ERROR puerto inválido: $x (no se cambió nada)"; exit 2; }
          case "$x" in *@*) echo "${x#*@}" | grep -Eq '^[0-9]{1,3}(\.[0-9]{1,3}){3}(/[0-9]{1,2})?$' || { echo "ERROR origen inválido: $x (no se cambió nada)"; exit 2; };; esac
        done
        revisar() {
          ok=1
          rpm -q firewalld >/dev/null 2>&1 || { echo "FALTA firewalld instalado"; ok=0; return; }
          { systemctl -q is-active firewalld && systemctl -q is-enabled firewalld; } || { echo "FALTA firewalld activo y al iniciar"; ok=0; return; }
          Z=$(firewall-cmd --get-default-zone); P=" $(firewall-cmd --permanent --zone=$Z --list-ports) "
          S=" $(firewall-cmd --permanent --zone=$Z --list-services) "; R=$(firewall-cmd --permanent --zone=$Z --list-rich-rules)
          for p in $FW_ABRIR; do
            case "$P" in *" $p "*) continue;; esac
            if [ "$p" = 22/tcp ]; then case "$S" in *" ssh "*) continue;; esac; fi
            echo "FALTA puerto $p"; ok=0
          done
          for x in $FW_RESTRINGIR; do p=${x%@*}; s=${x#*@}
            echo "$R" | grep -Fq "source address=\"$s\" port port=\"${p%/*}\" protocol=\"${p#*/}\" accept" || { echo "FALTA puerto $p solo desde $s"; ok=0; }
          done
        }
        revisar; CAMBIO=0
        if [ "$FW_MODO" = aplicar ] && [ $ok = 0 ]; then
          CAMBIO=1
          rpm -q firewalld >/dev/null 2>&1 || dnf -y -q install firewalld || { echo "ERROR no se pudo instalar firewalld"; exit 3; }
          systemctl enable --now firewalld || exit 3
          Z=$(firewall-cmd --get-default-zone)
          for p in $FW_ABRIR; do firewall-cmd -q --permanent --zone=$Z --add-port=$p || exit 3; done
          for x in $FW_RESTRINGIR; do p=${x%@*}; s=${x#*@}
            firewall-cmd -q --permanent --zone=$Z --add-rich-rule="rule family=\"ipv4\" source address=\"$s\" port port=\"${p%/*}\" protocol=\"${p#*/}\" accept" || exit 3
          done
          # redes de Podman en la zona de confianza (lo mismo que hace netavark con firewalld): los contenedores publicados siguen respondiendo
          if command -v podman >/dev/null; then
            for s in $(podman network ls --format json | python3 -c 'import json,sys; print(" ".join(x["subnet"] for n in json.load(sys.stdin) for x in n.get("subnets") or []))'); do
              firewall-cmd -q --permanent --zone=trusted --add-source=$s || exit 3
            done
          fi
          firewall-cmd -q --reload || exit 3
          revisar >/dev/null; [ $ok = 1 ] || { echo "ERROR tras aplicar sigue sin cumplir"; exit 4; }
        fi
        # informativo: lo que escucha hacia la red y queda cerrado (no es de su rol ni de sus flujos)
        if systemctl -q is-active firewalld; then
          for l in $(ss -ltnH | awk '{print $4}' | grep -Ev '^(127\.|\[::1\])' | sed 's/.*://' | sort -un); do
            case " $FW_ABRIR $FW_RESTRINGIR " in *" $l/tcp "*|*" $l/tcp@"*) ;; *) echo "CERRADO $l/tcp";; esac
          done
        fi
        echo "CAMBIO=$CAMBIO"
      args: {executable: /bin/bash}
      environment:
        FW_MODO: "{{ 'verificar' if verificar else 'aplicar' }}"
        FW_ABRIR: "{{ fw_eq.abrir | default([]) | join(' ') }}"
        FW_RESTRINGIR: "{{ fw_eq.restringir | default([]) | join(' ') }}"
      vars:
        fw_regla: "{{ reglas | selectattr('tipo', 'equalto', 'firewall') | first }}"
        fw_eq: "{{ (politica_firewall | default({})).get(inventory_hostname) or {'abrir': fw_regla.siempre | default(['22/tcp']), 'restringir': []} }}"
      when: reglas | selectattr('tipo', 'equalto', 'firewall') | list | length > 0
      register: r_fw
      changed_when: "'CAMBIO=1' in r_fw.stdout"
      failed_when: r_fw.rc != 0
      check_mode: false

    - name: Verificaciones
      ansible.builtin.shell: "{{ item.verificar }}"
      loop: "{{ reglas | selectattr('tipo', 'equalto', 'comando') | list }}"
      loop_control: {label: "{{ item.verificar | truncate(70) }}"}
      register: r_cv
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Correcciones
      ansible.builtin.shell: "{{ item.item.aplicar }}"
      loop: "{{ r_cv.results | selectattr('rc', 'ne', 0) | list }}"
      loop_control: {label: "{{ item.item.aplicar | truncate(70) }}"}
      when: not verificar

    - name: Lo que no cumplía
      ansible.builtin.set_fact:
        incumple: >-
          {{ (r_linea.results | selectattr('changed') | map(attribute='item.linea') | list)
           + (r_sysctl.results | selectattr('changed') | map(attribute='item.nombre') | list)
           + (r_servicio.results | selectattr('changed') | map(attribute='item.nombre') | map('regex_replace', '^', 'servicio ') | list)
           + (r_permisos.results | selectattr('changed') | map(attribute='item.ruta') | map('regex_replace', '^', 'permisos ') | list)
           + (r_archivo.results | selectattr('changed') | map(attribute='item.ruta') | list)
           + (r_cv.results | selectattr('rc', 'ne', 0) | map(attribute='item.verificar') | map('truncate', 60) | list)
           + (r_fw.stdout_lines | default([]) | select('match', '^FALTA ') | map('regex_replace', '^FALTA ', 'firewall: ') | list) }}
        fw_cerrados: "{{ r_fw.stdout_lines | default([]) | select('match', '^CERRADO ') | map('regex_replace', '^CERRADO ', '') | list }}"

    - name: Validar SSH antes de recargar
      ansible.builtin.command: sshd -t
      when: not verificar and incumple | length > 0 and 'sshd' in p.recargar | default([])
      changed_when: false

    - name: Recargar los servicios afectados
      ansible.builtin.systemd_service: {name: "{{ item }}", state: reloaded}
      loop: "{{ p.recargar | default([]) }}"
      when: not verificar and incumple | length > 0

    - name: Resultado para FaceOps
      ansible.builtin.set_stats:
        data:
          faceops_politica: "{{ {inventory_hostname: {'cumple': (incumple | length == 0) or not verificar, 'incumplia': incumple, 'modo': 'verificar' if verificar else 'aplicar', 'cerrados': fw_cerrados}} }}"

    - name: Resumen
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: {{ 'cumple' if incumple | length == 0 else (('no cumple: ' if verificar else 'corregido: ') ~ (incumple | join(', '))) }}{{ (' · quedan cerrados (no son de su rol ni de sus flujos): ' ~ (fw_cerrados | join(', '))) if fw_cerrados else '' }}"
