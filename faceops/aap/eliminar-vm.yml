---
# FaceOps · Eliminar VM: apaga y retira de libvirt un servidor creado por FaceOps. Su disco se conserva aparte
# (<nombre>.eliminado-<fecha>.qcow2) y su respaldo en Git queda intacto: se puede recuperar.  Variables: el_equipo
- name: Eliminar VM
  hosts: anfitrion_kvm
  gather_facts: false
  vars:
    dir: /var/lib/libvirt/images/faceops
  tasks:
    - name: Validar el nombre
      ansible.builtin.assert:
        that:
          - el_equipo | default('') is match('^[a-z][a-z0-9-]{2,40}$')
        quiet: true

    - name: Apagar y retirar de libvirt; conservar el disco aparte
      ansible.builtin.shell: |
        if sudo -n virsh dominfo {{ el_equipo }} >/dev/null 2>&1; then
          sudo -n virsh destroy {{ el_equipo }} 2>/dev/null
          sudo -n virsh undefine {{ el_equipo }} --nvram 2>/dev/null || sudo -n virsh undefine {{ el_equipo }}
          echo "vm eliminada"
        else echo "la vm no existía"; fi
        f={{ dir }}/{{ el_equipo }}.qcow2
        [ -f "$f" ] && mv "$f" {{ dir }}/{{ el_equipo }}.eliminado-$(date +%Y%m%d%H%M).qcow2 && echo "disco conservado aparte"
        rm -f {{ dir }}/{{ el_equipo }}-user-data.yml
      register: r_el
      changed_when: "'vm eliminada' in r_el.stdout"

    - name: Resultado
      ansible.builtin.set_stats:
        data: {faceops_eliminado: {equipo: "{{ el_equipo }}", detalle: "{{ r_el.stdout_lines }}"}}
