---
# FaceOps · Incorporar máquinas: deja en cada máquina de una infraestructura de nube el usuario de servicio de FaceOps
# con su llave pública (la privada vive solo en la credencial cifrada de AAP «Infra · <nombre> · máquinas»), usando la
# API de la plataforma, sin entrar a las máquinas con otra clave:
#   gcp    metadatos ssh-keys de cada instancia Linux (el agente de Google crea el usuario con sudo). Windows: script de
#          arranque que crea el usuario de servicio (administrador local) con la clave de la credencial y habilita WinRM
#          HTTPS (5986); regla de firewall solo desde AAP; si WinRM aún no responde con esa clave, reinicia la VM una vez
#          (el script corre al arrancar) y al terminar retira el script de los metadatos (la clave no queda en la nube).
#          No instala agentes: el inventario y la medición son por SSH o WinRM.
#   azure  Run Command en cada VM Linux
#   aws    SSM Run Command en cada instancia administrada por SSM
# Variables: inc_plataforma, inc_usuario (faceops), inc_llave_publica, inc_proyecto/inc_zona (gcp), inc_region (aws),
#            inc_etiqueta (clave=valor: solo las máquinas con esa etiqueta), inc_maquina (solo esa máquina),
#            inc_clave_windows (secreto: clave del usuario de servicio en Windows; viaja como variable de entorno, no se imprime)
- name: Incorporar máquinas a FaceOps
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    usuario: "{{ inc_usuario | default('faceops') }}"
    script_linux: |
      id {{ usuario }} >/dev/null 2>&1 || useradd -m -c "FaceOps (servicio)" {{ usuario }}
      install -d -m 700 -o {{ usuario }} -g {{ usuario }} /home/{{ usuario }}/.ssh
      grep -qxF '{{ inc_llave_publica }}' /home/{{ usuario }}/.ssh/authorized_keys 2>/dev/null || echo '{{ inc_llave_publica }}' >> /home/{{ usuario }}/.ssh/authorized_keys
      chown {{ usuario }}:{{ usuario }} /home/{{ usuario }}/.ssh/authorized_keys; chmod 600 /home/{{ usuario }}/.ssh/authorized_keys
      echo '{{ usuario }} ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/90-faceops; chmod 440 /etc/sudoers.d/90-faceops
      echo FACEOPS_OK
  tasks:
    - name: Validar
      ansible.builtin.assert:
        that:
          - inc_plataforma | default('') in ['gcp', 'azure', 'aws']
          - inc_llave_publica | default('') is match('^ssh-(ed25519|rsa) ')
          - usuario is match('^[a-z_][a-z0-9_-]{1,30}$')
        fail_msg: "Plataforma soportada: gcp, azure o aws (en vSphere y on-premise se usa la credencial de acceso de la infraestructura)"
        quiet: true

    - name: Incorporar en {{ inc_plataforma }}
      no_log: true   # la clave de Windows viaja en el entorno del proceso; el resultado se muestra en la tarea siguiente
      environment:
        FACEOPS_CLAVE_WIN: "{{ inc_clave_windows | default('') }}"
      ansible.builtin.shell: |
        python3 - <<'P'
        import json, os, socket, sys, time
        plat, usuario, pub = "{{ inc_plataforma }}", "{{ usuario }}", "{{ inc_llave_publica }}"
        etq = "{{ inc_etiqueta | default('') }}"
        solo = "{{ inc_maquina | default('') }}"
        ek, _, ev = etq.partition("=")
        clave_win = os.environ.get("FACEOPS_CLAVE_WIN", "")

        def abierto(ip, puerto, seg):
            fin = time.time() + seg
            while time.time() < fin:
                try:
                    socket.create_connection((ip, puerto), timeout=5).close()
                    return True
                except OSError:
                    time.sleep(10)
            return False

        def winrm_ok(ip):
            try:
                import winrm
                r = winrm.Session(f"https://{ip}:5986/wsman", auth=(usuario, clave_win), transport="ntlm",
                                  server_cert_validation="ignore").run_cmd("whoami")
                return r.status_code == 0
            except Exception:
                return False

        PS = r'''$u='__U__'; $p=[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String('__P__'))
        $sp=ConvertTo-SecureString $p -AsPlainText -Force
        if(Get-LocalUser -Name $u -ErrorAction SilentlyContinue){Set-LocalUser -Name $u -Password $sp -PasswordNeverExpires $true}
        else{New-LocalUser -Name $u -Password $sp -PasswordNeverExpires -FullName 'FaceOps (servicio)' | Out-Null}
        Add-LocalGroupMember -Group Administrators -Member $u -ErrorAction SilentlyContinue
        Set-ItemProperty -Path HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System -Name LocalAccountTokenFilterPolicy -Value 1 -Type DWord
        Enable-PSRemoting -SkipNetworkProfileCheck -Force | Out-Null
        $c=Get-ChildItem Cert:\LocalMachine\My | Where-Object {$_.Subject -eq "CN=$env:COMPUTERNAME"} | Select-Object -First 1
        if(-not $c){$c=New-SelfSignedCertificate -DnsName $env:COMPUTERNAME -CertStoreLocation Cert:\LocalMachine\My}
        if(-not (Get-ChildItem WSMan:\localhost\Listener | Where-Object {$_.Keys -contains 'Transport=HTTPS'})){
          New-Item -Path WSMan:\localhost\Listener -Transport HTTPS -Address * -CertificateThumbPrint $c.Thumbprint -Force | Out-Null}
        if(-not (Get-NetFirewallRule -DisplayName 'FaceOps WinRM HTTPS' -ErrorAction SilentlyContinue)){
          New-NetFirewallRule -DisplayName 'FaceOps WinRM HTTPS' -Direction Inbound -Protocol TCP -LocalPort 5986 -Action Allow | Out-Null}
        '''
        script = {{ script_linux | to_json }}
        out = []
        if plat == "gcp":
            from google.oauth2 import service_account
            from google.auth.transport.requests import AuthorizedSession
            f = os.environ.get("GCP_SERVICE_ACCOUNT_FILE") or os.environ.get("GCE_CREDENTIALS_FILE_PATH")
            if not f:
                sys.exit("Falta la credencial de GCP de la infraestructura")
            s = AuthorizedSession(service_account.Credentials.from_service_account_file(f, scopes=["https://www.googleapis.com/auth/compute"]))
            B = "https://compute.googleapis.com/compute/v1/projects/{{ inc_proyecto | default('') }}/zones/{{ inc_zona | default('') }}"
            PB = "https://compute.googleapis.com/compute/v1/projects/{{ inc_proyecto | default('') }}"
            vms = s.get(f"{B}/instances").json().get("items", [])
            if solo:
                vms = [v for v in vms if v["name"] == solo]
                if not vms:   # la máquina puede estar en otra zona del proyecto
                    ag = s.get(f"{PB}/aggregated/instances", params={"filter": f'name = "{solo}"'}).json().get("items", {})
                    vms = [v for z in ag.values() for v in z.get("instances", [])]
                if not vms:
                    sys.exit(f"No existe la máquina {solo} en el proyecto")
            for vm in vms:
                if etq and not solo and vm.get("labels", {}).get(ek) != ev:
                    continue
                Z = f"{PB}/zones/" + vm["zone"].rsplit("/", 1)[-1]
                nic = (vm.get("networkInterfaces") or [{}])[0]
                ip = next((a.get("natIP") for a in nic.get("accessConfigs") or [] if a.get("natIP")), "") or nic.get("networkIP", "")
                if any("windows" in (l or "") for d in vm.get("disks", []) for l in d.get("licenses", [])):
                    if not clave_win:
                        out.append({"maquina": vm["name"], "so": "windows", "estado": "omitida (falta la clave del usuario de servicio)"}); continue
                    if vm.get("status") != "RUNNING":
                        out.append({"maquina": vm["name"], "so": "windows", "estado": "omitida (apagada: enciéndela y repite)"}); continue
                    # firewall de la VPC: WinRM HTTPS solo desde la salida de AAP, a las VM con la etiqueta de red faceops-winrm
                    import requests as _rq
                    origen = _rq.get("https://checkip.amazonaws.com", timeout=20).text.strip() + "/32"
                    red = nic.get("network", "")
                    fw = s.get(f"{PB}/global/firewalls/faceops-winrm")
                    cuerpo = {"name": "faceops-winrm", "network": red, "direction": "INGRESS", "targetTags": ["faceops-winrm"],
                              "allowed": [{"IPProtocol": "tcp", "ports": ["5986"]}], "sourceRanges": [origen],
                              "description": "FaceOps: WinRM HTTPS solo desde AAP"}
                    if fw.status_code == 404:
                        s.post(f"{PB}/global/firewalls", json=cuerpo)
                    elif origen not in (fw.json().get("sourceRanges") or []):
                        s.patch(f"{PB}/global/firewalls/faceops-winrm", json={"sourceRanges": sorted(set((fw.json().get("sourceRanges") or []) + [origen]))})
                    tg = vm.get("tags", {})
                    if "faceops-winrm" not in (tg.get("items") or []):
                        s.post(f"{Z}/instances/{vm['name']}/setTags", json={"fingerprint": tg.get("fingerprint"), "items": (tg.get("items") or []) + ["faceops-winrm"]})
                    if abierto(ip, 5986, 60) and winrm_ok(ip):
                        out.append({"maquina": vm["name"], "so": "windows", "ip": ip, "estado": "ya estaba"}); continue
                    import base64
                    ps = PS.replace("__U__", usuario).replace("__P__", base64.b64encode(clave_win.encode()).decode())
                    md = s.get(f"{Z}/instances/{vm['name']}").json().get("metadata", {})
                    items = [i for i in md.get("items", []) if i["key"] != "windows-startup-script-ps1"] + [{"key": "windows-startup-script-ps1", "value": ps}]
                    s.post(f"{Z}/instances/{vm['name']}/setMetadata", json={"fingerprint": md.get("fingerprint"), "items": items})
                    s.post(f"{Z}/instances/{vm['name']}/reset")   # el script de arranque solo corre al iniciar Windows
                    time.sleep(60)
                    ok = abierto(ip, 5986, 900)
                    fin = time.time() + 300
                    while ok and time.time() < fin and not winrm_ok(ip):
                        time.sleep(15)
                    ok = ok and winrm_ok(ip)
                    md = s.get(f"{Z}/instances/{vm['name']}").json().get("metadata", {})   # la clave no queda en los metadatos
                    s.post(f"{Z}/instances/{vm['name']}/setMetadata", json={"fingerprint": md.get("fingerprint"),
                           "items": [i for i in md.get("items", []) if i["key"] != "windows-startup-script-ps1"]})
                    out.append({"maquina": vm["name"], "so": "windows", "ip": ip,
                                "estado": "incorporada (WinRM 5986)" if ok else "error: WinRM no respondió con el usuario de servicio tras reiniciar"})
                    continue
                md = vm.get("metadata", {})
                items = md.get("items", [])
                ssh = next((i for i in items if i["key"] == "ssh-keys"), None)
                linea = f"{usuario}:{pub}"
                if ssh and linea in ssh["value"].splitlines():
                    out.append({"maquina": vm["name"], "so": "linux", "ip": ip, "estado": "ya estaba"}); continue
                if ssh:
                    ssh["value"] = ssh["value"].rstrip("\n") + "\n" + linea
                else:
                    items.append({"key": "ssh-keys", "value": linea})
                r = s.post(f"{Z}/instances/{vm['name']}/setMetadata", json={"fingerprint": md.get("fingerprint"), "items": items})
                out.append({"maquina": vm["name"], "so": "linux", "ip": ip, "estado": "incorporada" if r.ok else f"error {r.status_code}"})
        elif plat == "azure":
            import requests
            e = os.environ
            tok = requests.post(f"https://login.microsoftonline.com/{e['AZURE_TENANT']}/oauth2/v2.0/token", data={
                "grant_type": "client_credentials", "client_id": e["AZURE_CLIENT_ID"], "client_secret": e["AZURE_SECRET"],
                "scope": "https://management.azure.com/.default"}, timeout=60).json()["access_token"]
            H = {"Authorization": f"Bearer {tok}"}
            base = f"https://management.azure.com/subscriptions/{e['AZURE_SUBSCRIPTION_ID']}"
            vms = requests.get(f"{base}/providers/Microsoft.Compute/virtualMachines?api-version=2024-07-01", headers=H, timeout=60).json().get("value", [])
            for vm in vms:
                if etq and (vm.get("tags") or {}).get(ek) != ev:
                    continue
                if (vm["properties"].get("storageProfile", {}).get("osDisk", {}).get("osType") or "").lower() != "linux":
                    out.append({"maquina": vm["name"], "estado": "omitida (Windows: use WinRM)"}); continue
                r = requests.post(f"https://management.azure.com{vm['id']}/runCommand?api-version=2024-07-01", headers=H, timeout=60,
                                  json={"commandId": "RunShellScript", "script": script.splitlines()})
                out.append({"maquina": vm["name"], "estado": "incorporada" if r.status_code in (200, 202) else f"error {r.status_code}"})
        else:
            try:
                import boto3
            except ImportError:
                sys.exit("El entorno de ejecución no tiene boto3 (AWS SSM): use un EE con amazon.aws")
            ssm = boto3.client("ssm", region_name="{{ inc_region | default('') }}")
            ec2 = boto3.client("ec2", region_name="{{ inc_region | default('') }}")
            ids = [i["InstanceId"] for i in ssm.describe_instance_information()["InstanceInformationList"] if i.get("PlatformType") == "Linux"]
            if etq and ids:
                con = {i["InstanceId"] for r in ec2.describe_instances(InstanceIds=ids, Filters=[{"Name": f"tag:{ek}", "Values": [ev]}])["Reservations"] for i in r["Instances"]}
                ids = [i for i in ids if i in con]
            if ids:
                ssm.send_command(InstanceIds=ids, DocumentName="AWS-RunShellScript", Parameters={"commands": script.splitlines()},
                                 Comment="FaceOps · Incorporar máquinas")
            out += [{"maquina": i, "estado": "incorporada (SSM)"} for i in ids]
        print(json.dumps(out))
        P
      register: r_inc
      failed_when: false
      changed_when: "'incorporada' in r_inc.stdout"

    - name: Falla controlada (sin secretos en el mensaje)
      ansible.builtin.fail:
        msg: "{{ r_inc.stderr_lines | default([], true) | last | default('error desconocido', true) }}"
      when: r_inc.rc | default(1) != 0

    - name: Resultado
      ansible.builtin.set_fact:
        maquinas: "{{ r_inc.stdout_lines[-1] | from_json }}"

    - name: Resultado para FaceOps
      ansible.builtin.set_stats:
        data:
          faceops_incorporadas: "{{ maquinas }}"
          faceops_usuario_servicio: "{{ usuario }}"

    - name: Resumen
      ansible.builtin.debug:
        msg: "{{ maquinas | length }} máquinas · {{ maquinas | selectattr('estado', 'match', '^incorporada') | list | length }} incorporadas · usuario {{ usuario }}"
