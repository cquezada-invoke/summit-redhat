---
# Infra · Preparar centro de datos emulado (anfitrión KVM). Para demostraciones: un segundo «centro de datos» dentro del mismo
# anfitrión, con su propia red (NAT, DHCP) y su propio pool de discos. Mover una máquina entre centros copia su disco al otro
# pool y la conecta a la otra red (cambia su IP), igual que un traslado real.
# Variables: dc_clave (valpo) · dc_red (192.168.150) · dc_titulo (Centro de datos Valparaíso)
- name: Infra · Preparar centro de datos emulado
  hosts: anfitrion_kvm
  gather_facts: false
  vars:
    clave: "{{ dc_clave | default('valpo') }}"
    red: "{{ dc_red | default('192.168.150') }}"
    titulo: "{{ dc_titulo | default('Centro de datos Valparaíso') }}"
  tasks:
    - name: Datos válidos
      ansible.builtin.assert:
        that:
          - clave is match('^[a-z0-9]{2,9}$')
          - red is match('^192\.168\.(1[3-9][0-9]|2[0-4][0-9])$')
        fail_msg: "Clave (minúsculas) o red (192.168.130-249) no válidas"
        quiet: true

    - name: Red del centro de datos
      ansible.builtin.shell: |
        set -e
        n=dc-{{ clave }}
        if ! sudo -n virsh net-info $n >/dev/null 2>&1; then
          cat > /tmp/$n.xml <<EOF
        <network>
          <name>$n</name>
          <forward mode='nat'/>
          <bridge name='virbr-{{ clave }}' stp='on' delay='0'/>
          <ip address='{{ red }}.1' netmask='255.255.255.0'>
            <dhcp><range start='{{ red }}.100' end='{{ red }}.200'/></dhcp>
          </ip>
        </network>
        EOF
          sudo -n virsh net-define /tmp/$n.xml >/dev/null && rm -f /tmp/$n.xml
          echo creada
        fi
        sudo -n virsh net-autostart $n >/dev/null
        sudo -n virsh net-info $n | grep -q 'Active:.*yes' || sudo -n virsh net-start $n >/dev/null
        sudo -n virsh net-info $n | awk '/Active/{print "activa="$2}'
      register: r_red
      changed_when: "'creada' in r_red.stdout"

    - name: Pool de discos del centro de datos (solo virsh: el usuario de servicio no tiene otro privilegio)
      ansible.builtin.shell: |
        set -e
        p=dc-{{ clave }}; d=/var/lib/libvirt/dc-{{ clave }}
        if ! sudo -n virsh pool-info $p >/dev/null 2>&1; then
          sudo -n virsh pool-define-as $p dir --target $d >/dev/null; echo creado
        fi
        sudo -n virsh pool-build $p >/dev/null 2>&1 || true
        sudo -n virsh pool-autostart $p >/dev/null
        sudo -n virsh pool-info $p | grep -q 'State:.*running' || sudo -n virsh pool-start $p >/dev/null
      register: r_pool
      changed_when: "'creado' in r_pool.stdout"

    - name: Resultado para FaceOps
      ansible.builtin.set_stats:
        data:
          faceops_dc_emulado: {clave: "{{ clave }}", titulo: "{{ titulo }}", red: "{{ red }}.0/24", red_libvirt: "dc-{{ clave }}", pool: "/var/lib/libvirt/dc-{{ clave }}"}
