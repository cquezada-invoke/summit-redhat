---
# Estaciones · Cumplimiento CIS: evalúa una selección de controles del nivel 1 de los CIS Benchmarks en estaciones de
# trabajo y deja la evidencia de cada control en FaceOps. Solo lectura: no cambia nada en la máquina.
# Agentless: Linux por SSH, Windows por WinRM (se decide por la conexión del inventario).
# Cada control queda como {id, control, resultado: cumple | no cumple | no evaluable, evidencia}. set_stats «cumplimiento_cis»
# por equipo: total, cumple, porcentaje y la lista de controles (la evidencia unificada que se muestra en el ticket).
- name: Estaciones · Cumplimiento CIS
  hosts: all
  gather_facts: false
  become: "{{ (ansible_connection | default('ssh')) not in ['winrm', 'psrp'] }}"
  vars:
    windows: "{{ (ansible_connection | default('ssh')) in ['winrm', 'psrp'] }}"
  tasks:
    # ── Linux (CIS Distribution Independent / RHEL / Ubuntu, nivel 1 de estación) ──────────────────────────────────────
    - name: Linux · controles
      when: not windows
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -u
          L=()
          c() {  # id, control, resultado, evidencia
            ev=$(printf '%s' "$4" | tr -d '"\\' | tr '\n\t' '  ' | cut -c1-160)
            L+=("{\"id\": \"$1\", \"control\": \"$2\", \"resultado\": \"$3\", \"evidencia\": \"$ev\"}")
          }
          si() { if eval "$1" >/dev/null 2>&1; then echo cumple; else echo "no cumple"; fi; }
          # 1 · Almacenamiento USB deshabilitado
          u=$(modprobe -n -v usb-storage 2>&1 | head -1); b=$(grep -rhs 'usb[-_]storage' /etc/modprobe.d | head -2)
          if printf '%s' "$u" | grep -qE 'install /bin/(true|false)'; then r=cumple; else r="no cumple"; fi
          c CIS-1.1.10 "Almacenamiento USB deshabilitado" "$r" "modprobe: ${u:-sin salida}; modprobe.d: ${b:-sin regla}"
          # 2 · /tmp en sistema de archivos propio con nodev,nosuid
          m=$(findmnt -n -o OPTIONS /tmp 2>/dev/null)
          if [ -n "$m" ] && printf '%s' "$m" | grep -q nodev && printf '%s' "$m" | grep -q nosuid; then r=cumple; else r="no cumple"; fi
          c CIS-1.1.2 "/tmp separado con nodev y nosuid" "$r" "${m:-/tmp no es un montaje propio}"
          # 3 · Cifrado de disco (LUKS)
          k=$(lsblk -rno NAME,TYPE 2>/dev/null | awk '$2=="crypt"{print $1}' | tr '\n' ' ')
          if [ -n "$k" ]; then r=cumple; else r="no cumple"; fi
          c INV-CIFRADO "Disco cifrado (LUKS)" "$r" "${k:-sin volúmenes crypt}"
          # 4 · Firewall activo
          f=""; for s in firewalld ufw nftables; do systemctl is-active -q "$s" 2>/dev/null && f="$f $s"; done
          if [ -n "$f" ]; then r=cumple; else r="no cumple"; fi
          c CIS-3.4.1 "Firewall activo" "$r" "activos:${f:- ninguno}"
          # 5 · Control de acceso obligatorio (SELinux enforcing o AppArmor)
          if command -v getenforce >/dev/null; then s=$(getenforce); [ "$s" = Enforcing ] && r=cumple || r="no cumple"
          elif command -v aa-status >/dev/null; then s=$(aa-status --enabled 2>&1 && echo AppArmor activo); r=$(si "aa-status --enabled")
          else s="sin SELinux ni AppArmor"; r="no cumple"; fi
          c CIS-1.6.1 "SELinux o AppArmor activo" "$r" "$s"
          # 6 · Auditoría (auditd)
          r=$(si "systemctl is-active -q auditd"); c CIS-4.1.1 "auditd activo" "$r" "auditd: $(systemctl is-active auditd 2>&1)"
          # 7 · Sincronización de hora
          t=""; for s in chronyd chrony systemd-timesyncd ntpd; do systemctl is-active -q "$s" 2>/dev/null && t="$t $s"; done
          [ -n "$t" ] && r=cumple || r="no cumple"; c CIS-2.1.1 "Sincronización de hora activa" "$r" "activos:${t:- ninguno}"
          # 8-9 · SSH: sin root y sin contraseñas vacías
          if command -v sshd >/dev/null; then
            p=$(sshd -T 2>/dev/null | grep -i '^permitrootlogin' ); e=$(sshd -T 2>/dev/null | grep -i '^permitemptypasswords')
            printf '%s' "$p" | grep -qiE ' no$' && r=cumple || r="no cumple"; c CIS-5.2.10 "SSH no permite ingreso de root" "$r" "${p:-sin dato}"
            printf '%s' "$e" | grep -qiE ' no$' && r=cumple || r="no cumple"; c CIS-5.2.11 "SSH sin contraseñas vacías" "$r" "${e:-sin dato}"
          else
            c CIS-5.2.10 "SSH no permite ingreso de root" cumple "sshd no instalado"
            c CIS-5.2.11 "SSH sin contraseñas vacías" cumple "sshd no instalado"
          fi
          # 10 · Largo mínimo de contraseña >= 14
          n=$(grep -hsE '^\s*minlen' /etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf 2>/dev/null | tail -1 | tr -dc '0-9')
          [ "${n:-0}" -ge 14 ] && r=cumple || r="no cumple"; c CIS-5.4.1 "Contraseña de 14 caracteres o más" "$r" "minlen=${n:-sin definir}"
          # 11 · Vigencia máxima de contraseña <= 365
          d=$(awk '/^\s*PASS_MAX_DAYS/{print $2}' /etc/login.defs 2>/dev/null)
          [ -n "$d" ] && [ "$d" -le 365 ] && r=cumple || r="no cumple"; c CIS-5.5.1.1 "Vigencia de contraseña de 365 días o menos" "$r" "PASS_MAX_DAYS=${d:-sin definir}"
          # 12 · Solo root con UID 0
          z=$(awk -F: '$3==0{print $1}' /etc/passwd | tr '\n' ' ')
          [ "$(printf '%s' "$z" | xargs)" = root ] && r=cumple || r="no cumple"; c CIS-6.2.5 "Solo root tiene UID 0" "$r" "UID 0: $z"
          # 13 · Permisos de /etc/shadow
          s=$(stat -c '%a %U:%G' /etc/shadow 2>/dev/null)
          printf '%s' "$s" | grep -qE '^(0|400|600|640) root:(root|shadow)$' && r=cumple || r="no cumple"; c CIS-6.1.3 "/etc/shadow protegido" "$r" "${s:-no existe}"
          # 14 · Administradores locales (grupos wheel / sudo / admin)
          a=$(getent group wheel sudo admin 2>/dev/null | awk -F: '$4!=""{print $1": "$4}' | tr '\n' ' ')
          [ -z "$a" ] && r=cumple || r="no cumple"; c INV-ADMIN "Sin administradores locales fuera de lo autorizado" "$r" "${a:-ningún miembro}"
          ( IFS=,; echo "[${L[*]}]" )
      register: r_lx
      changed_when: false

    # ── Windows (CIS Microsoft Windows 10/11 Enterprise, nivel 1) ───────────────────────────────────────────────────────
    - name: Windows · controles
      when: windows
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = 'SilentlyContinue'
          $Ansible.Changed = $false
          $L = New-Object System.Collections.ArrayList
          function C($id, $control, $ok, $ev) {
            $r = if ($ok -eq $null) { 'no evaluable' } elseif ($ok) { 'cumple' } else { 'no cumple' }
            [void]$L.Add([ordered]@{ id = $id; control = $control; resultado = $r; evidencia = ("$ev" -replace '\s+', ' ').Substring(0, [math]::Min(160, "$ev".Length)) })
          }
          $reg = { param($p, $n) (Get-ItemProperty -Path $p -Name $n).$n }
          # BitLocker en la unidad del sistema
          $bl = Get-BitLockerVolume -MountPoint $env:SystemDrive
          C 'INV-CIFRADO' 'Disco del sistema cifrado (BitLocker)' $(if ($bl) { $bl.ProtectionStatus -eq 'On' } else { $null }) "protección: $($bl.ProtectionStatus) · cifrado: $($bl.VolumeStatus)"
          # Firewall de Windows en los tres perfiles
          $fw = Get-NetFirewallProfile
          C 'CIS-9.1' 'Firewall activo en todos los perfiles' (@($fw | Where-Object { -not $_.Enabled }).Count -eq 0) (($fw | ForEach-Object { "$($_.Name)=$($_.Enabled)" }) -join ' ')
          # Antivirus / EDR (Microsoft Defender en tiempo real o un producto registrado en el Centro de seguridad)
          $mp = Get-MpComputerStatus
          $av = Get-CimInstance -Namespace root/SecurityCenter2 -ClassName AntivirusProduct
          C 'INV-AV' 'Antivirus o EDR activo' ([bool]($mp.RealTimeProtectionEnabled) -or @($av).Count -gt 0) "Defender tiempo real: $($mp.RealTimeProtectionEnabled) · firmas: $($mp.AntivirusSignatureLastUpdated) · productos: $((@($av).displayName) -join ', ')"
          # UAC
          $lua = & $reg 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' 'EnableLUA'
          C 'CIS-2.3.17.6' 'Control de cuentas de usuario (UAC) activo' ($lua -eq 1) "EnableLUA=$lua"
          # Administradores locales: solo la cuenta integrada y grupos de dominio
          $adm = Get-LocalGroupMember -SID 'S-1-5-32-544'
          $extra = @($adm | Where-Object { $_.PrincipalSource -eq 'Local' -and $_.SID.Value -notmatch '-500$' })
          C 'INV-ADMIN' 'Sin administradores locales fuera de lo autorizado' ($extra.Count -eq 0) ("miembros: " + (($adm | ForEach-Object { $_.Name }) -join ', '))
          # Política de contraseñas y bloqueo de cuenta
          $na = net accounts
          $min = [int](($na | Select-String 'Minimum password length|Longitud m').ToString() -replace '\D', '')
          C 'CIS-1.1.4' 'Contraseña de 14 caracteres o más' ($min -ge 14) "largo mínimo=$min"
          $um = (($na | Select-String 'Lockout threshold|Umbral de bloqueo').ToString() -split ':')[-1].Trim()
          C 'CIS-1.2.2' 'Bloqueo de cuenta tras 5 intentos o menos' ($um -match '^\d+$' -and [int]$um -gt 0 -and [int]$um -le 5) "umbral=$um"
          # Invitado deshabilitado
          $inv = Get-LocalUser | Where-Object { $_.SID.Value -match '-501$' }
          C 'CIS-2.3.1.2' 'Cuenta Invitado deshabilitada' (-not $inv.Enabled) "Invitado habilitado: $($inv.Enabled)"
          # Almacenamiento USB bloqueado
          $usb = & $reg 'HKLM:\SYSTEM\CurrentControlSet\Services\USBSTOR' 'Start'
          $dny = & $reg 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\RemovableStorageDevices' 'Deny_All'
          C 'CIS-18.9.x' 'Almacenamiento USB bloqueado' ($usb -eq 4 -or $dny -eq 1) "USBSTOR Start=$usb · Deny_All=$dny"
          # SMBv1 deshabilitado
          $smb = (Get-SmbServerConfiguration).EnableSMB1Protocol
          C 'CIS-18.3.3' 'SMBv1 deshabilitado' (-not $smb) "EnableSMB1Protocol=$smb"
          # Escritorio remoto con NLA (si RDP está habilitado)
          $rdp = & $reg 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server' 'fDenyTSConnections'
          $nla = & $reg 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' 'UserAuthentication'
          C 'CIS-18.10.57' 'Escritorio remoto deshabilitado o con NLA' ($rdp -eq 1 -or $nla -eq 1) "fDenyTSConnections=$rdp · NLA=$nla"
          # Bloqueo de pantalla por inactividad (15 minutos o menos)
          $ina = & $reg 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' 'InactivityTimeoutSecs'
          C 'CIS-2.3.7.3' 'Bloqueo por inactividad de 15 minutos o menos' ($ina -gt 0 -and $ina -le 900) "InactivityTimeoutSecs=$ina"
          # Actualizaciones automáticas no deshabilitadas
          $nau = & $reg 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU' 'NoAutoUpdate'
          C 'CIS-18.10.93' 'Actualizaciones automáticas habilitadas' ($nau -ne 1) "NoAutoUpdate=$nau"
          ConvertTo-Json -InputObject @($L) -Compress -Depth 3
      register: r_win

    - name: Resultado
      ansible.builtin.set_fact:
        ctl_: "{{ (r_lx.stdout | from_json) if not windows else (r_win.output | first | from_json) }}"

    - name: Resumen por equipo
      ansible.builtin.set_fact:
        cis_: >-
          {{ {'total': ctl_ | length,
              'cumple': ctl_ | selectattr('resultado', 'equalto', 'cumple') | list | length,
              'porcentaje': ((ctl_ | selectattr('resultado', 'equalto', 'cumple') | list | length) * 100 / ([ctl_ | length, 1] | max)) | round | int,
              'controles': ctl_} }}

    - name: Evidencia en FaceOps
      ansible.builtin.set_stats:
        data:
          cumplimiento_cis: "{{ {inventory_hostname: cis_} }}"
        aggregate: true

    - name: Resumen
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} · CIS nivel 1: {{ cis_.cumple }}/{{ cis_.total }} controles cumplen ({{ cis_.porcentaje }} %).
          No cumplen: {{ ctl_ | rejectattr('resultado', 'equalto', 'cumple') | map(attribute='control') | join(' · ') or 'ninguno' }}
