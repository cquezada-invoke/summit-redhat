---
# Nube · Producto de la nube. Crea o elimina un producto adicional de la nube (base de datos, bucket, GKE, Pub/Sub…)
# con los pasos REST que FaceOps arma desde datos/nube-productos.yml; si ya existe no lo vuelve a crear. Verifica su salud.
# Lo lanza FaceOps desde la ficha de la nube con la credencial cifrada de la conexión (GCP), siempre con ticket y aprobación en AAP.
# Variables: nb_infra_id, nb_proyecto (proyecto de la conexión), nb_entrada (lo que arma FaceOps; nunca secretos).
# Resultado (set_stats faceops_nube_producto): pasos hechos y salud del producto.
- name: Nube · Producto de la nube
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Datos válidos
      ansible.builtin.assert:
        that:
          - nb_infra_id | default('') | string is match('^[0-9]+$')
          - nb_proyecto | default('') is match('^[a-z][a-z0-9-]{4,28}[a-z0-9]$')
          - nb_entrada.accion | default('') in ['crear', 'eliminar', 'estado']
          - nb_entrada.producto | default('') is match('^[a-z0-9]{2,30}$')
          - nb_entrada.nombre | default('') is match('^[a-z0-9][a-z0-9._-]{1,62}$')
          - (nb_entrada.pasos | default([])) | map(attribute='url') | reject('match', '^https://[a-z0-9.-]*googleapis\\.com/') | list | length == 0
        fail_msg: "Falta la nube o el proyecto, o el producto, su nombre o sus pasos no son válidos (solo APIs de Google; no se tocó la nube)"
        quiet: true

    - name: Archivos temporales (un nombre fijo para toda la corrida)
      ansible.builtin.set_fact:
        entrada: "/tmp/nube-producto-{{ nb_infra_id }}-{{ 999999999 | random }}.json"

    - name: Salida
      ansible.builtin.set_fact:
        salida: "{{ entrada | regex_replace('\\.json$', '-salida.json') }}"

    - name: Entrada para la nube (sin secretos)
      ansible.builtin.copy:
        content: "{{ nb_entrada | default({}) | to_json }}"
        dest: "{{ entrada }}"
        mode: "0600"
      changed_when: false

    - name: Producto de la nube con la credencial cifrada de la conexión (sin secretos en la salida)
      ansible.builtin.command:
        argv: [python3, "{{ playbook_dir }}/files/nube_gcp.py", producto, "{{ nb_proyecto }}", "{{ entrada }}", "{{ salida }}"]
      register: corrida
      changed_when: nb_entrada.accion | default('') != 'estado'
      no_log: true

    - name: Resultado
      ansible.builtin.set_fact:
        res: "{{ lookup('ansible.builtin.file', salida) | from_json }}"

    - name: Borrar los archivos temporales
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: ["{{ entrada }}", "{{ salida }}"]

    - name: Resultado para FaceOps
      ansible.builtin.set_stats:
        data:
          faceops_nube_producto: "{{ res | combine({'infra_id': nb_infra_id | int}) }}"
        per_host: false

    - name: Producto
      ansible.builtin.assert:
        that: res.ok | bool
        success_msg: "{{ nb_entrada.producto }} {{ nb_entrada.nombre }} · {{ nb_entrada.accion }}: {{ res.hecho | default([]) | join(' · ') }} · salud {{ (res.salud | default({})).salud | default('—') }}"
        fail_msg: "{{ nb_entrada.producto }} {{ nb_entrada.nombre }} · {{ nb_entrada.accion }}: {{ res.error | default('sin detalle') }}"
