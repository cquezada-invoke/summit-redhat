---
# FaceOps · Agente de monitoreo (Linux) — skill «monitoreo». Instala node_exporter (métricas del equipo para Prometheus y Grafana).
# FaceOps la lanza sobre los equipos elegidos con el inventario y la credencial de cada uno. Basada en Demo 5 (exportadores-linux.yml).
# Deja además las métricas de seguridad (faceops-seguridad.prom, temporizador de cada minuto) para las alertas de Seguridad.
- name: FaceOps · Agente de monitoreo (Linux)
  hosts: all
  become: true
  gather_facts: false
  vars:
    version: "1.8.2"
    url: "https://github.com/prometheus/node_exporter/releases/download/v{{ version }}/node_exporter-{{ version }}.linux-amd64.tar.gz"
    escucha: "{{ '127.0.0.1:9100' if inventory_hostname == 'anfitriona' else ':9100' }}"
  tasks:
    - name: Usuario de servicio
      ansible.builtin.user:
        name: node_exporter
        system: true
        shell: /sbin/nologin
        create_home: false

    - name: ¿Versión instalada?
      ansible.builtin.command: /usr/local/bin/node_exporter --version
      register: r_ver
      changed_when: false
      failed_when: false

    - name: Descargar y descomprimir node_exporter {{ version }}
      ansible.builtin.unarchive:
        src: "{{ url }}"
        dest: /tmp
        remote_src: true
      when: version not in (r_ver.stdout | default('') ~ r_ver.stderr | default(''))

    - name: Instalar el binario
      ansible.builtin.copy:
        src: "/tmp/node_exporter-{{ version }}.linux-amd64/node_exporter"
        dest: /usr/local/bin/node_exporter
        mode: "0755"
        remote_src: true
      when: version not in (r_ver.stdout | default('') ~ r_ver.stderr | default(''))
      notify: reiniciar

    - name: SELinux · contexto del binario
      ansible.builtin.command: restorecon /usr/local/bin/node_exporter
      changed_when: false
      failed_when: false

    - name: Directorio de métricas de archivo (textfile; ej. logins fallidos de Keycloak)
      ansible.builtin.file:
        path: /var/lib/node_exporter/textfile
        state: directory
        owner: root
        mode: "0755"

    - name: Métricas de seguridad (textfile faceops-seguridad.prom, cada minuto · alertas de Seguridad del botón «Alertas»)
      ansible.builtin.copy:
        dest: /usr/local/libexec/faceops-seguridad.sh
        mode: "0755"
        content: |
          #!/bin/bash
          # FaceOps · métricas de seguridad para node_exporter (solo lectura): SSH fallidos y root en 5 min, cuentas bloqueadas
          # por faillock, modo de SELinux y huella de los archivos críticos. Lo corre faceops-seguridad.timer cada minuto.
          D=/var/lib/node_exporter/textfile; T=$(mktemp "$D/.seg.XXXXXX")
          j=$(journalctl -q --since "-5min" -t sshd -t sshd-session -o cat 2>/dev/null)
          f=$(printf '%s\n' "$j" | grep -cE "Failed (password|publickey)|Invalid user|authentication failure")
          r=$(printf '%s\n' "$j" | grep -cE "Accepted [a-z-]+ for root ")
          deny=$(sed -n 's/^[[:space:]]*deny[[:space:]]*=[[:space:]]*\([0-9]\+\).*/\1/p' /etc/security/faillock.conf 2>/dev/null | tail -1)
          b=0; for u in $(ls /var/run/faillock 2>/dev/null); do
            n=$(faillock --user "$u" 2>/dev/null | awk '$NF=="V"' | wc -l); [ "$n" -ge "${deny:-3}" ] && b=$((b+1)); done
          case "$(getenforce 2>/dev/null)" in Enforcing) s=2;; Permissive) s=1;; *) s=0;; esac
          {
            echo "# HELP faceops_seg_ssh_fallidos_5m Ingresos SSH fallidos en los últimos 5 minutos"; echo "# TYPE faceops_seg_ssh_fallidos_5m gauge"
            echo "faceops_seg_ssh_fallidos_5m $f"
            echo "# HELP faceops_seg_root_login_5m Ingresos SSH aceptados como root en los últimos 5 minutos"; echo "# TYPE faceops_seg_root_login_5m gauge"
            echo "faceops_seg_root_login_5m $r"
            echo "# HELP faceops_seg_cuentas_bloqueadas Cuentas bloqueadas por faillock"; echo "# TYPE faceops_seg_cuentas_bloqueadas gauge"
            echo "faceops_seg_cuentas_bloqueadas $b"
            echo "# HELP faceops_seg_selinux_modo Modo de SELinux: 2 Enforcing, 1 Permissive, 0 Disabled"; echo "# TYPE faceops_seg_selinux_modo gauge"
            echo "faceops_seg_selinux_modo $s"
            echo "# HELP faceops_seg_archivo_huella Huella (sha256 truncado) de cada archivo crítico; cambia si el archivo cambia"; echo "# TYPE faceops_seg_archivo_huella gauge"
            for a in /etc/passwd /etc/shadow /etc/group /etc/sudoers /etc/sudoers.d; do
              [ -e "$a" ] || continue
              h=$( (if [ -d "$a" ]; then cat "$a"/* 2>/dev/null; else cat "$a"; fi) | sha256sum | cut -c1-7)
              echo "faceops_seg_archivo_huella{archivo=\"$a\"} $((16#$h))"
            done
          } > "$T" && chmod 0644 "$T" && mv -f "$T" "$D/faceops-seguridad.prom"

    - name: Temporizador de las métricas de seguridad (cada minuto)
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ item.n }}"
        mode: "0644"
        content: "{{ item.c }}"
      loop:
        - {n: faceops-seguridad.service, c: "[Unit]\nDescription=FaceOps · métricas de seguridad (node_exporter textfile)\n[Service]\nType=oneshot\nExecStart=/usr/local/libexec/faceops-seguridad.sh\n"}
        - {n: faceops-seguridad.timer, c: "[Unit]\nDescription=FaceOps · métricas de seguridad cada minuto\n[Timer]\nOnBootSec=30\nOnUnitActiveSec=60\nAccuracySec=5\n[Install]\nWantedBy=timers.target\n"}
      loop_control:
        label: "{{ item.n }}"

    - name: Temporizador activo
      ansible.builtin.systemd:
        name: faceops-seguridad.timer
        enabled: true
        state: started
        daemon_reload: true

    - name: Servicio systemd
      ansible.builtin.copy:
        dest: /etc/systemd/system/node_exporter.service
        content: |
          [Unit]
          Description=Prometheus node_exporter (FaceOps · skill monitoreo)
          After=network-online.target
          [Service]
          User=node_exporter
          ExecStart=/usr/local/bin/node_exporter --web.listen-address={{ escucha }} --collector.systemd --collector.textfile.directory=/var/lib/node_exporter/textfile
          Restart=always
          [Install]
          WantedBy=multi-user.target
      notify: reiniciar

    - name: Activo y en el arranque
      ansible.builtin.systemd:
        name: node_exporter
        enabled: true
        state: started
        daemon_reload: true

    - name: ¿firewalld activo?
      ansible.builtin.command: systemctl is-active firewalld
      register: r_fw
      changed_when: false
      failed_when: false

    - name: firewalld · 9100 solo desde la VM anfitriona (no toca las demás reglas)
      ansible.builtin.shell: |
        R='rule family="ipv4" source address="192.168.122.1/32" port port="9100" protocol="tcp" accept'
        firewall-cmd --permanent --query-rich-rule="$R" >/dev/null && exit 0
        firewall-cmd -q --permanent --add-rich-rule="$R" && firewall-cmd -q --add-rich-rule="$R" && echo agregada
      register: r_regla
      changed_when: "'agregada' in r_regla.stdout"
      when: r_fw.stdout == 'active'

  handlers:
    - name: reiniciar
      ansible.builtin.systemd:
        name: node_exporter
        state: restarted
        daemon_reload: true
