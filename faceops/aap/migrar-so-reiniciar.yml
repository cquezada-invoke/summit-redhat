---
# Reinicia el equipo y espera que vuelva (los upgrades de Leapp y redhat-upgrade-tool ocurren durante este reinicio)
- name: Reiniciar
  ansible.builtin.raw: nohup sh -c 'sleep 3; /sbin/reboot' >/dev/null 2>&1 &
  become: true
  changed_when: true
- name: Esperar que se apague
  ansible.builtin.wait_for: {host: "{{ destino_ssh }}", port: 22, state: stopped, timeout: 420}
  delegate_to: localhost
  become: false
  register: r_apaga
  failed_when: false
- name: Si no se apagó (el apagado ordenado quedó trabado), reinicio forzado
  ansible.builtin.raw: nohup sh -c 'sleep 3; systemctl reboot --force' >/dev/null 2>&1 &
  become: true
  when: r_apaga.elapsed is not defined or (r_apaga.msg | default('')) is search('Timeout')
  changed_when: true
- name: Esperar que se apague (tras el reinicio forzado)
  ansible.builtin.wait_for: {host: "{{ destino_ssh }}", port: 22, state: stopped, timeout: 300}
  delegate_to: localhost
  become: false
  when: r_apaga.elapsed is not defined or (r_apaga.msg | default('')) is search('Timeout')
- name: Si la VM quedó apagada (primer reinicio tras su creación), encenderla
  ansible.builtin.raw: |
    sleep 20; st=$(sudo -n virsh domstate {{ vm }} 2>/dev/null); echo "$st"
    [ "$st" = "shut off" ] && sudo -n virsh start {{ vm }} >/dev/null && echo encendida || true
  delegate_to: anfitrion-snapshots
  become: false
  when: "'anfitrion-snapshots' in hostvars"
  changed_when: false
- name: Esperar que vuelva
  ansible.builtin.wait_for: {host: "{{ destino_ssh }}", port: 22, delay: 30, timeout: "{{ espera | default(900) }}"}
  delegate_to: localhost
  become: false
- name: Responde por SSH
  ansible.builtin.raw: cat /etc/redhat-release
  register: r_reinicio
  retries: 20
  delay: 15
  until: r_reinicio is succeeded
  changed_when: false
