---
# ESQUELETO (sin probar) · Migración K8s → OpenShift · Validar y conmutar.
# Pruebas de humo contra la Route del destino; si pasan, cambia el DNS (Cloud DNS) o el balanceador hacia OpenShift y
# deja el origen escalado a cero (no se borra). Reversa: ocp_sentido=revertir vuelve el DNS al origen y lo reescala.
#   k8s_namespace   ocp_dns_registro   ocp_url_prueba   ocp_sentido: conmutar | revertir
- name: Migración K8s → OpenShift · Validar y conmutar
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Datos válidos
      ansible.builtin.assert:
        that:
          - k8s_namespace | default('') is match('^[a-z0-9-]{1,63}$')
          - ocp_sentido | default('conmutar') in ['conmutar', 'revertir']
        quiet: true

    - name: TODO · pruebas de humo en el destino
      ansible.builtin.debug: {msg: "GET {{ ocp_url_prueba | default('') }}"}

    - name: TODO · DNS o balanceador hacia el destino (o de vuelta al origen)
      ansible.builtin.debug: {msg: "{{ ocp_sentido | default('conmutar') }} {{ ocp_dns_registro | default('') }}"}

    - name: TODO · origen escalado a cero (sin borrar) o reescalado si se revierte
      ansible.builtin.debug: {msg: "Origen"}
