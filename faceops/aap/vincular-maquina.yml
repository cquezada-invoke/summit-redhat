# FaceOps · Vincular máquina a la bóveda: deja la máquina lista para que AAP y FaceOps entren con una credencial propia
# guardada en la bóveda (HashiCorp Vault), no en manos de personas.
#   Linux: crea el usuario de servicio con llave SSH propia y sudo; guarda usuario y llave privada en
#          faceops/maquinas/<máquina> (KV v2).
#   Equipos de red y Windows: guarda en la bóveda el usuario y la clave que se entregan en la solicitud.
# Variables: vm_usuario (usuario de servicio, por defecto faceops), vm_clave (equipos de red/Windows),
#            vm_tipo (linux | red | windows | openshift). OpenShift: vm_clave es un token de administrador (se usa una vez
#            para crear la cuenta de servicio faceops; en la bóveda queda el token de esa cuenta, no el del administrador). La bóveda llega por la credencial «FaceOps · Bóveda (escritura)», que
#            inyecta FACEOPS_VAULT_ADDR y FACEOPS_VAULT_TOKEN (permiso de escritura solo en faceops/data/maquinas/*).
- name: FaceOps · Vincular máquina a la bóveda
  hosts: all
  gather_facts: false
  vars:
    usuario: "{{ vm_usuario | default('faceops') }}"
    tipo: "{{ vm_tipo | default('linux') }}"
    bov_addr: "{{ lookup('ansible.builtin.env', 'FACEOPS_VAULT_ADDR') }}"
    bov_token: "{{ lookup('ansible.builtin.env', 'FACEOPS_VAULT_TOKEN') }}"
  tasks:
    - name: Hay bóveda conectada
      ansible.builtin.assert:
        that: [bov_addr | length > 0, bov_token | length > 0]
        fail_msg: "Falta la credencial «FaceOps · Bóveda (escritura)» en la plantilla: sin bóveda no se puede vincular (habilita una con «Vault · Preparar servidor»)"
      run_once: true

    - name: Llave propia de la máquina (se genera en el nodo de ejecución y no queda en disco)
      # ssh-keygen del nodo de ejecución (sin depender de la colección community.crypto, que el EE no trae)
      ansible.builtin.command:
        argv: [ssh-keygen, -q, -t, ed25519, -N, "", -C, "{{ usuario }}@{{ inventory_hostname }}", -f, "/tmp/faceops-vinculo-{{ inventory_hostname }}"]
        creates: "/tmp/faceops-vinculo-{{ inventory_hostname }}"
      delegate_to: localhost
      when: tipo == 'linux'

    - name: Usuario de servicio, llave y sudo
      when: tipo == 'linux'
      become: true
      block:
        - name: Usuario de servicio
          ansible.builtin.user:
            name: "{{ usuario }}"
            shell: /bin/bash
            comment: "Servicio de automatización (FaceOps · AAP)"
        - name: Carpeta .ssh del usuario de servicio
          ansible.builtin.file:
            path: "/home/{{ usuario }}/.ssh"
            state: directory
            owner: "{{ usuario }}"
            group: "{{ usuario }}"
            mode: "0700"
        - name: Llave autorizada (solo la de FaceOps)
          ansible.builtin.copy:
            dest: "/home/{{ usuario }}/.ssh/authorized_keys"
            content: "{{ lookup('ansible.builtin.file', '/tmp/faceops-vinculo-' ~ inventory_hostname ~ '.pub') }}\n"
            owner: "{{ usuario }}"
            group: "{{ usuario }}"
            mode: "0600"
        - name: Sudo sin clave para el usuario de servicio
          ansible.builtin.copy:
            dest: "/etc/sudoers.d/{{ usuario }}"
            content: "{{ usuario }} ALL=(ALL) NOPASSWD: ALL\n"
            mode: "0440"
            validate: /usr/sbin/visudo -cf %s

    - name: Windows · usuario de servicio local con clave propia (generada aquí, solo queda en la bóveda)
      when: tipo == 'windows'
      become: false   # la plantilla eleva con sudo; en Windows no aplica (WinRM ya entra como administrador)
      block:
        - name: Clave generada
          ansible.builtin.set_fact:
            vm_clave: "{{ vm_clave | default(lookup('ansible.builtin.password', '/dev/null', length=24, chars=['ascii_letters', 'digits']) ~ '#9a') }}"
          no_log: true
        - name: ¿Es controlador de dominio? (ahí no hay usuarios locales)
          ansible.windows.win_shell: (Get-CimInstance Win32_ComputerSystem).DomainRole
          register: r_rol
          changed_when: false
        - name: Usuario de servicio en el dominio (controlador de dominio)
          ansible.windows.win_shell: |
            $p = ConvertTo-SecureString $env:FO_CLAVE -AsPlainText -Force
            if (Get-ADUser -Filter "SamAccountName -eq '{{ usuario }}'") { Set-ADAccountPassword -Identity '{{ usuario }}' -NewPassword $p -Reset }
            else { New-ADUser -Name '{{ usuario }}' -SamAccountName '{{ usuario }}' -AccountPassword $p -Enabled $true -PasswordNeverExpires $true -Description 'Servicio de automatizacion (FaceOps - AAP)' }
            Add-ADGroupMember -Identity 'Domain Admins' -Members '{{ usuario }}' -ErrorAction SilentlyContinue
          environment:
            FO_CLAVE: "{{ vm_clave }}"
          when: (r_rol.stdout | trim | int) >= 4
          no_log: true
        - name: Usuario local de servicio
          when: (r_rol.stdout | trim | int) < 4
          ansible.windows.win_user:
            name: "{{ usuario }}"
            password: "{{ vm_clave }}"
            password_never_expires: true
            update_password: always
            groups: [Administrators]
            groups_action: add
            description: "Servicio de automatización (FaceOps · AAP)"
          no_log: true

    - name: Equipos de red · la clave viene en la solicitud
      ansible.builtin.assert:
        that: [vm_clave is defined, vm_clave | length > 0]
        fail_msg: "Para un equipo de red indica en la solicitud el usuario y la clave que se guardarán en la bóveda"
      when: tipo == 'red'

    - name: OpenShift · cuenta de servicio propia de FaceOps en el clúster (con el token de administrador que se entrega una vez)
      when: tipo == 'openshift'
      delegate_to: localhost
      vars:
        ocp_api: "{{ vm_api | default(openshift.api | default('https://' ~ (ansible_host | default(inventory_hostname)) ~ ':6443')) }}"
        ocp_h: {Authorization: "Bearer {{ vm_clave }}", Content-Type: application/json}
      block:
        - name: OpenShift · el token de administrador es válido
          ansible.builtin.uri:
            url: "{{ ocp_api }}/apis/user.openshift.io/v1/users/~"
            headers: "{{ ocp_h }}"
            validate_certs: false
          register: r_yo
          no_log: true

        - name: OpenShift · proyecto, cuenta de servicio y permisos
          ansible.builtin.uri:
            url: "{{ ocp_api }}{{ item.ruta }}"
            method: POST
            headers: "{{ ocp_h }}"
            body_format: json
            body: "{{ item.cuerpo }}"
            validate_certs: false
            status_code: [200, 201, 409]
          loop:
            - {ruta: /api/v1/namespaces, cuerpo: {apiVersion: v1, kind: Namespace, metadata: {name: faceops, labels: {faceops.invoke.cl/gestionado: "true"}}}}
            - {ruta: /api/v1/namespaces/faceops/serviceaccounts, cuerpo: {apiVersion: v1, kind: ServiceAccount, metadata: {name: "{{ usuario }}"}}}
            - {ruta: /apis/rbac.authorization.k8s.io/v1/clusterrolebindings, cuerpo: {apiVersion: rbac.authorization.k8s.io/v1, kind: ClusterRoleBinding,
               metadata: {name: "faceops-{{ usuario }}"}, roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: cluster-admin},
               subjects: [{kind: ServiceAccount, name: "{{ usuario }}", namespace: faceops}]}}
            - {ruta: /api/v1/namespaces/faceops/secrets, cuerpo: {apiVersion: v1, kind: Secret, type: kubernetes.io/service-account-token,
               metadata: {name: "{{ usuario }}-token", annotations: {kubernetes.io/service-account.name: "{{ usuario }}"}}}}
          loop_control: {label: "{{ item.ruta }}"}
          no_log: true

        - name: OpenShift · token de la cuenta de servicio
          ansible.builtin.uri:
            url: "{{ ocp_api }}/api/v1/namespaces/faceops/secrets/{{ usuario }}-token"
            headers: "{{ ocp_h }}"
            validate_certs: false
          register: r_sec
          until: (r_sec.json.data | default({})).token is defined
          retries: 12
          delay: 5
          no_log: true

        - name: OpenShift · credencial lista para la bóveda
          ansible.builtin.set_fact:
            ocp_cred: {usuario: "system:serviceaccount:faceops:{{ usuario }}", token: "{{ r_sec.json.data.token | b64decode }}", api: "{{ ocp_api }}", protocolo: api}
          no_log: true

    - name: Credencial en la bóveda
      ansible.builtin.uri:
        url: "{{ bov_addr }}/v1/faceops/data/maquinas/{{ inventory_hostname }}"
        method: POST
        headers: {X-Vault-Token: "{{ bov_token }}"}
        body_format: json
        body:
          data: "{{ ocp_cred if tipo == 'openshift' else
                    {'usuario': usuario, 'protocolo': 'ssh', 'llave_privada': lookup('ansible.builtin.file', '/tmp/faceops-vinculo-' ~ inventory_hostname)}
                    if tipo == 'linux' else
                    {'usuario': usuario, 'clave': vm_clave, 'protocolo': ('rdp' if tipo == 'windows' else 'ssh')} }}"
        status_code: [200, 204]
      delegate_to: localhost
      no_log: true

    - name: Sin restos de la llave en el nodo de ejecución
      ansible.builtin.file:
        path: "/tmp/faceops-vinculo-{{ inventory_hostname }}{{ item }}"
        state: absent
      loop: ["", ".pub"]
      delegate_to: localhost

    - name: Resultado para FaceOps
      ansible.builtin.set_stats:
        data:
          faceops_vinculo: "{{ {inventory_hostname: {'usuario': usuario, 'tipo': tipo, 'vinculada': true}} }}"
        aggregate: true
