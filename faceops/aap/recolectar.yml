---
# FaceOps · Recolectar inventario. Lo lanza FaceOps una vez al día (y a pedido) por cada inventario del cliente,
# con la credencial que corresponda. AAP guarda los datos en su caché de facts (use_fact_cache) y FaceOps los lee
# por la API para armar el inventario inteligente.
# Solo parámetros estándar del sistema operativo (igual en todo equipo, sin depender de lo que tenga instalado):
#   sistema y versión, kernel, CPU, RAM, discos, IP, uptime, SELinux, servicios en ejecución, registro y parches.
# Más adelante se puede especializar por skill (p. ej. versión de JBoss o de PostgreSQL) con tareas aparte.
- name: FaceOps · Recolectar inventario
  hosts: all
  gather_facts: false
  ignore_unreachable: true
  tasks:
    - name: Datos estándar del sistema operativo
      ansible.builtin.setup:
        gather_subset: [min, hardware, network]
        gather_timeout: 30
      register: r_setup
      ignore_errors: true

    # RHEL 5 y 6 traen un Python que los módulos de Ansible ya no soportan (2.4 / 2.6): sus datos se leen por shell
    - name: Equipo legado (sin módulos de Ansible)
      when: (r_setup is failed or r_setup is unreachable or ansible_os_family is not defined) and (ansible_connection | default('ssh')) not in ['winrm', 'psrp']
      block:
        - name: Datos del sistema por shell
          ansible.builtin.raw: |
            echo "dist=$(head -1 /etc/redhat-release 2>/dev/null || head -1 /etc/issue)"
            echo "kernel=$(uname -r)"; echo "host=$(hostname -s)"; echo "fqdn=$(hostname -f 2>/dev/null || hostname)"
            echo "cpu=$(grep -c ^processor /proc/cpuinfo)"
            echo "mem=$(awk '/^MemTotal/{print int($2/1024)}' /proc/meminfo)"
            echo "memfree=$(awk '/^MemFree/{print int($2/1024)}' /proc/meminfo)"
            echo "uptime=$(cut -d. -f1 /proc/uptime)"
            echo "ip=$( (/sbin/ip -4 route get 1.1.1.1 2>/dev/null | sed -n 's/.* src \([0-9.]*\).*/\1/p'; /sbin/ifconfig 2>/dev/null | sed -n 's/.*inet addr:\([0-9.]*\).*/\1/p' | grep -v '^127') | head -1)"
            echo "selinux=$(/usr/sbin/getenforce 2>/dev/null | tr 'A-Z' 'a-z')"
            echo "python=$(python -V 2>&1)"
            echo "svc=$(/sbin/service --status-all 2>/dev/null | grep -iE 'running|en ejecuci' | sed 's/ .*//' | sort -u | tr '\n' ',')"
            echo "disco=$(df -P / | awk 'NR==2{print $2","$4}')"
          register: r_raw
          changed_when: false

        - name: Datos para FaceOps (mismos nombres que los de Ansible)
          ansible.builtin.set_fact:
            cacheable: true
            ansible_os_family: RedHat
            ansible_distribution: "{{ 'RedHat' if 'Red Hat' in kv.dist else (kv.dist.split(' ')[0]) }}"
            ansible_distribution_version: "{{ kv.dist | regex_search('[0-9]+(\\.[0-9]+)?') | default('', true) }}"
            ansible_distribution_major_version: "{{ (kv.dist | regex_search('[0-9]+') | default('', true)) }}"
            ansible_kernel: "{{ kv.kernel }}"
            ansible_hostname: "{{ kv.host }}"
            ansible_fqdn: "{{ kv.fqdn }}"
            ansible_processor_vcpus: "{{ kv.cpu | int }}"
            ansible_memtotal_mb: "{{ kv.mem | int }}"
            ansible_memfree_mb: "{{ kv.memfree | int }}"
            ansible_uptime_seconds: "{{ kv.uptime | int }}"
            ansible_default_ipv4: {address: "{{ kv.ip }}"}
            ansible_selinux: {mode: "{{ kv.selinux }}"}
            ansible_mounts: "{{ [{'mount': '/', 'size_total': (kv.disco.split(',')[0] | int) * 1024, 'size_available': (kv.disco.split(',')[1] | int) * 1024}] if ',' in kv.disco else [] }}"
            services: "{{ dict(kv.svc.split(',') | reject('equalto', '') | map('regex_replace', '$', '.service') | zip_longest([], fillvalue={'state': 'running'})) }}"
            faceops_legado: "{{ kv.python }}: sin módulos de Ansible (datos leídos por shell)"
            faceops_recolectado: "{{ now(utc=true).isoformat() }}"
          vars:
            kv: >-
              {% set d = {} %}{% for l in r_raw.stdout_lines if '=' in l %}{% set _ = d.update({(l.split('=', 1)[0] | trim): (l.split('=', 1)[1] | trim)}) %}{% endfor %}{{ d }}

        - name: El resto de la recolección necesita módulos de Ansible
          ansible.builtin.meta: end_host

    - name: Sin datos (no es un equipo legado)
      ansible.builtin.fail:
        msg: "{{ r_setup.msg | default('no se pudieron leer los datos del sistema') }}"
      when: r_setup is failed or r_setup is unreachable

    - name: Servicios (Linux)
      ansible.builtin.service_facts:
      when: ansible_os_family != 'Windows'

    - name: Servicios (Windows)
      ansible.windows.win_service_info:
      register: r_win
      failed_when: false
      when: ansible_os_family == 'Windows'

    - name: Servicios en ejecución (Windows, para FaceOps)
      ansible.builtin.set_fact:
        cacheable: true
        faceops_servicios_win: "{{ r_win.services | selectattr('state', 'equalto', 'started') | map(attribute='name') | map('lower') | list }}"
      when: r_win.services is defined

    - name: Registro en Red Hat
      ansible.builtin.command: subscription-manager identity
      register: r_reg
      changed_when: false
      failed_when: false
      become: true
      when: ansible_os_family == 'RedHat'

    - name: Parches de seguridad pendientes
      ansible.builtin.shell: set -o pipefail; timeout 120 dnf -q updateinfo list --security --available 2>/dev/null | wc -l
      args:
        executable: /bin/bash
      register: r_parches
      changed_when: false
      failed_when: false
      become: true
      when: ansible_os_family == 'RedHat'

    - name: Fecha de la recolección
      ansible.builtin.set_fact:
        cacheable: true
        faceops_recolectado: "{{ now(utc=true).isoformat() }}"

    - name: Registro (para FaceOps)
      ansible.builtin.set_fact:
        cacheable: true
        faceops_registrado: "{{ r_reg.rc == 0 }}"
      when: r_reg.rc is defined

    - name: Parches pendientes (para FaceOps)
      ansible.builtin.set_fact:
        cacheable: true
        faceops_parches_seguridad: "{{ r_parches.stdout | int }}"
      when: r_parches.rc is defined and r_parches.rc == 0

    - name: Estado de los servicios habilitados y con error (Linux)
      ansible.builtin.shell: |
        u=$( (systemctl list-unit-files --type=service --state=enabled --no-legend --plain | awk '{print $1}'; systemctl list-units --type=service --state=failed --no-legend --plain | awk '{print $1}') | grep -v '@\.service$' | sort -u)
        [ -n "$u" ] && systemctl show $u -p Id,Type,ActiveState,SubState,UnitFileState,Result,ConditionResult --no-pager | awk -v RS= -F'\n' '{o=""; for(i=1;i<=NF;i++){o=o $i ";"} print o}'
      register: r_svc
      changed_when: false
      failed_when: false
      become: true
      when: ansible_os_family != 'Windows'

    - name: Archivos de log de la máquina (Linux)
      ansible.builtin.shell: |
        find /var/log /var/opt/rh/eap8/log /opt/rh/eap8/root/usr/share/wildfly/standalone/log /var/lib/pgsql/data/log /var/lib/pgsql/*/data/log \
             /opt/keycloak/data/log /var/log/dirsrv /var/log/httpd /var/log/nginx /var/log/redis /var/log/tomcat /var/log/vault \
             -maxdepth 3 -type f -size +0 \( -name '*.log' -o -name messages -o -name secure -o -name cron -o -name maillog -o -name dmesg \
             -o -name errors -o -name access -o -name audit -o -name '*_log' \) ! -name '*.gz' -printf '%p|%s|%TY-%Tm-%Td %TH:%TM\n' 2>/dev/null | sort -u | head -150
      register: r_logs
      changed_when: false
      failed_when: false
      become: true
      when: ansible_os_family != 'Windows'

    - name: JBoss instalados y sus aplicaciones (AS 5/6, EAP 6/7 y EAP 8)
      ansible.builtin.shell: |
        for d in $(ls -d /opt/jboss* /opt/*/jboss* /usr/share/jboss* /srv/jboss* /opt/rh/eap*/root/usr/share/wildfly 2>/dev/null); do
          [ -d "$d/bin" ] || continue
          if [ -f "$d/bin/run.jar" ]; then
            v=$( (unzip -p "$d/bin/run.jar" META-INF/MANIFEST.MF 2>/dev/null || python3 -c "import zipfile,sys; print(zipfile.ZipFile(sys.argv[1]).read('META-INF/MANIFEST.MF').decode())" "$d/bin/run.jar" 2>/dev/null) | awk -F'Implementation-Version: ' '/Implementation-Version/{print $2; exit}' | sed 's/ (.*//' | tr -d '\r')
            apps=$(ls -d $d/server/*/deploy/*.war $d/server/*/deploy/*.ear 2>/dev/null | xargs -r -n1 basename | sort -u | paste -sd,)
            echo "$d|as5-6|${v:-desconocida}|$apps"
          elif [ -f "$d/bin/standalone.sh" ]; then
            case "$d" in /opt/rh/eap8/*) f=eap8; v=$(rpm -q --qf '%{VERSION}' eap8-wildfly 2>/dev/null || echo 8);; *) f=eap6-7; v=$(head -1 $d/version.txt 2>/dev/null | tr -d '\r');; esac
            apps=$(ls -d $d/standalone/deployments/*.war $d/standalone/deployments/*.ear 2>/dev/null | xargs -r -n1 basename | sort -u | paste -sd,)
            [ -z "$apps" ] && [ "$f" = eap8 ] && apps=$($d/bin/jboss-cli.sh -c --controller=localhost:9990 --command="deployment-info" 2>/dev/null | awk 'NR>1 && $1 ~ /\.(war|ear)$/ {print $1}' | paste -sd,)
            echo "$d|$f|${v:-desconocida}|$apps"
          fi
        done
      register: r_jboss
      changed_when: false
      failed_when: false
      become: true
      when: ansible_os_family != 'Windows'

    - name: Servicios y logs (para FaceOps)
      ansible.builtin.set_fact:
        cacheable: true
        faceops_servicios_det: "{{ r_svc.stdout_lines | default([]) }}"
        faceops_logs: "{{ r_logs.stdout_lines | default([]) }}"
        faceops_jboss: "{{ r_jboss.stdout_lines | default([]) }}"
      when: ansible_os_family != 'Windows'
