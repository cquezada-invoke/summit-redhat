---
# Nube · Operar máquina. Una acción sobre una máquina de la nube: encender, apagar, reiniciar,
# redimensionar (apaga y vuelve a encender si estaba encendida), agregar o ampliar disco, etiquetas, snapshot, regla de
# firewall asociada o eliminar (con sus snapshots, discos y reglas de FaceOps). Espera cada operación y verifica el resultado.
# Lo lanza FaceOps desde la ficha de la nube con la credencial cifrada de la conexión (GCP), siempre con ticket y aprobación en AAP.
# Variables: nb_infra_id, nb_proyecto (proyecto de la conexión), nb_entrada (lo que arma FaceOps; nunca secretos).
# Resultado (set_stats faceops_nube_operacion): acción, pasos hechos y estado final de la máquina.
- name: Nube · Operar máquina
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Datos válidos
      ansible.builtin.assert:
        that:
          - nb_infra_id | default('') | string is match('^[0-9]+$')
          - nb_proyecto | default('') is match('^[a-z][a-z0-9-]{4,28}[a-z0-9]$')
          - nb_entrada.accion | default('') in ['encender', 'apagar', 'reiniciar', 'redimensionar', 'disco_agregar', 'disco_ampliar', 'etiquetas', 'snapshot', 'firewall', 'eliminar']
          - nb_entrada.maquina | default('') is match('^[a-z]([-a-z0-9]{0,61}[a-z0-9])?$')
          - nb_entrada.zona | default('') is match('^[a-z]+-[a-z]+[0-9]+-[a-z]$')
        fail_msg: "Falta la nube o el proyecto, o la acción, la máquina o la zona no son válidas (no se tocó la nube)"
        quiet: true

    - name: Archivos temporales (un nombre fijo para toda la corrida)
      ansible.builtin.set_fact:
        entrada: "/tmp/nube-operar-{{ nb_infra_id }}-{{ 999999999 | random }}.json"

    - name: Salida
      ansible.builtin.set_fact:
        salida: "{{ entrada | regex_replace('\\.json$', '-salida.json') }}"

    - name: Entrada para la nube (sin secretos)
      ansible.builtin.copy:
        content: "{{ nb_entrada | default({}) | to_json }}"
        dest: "{{ entrada }}"
        mode: "0600"
      changed_when: false

    - name: Operar la máquina con la credencial cifrada de la conexión (sin secretos en la salida)
      ansible.builtin.command:
        argv: [python3, "{{ playbook_dir }}/files/nube_gcp.py", operar, "{{ nb_proyecto }}", "{{ entrada }}", "{{ salida }}"]
      register: corrida
      changed_when: true
      no_log: true

    - name: Resultado
      ansible.builtin.set_fact:
        res: "{{ lookup('ansible.builtin.file', salida) | from_json }}"

    - name: Borrar los archivos temporales
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: ["{{ entrada }}", "{{ salida }}"]

    - name: Resultado para FaceOps
      ansible.builtin.set_stats:
        data:
          faceops_nube_operacion: "{{ res | combine({'infra_id': nb_infra_id | int}) }}"
        per_host: false

    - name: Acción aplicada
      ansible.builtin.assert:
        that: res.ok | bool
        success_msg: "{{ nb_entrada.maquina }} · {{ nb_entrada.accion }}: {{ res.hecho | default([]) | join(' · ') }} · estado {{ res.estado | default('—') }}"
        fail_msg: "{{ nb_entrada.maquina }} · {{ nb_entrada.accion }}: {{ res.error | default('sin detalle') }}"
