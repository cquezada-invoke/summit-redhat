---
# Autocuidado · Atender alerta. Lo lanza Event-Driven Ansible (rulebook «FaceOps · autocuidado») cuando Alertmanager entrega
# una alerta de autocuidado. Le pasa el evento a FaceOps, que aplica la política: crea el ticket de la acción y, si es de bajo
# riesgo y está certificada, lo aprueba con «Aprobado por Claude (regla de Cristian)»; si no, queda pendiente de una persona.
# Si FaceOps no responde y la acción es de bajo riesgo y de las que sanan a FaceOps o al anfitrión (lista sin_faceops), la
# lanza directo en AAP; FaceOps la registra como ticket al volver.
#   ac_regla, ac_accion, ac_severidad, ac_resumen, ac_objeto, ac_estado (firing/resolved)
#   Credenciales: «AAP · FaceOps (gateway)» (CONTROLLER_*) y «Autocuidado · FaceOps (eventos)» (FO_AC_URL, FO_AC_TOKEN)
- name: Autocuidado · Atender alerta
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    sin_faceops:   # acción → plantilla que se lanza directo si FaceOps no responde (todas de bajo riesgo)
      reiniciar_faceops: "Autocuidado · Reiniciar FaceOps y despliegue"
      liberar_disco: "Autocuidado · Liberar disco"
      recuperar_vms: "Autocuidado · Recuperar máquinas virtuales"
    api: "{{ lookup('ansible.builtin.env', 'CONTROLLER_HOST') | regex_replace('/api/controller/?$', '') | regex_replace('/$', '') }}/api/controller/v2"
    auth: &auth
      url_username: "{{ lookup('ansible.builtin.env', 'CONTROLLER_USERNAME') }}"
      url_password: "{{ lookup('ansible.builtin.env', 'CONTROLLER_PASSWORD') }}"
      force_basic_auth: true
      validate_certs: false
    evento:
      regla: "{{ ac_regla | default('') }}"
      accion: "{{ ac_accion | default('avisar') }}"
      severidad: "{{ ac_severidad | default('') }}"
      resumen: "{{ ac_resumen | default('') }}"
      objeto: "{{ ac_objeto | default('') }}"
      estado: "{{ ac_estado | default('firing') }}"
      job: "{{ tower_job_id | default(awx_job_id | default('')) }}"
  tasks:
    - name: Datos válidos
      ansible.builtin.assert:
        that:
          - evento.regla is match('^AC[0-9]{2}[A-Za-z]*$')
          - evento.accion is match('^[a-z_]{3,40}$')
        fail_msg: "Evento de autocuidado sin regla o acción válidas"
        quiet: true

    - name: Entregar el evento a FaceOps (política, ticket y aprobación)
      ansible.builtin.uri:
        url: "{{ lookup('ansible.builtin.env', 'FO_AC_URL') }}/api/autocuidado/evento"
        method: POST
        body_format: json
        body: "{{ evento }}"
        headers:
          Authorization: "Bearer {{ lookup('ansible.builtin.env', 'FO_AC_TOKEN') }}"
        timeout: 20
        status_code: [200]
      register: r_fo
      no_log: true
      failed_when: false

    - name: Lo que decidió FaceOps
      ansible.builtin.debug:
        msg: "{{ (r_fo.json | default({})) | to_json if r_fo.status | default(0) == 200 else 'FaceOps no respondió (' ~ (r_fo.status | default(0)) ~ ')' }}"

    - name: Sin FaceOps · acción de bajo riesgo directo en AAP
      when: r_fo.status | default(0) != 200 and evento.accion in sin_faceops and evento.estado == 'firing'
      block:
        - name: Plantilla
          ansible.builtin.uri:
            url: "{{ api }}/job_templates/?name={{ sin_faceops[evento.accion] | urlencode }}"
            <<: *auth
          register: r_jt
          failed_when: r_jt.json.count | default(0) == 0

        - name: Lanzar
          ansible.builtin.uri:
            url: "{{ api }}/job_templates/{{ r_jt.json.results[0].id }}/launch/"
            method: POST
            body_format: json
            body: {extra_vars: {autocuidado_sin_faceops: true, autocuidado_regla: "{{ evento.regla }}"}}
            status_code: [201]
            <<: *auth
          register: r_lz

        - name: Lanzada sin FaceOps
          ansible.builtin.debug:
            msg: "FaceOps no respondió: «{{ sin_faceops[evento.accion] }}» lanzada directo (trabajo {{ r_lz.json.id }}); FaceOps la registra al volver"

    - name: Resultado para FaceOps
      ansible.builtin.set_stats:
        data:
          faceops_autocuidado_evento: "{{ evento | combine({'faceops': r_fo.status | default(0), 'directo': r_lz.json.id | default(none)}) }}"
