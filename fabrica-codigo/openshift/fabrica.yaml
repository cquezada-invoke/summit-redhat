# Fábrica de código en el SNO (namespace fabrica-codigo) y el namespace donde despliega lo que genera (fabrica-dev).
apiVersion: v1
kind: Namespace
metadata: {name: fabrica-codigo}
---
apiVersion: v1
kind: Namespace
metadata: {name: fabrica-dev, labels: {app.kubernetes.io/part-of: fabrica-codigo}}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: fabrica-pipeline, namespace: fabrica-dev}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: fabrica-pipeline-edit, namespace: fabrica-dev}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: edit}
subjects: [{kind: ServiceAccount, name: fabrica-pipeline, namespace: fabrica-dev}]
---
apiVersion: v1
kind: Secret
metadata: {name: fabrica-pipeline-token, namespace: fabrica-dev, annotations: {kubernetes.io/service-account.name: fabrica-pipeline}}
type: kubernetes.io/service-account-token
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata: {name: fabrica, namespace: fabrica-codigo}
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata: {name: fabrica, namespace: fabrica-codigo}
spec:
  source: {type: Binary}
  strategy: {type: Docker, dockerStrategy: {dockerfilePath: Containerfile}}
  output: {to: {kind: ImageStreamTag, name: "fabrica:latest"}}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: fabrica, namespace: fabrica-codigo}
data:
  FACEOPS_URL: http://192.168.122.1:8110
  FACEOPS_URL_PUBLICA: https://faceops.34.176.42.56.sslip.io:8843/faceops
  GITEA_URL: http://192.168.122.1:3000
  GITEA_URL_PIPELINE: http://192.168.122.1:3000
  GITEA_URL_PUBLICA: https://faceops.34.176.42.56.sslip.io:8843/git
  GITEA_ORG: fabrica
  FABRICA_DOMINIO_APPS: sno.34.176.42.56.sslip.io
  ANTHROPIC_MODEL: claude-sonnet-5-5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fabrica
  namespace: fabrica-codigo
  labels: {app.kubernetes.io/name: fabrica, app.kubernetes.io/part-of: fabrica-codigo, app.kubernetes.io/version: "1.0"}
  annotations: {image.openshift.io/triggers: '[{"from":{"kind":"ImageStreamTag","name":"fabrica:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"app\")].image"}]'}
spec:
  strategy: {type: Recreate}
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: fabrica}}
  template:
    metadata: {labels: {app.kubernetes.io/name: fabrica, app.kubernetes.io/part-of: fabrica-codigo, app.kubernetes.io/version: "1.0"}}
    spec:
      containers:
        - name: app
          image: image-registry.openshift-image-registry.svc:5000/fabrica-codigo/fabrica:latest
          ports: [{containerPort: 8080}]
          envFrom: [{configMapRef: {name: fabrica}}, {secretRef: {name: fabrica}}]
          livenessProbe: {httpGet: {path: /salud, port: 8080}, initialDelaySeconds: 10, periodSeconds: 20}
          readinessProbe: {httpGet: {path: /salud, port: 8080}, initialDelaySeconds: 5, periodSeconds: 10}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}
          securityContext: {allowPrivilegeEscalation: false, runAsNonRoot: true, capabilities: {drop: [ALL]}, seccompProfile: {type: RuntimeDefault}}
---
apiVersion: v1
kind: Service
metadata: {name: fabrica, namespace: fabrica-codigo}
spec: {selector: {app.kubernetes.io/name: fabrica}, ports: [{port: 8080, targetPort: 8080}]}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata: {name: fabrica, namespace: fabrica-codigo, annotations: {haproxy.router.openshift.io/timeout: 320s}}
spec:
  host: fabrica.sno.34.176.42.56.sslip.io
  to: {kind: Service, name: fabrica}
  port: {targetPort: 8080}
  tls: {termination: edge, insecureEdgeTerminationPolicy: Redirect}
