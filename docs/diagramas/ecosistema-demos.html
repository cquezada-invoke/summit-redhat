/* Layout: plano de infraestructura a todo ancho; arriba pestañas por demo, abajo el detalle de la demo elegida */
:root{
  --bg:#f2f4f5; --panel:#ffffff; --node:#ffffff; --ink:#16202a; --muted:#5a6773;
  --line:#c3ccd4; --frame:#8796a3; --band:#e2e7eb; --soft:#e9edf0;

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e141a; --panel:#141c24; --node:#18222b; --ink:#e4eaef; --muted:#93a1ad;

:root[data-theme="dark"]{

  --line:#33404c; --frame:#5c6b78; --band:#1b252e; --soft:#1d2731;
  --d1:#3cc2be; --d2:#6c9cff; --d3:#f0a43a; --d4:#b08bff; --d5:#ff6a7e; --d6:#8fd468; --d7:#e58ad3;
  --ok:#6fd39a; --okbg:#173326; --wip:#f3b55a; --wipbg:#3a2a12; --plan:#a3b0bb; --planbg:#222d37; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
.wrap{max-width:1360px;margin:0 auto;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:20px}
header{display:grid;gap:6px}
.eyebrow{font:500 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{margin:0;font-size:clamp(24px,3vw,32px);font-weight:700;letter-spacing:-.01em;text-wrap:balance}
header p{margin:0;color:var(--muted);max-width:70ch}
nav{display:flex;flex-wrap:wrap;gap:8px}
nav button{font:500 14px/1 var(--sans);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:9px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
nav button .dot{width:10px;height:10px;border-radius:50%}
nav button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
nav button:focus-visible,.card:focus-visible{outline:2px solid var(--d2);outline-offset:2px}
.diagram{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow-x:auto}
.diagram svg{display:block;width:100%;min-width:980px;height:auto}
.detail{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:24px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px}

.detail h2{margin:0 0 6px;font-size:20px;text-wrap:balance}
.detail p{margin:0 0 10px;max-width:62ch}
.chip{display:inline-block;font:500 12px/1 var(--mono);padding:5px 8px;border-radius:5px;letter-spacing:.02em}
.chip.ok{color:var(--ok);background:var(--okbg)} .chip.wip{color:var(--wip);background:var(--wipbg)} .chip.plan{color:var(--plan);background:var(--planbg)}
ol.steps{list-style:none;margin:0;padding:0;display:grid;gap:4px}
ol.steps li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;align-items:start;padding:7px 8px;border-radius:6px;cursor:default}
ol.steps li:hover{background:var(--soft)}
ol.steps .n{width:22px;height:22px;border-radius:50%;color:#fff;font:600 12px/22px var(--mono);text-align:center}
ol.steps .pend{color:var(--muted);font-size:13px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.card{border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--node);cursor:pointer;display:grid;gap:6px;text-align:left;font:inherit;color:inherit}
.card .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card b{font-size:14px}
.card span.m{font-size:13px;color:var(--muted)}
.legend{display:grid;gap:8px;font-size:13px;color:var(--muted)}
.legend div{display:flex;align-items:center;gap:10px}
.legend svg{flex:none}
.meta{font:12px var(--mono);color:var(--muted)}
/* SVG */
.frame-vm{fill:none;stroke:var(--frame);stroke-width:1.5}
.frame-sub{fill:var(--soft);stroke:var(--line);stroke-dasharray:5 4}
.frame-lab{fill:none;stroke:var(--frame);stroke-dasharray:3 4}
.band{fill:var(--band)}
.t-head{font:600 12px var(--sans);fill:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.t-band{font:500 11px var(--mono);fill:var(--muted)}
.t-vm{font:600 13px var(--mono);fill:var(--muted)}
.node rect{fill:var(--node);stroke:var(--line);stroke-width:1.2}
.node.planned rect{stroke-dasharray:4 3;stroke:var(--frame)}
.node .lbl{font:600 13px var(--sans);fill:var(--ink)}
.node .sub{font:400 10.5px var(--sans);fill:var(--muted)}
.node use{color:var(--ink)}
.node{transition:opacity .25s}
.dim{opacity:.22}
.cable{stroke:var(--frame);stroke-width:1.4;stroke-dasharray:3 3;fill:none}
.edge{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;transition:opacity .2s,stroke-width .2s}
.edge.planned{stroke-dasharray:5 4}
.edge.live{stroke-dasharray:7 5;animation:flow 1.2s linear infinite}
.edge.faded{opacity:.15}
.edge.hot{stroke-width:3.4}
@keyframes flow{to{stroke-dashoffset:-24}}
@media (prefers-reduced-motion:reduce){.edge.live{animation:none;stroke-dasharray:none}}
.badge circle{stroke:var(--panel);stroke-width:2}
.badge text{font:600 11px var(--mono);fill:#fff;text-anchor:middle;dominant-baseline:central}
.badge{transition:opacity .2s}
.node{cursor:pointer}
.node:hover rect,.node:focus-visible rect{stroke:var(--ink)}
.node:focus{outline:none}
.node.sel rect{stroke:var(--d2);stroke-width:2.6}
.t-vm.link{cursor:pointer;text-decoration:underline;text-decoration-style:dotted}
.hint{font-size:13px;color:var(--muted)}
dl.spec{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 16px;margin:0;font-size:14px}
dl.spec dt{color:var(--muted)}
dl.spec dd{margin:0;font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.uses{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
.uses button{font:500 12px/1 var(--sans);border:1px solid var(--line);background:var(--node);color:var(--ink);border-radius:999px;padding:6px 10px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.uses .dot{width:8px;height:8px;border-radius:50%}
.faq{display:grid;gap:6px}
.faq details{border:1px solid var(--line);border-radius:7px;padding:8px 12px;background:var(--node)}
.faq summary{cursor:pointer;font-weight:600;font-size:14px}
.faq details p{margin:8px 0 2px;font-size:14px}
.links{display:grid;gap:8px;margin:2px 0 6px}
.lk{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--node)}
.lk a{font-weight:600;color:var(--d2);text-decoration:none;overflow-wrap:anywhere}
.lk a:hover,dl.spec dd a:hover{text-decoration:underline}
.lk .u{grid-column:1/-1;font:12px var(--mono);color:var(--muted)}
.lk .go{font:500 12px var(--sans);color:var(--muted)}
dl.spec dd a{color:var(--d2);text-decoration:none}
.sshb{display:grid;gap:8px;margin:2px 0 6px}
.sshr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--node)}
.sshr code{font:13px var(--mono);overflow-wrap:anywhere;user-select:all}
.sshr .u{grid-column:1/-1;font:12px var(--sans);color:var(--muted)}
.lk.sshr b{grid-column:1/-1;font-weight:600;color:var(--d2)}
.lk.sshr code{grid-column:1}
.lk.sshr button{grid-column:2;align-self:start}
.sshr button{font:500 12px var(--sans);border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:5px 10px;cursor:pointer}
.back{font:500 13px var(--sans);background:none;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:6px 10px;cursor:pointer;margin-bottom:10px}
.col{display:grid;gap:14px;align-content:start;min-width:0}
.col h3{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.inst{grid-column:1/-1;min-width:0}
.inst .tw{overflow-x:auto}
.inst table{border-collapse:collapse;width:100%;font-size:13px}
.inst th,.inst td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap}
.inst td:last-child{white-space:normal;min-width:220px}
.inst th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.inst td.m{font-family:var(--mono);font-variant-numeric:tabular-nums}
.inst tr.grp td{background:var(--soft);font-weight:600;font-size:12px;color:var(--muted)}
.inst tbody tr[data-n]{cursor:pointer}
.inst tbody tr[data-n]:hover td{background:var(--soft)}
</style>

 {id:'d3',name:'Plataforma como código',st:'ok',stx:'Funcionando',

  steps:[

   {f:'gitea',t:'tekton',x:'El pipeline suma el paso "preparar plataforma"'},
   {f:'tekton',t:'aap',x:'Lanza "Plataforma · Preparar dependencias"'},
   {f:'aap',t:'postgres',x:'Crea base y usuario, y aplica las migraciones en orden'},
   {f:'aap',t:'tomcat',x:'Caché en Valkey, colas en Artemis, realm, cliente y roles en Keycloak'},

   {f:'aap',t:'vault',x:'Guarda las claves generadas; nadie las ve'},
   {f:'aap',t:'snow',x:'Registra en ServiceNow un cambio estándar con una tarea por operación (SQL, cola, rol, datasource): se abre al empezar y se cierra sola con su duración real y el tiempo manual estimado'},

 {id:'d4',name:'Redes',st:'ok',stx:'Funcionando · drift, acceso con aprobación, bloqueo de IP y firmware',
  msg:'La red también es código: la configuración del router vive en Git y, si alguien la cambia a mano, EDA lo detecta y AAP la restaura en menos de un minuto. Y cuando alguien necesita un acceso, abre un ticket común en ServiceNow ("Solicitar acceso de red"): EDA lo detecta en segundos, "Red · Solicitar acceso" crea la regla en el firewall VyOS (entre el router y los usuarios), la prueba desde pc-usuario y cierra ese mismo ticket con la evidencia. Medido: detectado en 8 a 12 s y cerrado en 50 a 90 s. Un ticket puede pedir varios puertos u orígenes y tener vencimiento; otro ticket lo retira; si la prueba falla, la regla se deshace sola y el ticket queda escalado (nunca en el limbo). Firmware: un cambio en ServiceNow con una tarea por equipo actualiza los routers de sucursal y parcha los servidores RHEL por lotes (canario primero) y, si un equipo falla, lo devuelve a la versión anterior y se detiene.',
  steps:[
   {f:'dev',t:'gitea',x:'La configuración del router vive en el repo red-laboratorio'},
   {f:'gitea',t:'aap',x:'AAP aplica la configuración declarada (Red · Aplicar configuración)'},
   {f:'aap',t:'rtr',x:'Queda aplicada en el router de borde, que habla BGP con el ISP (Internet simulada)',more:[['rtr','isp']]},
   {f:'visitante',t:'rtr',x:'Alguien quita a mano el vecino BGP: se cae Internet'},
   {f:'rtr',t:'eda',x:'El vigía del router avisa a EDA'},
   {f:'eda',t:'aap',x:'EDA lanza "Red · Verificar drift"'},
   {f:'aap',t:'rtr',x:'Restaura desde Git; Internet vuelve en menos de 60 s'},
   {f:'visitante',t:'snow',x:'Caso 1: el usuario abre un ticket en ServiceNow ("Solicitar acceso de red": uno o varios orígenes, destino, uno o varios puertos o un rango, motivo y, si es temporal, "Vigente hasta")'},
   {f:'snow',t:'eda',x:'Caso 1: el vigía ve el ticket nuevo en menos de 10 s, lo deja En curso y avisa a EDA'},
   {f:'eda',t:'aap',x:'Caso 1: EDA lanza el workflow "Red · Solicitar acceso con aprobación": prepara los comandos sin aplicarlos'},
   {f:'aap',t:'correo',x:'Caso 1: te avisa por correo y espera tu aprobación en AAP (o "Red · Responder solicitud" con motivo)'},
   {f:'aap',t:'fgt',x:'Caso 1: aprobado, crea una regla con todos los puertos en el firewall VyOS y prueba cada puerto desde pc-usuario; si una prueba falla, borra la regla sola y el ticket queda "Fallido y escalado"',more:[['pc','srvapp']]},
   {f:'aap',t:'snow',x:'Caso 1: cierra el mismo ticket en lenguaje simple ("Listo. Habilitamos el acceso…"): Completado, Rechazado (dato inválido o no aprobado, con el motivo), Timeout o Fallido y escalado'},
   {f:'aap',t:'gitea',x:'Caso 1: anota el acceso en el registro accesos/registro.yml; "Revocar acceso de red" (con aprobación) y el retiro diario de vencidos lo quitan del firewall y avisan en el ticket original'},
   {f:'aap',t:'postgres',x:'Caso 1b: un solo ticket (origen «servidores-app») abre la base de datos a los dos JBoss con el firewall del servidor (app → PostgreSQL)',more:[['jboss','postgres']]},
   {f:'isp',t:'eda',x:'Caso 2 · seguridad: un SIEM detecta muchos intentos desde una IP de Internet y avisa a EDA (alerta simulada)'},
   {f:'aap',t:'fgt',x:'Caso 2: bloquea la IP en el firewall en menos de 15 s (grupo «bloqueadas»), sin aprobación'},
   {f:'aap',t:'snow',x:'Caso 2: abre un incidente y avisa por correo; si se resuelve como «Falso positivo», AAP levanta el bloqueo',more:[['aap','correo']]},
   {f:'admin',t:'aap',x:'Firmware: se lanza "Plataforma · Actualizar firmware" (versión de FRR, servidores sí/no, parches críticos o todos)'},
   {f:'aap',t:'snow',x:'Firmware: pre-chequeo del parque y un cambio con una tarea por equipo; espera tu aprobación en AAP (llega el correo)',more:[['aap','correo']]},
   {f:'aap',t:'suc',x:'Firmware · routers: canario suc1 y luego el resto, de a uno: respaldo, FRR 9.1 → 10.2.1 con la misma configuración y post-chequeo de versión, BGP y rutas (también desde el router de borde)',more:[['suc','rtr']]},
   {f:'aap',t:'so',x:'Firmware · servidores: canario nodo-so y luego nodo-nginx: parches de seguridad, reinicio si hace falta y los mismos servicios arriba; la base de paquetes de Git se actualiza por PR',more:[['aap','nginx']]},
   {f:'aap',t:'snow',x:'Firmware: si un equipo falla (imagen «defectuosa»), vuelve a la versión anterior, cancela las tareas que faltan y cierra el cambio sin éxito; si no, lo cierra con la evidencia de cada equipo'},
   {f:'aap',t:'sw',x:'Siguiente paso: firmware de los switches Arista (falta la segunda versión de cEOS) y del firewall VyOS'}]},
 {id:'d5',name:'Autorremediación',st:'ok',stx:'Funcionando',
  msg:'Monitoreo con Prometheus: Alertmanager envía cada alerta a EDA (fuente nativa) y AAP corrige solo, con incidente en ServiceNow y correo: la cola de pagos que se acumula, el certificado HTTPS por vencer y los logins fallidos en Keycloak (bloquea la IP en el firewall). Ante una falla, EDA aplica la política de riesgo guardada en Git: lo de riesgo bajo (JBoss detenido, logs llenos) se corrige solo y se valida; lo de riesgo alto (la app responde con error) se diagnostica y espera aprobación en AAP antes de volver a la última versión validada.',
  steps:[
   {f:'jboss',t:'eda',x:'El vigía de nodo-jboss avisa: JBoss detenido, logs llenos o la app con error'},
   {f:'eda',t:'aap',x:'EDA aplica la política de riesgo y lanza la plantilla o el workflow'},
   {f:'gitea',t:'aap',x:'Políticas y playbooks vienen de Git (invoke/operacion: riesgo.yml, logs.yml)'},
   {f:'aap',t:'jboss',x:'Riesgo bajo: reinicia JBoss o limpia los logs y valida, sin aprobación'},
   {f:'admin',t:'aap',x:'Riesgo alto: el workflow muestra el diagnóstico y espera tu aprobación en AAP'},
   {f:'aap',t:'jboss',x:'Aprobado: vuelve a la última versión validada en los dos JBoss, uno a la vez, y valida la app (si se rechaza o vence, no toca producción)',more:[['aap','jboss2']]},
   {f:'prom',t:'eda',x:'Monitoreo: Prometheus detecta la cola de pagos acumulada, el certificado por vencer o logins fallidos; Alertmanager avisa a EDA'},
   {f:'aap',t:'tomcat',x:'Cola de pagos: reactiva el consumidor y espera que la cola baje'},
   {f:'aap',t:'nginx',x:'Certificado: lo renueva por 90 días y recarga Nginx sin corte'},
   {f:'aap',t:'fgt',x:'Logins fallidos en Keycloak: bloquea la IP en el firewall (caso de seguridad de la Demo 4)'},
   {f:'aap',t:'snow',x:'Cada corrección queda como incidente [Demo 5] resuelto en ServiceNow, con correo'},
   {f:'prom',t:'graf',x:'Grafana muestra el antes y el después en el tablero "Summit · Operación"'},
   {f:'prom',t:'eda',x:'Windows: Prometheus ve que el sitio IIS de nodo-windows no responde y avisa a EDA',more:[['prom','win']]},
   {f:'aap',t:'win',x:'Windows: AAP entra por WinRM, levanta IIS, verifica el sitio y deja el incidente [Demo 5 · Windows] resuelto, con correo'}]},
 {id:'d6',name:'Nube GCP',st:'wip',stx:'Construida · falta conectar la cuenta de GCP',
  msg:'La misma AAP gobierna un proyecto de Google Cloud aparte. Un usuario pide una VM por ServiceNow y la recibe aprobada, endurecida y monitoreada; cada semana se reportan los recursos olvidados con su costo; y una regla de firewall abierta a internet se corrige sola. Ansible solo cambia lo que lleva la etiqueta demo=summit-cloud.',
  steps:[
   {f:'visitante',t:'snow',x:'Caso 1: el usuario pide "Solicitar VM en la nube" en ServiceNow (nombre y tamaño S o M)'},
   {f:'snow',t:'eda',x:'El vigía de la nube lo deja En curso y avisa a EDA (webhook :5010)'},
   {f:'eda',t:'aap',x:'EDA lanza "Nube · Solicitar VM con aprobación": valida y muestra el plan sin crear nada',more:[['gitd','aap']]},
   {f:'admin',t:'aap',x:'Aprobación en AAP (Workflow Approvals); si se rechaza o vence, el ticket se cierra como no aprobado'},
   {f:'aap',t:'gcpvm',x:'Crea la VM RHEL 9 en invoke-summit-cloud y la endurece (SSH solo con llave y solo desde AAP, parches de seguridad, firewalld) con node_exporter',more:[['aap','gcpfw'],['vault','aap']]},
   {f:'prom',t:'gcpvm',x:'Prometheus la empieza a medir y aparece en el tablero "Summit · Nube"; también entra al inventario "Nube GCP"',more:[['prom','graf']]},
   {f:'aap',t:'snow',x:'Cierra el ticket en lenguaje simple con la IP; "Dar de baja VM en la nube" la borra (solo si tiene la etiqueta de la demo)'},
   {f:'aap',t:'gcpres',x:'Caso 2 (lunes 08:00): lee discos sin usar, IPs sin uso, snapshots viejos y VMs encendidas fuera de horario, con costo mensual estimado'},
   {f:'aap',t:'correo',x:'Caso 2: incidente en ServiceNow y correo; tras la aprobación limpia solo lo etiquetado (las VMs se apagan, no se borran)',more:[['aap','snow']]},
   {f:'aap',t:'gcpfw',x:'Caso 3 (cada 10 min): una regla summit-cloud-* con 0.0.0.0/0 en 22 o 3389 se restringe a los rangos aprobados en Git; las ajenas solo se informan, con incidente y correo',more:[['aap','correo']]}]},
{id:'d7',name:'Data center e IGA',st:'wip',stx:'En construcción · Active Directory listo; IdM, Directory Server, midPoint y Keycloak en instalación',
  msg:'Un parque como el de un cliente, definido como código en un inventario único. midPoint gobierna las identidades: RRHH da de alta, cambia de área o da de baja a una persona y midPoint lo propaga solo a Active Directory, Red Hat IdM y Directory Server; Keycloak lo refleja al instante en el login.',
  steps:[
   {f:'admin',t:'aap',x:'El parque nace del inventario único (dc1.yml): zonas de red (gestión, servidores, DMZ, usuarios) y equipos; AAP lo usa como inventario "Data center 1"',more:[['gitd','aap']]},
   {f:'aap',t:'ad',x:'Active Directory: bosque corp.invoke.lab con DNS, CA empresarial (LDAPS), OUs y grupos por área'},
   {f:'aap',t:'idm',x:'Red Hat IdM: dominio linux.invoke.lab con DNS integrado, Kerberos y sudo para el grupo admins-linux'},
   {f:'aap',t:'ds',x:'Directory Server (389 DS): directorio LDAP de aplicaciones con personas y grupos'},

   {f:'aap',t:'sso',x:'Keycloak (realm invoke) federado al Directory Server en solo lectura',more:[['sso','ds']]},
   {f:'rrhh',t:'iga',x:'Alta: RRHH agrega una persona a la planilla; midPoint la reconcilia en menos de un minuto'},
   {f:'iga',t:'ad',x:'midPoint crea la cuenta en AD y en el directorio con su clave y los grupos de su rol ("Empleado" + "Área …")',more:[['iga','ds']]},
   {f:'iga',t:'idm',x:'Solo el personal de TI recibe cuenta Linux en IdM con Kerberos y sudo (admins-linux)'},
   {f:'visitante',t:'sso',x:'La persona entra al portal de Keycloak con su usuario y ve sus grupos; Keycloak valida contra el directorio',more:[['sso','ds']]},
   {f:'rrhh',t:'iga',x:'Cambio de área: midPoint quita los grupos del área anterior y agrega los nuevos en todos los directorios',more:[['iga','ad'],['iga','ds']]},
   {f:'rrhh',t:'iga',x:'Baja: midPoint desactiva la cuenta en AD, IdM y el directorio; el login en Keycloak deja de funcionar',more:[['iga','ad'],['iga','idm'],['iga','ds']]}]},

/* Fichas de detalle por componente: que = qué es; spec = ficha técnica; faq = preguntas frecuentes del público */
const INFO={
 rrhh:{que:'Fuente autoritativa de personas: una planilla de RRHH (CSV) con id, usuario, nombre, área, cargo y estado. Lo que cambia aquí es lo que midPoint propaga.',spec:[['Archivo','dc1-iga01 · /var/lib/midpoint/var/rrhh/personas.csv'],['Lectura','Reconciliación cada minuto'],['Áreas','TI, Finanzas, Ventas, RRHH']],faq:[['¿Y si el cliente usa SAP o Buk?','midPoint tiene conectores para bases de datos, REST y sistemas de RRHH: se cambia la fuente, el resto queda igual.']]},
 iga:{que:'midPoint (Evolveum) es el gobierno de identidades: decide quién debe tener qué acceso según su rol y lo aplica en cada directorio, con auditoría de cada cambio.',spec:[['Equipo','dc1-iga01 · 10.101.20.13'],['Versión','midPoint 4.9 + PostgreSQL 16 (contenedores)'],['Roles','Empleado (derecho de nacimiento) y Área TI, Finanzas, Ventas, RRHH'],['Destinos','Active Directory (LDAPS), Directory Server y Red Hat IdM (LDAP)']],faq:[['¿Por qué no basta con Keycloak?','Keycloak autentica (SSO); midPoint gobierna el ciclo de vida: altas, cambios, bajas, roles y certificaciones.']]},
 ad:{que:'Active Directory del data center para el mundo Windows: cuentas, grupos y DNS de corp.invoke.lab.',spec:[['Equipo','dc1-ad01 · 10.101.20.10 · Windows Server 2022'],['Dominio','corp.invoke.lab (INVOKE)'],['CA','Invoke Lab CA (habilita LDAPS 636)'],['OUs','Invoke › Personas, Grupos, Servicios']],faq:[['¿Quién crea las cuentas?','midPoint, con la cuenta de servicio svc-midpoint delegada solo sobre OU=Invoke.']]},
 ds:{que:'Directory Server (389 DS, el motor de Red Hat Directory Server): el directorio LDAP de las aplicaciones. Keycloak lee de aquí.',spec:[['Equipo','dc1-ds01 · 10.101.20.12'],['Sufijo','dc=invoke,dc=lab'],['Ramas','ou=personas, ou=grupos, ou=servicios']],faq:[]},
 idm:{que:'Red Hat Identity Management para los servidores Linux: usuarios con Kerberos, DNS y reglas de sudo centralizadas.',spec:[['Equipo','dc1-idm01 · 10.101.20.11'],['Dominio','linux.invoke.lab (realm LINUX.INVOKE.LAB)'],['Grupo','admins-linux con sudo en todos los servidores']],faq:[['¿Por qué IdM y AD separados?','Es lo habitual en un cliente: AD para Windows y usuarios, IdM para Linux. midPoint mantiene a la misma persona coherente en ambos.']]},
 sso:{que:'Keycloak del data center: login único para las aplicaciones, federado al Directory Server. Una baja en midPoint corta el acceso aquí.',spec:[['Equipo','dc1-sso01 · 10.101.20.14'],['Realm','invoke · federación LDAP de solo lectura'],['Grupos','Se leen del directorio (ou=grupos)']],faq:[]},
 gcpvm:{que:'Servidores RHEL 9 que AAP crea en el proyecto invoke-summit-cloud cuando alguien los pide en ServiceNow. Nacen endurecidos y monitoreados, con la etiqueta demo=summit-cloud, y se borran con el ticket de baja.',spec:[['Proyecto','invoke-summit-cloud · southamerica-west1-a'],['Tamaños','S: e2-small (2 GB) · M: e2-medium (4 GB) · disco 20 GB'],['Acceso','SSH (llave en Vault secret/nube/ssh) y métricas :9100 solo desde 34.176.42.56/32'],['Inventario AAP','Nube GCP (gcp_compute, filtro labels.demo=summit-cloud)'],['Plantillas','Nube · Solicitar VM con aprobación · Nube · Dar de baja VM']],faq:[['¿Y si alguien pide un nombre raro o un tamaño que no existe?','El playbook lo valida antes de tocar nada y cierra el ticket explicando el motivo.'],['¿Por qué AAP y no Terraform?','Pueden convivir: aquí el valor está en el flujo completo (ticket, aprobación, endurecimiento, monitoreo y cierre), no solo en crear la máquina.']]},
 gcpfw:{que:'Reglas de firewall de la red del proyecto. Cada 10 minutos AAP busca reglas abiertas a todo internet en puertos sensibles (22 SSH, 3389 RDP).',spec:[['Corrige','Solo reglas summit-cloud-*: las restringe a los rangos aprobados en Git (datos/firewall-aprobados.yml)'],['Informa','Reglas ajenas: incidente y correo, sin tocarlas'],['Plantilla','Nube · Vigilar firewall (programada)'],['Prueba','Nube · Prueba: regla peligrosa']],faq:[['¿Por qué no corrige todas?','Porque la demo comparte proyecto con otros recursos: la automatización solo cambia lo que le pertenece. En producción el alcance lo define la política.']]},
 gcpres:{que:'Recursos que siguen costando aunque nadie los use: discos sin adjuntar, IPs reservadas sin uso, snapshots de más de 30 días y VMs encendidas fuera de horario.',spec:[['Reporte','Lunes 08:00 · incidente en ServiceNow y correo, con costo mensual estimado (datos/precios.yml)'],['Limpieza','Después de la aprobación y solo lo etiquetado demo=summit-cloud; las VMs se apagan, no se borran'],['Plantilla','Nube · Reporte de huérfanos con limpieza'],['Prueba','Nube · Prueba: crear huérfanos']],faq:[['¿Los precios son exactos?','Son estimaciones de lista para mostrar el orden de magnitud; la factura real está en Facturación de GCP, donde además hay un presupuesto con alerta.']]},
 prom:{que:'Monitoreo de todo el ecosistema: un sondeo (blackbox) por componente de cada demo, el estado de las activaciones de EDA, el laboratorio de red (contenedores, BGP, firewall) y Tekton (estado_ecosistema.py), y los vigías vía systemd; alerta ComponenteCaido si algo cae 2 min. Además Prometheus mide cada máquina del laboratorio (estado, CPU, memoria, disco), la cola de pagos de Artemis, el certificado HTTPS de Nginx y el sitio IIS de Windows; Alertmanager envía cada alerta a Event-Driven Ansible con la fuente nativa ansible.eda.alertmanager. Es lo que en un cliente sería su monitoreo (Prometheus, Dynatrace, Zabbix).',

 graf:{que:'Tres tableros. "Summit · Ecosistema" (página de inicio): una tarjeta verde/roja por componente de todas las demos, agrupadas por demo (AAP, EDA y sus activaciones, Gitea, Vault, Tekton, ServiceNow, panel de drift, app, JBoss ×2, PostgreSQL, Keycloak, Artemis, Valkey, laboratorio de red con BGP, firewall y DNS, Windows, vigías). "Summit · Operación" (cola de pagos, vigencia del certificado y alertas activas, en vivo: se ve subir el problema y cómo Ansible lo corrige) y "Summit · Servidores" (una fila por máquina: arriba/caída, CPU, memoria, disco y tiempo encendido).',

 visitante:{que:'Una persona del público que prueba la Demo 1 en vivo. Recibe una cuenta temporal en los cinco nodos y entra por ssh desde la sesión del administrador.',

  faq:[['¿Cómo se crea la cuenta tan rápido?','El panel llama a la API de AAP, que lanza un job que crea el usuario en los cinco nodos en paralelo.'],['¿Qué demuestra?','Que aunque alguien cambie un servidor a mano, la automatización detecta la diferencia con Git y la revierte.']]},
 dev:{que:'Rol del desarrollador. Solo hace commit en Gitea; todo lo demás (compilar, escanear, preparar plataforma, desplegar) ocurre automáticamente.',

 auditor:{que:'Usuario de solo lectura en AAP, en la organización "Despliegues CI/CD". Ve qué se desplegó, quién lo pidió, cuándo y con qué resultado, sin poder ejecutar nada.',

  faq:[['¿Puede ver otras tareas de AAP?','No. La organización separa los despliegues del resto de la automatización, como un namespace.'],['¿Ve las claves?','No. Ve que se usó una credencial, nunca su valor.']]},
 admin:{que:'Cristian como operador del stand: crea visitantes desde el panel y recibe las alertas de drift.',spec:[['Herramientas','Panel de drift · AAP · correo']],faq:[]},
 snow:{que:'ITSM del cliente. En la Demo 4 el usuario pide un acceso de red con un ticket común del catálogo ("Solicitar acceso de red") y Ansible lo atiende y lo cierra solo. En la Demo 3 cada ejecución de Ansible abre un cambio estándar (preaprobado) y una tarea por cada operación real; cada tarea se cierra sola con la duración real, el enlace al job de AAP y el tiempo que tomaría por ticket manual. Nadie llena tickets: los robots dejan la auditoría.',
  spec:[['Instancia','https://dev459364.service-now.com (desarrollo, se duerme sin uso)'],['Usuario técnico','ansible.automatizacion · grupo Automatización Ansible'],['Clave','en Vault secret/servicenow (AAP la lee con la credencial ServiceNow · ansible.automatizacion)'],['Registro','change_request estándar + change_task por operación'],['Campos propios','u_tipo_tarea · u_duracion_real_s · u_tiempo_manual_estimado · u_job_aap'],['Alternativa','ServiceDesk Plus en la VM']],
  faq:[['¿Y si el cliente no tiene ServiceNow?','El mismo flujo funciona con ServiceDesk Plus, Jira u otro ITSM con API; solo cambia el módulo de conexión.'],['¿Puede ServiceNow aprobar antes de ejecutar?','Sí. Ansible abre el cambio y espera; al aprobarse, ServiceNow avisa y recién ahí se ejecuta.']]},
 correo:{que:'Las alertas de drift llegan al correo del administrador.',spec:[['Envío','relay SMTP de Google'],['Destino','cquezada@invoke.cl']],faq:[['¿Se puede enviar a Teams o Slack?','Sí, AAP tiene notificaciones nativas para Slack, Teams, webhook y correo.']]},

  faq:[['¿Funciona con GitHub o GitLab?','Sí. El flujo es el mismo: un webhook al hacer push. Gitea se usó porque corre dentro de la VM.'],['¿Dónde queda el binario compilado?','En el registro de paquetes de Gitea, versionado por commit; AAP lo descarga desde ahí.']]},
 gitd:{que:'Repositorio privado en Gitea con todos los playbooks que ejecuta AAP (drift, estado, despliegue JBoss y plataforma) y el estado deseado de los servidores. AAP lo lee con un usuario de solo lectura; los cambios entran por commit y quedan con su historial.',

  faq:[['¿Por qué hay dos repositorios?','Uno es de la aplicación (lo maneja desarrollo, en Gitea) y otro es de la automatización (lo maneja operaciones, en AAP). Separa responsabilidades.']]},
 tekton:{que:'Pipeline de integración continua sobre Kubernetes (k3s). Clona, lee secretos de Vault, compila, escanea vulnerabilidades, publica el WAR, prepara la plataforma y pide el despliegue a AAP.',
  spec:[['Plataforma','k3s v1.36 dentro de la VM (~760 MB)'],['Versiones','Pipelines v1.6.0 · Triggers v0.34.0 · Dashboard v0.63.1'],['Dashboard','http://34.176.42.56:30097'],['Disparo','EventListener · webhook de Gitea'],['Escaneo','Trivy sobre el WAR']],
  faq:[['¿Por qué Tekton y no Jenkins?','Tekton es nativo de Kubernetes y es la base de OpenShift Pipelines, la oferta de Red Hat para CI.'],['¿Qué pasa si hay una vulnerabilidad crítica?','El pipeline se detiene antes de publicar. En la demo se muestra con Log4j.'],['¿Por qué k3s y no OpenShift?','Por tamaño dentro de la VM. En un cliente correría en OpenShift Pipelines con los mismos manifiestos.']]},
 aap:{que:'Red Hat Ansible Automation Platform. Ejecuta toda la automatización con control de acceso, credenciales protegidas y registro completo de quién hizo qué.',
  spec:[['Versión','AAP 2.7 · controller 4.8.11 · en contenedores'],['Componentes','gateway · controller · EDA · Automation Hub · PostgreSQL 15'],['Memoria','~25 GB (el componente más pesado)'],['URL','https://34.176.42.56'],['Organizaciones','Default · Despliegues CI/CD'],['Credenciales','desde Vault en tiempo de ejecución']],
  faq:[['¿Por qué AAP y no correr Ansible desde el pipeline?','AAP agrega control de acceso, credenciales que nadie ve, auditoría y una API para que Tekton, el panel o el ITSM pidan ejecuciones.'],['¿Dónde veo quién lanzó un despliegue?','En el job: etiqueta solicitado:usuario y la primera tarea de la salida.'],['¿Cómo separo lo de despliegues del resto?','Con organizaciones y roles; el auditor solo ve la organización de despliegues.']]},

 eda:{que:'Event-Driven Ansible: escucha eventos (alertas, webhooks, ITSM) y decide con reglas qué automatización lanzar. Viene instalado con AAP y tiene dos activaciones: drift de red (Demo 4) y remediación de JBoss (Demo 5).',
  spec:[['Estado','instalado con AAP 2.7'],['Activaciones','Red · Drift por eventos (:5000) · Remediación · Eventos de JBoss (:5001)'],['Memoria','~5 GB'],['Rulebooks','invoke/red-laboratorio · invoke/operacion']],
  faq:[['¿Reemplaza al monitoreo?','No. Recibe las alertas del monitoreo y responde con la acción correcta, o abre el incidente si no sabe cómo.']]},
 panel:{que:'Aplicación web propia del stand para la Demo 1. Parte solo con RHEL; permite agregar o quitar servidores eligiendo nivel de control (corregir, alertar o solo registrar) y accesos, y crea visitantes en segundos. Gestiona los seis RHEL (incluido nodo-jboss2) y nodo-windows (servicios críticos y grupo Administradores). Vigila sshd_config completo, sudo, la ruta controlada /opt/apps y /home (solo registro, nunca se corrige), y cada aviso muestra los comandos recientes de quien hizo el cambio. En "solo registrar" cada cambio queda como commit en Gitea (invoke/estado-servidores) con autor y comando; la base aprobada vive en la rama master de Gitea: "Proponer como base" abre un Pull Request que se aprueba con merge, y "Propagar base" aplica un commit elegido de master a otros RHEL similares, con vista previa (un commit anterior sirve para volver atrás).',
  spec:[['Tecnología','Python · servicio systemd'],['Puerto','9443'],['URL','https://34.176.42.56:9443'],['Certificado','real y gratuito']],
  faq:[['¿Es un producto?','No, es un accesorio de la demo. En un cliente se usaría el portal de autoservicio de AAP o un formulario del ITSM.']]},
 proxy:{que:'Publica hacia afuera la app JBoss y las consolas de Keycloak y Artemis a través de nodo-nginx.',spec:[['Tecnología','systemd-socket-proxyd'],['Puerto','8090 → nodo-nginx'],['Rutas','/app-jboss/ · /auth/ · /console/']],faq:[]},

 postgres:{que:'Base de datos de las aplicaciones. Ansible crea la base, el usuario y aplica los scripts SQL del repositorio en orden y una sola vez.',
  spec:[['IP','192.168.122.13'],['Recursos','1 vCPU · 2 GB · disco 19 GB'],['SO','RHEL 9.8'],['Motor','PostgreSQL 13.23'],['Base demo','pagos'],['Autenticación','scram-sha-256, solo red interna']],

 jboss2:{que:'Segundo JBoss EAP 8, copia de nodo-jboss. No se configura a mano: recibe exactamente la misma configuración desde jboss-config (solo cambia jboss.node.name en nodos/nodo-jboss2.yml) y las mismas versiones de la app.',
  spec:[['IP','192.168.122.18'],['Recursos','2 vCPU · 4 GB'],['SO','RHEL 9.8'],['Producto','JBoss EAP 8.0.12'],['Configuración','jboss-config (comun + nodos/nodo-jboss2.yml)']],faq:[]},
 jboss:{que:'Servidor de aplicaciones donde se despliega app-jboss (uno de dos: Nginx reparte entre nodo-jboss y nodo-jboss2). Su configuración completa (JVM, logging, datasource, conector HTTP, driver JDBC con versión fija) vive en el repo jboss-config: un commit se aplica en ambos, uno a la vez; los cambios manuales se corrigen cada 5 min. El manifiesto (repo ambientes) amarra versión del .war + configuración + base del SO.',
  spec:[['IP','192.168.122.15'],['Recursos','2 vCPU · 4 GB · disco 19 GB'],['SO','RHEL 9.8'],['Producto','JBoss EAP 8.0.12'],['App','/app-jboss/'],['Datasource','java:jboss/datasources/app-jboss · ajuste en jboss-config']],
  faq:[['¿Qué pasa si el despliegue falla?','La validación revisa la versión en /salud; si no responde bien, se restaura la versión anterior automáticamente.'],['¿Cómo cambio el pool de conexiones?','Editas pool_max en plataforma.yml y haces commit. El pipeline lanza AAP, que compara lo pedido con JBoss, cambia solo ese atributo y lo muestra en la salida del job (por ejemplo "pool máximo 20 → 25").']]},
 win:{que:'Servidor Windows del laboratorio, administrado por Ansible sin agente (WinRM). En la Demo 1 está bajo gestión del panel: servicios críticos (W3SVC, W32Time) y miembros de Administradores contra la base de Git, con un vigía en PowerShell (tarea programada). En la Demo 5, si el sitio IIS se cae, Prometheus avisa y AAP lo levanta solo.',spec:[['IP','192.168.122.17'],['Recursos','2 vCPU · 4 GB · disco 40 GB'],['SO','Windows Server 2022 Standard (evaluación, 180 días)'],['Servicio','IIS (W3SVC) · página de la app en :80'],['Acceso de Ansible','WinRM 5985 · NTLM · usuario ansible (clave en Vault secret/windows)'],['Inventario AAP','Servidores Windows (org. Operación)'],['Demo 1 (drift)','Plantilla «Drift · Windows» · base master:nodo-windows/windows.yml · vigía C:\\ProgramData\\SummitDrift']],faq:[['¿Hay que instalar un agente en Windows?','No. Ansible usa WinRM, que viene en Windows; solo se habilita y se da una cuenta de servicio.'],['¿Qué más se puede automatizar?','Parches, servicios, usuarios y grupos, IIS, registro, roles y características, y Active Directory.']]},
 sdp:{que:'ITSM alternativo dentro de la VM, para clientes que no usan ServiceNow.',spec:[['IP prevista','192.168.122.16'],['Producto','ManageEngine ServiceDesk Plus'],['Integración','API REST']],faq:[]},
 rtr:{que:'Router de borde del laboratorio. Su configuración vive en Git; un vigía avisa a EDA si alguien la cambia a mano. Caso OpenShift: un ticket «Preparar red para clúster OpenShift» asigna un /24 de 10.60.0.0/16, lo declara en Git (ruta + anuncio BGP), abre 6443/22623/80/443 en el firewall y crea api, api-int y *.apps en el DNS del laboratorio.',
  spec:[['Imagen','FRRouting 10.2 · contenedor con SSH'],['Gestión','172.20.20.11'],['BGP','AS 65010 · vecinos ISP y sucursales suc1-3'],['Consumo','~36 MB']],
  faq:[['¿Funciona con Cisco o Juniper?','Sí. Ansible tiene colecciones certificadas para Cisco, Juniper, Arista y otros; FRR se usa porque corre liviano dentro de la VM.'],['¿Cómo se entera EDA del cambio?','El router envía un evento a EDA; en equipos reales sería syslog, SNMP o telemetría.'],['¿Qué pasa si el cambio manual era necesario?','Se registra como cambio de emergencia y se lleva a Git; si no, la automatización lo revierte.']]},
 suc:{que:'Tres routers de sucursal (suc1, suc2, suc3) con BGP hacia el router de borde; cada uno anuncia la red de su sucursal. Su «firmware» es la versión de FRR: la demo los lleva de 9.1 a 10.2.1 cambiando la imagen del contenedor y conservando la configuración, con un cambio en ServiceNow, aprobación en AAP, canario y post-chequeo. La imagen «10.2.1 defectuosa» (sin BGP) muestra la vuelta atrás automática.',
  spec:[['Imagen base','FRRouting 9.1.0 (quay.io/frrouting/frr)'],['Actualización','10.2.1 · o «defectuosa» para la demo de falla'],['Gestión','172.20.20.41 · .42 · .43'],['BGP','AS 65101-65103 · vecino rtr (AS 65010) · anuncian 10.30.N.0/24'],['Operación','AAP con el usuario aap-lab (sudo solo para lab-sucursal)'],['Consumo','~21 MB cada uno']],
  faq:[['¿Y con equipos reales?','Se usan las colecciones del fabricante (cisco.ios, junipernetworks.junos, arista.eos) para subir la imagen, validar el hash, reiniciar y comprobar; el flujo de cambio, canario y vuelta atrás es el mismo.'],['¿Por qué no se actualiza todo de una vez?','El canario prueba la versión nueva en un solo equipo; si falla, el resto ni se toca.'],['¿Qué se compara antes y después?','Versión, estado BGP y cantidad de rutas en el router y, desde el borde, que llegue la red de la sucursal. En servidores: kernel y servicios en ejecución.']]},
 isp:{que:'Proveedor de Internet simulado. Anuncia rutas por BGP al router de borde.',spec:[['Imagen','FRRouting 10.2'],['Gestión','172.20.20.10'],['Anuncia','203.0.113.0/24']],faq:[]},
 srvapp:{que:'Servidor de prueba que responde HTTP; sirve para comprobar el tráfico antes y después de un cambio.',spec:[['Imagen','python:3.12-alpine'],['Gestión','172.20.20.21'],['Servicio','HTTP :8080']],faq:[]},

const CH={A:220,B:645,C:855,G:855,H:890};

const el=(n,a={},p)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e};
const gap=n=>n.y-50;

function route(a,b){
  if(a.g===b.g&&a.g!=='top'){
    if(a.x===b.x&&Math.abs(a.y-b.y)===130){const s=Math.sign(b.y-a.y);return[[a.x,a.y+s*H],[b.x,b.y-s*H]]}
    if(a.y===b.y&&Math.abs(a.x-b.x)===200){const s=Math.sign(b.x-a.x);return[[a.x+s*W,a.y],[b.x-s*W,b.y]]}
  }
  if(a.g==='top'){const c=CH[b.g];return[[a.x,a.y+30],[a.x,TOPY],[c,TOPY],[c,gap(b)],[b.x,gap(b)],[b.x,b.y-H]]}
  if(b.g==='top'){const c=CH[a.g];return[[a.x,a.y-H],[a.x,gap(a)],[c,gap(a)],[c,TOPY],[b.x,TOPY],[b.x,b.y+30]]}
  const c=a.g===b.g?CH[a.g]:(a.g==='A'||b.g==='A')?425:855;
  return[[a.x,a.y-H],[a.x,gap(a)],[c,gap(a)],[c,gap(b)],[b.x,gap(b)],[b.x,b.y-H]];
}

let current='all';
function render(){
  gEdges.textContent='';gBadges.textContent='';
  const d=DEMOS.find(x=>x.id===current);
  for(const id in nodeEls){
    nodeEls[id].classList.toggle('dim',!!d&&!(uses[id]&&uses[id].has(current)));
    nodeEls[id].querySelector('.dots').style.display=d?'none':'';
  }
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.id===current));
  if(!d){renderOverview();return}
  const seen={};
  d.steps.forEach((s,i)=>{
    const pairs=[[s.f,s.t],...(s.more||[])];
    pairs.forEach(([a,b],j)=>{
      const p=route(NODES[a],NODES[b]);
      const line=el('polyline',{points:pts(p),class:'edge '+(s.planned?'planned':'live'),'data-step':i,style:`stroke:var(--${d.id})`,'marker-end':`url(#m-${d.id})`},gEdges);
      if(j===0){
        const key=[a,b].sort().join('|');seen[key]=(seen[key]||0)+1;
        const len=line.getTotalLength(),t=Math.min(.5+.2*(seen[key]-1),.88),pt=line.getPointAtLength(len*t);
        const bg=el('g',{class:'badge','data-step':i},gBadges);
        el('circle',{cx:pt.x,cy:pt.y,r:10,style:`fill:var(--${d.id})`},bg);
        el('text',{x:pt.x,y:pt.y+.5},bg).textContent=i+1;
      }
    });
  });
  renderDemo(d);
}

}

/* SSH por llave: operador con una llave por nodo (en la VM) */
const SSHN={nginx:'nodo-nginx',so:'nodo-so',postgres:'nodo-postgres',tomcat:'nodo-tomcat',jboss:'nodo-jboss',jboss2:'nodo-jboss2'};
const sshHtml=id=>{const n=SSHN[id];if(!n)return '';const filas=[[`ssh op-${n}`,'Dentro de la VM (Cloud Shell o SSH en el navegador) · usuario operador, con sudo, solo llave'],[`gcloud compute ssh demo-ansible-summit --zone southamerica-west1-a -- -t ssh op-${n}`,'Directo desde Cloud Shell, en un paso'],[`ssh -i ~/.ssh/visitantes/<usuario> <usuario>@${n}`,'Visitante: el panel le muestra su comando con su usuario y llave']];
 return `<h3>SSH (sin contraseña)</h3><div class="sshb">${filas.map(([c,u])=>`<div class="sshr"><code>${esc(c)}</code><button type="button" class="cp">Copiar</button><span class="u">${esc(u)}</span></div>`).join('')}</div>`};
const val=v=>/^https?:\/\//.test(v)?`<a href="${esc(v)}" target="_blank" rel="noopener">${esc(v)}</a>`:esc(v);
function showNode(id){
  const n=NODES[id]||{lbl:'VM anfitriona'},f=INFO[id]||{};
  selNode(id);
  const zona={top:'Personas y servicios externos',A:'Automatización · host de la VM',B:'Nodo KVM anidado',C:'Laboratorio de red · containerlab'}[n.g]||'Infraestructura base';
  const st=n.planned?'<span class="chip plan">Por construir</span>':'<span class="chip ok">Funcionando</span>';
  const ds=[...(uses[id]||[])].sort().map(d=>{const D=DEMOS.find(x=>x.id===d);return `<button data-d="${d}"><span class="dot" style="background:var(--${d})"></span>${d.slice(1)} · ${D.name}</button>`}).join('');
  const spec=(f.spec||[]).map(([k,v])=>`<dt>${esc(k)}</dt><dd>${val(v)}</dd>`).join('');
  const faq=(f.faq||[]).map(([q,a])=>`<details><summary>${esc(q)}</summary><p>${esc(a)}</p></details>`).join('');
  detail.innerHTML=`<div class="col"><div><button class="back" id="back">← Volver</button>
    <div><span class="eyebrow">${zona}</span></div><h2>${esc(n.lbl)}</h2><p>${st}</p>
    ${(LINKS[id]||[]).length?`<h3>Accesos</h3><div class="links">${LINKS[id].map(([t,u,x])=>/^https?:/.test(u)?`<div class="lk"><a href="${esc(u)}" target="_blank" rel="noopener">${esc(t)}</a><span class="go">abrir ↗</span>${x?`<span class="u">${esc(x)}</span>`:''}</div>`:`<div class="lk sshr"><b>${esc(t)}</b> <code>${esc(u)}</code><button type="button" class="cp">Copiar</button>${x?`<span class="u">${esc(x)}</span>`:''}</div>`).join('')}</div>`:''}
    ${sshHtml(id)}
    <p>${esc(f.que||'')}</p>
    ${ds?`<h3>Demos que lo usan</h3><div class="uses">${ds}</div>`:''}</div>
    ${spec?`<div><h3>Ficha técnica</h3><dl class="spec">${spec}</dl></div>`:''}</div>
    <div class="col">${faq?`<h3>Preguntas que te pueden hacer</h3><div class="faq">${faq}</div>`:''}
    ${f.nota?`<p class="hint">${esc(f.nota)}</p>`:''}</div>
    ${f.tabla?`<div class="inst"><h3 style="margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)">Instancias dentro de la VM</h3><div class="tw"><table><thead><tr><th>Instancia</th><th>Tipo</th><th>CPU</th><th>Memoria</th><th>Disco</th><th>Dirección</th><th>Función</th></tr></thead><tbody>${f.tabla.map(r=>r.length===1?`<tr class="grp"><td colspan="7">${esc(r[0])}</td></tr>`:`<tr ${r[7]?`data-n="${r[7]}"`:''}><td><b>${esc(r[0])}</b></td><td>${esc(r[1])}</td><td class="m">${esc(r[2])}</td><td class="m">${esc(r[3])}</td><td class="m">${esc(r[4])}</td><td class="m">${esc(r[5])}</td><td>${esc(r[6])}</td></tr>`).join('')}</tbody></table></div><p class="hint">Toca una fila para abrir su ficha. Memoria de contenedores: consumo medido; de nodos KVM: asignada.</p></div>`:''}`;
  detail.querySelectorAll('.inst tr[data-n]').forEach(tr=>tr.addEventListener('click',()=>showNode(tr.dataset.n)));
  document.getElementById('back').addEventListener('click',()=>{selNode(null);render()});
  detail.querySelectorAll('.uses button').forEach(b=>b.addEventListener('click',()=>select(b.dataset.d)));
  detail.querySelectorAll('.sshr .cp').forEach(b=>b.addEventListener('click',()=>{const c=b.parentNode.querySelector('code');const sel=()=>{const r=document.createRange();r.selectNodeContents(c);const s=getSelection();s.removeAllRanges();s.addRange(r)};
    try{navigator.clipboard.writeText(c.textContent).then(()=>{b.textContent='Copiado';setTimeout(()=>b.textContent='Copiar',1500)},sel)}catch(e){sel()}}));
  detail.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});
}

const tabs=document.getElementById('tabs');
tabs.innerHTML=`<button data-id="all">Ecosistema completo</button>`+DEMOS.map(d=>`<button data-id="${d.id}"><span class="dot" style="background:var(--${d.id})"></span>${d.id.slice(1)} · ${d.name}</button>`).join('');
tabs.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>select(b.dataset.id)));
const h=(location.hash||'').slice(1);
current=DEMOS.some(d=>d.id===h)?h:'all';
render();
</script>
