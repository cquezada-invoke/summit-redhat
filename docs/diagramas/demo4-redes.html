<style>
/* Layout: plano de red a todo ancho; pestañas Topología / Caso 1 / Caso 2; detalle debajo */
:root{
  --bg:#f2f4f5; --panel:#ffffff; --node:#ffffff; --ink:#16202a; --muted:#5a6773;
  --line:#c3ccd4; --frame:#8796a3; --band:#e2e7eb; --soft:#e9edf0; --wire:#6f7f8c;
  --c1:#7346bd; --c2:#0e8a8c; --data:#b96e00;
  --ok:#1f7a45; --okbg:#e2f3e8; --plan:#55626e; --planbg:#e7ebee;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e141a; --panel:#141c24; --node:#18222b; --ink:#e4eaef; --muted:#93a1ad;
  --line:#33404c; --frame:#5c6b78; --band:#1b252e; --soft:#1d2731; --wire:#8394a2;
  --c1:#b08bff; --c2:#3cc2be; --data:#f0a43a;
  --ok:#6fd39a; --okbg:#173326; --plan:#a3b0bb; --planbg:#222d37; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e141a; --panel:#141c24; --node:#18222b; --ink:#e4eaef; --muted:#93a1ad;
  --line:#33404c; --frame:#5c6b78; --band:#1b252e; --soft:#1d2731; --wire:#8394a2;
  --c1:#b08bff; --c2:#3cc2be; --data:#f0a43a;
  --ok:#6fd39a; --okbg:#173326; --plan:#a3b0bb; --planbg:#222d37; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
.wrap{max-width:1360px;margin:0 auto;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:20px}
header{display:grid;gap:6px}
.eyebrow{font:500 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{margin:0;font-size:clamp(24px,3vw,32px);font-weight:700;letter-spacing:-.01em;text-wrap:balance}
header p{margin:0;color:var(--muted);max-width:72ch}
nav{display:flex;flex-wrap:wrap;gap:8px}
nav button{font:500 14px/1 var(--sans);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:9px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
nav button .dot{width:10px;height:10px;border-radius:50%}
nav button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
nav button:focus-visible{outline:2px solid var(--c1);outline-offset:2px}
.diagram{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow-x:auto}
.diagram svg{display:block;width:100%;min-width:980px;height:auto}
.detail{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:28px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px}
@media (max-width:820px){.detail{grid-template-columns:1fr}}
.detail h2{margin:0 0 6px;font-size:20px;text-wrap:balance}
.detail h3{margin:0 0 8px;font-size:14px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.detail p{margin:0 0 10px;max-width:62ch}
.chip{display:inline-block;font:500 12px/1 var(--mono);padding:5px 8px;border-radius:5px}
.chip.plan{color:var(--plan);background:var(--planbg)}
ol.steps{list-style:none;margin:0;padding:0;display:grid;gap:4px}
ol.steps li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;align-items:start;padding:7px 8px;border-radius:6px}
ol.steps li:hover{background:var(--soft)}
ol.steps .n{width:22px;height:22px;border-radius:50%;color:#fff;font:600 12px/22px var(--mono);text-align:center}
ol.plain{margin:0;padding-left:20px;display:grid;gap:6px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
td.m{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.note{font-size:13px;color:var(--muted)}
.stack{display:grid;gap:18px;min-width:0}
/* SVG */
.frame-vm{fill:none;stroke:var(--frame);stroke-width:1.5}
.frame-sub{fill:var(--soft);stroke:var(--line);stroke-dasharray:5 4}
.band{fill:var(--band)}
.t-head{font:600 12px var(--sans);fill:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.t-band{font:500 11px var(--mono);fill:var(--muted)}
.t-vm{font:600 13px var(--mono);fill:var(--muted)}
.t-link{font:500 10.5px var(--mono);fill:var(--muted)}
.bus{stroke:var(--wire);stroke-width:2;stroke-dasharray:2 4;fill:none}
.wire{stroke:var(--wire);stroke-width:2.6;fill:none}
.node rect{fill:var(--node);stroke:var(--line);stroke-width:1.2}
.node.planned rect{stroke-dasharray:4 3;stroke:var(--frame)}
.node .lbl{font:600 13px var(--sans);fill:var(--ink)}
.node .sub{font:400 10.5px var(--sans);fill:var(--muted)}
.node use{color:var(--ink)}
.node{transition:opacity .25s}
.dim{opacity:.25}
.edge{fill:none;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:7 5;animation:flow 1.2s linear infinite;transition:opacity .2s,stroke-width .2s}
.edge.data{stroke-width:4;stroke-dasharray:2 7}
.edge.faded{opacity:.12}
.edge.hot{stroke-width:3.6}
@keyframes flow{to{stroke-dashoffset:-24}}
@media (prefers-reduced-motion:reduce){.edge{animation:none}}
.badge circle{stroke:var(--panel);stroke-width:2}
.badge text{font:600 11px var(--mono);fill:#fff;text-anchor:middle;dominant-baseline:central}
.badge{transition:opacity .2s}
</style>

<div class="wrap">
  <header>
    <span class="eyebrow">Red Hat Summit · Demo 4 · en definición</span>
    <h1>Demo 4 Redes Emuladas</h1>
    <p>Un laboratorio de red emulado con containerlab, dentro de la misma VM, gestionado por la misma AAP. Dos casos: una regla de firewall pedida por la app y la configuración de red como código con detección de cambios manuales.</p>
  </header>
  <nav id="tabs" aria-label="Vistas"></nav>
  <div class="diagram"><svg id="svg" viewBox="0 0 1300 780" role="img" aria-label="Topología del laboratorio de red y flujos de la demo 4"></svg></div>
  <section class="detail" id="detail" aria-live="polite"></section>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>

  </defs>
</svg>

<script>
const N={
  dev:{x:180,y:70,lbl:'Desarrollador',sub:'commit en Gitea',ic:'person'},
  visitante:{x:420,y:70,lbl:'Visitante',sub:'ssh al switch',ic:'person'},
  snow:{x:1000,y:70,w:210,lbl:'ITSM',sub:'ServiceNow o ServiceDesk Plus',ic:'ticket',planned:true},
  gitea:{x:180,y:250,lbl:'Gitea',sub:'topología y configs',ic:'git'},
  aap:{x:180,y:370,lbl:'AAP 2.7',sub:'colecciones Arista, Fortinet',ic:'auto'},
  eda:{x:180,y:490,lbl:'EDA',sub:'escucha eventos de red',ic:'bolt',planned:true},
  vault:{x:180,y:610,lbl:'Vault',sub:'credenciales de equipos',ic:'key'},
  isp:{x:1120,y:310,lbl:'ISP simulado',sub:'FRR · .10',ic:'cloud',planned:true},
  rtr:{x:820,y:310,lbl:'Router borde',sub:'FRR · BGP · .11',ic:'router',planned:true},
  fgt:{x:820,y:420,lbl:'FortiGate',sub:'VM evaluación · .12',ic:'wall',planned:true},
  core:{x:820,y:530,lbl:'Switch núcleo',sub:'Arista cEOS · .13',ic:'switch',planned:true},
  swa:{x:660,y:640,lbl:'Switch servidores',sub:'cEOS · VLAN 10 · .14',ic:'switch',planned:true},
  swb:{x:980,y:640,lbl:'Switch usuarios',sub:'cEOS · VLAN 20 · .15',ic:'switch',planned:true},
  srv:{x:470,y:640,lbl:'srv-app',sub:'Linux · :8080 · .21',ic:'server',planned:true},
  pc:{x:1170,y:640,lbl:'pc-usuario',sub:'Linux · .22',ic:'laptop',planned:true},
};
const LINKS=[
  {p:[[1040,310],[900,310]],t:'BGP',lx:970,ly:302},
  {p:[[820,340],[820,390]],t:'WAN',lx:828,ly:369},
  {p:[[820,450],[820,500]],t:'LAN',lx:828,ly:479},
  {p:[[740,530],[660,530],[660,610]],t:'trunk VLAN 10',lx:604,ly:522},
  {p:[[900,530],[980,530],[980,610]],t:'trunk VLAN 20',lx:930,ly:522},
  {p:[[580,640],[550,640]],t:'',lx:0,ly:0},
  {p:[[1060,640],[1090,640]],t:'',lx:0,ly:0},
];
const MG=[[260,370],[345,370],[345,225]];
const VIEWS=[
 {id:'topo',name:'Topología y emulador'},
 {id:'c1',name:'Caso 1 · Regla de firewall',color:'c1',
  msg:'La app declara qué conexión necesita. Seguridad la aprueba en el ITSM y Ansible crea la regla en el FortiGate; la prueba en vivo pasa de fallar a responder.',
  steps:[
   {x:'Agrega en plataforma.yml: usuarios → app, tcp/8080',p:[[180,100],[180,220]]},
   {x:'El pipeline lanza "Red · Solicitar acceso" en AAP',p:[[180,280],[180,340]]},
   {x:'Ansible abre la solicitud de cambio con origen, destino y puerto',p:[[260,356],[300,356],[300,116],[1000,116],[1000,100]],b:[640,116]},
   {x:'Seguridad aprueba; el ITSM avisa a AAP',p:[[1015,100],[1015,124],[312,124],[312,384],[260,384]],b:[640,124+0]},
   {x:'AAP toma la credencial del FortiGate desde Vault',p:[[100,370],[60,370],[60,610],[100,610]]},
   {x:'Crea los objetos y la política en el FortiGate',p:[...MG,[700,225],[700,420],[740,420]],b:[700,330]},
   {x:'Prueba desde pc-usuario: antes fallaba, ahora responde',p:[...MG,[1262,225],[1262,640],[1250,640]],b:[1262,450]},
   {x:'El tráfico cruza el FortiGate con la nueva regla',data:true,p:[[1170,648],[988,648],[988,538],[828,538],[828,420],[812,420],[812,538],[652,538],[652,648],[470,648]],b:[828,475]},
   {x:'Cierra la solicitud con el resultado y el enlace al job',p:[[260,346],[290,346],[290,108],[985,108],[985,100]],b:[880,108]}]},
 {id:'c2',name:'Caso 2 · Configuración como código',color:'c2',
  msg:'La configuración de switches, router y firewall vive en Git. Si alguien cambia algo a mano, EDA lo detecta, Ansible lo restaura desde Git y queda registrado.',
  steps:[
   {x:'Cambia una VLAN o un vecino BGP en el repositorio de red',p:[[180,100],[180,220]]},
   {x:'AAP respalda la configuración actual y aplica la declarada',p:[[180,280],[180,340]]},
   {x:'Ansible aplica en switches, router y FortiGate',p:[...MG,[720,225],[720,310],[740,310]],b:[720,265],more:[[...MG,[660,225],[660,610]],[...MG,[700,225],[700,530],[740,530]],[...MG,[940,225],[940,610]]]},
   {x:'El visitante entra por ssh y cambia una VLAN a mano',p:[[420,100],[420,124],[1010,124],[1010,610]],b:[1010,250]},
   {x:'El switch envía el evento del cambio a EDA',p:[[960,610],[960,590],[320,590],[320,490],[260,490]],b:[560,590]},
   {x:'EDA compara con Git y lanza la restauración',p:[[180,460],[180,400]]},
   {x:'Restaura la configuración del switch desde Git',p:[...MG,[950,225],[950,610]],b:[950,420]},
   {x:'Registra el incidente ya resuelto en el ITSM',p:[[260,356],[300,356],[300,116],[1000,116],[1000,100]],b:[640,116]}]},
];
const USED={c1:['dev','gitea','aap','snow','vault','fgt','pc','swb','core','swa','srv'],c2:['dev','visitante','gitea','aap','eda','snow','rtr','core','swa','swb','fgt']};

const NS='http://www.w3.org/2000/svg';
const svg=document.getElementById('svg');
const el=(n,a={},p)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e};
const pts=p=>p.map(q=>q.join(',')).join(' ');
const S=el('g',{},svg);
el('rect',{x:20,y:132,width:1260,height:20,class:'band'},S);
el('text',{x:32,y:146,class:'t-band'},S).textContent='Firewall GCP · solo IPs autorizadas';
el('rect',{x:20,y:160,width:1260,height:580,rx:12,class:'frame-vm'},S);
el('text',{x:32,y:765,class:'t-vm'},S).textContent='VM demo-ansible-summit · containerlab corre en el host, junto a AAP';
el('rect',{x:30,y:175,width:300,height:555,rx:8,class:'frame-sub'},S);
el('text',{x:42,y:193,class:'t-head'},S).textContent='Automatización · host';
el('rect',{x:370,y:175,width:900,height:555,rx:8,class:'frame-sub'},S);
el('text',{x:382,y:193,class:'t-head'},S).textContent='containerlab · laboratorio de red';
el('polyline',{points:pts([[260,370],[345,370],[345,225],[1262,225]]),class:'bus'},S);
el('text',{x:382,y:216,class:'t-link'},S).textContent='Red de gestión 172.20.20.0/24 · mgmt0 de cada equipo';
LINKS.forEach(l=>{el('polyline',{points:pts(l.p),class:'wire'},S);if(l.t)el('text',{x:l.lx,y:l.ly,class:'t-link'},S).textContent=l.t});

const gE=el('g',{},svg),gN=el('g',{},svg),gB=el('g',{},svg);
const defs=el('defs',{},svg);
['c1','c2'].forEach(c=>{const m=el('marker',{id:'m-'+c,viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:7,markerHeight:7,orient:'auto-start-reverse'},defs);el('path',{d:'M0 0 10 5 0 10z',style:`fill:var(--${c})`},m)});
const nodeEls={};
for(const id in N){
  const n=N[id],w=n.w||160,h=60;
  const g=el('g',{class:'node'+(n.planned?' planned':''),transform:`translate(${n.x-w/2},${n.y-h/2})`},gN);
  el('rect',{width:w,height:h,rx:7},g);
  el('use',{href:'#i-'+n.ic,x:10,y:h/2-12,width:24,height:24},g);
  el('text',{x:42,y:h/2-3,class:'lbl'},g).textContent=n.lbl;
  el('text',{x:42,y:h/2+13,class:'sub'},g).textContent=n.sub;
  nodeEls[id]=g;
}
let cur='topo';
const detail=document.getElementById('detail');
function render(){
  gE.textContent='';gB.textContent='';
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.id===cur));
  const v=VIEWS.find(x=>x.id===cur);
  for(const id in nodeEls)nodeEls[id].classList.toggle('dim',!!v.steps&&!USED[cur].includes(id));
  if(!v.steps){topo();return}
  v.steps.forEach((s,i)=>{
    const col=s.data?'data':v.color;
    [s.p,...(s.more||[])].forEach((p,j)=>{
      const a={points:pts(p),class:'edge'+(s.data?' data':''),'data-step':i,style:`stroke:var(--${col})`};
      if(!s.data)a['marker-end']=`url(#m-${v.color})`;
      const line=el('polyline',a,gE);
      if(j===0){let x,y;if(s.b){[x,y]=s.b}else{const L=line.getTotalLength(),q=line.getPointAtLength(L*.5);x=q.x;y=q.y}
        const g=el('g',{class:'badge','data-step':i},gB);el('circle',{cx:x,cy:y,r:10,style:`fill:var(--${v.color})`},g);el('text',{x,y:y+.5},g).textContent=i+1}
    });
  });
  detail.innerHTML=`<div><span class="eyebrow">Demo 4</span><h2>${v.name}</h2><p><span class="chip plan">En definición</span></p><p>${v.msg}</p><p class="note">Pasa el cursor por un paso para resaltarlo. La línea punteada gruesa es el tráfico de datos; las demás, acciones de automatización.</p></div>
  <ol class="steps">${v.steps.map((s,i)=>`<li data-i="${i}"><span class="n" style="background:var(--${v.color})">${i+1}</span><span>${s.x}</span></li>`).join('')}</ol>`;
  detail.querySelectorAll('li').forEach(li=>{li.addEventListener('mouseenter',()=>hot(+li.dataset.i));li.addEventListener('mouseleave',()=>hot(null))});
}
function hot(i){
  gE.querySelectorAll('.edge').forEach(e=>{const on=i===null||+e.dataset.step===i;e.classList.toggle('faded',!on);e.classList.toggle('hot',i!==null&&on)});
  gB.querySelectorAll('.badge').forEach(e=>e.style.opacity=(i===null||+e.dataset.step===i)?1:.25);
}
function topo(){
  detail.innerHTML=`<div class="stack"><div><span class="eyebrow">Topología</span><h2>Qué haríamos con el emulador</h2>
  <ol class="plain">
   <li>Instalar containerlab en la VM y conectar su red de gestión con AAP.</li>
   <li>Cargar las imágenes: Arista cEOS y FortiGate de evaluación (las descargas tú con tu cuenta), y FRR y Linux, que son públicas.</li>
   <li>Definir la topología en un archivo YAML guardado en Gitea, que la levanta o la destruye con un comando.</li>
   <li>Guardar en Gitea la configuración deseada de cada equipo: VLAN, BGP y políticas.</li>
   <li>Crear en AAP el inventario "Red · laboratorio", con las credenciales en Vault y las colecciones certificadas de Arista y Fortinet.</li>
   <li>Antes de cada demo, reiniciar el laboratorio en segundos para volver al estado limpio.</li>
  </ol></div>
  <p class="note">Recursos aproximados: unos 8 GB de RAM y 3 cores físicos para todo el laboratorio; la VM tiene holgura. La licencia de evaluación del FortiGate tiene límites de interfaces, políticas y rutas que hay que confirmar.</p></div>
  <div class="tbl"><h3>Equipos emulados</h3><table>
