{% extends "base.html" %}{% block titulo %}Ingresar{% endblock %}{% block cuerpo %}
<div class="card" style="max-width:380px;margin:40px auto"><h1>FaceAdmin</h1><p class="sub">Consola global de los clientes de FaceOps</p>{% if aviso %}<p class="flash error">{{ aviso }}</p>{% endif %}
<form method="post" action="{{ url_for('ingresar') }}" style="display:grid;gap:10px"><label>Usuario<input name="usuario" autocomplete="username" required autofocus></label>
<label>Clave<input name="clave" type="password" autocomplete="current-password" required></label><button class="btn">Ingresar</button></form></div>
{% endblock %}
