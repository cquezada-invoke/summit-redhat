{% extends "base.html" %}
{% block contenido %}
<h3>Ejecución #{{ j.id }}: {{ j.name.split('·', 1)[-1] | trim }}</h3>
<p>Ver en AAP: <a href="{{ en_aap('wj', j.id) }}" target="_blank">workflow job #{{ j.id }}</a></p>
<p id="meta">Cargando…</p>
<div id="pasos"></div>
{% endblock %}
{% block js %}
<script>
const JID = {{ j.id }}; const AAP = {{ en_aap('aprobs', 0).split('/execution')[0] | tojson }};
function resultado(r) {
  if (!r) return '';
  return `<p><b>${esc(r.titulo)}</b> (${esc(r.estado)})</p>` + ((r.filas || []).length ? '<table>' + (r.columnas ? '<tr>' + r.columnas.map(c => `<th>${esc(c)}</th>`).join('') + '</tr>' : '') +
    r.filas.map(f => '<tr>' + f.map(c => `<td>${esc(c)}</td>`).join('') + '</tr>').join('') + '</table>' : '');
}
async function decidir(id, accion, b) { b.disabled = true; await post(`/api/aprobacion/${id}/${accion}`); setTimeout(cargar, 800); }
async function cargar() {
  const r = await fetch(`/api/ejecucion/${JID}`); if (r.status === 401) { location.href = '/ingresar'; return; }
  const d = await r.json(); if (d.error) { document.getElementById('meta').textContent = d.error; return; }
  document.getElementById('meta').textContent = `Estado: ${d.estado} · lanzado por ${d.lanzado_por} · ${d.duracion} s`;
  document.getElementById('pasos').innerHTML = d.pasos.map((p, i) => {
    let h = `<h4>${i + 1}. ${p.aprobacion ? 'Aprobación' : esc(p.nombre.replace(/^Portal · /, '').replace(/ \(plantilla\)$/, ''))} — ${esc(p.estado)}${p.duracion ? ' (' + p.duracion + ' s)' : ''}</h4>`;
    if (p.aprobacion) h += `<p><a href="${AAP}/execution/administration/workflow-approvals/${p.aprobacion}/details" target="_blank">aprobación en AAP</a></p>`;
    if (p.job) h += `<p><a href="${AAP}/execution/jobs/playbook/${p.job}/output" target="_blank">salida completa del job #${p.job} en AAP</a></p>`;
    if (p.aprobacion && p.estado === 'pending') h += `<p><button onclick="decidir(${p.aprobacion}, 'approve', this)">Aprobar</button> <button onclick="decidir(${p.aprobacion}, 'deny', this)">Rechazar</button></p>`;
    else if (p.aprobacion) h += `<p>${p.estado === 'successful' ? 'Aprobado' : 'Rechazado'}${p.aprobado_por ? ' por ' + esc(p.aprobado_por) : ''}</p>`;
    if (p.tareas) h += '<ul>' + p.tareas.map(t => `<li>${esc(t.estado)} — ${esc(t.tarea)} ${t.host ? '(' + esc(t.host) + ')' : ''}${t.msg ? '<br><span style="color:red">' + esc(t.msg) + '</span>' : ''}</li>`).join('') + '</ul>' + resultado(p.resultado);
    return h; }).join('');
  if (!['successful', 'failed', 'canceled', 'error'].includes(d.estado)) setTimeout(cargar, 2500);
}
cargar();
</script>
{% endblock %}
