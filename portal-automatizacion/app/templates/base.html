<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block titulo %}Automatizaciones{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='portal.css') }}"><meta name="csrf" content="{{ csrf }}"></head>
<body>
{% if u %}<p><a href="{{ url_for('inicio') }}">Automatizaciones</a> | <a href="{{ url_for('inventario') }}">Servidores</a> | <a href="{{ url_for('historial') }}">Ejecuciones</a> | <a href="{{ url_for('integracion') }}">Integración</a> |
{% if tenant %}Organización de AAP: <b>{{ tenant }}</b> | {% endif %}{{ u.usuario }} <form method="post" action="{{ url_for('salir') }}" style="display:inline"><input type="hidden" name="csrf" value="{{ csrf }}"><button>Salir</button></form></p><hr>{% endif %}
{% block contenido %}{% endblock %}
<script>
const CSRF = document.querySelector('meta[name=csrf]').content;
async function post(url, datos) {
  const r = await fetch(url, {method: 'POST', headers: {'X-CSRF': CSRF, 'Content-Type': 'application/json'}, body: JSON.stringify(datos || {})});
  if (r.status === 401) { location.href = '/ingresar'; return; }
  return r.json();
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const chip = e => esc(e);
</script>
{% block js %}{% endblock %}
</body></html>
