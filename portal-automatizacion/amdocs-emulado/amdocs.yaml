        - name: servicio
          image: image-registry.openshift-image-registry.svc:5000/amdocs-bss/amdocs-emulado:latest
          env: [{name: ROL, value: catalog}, {name: VERSION, value: "2.3.0"}, {name: FALLA, value: "no"}]
