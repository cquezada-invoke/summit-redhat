# Amdocs (emulado) → Event-Driven Ansible: cada orden de servicio nueva lanza el workflow de activación (con su aprobación).
- name: Amdocs · Órdenes de servicio
  hosts: all
  sources:
    - ansible.eda.webhook:
        host: 0.0.0.0
        port: 5011
  rules:
    - name: Orden nueva de Amdocs
      condition: event.payload.tipo == "orden" and event.payload.evento == "creada"
      action:
        run_workflow_template:
          name: "Portal · Amdocs · Activar orden de servicio"
          organization: "Portal de automatización"
          job_args:
            extra_vars:
              orden_id: "{{ event.payload.orden.id }}"
