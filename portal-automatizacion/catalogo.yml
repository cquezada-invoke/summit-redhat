# Catálogo del portal: cada entrada es un workflow «Portal · <nombre>» en AAP = aprobación → plantilla(s).
# seccion: infra | ocp | telco | amdocs (etiqueta portal-<seccion>) · playbook: del proyecto del portal · red: true usa el
# proyecto e inventario de la red del laboratorio · existente: usa una plantilla que ya existe en AAP · oculto: solo plantilla,
# sin workflow en el portal · base: toma el inventario y las credenciales de máquina de esa plantilla (servidores).
# La encuesta es lo que el portal muestra como parámetros (pregunta, ayuda, tipo, opciones, por defecto).
- nombre: "OpenShift · Salud del clúster"
  oculto: true   # bajo valor frente a OpenShift/ACM: queda como plantilla (la usan otros flujos) pero no en el portal
  seccion: ocp
  playbook: playbooks/ocp-salud.yml
  descripcion: "Monitoreo en un clic: nodos, operadores del clúster, versión, alertas activas de Alertmanager y pods con problemas, con un semáforo. Solo lectura."
  encuesta:
    - {question_name: "Severidad mínima de alertas", variable: severidad_minima, type: multiplechoice, choices: [warning, critical], default: warning, required: true,
       question_description: "warning muestra también las advertencias; critical solo lo urgente."}
    - {question_name: "Incluir pods con problemas", variable: incluir_pods, type: multiplechoice, choices: [si, "no"], default: si, required: true}
- nombre: "OpenShift · Certificados"
  oculto: true   # bajo valor frente a OpenShift/ACM: queda como plantilla (la usan otros flujos) pero no en el portal
  seccion: ocp
  playbook: playbooks/ocp-certificados.yml
  descripcion: "Inventario de vencimientos de todos los certificados TLS del clúster, del Ingress y de la API, y solicitudes de firma (CSR) pendientes. Puede aprobar las CSR de nodos."
  encuesta:
    - {question_name: "Avisar si vence en (días)", variable: dias_alerta, type: integer, min: 1, max: 365, default: 30, required: true}
    - {question_name: "Aprobar CSR pendientes de nodos", variable: aprobar_csr, type: multiplechoice, choices: ["no", si], default: "no", required: true,
       question_description: "Solo las de nodos (system:node y node-bootstrapper). Las demás se informan."}
- nombre: "OpenShift · Regularizar línea base"
  oculto: true   # bajo valor frente a OpenShift/ACM: queda como plantilla (la usan otros flujos) pero no en el portal
  seccion: ocp
  playbook: playbooks/ocp-regularizar.yml
  descripcion: "Revisa los namespaces de aplicaciones contra la línea base (LimitRange, cuotas, NetworkPolicy, requests/limits, sondas, imágenes sin versión, privilegios, réplicas en producción). En modo corregir aplica lo que es seguro sin cortar servicio."
  encuesta:
    - {question_name: "Modo", variable: modo, type: multiplechoice, choices: [revisar, corregir], default: revisar, required: true,
       question_description: "corregir aplica LimitRange y NetworkPolicy base donde faltan; lo demás lo corrige el dueño de la aplicación."}
    - {question_name: "Namespaces", variable: namespaces, type: text, default: "", required: false, max: 400,
       question_description: "Separados por coma. Vacío: todos los de aplicaciones."}
- nombre: "OpenShift · Optimizar recursos y limpiar"
  seccion: ocp
  playbook: playbooks/ocp-optimizar.yml
  descripcion: "Compara lo reservado con el uso real para encontrar capacidad ociosa, aplicaciones subdimensionadas y Deployments sin uso; sugiere requests y limpia pods y builds terminados."
  encuesta:
    - {question_name: "Modo", variable: modo, type: multiplechoice, choices: [revisar, corregir], default: revisar, required: true,
       question_description: "corregir borra pods y builds terminados antiguos. Los ajustes de requests se sugieren, no se aplican."}
    - {question_name: "Umbral de uso bajo (%)", variable: umbral_ocioso, type: integer, min: 1, max: 90, default: 20, required: true}
    - {question_name: "Antigüedad para limpiar (días)", variable: dias_antiguedad, type: integer, min: 1, max: 365, default: 7, required: true}
- nombre: "OpenShift · Actualizaciones y operadores"
  oculto: true   # bajo valor frente a OpenShift/ACM: queda como plantilla (la usan otros flujos) pero no en el portal
  seccion: ocp
  playbook: playbooks/ocp-actualizaciones.yml
  descripcion: "Versión y canal, actualizaciones disponibles y condicionadas, estado de cada operador y aprobación de InstallPlans pendientes de los operadores que se indiquen."
  encuesta:
    - {question_name: "Aprobar InstallPlans pendientes", variable: aprobar_operadores, type: multiplechoice, choices: ["no", si], default: "no", required: true}
    - {question_name: "Operadores a aprobar", variable: operadores, type: text, default: "", required: false, max: 300,
       question_description: "Nombres de suscripción separados por coma (p. ej. rhacs-operator)."}
- nombre: "OpenShift · Respaldo de etcd"
  seccion: ocp
  playbook: playbooks/ocp-etcd-respaldo.yml
  descripcion: "Respaldo oficial de etcd (cluster-backup.sh) en un nodo de control, con verificación previa de que etcd está sano y rotación de los últimos respaldos."
  encuesta:
    - {question_name: "Respaldos a conservar", variable: conservar, type: integer, min: 1, max: 15, default: 3, required: true}
- nombre: "OpenShift · Alta de proyecto"
  seccion: ocp
  playbook: playbooks/ocp-onboarding-proyecto.yml
  descripcion: "Crea el namespace de un equipo con su línea base completa: cuota, LimitRange, permisos del grupo, NetworkPolicy y etiquetas de ambiente y responsable. También lo retira."
  encuesta:
    - {question_name: "Proyecto", variable: proyecto, type: text, default: demo-pagos, required: true, min: 3, max: 42}
    - {question_name: "Grupo del equipo", variable: equipo, type: text, default: equipo-pagos, required: false, max: 60}
    - {question_name: "Ambiente", variable: ambiente, type: multiplechoice, choices: [desarrollo, qa, produccion], default: desarrollo, required: true}
    - {question_name: "Cuota de CPU (cores)", variable: cpu, type: integer, min: 1, max: 64, default: 2, required: true}
    - {question_name: "Cuota de memoria (GiB)", variable: memoria_gi, type: integer, min: 1, max: 256, default: 4, required: true}
    - {question_name: "Acción", variable: accion, type: multiplechoice, choices: [crear, eliminar], default: crear, required: true}
- nombre: "Telco · Validar clúster para CNF"
  oculto: true   # bajo valor frente a OpenShift/ACM: queda como plantilla (la usan otros flujos) pero no en el portal
  seccion: telco
  playbook: playbooks/telco-validar-cnf.yml
  descripcion: "Compara lo que pide la función de red de Nabstract (CPU aisladas, páginas grandes, kernel de tiempo real, NUMA, SR-IOV, MetalLB, PTP, SCTP) con lo que tiene el clúster de cargas y entrega el informe de brechas."
  encuesta:
    - {question_name: "Perfil de la CNF", variable: cnf_perfil, type: multiplechoice, choices: [upf, amf, smf, personalizado], default: upf, required: true,
       question_description: "UPF es plano de usuario (más exigente: SR-IOV, tiempo real, PTP). AMF/SMF son plano de control."}
    - {question_name: "Páginas grandes 1Gi (solo personalizado)", variable: hugepages_gi, type: integer, min: 0, max: 64, default: 8, required: false}
    - {question_name: "CPU aisladas (solo personalizado)", variable: cpus_aisladas, type: integer, min: 0, max: 128, default: 8, required: false}
    - {question_name: "Nodo", variable: nodo, type: text, default: "", required: false, max: 60, question_description: "Vacío: el primer nodo de cargas."}
- nombre: "Telco · Onboarding de CNF"
  seccion: telco
  playbook: playbooks/telco-onboarding-cnf.yml
  descripcion: "Prepara el clúster para recibir la CNF del proveedor: namespace, cuota con páginas grandes, red secundaria de la VLAN del servicio, dirección pública con MetalLB, permisos del proveedor y NetworkPolicy. También la retira."
  encuesta:
    - {question_name: "Nombre de la CNF", variable: cnf_nombre, type: text, default: upf-demo, required: true, min: 2, max: 31}
    - {question_name: "Proveedor", variable: proveedor, type: text, default: nabstract, required: true, max: 30}
    - {question_name: "VLAN del servicio", variable: vlan_id, type: integer, min: 2, max: 4094, default: 320, required: true}
    - {question_name: "Prefijo del servicio", variable: svc_prefijo, type: text, default: 10.60.20.0/24, required: true, max: 18}
    - {question_name: "IP pública (MetalLB)", variable: ip_publica, type: text, default: "", required: false, max: 15}
    - {question_name: "Páginas grandes 1Gi (cuota)", variable: hugepages_gi, type: integer, min: 0, max: 64, default: 4, required: true}
    - {question_name: "Acción", variable: accion, type: multiplechoice, choices: [crear, retirar], default: crear, required: true}
- nombre: "Telco · Red del servicio (VLAN y BGP)"
  seccion: telco
  red: true
  playbook: playbooks/telco-red-servicio.yml
  descripcion: "Red como código: crea la VLAN del servicio en el firewall y anuncia su prefijo por BGP desde el router, declarado en Git. Toma una foto antes, prueba después y, si la prueba falla, vuelve atrás solo (router, firewall y Git)."
  encuesta:
    - {question_name: "Acción", variable: svc_accion, type: multiplechoice, choices: [activar, retirar], default: activar, required: true}
    - {question_name: "Nombre del servicio", variable: svc_nombre, type: text, default: upf-demo, required: true, max: 31}
    - {question_name: "VLAN", variable: vlan_id, type: integer, min: 2, max: 4094, default: 320, required: true}
    - {question_name: "Prefijo", variable: svc_prefijo, type: text, default: 10.60.20.0/24, required: true, max: 18,
       question_description: "Red 10.x.x.x de /24 a /29, escrita como red (termina en .0 para /24)."}
    - {question_name: "Simular falla en la prueba", variable: simular_falla, type: multiplechoice, choices: ["no", si], default: "no", required: true,
       question_description: "si fuerza la falla de la prueba posterior para mostrar la vuelta atrás automática."}
- nombre: "Telco · Día 2 del clúster de cargas"
  seccion: telco
  pasos: ["OpenShift · Salud del clúster", "OpenShift · Certificados", "OpenShift · Respaldo de etcd"]
  descripcion: "Rutina diaria del clúster de cargas en un solo flujo: salud y alertas, vencimiento de certificados y respaldo de etcd. Se puede programar en AAP para que corra sola."
  encuesta: []
- nombre: "Amdocs · Activar orden de servicio"
  seccion: amdocs
  orden: true
  descripcion: "La orden de servicio llega desde Amdocs a Event-Driven Ansible. Ansible la valida, pide aprobación, crea la red del servicio (VLAN y BGP), prepara la CNF en OpenShift y devuelve el estado a Amdocs. Si algo falla, vuelve atrás y marca la orden fallida."
  encuesta:
    - {question_name: "Orden de Amdocs", variable: orden_id, type: text, default: "ORD-00000001", required: true, min: 12, max: 12,
       question_description: "ORD-XXXXXXXX. Normalmente la lanza EDA sola cuando Amdocs crea la orden; también se puede lanzar a mano."}
- nombre: "Amdocs · Salud de la plataforma BSS"
  oculto: true   # bajo valor frente a OpenShift/ACM: queda como plantilla (la usan otros flujos) pero no en el portal
  seccion: amdocs
  playbook: playbooks/amdocs-salud.yml
  descripcion: "Por cada microservicio de Amdocs en OpenShift: pods listos, reinicios, versión desplegada y tiempo de respuesta, más las órdenes pendientes. Semáforo contra el umbral de respuesta."
  encuesta:
    - {question_name: "Umbral de respuesta (ms)", variable: umbral_ms, type: integer, min: 10, max: 5000, default: 200, required: true}
- nombre: "Amdocs · Desplegar release"
  seccion: amdocs
  playbook: playbooks/amdocs-release.yml
  descripcion: "Actualiza un microservicio de Amdocs con pre-chequeos, despliegue gradual sin corte y prueba posterior. Si la versión nueva no queda sana, vuelve sola a la anterior."
  encuesta:
    - {question_name: "Microservicio", variable: servicio, type: multiplechoice, choices: [catalog, customer, ordering], default: catalog, required: true}
    - {question_name: "Versión", variable: version, type: text, default: 2.4.0, required: true, max: 12}
    - {question_name: "Simular falla de la versión nueva", variable: simular_falla, type: multiplechoice, choices: ["no", si], default: "no", required: true,
       question_description: "si hace que la versión nueva no pase su sonda de salud, para mostrar la vuelta atrás automática."}
- nombre: "Infraestructura · Revisar CVE de servidores"
  seccion: infra
  existente: "Seguridad · Revisar CVEs"
  limite: true
  descripcion: "Por servidor, los CVE ya corregidos por los parches instalados y los pendientes (hay parche y no está instalado), con severidad y paquete. Usa las erratas de Red Hat. Solo lectura."
  encuesta: []
- nombre: "Infraestructura · Escaneo de seguridad"
  seccion: infra
  existente: "Seguridad · Escaneo de servidores"
  limite: true
  descripcion: "Revisa en cada servidor Linux los puntos de vulnerabilidad más comunes: parches, SSH, puertos expuestos, SELinux, firewall, cuentas, sudo, permisos, servicios inseguros, suscripción, reinicio pendiente y fin de vida. Solo lectura."
  encuesta: []
- nombre: "Infraestructura · Aplicar parches de seguridad"
  seccion: infra
  existente: "Seguridad · Aplicar parches de seguridad"
  limite: true
  descripcion: "Instala las erratas de seguridad pendientes (todas o las de los CVE indicados) y dice si el servidor necesita reiniciar. No reinicia solo."
  encuesta:
    - {question_name: "CVE a corregir", variable: cves, type: text, default: "", required: false, max: 600,
       question_description: "Separados por coma (CVE-2026-1234,…). Vacío: todas las erratas de seguridad pendientes."}
- nombre: "Infraestructura · Inventariar servidor"
  seccion: infra
  existente: "Sistema · Inventariar máquina"
  limite: true
  descripcion: "Trae toda la información del servidor (sistema, CPU, memoria, discos, red, servicios, registro, parches y paquetes) y guarda una instantánea de su configuración en Git para poder recuperarlo."
  encuesta: []
- nombre: "Infraestructura · Inventario de certificados"
  seccion: infra
  existente: "Certificados · Inventario"
  limite: true
  descripcion: "Cruza los certificados en uso en cada servidor (y el que entrega su puerto TLS) con los emitidos por la CA interna y avisa los que vencen pronto."
  encuesta:
    - {question_name: "Avisar si vence en (días)", variable: cert_dias, type: integer, min: 1, max: 365, default: 30, required: true}
- nombre: "Infraestructura · Encender o apagar servidor"
  seccion: infra
  existente: "Infra · Encender o apagar equipo"
  descripcion: "Cambia el estado de energía de una máquina virtual del data center. Apagar es ordenado (como el botón de encendido): el sistema cierra sus servicios."
  encuesta:
    - {question_name: "Servidor (nombre de la VM)", variable: en_equipo, type: text, default: "", required: true, min: 2, max: 60}
    - {question_name: "Acción", variable: en_accion, type: multiplechoice, choices: [encender, apagar, reiniciar], default: encender, required: true}

# --- Automatizaciones de alto valor (lo que OpenShift y ACM no hacen solos) ---------------------------------------------
- nombre: "OpenShift · Actualización guiada con ACM"
  seccion: ocp
  playbook: playbooks/ocp-actualizacion-guiada.yml
  descripcion: "Lo que rodea a una actualización y ACM no hace: antes, valida que el clúster esté sano, respalda etcd, guarda una foto de la configuración y saca el clúster del balanceador externo; después, verifica operadores y las rutas críticas de las aplicaciones y lo devuelve al balanceador, o lo deja fuera y avisa si algo falló. Se conecta como hook de ACM (ClusterCurator)."
  encuesta:
    - {question_name: "Fase", variable: fase, type: multiplechoice, choices: [pre, post], default: pre, required: true,
       question_description: "pre: antes de actualizar · post: después de actualizar."}
    - {question_name: "Versión destino", variable: version_destino, type: text, default: "4.19.55", required: false, max: 12}
    - {question_name: "Rutas críticas a probar", variable: rutas_criticas, type: textarea, default: "https://amdocs-ordering.sno.34.176.42.56.sslip.io/health", required: false, max: 1000,
       question_description: "URLs separadas por coma (solo en fase post)."}
- nombre: "OpenShift · De alerta a incidente"
  seccion: ocp
  playbook: playbooks/ocp-alerta-incidente.yml
  descripcion: "Cuando suena una alerta, Ansible junta la evidencia (estado de los pods, eventos y logs), aplica la remediación segura si la causa es conocida y abre el incidente en ServiceNow con todo adjunto; si se resolvió, lo deja resuelto. La lanza Event-Driven Ansible desde Alertmanager, sin que nadie entre a la consola."
  encuesta:
    - {question_name: "Namespace", variable: namespace, type: text, default: "amdocs-bss", required: true, max: 63}
    - {question_name: "Alerta", variable: alerta, type: text, default: "KubePodCrashLooping", required: true, max: 100}
    - {question_name: "Remediar si la causa es conocida", variable: remediar, type: multiplechoice, choices: [si, "no"], default: si, required: true}
- nombre: "OpenShift · Certificado de aplicación de punta a punta"
  seccion: ocp
  playbook: playbooks/ocp-certificado-app.yml
  descripcion: "Renovar un certificado no termina en OpenShift: revisa el certificado que se ve desde fuera, emite uno nuevo con la CA si vence pronto, lo carga en la Route y en el balanceador externo que publica la aplicación, y verifica que la cadena nueva sea la que ve el cliente."
  encuesta:
    - {question_name: "Namespace", variable: namespace, type: text, default: "amdocs-bss", required: true, max: 63}
    - {question_name: "Route", variable: ruta, type: text, default: "ordering", required: true, max: 63}
    - {question_name: "Renovar si vence en menos de (días)", variable: umbral_dias, type: integer, min: 1, max: 365, default: 30, required: true}
    - {question_name: "Forzar renovación", variable: forzar, type: multiplechoice, choices: ["no", si], default: "no", required: true}
- nombre: "OpenShift · Acceso de equipo"
  seccion: ocp
  playbook: playbooks/ocp-acceso-equipo.yml
  descripcion: "Un equipo nuevo queda con todo lo que necesita en un solo paso: grupo en OpenShift, rol en sus namespaces, equipo en Git con sus repositorios y política de secretos en Vault. Con baja se le quita todo lo mismo, sin accesos huérfanos."
  encuesta:
    - {question_name: "Equipo", variable: equipo, type: text, default: "equipo-demo", required: true, min: 3, max: 40}
    - {question_name: "Miembros", variable: miembros, type: textarea, default: "demo1,demo2", required: false, max: 1000, question_description: "Usuarios separados por coma."}
    - {question_name: "Namespaces", variable: namespaces, type: text, default: "amdocs-bss", required: true, max: 500, question_description: "Separados por coma."}
    - {question_name: "Rol", variable: rol, type: multiplechoice, choices: [view, edit, admin], default: edit, required: true}
    - {question_name: "Acción", variable: accion, type: multiplechoice, choices: [alta, baja], default: alta, required: true}
- nombre: "OpenShift · Informe de seguridad del clúster"
  seccion: ocp
  playbook: playbooks/ocp-informe-seguridad.yml
  descripcion: "Informe en PDF por correo con lo que la consola no junta en un solo lugar: quién tiene cluster-admin, kubeadmin activo, SCC privilegiadas, contenedores privilegiados o como root, imágenes sin versión, namespaces sin NetworkPolicy, rutas sin TLS, secretos sin rotar y certificados por vencer. Semáforo por severidad, qué hacer y resumen ejecutivo escrito por Claude."
  encuesta:
    - {question_name: "Enviar el informe a", variable: correo, type: text, default: "cquezada@invoke.cl", required: true, min: 6, max: 120,
       question_description: "Correo que recibe el PDF con los hallazgos, el semáforo y el resumen ejecutivo."}
    - {question_name: "Secretos sin rotar desde (días)", variable: dias_secretos, type: integer, min: 30, max: 720, default: 180, required: true}
- nombre: "Amdocs · Informe de operación y conciliación"
  seccion: amdocs
  playbook: playbooks/amdocs-informe-operacion.yml
  descripcion: "Informe en PDF por correo que cruza lo que Amdocs cree activo con lo que existe en OpenShift: servicios cobrados sin su CNF, CNF huérfanas que se pagan y no se cobran, órdenes atascadas o fallidas y la salud de los microservicios del BSS. Con resumen ejecutivo escrito por Claude."
  encuesta:
    - {question_name: "Enviar el informe a", variable: correo, type: text, default: "cquezada@invoke.cl", required: true, min: 6, max: 120,
       question_description: "Correo que recibe el PDF con los hallazgos, el semáforo y el resumen ejecutivo."}
    - {question_name: "Orden atascada después de (minutos)", variable: minutos_atasco, type: integer, min: 5, max: 1440, default: 60, required: true}
- nombre: "Linux · Informe de seguridad"
  seccion: linux
  playbook: playbooks/linux-informe-seguridad.yml
  base: "Seguridad · Revisar CVEs"
  credencial: "Nodos demo (ansible)"
  limite: true
  descripcion: "Informe en PDF por correo de los servidores Linux elegidos: parches de seguridad pendientes y críticos, reinicio pendiente, SELinux, SSH (root y contraseñas), cuentas con UID 0 y sudo sin contraseña, firewall, puertos expuestos, intentos de acceso fallidos y servicios inseguros. Semáforo, qué hacer y resumen ejecutivo escrito por Claude."
  encuesta:
    - {question_name: "Enviar el informe a", variable: correo, type: text, default: "cquezada@invoke.cl", required: true, min: 6, max: 120,
       question_description: "Correo que recibe el PDF con los hallazgos, el semáforo y el resumen ejecutivo."}
- nombre: "Windows · Informe de seguridad"
  seccion: windows
  playbook: playbooks/windows-informe-seguridad.yml
  base: "Seguridad · Revisar CVEs"
  credencial: "Windows · ansible (WinRM)"
  limite: true
  descripcion: "Informe en PDF por correo de los servidores Windows elegidos: actualizaciones pendientes y críticas, días sin actualizar, versión fuera de soporte, administradores locales, firewall, Defender, BitLocker, SMBv1, RDP sin NLA, cuenta Guest y política de contraseñas. Semáforo, qué hacer y resumen ejecutivo escrito por Claude."
  encuesta:
    - {question_name: "Enviar el informe a", variable: correo, type: text, default: "cquezada@invoke.cl", required: true, min: 6, max: 120,
       question_description: "Correo que recibe el PDF con los hallazgos, el semáforo y el resumen ejecutivo."}
- nombre: "Linux · Liberar espacio en disco"
  seccion: linux
  playbook: playbooks/linux-liberar-disco.yml
  base: "Seguridad · Revisar CVEs"
  credencial: "Nodos demo (ansible)"
  limite: true
  descripcion: "Remediación de «disco casi lleno»: la lanza Grafana sola (alerta → Event-Driven Ansible → aprobación) o un ticket de Odoo. Solo limpiezas seguras (journal, caché de dnf, logs rotados, temporales antiguos y kernels viejos) y deja constancia de cuánto liberó."
  encuesta:
    - {question_name: "Limpiar si el uso supera (%)", variable: umbral, type: integer, min: 50, max: 99, default: 85, required: true}
    - {question_name: "Forzar limpieza", variable: forzar, type: multiplechoice, choices: ["no", si], default: "no", required: true}
- nombre: "Infra · Atender ticket de Odoo"
  seccion: linux
  playbook: playbooks/infra-ticket-odoo.yml
  base: "Seguridad · Revisar CVEs"
  credencial: ["Nodos demo (ansible)", "Odoo · Helpdesk Claro PR"]
  limite: true
  descripcion: "Un ticket de Odoo Helpdesk con la etiqueta «Claro PR» llega a Event-Driven Ansible y se atiende solo, con aprobación en AAP: liberar disco, reiniciar un servicio o diagnosticar el servidor. Al terminar, el ticket recibe la nota con el resultado y pasa a Resuelto."
  encuesta:
    - {question_name: "Ticket de Odoo", variable: ticket, type: integer, min: 1, max: 99999999, default: 1, required: true}
