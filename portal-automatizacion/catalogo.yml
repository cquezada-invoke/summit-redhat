- nombre: "Linux · Liberar espacio en disco"
  seccion: linux
  playbook: playbooks/linux-liberar-disco.yml
  base: "Seguridad · Revisar CVEs"
  credencial: "Nodos demo (ansible)"
  limite: true
  descripcion: |-
    Tipo: Hace cambios · pide aprobación en AAP · te llega un PDF al correo con lo que se hizo
    Para qué: que un disco lleno no tumbe un servicio de madrugada.
    Qué hace: si el disco supera el umbral, hace solo limpiezas seguras (logs del sistema, caché de paquetes, logs antiguos, temporales viejos y kernels antiguos).
    Qué obtienes: el uso del disco antes y después. Normalmente la lanza Grafana sola con la alerta «disco casi lleno».
  encuesta:
    - {question_name: "Limpiar si el uso supera (%)", variable: umbral, type: integer, min: 50, max: 99, default: 85, required: true}
    - {question_name: "Forzar limpieza", variable: forzar, type: multiplechoice, choices: ["no", si], default: "no", required: true}
- nombre: "Infra · Atender ticket de Odoo"
  seccion: linux
  playbook: playbooks/infra-ticket-odoo.yml
  base: "Seguridad · Revisar CVEs"
  credencial: ["Nodos demo (ansible)", "Odoo · Helpdesk Claro PR"]
  limite: true
  descripcion: |-
    Tipo: Hace cambios · pide aprobación en AAP · te llega un PDF al correo con lo que se hizo
    Para qué: que los tickets de infraestructura de la mesa de ayuda se atiendan solos.
    Qué hace: cuando entra un ticket en Odoo con la etiqueta «Claro PR» (ej. «disco lleno en nodo-jboss»), entiende qué se pide, pide aprobación y lo ejecuta: liberar disco, reiniciar un servicio o diagnosticar el servidor.
    Qué obtienes: el ticket de Odoo con la nota del resultado y en estado Resuelto.
  encuesta:
    - {question_name: "Ticket de Odoo", variable: ticket, type: integer, min: 1, max: 99999999, default: 1, required: true}
    - {question_name: "Acción", variable: accion, type: multiplechoice, choices: [diagnostico, liberar_disco, reiniciar_servicio], default: diagnostico, required: true}
    - {question_name: "Servicio (si reinicia)", variable: servicio, type: text, default: "nginx", required: false, max: 80}
