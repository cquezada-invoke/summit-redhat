---
# Último paso de cada workflow del portal que hace cambios: lee en AAP lo que pasó en esta ejecución (quién la pidió,
# quién la aprobó, cada paso con su resultado, qué cambió en cada servidor y los mensajes finales) y lo envía al portal,
# que arma el PDF «qué se hizo» con un resumen escrito por Claude y lo manda por correo.
# Credencial: «AAP · informe de ejecución» (tipo Red Hat Ansible Automation Platform, solo lectura de la API).
- name: Informe de ejecución (PDF por correo con lo que se hizo)
  hosts: localhost
  gather_facts: false
  vars:
    portal: "{{ portal_informes | default('http://192.168.122.1:8120/api/informe') }}"
    destino: "{{ correo | default('cquezada@invoke.cl') }}"
    wf_id: "{{ awx_workflow_job_id | default(tower_workflow_job_id | default('')) }}"
  tasks:
    - name: Armar y enviar el informe de la ejecución {{ wf_id }}
      ansible.builtin.script:
        cmd: "files/informe_ejecucion.py {{ wf_id | quote }} {{ portal | quote }} {{ destino | quote }}"
        executable: python3
      register: envio
      changed_when: false

    - name: Resultado
      ansible.builtin.debug:
        msg: "{{ envio.stdout | default('') }}"
